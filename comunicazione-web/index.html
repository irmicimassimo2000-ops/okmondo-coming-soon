<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Comunicazione e web — in costruzione</title>
<style>
@font-face{font-family:"Geist";src:url("../assets/geist-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("../assets/geist-mono-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{color-scheme:light;--bg:#fff;--t:#0a0a0a;--g:#6b6b6b;--ln:#d9d9d9;--pad:clamp(16px,4vw,56px)}
body{background:var(--bg) linear-gradient(var(--ln) 1px,transparent 1px) 0 0/100% 48px;color:var(--t);font:400 17px/1.5 "Geist",system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;text-align:center}
:focus-visible{outline:2px solid var(--t);outline-offset:3px}
.mono{font-family:"Geist Mono",monospace;font-size:14px}
header{padding:40px var(--pad) 0;display:flex;flex-direction:column;align-items:center;gap:8px}
header .mono{color:var(--g)}
main{max-width:640px;margin:0 auto;padding:72px var(--pad) 96px}
h1{font-weight:800;letter-spacing:-.045em;line-height:1;font-size:clamp(36px,6vw,72px);background:var(--bg)}
.tag{display:inline-block;margin-top:24px;padding:4px 12px;border-radius:999px;background:var(--t);color:var(--bg)}
ul{list-style:none;padding:0;margin:48px 0 0;display:flex;flex-direction:column;gap:0;text-align:left}
li{background:var(--bg);padding:14px 0;border-top:1px solid var(--t);font-size:22px;font-weight:600;letter-spacing:-.02em;display:flex;justify-content:space-between}
li span{color:var(--g);font-weight:400}
.back{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--t);margin-top:48px;font-weight:600;background:var(--bg)}
</style></head><body>
<header><span class="mono">OK.mondo</span><span class="mono">Comunicazione e web</span></header>
<main>
 <h1>Brand, grafica, social, web e stampa</h1>
 <span class="tag mono">In costruzione</span>
 <ul><li>Brand e identità</li><li>Grafica e stampa</li><li>Social</li><li>Siti e web</li></ul>
 <a class="back" href="../">Torna a OK.mondo</a>
</main><footer class="mono" style="padding:0 var(--pad) 32px;color:var(--g)">OK.mondo</footer></body></html>
