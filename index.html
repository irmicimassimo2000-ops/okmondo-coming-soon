<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OK</title>
  <meta name="description" content="L'universo OK. Presto qui." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EDEDE6" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:title" content="OK" />

  <meta property="og:type" content="website" />

  <style>
    :root { --rosso:#E20612; --beige:#EDEDE6; --nero:#1A1A1A; --muto:#6b6b66; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
      background:var(--beige); color:var(--nero);
      display:grid; place-items:center; min-height:100svh; text-align:center;
      padding:24px; -webkit-font-smoothing:antialiased;
    }
    .wrap { display:flex; flex-direction:column; align-items:center; gap:26px;
      animation:rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .mark {
      width:116px; height:116px; display:block;
      filter:drop-shadow(0 18px 44px rgba(226,6,18,.45));
    }
    h1 { font-size:clamp(28px,6vw,46px); font-weight:800; letter-spacing:-1.5px; line-height:1.04; }
    p { font-size:clamp(15px,3.5vw,18px); color:var(--muto); max-width:32ch; line-height:1.5; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:var(--rosso); margin-right:9px; vertical-align:middle;
      animation:pulse 1.6s ease-in-out infinite; }
    .foot { position:fixed; bottom:max(22px, env(safe-area-inset-bottom));
      left:0; right:0; font-size:12px; color:#9a9a94; letter-spacing:.4px; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.78); } }
    @media (prefers-reduced-motion:reduce) { .wrap,.dot { animation:none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Marchio OK reale (ometto: O = testa+sorriso, K = corpo) -->
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="OK">

    <h1>Stiamo arrivando.</h1>
    <p><span class="dot"></span>L'universo OK, presto qui.</p>
  </main>
  <div class="foot">okmondo.com</div>
</body>
</html>
