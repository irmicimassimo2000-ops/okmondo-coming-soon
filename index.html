<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://okmondo.com/">
<title>OK.mondo</title>
<meta name="description" content="Tu chiedi. OK risponde. Scrivi cosa ti serve e ti portiamo al servizio giusto.">
<style>
@font-face{font-family:"Geist";src:url("assets/geist-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("assets/geist-mono-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--w:#fff;--n:#0A0A0A;--r:#E20612;--g:#8A8A8A;--g2:#595959;--line:#E8E8E8;--pad:clamp(16px,4vw,48px);color-scheme:light}
body{background:var(--w);color:var(--n);font:400 16px/1.5 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
.bozza{background:var(--n);color:#fff;text-align:center;padding:6px var(--pad);font:500 14px "Geist Mono"}
header{padding:20px var(--pad)}
header img{height:36px;width:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(48px,14vh,140px) var(--pad) 48px;max-width:1100px;width:100%;margin-inline:auto}
h1{font-weight:800;letter-spacing:-.05em;line-height:.98;font-size:clamp(44px,8vw,112px)}
h1 span{display:block;color:var(--g)}
form{margin-top:clamp(28px,5vh,48px)}
.bar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--n);border-radius:999px;padding:8px 8px 8px 24px;background:var(--w);transition:box-shadow .2s}
.bar:focus-within{box-shadow:0 0 0 3px rgba(10,10,10,.12)}
.bar input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 clamp(17px,2vw,22px) "Geist";color:var(--n);height:52px}
.bar input::placeholder{color:var(--g)}
.bar button{height:52px;padding:0 24px;border:0;border-radius:999px;background:var(--r);color:#fff;font:600 16px "Geist";cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.bar button:hover{transform:scale(1.03)}.bar button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--n);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips button{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--w);font:500 15px "Geist";color:var(--g2);cursor:pointer;transition:border-color .2s,color .2s}
.chips button:hover{border-color:var(--n);color:var(--n)}
#out{margin-top:28px;display:grid;gap:10px}
.res{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:20px 24px;border-radius:20px;background:var(--n);color:#fff;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.res:hover{transform:translateY(-3px)}
.res b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}
.res span{color:#cfcfcf}
.res .go{display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.res .go svg{width:22px;height:22px;background:#fff;color:var(--n);border-radius:50%;padding:4px}
.res .st{font:500 14px "Geist Mono";color:#fff;border:1px solid #fff;border-radius:999px;padding:2px 10px;margin-left:10px;vertical-align:2px}
.none{padding:20px 24px;border:1.5px solid var(--n);border-radius:20px}
.none a{font-weight:600;text-decoration:underline}
footer{padding:20px var(--pad) 28px;color:var(--g2);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between}
@media(max-width:640px){.bar{padding-left:16px}.bar button{padding:0 16px}.res{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="assets/ok-mark-nero.svg" alt="OK.mondo"></header>
<main>
 <h1>Tu chiedi.<span>OK risponde.</span></h1>
 <form id="f" role="search" autocomplete="off">
  <label for="q" style="position:absolute;left:-9999px">Scrivi cosa ti serve</label>
  <div class="bar"><input id="q" type="text" placeholder="Cosa ti serve? Es. un'insegna" enterkeyhint="go"><button type="submit">Vai</button></div>
  <div class="chips" aria-label="Esempi"><button type="button">un'insegna per il mio locale</button><button type="button">una lampada stampata in 3D</button><button type="button">biglietti per il mio evento</button><button type="button">un sito e i social</button></div>
 </form>
 <div id="out" aria-live="polite"></div>
</main>
<footer id="contatti"><span>OK.mondo</span><a href="https://wa.me/393773621181">WhatsApp +39 377 362 1181</a></footer>
<script>
const S=[
 {nome:"OK.3D Design Lab",desc:"Insegne luminose, lampade e oggetti: luce e profondità",href:"ok3d/",k:["3d","stampa","stampare","stampante","stampato","lampad","oggett","prototip","gadget","pezz","design","portachiav","targa","insegn","neon","led","luminos","scritta","vetrina","negozio","locale","ristorante","pizzeria","bar ","pub"]},
 {nome:"Biglietti per eventi",desc:"OK.TICKETS: registrazioni e biglietti per serate e festival",href:"https://oktickets.it",ext:1,k:["bigliett","ticket","prenotazion","tavol","registrazion","accredit","serata","festival","evento","eventi","discotec"]},
 {nome:"Eventi, format e service",desc:"Organizzazione, format e service per eventi",href:"eventi/",cost:1,k:["organizz","format","service","allestiment","audio","luci","concert","matrimon","festa"]},
 {nome:"Comunicazione e web",desc:"Brand, grafica, social, siti e campagne",href:"comunicazione-web/",cost:1,k:["sito","siti","web","social","instagram","grafica","logo","brand","video","pubblicit","seo","volantin","campagn","promozion","marketing","facebook","tiktok"]}
];
const norm=t=>(" "+t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ")+" ");
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const q=document.getElementById("q"),out=document.getElementById("out");
function match(t){const n=norm(t);return S.map(s=>({s,p:s.k.filter(k=>n.includes(k.length<4?" "+k:k)).length})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).map(x=>x.s)}
function show(go){
 const t=q.value.trim();out.innerHTML="";if(!t)return [];
 const r=match(t);
 if(!r.length){out.innerHTML='<div class="none">Non ho capito bene. Scegli la porta più vicina: '+S.map(function(x){return '<a href="'+x.href+'">'+x.nome+'</a>'}).join(' · ')+'.</div>';return r}
 r.forEach(s=>{const a=document.createElement("a");a.className="res";a.href=s.href;if(s.ext){a.target="_blank";a.rel="noopener"}
  a.innerHTML="<div><b>"+s.nome+(s.cost?'<em class="st" style="font-style:normal">in costruzione</em>':"")+"</b><span>"+s.desc+"</span></div><span class='go'>Vai "+arrow+"</span>";out.appendChild(a)});
 return r}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();const r=show();if(r&&r.length&&r.length===1&&!r[0].cost)location.href=r[0].href});
q.addEventListener("input",()=>show());
document.querySelectorAll(".chips button").forEach(b=>b.addEventListener("click",()=>{q.value=b.textContent;show();q.focus()}));
</script>
</body>
</html>
