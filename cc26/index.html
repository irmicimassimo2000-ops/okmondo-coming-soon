<!--
  DIREZIONE: reparto Motion (Cesare), 03/09/2026.
  Concetto: IL MARCHIO NON APPARE, VIENE CAVATO.
  Un solo taglio, e dove il filo e' passato non c'e' piu' la pietra: c'e' il nome.

  Restraint ALTO: una idea sola, declinata due volte. Due oggetti si muovono
  su dodici in scena. Il testo non entra mai da nessuna direzione: si accende.

  Tolti dalla versione precedente, ognuno per una ragione:
  - la lama di luce   -> TELL n.1 (light sweep). E nel sistema il colore tocca
                         la LUCE, mai la MATERIA: il filo non illumina, sottrae.
  - la scala .962/1.035 -> 3,8% in un secondo sta sotto la soglia di lettura,
                         e la stessa mossa due volte e' la definizione di template.
  - le DUE meta' che scorrono -> niente resta ancorato, il segno si sfalda.
                         In cava la parete resta e il blocco se ne va: UNA massa.
  - il crossfade pittogramma/logotipo -> l'assenza di una decisione.
-->

<style>
@font-face{font-family:'SpaceMono';font-weight:400;font-display:swap;
           src:url(_a/SpaceMono-Regular.ttf) format('truetype')}

:root{
  --notte:#0D0D0D; --sabbia:#EED7B8; --ombra:#9C8460; --bruno:#493328;
  --segnale:#C4361B;
  --corpo:'SpaceMono',ui-monospace,'SFMono-Regular',Consolas,monospace;

  /* Le due masse, in % della scatola d'inchiostro (117,565 x 75,963 u).
     Quote convertite dal vettoriale lockato, non ridisegnate. */
  --sin:polygon(0% 8.170%, 36.211% 13.072%, 23.572% 97.786%, 3.110% 100%);
  --des:polygon(49.726% 0%, 96.267% 6.302%, 100% 77.905%, 37.089% 84.714%);

  /* IL BLOCCO CHIUSO, e i due tempi in cui si apre. Il vettoriale dichiara
     kerf 13,250 u PERPENDICOLARI al taglio + scorrimento 13,250 u LUNGO il
     taglio, a +77 gradi. Sono due movimenti di natura diversa, e il segno
     stesso detta la sequenza: prima il filo che apre, poi la massa che scende.

       chiuso       +13,517% / -13,071%   la massa piccola appoggiata alla grande
       dopo il filo  +2,536% / -16,995%   13,250 u perpendicolari, verso fuori
       finale                 0 / 0       13,250 u lungo il taglio, in giu'      */
  --chiuso-x:13.517%;   --chiuso-y:-13.071%;
  --aperto-x:2.536%;    --aperto-y:-16.995%;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{background:var(--notte)}
body{background:var(--notte);color:var(--sabbia);font-family:var(--corpo);
     overflow:hidden;-webkit-font-smoothing:antialiased}

.fondo{position:fixed;inset:0;z-index:0;background:var(--notte)}

/* ── LA SOSTITUZIONE ─────────────────────────────────────────────────────
   Un bordo solo, a tutto schermo, inclinato come il kerf: a sinistra c'e' il
   nome, a destra c'e' ancora la pietra. Il filo prosegue, e dove e' passato la
   pietra non c'e' piu'. I due strati sono entrambi a tutto schermo perche' il
   bordo deve vivere nelle stesse coordinate per tutti e due.
   Su 100vh d'altezza lo scarto orizzontale e' 23,09vh = tan(13 gradi).       */
.strato{position:fixed;inset:0;z-index:2;display:grid;place-items:center}

.nome{clip-path:polygon(0 0,calc(-30vh + 23.09vh) 0,-30vh 100%,0 100%);
      animation:scopri 560ms 960ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes scopri{to{clip-path:polygon(0 0,calc(140vw + 23.09vh) 0,140vw 100%,0 100%)}}

.roccia{z-index:3;
        clip-path:polygon(calc(-30vh + 23.09vh) 0,100% 0,100% 100%,-30vh 100%);
        animation:cava 560ms 960ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes cava{to{clip-path:polygon(calc(140vw + 23.09vh) 0,100% 0,100% 100%,140vw 100%)}}

/* ── il nome: non si muove MAI, viene solo scoperto ─────────────────────── */
.centro{display:flex;flex-direction:column;align-items:center;
        gap:clamp(14px,2.2vh,22px);text-align:center}
.marchio{width:min(56vw,400px);height:auto;display:block}
.dati{font-size:clamp(.66rem,1.85vw,.78rem);letter-spacing:.16em;
      text-transform:uppercase;color:var(--sabbia);line-height:2.1}
.dati b{font-weight:400;color:var(--ombra)}
.numero{color:var(--segnale)}

/* ── la pietra ───────────────────────────────────────────────────────────
   Misura da direzione: altezza 2,4x la cap-height del logotipo. Cap = 8,368%
   della larghezza del logotipo, quindi il blocco e' largo 0,3108 volte.
   E il centro e' quello del blocco CHIUSO, non della scatola: chiuso la massa
   piccola sta a +13,517 / -13,071, e l'ingombro reale ha centro in
   56,759% / 41,014%. E' quel fotogramma che deve reggere da solo. */
.pietra{width:min(34vw,280px);aspect-ratio:117.565/75.963;position:relative;
        transform:translate(-6.759%,8.986%)}

.saldatura{position:absolute;inset:0;background:var(--sabbia);
           clip-path:polygon(13.517% -4.901%, 49.727% 0%, 96.267% 6.302%,
                             100% 77.905%, 37.089% 84.714%, 16.627% 86.929%);
           animation:salda 1ms 200ms linear forwards}
@keyframes salda{to{opacity:0}}
.massa{position:absolute;inset:0;background:var(--sabbia)}
.massa.dx{clip-path:var(--des)}                    /* la parete resta */
.massa.sx{clip-path:var(--sin);                    /* il blocco se ne va */
          transform:translate(var(--chiuso-x),var(--chiuso-y));
          animation:stacca 860ms linear forwards}
/* due tempi che sono un gesto solo: il filo che apre, poi la massa che scende */
@keyframes stacca{
  0%     {transform:translate(var(--chiuso-x),var(--chiuso-y));
          animation-timing-function:linear}
  23.26% {transform:translate(var(--chiuso-x),var(--chiuso-y));
          animation-timing-function:cubic-bezier(.2,0,.35,1)}
  51.16% {transform:translate(var(--aperto-x),var(--aperto-y));
          animation-timing-function:cubic-bezier(.22,.61,.16,1)}
  100%   {transform:translate(0,0)}}

/* ── i quattro angoli: si ACCENDONO, non entrano ────────────────────────── */
.foglio{position:fixed;inset:0;z-index:4;
        display:flex;flex-direction:column;justify-content:space-between;
        padding:clamp(26px,5vw,54px);pointer-events:none}
.foglio a{pointer-events:auto}
.alto,.basso{display:flex;justify-content:space-between;gap:20px}
.alto{align-items:flex-start}
.basso{align-items:flex-end;flex-wrap:wrap}
.edizione,.luogo,a.ig,.stato span{opacity:0;
        animation:accendi 260ms 1700ms ease-out forwards}
/* le due righe di stato sono un elenco, e un elenco ha un ordine di lettura:
   e' l'unico sfalsamento ammesso in tutto il pezzo. */
.stato span:nth-child(2){animation-delay:1760ms}
@keyframes accendi{to{opacity:1}}

.edizione{font-size:clamp(.62rem,1.6vw,.72rem);letter-spacing:.34em;
          text-transform:uppercase;color:var(--ombra)}
.stato{font-size:clamp(.6rem,1.5vw,.68rem);letter-spacing:.2em;
       text-transform:uppercase;color:var(--bruno);text-align:right;line-height:1.9}
.stato span{display:block}
.luogo{font-size:clamp(.62rem,1.6vw,.72rem);letter-spacing:.14em;
       color:var(--ombra);line-height:1.9}
a.ig{font-size:clamp(.66rem,1.7vw,.76rem);letter-spacing:.18em;
     text-transform:uppercase;color:var(--sabbia);text-decoration:none;
     border-bottom:1px solid var(--bruno);padding-bottom:5px;
     transition:border-color .25s}
a.ig:hover,a.ig:focus-visible{border-color:var(--sabbia);outline:none}

@media (max-width:620px){
  .pietra{width:64vw}
  .marchio{width:72vw}
  .alto,.basso{flex-direction:column;align-items:flex-start}
  .stato{text-align:left}
}
/* reduced-motion non e' «piu' corta»: e' ferma. */
@media (prefers-reduced-motion:reduce){
  .roccia{display:none}
  .nome{animation:none;clip-path:none}
  .edizione,.luogo,a.ig,.stato span{animation:none;opacity:1}
}
</style></head><body>

<div class="fondo"></div>

<!-- il nome c'e' dall'inizio: e' la pietra che se ne va, non il nome che arriva -->
<div class="strato nome"><div class="centro">
  <img class="marchio" src="_a/logo.svg" alt="CLUBBIN&rsquo;CAVA">
  <p class="dati">
    29 . 08 . 26<br>
    <b>prima edizione</b> &middot; <span class="numero">4.739</span> <b>registrazioni</b>
  </p>
</div></div>

<div class="strato roccia"><div class="pietra">
  <div class="saldatura"></div>
  <div class="massa dx"></div>
  <div class="massa sx"></div>
</div></div>

<div class="foglio">
  <div class="alto">
    <p class="edizione">CC026</p>
    <p class="stato">
      <span>Il sito &egrave; in costruzione</span>
      <span>La notte no, quella &egrave; gi&agrave; successa</span>
    </p>
  </div>
  <div class="basso">
    <p class="luogo">
      Cava dell&rsquo;Erba / Stilmarmo<br>
      Apricena, Puglia
    </p>
    <a class="ig" href="https://instagram.com/clubbincava" rel="noopener">Instagram &rarr;</a>
  </div>
</div>
</body></html>
