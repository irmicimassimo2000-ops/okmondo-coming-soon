<!--
  ══════════════════════════════════════════════════════════════════
  L'APP, IN UNA PAGINA SOLA.
  Fino al 14/09 questo file era un TELAIO con quattro cornici: quattro
  documenti separati, quattro contesti, quattro volte i caratteri, e una
  navigazione che si poteva solo mimare — perché fra due cornici non
  passa né uno stato né un gesto.
  Da qui in poi index.html È l'app. Tre sezioni su quattro sono VISTE
  sempre montate dentro questa stessa pagina (`app/viste/*.js`), con la
  loro pila e la loro posizione di scorrimento. La quarta — il banco in
  tre dimensioni — resta in una cornice, e per una ragione sola: pesa
  dieci mega di modelli e di three.js, e quando la GPU tossisce deve
  tossire LÌ. Il prezzo di quella scelta è che scocca e banco non si
  vedono le variabili: si parlano, su BroadcastChannel("regina"). Il
  contratto dei messaggi sta scritto per intero in `app/canale3d.js`.

  Il resto del sistema sta in `app/`:
    sistema.css   i token (questi, gli stessi), la scocca, i componenti
    stato.js      un solo stato, si cambia solo mandandogli un evento
    rotta.js      tab + pila per tab, indirizzo, gesto dal bordo
    moto.js       una molla sola, per tutto cio' che si muove
    ui/           barra-nav, cella, tasto, campo, foglio, toast, vuoto,
                  redatto (scheletro), segni
    dati/         il seme, il catalogo, le collezioni (altro esecutore)

  ══════════════════════════════════════════════════════════════════
  IL SISTEMA DI DESIGN (F0.2) — dove vive e cosa vincola.
  Tutto sta in `app/sistema.css`, che è la trascrizione fedele di
  E:/OK.AGENZIA/regina-jewels/studio/SISTEMA-DESIGN.md: i token coi
  contrasti già misurati accanto, i due temi, la scala tipografica, i
  materiali, le sei durate e le due curve, e le classi di base.
  Da qui in poi NESSUN file di `app/ui` o `app/viste` porta un hex, una
  durata o un corpo di carattere: solo ruoli e classi. Il controllo è
  automatico (sonda `_A2_verifica.mjs`, prove 2, 3 e 4).
  IL TEMA: le tre viste di elenco sono di VELLUTO (`data-tema=scuro` sul
  <main>), il cofanetto è di CARTA (`data-tema=chiaro` sulla sua
  sezione, perché il banco in tre dimensioni è crema). Su scuro

  nero misura 2,6:1.

  ══════════════════════════════════════════════════════════════════
  LA BARRA — tre impianti, si sceglie.
  Verdetto di Massimo: «strutturiamo una navigation bar più identitaria e
  innovativa, sia l'estetica che l'animazione». Quella di prima erano
  quattro parole in maiuscoletto con quattro simboli presi dal carattere

  Qui la scelta non la fa l'esecutore: tre barre STRUTTURALMENTE diverse,
  costruite sul materiale vero, e si sceglie.
    · A · IL CABOCHON — barra agganciata, l'attiva sta su una pietra

    · B · LA CATENA  — un filo corre da bordo a bordo, le voci sono charm

    · C · LA CAPSULA DI VETRO — barra staccata dal bordo, vetro vero col

  Si attivano con `?nav=a|b|c`, da console con `window.__nav("b")`, e la

  ── SECONDA PASSATA (13/09) ────────────────────────────────────────

     sono l'unico posto dove il timbro si scrive UNA volta per modulo,

     La stringa qui sotto deve combaciare con `const VERSIONE` in fondo:
     se non combacia, il pannello `?diag=1` lo dice.

     lo stesso — soltanto senza timbro, cioè con la cache del browser
     invece che con la nostra. Un difetto che si vede solo dopo un
     aggiornamento è meglio di uno schermo nero. Le voci esplicite
     vincono sul prefisso: la rete non toglie il timbro a nessuno. -->

<!-- LA SCOCCA. #app sta dentro body perché il foglio dal basso debba
     poterla far arretrare (scala .92, raggio 12) senza toccare se
     stesso: un <dialog> modale vive nel top layer e non eredita le

<div id="app">
  <!-- IL TEMA. Le tre viste di elenco sono DI VELLUTO (tema scuro): è
       cio' che erano le vecchie pagine, coi vassoi, ed è cio' che una
       gioielleria fa da sempre — il metallo e la pietra si leggono sul
       buio, non sulla carta. Il COFANETTO resta di carta (tema chiaro)
       perché il banco in tre dimensioni è crema: un fondo scuro
       intorno a un banco crema sarebbe una cornice, non una stanza.
       Così il sistema mostra tutt'e due i temi, e su scuro l'accento è
       --firma-fuoco, mai --firma (che sul nero fa 2,6:1). -->
  <main id="dentro" data-tema="scuro">
    <section class="vista" data-vista="cofanetto" aria-label="Cofanetto" data-tema="chiaro" hidden>
      <div class="strato"><div id="velo">apparecchio il banco&hellip;</div></div>
    </section>
    <section class="vista" data-vista="vetrina" aria-label="Vetrina" hidden>
      <div class="strato"></div>
    </section>
    <section class="vista" data-vista="perte" aria-label="Per te" hidden>
      <div class="strato"></div>
    </section>
    <section class="vista" data-vista="profilo" aria-label="Profilo" hidden>
      <div class="strato"></div>
    </section>
  </main>
  <div id="fascia"></div>
  <nav id="barra" data-nav="a" aria-label="Sezioni"></nav>
</div>

<!-- IL FOGLIO. Uno solo, riusato: due <dialog> aperti insieme sono due
     top layer sovrapposti, e da lì non si torna indietro. -->

<!-- UNA SOLA regione di annunci in tutta l'app: due regioni che parlano
     insieme si coprono, e chi ascolta sente una parola e mezza. -->
<p id="annunci" role="status" aria-live="polite" aria-atomic="true"></p>

<script>
/* ── I SEGNI ───────────────────────────────────────────────────
   Ridisegnati da capo su griglia 24×24, tratto 1,7 con terminali tondi,
   nello stile dei simboli di sistema: due versioni per ciascuno,
   CONTORNO per le voci spente e PIENO per l'attiva.
     Cofanetto = corpo squadrato e coperchio a cupola bassa, con la
       serratura; nel pieno il coperchio e la serratura restano in
       negativo. (Con la cupola alta sembrava una cassetta della posta,
       con gli angoli solo arrotondati una tessera.)
     Vetrina  = la cassa ad arco col ripiano, CHIUSA in basso; nel pieno
       si scavano i due vetri. (Aperta in basso e col ripiano a
       mezz'altezza si leggeva una lettera «A», non una vetrina.)
     Per te   = la stella a quattro punte.
     Profilo  = il busto: tondo della testa e cupola delle spalle.

   ── I PESI OTTICI, MISURATI ─────────────────────────────────────
   Quattro disegni con lo stesso tratto NON pesano uguale: una scatola
   chiusa deposita il doppio dell'inchiostro di una stella. Ogni segno
   porta perciò la sua SCALA OTTICA `k`, e il tratto resta 1,7 davvero
   perché dentro il gruppo scalato si dichiara 1,7/k.
   Tarati contando i pixel a 48 px (sonda `_N2_tara.js`): i quattro
   contorni stanno in 371-377 (scarto 1,7%), i quattro pieni in 374-386
   (scarto 3,1%) — la forbice chiesta era ±12%.  */
const K = {cofanetto:{contorno:.934, pieno:.903},
           vetrina:  {contorno:.917, pieno:.975},
           perte:    {contorno:1.144,pieno:1.245},
           profilo:  {contorno:1.219,pieno:.965}};
const SEGNI = {
  cofanetto:{
    contorno:'<path d="M4.9 12.2v-.6a9.5 9.5 0 0 1 14.2 0v.6"/>'+
      '<path d="M4.9 12.2h14.2v5.4a1.8 1.8 0 0 1-1.8 1.8H6.7a1.8 1.8 0 0 1-1.8-1.8z"/>'+
      '<path d="M12 12.2v2.2"/>',
    pieno:'<path fill-rule="evenodd" d="M4.9 11.6a9.5 9.5 0 0 1 14.2 0v6a1.8 1.8 0 0 1-1.8 1.8H6.7a1.8 1.8 0 0 1-1.8-1.8z'+
      'M4.9 11.6h14.2v1.2H4.9z M10.9 13.5h2.2v2.4h-2.2z"/>'},
  vetrina:{
    contorno:'<path d="M5.6 19.4v-8a6.4 6.4 0 0 1 12.8 0v8z"/><path d="M5.6 15.2h12.8"/>',
    pieno:'<path fill-rule="evenodd" d="M5.6 19.4v-8a6.4 6.4 0 0 1 12.8 0v8z'+
      'M7.6 14.2v-2.6a4.4 4.4 0 0 1 8.8 0v2.6z M7.6 16.2h8.8v1.4H7.6z"/>'},
  perte:{
    contorno:'<path d="M12 2.6c.9 6 2.4 7.5 8.4 8.4-6 .9-7.5 2.4-8.4 8.4-.9-6-2.4-7.5-8.4-8.4 6-.9 7.5-2.4 8.4-8.4z"/>',
    pieno:'<path d="M12 2.6c.9 6 2.4 7.5 8.4 8.4-6 .9-7.5 2.4-8.4 8.4-.9-6-2.4-7.5-8.4-8.4 6-.9 7.5-2.4 8.4-8.4z"/>'},
  profilo:{
    contorno:'<circle cx="12" cy="8.1" r="3.6"/><path d="M5 19.6a7 7 0 0 1 14 0"/>',
    pieno:'<circle cx="12" cy="8.3" r="3.4"/><path d="M6 19.8a6 6 0 0 1 12 0 .8.8 0 0 1-.8.8H6.8a.8.8 0 0 1-.8-.8z"/>'},
};
const disegnoSegno = (id, modo) => {
  const k = K[id][modo];
  return '<svg class="segno '+modo+'" viewBox="0 0 24 24" aria-hidden="true">'+
    '<g transform="translate(12 12) scale('+k+') translate(-12 -12)" '+
       'stroke-width="'+(1.7/k).toFixed(3)+'">'+SEGNI[id][modo]+'</g></svg>';
};

const SEZIONI = [
  {id:"cofanetto", nome:"Cofanetto"},
  {id:"vetrina",   nome:"Vetrina"},
  {id:"perte",     nome:"Per te"},
  {id:"profilo",   nome:"Profilo"},
];
/* «Cofanetto» apre il banco in tre dimensioni. Dal 15/09 la vecchia
   pagina statica cofanetto.html è diventata la VISTA ELENCO
   (app/viste/cofanetto.js): un foglio che sale sopra la stanza, chiamato
   dalla capsula di vetro «Elenco» in alto a destra, indirizzo
   #/cofanetto/elenco. La pagina statica resta sul disco come reperto. */
/* E LA VERSIONE, che timbra i moduli e la cornice del banco. */
const VERSIONE = "2026-09-16a";
window.VERSIONE = VERSIONE;

const barra = document.getElementById("barra");
let attiva = null;

/* ── IL FONDO DELLA SCOCCA, E L'ALTEZZA VERA ───────────────────
   Due misure che su iOS non si possono lasciare al caso, e che fino al
   15/09 erano sparse in tre punti (qui, in `__barra.segna`, e in
   `app/avvio.js`), tutti e tre a scrivere solo il `theme-color`.

   IL FONDO. `html` non dipinge il suo riquadro: dipinge il CANVAS,
   cioe' tutta la finestra — compreso quello che resta oltre il viewport
   di impaginazione. Con `--notte` scritto fisso, un punto di finestra
   non coperto dalla scocca mostrava il nero della notte SOTTO il banco
   crema del cofanetto: il difetto che Massimo ha fotografato
   sull'iPhone grande aperto dalla Home (79 punti di nero in fondo).
   Il fondo del documento segue percio' la sezione, e con lui il
   `theme-color` che tinge le barre di sistema. Il come sta in
   `app/sistema.css`, blocco «ALTEZZA».

   L'ALTEZZA. `100dvh` fa il lavoro nel foglio di stile; questa e' la
   CINTURA, e su iOS dall'icona in Home e' lei che regge: in standalone
   il viewport di impaginazione si dichiarava 792 su uno schermo di
   852 — lo schermo meno i 59 della tacca — e sotto la barra
   flottante restavano 110 punti di carta invece dei 50 approvati.
   SI SCRIVE SEMPRE, E NEI DUE VERSI. Prima si scriveva solo quando la
   scocca risultava PIU' CORTA del visto, e si toglieva quando era piu'
   lunga: una misura che non si puo' abbassare e' una misura che non si
   puo' nemmeno rialzare dopo, perche' basta un momento in cui la
   scocca e' gia' alta quanto il visto perche' la forzatura sparisca e
   non torni. Adesso `--alt-vera` E' il visto, sempre.
   IL VISTO E' IL MAGGIORE DEI DUE. `visualViewport` si stringe quando
   sale la tastiera, `innerHeight` no: prendendo il maggiore, la
   tastiera non rimpicciolisce l'applicazione — e con lei la cornice
   del banco in tre dimensioni, che e' un contesto WebGL da ricostruire.
   E MAI SOTTO 480. Fra il caricamento e il primo impaginato iOS puo'
   dichiarare numeri assurdi (0, 1, poche decine): un pavimento sotto
   l'iPhone piu' corto in verticale (SE, 568) tiene fuori quei numeri
   senza mai toccare uno schermo vero.
   SI RIMISURA ANCHE AL `pageshow`: tornando dalla cache avanti/indietro
   di WebKit il documento e' quello di prima, e nessun `resize`
   annuncia lo schermo di adesso. */
function fondoScocca(id){
  const carta = NAV === "c" && id === "cofanetto";
  document.documentElement.dataset.fondo = carta ? "carta" : "notte";
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute("content", carta ? "#FAF8F5" : "#14110E");
}
const ALT_MINIMA = 480;
function misuraAltezza(){
  const vv = window.visualViewport;
  const visto = Math.max(window.innerHeight || 0, vv ? Math.round(vv.height) : 0);
  if(visto < ALT_MINIMA) return;
  const r = document.documentElement;
  /* SI CONFRONTA CON CIO' CHE C'E' SCRITTO, non con un ricordo. Una
     variabile che ricorda l'ultimo numero scritto si disallinea appena
     qualcun altro tocca la proprieta' — un'altra sessione, una sonda,
     un ripristino — e da quel momento la cintura tace credendo di aver
     gia' fatto. La proprieta' e' la verita': la si legge. */
  if(r.style.getPropertyValue("--alt-vera") === visto + "px") return;
  r.style.setProperty("--alt-vera", visto + "px");
}
window.__fondoScocca = fondoScocca;

const RIDOTTO = matchMedia("(prefers-reduced-motion: reduce)");

/* ── LA MOLLA ──────────────────────────────────────────────────
   Una sola, e sta qui. 0,5 s di assestamento, smorzamento 0,825:
   l'oscillazione smorzata sorpassa il bersaglio dell'1,3% e si posa.
   Non è un rimbalzo, è il peso di una cosa che si appoggia.
   (La stessa legge, come modulo, sta in app/moto.js: la usano il
   foglio, il toast e il gesto dal bordo. Qui resta scritta com'era
   perché la barra non cambi neanche di una cifra.) */
const OMEGA = 14.0, ZETA = 0.825;
function Molla(x0){ this.x = x0; this.v = 0; this.meta = x0; this.viva = false; }
Molla.prototype.passo = function(dt){
  const a = -OMEGA*OMEGA*(this.x - this.meta) - 2*ZETA*OMEGA*this.v;
  this.v += a*dt; this.x += this.v*dt;
  if(Math.abs(this.x - this.meta) < .4 && Math.abs(this.v) < 3){
    this.x = this.meta; this.v = 0; this.viva = false;
  }
  return this.x;
};

/* ── LA BARRA SI COSTRUISCE ────────────────────────────────────
   Un solo impianto di marcatura per tutte e tre: cambia il foglio di
   stile, non la struttura. Così una voce vale una voce, ovunque. */
barra.innerHTML =
  '<span id="gemma"></span>' +
  '<span id="capsula"></span>' +
  '<svg id="catena" aria-hidden="true" viewBox="0 0 390 20"><path d=""/></svg>' +
  SEZIONI.map(s =>
    '<button type="button" data-id="'+s.id+'" aria-label="'+s.nome+'">'+
      '<span class="pos"><span class="alone"></span>'+
        disegnoSegno(s.id,"contorno") + disegnoSegno(s.id,"pieno") +
      '</span>'+
      '<span class="nm">'+s.nome+'</span>'+
    '</button>').join("");

const gemma   = document.getElementById("gemma");
const capsula = document.getElementById("capsula");
const catena = document.getElementById("catena");
const filoPath = catena.querySelector("path");
const tasti = [...barra.querySelectorAll("button")];
/* IL GESTO NON CAMBIA, CAMBIA IL DESTINATARIO. Prima montava una
   cornice; ora chiama il navigatore, che sa anche cosa significa
   toccare la voce già attiva (tornare alla radice di quel tab). */
tasti.forEach(b => {
  b.onclick = () => { if(window.__vai) window.__vai(b.dataset.id); };
  /* la stessa marcatura che `app/ui/dom.js` mette da sola sui comandi
     costruiti dalle viste: il banco di collaudo conta i tasti morti, e
     queste quattro voci non devono comparire nel conto per il solo
     motivo di essere nate qui invece che la'. */
  b.setAttribute("data-vivo", "1");
});

/* ── QUALE BARRA ───────────────────────────────────────────────
   `?nav=a|b|c` decide e resta; senza, l'ultima scelta; senza neanche
   quella, C. `window.__nav("b")` per provarle in sequenza. */
function quale(){
  const q = new URLSearchParams(location.search).get("nav");
  if(q && "abc".includes(q)){ try{ localStorage.setItem("rj.nav", q); }catch(_){} return q; }
  try{ const m = localStorage.getItem("rj.nav"); if(m && "abc".includes(m)) return m; }catch(_){}
  return "c";
}
let NAV = quale();
function vestiLaBarra(v){
  NAV = v; barra.dataset.nav = v; document.body.dataset.nav = v;
  try{ localStorage.setItem("rj.nav", v); }catch(_){}
  fondoScocca(attiva);
  posa(true);
}
window.__nav = vestiLaBarra;

/* ── IL TRAGITTO (tutte e tre) ─────────────────────────────────
   FLIP vero: si MISURANO le posizioni e si anima la trasformazione.
   Mai `left` in transizione — quello ricalcola il layout a ogni
   fotogramma e su un telefono si vede. */
const molla = new Molla(0);
let ultimo = 0, girando = false, xPrec = 0;

function centro(id){
  const b = tasti.find(t => t.dataset.id === id);
  if(!b) return 0;
  const r = b.getBoundingClientRect(), n = barra.getBoundingClientRect();
  return r.left - n.left + r.width/2;
}

function disegna(x, vel){
  if(NAV === "a"){
    /* la goccia si stira: lo scaleX cresce con la velocita', e lo
       scaleY cala della metà — il volume della pietra non cambia */
    const s = Math.min(Math.abs(vel)/3200, 1) * 0.34;
    gemma.style.transform =
      "translateX(" + (x - 23).toFixed(2) + "px) scale(" +
      (1 + s).toFixed(3) + "," + (1 - s*0.5).toFixed(3) + ")";
  } else if(NAV === "b"){
    filoPath.setAttribute("d", tracciaFilo(barra.clientWidth, x, 9));
  } else if(NAV === "c"){
    /* la pastiglia non si stira: in iOS il vetro è rigido, si sposta e
       si posa. Lo stiramento è il linguaggio del cabochon (A). */
    capsula.style.transform = "translateX(" + (x - largCapsula/2).toFixed(2) + "px)";
  }
}
/* il filo: una retta con UNA conca, generata dal centro della conca */
function tracciaFilo(W, cx, prof){
  const y = 6, w = 46, f = (n) => n.toFixed(1);
  return "M0 "+y+" H"+f(cx-w)+
         " C"+f(cx-w*0.44)+" "+y+" "+f(cx-w*0.40)+" "+f(y+prof)+" "+f(cx)+" "+f(y+prof)+
         " C"+f(cx+w*0.40)+" "+f(y+prof)+" "+f(cx+w*0.44)+" "+y+" "+f(cx+w)+" "+y+
         " H"+f(W);
}

function giro(t){
  const dt = Math.min((t - ultimo)/1000, 1/30); ultimo = t;
  const x = molla.passo(dt);
  disegna(x, (x - xPrec)/(dt || 1/60)); xPrec = x;
  if(molla.viva) requestAnimationFrame(giro); else girando = false;
}

let largCapsula = 0;
function posa(subito){
  if(!attiva) return;
  catena.setAttribute("viewBox", "0 0 " + barra.clientWidth + " 20");
  if(NAV === "c"){
    /* la pastiglia veste il tasto meno tre punti per lato: attaccata ai
       bordi sembrerebbe un selettore segmentato, e quello è un'altra
       famiglia di comandi. */
    const b = tasti.find(t => t.dataset.id === attiva);
    largCapsula = Math.round((b ? b.getBoundingClientRect().width : 0) - 6);
    capsula.style.width = largCapsula + "px";
  }
  const meta = centro(attiva);
  molla.meta = meta;
  if(subito || RIDOTTO.matches){
    molla.x = meta; molla.v = 0; molla.viva = false; xPrec = meta;
    disegna(meta, 0); return;
  }
  molla.viva = true;
  if(!girando){ girando = true; ultimo = performance.now(); requestAnimationFrame(giro); }
}

/* ── CIO' CHE IL TELAIO ESPONE ALL'APP ─────────────────────────
   Due funzioni, e due bastano: `segna` accende la voce e fa partire la
   molla, `posa` rimette la pastiglia al suo posto quando lo schermo
   cambia misura. Tutto il resto della barra resta affar suo. */
window.__barra = {
  segna(id){
    const primo = attiva === null;
    if(attiva === id) return;
    attiva = id;
    for(const b of tasti){
      if(b.dataset.id === id) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    }
    fondoScocca(id);
    posa(primo);
  },
  posa
};

addEventListener("resize", () => { misuraAltezza(); posa(true); });
RIDOTTO.addEventListener && RIDOTTO.addEventListener("change", () => posa(true));
/* `visualViewport` parla anche quando `window` tace: la tastiera che
   sale, la barra degli indirizzi che si comprime, e — su iOS in
   standalone — il primo impaginato che si accorge dello schermo vero. */
if(window.visualViewport) visualViewport.addEventListener("resize", misuraAltezza);
addEventListener("orientationchange", () => { misuraAltezza(); setTimeout(misuraAltezza, 120); });
/* e tornando dalla cache avanti/indietro: il documento e' quello di
   prima e nessun `resize` racconta lo schermo di adesso */
addEventListener("pageshow", () => { misuraAltezza(); posa(true); });
misuraAltezza();

vestiLaBarra(NAV);

/* IL TELAIO SI CONTROLLA DA SOLO. I moduli portano ?v=VERSIONE, ma il
   telaio no: Safari lo tiene in cache anche dopo «ricarica» e anche
   chiudendo il browser, e un telaio vecchio chiede moduli vecchi — con
   il loro ?v= vecchio, che la cache serve volentieri. Massimo ha
   ricaricato più volte e vedeva sempre la versione di prima. Appena
   aperto, il telaio chiede se stesso con un timbro che nessuna cache ha
   mai visto, legge la VERSIONE che sta online, e se è diversa dalla
   propria si rimpiazza. Costa cinque kilobyte, una volta. */
fetch(location.pathname + "?t=" + Date.now(), {cache:"no-store"})
  .then(r => r.text())
  .then(t => {
    const m = t.match(/const VERSIONE = "([^"]+)"/);
    if(m && m[1] !== VERSIONE && !sessionStorage.getItem("rj.rimpiazzo." + m[1])){
      sessionStorage.setItem("rj.rimpiazzo." + m[1], "1");
      location.replace(location.pathname + "?r=" + Date.now() + location.hash);
    }
  }).catch(() => {});
/* e con ?diag=1 la versione si legge anche sul telaio */
if(new URLSearchParams(location.search).get("diag")){
  const v = document.createElement("div");
  v.textContent = "telaio " + VERSIONE;
  v.style.cssText = "position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top));" +
    "z-index:90;padding:4px 7px;background:rgba(20,17,14,.7);color:#8FE3C9;" +
    "font:11px/1.3 ui-monospace,monospace";
  document.body.appendChild(v);
  /* e si controlla che la mappa d'importazione porti lo stesso timbro:
     una mappa rimasta indietro serve moduli vecchi in silenzio. */
  const mp = document.querySelector('script[type=importmap]');
  const t = mp && mp.textContent.match(/\?v=([^"]+)"/);
  if(t && t[1] !== VERSIONE){
    v.textContent += "  ⚠ importmap " + t[1];
    v.style.color = "#E8A33D";
  }
}
</script>

<script type="module">
import { avviaApp } from "app/avvio.js";
avviaApp(window.VERSIONE).catch(e => console.error(e));
</script>
