<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<!-- NESSUNA ICONA, e di proposito. Il canone del marchio dice che il
     marchio completo e' l'unico marchio: un favicon e' un marchio ridotto,
     e non e' stato chiesto. `href="data:,"` dichiara «nessuna icona» e
     toglie la richiesta a vuoto che il browser fa comunque. -->
<link rel="icon" href="data:,">
<title>Regina Jewels</title>
<!--
  LA BOZZA DELL'APP, in quattro sezioni.
  Fino a ieri questo indirizzo apriva soltanto il banco in tre dimensioni.
  Il banco pero' e' UNA delle quattro sezioni, non l'app: il cofanetto e'
  la collezione di chi possiede i pezzi, la vetrina e' il negozio, «per te»
  sono le proposte, il profilo e' la persona. Qui le quattro stanno
  insieme, con la barra che le tiene.
  Ogni sezione e' una pagina sua dentro una cornice: il banco pesa dieci
  mega di modelli e non si carica finche' non lo si apre, e le altre tre
  restano leggere. La barra sta SOTTO la cornice, non sopra: appoggiata
  sopra coprirebbe il menu delle famiglie del banco, che e' dove si tocca.
-->
<style>
@font-face{font-family:Bodoni;src:url("font/bodoni.woff2") format("woff2");font-weight:400 500}
@font-face{font-family:Inter;src:url("font/inter.woff2") format("woff2");font-weight:400 600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#14110E}
body{display:flex;flex-direction:column;
     font:400 15px/1.5 Inter,system-ui,sans-serif;color:#EDE7DF}
#dentro{flex:1 1 auto;position:relative;min-height:0}
#dentro iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  background:#14110E;opacity:0;transition:opacity .28s ease;pointer-events:none}
#dentro iframe.qui{opacity:1;pointer-events:auto}
nav{flex:0 0 auto;display:flex;background:#14110E;
    border-top:1px solid rgba(255,240,215,.10);
    padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 1 0;min-width:0;border:0;background:none;cursor:pointer;
  padding:11px 4px 12px;color:#8A7E70;
  font:600 9.5px/1 Inter,system-ui,sans-serif;letter-spacing:.11em;
  text-transform:uppercase;white-space:nowrap;
  transition:color .2s ease}
nav button b{display:block;font:400 19px/1 Bodoni,Didot,Georgia,serif;
  letter-spacing:0;text-transform:none;margin-bottom:5px;font-weight:400}
nav button[aria-current]{color:#EDE7DF}
nav button[aria-current] b{color:#EDE7DF}
#velo{position:absolute;inset:0;display:grid;place-items:center;z-index:2;
  background:#14110E;color:#8A7E70;font-size:13px;letter-spacing:.06em;
  transition:opacity .3s ease}
#velo[hidden]{opacity:0;pointer-events:none;display:grid}
</style>
<div id="dentro"><div id="velo">apparecchio il banco…</div></div>
<nav id="barra"></nav>
<script>
const SEZIONI = [
  {id:"cofanetto", nome:"Cofanetto", segno:"\u25C6", dove:"spazio.html"},
  {id:"vetrina",   nome:"Vetrina",   segno:"\u25CB", dove:"vetrina.html"},
  {id:"perte",     nome:"Per te",    segno:"\u2726", dove:"perte.html"},
  {id:"profilo",   nome:"Profilo",   segno:"\u25CF", dove:"profilo.html"},
];
/* «Cofanetto» apre il banco in tre dimensioni; la scheda cofanetto.html
   costruita a parte resta come vista d'elenco e la si raggiunge da dentro.
   Qui la sezione e' lo SPAZIO, perche' e' quello il cofanetto. */
const dentro = document.getElementById("dentro");
const barra = document.getElementById("barra");
const velo = document.getElementById("velo");
const telai = {};
let attiva = null;

function apri(id){
  if(attiva === id) return;
  const s = SEZIONI.find(x => x.id === id);
  if(!telai[id]){
    const t = document.createElement("iframe");
    t.src = s.dove;
    t.title = s.nome;
    t.loading = "eager";
    // il banco e' l'unico che deve poter chiedere lo schermo intero
    if(id === "cofanetto") t.allow = "fullscreen";
    dentro.appendChild(t);
    telai[id] = t;
    t.addEventListener("load", () => { if(id === "cofanetto") velo.hidden = true; });
  } else if(id === "cofanetto") velo.hidden = true;
  for(const k in telai) telai[k].classList.toggle("qui", k === id);
  for(const b of barra.children) b.toggleAttribute("aria-current", b.dataset.id === id);
  if(id !== "cofanetto") velo.hidden = true;
  attiva = id;
  try { location.hash = id; } catch(_) {}
}

barra.innerHTML = SEZIONI.map(s =>
  `<button data-id="${s.id}"><b>${s.segno}</b>${s.nome}</button>`).join("");
for(const b of barra.children) b.onclick = () => apri(b.dataset.id);
/* e il tasto indietro del telefono cambia sezione invece di uscire
   dall'app: senza, chi tornava indietro dal profilo si ritrovava fuori */
function daIndirizzo(){
  const c = location.hash.replace("#", "");
  apri(SEZIONI.some(s => s.id === c) ? c : "cofanetto");
}
addEventListener("hashchange", daIndirizzo);
daIndirizzo();
</script>
