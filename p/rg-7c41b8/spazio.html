<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regina · il banco</title>
<!-- IL 404 DELLA FAVICON, e perche' NON ci va un marchio ridotto.
     Senza questa riga il browser chiede `/favicon.ico` a ogni
     caricamento e si prende un 404: rumore nel registro di rete, e su
     una pagina ospitata una richiesta in piu' che non serve a niente.
     La tentazione e' metterci il marchio in piccolo. Ma il canone di
     Massimo su questo e' chiuso da tempo — il marchio completo e'
     l'unico marchio, niente versione ridotta senza richiesta esplicita —
     e una favicon E' una versione ridotta. Quindi: niente icona, la
     richiesta si spegne e basta. Quando Stefano chiedera' un segno per
     la scheda del browser, quello sara' un lavoro di marchio, non una
     riga di HTML. -->
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Bodoni";src:url("font/bodoni.woff2") format("woff2");font-weight:400 600;font-display:block}
@font-face{font-family:"Bodoni";src:url("font/bodoni-it.woff2") format("woff2");font-weight:400 600;font-style:italic;font-display:block}
@font-face{font-family:"Inter";src:url("font/inter.woff2") format("woff2");font-weight:400 700;font-display:block}

:root{--carta:#FAF8F5;--cipria:#F4EBE6;--testo:#1A1614;--quieto:#6C5D57;
      --tenue:#93837B;--filo:#E4DAD3;--firma:#106068;
      /* IL MENU NON E' CONTORNO. Le cinque famiglie sono la navigazione
         primaria del banco, e stavano a --tenue: misurate, 3,42:1 sulla
         carta — sotto la soglia. Il grigio del contorno resta dov'e' (i
         sottotitoli, le etichette); la navigazione prende il suo, che la
         soglia la passa. */
      --voce:#6E5F57;
      /* ── IL BORDO, che era usato e mai dichiarato ──────────────────
         `var(--bordo)` compariva in due punti — la linguetta della
         maniglia e il pallino che dice lo stato dei suggerimenti — e in
         `:root` non c'era. Una variabile assente non e' un colore
         sbagliato: e' NESSUN colore, quindi `background:var(--bordo)`
         diventa `transparent`. Misurato: la maniglia della scheda
         tornava `rgba(0,0,0,0)` — invisibile — e il pallino spariva
         esattamente nello stato SPENTO, cioe' l'unico in cui deve dire
         qualcosa (acceso lo ridipinge `--firma`).
         E QUANTO SCURO LO DECIDE LA MISURA, non il gusto. Il primo
         candidato era #C9BDB4, il filo di un gradino piu' scuro: sulla
         carta (#FAF8F5) fa 1,74:1. Ma la linguetta e il pallino non sono
         decorazione — dicono «questa scheda si apre» e «i suggerimenti
         sono spenti» — e un segno non testuale che porta informazione
         vuole 3:1. A 1,74 non si vede, e la prova era gia' scritta nel
         verdetto: «la maniglia e' invisibile». Si prende allora il
         grigio che il progetto ha gia' per le etichette, --tenue
         (#93837B): misurato sulla carta fa 3,43:1, che la soglia la
         passa, e resta un grigio caldo — non un tratto nero in mezzo a
         una scheda di gioielleria. */
      --bordo:#93837B;
      /* ── I TEMPI DEL MOVIMENTO, IN UN POSTO SOLO ───────────────────
         Stavano sparsi: .12, .16, .2, .24, .26, .28, .3, .34, .62 — nove
         durate diverse per una schermata sola, e nessuna scritta due volte
         allo stesso modo. I riferimenti dicono tre misure e non nove:
         50-100 ms per il feedback al tocco, 150-200 per un cambio di
         stato, 300 in entrata e 250 in uscita per un pannello
         (Material 3 Motion; WWDC18 803).
         E L'USCITA E' PIU' CORTA DELL'ENTRATA. Non e' simmetria mancata:
         entrando si presenta una cosa nuova e le si da' il tempo di
         arrivare; uscendo chi guarda ha gia' deciso, e ogni millisecondo
         in piu' e' attesa. Anche le curve sono due: in entrata si arriva e
         ci si posa (decelera), in uscita si parte e si va via (accelera). */
      --tocco:.09s; --stato:.18s; --entra:.30s; --esce:.22s;
      --curva-entra:cubic-bezier(.16,1,.3,1);
      --curva-esce:cubic-bezier(.4,0,1,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--carta);color:var(--testo);font:400 14px/1.5 Inter,sans-serif}

/* LA STANZA E' LA SCHERMATA. Non c'e' una tela dentro una scheda: la tela e'
   tutto, e i comandi ci galleggiano sopra. */
/* E SU UNA SCRIVANIA LA TELA DICE CHE SI PUO' PRENDERE. Il cursore stava a
   `auto` — la freccia con cui si clicca un link: davanti a una stanza che
   si trascina e' l'unico segno disponibile, ed era quello sbagliato. */
#stanza{position:fixed;inset:0;touch-action:none;cursor:grab}
#stanza.tira{cursor:grabbing}
#stanza canvas{display:block;width:100%;height:100%}

/* ══════════════════════════════════════════════════════════════
   IL CONGEDO — come se ne vanno le cose

   Misurato prima di questo blocco: la carta del pezzo ENTRAVA con
   `porgi` (0,24 s) e il velo con `sfuma` (0,28 s), e USCIVA in 13
   millisecondi. La galleria in 6. Un fotogramma: un taglio di pellicola.
   Il motivo non era una transizione mancante — erano dichiarate — ma
   `hidden`, che porta `display:none`: un elemento che smette di esistere
   non ha niente da animare, e la regola scritta non gira mai. Si vedeva
   solo su #attesa, l'unico che conserva il display.
   Qui l'ordine si rovescia: prima si ANIMA (classe `.via`), e `hidden`
   arriva alla fine, sul transitionend. Una regola sola per tutti, cosi'
   non si torna a nove durate diverse.
   ══════════════════════════════════════════════════════════════ */
#carta-pezzo, #galleria, #accanto, #dietro, #cartello, #fondo, #maniglia,
#riga-sugg, #rail-sugg{
  transition:opacity var(--entra) var(--curva-entra),
             transform var(--entra) var(--curva-entra)}
.via{transition-duration:var(--esce) !important;
     transition-timing-function:var(--curva-esce) !important}
#carta-pezzo.via, #galleria.via, #accanto.via{opacity:0}
/* LE TRE FORME DEL SUGGERIMENTO ENTRANO ED ESCONO NELLO STESSO MODO.
   Il loro contenitore parte trasparente e prende `.qui` quando tocca a
   lui: cosi' cambiare variante al volo e' una dissolvenza incrociata —
   una forma si spegne mentre l'altra si accende — e non uno scatto.
   Prima l'unica dissolvenza era quella delle CARTE (`.carta.qui`), e a
   variante cambiata le carte erano gia' accese: sarebbero comparse di
   colpo. */
#accanto, #riga-sugg, #rail-sugg{opacity:0}
#accanto.qui, #riga-sugg.qui, #rail-sugg.qui{opacity:1}
/* la carta non svanisce e basta: si RITIRA, cioe' fa al contrario il
   gesto con cui era stata porta */
#carta-pezzo.via #porta{opacity:0;transform:translateY(6px) scale(.972);
  animation:none;
  transition:opacity var(--esce) var(--curva-esce),
             transform var(--esce) var(--curva-esce)}
#galleria.via{transform:scale(1.014)}
#dietro.via{opacity:0;transform:translateX(-7px)}
#cartello.via{opacity:0;transform:translateY(8px)}
/* #fondo e la maniglia NON hanno un `.via`: non se ne vanno mai, cambiano
   ALTEZZA. Il loro scatto era un altro — `display:none` sul materiale e
   sull'insieme quando la scheda si ritira — e si cura piu' sotto, dove
   quelle due righe si chiudono invece di sparire. */

/* ── IL LAMPO DELLA TELA ────────────────────────────────────────
   Serve solo a chi ha chiesto meno movimento: li' la macchina non vola
   piu', SALTA, e un salto senza niente in mezzo si legge come un guasto.
   Un velo di carta che si spegne in 120 ms dice «e' cambiata
   l'inquadratura» senza muovere un pixel in orizzontale. */
#salto{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
       background:var(--carta)}
#salto.acceso{animation:lampoDiTela .12s linear}
@keyframes lampoDiTela{from{opacity:.5}to{opacity:0}}

/* IL CARTELLINO E IL MENU STANNO SULLO STESSO FONDO.
   Prima erano due velature sovrapposte e il basso dello schermo usciva
   torbido. Una sola, e dentro ci stanno le due cose che restano. */
#fondo{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
       padding-top:52px;
       background:linear-gradient(to top, var(--carta) 62%,
                  rgba(250,248,245,.90) 82%, transparent)}

/* la transizione non sta piu' qui: sta nel blocco del CONGEDO, con quella
   di tutti gli altri pannelli. Nove durate sparse erano il problema. */
#cartello{padding:0 22px 4px}

/* ── LA SCHEDA SI RITIRA ──────────────────────────────────────────
   Verdetto di Massimo: «il layout degli elementi del menu lascia poco
   spazio alla visualizzazione dell'ambiente tridimensionale, che e' la
   parte principale della sezione».
   Misurato sul pezzo: della finestra da 844 punti, 44 li prendeva la
   testata e 297 il cartellino — il 40 per cento dello schermo per un nome,
   un prezzo, due righe di suggerimento e un bottone. All'ambiente ne
   restavano 503.
   Quindi il cartellino ha due altezze. Di serie sta RITIRATO: il nome, il
   prezzo e il gesto, che sono le tre cose che servono per guardare. Chi
   vuole comprare tira su la maniglia e trova il materiale, l'insieme e il
   bottone. E l'inquadratura si rifa' a ogni cambio, perche' la macchina
   centra sulla parte che si VEDE e quella parte e' appena cambiata. */
#maniglia{display:none;pointer-events:auto;width:100%;border:0;background:none;
          padding:10px 0 9px;cursor:pointer;margin-top:-10px;position:relative}
/* IL BERSAGLIO E' PIU' GRANDE DEL SEGNO. Misurata, la maniglia era alta
   22,5 punti: meta' del dito con cui la si tira. Ingrandire la linguetta
   la trasformerebbe in una barra, e non e' una barra; si allarga l'AREA,
   che e' invisibile, verso l'alto — dentro i 52 punti di gradiente
   trasparente che #fondo ha sopra di se' e che non contengono nient'altro.
   Il segno resta di 42x3,5, il bersaglio diventa 44. */
#maniglia::before{content:"";position:absolute;left:0;right:0;
                  top:-11px;height:44px}
/* e l'opacita' se ne va: a .78 il grigio composito sulla carta misurava
   2,49:1, cioe' sotto la soglia proprio dopo aver cambiato colore per
   passarla. A piena opacita' fa 3,43:1. */
#maniglia span{display:block;width:42px;height:3.5px;border-radius:2px;margin:0 auto;
               background:var(--bordo);
               transition:transform .24s cubic-bezier(.2,.7,.3,1),
                          background var(--tocco) linear}
#fondo.apribile #maniglia{display:block}
#fondo.apribile:not(.ritirato) #maniglia span{transform:scaleY(-1)}
/* LA PRESSIONE SI VEDE ANCHE QUI. Una linguetta che non risponde al dito
   fa sembrare la scheda incollata: si stringe e si scurisce nella tacca
   del feedback (90 ms), come tutti gli altri comandi. */
#maniglia:active span{transform:scaleX(.84);background:var(--testo)}
#fondo.apribile:not(.ritirato) #maniglia:active span{transform:scaleY(-1) scaleX(.84)}
/* ── LA SCHEDA SI RITIRA, NON SCOMPARE ────────────────────────────
   Il materiale e l'insieme uscivano con `display:none`: nessuna
   transizione puo' girare su una riga che smette di esistere, e la
   scheda faceva un salto di cento punti in un fotogramma — con la
   macchina che subito dopo si rifaceva l'inquadratura su un'altezza
   diversa. Adesso si ritirano: si chiudono in altezza e si spengono
   nella stessa mezza tacca di tempo del resto. `visibility` arriva DOPO
   la chiusura, cosi' il bottone dell'insieme non resta raggiungibile
   col tasto di tabulazione dentro una scheda chiusa. */
#fondo{transition:padding-top var(--stato) var(--curva-entra),
                  opacity var(--entra) var(--curva-entra),
                  transform var(--entra) var(--curva-entra)}
/* il tetto serve per forza: da `none` non si transisce, e senza un numero
   di partenza la chiusura tornerebbe uno scatto. Sono due misure larghe —
   la riga del materiale e il blocco dell'insieme non ci arrivano mai — e
   larghe vanno bene, perche' il tetto non taglia, accompagna. */
#sotto{max-height:96px}
#insieme{max-height:320px}
#sotto, #insieme{overflow:hidden;
  transition:opacity var(--esce) var(--curva-esce),
             max-height var(--esce) var(--curva-esce),
             margin-top var(--esce) var(--curva-esce),
             padding-top var(--esce) var(--curva-esce),
             visibility 0s linear 0s}
#fondo.ritirato{padding-top:38px}
#fondo.ritirato #sotto, #fondo.ritirato #insieme{
  opacity:0;max-height:0;margin-top:0;padding-top:0;border-top-width:0;
  visibility:hidden;pointer-events:none;
  transition-delay:0s, 0s, 0s, 0s, var(--esce)}
#cartello .riga{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
/* IL NOME DEL PEZZO PORTA IL RAPPORTO DELLE MAISON. Stava a 24 px contro
   un corpo di 12,5: rapporto 1,92, sotto la banda 2,6-3,7 misurata sulle
   maison. A 34 su 12 fa 2,83, ed e' la differenza fra una scheda prodotto
   e una pagina di gioielleria. */
/* IL NOME DEL PEZZO STA SU UNA RIGA, e si restringe per la LUNGHEZZA DEL
   NOME, non per la larghezza dello schermo. Con `clamp(24px, 7.4vw, 34px)`
   si restringeva su un telefono stretto: a 375 px il titolo scendeva a
   27,75 e il rapporto col corpo del testo cadeva a 2,31, sotto la banda
   2,6-3,7 delle maison. Ma su un telefono la merce non e' piu' piccola —
   c'e' solo meno posto, e il nome del pezzo e' la cosa che deve restare
   grande. Il corpo resta 34 e a rimpicciolirlo e' il MISURATORE qui sotto,
   solo quando il nome vero non ci sta in una riga. */
#cartello b{font:400 34px/1.04 Bodoni,Didot,Georgia,serif;letter-spacing:-.005em}
#cartello .prezzo{font:400 14px/1 Inter,sans-serif;color:var(--quieto);
                  font-variant-numeric:tabular-nums;white-space:nowrap}
#cartello p{margin-top:7px;font-size:12px;color:var(--quieto)}
/* IL SUGGERIMENTO DEL GESTO SI RITIRA. Serve una volta: chi ha gia'
   trascinato non ha bisogno che glielo si ripeta per tutta la visita, e
   una riga che resta quando non serve piu' e' solo rumore. */
/* E IL SUGGERIMENTO SI DEVE LEGGERE. Stava a `--tenue`: misurato contro il
   fondo vero sotto la riga — la carta piena, perche' li' il gradiente di
   #fondo e' gia' opaco (la riga cade al 39,6% dal basso, sotto la soglia
   del 62%) — fa 3,43:1, sotto i 4,5 che questo progetto si e' dato. E'
   l'unica riga che INSEGNA come si usa la stanza: se non si legge, non
   insegna. Passa a `--voce`, lo stesso grigio caldo della navigazione,
   che sullo stesso fondo misura 5,76:1. */
#cartello .gesto{display:flex;align-items:center;gap:8px;min-width:0;
                 font:400 11px/1 Inter,sans-serif;color:var(--voce);
                 transition:opacity var(--esce) var(--curva-esce),
                            max-height var(--esce) var(--curva-esce);
                 max-height:22px;overflow:hidden}
#cartello .gesto svg{width:34px;flex:none}
#cartello.imparato .gesto{opacity:0;max-height:0;margin-top:0}

/* ── LE VESTI: quattro dischetti, e basta ────────────────────
   Il colore dell'espositore lo sceglie il cliente, e il comando sta sulla
   scheda. Quattro dischetti del colore vero, non quattro nomi: un colore si
   riconosce guardandolo, e «avorio» scritto non dice quale avorio.
   Il plinto non cambia mai: li' il turchese e' la firma, ed e' sotto il
   marchio. */
/* A 390 PX LA RIGA SBORDAVA, e la scorciatoia era stringere il testo con i
   puntini: usciva «trascina per scorrere · tocca per …». Una didascalia che
   non finisce non insegna il gesto, che e' l'unica cosa per cui esiste. Le
   due cose non stanno su una riga sola, quindi non ci stanno: la
   didascalia prende tutta la larghezza e i dischetti vanno sotto, a
   destra. Nessuno dei due perde niente. */
#basso{display:flex;flex-direction:column;align-items:stretch;gap:10px;
       margin-top:11px}
#gesto{min-width:0}
#gesto span{display:block}
#vesti{display:flex;gap:12px;pointer-events:auto;flex:none;
       align-self:flex-end}
/* ── IL TASTO CHE SPEGNE I SUGGERIMENTI ──────────────────────────
   Massimo: «devo avere la possibilita' di nasconderli». Due carte da
   centoquattro punti su uno schermo da trecentonovanta ne prendono piu'
   di meta', e a volte stanno davanti alla cosa che si e' aperti per
   guardare. Il comando sta dove sta il gesto, ha la forma delle voci del
   menu — maiuscoletto e filetto — e si ricorda la scelta: chi li spegne
   non deve rispegnerli a ogni pezzo. */
/* ERA TROPPO IN OMBRA. Otto pixel di maiuscoletto grigio tenue in fondo a
   destra: un comando che c'e' solo se lo si cerca. Adesso e' una pastiglia
   con il suo contorno, un pallino che dice lo stato e un corpo leggibile.
   Resta piccola — e' un interruttore, non un richiamo — ma si vede. */
/* IL BERSAGLIO E' 44, LA PASTIGLIA NO. Misurata, era alta 25,5 punti.
   Gonfiare la pastiglia fino a 44 la farebbe diventare il comando piu'
   grosso della riga — e non lo e': e' un interruttore accanto a una
   didascalia. Si allarga l'area con uno pseudo-elemento steso sopra e
   sotto (9,25 punti per parte), che non si vede e non sposta niente. */
#tasto-insieme{display:none;pointer-events:auto;align-self:flex-end;
  cursor:pointer;padding:7px 11px 7px 9px;border-radius:999px;
  border:1px solid var(--filo);background:rgba(255,255,255,.55);
  font:700 9.5px/1 Inter,sans-serif;letter-spacing:.10em;text-transform:uppercase;
  color:var(--voce);position:relative;
  display:none;align-items:center;gap:7px;
  transition:border-color .2s, background .2s, color .2s,
             transform var(--tocco) var(--curva-entra)}
#tasto-insieme::after{content:"";position:absolute;left:0;right:0;
  top:-9.25px;bottom:-9.25px}
#tasto-insieme::before{content:"";width:7px;height:7px;border-radius:50%;
  background:var(--bordo);transition:background .2s, box-shadow .2s}
#tasto-insieme:active{transform:scale(.94);background:var(--cipria)}
#fondo.apribile #tasto-insieme{display:inline-flex}
#tasto-insieme[aria-pressed="true"]{border-color:var(--firma);color:var(--testo)}
#tasto-insieme[aria-pressed="true"]::before{background:var(--firma);
  box-shadow:0 0 0 3px rgba(16,96,104,.16)}
/* UN DISCHETTO DA 21 E' UN BERSAGLIO DA 21. Il colore si riconosce a 21
   punti — piu' grande diventerebbe una macchia di vernice accanto al nome
   del pezzo, e quattro macchie sono un'altra cosa — ma il dito ne vuole
   44. Il segno resta 21, l'area di tocco diventa 44 con uno pseudo
   invisibile steso di 11,5 per lato. E lo spazio fra un dischetto e
   l'altro e' 9: le aree si toccherebbero, quindi il `gap` sale a 12 e
   nessun dito cade su due colori insieme. */
#vesti button{width:21px;height:21px;padding:0;border-radius:50%;cursor:pointer;
              border:1px solid rgba(26,22,20,.16);background:var(--tinta);
              position:relative;
              transition:transform .16s cubic-bezier(.2,.7,.3,1)}
#vesti button::before{content:"";position:absolute;inset:-11.5px;border-radius:50%}
#vesti button::after{content:"";position:absolute;inset:-4px;border-radius:50%;
                     border:1px solid var(--firma);opacity:0;
                     transition:opacity .2s}
#vesti button.qui::after{opacity:1}
#vesti button:active{transform:scale(.88)}
/* sul pezzo l'espositore non si vede piu', quindi le vesti non hanno piu'
   niente da colorare: spariscono loro, non tutta la riga — il suggerimento
   del gesto li' serve piu' che altrove, perche' e' l'unico posto senza
   nessun appiglio visibile per uscire. */
#cartello.pezzo #vesti{display:none}

/* ── IL MENU: quattro parole, ed e' anche il «dove sei» ───────
   Una vetrina vera ha i suoi reparti scritti una volta sola. Prima le
   stesse quattro parole comparivano tre volte — sulle targhette appese
   sopra gli oggetti, nella riga in alto e dentro il cartellino — e in
   piu' non c'era modo di saltare da una famiglia all'altra: bisognava
   tornare indietro e camminare. Questa striscia le dice una volta, dice
   dove sei, e ci si va toccandola. */
/* (qui in mezzo, fra il commento del menu e le regole di #strade, stava
   una terza copia di `#insieme[hidden]{display:none}`: nemmeno vicina
   alle altre due, e senza nessun rapporto con il blocco in cui era
   finita. Via anche quella.) */
#strade button{width:100%;border:0;cursor:pointer;padding:13px 10px;
  font:600 10px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;border-radius:2px}
#strade .primo{background:#106068;color:#fff}
#strade .secondo{background:transparent;color:var(--testo);
  box-shadow:inset 0 0 0 1px var(--filo)}
/* e le cinque famiglie devono starci tutte: con cinque voci a spaziatura
   piena l'ultima usciva dallo schermo, e una famiglia che non si vede non
   esiste. Si distribuiscono, e la spaziatura cala quando serve. */
/* ── LE CARTE ACCANTO AL PEZZO ─────────────────────────────────────
   Non oggetti in tre dimensioni: CARTE. E la carta non e' inventata — e' la
   Carta del Pezzo, il cartoncino che Regina mette gia' negli astucci, in
   piccolo. Cosi' il suggerimento parla la lingua del marchio invece di
   quella di un visore: niente cornici luminose, niente trattini tecnici —
   un cartoncino su velluto, un filetto, e il nome in Bodoni.
   Restano AGGANCIATE al punto dello spazio dove starebbero addosso, quindi
   girando il pezzo si spostano con lui: e' quello a farne un insieme. */
#accanto{position:fixed;inset:0;pointer-events:none;z-index:3}
#accanto[hidden]{display:none}
/* ── LE CARTE SI FANNO DA PARTE ───────────────────────────────────
   Massimo: «devono essere piu' amalgamate nell'ambiente, in modo da
   lasciare spazio e visibilita' al pezzo».
   Erano due cartoncini neri pieni con un filetto scuro attorno e un'ombra
   portata: su una crema sfocata sono i due oggetti piu' contrastati del
   quadro, e lo squint test li trovava prima del gioiello. Adesso sono
   VELATE — il fondo del cofanetto con un velo di sfocatura sotto, non un
   blocco opaco — e restano leggibili perche' il testo ha il suo contrasto,
   non perche' ha un muro dietro. Il filetto e' un capello di luce, non un
   bordo nero. */
/* E LA CARTA PORTA LA SUA ESPOSIZIONE, non quella di cio' che ha dietro.
   Il velo era soltanto trasparente: sul nero della stanza la carta usciva
   scura e leggibile, ma quando scorrendo finiva sopra la crema del
   bancone il composito saliva a #666054 e le scritte piu' tenui
   sparivano — l'occhiello «BRACCIALI» misurava 1,57:1 e il prezzo 2,67:1,
   contro i 4,5:1 che questo progetto si e' dato e annota accanto a ogni
   coppia in sistema.css. La stessa carta, in alto sul nero, dava 4,82 e
   8,06: lo stesso pezzo di interfaccia, leggibile o invisibile secondo
   dove passava.
   Si aggiunge `brightness` al filtro: la carta prende cio' che ha dietro,
   lo sfuoca E lo chiude di due stop. Cosi' resta VELATA come voleva
   Massimo — dentro l'ambiente, non un blocco opaco davanti — ma il valore
   del suo fondo non dipende piu' dal caso. E l'occhiello sale al tono del
   prezzo: a sette punti e mezzo in maiuscoletto, quel grigio non arriva a
   4,5:1 su nessun fondo medio. */
/* ── E ADESSO SI TOCCANO ──────────────────────────────────────────
   Stavano a `pointer-events:none`: due cartoncini che dicono «con questo
   ci sta anche l'Anello Cabochon a 39 €» e non portavano da nessuna
   parte. Un suggerimento che non si puo' seguire non e' un suggerimento,
   e' una didascalia — e su un telefono la prima cosa che si fa davanti a
   una carta con dentro una foto e un prezzo e' toccarla.
   La FORMA non cambia di un pixel: velo, sfocatura e brightness restano
   quelli scelti (le varianti le fa un altro). Cambia solo che il tocco
   arriva, e che la pressione si vede — la carta si stringe di quattro
   centesimi nella tacca del feedback, senza toccare il suo colore. */
#accanto .carta{position:absolute;transform:translate(-50%,-50%);
  pointer-events:auto;cursor:pointer;
  width:118px;padding:7px 8px 8px;
  background:rgba(26,22,18,.34);
  backdrop-filter:blur(9px) saturate(.85) brightness(.34);
  -webkit-backdrop-filter:blur(9px) saturate(.85) brightness(.34);
  box-shadow:0 0 0 1px rgba(255,240,215,.13);
  opacity:0;transition:opacity .34s ease,
                       transform var(--tocco) var(--curva-entra)}
#accanto .carta.qui{opacity:1}
#accanto .carta:active{transform:translate(-50%,-50%) scale(.96)}
/* SUL PEZZO STESO LE CARTE SI STRINGONO. Un gioiello in piedi occupa una
   colonna e le carte gli stanno di fianco; uno steso prende il settanta per
   cento della larghezza, e su un telefono da 390 punti non restano due
   corridoi da 126. O si rimpicciolisce il pezzo — ma il pezzo e' il motivo
   per cui si e' entrati — o si stringono le carte. Si stringono. */
#accanto.steso .carta{width:100px;padding:6px 7px 7px}
#accanto.steso .carta i{font-size:7px;padding-bottom:4px;margin-bottom:5px}
#accanto.steso .carta b{font-size:12.5px}
#accanto.steso .carta span{font-size:9.5px}
#accanto .carta img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  border-radius:0;margin-bottom:6px;background:rgba(255,240,215,.04);
  opacity:.92}
/* LA FOTOGRAFIA PUO' ARRIVARE DOPO LA CARTA. Se si apre un pezzo prima
   che la famiglia suggerita sia scesa, il provino non c'e' e la carta
   nasce senza immagine; quando il provino si fa, l'immagine ci entra
   dentro. Entrarci di colpo e' uno scatto in mezzo a una scena ferma:
   la dissolvenza dura una tacca d'ingresso e basta. Il fotogramma
   finale della sequenza non si scrive — senza `to` vale la regola qui
   sopra, cioe' 0,92 sulla carta in scena e 1 sul rail, e a sequenza
   finita non resta niente addosso all'elemento. */
@keyframes fotoArriva{from{opacity:0}}
#accanto .carta img.arriva, #rail-sugg .card img.arriva{
  animation:fotoArriva var(--entra) var(--curva-entra)}
#accanto .carta i{display:block;font:600 7.5px/1 Inter,system-ui,sans-serif;
  letter-spacing:.13em;text-transform:uppercase;color:#b3a795;font-style:normal;
  padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid rgba(255,240,215,.13)}
#accanto .carta b{display:block;font:400 14px/1.15 Bodoni,Didot,Georgia,serif;
  color:#f2ece1;font-weight:400}
#accanto .carta span{display:block;margin-top:3px;font:400 10.5px/1 Inter,system-ui,sans-serif;
  color:#b3a795;font-variant-numeric:lining-nums}
/* IL BLOCCO `#insieme` STAVA SCRITTO DUE VOLTE, identico, a dodici righe di
   distanza: sette regole doppie che il browser risolveva sempre a favore
   della seconda. Non cambiava niente a schermo, ed e' proprio questo il
   danno — chi va a toccare la prima copia non vede effetto e conclude che
   il foglio di stile non lo ascolta. Ne resta una, quella piu' in basso,
   accanto alle altre regole del cartellino. */
#menu{pointer-events:auto;display:flex;
      /* il `max` serve quando la pagina e' ospitata e non puo' dichiarare
         viewport-fit=cover: li' env() torna zero e il menu finirebbe
         addosso alla barra di casa dell'iPhone */
      padding:0 6px calc(9px + max(env(safe-area-inset-bottom), 9px))}
/* min-width:0 e un corpo piu' piccolo: quattro reparti devono stare anche
   su uno schermo da 320, e se il carattere non fa in tempo a caricarsi la
   riserva e' piu' larga. Senza, «Bracciali» finiva fuori dallo schermo e il
   menu ne mostrava tre. */
#insieme{display:block;margin-top:13px;padding-top:12px;border-top:1px solid var(--filo)}
#insieme[hidden]{display:none}
#insieme .eco{font:600 9px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue);margin-bottom:8px}
#insieme .r{display:flex;align-items:baseline;justify-content:space-between;
  gap:14px;padding:4px 0}
#insieme .r b{font:400 16px/1.15 Bodoni,Didot,Georgia,serif}
#insieme .r span{font-size:13px;color:var(--quieto);
  font-variant-numeric:lining-nums;white-space:nowrap}
#insieme button{width:100%;border:0;cursor:pointer;padding:13px 10px;margin-top:11px;
  background:var(--firma);color:#fff;border-radius:2px;
  font:600 10px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform var(--tocco) var(--curva-entra), background var(--stato)}
#insieme button:active{transform:scale(.96);background:#0C4C52}
/* ── «MESSO DA PARTE», e il segno di spunta e' DISEGNATO ──────────
   Niente emoji: una spunta di sistema porta dentro il carattere di un
   altro — su iPhone arriva colorata — ed e' l'unica cosa nella schermata
   che non e' stata disegnata qui. Sono due segmenti a filo, nello stesso
   spessore dei segni del nastro. Lo stato dura tre secondi e torna:
   un tasto che resta «fatto» per sempre non si puo' rifare. */
#insieme button .spunta{width:13px;height:13px;flex:none;display:none}
#insieme button .spunta path{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#insieme button.fatto{background:#0C4C52}
#insieme button.fatto .spunta{display:block}
#menu button{flex:1 1 0;min-width:0;background:none;border:0;cursor:pointer;
             padding:15px 2px 12px;position:relative;color:var(--voce);
             /* OTTO PUNTI SONO IL FONDO DELLA SCALA. E' la navigazione
                primaria del banco — cinque reparti — e stava sotto il
                corpo di una nota a pie' di pagina. Misurato a 390 punti
                ogni tasto ne ha 76: a 9,5 con .09em la parola piu' lunga
                («ORECCHINI», nove lettere) ne vuole 62, e nessuna delle
                cinque si taglia. Si sale di un punto e mezzo, che sulla
                scala dei corpi piccoli e' quasi un quinto. */
             font:700 9.5px/1 Inter,sans-serif;letter-spacing:.09em;
             text-transform:uppercase;white-space:nowrap;
             transition:color .2s cubic-bezier(.2,.7,.3,1),
                        transform .12s cubic-bezier(.2,.7,.3,1)}
/* il filo sta SOTTO la parola. Sopra, cadeva sul bordo della striscia e
   sembrava sottolineare la riga del cartellino, non il reparto. */
#menu button::before{content:"";position:absolute;bottom:5px;left:50%;right:50%;height:1px;
                     background:var(--firma);opacity:0;
                     transition:left .28s cubic-bezier(.2,.7,.3,1),
                                right .28s cubic-bezier(.2,.7,.3,1),opacity .2s}
/* Lo stato si dice con una CLASSE, non col selettore sull'attributo.
   `aria-current` resta perche' serve a chi legge lo schermo, ma come
   aggancio di stile non ha retto: con l'attributo giusto sull'elemento
   giusto e la regola caricata, il colore restava quello di prima. */
#menu button.qui{color:var(--testo)}
#menu button.qui::before{left:16%;right:16%;opacity:1}
#menu button:active{transform:scale(.94)}
/* UN REPARTO CHE NON E' ANCORA ARRIVATO SI VEDE, ma si vede che non c'e'
   ancora. Toccarlo non e' un tocco muto: lo porta in cima alla coda e il
   cartellino dice che sta arrivando. */
#menu button.attende{opacity:.42}

#alto{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
      padding:calc(13px + max(env(safe-area-inset-top), 8px)) 16px 30px;
      pointer-events:none;z-index:3;
      background:linear-gradient(to bottom, var(--carta) 26%, rgba(250,248,245,.66) 58%, transparent)}
/* IL MARCHIO STA IN MEZZO, come l'insegna sopra la vetrina. Di lato, con
   accanto altre due scritte, era una barra di navigazione qualunque. */
#alto img{height:18px;opacity:.92;position:absolute;left:50%;transform:translateX(-50%)}
#dietro{pointer-events:auto;display:flex;align-items:center;gap:7px;background:none;
        border:0;cursor:pointer;color:var(--testo);font:400 11px/1 Inter,sans-serif;
        padding:6px 2px;
        /* la pressione risponde in una tacca di feedback (90 ms), il
           congedo nella sua: sono due cose diverse e prima erano una */
        transition:opacity var(--entra) var(--curva-entra),
                   transform var(--tocco) var(--curva-entra)}
#dietro svg{width:16px}
#dietro[hidden]{display:none}
#dietro:active{transform:scale(.94)}

#attesa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:var(--carta);transition:opacity .6s;font:400 15px/1 Bodoni,Georgia,serif;
        color:var(--tenue)}
#attesa[hidden]{opacity:0;pointer-events:none;display:flex}
/* IL VELO DICE COSA STA ARRIVANDO. Non una percentuale — un numero che
   sale non e' un'informazione, e' un orologio — ma il NOME della cosa:
   «le collane…», «gli orecchini…». La riga sotto e' alta un pixel: e' un
   filo che si allunga, non una barra di sistema. */
#attesa .dentro{display:flex;flex-direction:column;align-items:center;gap:14px;
                min-width:180px}
#attesa .binario{width:180px;height:1px;background:rgba(20,17,14,.14)}
#attesa .binario i{display:block;height:1px;width:0;background:var(--tenue);
                   transition:width .25s linear}
#attesa #riprova{border:0;background:none;cursor:pointer;color:var(--tenue);
                 font:400 12px/1 Inter,sans-serif;letter-spacing:.08em;
                 text-decoration:underline;text-underline-offset:4px;padding:6px}
#attesa #riprova[hidden]{display:none}

/* ══════════════════════════════════════════════════════════════
   LA CARTA DEL PEZZO
   Il pezzo non e' una scheda da leggere: e' un OGGETTO con cui si fa
   qualcosa. Toccarlo apre la sua carta — la foto, i dati, la dedica — e
   ogni voce del menu e' una porta su un sistema: il regalo passa da una
   scansione, la collezione dice cosa manca e cosa si apre chiudendola.
   La carta si GIRA. Non si apre una seconda schermata sopra la prima:
   ogni azione mostra il proprio seguito sul retro dello stesso
   cartoncino, e si torna girandolo. E' il gesto di una carta vera, ed e'
   anche il motivo per cui il codice del dono sta dietro: un codice si
   mostra, e per mostrarlo si volta la carta verso l'altro.
   ══════════════════════════════════════════════════════════════ */
#carta-pezzo{position:fixed;inset:0;z-index:7;display:grid;place-items:center;
  padding:26px 18px}
#carta-pezzo[hidden]{display:none}
/* IL VELO NON SPEGNE, SCOSTA. A 0,58 di nero l'ambiente dietro spariva e
   la carta diventava una schermata: ma la carta si APPOGGIA sopra
   l'interfaccia, e per appoggiarsi ha bisogno che sotto ci sia ancora
   qualcosa. Un terzo di nero e una sfocatura piu' piena tengono la stanza
   leggibile e la mandano indietro. */
#carta-pezzo .velo{position:absolute;inset:0;background:rgba(12,9,6,.34);
  backdrop-filter:blur(7px) saturate(.86);
  -webkit-backdrop-filter:blur(7px) saturate(.86);
  animation:sfuma .28s ease}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
/* e la carta ARRIVA: non compare, si alza. Novantasei centesimi di scala
   e otto punti piu' in basso, in due decimi di secondo — quel tanto che
   dice «e' un oggetto che ti e' stato porto». */
@keyframes porgi{from{opacity:0;transform:translateY(8px) scale(.965)}
                 to{opacity:1;transform:none}}
/* L'ALTEZZA LA DETTA IL CONTENUTO, non un numero. Era `min(660px, 100%)`:
   una carta senza dedica lasciava duecento punti di fondo vuoto, e una
   carta con la collezione dietro veniva tagliata. Ora la misura chi ci sta
   dentro — la si chiede alla faccia attiva dopo che il browser l'ha
   impaginata — e la si limita a quello che lo schermo concede. Cambia
   anche girando, e cambia con una transizione: una carta che si accorcia
   di scatto sembra rotta. */
/* L'ENTRATA STA SU UN ALTRO ELEMENTO, e non e' un vezzo di struttura.
   L'animazione «porgi» stava sul foglio stesso con `fill-mode: both`: a
   fine corsa il suo ultimo fotogramma — `transform: none` — RESTA
   applicato, e un valore che viene da un'animazione batte una regola
   normale. Quindi `#foglio.girata{transform:rotateY(180deg)}` non ha mai
   avuto effetto: la carta non si girava, si limitava a cambiare altezza
   sulla misura del retro, e sotto il fronte restava una striscia di carta
   vuota. E' il difetto che Massimo ha visto premendo «collezione».
   L'entrata va quindi su un involucro, e la rotazione resta sul foglio.
   La prospettiva si sposta con lei: `perspective` agisce sui FIGLI, e col
   foglio diventato nipote si sarebbe perso il 3D. */
#porta{width:100%;max-width:330px;perspective:1400px;
  animation:porgi .24s cubic-bezier(.2,.7,.3,1) both}
#foglio{position:relative;width:100%;
  transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.4,.05,.2,1),
             height .34s cubic-bezier(.3,.1,.2,1)}
#foglio.girata{transform:rotateY(180deg)}
/* UNA CARTA HA UN BORDO SUO. Spigoli vivi, nessun raggio e un'ombra
   secca: era un pannello. Dieci punti di raggio, un filo di luce sul
   contorno che la stacca dal velo, e due ombre invece di una — una
   stretta che la appoggia, una larga e morbida che le da' l'aria sotto.
   E `overflow:hidden` sul contorno, se no la fotografia esce dagli
   angoli arrotondati e il raggio non si vede dove conta. */
#foglio .faccia{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;background:var(--carta);
  border-radius:10px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,
             0 0 0 1px rgba(26,22,20,.10),
             0 2px 6px -1px rgba(0,0,0,.28),
             0 34px 64px -24px rgba(0,0,0,.62);
  display:flex;flex-direction:column}
/* lo scorrimento sta DENTRO, non sul contorno */
#foglio .faccia > *{flex:none}
#foglio .dentro-carta{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column}
#foglio .dentro-carta::-webkit-scrollbar{width:0}
/* SENZA DEDICA, un filo di carta sotto i tasti. Altrimenti il bordo
   inferiore dell'ultimo tasto E' il bordo della carta, e la carta sembra
   tagliata invece che finita. */
#foglio .fronte.senza-dedica .dentro-carta{padding-bottom:16px}
#foglio .retro{transform:rotateY(180deg);background:#1C1813;color:#EDE7DF}
#foglio .faccia::-webkit-scrollbar{width:0}

/* il fronte: la foto in alto, i dati, la dedica, il menu */
/* LA FOTO E' UNA FASCIA, e le OPZIONI stanno sopra la piega.
   Verdetto di Massimo, con lo scatto del suo iPhone: «le opzioni si devono
   vedere subito sulla carta». Su un telefono vero la barra di Safari in
   alto e la sua barra in basso si prendono quasi un terzo dello schermo:
   alla carta ne restano cinquecentosessanta punti, e con la foto a 16:11,
   cinque righe di dati e la dedica, il menu cominciava a
   cinquecentoquattordici. Restava una scheda da leggere.
   Tre tagli, e nessuno butta via niente: la foto passa a 16:8, i dati da
   cinque righe in colonna a tre su due colonne, e la DEDICA scende SOTTO
   il menu — resta sempre sul fronte, come deve, ma dopo le cose da fare.
   Prima si agisce, poi si legge. */
/* IL FONDO DIETRO LA FOTO E' LA CARTA, NON IL FANGO. Stava a #6A625A —
   il grigio medio con cui si FOTOGRAFA un gioiello, che li' dentro e'
   giusto e resta dov'e' — ma messo come fondo del riquadro usciva fuori
   dallo scatto: prima che l'immagine arrivi, e in tutta la fascia che
   l'immagine non copre, la carta cominciava con una banda color terra.
   Una carta comincia con la sua carta. */
#ritratto{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;
  border-radius:10px 10px 0 0;
  background:var(--carta);cursor:pointer;
  transition:opacity var(--tocco) linear}
#ritratto:active{opacity:.86}
.riga-foto{position:relative;flex:none}
/* ── SE LA FOTO NON C'E', UN POSTO VUOTO DISEGNATO ────────────────
   Un <img> che non carica lascia l'icona di immagine rotta del browser —
   un blocco grigio con dentro un simbolo che non e' nostro, ed e' la
   stessa bugia dei posti vuoti nella lista della collezione, gia'
   corretta li'. Qui il riquadro si spegne e al suo posto resta la carta
   con un filetto e una riga in Bodoni: e' un posto che aspetta una
   fotografia, e lo dice. */
.riga-foto.senza-foto #ritratto{display:none}
.riga-foto.senza-foto{aspect-ratio:16/8;display:grid;place-items:center;
  border-bottom:1px solid var(--filo);
  background:linear-gradient(var(--carta), var(--cipria))}
.riga-foto.senza-foto::after{content:"La fotografia di questo pezzo arriva";
  font:italic 400 13px/1.3 Bodoni,Didot,Georgia,serif;color:var(--tenue);
  text-align:center;padding:0 24px}
.riga-foto.senza-foto .quante{display:none}
/* anche la pastiglia delle foto prende il suo raggio: un rettangolo a
   spigoli vivi dentro una carta arrotondata e' l'unica cosa che si vede */
.riga-foto .quante{position:absolute;right:10px;bottom:10px;pointer-events:none;
  background:rgba(12,9,6,.52);color:#F2ECE1;padding:5px 9px;border-radius:999px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  font:700 8.5px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase}
/* ══════════════════════════════════════════════════════════════
   LA GERARCHIA DELLA CARTA: nome · materiale · prezzo, a peso calante

   Era una griglia. «VALORE / 59,00 €» stava in una casella accanto a
   «NEL COFANETTO DAL / 12 luglio 2026», e succedevano tre cose, tutte
   misurate:
     · il PREZZO era un dato fra i dati. In una vetrina il prezzo e' la
       terza cosa che si legge, dopo il nome e di che cosa e' fatto — non
       la prima di una tabella;
     · «NEL COFANETTO DAL» in una colonna da 91,3 punti andava a capo, e
       il suo valore scendeva di 8 punti rispetto agli altri due: tre
       valori su tre linee di base diverse dentro la stessa riga;
     · un pezzo senza scheda aveva UNA casella su tre, e le altre due
       restavano bianche.
   Nessuno dei tre e' un difetto di taratura: la griglia e' la forma
   sbagliata. Cartier, Boucheron, Pomellato e Mejuri, guardati uno
   accanto all'altro, non fanno tabelle — fanno RIGHE, e le etichette le
   sciolgono dentro la frase: «Dal 12 luglio 2026 · Filo di Luce». Due
   righe, non una tabella. Senza colonne non c'e' una linea di base da
   disallineare e non c'e' una casella da lasciare vuota.
   ══════════════════════════════════════════════════════════════ */
#carta-dentro{padding:14px 16px 2px;flex:none}
#carta-dentro .nome{font:400 27px/1.06 Bodoni,Didot,Georgia,serif;
  letter-spacing:-.005em}
#carta-dentro .mat{margin-top:5px;font-size:12px;line-height:1.45;color:var(--quieto)}
/* IL PREZZO HA IL SUO PESO, e i numeri sono quelli allineati: su un
   serif le cifre in stile antico ballano, e un importo che balla su una
   carta di gioielleria si nota subito. Qui e' Inter, quindi basta
   dichiarare `lining-nums` e i tabulari per la virgola. */
#carta-dentro .prezzo{margin-top:9px;
  font:400 17px/1 Inter,sans-serif;color:var(--testo);
  font-variant-numeric:lining-nums tabular-nums}
#carta-dentro .dati{margin-top:11px;padding-top:11px;
  border-top:1px solid var(--filo);
  font-size:11px;line-height:1.5;color:var(--quieto)}
#carta-dentro .dati div + div{margin-top:3px}
/* ── LO STATO E' UNA PAROLA, NON UN COLORE ────────────────────────
   Chi ha ricevuto un pezzo in regalo non trovava il tasto «Regala» e
   nessuno gli diceva perche': la regola stava scritta solo sul retro di
   quel tasto — cioe' esattamente nel posto che quel pezzo non puo'
   aprire. La si porta sul fronte, dove la persona guarda, e si dice come
   la dicono le maison: una parola in maiuscoletto Inter, non una
   pastiglia colorata. */
#carta-dentro .stato{font:700 8.5px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--testo)}
#carta-dentro .dati .regalo{margin-top:7px}
#carta-dentro .dati .regalo .stato{color:var(--voce)}

/* LA DEDICA STA SEMPRE SUL FRONTE, e non e' un'opzione del menu: e' la
   ragione per cui una collana e' quella collana e non un'altra uguale.
   Se e' lunga si taglia a tre righe e si offre di girare la carta. */
/* LA DEDICA PRENDE LO SPAZIO CHE HA. Quando c'e' e' la cosa piu'
   importante della carta: arriva fino al bordo, respira, e si legge fino
   a quattro righe prima di chiedere di girare. Quando non c'e' — un pezzo
   comprato da se' — non resta un vuoto: il blocco esce e la carta si
   accorcia di quello che occupava. */
#dedica{margin:14px 16px 16px;padding:14px 15px;background:var(--cipria);
  border-radius:8px;flex:none;position:relative}
#dedica .eco{font:700 8.5px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tenue);margin-bottom:7px}
#dedica p{font:italic 400 16px/1.5 Bodoni,Didot,Georgia,serif;color:#2A1F1C}
#dedica.lunga p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden}
#dedica .firma{margin-top:8px;font-size:11px;color:var(--tenue)}
#dedica .tutto{display:none;margin-top:9px;border:0;background:none;padding:0 0 3px;
  cursor:pointer;font:700 8.5px/1 Inter,sans-serif;letter-spacing:.11em;
  text-transform:uppercase;color:var(--firma);
  border-bottom:1px solid var(--firma);
  transition:opacity var(--tocco) linear}
#dedica .tutto:active{opacity:.55}
#dedica.lunga .tutto{display:inline-block}

#voci{flex:none}
/* ══════════════════════════════════════════════════════════════
   IL MENU E' IL LAYOUT DELLA CARTA
   Verdetto di Massimo: «il menu e' il layout della carta, tutte le
   opzioni vanno fatte in un modo piu' professionale, con un'estetica
   personalizzata e piu' accattivante».
   Aveva ragione: erano righe con un nome e una didascalia grigia a
   destra — funzionanti e anonime, il genere di lista che potrebbe stare
   in qualunque applicazione. Qui la scelta estetica non la fa
   l'esecutore: si costruiscono TRE impianti strutturalmente diversi sulla
   carta vera, con il contenuto vero, e si scegliera'.
     · A · IL TAVOLIERE — riquadri, come le mosse di un gioco da tavolo.
     · B · IL REGISTRO — righe incise, come le voci di un libretto.
     · C · IL NASTRO — pastiglie in fila sotto la foto, sempre in vista.
   I segni sono disegnati a filo, nello spessore del marchio: nessuna
   emoji e nessuna libreria di icone.
   ══════════════════════════════════════════════════════════════ */
#voci .segno{flex:none;width:22px;height:22px;display:block}
#voci .segno path, #voci .segno circle, #voci .segno line, #voci .segno rect{
  fill:none;stroke:var(--firma);stroke-width:1.15;
  stroke-linecap:round;stroke-linejoin:round}
#voci button.grave .segno path, #voci button.grave .segno circle,
#voci button.grave .segno line{stroke:#9B4034}

/* ── IL NASTRO ──────────────────────────────────────────────
   Scelto da Massimo. E con una regola sulla forma: «lo spazio deve essere
   coperto tutto, diviso in parti eque in base al numero di tasti».
   Quindi non pastiglie di larghezza fissa allineate a sinistra — che con
   tre tasti lasciano un vuoto a destra e con cinque scorrono — ma tasti
   che si dividono la riga in parti uguali, quanti che siano. Il numero
   non e' mai lo stesso: lo decide il PEZZO. */
/* IL NASTRO E' UN GRUPPO DENTRO LA CARTA, non una fascia incollata fra
   due. Prima andava da bordo a bordo con due filetti e un fondo diverso:
   quattro strisce sovrapposte non sono una carta, sono quattro schede.
   Adesso sta nei margini del testo, ha il suo riquadro e il suo raggio, e
   si legge come un gruppo di comandi che appartiene al cartoncino. */
#voci.nastro{display:flex;gap:1px;margin:14px 16px 0;border-radius:8px;
  overflow:hidden;background:var(--filo);
  box-shadow:0 0 0 1px var(--filo)}
#voci.nastro button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:8px;
  padding:12px 4px 11px;border:0;background:#FEFDFC;cursor:pointer}
#voci.nastro button:active{background:var(--cipria)}
/* L'ETICHETTA DEVE STARCI, non accorciarsi con i puntini. Con cinque
   tasti su una carta da 330 punti ognuno ne ha 59, meno l'imbottitura 51:
   a 8 punti di corpo con .08em di spaziatura «COLLEZIONE» ne vuole 54 e
   usciva «COLLEZI…». Un comando con i puntini non e' un comando: non si
   sa cosa fa. A 7,5 con .04em ne vuole 47, e la parola piu' lunga —
   ASSISTENZA — ce ne vuole 47 anche lei. */
#voci.nastro .che{font:700 7.5px/1.25 Inter,sans-serif;letter-spacing:.04em;
  text-transform:uppercase;color:var(--testo);text-align:center;
  max-width:100%;white-space:nowrap}
#voci.nastro .perche{display:none}
#voci.nastro button.grave{background:#FBF6F5}
#voci.nastro button.grave .che{color:#9B4034}

/* il retro: il codice, e cio' che l'azione comporta */
#foglio .retro .dentro-carta{padding:22px 20px}
#retro-titolo{font:400 25px/1.1 Bodoni,Didot,Georgia,serif;flex:none}
#retro-sotto{margin-top:8px;font-size:12.5px;line-height:1.5;color:#B3A795;flex:none}
#retro-qr{margin:20px auto 0;width:172px;height:172px;background:#F6F0E6;
  padding:12px;display:none;flex:none;border-radius:8px}
#retro-qr img{display:block;width:100%;height:100%}
#retro-qr.c-e{display:block}
#retro-codice{margin-top:11px;text-align:center;flex:none;
  font:700 10px/1 Inter,sans-serif;letter-spacing:.16em;color:#8A7E70}
#retro-note{margin-top:18px;padding-top:14px;flex:none;
  border-top:1px solid rgba(255,240,215,.14);
  font-size:11.5px;line-height:1.55;color:#B3A795}
#retro-note b{color:#EDE7DF;font-weight:400}
/* I TASTI DEL RETRO STANNO ATTACCATI AL FONDO. Sulla collezione il retro
   e' piu' alto della carta e «torna alla carta» finiva sotto la piega: si
   restava girati senza un modo evidente di tornare. Appiccicato in basso
   c'e' sempre. */
/* I TASTI IN FONDO, SENZA MARGINE AUTOMATICO. Stavano col
   `margin-top:auto` per cadere in basso quando il retro era corto. Ma
   ora la carta prende l'altezza del contenuto, e per misurare il
   contenuto si sommano le altezze dei figli con i loro margini: un
   margine automatico, letto da getComputedStyle, torna come lo spazio
   LIBERO in pixel — cioe' esattamente quello che manca per riempire la
   carta. La somma tornava sempre uguale all'altezza della carta, e la
   carta non si accorciava piu' (714, 718, 722, 726: cresceva di quattro
   punti a ogni giro, inseguendo se stessa). Un margine dichiarato, e il
   fondo cade in basso da solo perche' la carta finisce dove finisce. */
#retro-fondo{margin-top:22px;padding:0;display:flex;gap:10px;flex:none;
  position:sticky;bottom:-22px;background:linear-gradient(to top,
    #1C1813 62%, rgba(28,24,19,.92) 82%, rgba(28,24,19,0))}
#retro-fondo button{flex:1;border:0;cursor:pointer;padding:13px 10px;
  border-radius:7px;
  font:700 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(255,240,215,.10);color:#EDE7DF;
  transition:transform var(--tocco) var(--curva-entra), background var(--stato)}
#retro-fondo button:active{transform:scale(.94);background:rgba(255,240,215,.22)}
#retro-fondo button.fa{background:var(--firma)}
#retro-fondo button.fa:active{background:#0C4C52}
#retro-fondo button.grave{background:#9B4034}
#retro-fondo button.grave:active{background:#7E3229}

/* la lista della collezione, sul retro */
.coll{margin-top:16px;display:grid;gap:1px}
.coll .r{display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1px solid rgba(255,240,215,.10)}
.coll .r img{width:40px;height:34px;object-fit:cover;background:#3A332B;flex:none}
/* UN PEZZO CHE NON HAI ANCORA NON HA UNA FOTOGRAFIA TUA. Al posto della
   foto stava un <img> senza sorgente: un rettangolo grigio pieno, che su
   tre righe su cinque si legge come immagine rotta e non come «questo
   manca». Un riquadro di filo, vuoto, dice la stessa cosa senza mentire. */
.coll .r .vuoto{width:40px;height:34px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,240,215,.16)}
.coll .r .n{flex:1;font:400 15px/1.15 Bodoni,Didot,Georgia,serif}
/* ── TRE STATI, TRE PAROLE ────────────────────────────────────────
   Erano due, e uno dei due mentiva. Un pezzo RICEVUTO IN REGALO — che
   ce l'hai, si vede nel cofanetto, lo indossi — portava la classe
   `manca`: nome sbiadito, stato in ambra, cioe' disegnato esattamente
   come un pezzo che non hai. La regola vera e' un'altra: ce l'hai, ma
   per la chiusura non conta. Sono due cose diverse e vogliono due segni
   diversi.
     · TUO — turchese, la firma: e' tuo e conta.
     · RICEVUTO · NON CONTA — neutro: e' tuo, non conta. Il nome resta
       pieno, perche' il pezzo c'e'.
     · DA PRENDERE · 31,00 € — ambra, e solo qui il nome sbiadisce:
       quello e' l'unico che davvero manca.
   E LA PAROLA STA SU UNA RIGA, il seguito su un'altra. Scritte di fila
   con un punto in mezzo e lasciate andare a capo dove capita, uscivano
   «RICEVUTO · NON / CONTA» e «DA PRENDERE · 31,00 / €»: un euro da solo
   sulla seconda riga, fotografato. Sono DUE cose — lo stato e il suo
   seguito — e si impaginano come due cose: la parola in maiuscoletto col
   suo colore, il seguito sotto, piu' piccolo e neutro, tutti e due
   allineati a destra e nessuno dei due spezzabile. */
.coll .r .s{display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  flex:none;max-width:118px;text-align:right}
.coll .r .s i{font:700 8px/1.2 Inter,sans-serif;letter-spacing:.11em;
  text-transform:uppercase;color:#7FC0C4;font-style:normal;white-space:nowrap}
.coll .r .s em{font:400 9.5px/1.2 Inter,sans-serif;font-style:normal;
  color:#8A7E70;white-space:nowrap;font-variant-numeric:lining-nums}
.coll .r.ricevuto .s i{color:#A79C8D}
.coll .r.manca .n{color:#B3A795}
.coll .r.manca .s i{color:#C8A24E}
.coll .r.manca .s em{color:#C8A24E}
.coll .r.chiude{border-bottom:0;margin-top:8px;padding-top:14px;
  border-top:1px solid rgba(255,240,215,.22)}
.coll .r.chiude .s i{color:#EDE7DF}
.promo{margin-top:14px;padding:12px 13px;background:rgba(16,96,104,.20);
  border-radius:8px;box-shadow:inset 0 0 0 1px rgba(127,192,196,.28)}
.promo div{font-size:12px;line-height:1.5;color:#DCEFF0}
.promo div + div{margin-top:6px}

/* IL CHIUDI E' UN TONDO SULLA FOTO. Era una linguetta rettangolare
   incastrata nell'angolo: tagliava il raggio della carta proprio dove il
   raggio si deve vedere. */
#chiudi-carta{position:absolute;top:10px;right:10px;z-index:3;border:0;
  cursor:pointer;width:30px;height:30px;border-radius:50%;padding:0;
  background:rgba(250,248,245,.90);color:var(--testo);
  box-shadow:0 1px 4px rgba(0,0,0,.22);
  display:grid;place-items:center;font:400 15px/1 Inter,sans-serif;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
/* il tondo resta 30 — piu' grande diventerebbe una pastiglia sulla foto —
   e il bersaglio diventa 44 con sette punti di aria tutt'intorno, presi
   sul bordo della carta dove non c'e' nient'altro da colpire */
#chiudi-carta::before{content:"";position:absolute;inset:-7px;border-radius:50%}
#chiudi-carta:active{transform:scale(.9);background:var(--cipria)}

/* ══════════════════════════════════════════════════════════════
   LA GALLERIA — quattro cose che non c'erano, e una che mentiva

   Com'era: una rotaia a scorrimento nativo su nero puro, i puntini in
   basso, e l'unica uscita una scritta CHIUDI in alto a destra, misurata
   a 9 punti dal bordo e larga 73,8x41 — cioe' nell'angolo piu' lontano
   dal pollice di una mano che tiene il telefono. Il pizzico non c'era:
   quello che c'e' e' agganciato a #stanza (la scena in tre dimensioni) e
   qui sopra non arriva. Una fotografia di un gioiello che non si puo'
   ingrandire e' l'unica cosa che si va a guardare in una galleria.

   Com'e': la fotografia si ingrandisce col pizzico e col doppio tocco, e
   da ingrandita si sposta col dito. Si esce trascinando in giu' — la
   foto segue il dito e il velo si schiarisce mentre scende, cosi' si
   vede dove sta andando prima di lasciare — o con una X in basso al
   centro, dentro un bersaglio da 44, dove il pollice arriva senza
   cambiare presa. La didascalia sta SOTTO la foto invece che sopra, e il
   fondo non e' piu' il nero puro: e' #1C1813, lo stesso nero caldo del
   retro della carta, perche' e' lo stesso oggetto visto dall'altra
   parte.
   Lo scorrimento nativo se ne va: `touch-action:none` serve al pizzico,
   e con lo scorrimento nativo acceso il browser si prende il gesto e lo
   spostamento a foto ingrandita non si puo' piu' fare. La fila si muove
   allora con un trasformo, che e' anche l'unico modo di farla scendere
   insieme al velo.
   ══════════════════════════════════════════════════════════════ */
#galleria{position:fixed;inset:0;z-index:8;
  background:rgba(28,24,19,var(--velo,1));
  display:flex;flex-direction:column;touch-action:none;overflow:hidden}
#galleria[hidden]{display:none}
/* `touch-action:none` sta sia sul contenitore sia sulla rotaia: il
   browser la legge sull'elemento che riceve il tocco, e il tocco cade
   sulla rotaia o su una sua figura — non sul contenitore */
#rotaia{flex:1;display:flex;min-height:0;touch-action:none;
  transform:translate3d(var(--scorri,0px), var(--giu,0px), 0)}
#rotaia.posa{transition:transform .34s cubic-bezier(.2,.7,.3,1)}
#rotaia figure{flex:0 0 100%;min-width:0;display:grid;
  grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:14px;
  padding:calc(18px + max(env(safe-area-inset-top), 8px)) 18px 6px}
#rotaia img{min-height:0;max-width:100%;max-height:100%;object-fit:contain;
  -webkit-user-drag:none;user-select:none;
  transform-origin:center center}
#rotaia img.posa{transition:transform .26s cubic-bezier(.2,.7,.3,1)}
/* LA DIDASCALIA STA SOTTO LA FOTO, e sta solo qui. Sulla carta il
   cartoncino non la porta: e' una nota sul mestiere («lo scatto ritrae la
   collezione, non il solo pezzo») e va detta dove si sta guardando lo
   scatto, non dove si sta guardando il pezzo. */
#rotaia figcaption{font-size:11.5px;line-height:1.45;color:#A59A8C;
  text-align:center;max-width:36em;
  transition:opacity var(--stato) linear}
#rotaia.grande figcaption{opacity:0}
#gal-fondo{flex:none;display:flex;flex-direction:column;align-items:center;gap:11px;
  padding:8px 0 calc(10px + max(env(safe-area-inset-bottom), 8px));
  transform:translateY(var(--giu,0px))}
#punti{display:flex;justify-content:center;gap:7px;pointer-events:none}
#punti i{width:5px;height:5px;border-radius:50%;background:rgba(255,240,215,.28);
  transition:background var(--stato) linear}
#punti i.qui{background:#EDE7DF}
/* L'USCITA STA IN BASSO AL CENTRO. Non e' un gusto: e' dove arriva il
   pollice di chi regge il telefono con una mano, e una galleria a
   schermo pieno si guarda con una mano. */
#chiudi-galleria{width:44px;height:44px;border-radius:50%;border:0;padding:0;
  cursor:pointer;background:rgba(255,240,215,.10);color:#EDE7DF;
  display:grid;place-items:center;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
#chiudi-galleria svg{width:15px;height:15px}
#chiudi-galleria svg path{stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;fill:none}
#chiudi-galleria:active{transform:scale(.9);background:rgba(255,240,215,.22)}

/* ══════════════════════════════════════════════════════════════
   IL RISCONTRO — una striscia in basso, e si puo' disfare

   Prima non c'era. «Rimuovi» non faceva niente, «copia il link» non
   faceva niente, e i due che qualcosa la facevano — girare la carta —
   la facevano in silenzio. Il verdetto di Massimo dice che zero
   conferme fanno sembrare un sito quello che dovrebbe essere
   un'applicazione, ed e' esattamente quello che si vedeva.
   Ma una conferma non e' una spunta animata in mezzo allo schermo: e'
   una riga in basso che dice cosa e' successo e — quando l'azione si
   puo' disfare — offre di disfarla. Sta sopra il menu, dura quattro o
   cinque secondi, si ferma se ci tieni il dito sopra (chi legge non
   deve rincorrere) e se ne va se lo si butta giu' col dito.
   `aria-live="polite"` perche' chi non la vede la senta, e «polite» e
   non «assertive» perche' non e' un allarme: e' un riscontro.
   ══════════════════════════════════════════════════════════════ */
#toast{position:fixed;left:50%;z-index:9;pointer-events:none;
  bottom:calc(58px + max(env(safe-area-inset-bottom), 9px));
  width:min(360px, calc(100vw - 28px));
  transform:translate(-50%, 16px);opacity:0;
  transition:opacity var(--esce) var(--curva-esce),
             transform var(--esce) var(--curva-esce)}
#toast.qui{opacity:1;transform:translate(-50%, var(--giu, 0px));pointer-events:auto;
  transition-duration:var(--entra);transition-timing-function:var(--curva-entra)}
#toast.tira{transition:none}
#toast .corpo{display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 15px;border-radius:10px;
  background:#1C1813;color:#EDE7DF;
  box-shadow:0 2px 6px -1px rgba(0,0,0,.30), 0 18px 34px -16px rgba(0,0,0,.60)}
#toast .detto{flex:1;min-width:0;font:400 12px/1.35 Inter,sans-serif}
/* IL DISFARE HA IL PESO DI UN COMANDO, non di un link. E' l'unica cosa
   sulla striscia che si tocca: maiuscoletto, il turchese della firma, e
   il suo bersaglio da 44 preso con lo pseudo, che la pastiglia resta
   della misura del testo. */
#toast .disfa{position:relative;flex:none;border:0;cursor:pointer;
  padding:8px 10px;border-radius:7px;background:rgba(127,192,196,.14);
  font:700 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:#7FC0C4;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
#toast .disfa::before{content:"";position:absolute;inset:-9px -6px}
#toast .disfa:active{transform:scale(.94);background:rgba(127,192,196,.26)}
/* LA STRISCIA NON SI NASCONDE CON `hidden`, e non e' pigrizia: `hidden`
   porta `display:none`, e un elemento in `display:none` esce
   dall'albero di accessibilita'. Un'area viva dichiarata li' dentro non
   viene osservata da nessun lettore di schermo — si annuncia solo cio'
   che CAMBIA dentro una regione gia' presente. Quindi la striscia sta
   sempre nel documento, vuota e trasparente, e quando arriva un testo
   quel testo e' una modifica dentro una regione osservata. Il corpo, a
   opacita' zero, non prende tocchi e non ha figli raggiungibili col
   tabulatore: il tasto «annulla» viene creato con la striscia e tolto
   quando se ne va. */

/* ══════════════════════════════════════════════════════════════
   IL TELEFONO CORICATO — 844x390

   Misurato prima: alla carta lo schermo concede 338 punti e il contenuto
   ne vuole 489. Il nastro delle azioni cadeva a 385, cioe' quarantasette
   punti SOTTO il bordo della carta, e niente diceva che ci fosse. Il
   verdetto di Massimo e' che le opzioni si devono vedere subito: coricato
   non si vedevano affatto.
   Due strade c'erano: due colonne con la foto a sinistra, o la foto
   ridotta a una fascia. Le due colonne pero' non garantiscono niente —
   spostano il contenuto, non lo accorciano, e con una dedica lunga il
   nastro torna sotto la piega. Quella che TIENE IL NASTRO SEMPRE
   VISIBILE e' un'altra: il nastro esce dallo scorrimento e si incolla in
   fondo alla carta, come fanno gia' i tasti sul retro. La foto intanto
   diventa una fascia da 96 punti — coricato un ritratto a 16:8 si prende
   la meta' dell'altezza disponibile per dire quello che una fascia dice
   lo stesso — e il contenuto scorre sotto la fascia e sopra il nastro.
   ══════════════════════════════════════════════════════════════ */
@media (orientation: landscape) and (max-height: 520px){
  #carta-pezzo{padding:12px 16px}
  #porta{max-width:430px}
  #ritratto{aspect-ratio:auto;height:96px;object-position:center 42%}
  .riga-foto.senza-foto{aspect-ratio:auto;height:96px}
  #carta-dentro{padding:11px 16px 2px}
  #carta-dentro .nome{font-size:23px}
  #dedica{margin:11px 16px 12px;padding:11px 13px}
  #dedica p{font-size:14px}
  /* IL NASTRO SI INCOLLA IN FONDO. Va a tutta larghezza, se no il
     contenuto che scorre gli passerebbe di fianco; gli angoli in basso
     glieli taglia l'`overflow:hidden` della faccia, quindi il raggio
     della carta resta. */
  #voci.nastro{position:sticky;bottom:0;z-index:2;margin:12px 0 0;
    border-radius:0;box-shadow:0 -1px 0 var(--filo)}
  #voci.nastro button{padding:10px 4px 9px;gap:6px}
  #voci .segno{width:19px;height:19px}
  #foglio .fronte.senza-dedica .dentro-carta{padding-bottom:0}
}

/* ── «C'E' ALTRO SOTTO» ───────────────────────────────────────────
   Una colonna che scorre e non lo dice e' una colonna che finisce li':
   chi guarda non prova nemmeno. Un velo di carta in fondo, acceso solo
   quando c'e' davvero qualcosa da raggiungere e spento quando si e'
   arrivati in fondo, e' il segno piu' piccolo che dice la cosa giusta —
   e sta SOTTO il nastro incollato, che ha lo strato sopra: cosi' il velo
   si vede sfumare proprio dove il contenuto sparisce dietro i comandi. */
#foglio .piega{position:absolute;left:0;right:0;bottom:0;height:42px;
  pointer-events:none;z-index:1;opacity:0;
  transition:opacity var(--stato) linear;
  background:linear-gradient(to top, var(--carta) 18%, rgba(250,248,245,0))}
#foglio .retro .piega{background:linear-gradient(to top, #1C1813 18%, rgba(28,24,19,0))}
#foglio .faccia.scorre .piega{opacity:1}

/* ══════════════════════════════════════════════════════════════
   LA SCRIVANIA — quello che esiste solo dove c'e' un puntatore

   Il pezzo e' nato per un telefono e si vede: contato prima di questo
   blocco, zero regole sotto `@media (hover:hover)`, zero
   `:focus-visible`, e il cursore sulla stanza a `auto`. Su un portatile
   l'applicazione non diceva mai che cosa fosse toccabile, e chi naviga
   col tasto di tabulazione non vedeva mai DOVE si trovava.
   L'hover sta dentro la sua media query perche' su un telefono «hover»
   vuol dire «l'ultima cosa che hai toccato resta accesa»: uno stato che
   non si spegne piu' finche' non si tocca altrove.
   ══════════════════════════════════════════════════════════════ */
@media (hover:hover) and (pointer:fine){
  #menu button:hover{color:var(--testo)}
  #menu button:hover::before{left:36%;right:36%;opacity:.5}
  #dietro:hover{opacity:.72}
  #vesti button:hover{transform:scale(1.10)}
  #maniglia:hover span{background:var(--voce)}
  #tasto-insieme:hover{border-color:var(--firma);background:rgba(255,255,255,.8)}
  #chiudi-galleria:hover{background:rgba(255,240,215,.20)}
  #accanto .carta:hover{box-shadow:0 0 0 1px rgba(255,240,215,.30)}
  #insieme button:hover{background:#0C4C52}
  #retro-fondo button:hover{background:rgba(255,240,215,.18)}
  #ritratto:hover{opacity:.93}
  #chiudi-carta:hover{background:#fff}
}
/* L'ANELLO E' IL TURCHESE DELLA FIRMA, e si vede solo a chi arriva con la
   tastiera: `:focus-visible` non scatta sul clic del mouse ne' sul tocco,
   quindi non c'e' niente da nascondere a mano dopo. */
:focus-visible{outline:2px solid var(--firma);outline-offset:2px;border-radius:3px}
#galleria :focus-visible, #foglio .retro :focus-visible,
#accanto :focus-visible{outline-color:#7FC0C4}
/* ── E NON CINGE UN POZZO ─────────────────────────────────────────
   La regola qui sopra e' globale, e va bene: si vede solo a chi arriva
   con la tastiera. Ma la carta del pezzo e la galleria portano il fuoco
   su un CONTENITORE — `.faccia` e `#galleria`, tutti e due con
   `tabindex="-1"` — per dire al lettore di schermo dove si e' finiti.
   Il commento di `apriCarta` dava per scontato che un foglio con
   `tabindex="-1"` ricevesse il fuoco senza anello: non e' vero quando
   la carta si apre con INVIO. Chrome eredita la modalita' tastiera
   dall'ultimo tocco, `:focus-visible` scatta anche sul pozzo, e la
   carta intera esce cinta di turchese — misurato, un contorno da 2
   punti attorno a tutti i 320x520 del foglio. Un contenitore che
   riceve il fuoco come pozzo non e' un controllo, e un anello attorno a
   un intero pannello non dice niente a nessuno: si spegne LI', e resta
   su tutti i comandi veri che ci stanno dentro — il primo tabulatore
   accende ancora il tondo che chiude. */
#foglio .faccia:focus-visible, #galleria:focus-visible{outline:none}

/* ══════════════════════════════════════════════════════════════
   LE VARIANTI DI GUSTO — due decisioni aperte, e il loro guardaroba

   Qui non si sceglie: si COSTRUISCE il ventaglio. Due decisioni
   estetiche del Cofanetto sono aperte, e ognuna ha tre forme
   strutturalmente diverse — non tre tarature dello stesso disegno —
   montate tutte e tre dentro l'app, sul materiale vero, cosi' Massimo
   sceglie guardando e non immaginando.
     · `?sugg=a|b|c`  — che FORMA hanno i suggerimenti (di serie: b)
     · `?carta=foto|finestra|due` — cosa APRE la carta (di serie: foto)
   La variante si scrive su <html data-sugg/data-carta>, e tutto quello
   che segue e' agganciato li': cambiare l'attributo — che e' quello che
   fa il globale `window.__sugg` — ricolora l'interfaccia senza
   ricaricare e senza che nessuno debba ricostruire un pezzo di DOM.
   ══════════════════════════════════════════════════════════════ */

/* ── 1a · LA RIGA IN ALTO ─────────────────────────────────────────
   Il pattern di settore, verificato su Cartier, Mejuri e Boucheron: i
   suggerimenti non stanno MAI accanto alla foto del prodotto. Qui la
   tesi e' portata al limite — non stanno nemmeno in un pannello: sono
   una riga di testo nel cromo, sotto la barra «indietro», e la scena
   resta completamente libera. Costa una riga di undici punti e non
   toglie un pixel all'ambiente.
   IL VELO DI CARTA SI ALLUNGA. #alto e' un gradiente che svanisce: una
   riga di testo che cade nella parte trasparente finisce sopra la
   stanza, e sul crema del bancone non si legge piu'. Con la riga
   accesa la carta piena arriva al 74 per cento dell'altezza della
   fascia, cioe' sotto la riga, e la misura non dipende piu' da cosa c'e'
   dietro. */
#riga-sugg{display:none}
:root[data-sugg="a"] #alto{flex-wrap:wrap;padding-bottom:26px;
  background:linear-gradient(to bottom, var(--carta) 80%,
             rgba(250,248,245,.82) 92%, transparent)}
:root[data-sugg="a"] #riga-sugg{display:flex;flex-wrap:wrap;
  align-items:baseline;gap:2px 7px;width:100%;order:3;margin-top:10px;
  pointer-events:auto;
  font:700 9px/1.5 Inter,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:var(--voce)}
:root[data-sugg="a"] #riga-sugg[hidden]{display:none}
/* I TRE COLORI DELLA RIGA LI HA DECISI LA MISURA, non il gusto.
   Prima: occhiello e prezzo a `--tenue`, che su questo velo di carta
   misura 3,22:1 — sotto la soglia che il progetto si e' dato, e proprio
   sul prezzo, che e' un dato. Adesso l'occhiello prende `--voce` (5,4),
   il nome `--testo` (che e' anche il segno che quella parte si tocca) e
   il prezzo `--quieto` (5,5). Resta tenue solo il puntino di mezzo, che
   non e' testo: e' il segno che separa due voci, e infatti e' nascosto a
   chi legge con lo schermo. */
#riga-sugg .eco, #riga-sugg .punto{flex:none}
#riga-sugg .punto{color:var(--tenue)}
/* il suggerimento e' TESTO toccabile, non un bottone: nessuna pastiglia,
   nessun contorno. Quello che lo dichiara comando e' il colore della voce
   e un bersaglio da 44 preso con uno pseudo invisibile, come tutti gli
   altri comandi piccoli di questa schermata. */
#riga-sugg button{position:relative;border:0;background:none;padding:0;
  cursor:pointer;font:inherit;letter-spacing:inherit;color:var(--testo);
  transition:opacity var(--tocco) linear}
#riga-sugg button::after{content:"";position:absolute;inset:-13px -6px}
#riga-sugg button em{font-style:normal;color:var(--quieto);
  font-variant-numeric:lining-nums}
#riga-sugg button:active{opacity:.5}

/* ── 1b · LE CARTE VELATE, e il contrasto risolto sotto il testo ──
   Il `brightness(.34)` nel filtro risolveva la leggibilita' chiudendo
   di due stop TUTTA la carta: sul crema del bancone usciva un blocco
   scuro, e il verdetto e' stato «due blocchi neri, bocciata».
   Qui il rimedio e' locale: il filtro torna a essere solo un velo
   (sfocatura e desaturazione, niente esposizione), e sotto le TRE RIGHE
   DI TESTO — solo li' — si mette un letto scuro breve, che sfuma in
   quattordici punti dentro la fotografia. La carta resta un velo dove e'
   fotografia, e le scritte hanno il loro fondo dove sono scritte.
   Il letto e' all'80 per cento: misurato, anche col caso peggiore — un
   fondo bianco pieno dietro — l'occhiello resta sopra 4,5:1. */
:root[data-sugg="b"] #accanto .carta{
  backdrop-filter:blur(9px) saturate(.85);
  -webkit-backdrop-filter:blur(9px) saturate(.85)}
#accanto .carta .dice{position:relative;margin:0 -8px -8px;padding:6px 8px 8px;
  background:rgba(8,6,4,.80)}
#accanto.steso .carta .dice{margin:0 -7px -7px;padding:5px 7px 7px}
#accanto .carta .dice::before{content:"";position:absolute;left:0;right:0;
  bottom:100%;height:14px;pointer-events:none;
  background:linear-gradient(to top, rgba(8,6,4,.80), rgba(8,6,4,0))}

/* ── 1c · IL RAIL NELLA SCHEDA ────────────────────────────────────
   La forma che i cataloghi veri usano davvero: i pezzi che ci stanno
   insieme in fila SOTTO la scheda, non addosso al prodotto. La scena
   torna completamente pulita e i suggerimenti non sono piu' un
   sovrimpresso — sono contenuto della scheda, e ci restano anche a
   scheda ritirata, perche' il rail sta fuori dal blocco che si chiude.
   La card e' la stessa del Cofanetto: foto 4:5 sul fondo di carta,
   nome in Bodoni a 13, prezzo a 11. Niente riquadro bianco: la carta e'
   gia' la pagina.
   E LA LISTA DENTRO LA SCHEDA NON SI RIPETE. «Con questo ci sta anche»
   e il rail sono lo stesso dato: qui il rail E' quella lista, quindi
   l'occhiello e le righe escono e di #insieme resta solo il suo tasto. */
#rail-sugg{display:none}
:root[data-sugg="c"] #rail-sugg{display:flex;gap:10px;margin-top:12px;
  pointer-events:auto;overflow-x:auto;scrollbar-width:none}
:root[data-sugg="c"] #rail-sugg[hidden]{display:none}
#rail-sugg::-webkit-scrollbar{display:none}
#rail-sugg .card{flex:0 0 80px;border:0;padding:0;background:none;
  cursor:pointer;text-align:left;
  transition:transform var(--tocco) var(--curva-entra)}
#rail-sugg .card:active{transform:scale(.97)}
#rail-sugg .card img{display:block;width:100%;aspect-ratio:4/5;
  object-fit:cover;background:var(--cipria)}
#rail-sugg .card .vuota{display:block;width:100%;aspect-ratio:4/5;
  background:var(--cipria);box-shadow:inset 0 0 0 1px var(--filo)}
#rail-sugg .card .dati{display:block;min-width:0}
#rail-sugg .card .n{display:block;margin-top:9px;
  font:400 13px/1.15 Bodoni,Didot,Georgia,serif;color:var(--testo)}
#rail-sugg .card .p{display:block;margin-top:3px;
  font:400 11px/1 Inter,sans-serif;color:var(--quieto);
  font-variant-numeric:lining-nums}
:root[data-sugg="c"] #insieme .eco,
:root[data-sugg="c"] #insieme-righe{display:none}
:root[data-sugg="c"] #insieme{margin-top:6px;padding-top:0;border-top:0}

/* ── 2 · LA CARTA CON LA FINESTRA ─────────────────────────────────
   La fotografia esce e al suo posto resta un RITAGLIO: il velo e la
   faccia della carta hanno un buco (clip-path a regola pari-dispari,
   scavato dal codice sulla misura vera del riquadro), e dietro ci sta il
   pezzo in tre dimensioni, che continua a girare col dito.
   Tre conseguenze, tutte da qui:
     · il buco non prende i tocchi — il clip taglia anche il collaudo
       del puntatore — e sotto non ci deve essere nessun altro strato
       che li raccolga: #carta-pezzo diventa un telaio trasparente e il
       tocco lo prendono solo il velo (che chiude) e il foglio;
     · la fotografia non e' piu' la porta della galleria. La porta
       scende sotto la finestra (#strisciafoto), fuori dal buco;
     · il tondo che chiude non puo' stare SULLA fotografia, perche' li'
       non c'e' piu' carta: la finestra si stacca dal bordo alto e si
       apre una fascia di carta dove il tondo ha di che appoggiarsi.
   Il filetto attorno al ritaglio e' un `outline`, non un bordo: si
   disegna FUORI dalla scatola, cioe' appena fuori dal buco, ed e'
   l'unica cosa del riquadro che il clip non porta via. */
:root[data-carta="finestra"] .riga-foto,
:root[data-carta="due"] .riga-foto{margin:44px 12px 0;border-radius:8px;
  outline:1px solid var(--filo);outline-offset:0}
:root[data-carta="finestra"] #ritratto,
:root[data-carta="due"] #ritratto{border-radius:8px;visibility:hidden}
:root[data-carta="finestra"] .riga-foto .quante,
:root[data-carta="due"] .riga-foto .quante{display:none}
:root[data-carta="finestra"] .riga-foto.senza-foto,
:root[data-carta="due"] .riga-foto.senza-foto{border-bottom:0}
:root[data-carta="finestra"] #carta-pezzo,
:root[data-carta="due"] #carta-pezzo{pointer-events:none}
:root[data-carta="finestra"] #carta-pezzo .velo,
:root[data-carta="due"] #carta-pezzo .velo,
:root[data-carta="finestra"] #porta,
:root[data-carta="due"] #porta{pointer-events:auto}
/* girata, la finestra non esiste: il retro e' pieno e deve coprire tutto.
   Si toglie il clip alla faccia, cosi' anche a meta' giravolta non si
   apre un buco in mezzo al cartoncino. */
#foglio.girata .fronte{clip-path:none !important}

/* `flex:none` non e' un dettaglio: la colonna della carta e' un flex, e
   un figlio senza questa riga si SCHIACCIA quando il contenuto supera
   l'altezza concessa. Misurato: la striscia delle miniature usciva alta
   quattordici punti invece di cinquantacinque, tagliata a meta' dal nome
   del pezzo. Tutti gli altri figli della colonna ce l'hanno gia'. */
#strisciafoto{display:none;flex:none}
:root[data-carta="finestra"] #strisciafoto,
:root[data-carta="due"] #strisciafoto{display:flex;flex:none;
  margin:10px 12px 0}
:root[data-carta="finestra"] #strisciafoto[hidden],
:root[data-carta="due"] #strisciafoto[hidden]{display:none}
:root[data-carta="finestra"] #strisciafoto{justify-content:flex-end}
#strisciafoto .tutte{position:relative;border:0;background:none;cursor:pointer;
  padding:0 0 3px;font:700 8.5px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--firma);
  border-bottom:1px solid var(--firma);
  transition:opacity var(--tocco) linear}
#strisciafoto .tutte::after{content:"";position:absolute;inset:-15px -12px}
#strisciafoto .tutte:active{opacity:.55}
:root[data-carta="due"] #strisciafoto{gap:7px;overflow-x:auto;
  scrollbar-width:none}
#strisciafoto::-webkit-scrollbar{display:none}
#strisciafoto .mini{flex:0 0 44px;border:0;padding:0;background:none;
  cursor:pointer;transition:transform var(--tocco) var(--curva-entra)}
#strisciafoto .mini img{display:block;width:44px;height:55px;object-fit:cover;
  border-radius:3px;background:var(--cipria);
  box-shadow:0 0 0 1px rgba(26,22,20,.10)}
#strisciafoto .mini:active{transform:scale(.94)}

/* ── CORICATO ─────────────────────────────────────────────────────
   Due cose cambiano forma, e per la stessa ragione: coricato lo schermo
   ha 390 punti di altezza e il cromo se ne prende gia' 195.
   · LA CARTA ha 366 punti in tutto: la fascia sopra la finestra si
     stringe e la striscia delle foto sta piu' vicina.
   · IL RAIL non puo' restare una card verticale. Misurato: con la foto
     4:5 in piedi il cartellino arrivava a 359 punti su 390 — il 92 per
     cento dello schermo per due suggerimenti, e dell'ambiente non
     restava niente. Coricata, la card si CORICA anche lei: la foto a
     sinistra, il nome e il prezzo a destra. Stesso rapporto 4:5, stessa
     tipografia, cinquantasei punti invece di centocinquantatre'. */
@media (orientation: landscape) and (max-height: 520px){
  :root[data-carta="finestra"] .riga-foto,
  :root[data-carta="due"] .riga-foto{margin:34px 12px 0}
  :root[data-sugg="c"] #rail-sugg{margin-top:9px;gap:14px}
  #rail-sugg .card{flex:0 0 auto;display:flex;align-items:center;gap:9px;
    max-width:210px}
  #rail-sugg .card img, #rail-sugg .card .vuota{width:38px;flex:none}
  #rail-sugg .card .dati{min-width:0}
  #rail-sugg .card .n{margin-top:0;font-size:12.5px}
  #rail-sugg .card .p{margin-top:2px;font-size:10.5px}
  :root[data-carta="finestra"] #strisciafoto,
  :root[data-carta="due"] #strisciafoto{margin:8px 12px 0}
  #strisciafoto .mini{flex:0 0 38px}
  #strisciafoto .mini img{width:38px;height:47px}
}
@media (hover:hover) and (pointer:fine){
  #riga-sugg button:hover{opacity:.66}
  #rail-sugg .card:hover .n{color:var(--firma)}
  #strisciafoto .tutte:hover{opacity:.75}
}

/* ══════════════════════════════════════════════════════════════
   MOVIMENTO RIDOTTO

   Contate prima di questo blocco: zero occorrenze di
   `prefers-reduced-motion` in tutto il file. Chi ha chiesto meno
   movimento al sistema operativo — e lo chiede chi dal movimento sta
