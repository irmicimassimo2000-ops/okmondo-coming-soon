   c'e': deve far USCIRE un espositore e ENTRARE il prossimo. Servono quindi
   piu' espositori, e gli altri sono copie dello stesso modello — geometrie
   condivise, nessun byte in piu' da scaricare.
   Quello che cambia fra una copia e l'altra e' il METALLO del gioiello, che
   il catalogo dichiara: una collana d'acciaio dorato e una d'argento non
   sono la stessa collana. */
const banchi = {}, merci = {}, CENTRI = {}, CASA = {};
/* LE POSE STESE, una per pezzo dove esiste. Massimo ha deciso che nella
   vista del pezzo singolo il gioiello si isola davvero; ma una collana la
   forma ce l'ha dal busto, e tolto quello restava un filo d'oro
   accartocciato a mezz'aria. Allora il modello porta DUE percorsi della
   stessa catena: quello addosso e quello steso. Qui si tiene il secondo,
   spento, accanto al primo. Le famiglie che reggono da sole — anelli,
   orecchini, orologi — non ne hanno e non ne hanno bisogno. */
const pose = {};
const stesa = (fam, k) => ((pose[fam] || [])[k]) || null;
const PASSO_BANCO = {};

/* ── QUELLO CHE E' USCITO DAL COFANETTO ───────────────────────────
   «Rimuovi» era un tasto morto: apriva il retro, spiegava cosa comporta,
   e poi il tasto rosso non faceva nulla. Perche' funzioni serve un posto
   dove scrivere che quel pezzo non c'e' piu', e il posto naturale e'
   questo: i pezzi sono gia' elencati per FAMIGLIA e INDICE — `merci`,
   `RIPIANI`, `SCHEDA` usano tutti la stessa coppia — quindi lo stato usa
   la stessa chiave, «famiglia:indice», e non serve inventare nient'altro.
   Non si cancella niente: si mette da parte. L'annulla della striscia in
   basso ha cinque secondi per riportarlo dentro, e anche dopo il pezzo
   si rimette scansionando il suo codice, che e' quello che il retro
   promette. */
const TOLTI = new Set();
const cTolto = (fam, k) => TOLTI.has(fam + ":" + k);
/* le mesh dei pezzi tolti si rispengono DOPO ogni riaccensione generale:
   `mostraTutto` riaccende tutto il gruppo con un traverse, e senza questo
   passo un pezzo tolto tornerebbe in vetrina al primo passo indietro */
function applicaTolti(){
  if(!TOLTI.size) return;
  for(const f of FAMIGLIE){
    (merci[f.id] || []).forEach((o, k) => {
      if(o && cTolto(f.id, k)) o.traverse(m => { if(m.isMesh) m.visible = false; });
    });
    (pose[f.id] || []).forEach((o, k) => {
      if(o && cTolto(f.id, k)) o.traverse(m => { if(m.isMesh) m.visible = false; });
    });
  }
}

/* SI APPARECCHIA UNA FAMIGLIA PER VOLTA. Prima si aspettavano tutte e
   cinque e si stendeva il banco in un colpo; a tappe ognuna si siede al
   suo posto appena arriva, e le altre non devono esserci. */
function apparecchia(solo){
  for(const f of (solo ? [solo] : FAMIGLIE)){
    if(!gruppi[f.id]) continue;
    const base = gruppi[f.id], quanti = COPIE[f.id];
    const lista = [base];
    for(let k = 1; k < quanti; k++){
      const c = base.clone(true);
      c.userData = Object.assign({}, base.userData);
      scena.add(c);
      lista.push(c);
    }
    banchi[f.id] = lista;
    // la merce, banco per banco: un clone porta il SUO pezzo, non quello
    // dell'originale, o toccandone uno si aprirebbe sempre il primo
    merci[f.id] = [];
    lista.forEach((g, k) => {
      const dentro = [];
      g.traverse(o => { if(/^pezzo\d\d/.test(o.name)) dentro.push(o); });
      dentro.sort((a, b) => a.name.localeCompare(b.name));
      const col = (METALLI[f.id] || [])[k];
      if(quanti > 1 && col !== undefined)
        dentro.forEach(o => o.traverse(m => {
          if(m.isMesh && m.material && m.material.metalness > 0.4){
            m.material = m.material.clone();
            m.material.color.setHex(col);
          }
        }));
      const stese = [];
      g.traverse(o => { if(/^posa\d\d/.test(o.name)) stese.push(o); });
      stese.sort((a, b) => a.name.localeCompare(b.name));
      if(quanti > 1 && col !== undefined)
        stese.forEach(o => o.traverse(m => {
          if(m.isMesh && m.material && m.material.metalness > 0.4){
            m.material = m.material.clone();
            m.material.color.setHex(col);
          }
        }));
      stese.forEach(o => { o.visible = false; });
      merci[f.id].push(...dentro);
      (pose[f.id] ||= []).push(...stese.length ? stese
        : dentro.map(() => null));
      g.userData.pezzi = dentro;
    });
    PASSO_BANCO[f.id] = base.userData.largo + 0.055;
    // DOVE STA DI CASA questa famiglia sul banco. Serve come riferimento
    // fisso per far scorrere le copie: prendere ogni volta la posizione
    // della prima copia non funziona, perche' la prima copia e' anche una
    // di quelle che si spostano — si sposta lei, e tutte le altre partono
    // da un punto che si e' gia' mosso. Il banco scappava via di lato un
    // fotogramma alla volta.
    CASA[f.id] = base.position.x;
  }
  /* DOVE STA OGNI STAZIONE: si MISURA sulla merce, non si calcola.
     Il passo lo ricavavo dividendo la larghezza dell'espositore per il
     numero di fermate, e non e' la stessa cosa: i tre nastri stanno a
     cinquantadue millimetri l'uno dall'altro, la formula ne dava sessanta,
     e la macchina si fermava otto millimetri accanto a ogni nastro invece
     che davanti. Il centro vero di una stazione e' il centro della roba che
     ci sta sopra. */
  scena.updateMatrixWorld(true);
  const scatola = new THREE.Box3(), punto = new THREE.Vector3();
  for(const f of (solo ? [solo] : FAMIGLIE)){
    if(!gruppi[f.id]) continue;
    CENTRI[f.id] = stazioni(f.id).map(gruppo => {
      scatola.makeEmpty();
      for(const k of gruppo) if(merci[f.id][k]) scatola.expandByObject(merci[f.id][k]);
      return scatola.isEmpty() ? gruppi[f.id].position.x
                               : scatola.getCenter(punto).x;
    });
  }
}

/* la x di una stazione, anche fra una e l'altra e anche oltre i capi */
function centroStazione(fam, dove){
  const c = CENTRI[fam] || [];
  if(!c.length) return gruppi[fam].position.x;
  if(c.length === 1) return c[0];
  const i0 = Math.max(0, Math.min(c.length - 2, Math.floor(dove)));
  return c[i0] + (c[i0 + 1] - c[i0]) * (dove - i0);
}

/* LE STAZIONI. Una stazione e' quello che uno swipe sposta:
   · sugli anelli e' un ANELLO — cinque colonnine, cinque fermate;
   · sugli orecchini e' un NASTRO, e dentro ci stanno tre paia;
   · sulle collane e sui bracciali e' un ESPOSITORE INTERO, uno per pezzo. */
function stazioni(fam){
  if(fam === "orecchini") return [[0,1,2],[3,4,5],[6,7,8]];
  return (merci[fam] || []).map((_, i) => [i]);
}
function bancoDi(k){
  const b = banchi[attiva] || [];
  if(!b.length) return null;
  const q = COPIE[attiva] > 1 ? k : 0;
  return b[Math.min(q, b.length - 1)];
}

/* ═══════════════════════════════════════════════════════════════
   IL CARICATORE A TAPPE.
   Si scarica la famiglia che si sta guardando, si toglie il velo, e le
   altre arrivano dietro mentre uno gia' si muove. La riga sotto al velo
   e' sui BYTE — il manifesto porta il totale esatto prima che arrivi
   il primo — e il velo non e' mai eterno: se qualcosa non arriva lo
   dice in italiano e si puo' riprovare.
   ═══════════════════════════════════════════════════════════════ */
/* LE LARGHEZZE SONO UNA COSTANTE, e non per pigrizia: la fila si dispone
   con le larghezze di TUTTE E CINQUE, e a tappe non ci sono. Misurate
   sull'app viva (userData.largo), non stimate: la somma piu' quattro
   volte l'aria fa 0,942112, che e' il LARGO_BANCO di prima, e il busto
   cade a -0,376 come cadeva. Se un .glb cambia forma, questa riga si
   rimisura. */
const LARGHEZZE = {busto:0.190112, orecchini:0.150000, anelli:0.150000,
                   rampa:0.156000, orologi:0.176000};
const VOCI = {busto:"le collane…", orecchini:"gli orecchini…",
              anelli:"gli anelli…", rampa:"i bracciali…",
              orologi:"gli orologi…"};
const POSTO = {}, arrivate = new Set(), inCorso = {};
let inCoda = [], codaViva = false;

function disponi(){
  const ARIA = 0.030;
  const l = FAMIGLIE.map(f => LARGHEZZE[f.id]);
  const totale = l.reduce((a, b) => a + b, 0) + ARIA * (l.length - 1);
  LARGO_BANCO = totale;
  let x = -totale / 2;
  FAMIGLIE.forEach((f, i) => { POSTO[f.id] = x + l[i] / 2; x += l[i] + ARIA; });
}

/* UNA FAMIGLIA. Scarica, decodifica, la mette al suo posto — che era gia'
   riservato — e apparecchia solo lei. */
async function porta(f){
  if(arrivate.has(f.id)) return;
  if(inCorso[f.id]) return inCorso[f.id];
  const p = (async () => {
    annuncia(VOCI[f.id]);
    const buf = await scarica(f.glb);
    const g = await new Promise((ok, ko) => caricatore.parse(buf, "", ok, ko));
    metti(f, g);
    gruppi[f.id].position.x = POSTO[f.id];
    apparecchia(f);
    arrivate.add(f.id);
    tuttiICorpi = null;      // i materiali della nuova famiglia entrano nel giro
    applicaTolti();
    segnaMenu();
    provinaAOzio();          // i provini di QUESTA, non di quelle che mancano
    sveglia();
  })();
  inCorso[f.id] = p;
  try { await p; } finally { delete inCorso[f.id]; }
}

/* LE ALTRE DIETRO, e non solo «dopo»: dopo il PRIMO FOTOGRAMMA, e nei
   ritagli. Una famiglia che arriva mentre la macchina si muove fa saltare
   l'animazione, e il salto si vede piu' del ritardo. */
const quando = fn => (window.requestIdleCallback
  ? requestIdleCallback(fn, {timeout: 3000}) : setTimeout(fn, 200));
function passo(){
  const f = inCoda.shift();
  if(!f){ codaViva = false; return; }
  if(arrivate.has(f.id)) return passo();
  porta(f).catch(e => console.warn("famiglia non arrivata:", f.id, e))
          .then(() => quando(passo));
}
function avviaCoda(resto){
  inCoda = resto.slice();
  codaViva = true;
  requestAnimationFrame(() => requestAnimationFrame(() => quando(passo)));
}
/* UNA FAMIGLIA CHIESTA PASSA DAVANTI. Toccare un reparto che non e'
   ancora sceso non deve essere un tocco muto: si mette in cima alla coda
   e lo si comincia subito. */
function subitoQuesta(f){
  const i = inCoda.findIndex(x => x.id === f.id);
  if(i >= 0) inCoda.splice(i, 1);
  inCoda.unshift(f);
  if(!codaViva){ codaViva = true; quando(passo); }
  return porta(f);
}
/* E IL MENU LO DICE. Il cartellino annuncia l'arrivo — e' il posto dove
   l'app parla — e si entra appena il reparto e' sul banco. */
function chiediFamiglia(id){
  const f = FAMIGLIE.find(x => x.id === id);
  if(!f) return;
  if(banchi[id] && banchi[id].length){ entra(id); return; }
  scritte(f.nome, "", "arrivano…", "ancora un momento");
  atteso = id;
  subitoQuesta(f).then(() => {
    if(atteso === id && banchi[id] && banchi[id].length) entra(id);
  }).catch(() => {
    if(atteso === id) mostraToast("Questo reparto non e' arrivato. Riprova.");
  });
}
let atteso = null;

async function caricaTutto(){
  disponi();
  annuncia("apparecchio il banco…");
  /* IL DENOMINATORE NON SI INDOVINA: impacchetta.py scrive i byte esatti
     di ogni file in assets/manifesto.json. Se manca, la riga resta ferma
     e non mente. */
  try {
    if(DENTRO && DENTRO["manifesto.json"] !== undefined)
      MANIFESTO = JSON.parse(new TextDecoder()
        .decode(await scarica("manifesto.json")));
    else
      MANIFESTO = await (await fetch(VIA + "manifesto.json?v=" + VERSIONE)).json();
  } catch(_) { MANIFESTO = MANIFESTO || {}; }

  /* LA FAMIGLIA DEL LINK SCENDE PER PRIMA. La scorciatoia legge `f`: chi
     apre ?f=orologi non deve aspettare le collane per vedere gli
     orologi. */
  const chiesta = q.get("f");
  const prima = FAMIGLIE.find(f => f.id === chiesta) || FAMIGLIE[0];
  const resto = FAMIGLIE.filter(f => f !== prima);

  if(!caricatore){
    const [{GLTFLoader}, {DRACOLoader}] = await Promise.all([
      import("three/addons/loaders/GLTFLoader.js"),
      import("three/addons/loaders/DRACOLoader.js")]);
    caricatore = new GLTFLoader();
    caricatore.setDRACOLoader(new DRACOLoader().setDecoderPath(DRACO_VIA));
  }

  arrivati = 0;
  attesi = (MANIFESTO[prima.glb] || 0) + (MANIFESTO["grana.jpg"] || 0)
         + (MANIFESTO["ruvidezza.webp"] || 0) + (MANIFESTO[MARCHI[prima.id]] || 0);

  /* LA MATERIA DEGLI ESPOSITORI PRIMA DEL MODELLO, e non e' un dettaglio:
     `granaPer` clona queste due per ogni mesh, e un clone fatto su una
     texture ancora vuota resta vuoto. */
  if(!grana.image || grana.image === VUOTA){
    const [bg, br] = await Promise.all([tela("grana.jpg"), tela("ruvidezza.webp")]);
    grana.image = bg; grana.needsUpdate = true;
    ruv.image = br;   ruv.needsUpdate = true;
  }

  await porta(prima);
  avviaCoda(resto);
}

/* IL VELO NON E' MAI ETERNO. Prima il Promise.all non aveva .catch e
   GLTFLoader non riceveva un onError: un byte storto e la pagina restava
   a «apparecchio il banco» finche' qualcuno non la chiudeva. */
let spia = 0;
function guasto(e, ritenta){
  clearTimeout(spia);
  if(velo){
    if(!velo.isConnected) document.body.appendChild(velo);
    velo.hidden = false;
  }
  annuncia("Non riesco a portare il banco. Controlla la connessione.");
  if(striscia) striscia.style.width = "0%";
  if(riprova){
    riprova.hidden = false;
    /* RIPROVA RITENTA SOLO QUELLO CHE MANCA: `porta` esce subito per le
       famiglie gia' arrivate, e la materia gia' in casa non si riscarica. */
    riprova.onclick = () => {
      riprova.hidden = true; arrivati = 0;
      if(striscia) striscia.style.width = "0%";
      annuncia("apparecchio il banco…");
      ritenta();
    };
  }
  console.error(e);
}

function avvia(){
  clearTimeout(spia);
  /* una spia a 45 secondi: la prima tappa a 1,6 Mbps costa 7,6 s, quindi
     quarantacinque sono sei volte il caso peggiore */
  spia = setTimeout(() => { if(velo && !velo.hidden)
    guasto(new Error("nessuna risposta entro 45 s"), avvia); }, 45000);
  caricaTutto().then(() => {
    clearTimeout(spia);
    vaiAlBanco(true);
    if(velo) velo.hidden = true;
    scorciatoia();
    sveglia();
  }).catch(e => guasto(e, avvia));
}

let LARGO_BANCO = 0.62;

/* ── IL COMANDO DEL COLORE ───────────────────────────────────
   Il materiale ATTRAVERSA da un colore all'altro: non si stacca e si
   riattacca. Un cambio istantaneo si legge come un errore di caricamento —
   sembra che sia successo qualcosa, non che tu abbia scelto. Mezzo secondo
   di passaggio e il pezzo non si muove di un pixel: l'unica cosa che cambia
   e' il colore, ed e' esattamente quello che si sta provando. */
const vestiDiv = document.getElementById("vesti"), pastiglie = {};
for(const v of VESTI){
  const b = document.createElement("button");
  b.style.setProperty("--tinta", "#" + v.corpo.toString(16).padStart(6, "0"));
  b.title = v.nome; b.setAttribute("aria-label", v.nome);
  b.onclick = () => vestiTi(v.id);
  vestiDiv.appendChild(b);
  pastiglie[v.id] = b;
}
function segnaVesti(){
  for(const v of VESTI) pastiglie[v.id].classList.toggle("qui", v.id === vesteScelta);
}
segnaVesti();

const _da = new THREE.Color(), _a = new THREE.Color(), _ora = new THREE.Color(),
      _velo = new THREE.Color(), BIANCO = new THREE.Color(0xffffff);
let vesteT = 1, tuttiICorpi = null;
function corpiTutti(){
  // si compone una volta sola: durante il passaggio questa lista si
  // percorre trenta volte al secondo, e rifarla ogni volta e' spazzatura
  // buttata nel raccoglitore mentre la scena si muove
  if(!tuttiICorpi){
    tuttiICorpi = [];
    for(const f of FAMIGLIE) for(const m of (corpi[f.id] || [])) tuttiICorpi.push(m);
  }
  return tuttiICorpi;
}
function tingi(colore){
  _velo.copy(colore).lerp(BIANCO, 0.42);
  for(const m of corpiTutti()){
    m.color.copy(colore);
    if(m.sheenColor) m.sheenColor.copy(_velo);
  }
}
function vestiTi(id){
  if(id === vesteScelta) return;
  _da.set(vesteDi(vesteScelta).corpo);
  _a.set(vesteDi(id).corpo);
  vesteScelta = id; vesteT = 0;
  try { localStorage.setItem("regina.veste", id); } catch(_) {}
  segnaVesti();
  sveglia();
}

/* ── IL MENU DEI REPARTI ─────────────────────────────────────
   Ha preso il posto delle targhette che galleggiavano sopra gli oggetti: in
   un negozio non c'e' scritto «ANELLI» a mezz'aria sopra gli anelli. Qui le
   parole stanno dove stanno in un'app — in basso, sotto il pollice — e
   servono a tre cose insieme: dicono cosa c'e', dicono dove sei, e ci
   portano. */
const menu = document.getElementById("menu"), bottoni = {};
for(const f of FAMIGLIE){
  const b = document.createElement("button");
  b.textContent = f.nome;
  b.onclick = ()=>{ if(attiva === f.id && livello === 1) return; chiediFamiglia(f.id); };
  menu.appendChild(b);
  bottoni[f.id] = b;
}
function segnaMenu(){
  const qui = livello === 0 ? davanti : attiva;
  for(const f of FAMIGLIE){
    const b = bottoni[f.id];
    b.classList.toggle("qui", f.id === qui);
    /* IL REPARTO CHE NON E' ANCORA SUL BANCO SI VEDE, ma si vede che non
       c'e' ancora. Si puo' toccare — e toccarlo lo porta davanti agli
       altri — ma non finge di essere pronto. */
    b.classList.toggle("attende", !(banchi[f.id] && banchi[f.id].length));
    if(f.id === qui) b.setAttribute("aria-current", "true");
    else b.removeAttribute("aria-current");
  }
}

/* ── LA MACCHINA. Tre distanze, una sola stanza. ─────────────
   Non si cambia schermata: si cambia distanza, e ci si arriva volando. */
let livello = 0, attiva = null, indice = 0, davanti = null, scelto = -1;
const occhio = new THREE.Vector3(), mira = new THREE.Vector3();
const occhioObiettivo = new THREE.Vector3(), miraObiettivo = new THREE.Vector3();

/* La schermata non e' tutta visibile, e il quadro va centrato su quello che
   si vede: sotto ci sono il cartellino e il menu, sopra il marchio. */
function scartoChrome(d){
  /* su schermo largo il cromo non sta piu' sotto: sta di LATO (il
     pannello) e in alto (la barra dei reparti). Il sei per cento fisso
     spingerebbe il soggetto in basso senza motivo; quello che resta da
     compensare in verticale e' la sola barra, e lo dice la misura. */
  if(larga) return scartoVero(d);
  return 2 * d * Math.tan(camera.fov*Math.PI/360) * 0.06;
}

/* LA FINESTRA NON E' LO SCHERMO. `scartoChrome` toglieva un sei per cento
   fisso, scritto a mano quando il cartellino era una striscia. Sul pezzo
   il cartellino e' alto quasi meta' schermo: centrando sul viewport si
   centra su una banda che per meta' e' coperta - e infatti la collana
   stesa usciva col fondo sotto il cartellino. La banda la dice
   `areaUtile`, che la misura sui nodi veri in tutte e due le forme di
   schermo.
   QUANTO ALZA: il centro della banda sta `q` mezze altezze di schermo
   sopra il centro della tela, e sul piano del bersaglio mezza altezza di
   schermo vale `d*tan(fov/2)`. Abbassando OCCHIO e MIRA della stessa
   quantita' la macchina trasla parallela a se' stessa: il soggetto sale
   di esattamente quei punti, senza che l'inquadratura giri di un grado.
   IL FATTORE 1,97 NON C'E' PIU'. Correggeva a occhio una cosa vera - il
   centro del RETTANGOLO che il soggetto occupa a schermo non e' la
   proiezione del suo centro nello spazio, e su una posa quasi
   perpendicolare all'asse la differenza vale piu' di cento punti - ma la
   correggeva con un numero solo per cinque famiglie, due pose e tre
   altezze di scheda. Misurato col 1,97 addosso: l'anello finiva 62 punti
   SOPRA il centro della banda (il 10 per cento della banda), e con la
   variante (c) della scheda 119 (il 26 per cento), con la scheda tirata
   su ci passava SOTTO la barra del marchio. Adesso quella differenza si
   MISURA - `inquadraPezzo` e `inquadraFamiglia` proiettano la scatola del
   soggetto col bersaglio della macchina e correggono di quanto sborda -
   e questo qui torna a essere quello che dice di essere: la geometria. */
function scartoVero(d){
  const a = areaUtile();
  const q = (innerHeight / 2 - (a.y0 + a.y1) / 2) / innerHeight;
  return 2 * d * Math.tan(camera.fov * Math.PI / 360) * q;
}

/* ── LA FRAZIONE DI TELA CHE SI VEDE ──────────────────────────────
   Due numeri fra 0 e 1: quanta della larghezza e quanta dell'altezza
   della tela cadono nell'area visibile. Stretto valgono 1 e 1 e nessun
   conto cambia. Largo, a 1440x900 valgono 0,75 e 0,94: un soggetto
   inquadrato per riempire il quadro ne riempirebbe un terzo in piu' di
   quanto se ne veda, e finirebbe sotto il pannello. */
function fetteUtili(){
  /* E SUL TELEFONO RESTANO UNO. `areaUtile` adesso misura la banda anche
     stretto, e tirarla fin qui sarebbe la conseguenza logica - ma qui non
     si decide DOVE sta il soggetto: si decide QUANTO E' GRANDE, e sono
     due domande diverse. Largo il pannello COPRE la scena: quel che gli
     finisce sotto e' perso, e il soggetto deve rimpicciolirsi per starne
     fuori. Stretto la scheda sta SOPRA la scena e il cliente ha dato la
     licenza dell'overlap - il pezzo puo' appoggiarsi sulle schede.
     Dividere per 0,74 qui vorrebbe dire arretrare la macchina di un terzo
     e rimpicciolire la merce per rispettare un confine che il cliente ha
     aperto. La grandezza resta quella della tela; a sistemare la
     posizione ci pensa lo scarto, che la banda la guarda eccome. */
  if(!larga) return {fx:1, fy:1};
  const a = areaUtile();
  return {fx: Math.max(0.2, (a.x1 - a.x0) / innerWidth),
          fy: Math.max(0.2, (a.y1 - a.y0) / innerHeight)};
}

function distanzaPer(largo, alto, margine){
  const v = camera.fov*Math.PI/180;
  /* il soggetto non deve entrare nella tela: deve entrare nell'AREA
     VISIBILE. Dividere la misura per la frazione utile e' lo stesso che
     restringere il campo della macchina a quella frazione. */
  const f = fetteUtili();
  const perA = (alto/f.fy*0.5)/Math.tan(v/2);
  const perL = (largo/f.fx*0.5)/(Math.tan(v/2)*camera.aspect);
  return Math.max(perA, perL) * margine;
}

let partenzaBanco = 0;
function vaiAlBanco(subito){
  /* DOVE SI TORNA E' CASA, NON DOV'ERA. Leggevo la x CORRENTE del gruppo
     per far tornare la macchina davanti alla famiglia da cui si uscliva.
     Funziona per anelli e orologi, dove lo swipe muove la MACCHINA e il
     gruppo non si sposta di un millimetro. Ma collane e bracciali sono
     «scambia»: li' lo swipe muove gli ESPOSITORI, e al secondo pezzo il
     busto sta trentanove centimetri piu' in la'. Due righe sotto ogni
     famiglia torna a casa — e la macchina restava puntata dove il busto
     era un istante prima, cioe' su un pezzo di bancone vuoto.
     Misurato: gruppo a -0,771 durante lo swipe, casa a -0,376, e la
     macchina finiva a -0,771. Casa e' l'unico punto che valga per tutti
     e tre i modi. */
  if(attiva && CASA[attiva] !== undefined) partenzaBanco = CASA[attiva];
  else if(attiva && gruppi[attiva]) partenzaBanco = gruppi[attiva].position.x;
  // ogni famiglia torna a casa: uscendo da «scambia» l'espositore era
  // rimasto mezzo fuori quadro, e al banco si vedeva un buco
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach(g => {
    if(CASA[f.id] !== undefined) g.position.x = CASA[f.id]; });
  livello = 0; attiva = null; scelto = -1;
  voloAlPezzo = false; bandaPezzo = null;
  tocco(); if(!subito) lampo();
  mostraTutto();
  azzeraPizzico();
  const d = distanzaPer(0.24, 0.20, 1.0), sc = scartoChrome(d);
  occhioObiettivo.set(partenzaBanco, 0.105 - sc, d);
  miraObiettivo.set(partenzaBanco, 0.082 - sc, 0);
  /* e su schermo largo il banco si centra sulla scena, non sulla tela:
     senza questa riga meta' bancone starebbe dietro il pannello */
  { const lt = scostaDiLato(d, 0);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); } }
  davanti = null;
  for(const f of FAMIGLIE) if(gruppi[f.id] &&
      (!davanti || Math.abs(gruppi[f.id].position.x - partenzaBanco)
                 < Math.abs(gruppi[davanti].position.x - partenzaBanco))) davanti = f.id;
  segnaMenu();
  scritte("Il banco", "", "Gli espositori di Regina, in scala vera.",
          "trascina per scorrere · tocca per entrare");
  /* anche «indietro» se ne va con garbo: era l'unico comando del cromo
     che sparisse di colpo mentre tutto il resto si muoveva */
  if(subito) dietro.hidden = true; else congeda(dietro);
  if(subito){ occhio.copy(occhioObiettivo); mira.copy(miraObiettivo); }
  sveglia();
}

function entra(id){
  /* E NON SI ENTRA IN UN REPARTO CHE NON E' ANCORA SCESO. Chi ci arriva
     da un link o da una carta passa da `chiediFamiglia`, che lo aspetta;
     qui si chiude la porta e basta. */
  if(!banchi[id] || !banchi[id].length) return;
  /* OGNI FAMIGLIA TORNA A CASA PRIMA. Le copie di una famiglia «scambia»
     restano dove le ha portate lo swipe: se si passa a un'altra categoria
     col menu senza ripassare dal banco, quelle di prima rimangono
     sparpagliate fuori posto. Il banco lo faceva gia', entrare no. */
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach(g => {
    if(CASA[f.id] !== undefined) g.position.x = CASA[f.id]; });
  livello = 1; attiva = id; indice = 0; scelto = -1;
  voloAlPezzo = false; bandaPezzo = null;
  tocco(); lampo();
  pos = posMeta = posGiu = 0; posV = 0; velDito = 0;
  azzeraPizzico();
  mostraTutto();
  /* IL CARTELLINO SI SCRIVE PRIMA DI INQUADRARE, e non e' un riordino di
     comodo. `inquadraFamiglia` centra l'espositore sulla banda fra la
     testata e la CIMA DEL CARTELLINO, misurata; se il cartellino porta
     ancora il testo di prima - entrando dal banco, «Gli espositori di
     Regina, in scala vera» su due righe - si misura una banda che sta per
     cambiare. Misurato: 14 punti di errore sul busto, 18 sulla rampa, e
     lo stesso segno su tutte e cinque, cioe' un difetto sistematico e non
     un caso. `mostraScheda` scrive del testo e basta, non tocca la
     macchina: puo' venire prima senza conseguenze, e il
     `getBoundingClientRect` che viene dopo impagina prima di rispondere.
     `applicaPos` invece resta DOPO l'inquadratura, perche' il passo del
     dito e quello del banco li calcola lei. */
  mostraScheda();
  /* E IL «INDIETRO» COMPARE PRIMA DI MISURARE LA TESTATA. #alto e' una
     riga flessibile e il marchio ci sta dentro in posizione assoluta,
     cioe' fuori dal flusso: col tasto «indietro» ancora nascosto la riga
     non ha contenuto e la testata si riduce ai suoi due padding - 51
     punti invece di 79, e il fondo del cromo cade a 21 invece che a 49.
     Misurato: gli espositori finivano tutti e cinque 14 punti sopra il
     centro della banda, lo stesso numero per geometrie diverse, che e'
     la firma di un difetto sistematico. Il tasto c'e' gia' - basta
     accenderlo prima di chiedere quanto e' alta la testata. */
  accogli(dietro);
  inquadraFamiglia();
  applicaPos(false);
  segnaMenu();
  sveglia();
}

/* ── SEGUIRE UN SUGGERIMENTO ──────────────────────────────────────
   Le carte attorno al pezzo dicono «con questo ci sta anche l'Anello
   Cabochon, 39 €» e non portavano da nessuna parte. Portarci vuol dire
   fare tre cose in fila, ed e' importante che siano in QUEST'ordine:
   si rientra nella famiglia (che rimette a casa gli espositori, riaccende
   quello che era stato velato e azzera il pizzico), ci si sposta sulla
   fermata dove quel pezzo sta, e solo allora lo si apre. Saltare il
   secondo passo lascerebbe la macchina davanti a un altro espositore con
   in mano un pezzo che non e' quello inquadrato — che e' esattamente il
   difetto gia' pagato su `mostraScheda`, dove la scheda descriveva la
   partenza invece della destinazione.
   Si passa da `entra` anche quando la famiglia e' gia' quella: cambiare
   pezzo dentro la stessa famiglia senza rientrare lascerebbe spento
   l'espositore che la vela aveva dissolto per il pezzo di prima. */
function vaiAlPezzo(fam, k){
  if(cTolto(fam, k)) return;
  /* IL SUGGERIMENTO PUO' PUNTARE A UN REPARTO CHE NON E' ANCORA SCESO —
     «con questo ci sta anche» attraversa le famiglie, ed e' il suo
     mestiere. Allora lo si porta davanti agli altri e ci si va appena
     arriva: mai un cartoncino che non fa niente. */
  if(!merci[fam] || !merci[fam][k]){
    const f = FAMIGLIE.find(x => x.id === fam);
    if(!f || arrivate.has(fam)) return;
    mostraToast("Arrivano " + f.nome.toLowerCase() + "…", {durata: 2400});
    subitoQuesta(f).then(() => { if(merci[fam] && merci[fam][k]) vaiAlPezzo(fam, k); })
                   .catch(() => {});
    return;
  }
  chiudiCarta();
  entra(fam);
  const dove = stazioni(fam).findIndex(g => g.indexOf(k) >= 0);
  if(dove >= 0){ pos = posMeta = posGiu = dove; posV = 0; applicaPos(false); }
  mostraScheda();
  apriPezzo(k);
}

/* L'inquadratura e' separata dall'entrare, perche' va rifatta quando lo
   schermo cambia forma: sulla prima inquadratura la proporzione della
   macchina era ancora quella di prima del ridimensionamento, e la fila di
   anelli usciva storta e tagliata a destra. */
function inquadraFamiglia(){
  const g = (banchi[attiva] || [])[0];
  if(!g) return;
  const u = g.userData;
  const alto = u.alto + 0.022;
  /* NON SI INQUADRA TUTTO L'ESPOSITORE. Su uno schermo verticale e' la
     LARGHEZZA a decidere la distanza: per far stare in quadro cinque anelli
     la macchina arretrava tanto che la merce prendeva un quinto
     dell'altezza. Si inquadra una FINESTRA della fila, e sono gli altri a
     entrare quando ci si sposta. Dove invece l'espositore e' uno solo e
     cambia per intero, si inquadra tutto. */
  const quanti = stazioni(attiva).length, modo = MODI[attiva];
  /* E UNA «CAMMINA» NON PUO' AVERE TUTTO IN QUADRO. Con tre orologi la
     finestra era 3,0 su 3 stazioni: l'espositore ci stava tutto, e lo
     swipe spostava la macchina di un passo senza che entrasse o uscisse
     niente — un gesto che non cambia nulla si legge come un gesto
     casuale. La finestra resta sotto il numero delle stazioni, cosi' c'e'
     sempre qualcosa da raggiungere. */
  const finestra = modo === "cammina" ? Math.min(3.0, quanti * 0.78)
                 : modo === "salta" ? 1.7 : quanti;
  const largo = u.largo * Math.min(1, finestra / quanti) + 0.016;
  /* LO SCARTO PARTE DALLA BANDA, non da un sei per cento. `scartoChrome`
     stretto toglieva 0,06 di altezza di campo - 50 punti su 844 - scritti
     a mano quando il cartellino era una striscia. Misurato prima di
     questa riga: gli anelli finivano 130 punti SOTTO il centro della
     banda (il 21 per cento della banda), la rampa 87, gli orologi 81. Su
     schermo largo `scartoChrome` gia' rimanda qui, quindi scriverlo
     esplicito non cambia un pixel di desktop. */
  const d = distanzaPer(largo, alto * 1.26, 1.02);
  /* QUANTO SI SPOSTA UN ESPOSITORE CHE ESCE. Il passo lo prendevo dalla
     larghezza del mobile piu' cinque centimetri, e a meta' swipe non si
     vedeva NIENTE: il primo era gia' uscito e il secondo non era ancora
     entrato, perche' il quadro e' piu' stretto di due busti affiancati. Il
     passo giusto e' la LARGHEZZA DEL QUADRO, appena piu' corta, cosi' uno
     esce mentre l'altro entra e in mezzo non c'e' mai il vuoto. */
  const larghezzaVista = 2 * d * Math.tan(camera.fov*Math.PI/360) * camera.aspect;
  if(MODI[attiva] === "scambia")
    PASSO_BANCO[attiva] = larghezzaVista * 0.94;
  /* IL PASSO DEL DITO, PER QUESTA FAMIGLIA. Quanti pixel di schermo
     percorre una stazione: sulle collane e' la larghezza del quadro meno
     un soffio, sugli anelli il passo fra due colonnine. Da qui in poi il
     dito muove la scena uno a uno in tutte e cinque. */
  {
    let passoMondo;
    if(MODI[attiva] === "scambia") passoMondo = PASSO_BANCO[attiva];
    else {
      const c = CENTRI[attiva] || [];
      let somma = 0, quante = 0;
      for(let i = 1; i < c.length; i++){ somma += Math.abs(c[i] - c[i-1]); quante++; }
      passoMondo = quante ? somma / quante : larghezzaVista * 0.3;
    }
    PASSO_DITO = Math.max(26, passoMondo * innerWidth / larghezzaVista);
  }
  const cx = CASA[attiva] !== undefined ? CASA[attiva] : g.position.x;
  const piazza = sc => {
    if(SGUARDO[attiva] === "alto"){
      const my = u.alto * 0.80 - sc;
      occhioObiettivo.set(cx, my + d*Math.sin(INCLINA), d*Math.cos(INCLINA));
      miraObiettivo.set(cx, my, -0.02);
    } else {
      occhioObiettivo.set(cx, alto*0.56 - sc, d);
      miraObiettivo.set(cx, alto*0.47 - sc, -0.04);
    }
    /* l'espositore si centra sull'area visibile: il suo passo, appena
       calcolato sulla larghezza del quadro, resta giusto — la macchina
       trasla parallela, non cambia campo. */
    const lt = scostaDiLato(d, 0);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); }
  };
  piazza(scartoVero(d));
  /* E POI SI GUARDA DOVE E' FINITO. Il punto mirato sta al 47 o all'80 per
     cento dell'altezza del mobile, non al suo centro: lo scarto geometrico
     centra QUEL punto, non il rettangolo dell'espositore, e sulla rampa
     inclinata i due distano piu' di ottanta punti. La scatola del mobile
     non si traversa, si costruisce: `metti` lo appoggia con la base a
     zero e centrato in x e z, quindi le tre misure di `userData` la
     dicono per intero - e dentro il gruppo c'e' anche la posa stesa, che
     al banco non si vede e che un traverse conterebbe.
     Il tetto di `centraSullaBanda` e' quello che tiene gli espositori
     INTERI: gli orecchini sfioravano gia' la barra a otto punti, e
     centrarli senza tetto li avrebbe infilati sotto il marchio. */
  _scatolaFam.min.set(cx - u.largo / 2, 0, -u.fondo / 2);
  _scatolaFam.max.set(cx + u.largo / 2, u.alto, u.fondo / 2);
  centraSullaBanda(_scatolaFam, d, camera.fov * Math.PI / 360,
                   scartoVero(d), piazza);
}

/* ── IL PEZZO DA SOLO ────────────────────────────────────────
   Toccare un gioiello lo porta davanti NEL VUOTO: l'espositore sparisce —
   non si allontana, sparisce — e resta il pezzo che galleggia, con la
   stanza sfocata dietro. E' quello che fa un gioielliere quando tira fuori
   una cosa dalla vetrina: sparisce tutto il resto.
   Non c'e' nessuna fotografia di mezzo. E' lo STESSO oggetto che stava sul
   mobile un istante fa, e si vede che e' lo stesso. */
let giroP = 0, altP = 0.12, raggioP = 0.02;
/* IL QUADRO DECISO AL TOCCO: la distanza e lo scarto della banda. Sono
   il risultato di una MISURA (due passate largo, tre sulla banda
   stretto) e si calcolano una volta sola, prima che la molla parta. */
let quadroD = 0, quadroSc = 0;
/* VERO DAL TOCCO FINO ALL'ARRIVO. Finche' e' vero il bersaglio non lo
   sposta nessuno: niente correzioni ritardate, niente dondolo. */
let voloAlPezzo = false;
const boxP = new THREE.Box3();
/* la scatola dell'espositore, riusata: si riscrive a ogni inquadratura di
   famiglia e non si alloca niente dentro un conto che il ridimensionamento
   puo' chiamare a ogni fotogramma */
const _scatolaFam = new THREE.Box3();
const _ang = new THREE.Vector3();
const centroP = new THREE.Vector3();

function apriPezzo(k){
  if(k == null || k < 0 || !merci[attiva] || !merci[attiva][k]) return;
  /* un pezzo uscito dal cofanetto non si apre: le sue mesh sono spente e
     la carta descriverebbe una cosa che non c'e' — la stessa ragione per
     cui `pezzoVicino` salta i pezzi invisibili */
  if(cTolto(attiva, k)) return;
  livello = 2; scelto = k;
  tocco(); lampo();
  azzeraPizzico();
  /* ── DA QUI IL BERSAGLIO E' CHIUSO ─────────────────────
     La banda si ferma PRIMA che il cartellino cambi testo e si ritiri
     (vedi `areaUtile`), e `voloAlPezzo` chiude la porta a tutti: alla
     riquadratura ritardata della scheda, al dondolo, a chiunque voglia
     spostare la mira a volo iniziato. Meta' del verdetto del cliente —
     «incoerenza fra la posizione di partenza e quella di fine» —
     nasceva qui: il bersaglio cambiava mentre la molla volava. L'altra
     meta' e' il pezzo che cambia POSA (vedi `avviaPosa`). */
  bandaPezzo = misuraArea();
  voloAlPezzo = true;
  /* DA CHE ALTEZZA SI GUARDA IL PEZZO DA SOLO. Un gioiello che sta in
     piedi lo si guarda quasi in faccia; uno STESO si guarda di SOPRA.
     Avevo scritto quaranta gradi per paura di appiattirlo, ed era il
     ragionamento rovesciato: piu' si sta bassi, PIU' la lunghezza si
     accorcia. Misurato, la posa disegnata con un rapporto 2,20 arrivava
     a schermo a 1,12 — cioe' un cerchio, due righe sopra la scritta
     «45 cm». A settanta gradi il seno vale 0,94 e il rapporto resta.
     E' anche l'alzata con cui i cataloghi fotografano una catena stesa:
     la posa serve a mostrare lo SVILUPPO. */
  /* E QUESTO NON E' UNO SCATTO. `giroP` non e' la rotazione del pezzo a
     schermo: e' l'azimut a cui la macchina si mettera' ATTORNO al pezzo,
     cioe' il bersaglio. A zero vale «da davanti», che e' esattamente la
     direzione da cui la macchina sta gia' guardando l'espositore — la
     rotazione a schermo, quindi, non cambia di un grado nel fotogramma
     del tocco. Il dondolo invece parte da fermo e resta fermo finche' il
     volo non e' finito (vedi `voloAlPezzo` nel ciclo): misurato prima,
     giroP saliva a 0,027 rad durante il volo e a 0,095 dopo due secondi
     e mezzo, e quella deriva spostava il bersaglio a ogni fotogramma. */
  giroP = 0; dondolo = 0; giroBase = 0; giroV = 0;
  altP = stesa(attiva, k) ? 1.22 : 0.12;
  cartello.classList.add("pezzo");
  isolaPezzo();
  /* LE MATRICI PRIMA DELLA MISURA. Il riquadro di un oggetto si calcola
     sulla sua posizione nel MONDO, e quella la sanno le matrici dei padri:
     se non sono aggiornate il riquadro esce vuoto, il centro finisce
     all'origine e la macchina si pianta dentro il pavimento a due
     centimetri dal nulla. Sembra che il pezzo sia sparito, e invece e'
     rimasto dov'era. */
  scena.updateMatrixWorld(true);
  const p = stesa(attiva, scelto) || merci[attiva][scelto];
  const b = new THREE.Box3().setFromObject(p);
  boxP.copy(b);
  b.getCenter(centroP);
  raggioP = Math.max(0.004, b.getSize(new THREE.Vector3()).length() / 2);
  // qui il taglio netto E' giusto: le carte si rifanno due righe piu' giu'
  togliInsieme(true);
  /* E QUI NON SI INQUADRA PIU'. Si inquadrava due volte — una adesso e
     una dopo il cartellino — a qualche fotogramma di distanza: due
     bersagli sono due voli, e il secondo parte da dove il primo stava
     passando. Prima si scrive tutto quello da cui il quadro dipende, poi
     lo si decide UNA volta, in fondo. */
  const r = RIPIANI[attiva][scelto] || ["", "", ""];
  /* E QUI LA RIGA DICEVA LA COSA SBAGLIATA. «tocca fuori per uscire»:
     l'unica istruzione data sul pezzo era come ANDARSENE, e non si
     nominava mai il fatto che il pezzo stesso si tocca — cioe' la porta
     su tutto quello che con quel pezzo si puo' fare. Chi seguiva
     l'istruzione usciva e non vedeva mai le azioni. Per uscire ci sono
     gia' tre strade evidenti (il tasto in alto, il pizzico all'indietro,
     il tocco fuori); quella che va insegnata e' l'altra. */
  scritte(r[0], r[2] + " €", r[1],
          "trascina per girare · tocca il pezzo per la sua carta");
  /* DOPO le scritte: `scritte` spegne l'insieme a ogni cartellino nuovo, ed
     e' giusto che lo faccia — ma allora chi lo accende deve venire dopo. */
  mostraInsieme();
  fondo.classList.add("apribile");
  scheda(true);
  accogli(dietro);
  /* ── ADESSO, E UNA VOLTA SOLA ────────────────────────
     Tutto quello da cui il quadro dipende e' gia' a posto: la posa, la
     scatola del pezzo, il testo del cartellino, il tasto «indietro»
     nella testata. Da questa riga fino all'arrivo il bersaglio e' quello
     e basta. */
  inquadraPezzo();
  /* e la posa si stacca DOPO che il bersaglio esiste: viaggia con la
     macchina, e per farlo deve sapere quanta strada la macchina ha */
  avviaPosa(-1);
  sveglia();
}

function inquadraPezzo(soloGiro){
  /* si inquadra sulla SFERA del pezzo, e sul lato PIU' STRETTO dello
     schermo: in verticale e' la larghezza a tagliare, e una creola da 18 mm
     inquadrata sull'altezza uscirebbe mozza ai fianchi. */
  /* e il campo che conta e' quello VISIBILE. Stretto le due frazioni
     valgono uno e questi due angoli sono quelli di sempre. Largo, il
     mezzo campo orizzontale si riduce della fetta che il pannello si
     prende (a 1440 il 25 per cento) e quello verticale della barra: il
     pezzo viene inquadrato per riempire la scena, non la tela — se no
     riempie la tela e un quarto di lui finisce dietro il pannello. */
  const fu = fetteUtili();
  const mezzoV = Math.atan(Math.tan(camera.fov*Math.PI/360) * fu.fy);
  const mezzoO = Math.atan(Math.tan(camera.fov*Math.PI/360) * camera.aspect * fu.fx);
  /* e il margine si stringe sul pezzo steso: la sfera che lo contiene ha
     il raggio della sua DIAGONALE, ma di larghezza ne occupa meta' — con
     lo stesso margine di un pezzo in piedi resterebbe un francobollo in
     mezzo al vuoto. */
  const r = raggioQuadro || raggioP;
  let d;
  if(stesa(attiva, scelto) && !raggioQuadro){
    /* LA POSA SI INQUADRA A SCALA, NON A RIEMPIMENTO. Con lo stesso
       riempimento il bracciale da 19 cm prendeva il 55 per cento della
       larghezza e la collana da 45 il 39: in una gioielleria e' un errore
       che si vede subito. Qui il quadro cresce con la RADICE del pezzo, che
       e' il compromesso dei cataloghi: il piccolo resta leggibile, il
       grande resta piu' grande. */
    d = (0.044 + r * 0.47) / Math.sin(Math.min(mezzoV, mezzoO));
  } else {
    d = r / Math.sin(Math.min(mezzoV, mezzoO)) * 1.35;
  }
  /* ── LA SPINTA NON PUO' SPINGERE FUORI ────────────────────────
     `scartoVero` alza il pezzo perche' stia in mezzo alla banda che si
     VEDE — quella fra la testata e il cartellino — e la spinta cresce
     con l'altezza del cartellino. Con la scheda bassa di sempre valeva
     0,35 mezze altezze di campo e andava bene. Ma il cartellino non ha
     un'altezza sola: la variante (c) dei suggerimenti ci mette dentro un
     rail, il cartellino arriva a 359 punti, e la spinta saliva a 0,73
     mezze altezze — misurato, l'anello usciva TAGLIATO dalla cima dello
     schermo. Una spinta che porta il soggetto fuori dall'inquadratura
     non e' una spinta, e' un errore: si limita a quanto basta perche' il
     bordo alto del pezzo resti dentro, con un filo d'aria (il 6 per
     cento). Con le altezze di sempre il tetto non tocca niente. */
  /* LO SCARTO ESCE DA `piazza`, e non e' un riordino: la centratura
     misurata deve poter rimettere la macchina allo stesso posto con uno
     scarto DIVERSO, senza ricalcolare la distanza. */
  const scartoBase = dd => {
    const hv = dd * Math.tan(mezzoV);
    return Math.min(scartoVero(dd), Math.max(0, hv * 0.94 - r));
  };
  const piazza = (dd, sc) => {
    occhioObiettivo.set(
      centroP.x + dd * Math.cos(altP) * Math.sin(giroP),
      centroP.y + dd * Math.sin(altP) - sc,
      centroP.z + dd * Math.cos(altP) * Math.cos(giroP));
    miraObiettivo.set(centroP.x, centroP.y - sc, centroP.z);
    /* il pezzo si porta al centro della SCENA. Lo scostamento segue il giro
       del dito — la macchina orbita, e «di lato» ruota con lei — cosi' il
       gioiello resta nello stesso punto dello schermo per tutto il giro
       invece di scivolare verso il pannello a un quarto di rotazione. */
    const lt = scostaDiLato(dd, giroP);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); }
  };
  /* ── IL DONDOLO GIRA, NON RIQUADRA ─────────────────────
     Chiamata con `soloGiro` la funzione non ridecide niente: rimette la
     macchina attorno al pezzo con la distanza e lo scarto gia' decisi,
     al giro di adesso. Serve al dondolo, che al livello del pezzo passa
     di qui sessanta volte al secondo per dodici secondi.
     Misurato prima di questa riga, col banco _T_: il bersaglio si
     spostava di 0,0002-0,0003 metri a OGNI fotogramma, su tutte e cinque
     le famiglie, per tutti i dodici secondi del dondolo — perche'
     `centraSullaBanda` rifaceva il conto su un rettangolo che il giro
     stava ruotando. Un bersaglio che non sta mai fermo non e' un
     bersaglio. Il dondolo e' un'oscillazione della MACCHINA attorno al
     soggetto: il soggetto non si deve muovere di un punto, e adesso fra
     gli 800 ms e i due secondi e mezzo si sposta di 0,03-0,67 punti. */
  if(soloGiro && quadroD){ piazza(quadroD, quadroSc); return; }
  piazza(d, scartoBase(d));
  /* ── E POI SI MISURA, INVECE DI FIDARSI ───────────────────
     Il conto qui sopra inquadra una SFERA, e per la posa stesa nemmeno
     quella: inquadra una scala, cioe' una misura fisica del pezzo. Vanno
     bene tutte e due — e' cosi' che si fotografa un gioiello — ma nessuna
     delle due garantisce che il rettangolo che il pezzo occupa a schermo
     stia dentro l'area visibile: misurato a 1280x720, la collana da 45 cm
     occupava da 65 a 729 punti su una banda che finisce a 720.
     Quando l'area visibile e' tutto lo schermo questo non si puo' nemmeno
     verificare senza cambiare cio' che il telefono fa gia' bene, quindi la
     correzione vale SOLO largo: si proietta la scatola del pezzo con una
     macchina di prova messa sul bersaglio (la vera sta ancora volando), e
     se sborda si arretra della frazione esatta che sborda. Due passate
     bastano: la prima corregge, la seconda verifica. */
  if(larga && !boxP.isEmpty()){
    const a = areaUtile();
    const largoUtile = Math.max(80, a.x1 - a.x0), altoUtile = Math.max(80, a.y1 - a.y0);
    for(let i = 0; i < 2; i++){
      const q = riquadroSulBersaglio();
      const k = Math.max((q.x1 - q.x0) / (largoUtile * 0.96),
                         (q.y1 - q.y0) / (altoUtile * 0.96));
      if(k <= 1) break;
      d *= k;
      piazza(d, scartoBase(d));
    }
  }
  /* e stretto si misura DOVE CADE, non quanto e' grande: la banda e' gia'
     larga quanto la tela (vedi `fetteUtili`) e il pezzo puo' stare in
     overlap sulle schede - quello che non puo' fare e' restare appeso in
     cima con mezzo schermo di crema sotto. */
  const scFine = centraSullaBanda(boxP, d, mezzoV, scartoBase(d), sc => piazza(d, sc));
  /* e il quadro si RICORDA: da qui in poi il dondolo lo riusa invece di
     ricalcolarlo (vedi `soloGiro` qui sopra) */
  quadroD = d; quadroSc = scFine === undefined ? scartoBase(d) : scFine;
}

/* ── IL SOGGETTO SI CENTRA SULLA BANDA, MISURANDO ──────────────
   La geometria di `scartoVero` mette al centro della banda la PROIEZIONE
   DEL CENTRO della scatola. Non e' la stessa cosa del centro del
   RETTANGOLO che il soggetto occupa a schermo: in prospettiva la meta'
   lontana di un oggetto si rimpicciolisce e sale, quella vicina scende, e
   su una posa stesa guardata da settanta gradi la differenza misurava
   139 punti. Il vecchio 1,97 era la media di quell'errore su un caso
   solo. Qui invece si guarda: si proietta la scatola col bersaglio della
   macchina, si vede dove cade il rettangolo, e si sposta lo scarto di
   quanti punti mancano. Una passata corregge, la seconda verifica; alla
   terza si e' sotto il mezzo punto e si esce.
   IL TETTO. Il cliente ha dato la licenza dell'OVERLAP - il pezzo puo'
   appoggiarsi sulle schede in basso - ma nessuna licenza vale in alto:
   sopra c'e' la barra col marchio, e un gioiello che ci passa sotto e'
   tagliato, non sovrapposto. Misurato prima di questa riga: con la
   variante (a) e la scheda tirata su, l'anello entrava 20 punti dentro
   la barra. Il tetto e' il bordo alto del rettangolo contro il filo della
   banda, con dodici punti d'aria - e vince sempre sulla centratura,
   perche' una centratura che taglia non e' una centratura.
   Vale SOLO stretto. Largo il pezzo e' gia' centrato dal suo conto e
   riverificato dal ciclo che lo rimpicciolisce se sborda: passare di qui
   cambierebbe un'inquadratura che va bene, e il desktop non deve
   muoversi di un pixel. */
const ARIA_BARRA = 12;
function centraSullaBanda(box, d, mezzoV, scOra, piazza){
  if(larga || !box || box.isEmpty()) return;
  const a = areaUtile(), cB = (a.y0 + a.y1) / 2;
  /* quanti metri vale un punto di schermo sul piano del bersaglio */
  const perPunto = 2 * d * Math.tan(mezzoV) / innerHeight;
  let sc = scOra;
  for(let i = 0; i < 3; i++){
    const q = riquadroSulBersaglio(box);
    /* alzare lo scarto ABBASSA la macchina, quindi il soggetto sale: per
       portare il centro del rettangolo da `cS` a `cB` si aggiunge la
       differenza, convertita in metri */
    /* e non si chiama `mira`: la macchina ha gia' un `mira` globale, e un
       nome ripetuto dentro una funzione e' come un numero scritto due
       volte */
    let voluto = sc + ((q.y0 + q.y1) / 2 - cB) * perPunto;
    const tetto = sc + (q.y0 - a.y0 - ARIA_BARRA) * perPunto;
    voluto = Math.min(voluto, tetto);
    if(Math.abs(voluto - sc) < perPunto * 0.5) break;
    sc = voluto;
    piazza(sc);
  }
  return sc;
}

/* dove cade UNA SCATOLA con la macchina ARRIVATA. Di serie e' quella del
   pezzo; a livello 1 le si passa quella dell'espositore, che non e' un
   oggetto da traversare ma tre misure in `userData` - dentro il gruppo c'e'
   anche la posa stesa, che al banco non si vede e che allargherebbe la
   scatola di mezzo metro. E' lo stesso
   attrezzo di `quadroDelPezzo`, che pero' nasce trecento righe piu' sotto
   e serve alla finestra della carta: qui ne serve una copia che esista
   gia' quando si apre il primo pezzo. */
const _camMisura = new THREE.PerspectiveCamera(), _spigolo = new THREE.Vector3();
function riquadroSulBersaglio(box){
  box = box || boxP;
  _camMisura.fov = camera.fov; _camMisura.aspect = camera.aspect;
  _camMisura.near = camera.near; _camMisura.far = camera.far;
  _camMisura.up.copy(camera.up);
  _camMisura.position.copy(occhioObiettivo);
  _camMisura.lookAt(miraObiettivo);
  _camMisura.updateMatrixWorld(true);
  _camMisura.updateProjectionMatrix();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _spigolo.set(i & 1 ? box.max.x : box.min.x,
                 i & 2 ? box.max.y : box.min.y,
                 i & 4 ? box.max.z : box.min.z).project(_camMisura);
    const sx = (_spigolo.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_spigolo.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  return {x0, y0, x1, y1};
}

/* ── L'INSIEME ATTORNO AL PEZZO ─────────────────────────────────
   Si clonano i modelli veri delle altre famiglie, si portano tutti alla
   stessa misura — un terzo del pezzo in mano — e si posano nella posizione
   che avrebbero sul corpo. La posizione e' letta sugli assi della MACCHINA
   nel momento in cui si entra: cosi' l'insieme nasce composto davanti a chi
   guarda, e poi resta fermo nello spazio, che e' quello che lo rende un
   insieme vero e non un cartellone. */
let ancore = [], raggioQuadro = 0;
const _pr = new THREE.Vector3();
const _dx = new THREE.Vector3(), _dy = new THREE.Vector3(), _b3 = new THREE.Box3();

/* ── IL PROVINO DEL PEZZO ────────────────────────────────────────
   Le carte senza immagine sembravano etichette, non suggerimenti. La
   fotografia pero' non ce l'abbiamo come file: quello che abbiamo e' il
   MODELLO, ed e' meglio — si fotografa lui, una volta, e la carta mostra
   esattamente il pezzo che poi si ritrova nel cofanetto.
   Si disegna in una scena tutta sua, con lo stesso ambiente che riflette
   nella stanza: un metallo senza niente attorno da restituire esce nero, e
   questa lezione l'abbiamo gia' pagata sulla creola in selezione. */
const provinoDi = {};
let fotografo = null, luceProvino = null;

/* LA SCATOLA DI LUCE. Un metallo non ha colore suo: restituisce quello che
   ha intorno. Nel provino gli avevo messo attorno l'ambiente della vetrina
   — che e' una scatola SCURA, ed e' giusto che lo sia li' — e una creola
   d'argento veniva fuori come due anelli neri. Per fotografare un gioiello
   si costruisce il contrario: una scatola chiara, con due pareti piu'
   accese. E' la stessa cosa che si fa in un banco di posa vero. */
function scatolaDiLuce(){
  if(luceProvino) return luceProvino;
  const st = new THREE.Scene();
  const cubo = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4),
    new THREE.MeshBasicMaterial({color:0xB9B2A8, side:THREE.BackSide}));
  st.add(cubo);
  const faro = (c, i, x, y, z, sx, sy, sz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
      new THREE.MeshBasicMaterial({color:c}));
    m.material.color.multiplyScalar(i);
    m.position.set(x, y, z); st.add(m);
  };
  faro(0xFFF3E2, 3.0, -1.2, 1.5, 0.9, 1.8, 0.05, 1.8);
  faro(0xE6F0F6, 1.7,  1.5, 0.4, 0.5, 0.05, 1.6, 1.6);
  faro(0xFFFFFF, 1.2,  0.0, -1.4, 0.7, 2.4, 0.05, 2.0);
  luceProvino = pm.fromScene(st, 0.04).texture;
  return luceProvino;
}
function provino(fam, k, largo, alto){
  largo = largo || 288; alto = alto || 216;
  const chiave = fam + ":" + k + ":" + largo + "x" + alto;
  if(provinoDi[chiave]) return provinoDi[chiave];
  const o = (merci[fam] || [])[k];
  if(!o) return "";
  /* SI FOTOGRAFA COL DISEGNATORE PRINCIPALE, non con uno suo. Una texture
     d'ambiente appartiene al CONTESTO che l'ha generata: passata a un
     secondo renderer semplicemente non c'e', e il pezzo esce nero senza
     che niente segnali l'errore. Si restringe il disegnatore per un
     istante, si scatta, e lo si rimette com'era — il fotogramma dopo
     ridisegna la stanza e nessuno se ne accorge. */
  const st = new THREE.Scene();
  /* IL FONDO E' GRIGIO MEDIO, ed e' la regola che il progetto si e' gia'
     dato per fotografare un pezzo: sul bianco un metallo lucido si brucia e
     il contorno sparisce, sul nero spariscono le parti in ombra, che sono
     meta' del pezzo. Provato col fondo trasparente sul velluto della carta:
     una creola d'argento diventava invisibile. */
  st.background = new THREE.Color(0x6A625A);
  st.environment = scatolaDiLuce();
  st.environmentIntensity = 1.15;
  const c = o.clone(true);
  c.position.set(0,0,0); c.rotation.set(0,0,0); c.scale.set(1,1,1);
  c.traverse(m => { if(m.isMesh) m.visible = true; });
  st.add(c);
  st.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(c);
  const ce = b.getCenter(new THREE.Vector3());
  const r = Math.max(0.002, b.getSize(new THREE.Vector3()).length() / 2);
  /* si gira di faccia: il lato piu' sottile verso la macchina, se no una
     creola e' un trattino anche in un provino */
  const dim = b.getSize(new THREE.Vector3());
  if(dim.x < dim.y && dim.x < dim.z) c.rotation.y = Math.PI / 2;
  else if(dim.y < dim.x && dim.y < dim.z) c.rotation.x = Math.PI / 2;
  st.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(c);
  b2.getCenter(ce);
  const cam = new THREE.PerspectiveCamera(26, largo/alto, 0.001, 20);
  cam.position.set(ce.x + r*0.35, ce.y + r*0.55, ce.z + r*4.4);
  cam.lookAt(ce);
  const l1 = new THREE.DirectionalLight(0xFFE9CE, 3.2); l1.position.set(-1, 1.4, 1.1);
  const l2 = new THREE.DirectionalLight(0xCFE2EC, 1.3); l2.position.set(1.2, .3, .6);
  st.add(l1, l2, new THREE.AmbientLight(0xffffff, 0.30));
  const misura = rend.getSize(new THREE.Vector2());
  const pr = rend.getPixelRatio();
  rend.setPixelRatio(2);
  rend.setSize(largo, alto, false);
  rend.render(st, cam);
  const url = rend.domElement.toDataURL("image/png");
  rend.setPixelRatio(pr);
  rend.setSize(misura.x, misura.y, false);
  st.clear();
  provinoDi[chiave] = url;
  return url;
}

/* ══════════════════════════════════════════════════════════════
   I PROVINI SI FANNO NEL TEMPO MORTO, NON SOTTO IL DITO

   `provino` restringe il disegnatore principale, scatta a 560x385 con il
   rapporto di pixel a 2 — cioe' 1120x770 punti veri — e lo rimette
   com'era. E' un fotogramma in piu', pagato per intero, nel momento
   esatto in cui il dito tocca il pezzo: l'apertura della carta si porta
   dietro quel conto ogni volta che il pezzo non era gia' stato aperto.
   La cache c'era gia' e funziona; quello che mancava era CHIAMARLA
   PRIMA. Qui si riempie da sola, a macchina ferma: `requestIdleCallback`
   chiama solo quando il browser non ha altro da fare, si lavora una
   FAMIGLIA per volta e si cede il turno appena il tempo concesso
   finisce. Con un `timeout` di un secondo e due, cosi' su un telefono
   che non sta mai fermo il lavoro non resta indietro per sempre.

   E alla fine di ogni turno si RIDIPINGE. Non e' una precauzione: il
   provino si disegna sulla tela vera, e se il ciclo di disegno sta
   dormendo — succede sempre a scena ferma, e a scena ferma e' proprio
   quando il tempo morto arriva — l'ultimo fotogramma rimasto a schermo
   sarebbe il provino, stirato sulla misura della finestra.
   ══════════════════════════════════════════════════════════════ */
let provinoOzio = null, geneProvini = 0;
function provinaAOzio(){
  /* OGNI FAMIGLIA CHE ARRIVA RIFA' LA CODA. Con le famiglie a tappe la
     lista dei pezzi cresce: una coda costruita quando ce n'era una sola
     non fotograferebbe mai le altre quattro. La generazione spegne la
     precedente senza doverla rincorrere, e i provini gia' fatti stanno
     nella dispensa — rifarla non costa niente. */
  const mia = ++geneProvini;
  const chiama = window.requestIdleCallback
    ? window.requestIdleCallback.bind(window)
    : (cb, o) => setTimeout(() => cb({timeRemaining:() => 6, didTimeout:true}),
                            (o && o.timeout) ? 120 : 120);
  /* le due misure che l'applicazione chiede davvero: la carta del pezzo
     (560x385) e le carte dell'insieme insieme alla lista della
     collezione (la misura di serie). La galleria ne vuole una terza,
     900x900, e resta pigra: e' una sola alla volta e si apre da una
     carta gia' aperta, cioe' mai sotto il primo tocco. */
  const coda = [];
  /* si comincia dalla famiglia in cui si e' — se si e' gia' entrati in
     una: e' quella in cui si aprira' una carta fra due secondi */
  const ordine = FAMIGLIE.slice().sort(
    (a, b) => (a.id === attiva ? -1 : 0) - (b.id === attiva ? -1 : 0));
  for(const f of ordine)
    (merci[f.id] || []).forEach((o, k) => {
      if(!o) return;
      coda.push([f.id, k, 288, 216]);
      coda.push([f.id, k, 560, 385]);
    });
  let i = 0;
  provinoOzio = scad => {
    if(mia !== geneProvini) return;   // sorpassata da una famiglia nuova
    const fam = coda[i] && coda[i][0];
    let fatti = 0;
    while(i < coda.length && coda[i][0] === fam &&
          (fatti === 0 || !scad || scad.didTimeout || scad.timeRemaining() > 4)){
      const [f, k, w, h] = coda[i++];
      try { provino(f, k, w, h); } catch(_) { /* un provino in meno, non un guasto */ }
      fatti++;
    }
    window.__proviniPronti = i;
    if(fatti){
      dipingi();                       // la tela non deve restare col provino sopra
      /* e le carte gia' in scena vanno a prendersi la fotografia che un
         istante fa non c'era: e' qui che si chiude il buco della famiglia
         che arriva dopo la carta */
      ripassaCarteSenzaFoto();
    }
    if(i < coda.length) chiama(provinoOzio, {timeout:1200});
    else provinoOzio = null;
  };
  requestAnimationFrame(() => requestAnimationFrame(
    () => { if(mia === geneProvini) chiama(provinoOzio, {timeout:1200}); }));
}
window.__provini = provinoDi; window.__provino = provino;

const collezioneDi = (fam, k) => COLLEZIONI[schedaDi(fam, k).collezione] || null;

/* LE FOTOGRAFIE DEL PEZZO. La prima e' il RENDER, che e' fedele e isola
   l'articolo; le altre sono gli scatti di Regina, che sono fotografie di
   COLLEZIONE — dentro ce n'e' piu' di un pezzo — e lo dicono nella loro
   didascalia. Quando ci sara' lo shooting per articolo, questa lista
   diventa quella vera e la riga della didascalia se ne va. */
const SCATTI = [
  ["packshot/rg-fl-002.webp", "Dal catalogo di Regina. Lo scatto ritrae la collezione, non il solo pezzo."],
  ["packshot/rg-fl-003.webp", "Dal catalogo di Regina. Lo scatto ritrae la collezione, non il solo pezzo."],
  ["packshot/rg-fl-004.webp", "Dal catalogo di Regina. Lo scatto ritrae la collezione, non il solo pezzo."],
];

/* T3 — LE FOTOGRAFIE ARRIVANO QUANDO SI APRE LA CARTA, non prima.
   Sono centottantaquattromila byte che al banco non guarda nessuno, e
   al banco si guarda per primo. Passano da `scarica` come tutto il
   resto, e quello che torna e' un indirizzo che la galleria puo' dare a
   un <img> senza rifare la richiesta. */
const SCATTO_URL = {};
let scattiChiesti = false;
function portaScatti(){
  if(scattiChiesti) return;
  scattiChiesti = true;
  for(const [nome] of SCATTI)
    scarica(nome)
      .then(b => { SCATTO_URL[nome] = URL.createObjectURL(new Blob([b])); })
      .catch(e => { scattiChiesti = false;
                    console.warn("scatto non arrivato:", nome, e); });
}
const scattoDi = nome => SCATTO_URL[nome] || (VIA + nome + "?v=" + VERSIONE);

/* I SEGNI, disegnati a filo nello spessore del marchio. Nessuna emoji e
   nessuna libreria: cinque figure geometriche che dicono il gesto.

const SEGNI = {

  collezione: '<svg class="segno" viewBox="0 0 22 22" aria-hidden>' +
    '<circle cx="7" cy="7" r="3.3"/><circle cx="15" cy="7" r="3.3"/>' +

    '<circle cx="15" cy="15" r="3.3" stroke-dasharray="1.6 2.1"/></svg>',
  assistenza: '<svg class="segno" viewBox="0 0 22 22" aria-hidden>' +
    '<circle cx="9.5" cy="9.5" r="5.6"/><line x1="13.6" y1="13.6" x2="18.5" y2="18.5"/>' +
    '<line x1="7.3" y1="9.5" x2="11.7" y2="9.5"/></svg>',
  condividi: '<svg class="segno" viewBox="0 0 22 22" aria-hidden>' +
    '<circle cx="5.6" cy="11" r="2.6"/><circle cx="16.4" cy="5.6" r="2.6"/>' +
    '<circle cx="16.4" cy="16.4" r="2.6"/>' +
    '<line x1="7.9" y1="9.8" x2="14.1" y2="6.8"/>' +
    '<line x1="7.9" y1="12.2" x2="14.1" y2="15.2"/></svg>',
  rimuovi: '<svg class="segno" viewBox="0 0 22 22" aria-hidden>' +
    '<circle cx="11" cy="11" r="7.4"/><line x1="6.2" y1="15.8" x2="15.8" y2="6.2"/></svg>',
};
/* L'IMPIANTO E' SCELTO. Se ne sono costruiti tre sulla carta vera, con il
   contenuto vero e all'altezza che ha un telefono con le barre di Safari:
   il TAVOLIERE (riquadri a due colonne, come le mosse di un gioco da
   tavolo), il REGISTRO (righe incise, la lingua del Libretto) e il NASTRO.
   Massimo ha scelto il nastro, e gli altri due escono dal file: il
   deliverable e' il pezzo finito, non il ventaglio. */
function disegnaVoci(voci){
  const V = document.getElementById("voci");
  V.className = "nastro";
  V.innerHTML = voci.map(v =>
    `<button data-fa="${v.id}"${v.grave ? ' class="grave"' : ""}>` +
    (SEGNI[v.id] || "") + `<span class="che">${v.che}</span>` +
    `<span class="perche">${v.perche}</span></button>`).join("");
  for(const b of V.children) b.onclick = () => giraCarta(b.dataset.fa);
}

let cartaFam = null, cartaK = -1;
/* da dove veniva il fuoco quando la carta si e' aperta: la tela non e'
   raggiungibile col tabulatore e non deve esserlo, ma deve poter
   RICEVERE il fuoco quando glielo si restituisce — se no chiudendo la
   carta il fuoco torna in cima al documento e chi naviga con la tastiera
   riparte da capo ogni volta */
let tornaIlFuoco = null;
document.getElementById("stanza").setAttribute("tabindex", "-1");

function apriCarta(fam, k){
  /* ── GIA' APERTA SU QUESTO PEZZO: NON SI RIAPRE ────────────────
     Serve alla carta con la finestra. Li' il tocco dentro il ritaglio
     scende alla tela, e al livello del pezzo un tocco sul gioiello vuol
     dire «apri la sua carta»: la carta e' gia' aperta, e riaprirla
     rifarebbe tutto da capo — fuoco compreso, che salterebbe via da
     dove lo si e' lasciato — per non cambiare niente. */
  if(!cartaPezzo.hidden && cartaFam === fam && cartaK === k) return;
  cartaFam = fam; cartaK = k;
  portaScatti();                  // T3: la galleria si apre da qui, non prima
  const r = (RIPIANI[fam] || [])[k] || ["", "", ""];
  const sc = schedaDi(fam, k);
  foglio.classList.remove("girata");
  /* SI LEGGE DALLA DISPENSA. `provino` tiene la sua cache: se il lavoro
     a vuoto l'ha gia' fatta, qui non si disegna niente e l'apertura non
     costa un fotogramma. Se non l'ha fatta — carta aperta nel primo
     secondo — si disegna adesso, come prima: la cache e' un vantaggio,
     non una dipendenza. */
  document.querySelector(".riga-foto").classList.remove("senza-foto");
  ritratto.src = provino(fam, k, 560, 385);
  document.getElementById("quante-foto").textContent =
    (1 + SCATTI.length) + " foto";
  document.getElementById("carta-nome").textContent = r[0];
  document.getElementById("carta-mat").textContent = r[1];
  /* ── NOME · MATERIALE · PREZZO, e poi due righe ────────────────
     Il prezzo esce dalla tabella e prende il suo posto: terzo, sotto il
     materiale, con un corpo suo. E' l'ordine con cui lo si legge in una
     vetrina — che cos'e', di che cos'e' fatto, quanto costa — e nessuna
     maison lo mette in una casella con l'etichetta «VALORE» sopra.
     Poi restano DUE righe, non tre caselle:
       · quando e' entrato e in che collezione sta;
       · se e' un regalo, da chi e cosa comporta.
     La prima c'e' sempre: senza scheda dice «In negozio», che e' vero e
     non lascia un buco. Erano 240 punti di bianco su un pezzo che ha il
     solo valore — misurati — e adesso non c'e' piu' una casella che
     possa restare vuota, perche' non ci sono piu' caselle. */
  const col = collezioneDi(fam, k);
  document.getElementById("carta-prezzo").textContent = r[2] ? r[2] + " €" : "";
  const righeDati = [];
  righeDati.push("<div>" + (sc.quando ? "Dal " + sc.quando : "In negozio") +
                 (col ? " · " + col.nome : "") + "</div>");
  /* ── E CHI HA RICEVUTO UN REGALO DEVE SAPERLO QUI ──────────────
     Su un pezzo con un nome in `da` il tasto «Regala» non compare — e'
     la regola etica di Massimo, un dono non rimbalza — ma la ragione
     stava scritta SOLO sul retro di quel tasto, cioe' nell'unico posto
     che quel pezzo non puo' aprire. Chi riceve vedeva un nastro con un
     tasto in meno e nessuna spiegazione: un'assenza non insegna niente.
     La regola sale sul fronte, sotto i dati, e lo stato si dice come lo
     dicono le maison — una parola in maiuscoletto, non una pastiglia
     colorata. */
  if(sc.da) righeDati.push('<div class="regalo"><span class="stato">Ricevuto da ' +
    sc.da + "</span> · non si rigira e non chiude collezioni</div>");
  document.getElementById("carta-dati").innerHTML = righeDati.join("");

  const ded = dedicaBox;
  if(sc.dedica){
    ded.hidden = false;
    document.getElementById("dedica-testo").textContent = "« " + sc.dedica + " »";
    document.getElementById("dedica-firma").textContent = sc.da ? sc.da : "";
    /* LUNGA O CORTA LO DICONO I PIXEL, non il numero di lettere. Si misura
       l'altezza vera del paragrafo: se supera tre righe, si taglia e si
       offre di girare la carta. Contando i caratteri, una dedica di
       centoventi lettere tutte strette ci stava e veniva tagliata comunque. */
    ded.classList.remove("lunga");
    requestAnimationFrame(() => {
      const p = document.getElementById("dedica-testo");
      const riga = parseFloat(getComputedStyle(p).lineHeight) || 21;
      if(p.scrollHeight > riga * 4.4) ded.classList.add("lunga");
    });
  } else ded.hidden = true;
  foglio.querySelector(".fronte").classList.toggle("senza-dedica", !sc.dedica);

  /* ── CHI C'E' SUL NASTRO LO DECIDE IL PEZZO ────────────────────
     Non un menu fisso con le voci spente: le voci che non hanno senso per
     QUESTO pezzo non esistono, e le altre si dividono la riga in parti
     uguali. Due regole, e vengono dai dati, non dal gusto:
       · LA COLLEZIONE si dichiara. Un pezzo che non appartiene a nessuna
         non ha niente da mostrare, e il tasto non c'e';
       · UN REGALO NON SI RIGALA. Se il pezzo e' arrivato da qualcuno — c'e'
         un nome in `da` — il tasto «regala» esce. E' una regola etica
         prima che funzionale: passare avanti una cosa che ti e' stata
         data e' un'altra faccenda, e un'app non deve renderla comoda.
     Resta sempre quello che vale per ogni pezzo: assistenza, condividi,
     rimuovi. */
  const voci = [];
  if(!sc.da) voci.push({id:"regala", che:"Regala", perche:"con una scansione"});
  if(col) voci.push({id:"collezione", che:"Collezione",
                     perche:"cosa manca a " + col.nome});
  voci.push({id:"assistenza", che:"Assistenza", perche:"una misura, una saldatura"});
  voci.push({id:"condividi", che:"Condividi", perche:"fallo vedere a chi vuoi"});
  voci.push({id:"rimuovi", che:"Rimuovi", perche:"smarrito, o non piu’ tuo",
             grave:true});
  disegnaVoci(voci);

  accogli(cartaPezzo);
  /* ── IL FUOCO ENTRA CON LA CARTA ─────────────────────────────
     `role="dialog" aria-modal="true"` era dichiarato e il fuoco restava
     sul corpo della pagina: misurato, `document.activeElement` era BODY
     prima, dentro e dopo. Per un lettore di schermo quella non e' una
     finestra modale, e' testo comparso da qualche parte; e per chi
     naviga con la tastiera il primo tabulatore riparte dall'inizio del
     documento, cioe' da sotto la carta.
     Il fuoco va sulla FACCIA, non sul tondo che chiude. Provato con il
     tondo e fotografato: l'anello turchese del fuoco compariva sopra la
     fotografia del gioiello appena la carta si apriva — Chrome, quando
     il fuoco lo sposta il codice, decide da solo se disegnare l'anello,
     e su un bottone lo disegna volentieri. Un foglio con `tabindex="-1"`
     riceve il fuoco senza anello, dice al lettore di schermo dove si e'
     finiti, e il primo tabulatore va comunque sul tondo che chiude,
     perche' e' il primo comando dentro la faccia. E si ricorda da dove
     veniva il fuoco, per rimetterlo li' alla chiusura. */
  tornaIlFuoco = document.activeElement;
  requestAnimationFrame(() => {
    if(!cartaPezzo.hidden) foglio.querySelector(".fronte").focus();
  });
  /* la finestra viene DOPO il contenuto: il ritaglio si misura sul
     riquadro impaginato, e l'inquadratura si fa sul ritaglio. Il buco si
     rifa' anche a entrata finita, perche' mentre la carta si porge e'
     ancora scalata di 3,5 centesimi e spostata di otto punti. */
  vestiStriscia();
  segnaSugg();
  misuraCarta();
  inquadraNellaFinestra();
  rifaiFinestra();
  /* ── E SI SEGUE FINCHE' NON SI E' POSATO ──────────────────────
     L'inquadratura della finestra si calcola sul riquadro impaginato, e
     nei primi mezzo secondo il riquadro si sta ancora impaginando: la
     carta entra scalata, il cartellino si ritira in 0,22 s e l'altezza
     si assesta in 0,34. Erano due correzioni ritardate, a 240 e a 480
     ms — due strappi in mezzo a un volo. Adesso si segue il riquadro a
     ogni fotogramma finche' si muove (vedi il ciclo): una strada sola,
     dal punto in cui sta il pezzo al centro della finestra. */
  seguiFinestra = SEGUI_S;
}

/* SI CHIUDE COME SI E' APERTA, PIU' IN FRETTA. Prima: `hidden = true`, e
   la carta spariva in 13 millisecondi misurati — un fotogramma — dopo
   essere entrata in 240. La faccia si rimette sul fronte solo a uscita
   FINITA: girarla mentre e' ancora in campo si vedrebbe. */
function chiudiCarta(){
  if(cartaPezzo.hidden) return;
  /* IL FUOCO SI RESTITUISCE SUBITO, non a uscita finita: fra l'una e
     l'altra ci sono 220 millisecondi in cui il fuoco starebbe su un
     bottone che si sta dissolvendo, e un lettore di schermo lo
     annuncerebbe mentre sparisce. */
  const dove = tornaIlFuoco;
  tornaIlFuoco = null;
  if(dove && dove.isConnected && dove !== document.body) dove.focus();
  else document.getElementById("stanza").focus();
  /* LA MACCHINA TORNA DOV'ERA. Con la finestra la carta si era portata il
     pezzo dentro il ritaglio spostando e ingrandendo: chiudendola, quel
     prestito si restituisce, e lo si restituisce con la molla — non di
     scatto — perche' e' un'inquadratura che torna, non un taglio. Il buco
     invece si toglie subito: un velo che sta svanendo con un foro dentro
     lascia una macchia chiara per due decimi di secondo. */
  zoomMeta = 1; panMetaX = 0; panMetaY = 0;
  seguiFinestra = 0;
  veloCarta.style.clipPath = fronteCarta.style.clipPath = "";
  strisciaFoto.hidden = true;
  sveglia();
  /* e i suggerimenti in scena tornano a USCITA FINITA, non adesso:
     `segnaSugg` guarda se la carta e' nascosta, e per altri duecento
     millisecondi non lo e' — chiamata qui direbbe sempre di tenerli
     spenti, e non li riaccenderebbe piu' nessuno. */
  congeda(cartaPezzo, () => { foglio.classList.remove("girata"); segnaSugg(); });
}

/* quanto e' alta la faccia che si sta guardando, e quanto ne concede lo
   schermo. Si misura DOPO l'impaginazione: chiesta subito, scrollHeight
   torna l'altezza della carta di prima. */
function misuraCarta(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const girata = foglio.classList.contains("girata");
    /* SI MISURA IL CONTENUTO, NON IL CONTENITORE. Leggevo lo scrollHeight
       dello scorrevole: ma quello e' `flex:1`, quindi quando il contenuto
       e' piu' corto della carta il suo scrollHeight E' l'altezza della
       carta — e la carta non si accorciava mai. Passando dalla collezione
       (614) all'assistenza (che ne vuole 450) restava a 614, con
       centosessanta punti di carta vuota sotto.
       Si sommano le altezze dei figli: in una colonna flessibile i margini
       non collassano, quindi la somma e' esatta. */
    const d = foglio.querySelector((girata ? ".retro" : ".fronte") + " .dentro-carta");
    const sd = getComputedStyle(d);
    let alto = parseFloat(sd.paddingTop) + parseFloat(sd.paddingBottom);
    for(const c of d.children){
      if(c.hidden) continue;
      const cs = getComputedStyle(c);
      if(cs.display === "none") continue;
      /* e un margine che vale piu' di 120 punti non e' un margine: e'
         un `auto` risolto nello spazio libero. Non si somma. */
      const ms = m => (m > 120 ? 0 : m);
      alto += c.offsetHeight + ms(parseFloat(cs.marginTop)) + ms(parseFloat(cs.marginBottom));
    }
    const concesso = cartaPezzo.clientHeight - 52;
    foglio.style.height = Math.min(concesso, Math.ceil(alto)) + "px";
    segnaScorrimento();
    /* l'altezza appena scritta sposta la carta in verticale — sta al
       centro dello schermo — e con lei il riquadro della finestra: il
       buco e l'inquadratura vanno rifatti sulla misura nuova, non su
       quella di prima. E' anche l'unico momento in cui il riquadro e'
       davvero al suo posto: chiamata dall'apertura, la misura sarebbe
       ancora quella della carta di prima. */
    inquadraNellaFinestra();
    rifaiFinestra();
  }));
}

/* ── «C'E' ALTRO SOTTO» ───────────────────────────────────────────
   Coricato, misurato: alla carta lo schermo concede 338 punti e il
   contenuto ne vuole 489. La colonna scorreva e non lo diceva in nessun
   modo — niente barra, niente sfumatura, niente — e il nastro delle
   azioni, che il verdetto di Massimo vuole visibile subito, cadeva
   quarantasette punti sotto il bordo della carta.
   Il nastro se lo risolve il foglio di stile incollandolo in fondo. Qui
   si accende il segno che dice che sotto c'e' altro, e si spegne quando
   si e' arrivati in fondo: una sfumatura che resta accesa a fine corsa
   e' una bugia piccola ma continua. */
function segnaScorrimento(){
  for(const f of foglio.querySelectorAll(".faccia")){
    const d = f.querySelector(".dentro-carta");
    if(!d) continue;
    f.classList.toggle("scorre",
      d.scrollHeight > d.clientHeight + 1 &&
      d.scrollTop + d.clientHeight < d.scrollHeight - 2);
  }
}
for(const d of foglio.querySelectorAll(".dentro-carta"))
  d.addEventListener("scroll", segnaScorrimento, {passive:true});

/* ── IL RETRO ─────────────────────────────────────────────────
   Ogni azione ha il suo seguito qui: il titolo, cosa comporta, e — dove
   serve — il codice da far inquadrare. Il codice e' un QR VERO, generato
   da codici.py: un quadrato che ha l'aria di un QR lo si scopre la prima
   volta che qualcuno prova a leggerlo. */
/* QUALE PROMO SI VEDE LO DICE QUANTO MANCA. Nessun testo inventato al
   volo: si scelgono fra quelli scritti nei dati della collezione. */
/* E IL NUMERO LO DICE IL NUMERO. La riga per «ne manca piu' di uno» era
   scritta «A un pezzo dalla chiusura…»: la stessa frase del caso in cui
   ne manca esattamente uno, letta da chi ne ha ancora tre da prendere.
   Non era una svista di copia: era una frase che non aveva un posto dove
   mettere la quantita'. Adesso ce l'ha — un segnaposto {n} — e la si
   riempie qui, dove il numero e' gia' stato contato. */
function righePromo(col, mancano){
  const p = col.promo || {};
  const righe = [];
  if(mancano === 0 && p.chiusa) righe.push(p.chiusa);
  else if(mancano === 1 && p.manca1) righe.push(p.manca1);
  else if(mancano > 1 && p.manca) righe.push(p.manca.replace("{n}", mancano));
  if(p.sempre) righe.push(p.sempre);
  if(!righe.length) return "";
  return '<div class="promo">' + righe.map(t => "<div>" + t + "</div>").join("") + "</div>";
}

function giraCarta(fa){
  const r = (RIPIANI[cartaFam] || [])[cartaK] || ["", "", ""];
  const cod = CODICE(cartaFam, cartaK);
  const col = collezioneDi(cartaFam, cartaK);
  const T = document.getElementById("retro-titolo");
  const S = document.getElementById("retro-sotto");
  const Q = document.getElementById("retro-qr");
  const C = document.getElementById("retro-codice");
  const N = document.getElementById("retro-note");
  const F = document.getElementById("retro-fondo");
  Q.classList.remove("c-e"); C.textContent = ""; N.innerHTML = "";
  const conQR = (testo) => {
    document.getElementById("retro-qr-img").src = QR[cod] || "";
    Q.classList.add("c-e");
    C.textContent = cod;
    if(testo) N.innerHTML = testo;
  };
  /* ══════════════════════════════════════════════════════════════
     OGNI TASTO PORTA LA SUA AZIONE

     Com'era, in due righe: si disegnavano tutti i tasti, e poi
     `F.children[F.children.length - 1].onclick = …` ne collegava UNO —
     l'ultimo — al ritorno sul fronte. Tutti gli altri restavano
     rettangoli colorati senza gestore: misurati, tre su sei. «Rimuovi»
     in rosso pieno, «Copia il link» in turchese e «Annulla» sul regalo
     si premevano e non succedeva niente. Non e' una funzione mancante:
     e' un tasto che promette e non mantiene, che e' peggio di un tasto
     che non c'e'.
     Adesso ogni voce della lista porta la propria azione come terzo
     elemento, e chi non ce l'ha torna sul fronte — che e' il
     comportamento di serie sensato per un tasto sul retro di una carta.
     ══════════════════════════════════════════════════════════════ */
  const tornaAlFronte = () => { foglio.classList.remove("girata"); misuraCarta(); };
  const tasti = (lista) => {
    F.innerHTML = lista.map(([t, cl]) =>
      `<button type="button"${cl ? ' class="' + cl + '"' : ""}>${t}</button>`).join("");
    [...F.children].forEach((b, i) => {
      const fa = lista[i][2];
      b.onclick = fa ? () => fa(b) : tornaAlFronte;
    });
  };

  /* ── COPIA IL LINK, e lo copia davvero ─────────────────────────
     Due strade perche' `navigator.clipboard` esiste solo in un contesto
     sicuro: su `https` e su `localhost` c'e', su un indirizzo di rete
     locale in chiaro — cioe' il telefono di Massimo che apre la pagina
     dal computer — non c'e' affatto, e la promessa cadrebbe proprio nel
     posto dove la si prova. La riserva e' vecchia ma funziona ovunque.
     E il riscontro sta SUL TASTO: due secondi di «copiato» al posto
     dell'etichetta. Una striscia in basso, qui, direbbe una cosa che si
     e' appena fatta col dito a tre centimetri di distanza. */
  const copiaIlLink = (b) => {
    const via = location.origin + location.pathname +
                "?f=" + cartaFam + "&p=" + cartaK;
    const detto = () => {
      if(b.__t) return;
      const prima = b.textContent;
      b.textContent = "copiato";
      b.__t = setTimeout(() => { b.textContent = prima; b.__t = null; }, 2000);
    };
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(via).then(detto, () => riserva(via, detto));
    else riserva(via, detto);
  };
  const riserva = (testo, poi) => {
    const a = document.createElement("textarea");
    a.value = testo; a.setAttribute("readonly", "");
    a.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(a); a.select();
