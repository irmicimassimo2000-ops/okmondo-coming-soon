    while(px > fondoScala && titolo.offsetHeight > px * 2.3){
      px -= 2;
      titolo.style.fontSize = px + "px";
    }
    return;
  }
  let px = fondo.classList.contains("ritirato") ? 27 : 34;
  titolo.style.fontSize = px + "px";
  while(px > 21 && titolo.offsetHeight > px * 1.5){
    px -= 2;
    titolo.style.fontSize = px + "px";
  }
}

/* == LA FISICA DEL GESTO =====================================
   Uno swipe che si sente sotto il pollice ha tre cose, e nessuna e' un
   abbellimento.
   1. UNA POSIZIONE CONTINUA, non una soglia: il dito muove `pos` uno a uno
      e la scena lo segue in ogni istante.
   2. L'INERZIA: al rilascio la velocita' prosegue e decide dove si finisce.
   3. L'AGGANCIO CON MOLLA, non con interpolazione: una molla arriva, si
      posa e si ferma.
   E ai capi la GOMMA: oltre l'ultimo pezzo la scena resiste e torna. */
/* ── QUANTO VALE UN DITO ───────────────────────────────────────────
   Era un numero solo per tutte le famiglie: 108 pixel di dito valgono una
   stazione. Ma una stazione non e' la stessa cosa in nessuna delle cinque:
   sulle collane vale una LARGHEZZA DI QUADRO (il 94 per cento dello
   schermo), sugli anelli il passo fra due colonnine (poche decine di
   pixel). Misurato con cento pixel di dito, la merce si spostava di 246
   pixel sulle collane, 128 sui bracciali, 93 sugli orecchini, 36 sugli
   anelli e 37 sugli orologi: da 0,36 a 2,46 volte il dito, sette volte di
   differenza fra una famiglia e l'altra. E' quello che si sente come
   «non coordinato» e «un po' casuale», e non e' un difetto di gusto: e'
   la stessa costante usata per cinque grandezze diverse.
   Adesso il passo del dito e' la MISURA SULLO SCHERMO di una stazione, e
   il freno e' in pixel: il dito porta la scena uno a uno e si ferma sempre
   dopo gli stessi quarantasei pixel, in tutte e cinque. */
let PASSO_DITO = 108;        // pixel di dito per una stazione: lo riscrive
                             // inquadraFamiglia, famiglia per famiglia
const CENNO_PX = 46;         // quanti pixel di scena si lascia tirare, al piu'
/* e la VELOCITA' si misura in PIXEL al secondo, non in stazioni al secondo.
   Dividendola per il passo, la stessa spinta del pollice valeva 0,85
   stazioni su una famiglia e 2,4 su un'altra: la soglia del lancio
   scattava a velocita' diverse a seconda di dove ti trovavi. */
const LANCIO_PX = 320;       // pixel al secondo che valgono un lancio
/* LA MOLLA E' PIU' MORBIDA DI PRIMA. A 210 arrivava in due decimi di
   secondo: giusta quando il dito portava la scena quasi a destinazione e
   alla molla restava solo l'ultimo pezzo di strada. Adesso che il dito si
   ferma a un terzo e il viaggio lo fa tutto la molla, quella rigidita' lo
   faceva sembrare uno scatto. A 130 dura poco meno di mezzo secondo:
   MISURATO, 468 ms dal rilascio alla quiete. Riprende la velocita' che
   aveva il dito e da li' rallenta fino a posarsi — e resta critica, quindi
   non supera il bersaglio e non torna mai indietro (sforamento 0 in tutte
   e cinque le prove). */
const K_POS = 130;
let pos = 0, posV = 0, posMeta = 0, posGiu = 0;
let giu = null, mosso = 0, mossoY = 0, partenzaX = 0;
let giroGiu = 0, altGiu = 0.12, dondolo = 0, giroBase = 0, giroV = 0;
let ultimoX = 0, ultimoT = 0, velDito = 0;
const raggio = new THREE.Raycaster(), schermo = new THREE.Vector2();

/* ══════════════════════════════════════════════════════════════
   DA QUANTO NESSUNO TOCCA

   Non e' un orologio: e' un contatore che si somma dentro il ciclo di
   disegno, un fotogramma per volta. Deve essere cosi' perche' il collaudo
   pilota il tempo A MANO — con `performance.now()` il banco di prova
   misurerebbe sempre «fermo da dodici ore» e il dondolo non si potrebbe
   provare affatto.
   Lo leggono due cose: il dondolo del pezzo, che dopo dodici secondi si
   posa e lascia spegnere il ciclo, e la regola del TOCCO IN MOTO.
   ══════════════════════════════════════════════════════════════ */
let etaFerma = 0;
function tocco(){ etaFerma = 0; }

/* ── IL TOCCO CHE FERMA ─────────────────────────────────────────
   Misurato prima di questa riga: al livello 1, con la molla che correva a
   2,77 stazioni al secondo, un tocco portava fuori dalla famiglia
   (livello 1 → 0); al livello 2, con la coda della rotazione ancora in
   corsa, portava fuori dal pezzo (2 → 1). Cioe': mentre la scena si
   muoveva, il dito faceva una TERZA cosa — e nessuno tocca uno schermo in
   movimento per navigare, lo tocca per fermarlo. E' il gesto piu' vecchio
   che ci sia: si appoggia la mano su una cosa che gira.
   Quindi: se al momento in cui il dito scende qualcosa si muove, quel
   gesto vale solo come freno. Agisce soltanto un tocco su scena ferma. */
/* ── LE TRE VARIANTI DEL RILASCIO ───────────────────────────────
   `tetto` e' la velocita' massima che si eredita dal dito (rad/s),
   `tau` la costante con cui si spegne (s). La coda vale tetto×tau, ed e'
   il numero da guardare: e' di quanto il gioiello continua a girare da
   solo dopo che l'hai lasciato. */
const MOTI = {
  a:{tetto:0,     tau:0.05},    // model-viewer: 0 rad di coda
  b:{tetto:1.572, tau:0.4995},  // iPhone, tagliata a 45 gradi: 0,785 rad
  c:{tetto:4.5,   tau:0.38}     // quella di oggi: 1,71 rad, cioe' 98 gradi
};
const MOTO_DI_SERIE = "c";
window.__moto = (() => {
  const m = (q.get("moto") || MOTO_DI_SERIE).toLowerCase();
  return MOTI[m] ? m : MOTO_DI_SERIE;
})();

function inMoto(){
  if(velaVerso) return true;
  if(occhio.distanceTo(occhioObiettivo) > 0.004) return true;
  if(livello === 1) return Math.abs(pos - posMeta) > 0.004 || Math.abs(posV) > 0.02;
  if(livello === 2) return Math.abs(giroV) > 0.02;
  return false;
}

function limiteN(){ return attiva ? stazioni(attiva).length - 1 : 0; }
/* LA GOMMA NON E' UNA FRAZIONE, E' UN ASINTOTO. Con un terzo fisso il dito
   porta la scena tre pezzi oltre l'ultimo, e c'e' uno spigolo sul capo:
   dentro il dito vale 1, fuori 0,32, e quel gradino si sente. Qui la
   resistenza cresce da 1 a infinito e la scena non esce MAI oltre mezzo
   pezzo, per quanto forte si tiri. */
const OLTRE = 0.55;
function gomma(x, lo, hi){
  if(x < lo) return lo - OLTRE * (1 - 1 / ((lo - x) / OLTRE + 1));
  if(x > hi) return hi + OLTRE * (1 - 1 / ((x - hi) / OLTRE + 1));
  return x;
}

/* ── IL PIZZICO: ingrandire e spostare con le stesse due dita ─
   Non sono due gesti in fila, e' un gesto solo: la distanza fra le dita
   decide l'ingrandimento, e il loro punto di mezzo decide dove si guarda.
   Si applica DOPO la molla e senza smorzarlo: un pizzico deve seguire le
   dita uno a uno, o sembra che l'immagine scivoli via da sotto. */
let zoom = 1, panX = 0, panY = 0;
let zoomMeta = 1, panMetaX = 0, panMetaY = 0;
let zoomV = 0, panVX = 0, panVY = 0;
const dita = new Map();
let pizzico = null;

function azzeraPizzico(){
  zoom = zoomMeta = 1; panX = panMetaX = 0; panY = panMetaY = 0;
  zoomV = panVX = panVY = 0; pizzico = null;
}
/* IL POSTO GIUSTO NON E' SEMPRE IL CENTRO. Con la carta a finestra
   aperta, il posto del pezzo e' la FINESTRA: e' li' che lo si e' messo
   aprendo la carta, e un pizzico lasciato a meta' deve riportarlo li',
   non al centro dello schermo sotto il cartoncino. */
function tornaAlPosto(){
  if(inquadraNellaFinestra()) return;
  zoomMeta = 1; panMetaX = 0; panMetaY = 0;
}

function misuraDita(){
  const [a, b] = [...dita.values()];
  return {d: Math.hypot(a.x - b.x, a.y - b.y),
          mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
}

stanza.addEventListener("pointerdown", e => {
  dita.set(e.pointerId, {x:e.clientX, y:e.clientY});
  // la cattura del puntatore serve perche' il dito possa uscire dal
  // riquadro senza perdere il gesto, ma non deve poter far cadere il
  // resto: se il browser la rifiuta, il pizzico non si apriva nemmeno
  try { stanza.setPointerCapture(e.pointerId); } catch(_) {}
  if(dita.size === 2 && livello > 0){
    // il secondo dito apre il pizzico e chiude il trascinamento: tenerli
    // aperti tutti e due faceva scorrere la fila mentre si ingrandiva
    giu = null;
    const m = misuraDita();
    pizzico = {d:m.d, mx:m.mx, my:m.my, zoom:zoom, panX:panX, panY:panY};
    return;
  }
  if(dita.size > 1) return;
  /* CHI SCENDE MENTRE QUALCOSA SI MUOVE E' UN FRENO, non un comando. Lo si
     decide QUI, al contatto, non al rilascio: fra i due c'e' mezzo secondo
     in cui la scena si sarebbe fermata da sola e la domanda non avrebbe
     piu' risposta. */
  const fermava = inMoto();
  tocco();
  stanza.classList.add("tira");
  giu = {x:e.clientX, y:e.clientY, fermava}; mosso = 0; mossoY = 0;
  if(fermava && livello === 1){
    /* la fila si pianta DOVE STA, come una lista che si scorre: la molla
       non ha piu' un bersaglio lontano da raggiungere */
    posMeta = pos; posV = 0;
  }
  /* DA DOVE RIPARTE IL GIRO. Non da zero: da DOVE STA. Il pezzo si girava
     con `giroP = -mosso*0.0075` e `altP = 0.12 - mossoY*0.0045`, cioe'
     sempre a partire dall'origine — alzavi il dito e lo riappoggiavi, e la
     macchina saltava di colpo indietro all'angolo di partenza. Sulla posa
     stesa, che si guarda da 1,22 radianti, il salto era di settanta gradi
     al primo tocco. Un oggetto che si rigira in mano riparte da come lo si
     e' lasciato. */
  giroGiu = giroP; altGiu = altP; giroV = 0;
  partenzaX = occhioObiettivo.x;
  posGiu = pos; posV = 0; velDito = 0;
  ultimoX = e.clientX; ultimoT = performance.now();
});

stanza.addEventListener("pointermove", e => {
  if(dita.has(e.pointerId)) dita.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pizzico && dita.size === 2){
    const m = misuraDita();
    zoom = zoomMeta = Math.max(0.7, Math.min(5,
             pizzico.zoom * (m.d / Math.max(24, pizzico.d))));
    /* lo spostamento si misura in METRI, non in pixel: quanto mondo copre
       un pixel dipende da quanto si e' lontani, e a quattro centimetri da
       una creola un pixel vale un decimo di quello che vale al banco. */
    const dist = occhio.distanceTo(mira) / zoom;
    const perPixel = 2 * dist * Math.tan(camera.fov*Math.PI/360) / innerHeight;
    panX = panMetaX = pizzico.panX - (m.mx - pizzico.mx) * perPixel;
    panY = panMetaY = pizzico.panY + (m.my - pizzico.my) * perPixel;
    sveglia();
    return;
  }

  if(!giu) return;
  tocco();
  mosso = e.clientX - giu.x; mossoY = e.clientY - giu.y;
  /* LA VELOCITA' SI MISURA CON UNA MEDIA MOBILE. Un solo campione fra due
     fotogrammi e' rumore, e un flick misurato male manda il pezzo tre
     posizioni piu' in la' senza che nessuno l'abbia chiesto. */
  const ora = performance.now(), dt = Math.max(8, ora - ultimoT);
  velDito = velDito * 0.72
          + ((ultimoX - e.clientX) / (dt / 1000)) * 0.28;
  ultimoX = e.clientX; ultimoT = ora;

  if(livello === 0){
    const lim = Math.max(0, LARGO_BANCO/2 - 0.06);
    occhioObiettivo.x = Math.max(-lim, Math.min(lim, partenzaX - mosso*0.0016));
    miraObiettivo.x = occhioObiettivo.x;
    partenzaBanco = occhioObiettivo.x;
    /* SOLO FRA QUELLE CHE SONO GIA' SUL BANCO. Con le famiglie a tappe
       `gruppi[f.id]` puo' non esserci ancora, e questa riga la chiama un
       trascinamento qualunque. */
    let vicino = null;
    for(const f of FAMIGLIE){
      if(!gruppi[f.id]) continue;
      if(!vicino || Math.abs(gruppi[f.id].position.x - occhioObiettivo.x)
                  < Math.abs(gruppi[vicino.id].position.x - occhioObiettivo.x)) vicino = f;
    }
    if(vicino && vicino.id !== davanti){ davanti = vicino.id; segnaMenu();
      scritte(vicino.nome, "", stazioni(vicino.id).length + " in vetrina",
              "trascina per scorrere · tocca per entrare"); }
  } else if(livello === 1){
    /* IN SELEZIONE IL DITO ACCENNA, NON SCORRE. Prima la scena seguiva il
       dito uno a uno: e' giusto per una lista che scorre, ma qui uno swipe
       deve valere UN cambio di visuale, netto. Se la scena segue tutto il
       trascinamento, a meta' gesto ci si trova a meta' fra due espositori e
       il cambio non e' piu' un cambio, e' uno scorrimento che a un certo
       punto si ferma.
       Quindi il dito muove la scena uno a uno finche' il movimento e'
       piccolo, poi la resistenza cresce e si ferma a un terzo di stazione:
       si vede che l'espositore accanto c'e' e che il gesto e' stato preso,
       ma dove si va lo decide il RILASCIO. */
    const accennoPx = CENNO_PX * Math.tanh(-mosso / CENNO_PX);
    pos = gomma(posGiu + accennoPx / PASSO_DITO, 0, limiteN());
    posMeta = pos;
    applicaPos(true);
  } else if(livello === 2){
    /* AL PEZZO IL DITO NON SCORRE, GIRA. Il gioiello e' li' davanti: la
       cosa che si vuole fare e' voltarlo, come lo si volterebbe in mano.
       E QUANTO GIRA SI DICHIARA, non si tara a caso. Era 0,0075 radianti
       per pixel: una passata di dito su tutto lo schermo — trecentonovanta
       punti — valeva 168 gradi, meno di mezzo giro. Per vedere il retro di
       un anello servivano due passate, e il gesto si legge come pesante.
       Una passata di schermo vale UN GIRO INTERO: 2*pi / larghezza. Su un
       telefono da 390 fa 0,0161 rad per pixel, su uno stretto un po' di
       piu' — che e' giusto, perche' il gesto e' «attraversa lo schermo»,
       non «percorri tot pixel». */
    giroP = giroGiu - mosso * (2 * Math.PI / innerWidth);
    /* E NON SI SCENDE SOTTO IL BANCO. L'alzata arrivava a -0,45: la
       macchina passava sotto il piano di pietra, che e' opaco, e il pezzo
       spariva dietro il proprio appoggio. Il fondo dipende da come sta il
       pezzo — uno steso sulla pietra lo si guarda dall'alto e sotto i venti
       gradi non c'e' niente da vedere; uno in piedi lo si puo' guardare
       quasi in faccia, ma mai da sotto. */
    /* e il fondo di un pezzo STESO non e' «sopra il banco», e' «abbastanza
       da vederlo»: a ventidue gradi una collana distesa diventa una riga
       sottile e la posa non racconta piu' niente. Trentadue gradi e' il
       taglio piu' basso con cui un catalogo fotografa un vassoio. */
    const [giu_, su_] = stesa(attiva, scelto) ? [0.56, 1.48] : [0.02, 1.00];
    altP = Math.max(giu_, Math.min(su_, altGiu - mossoY * 0.0045));
    inquadraPezzo();
  }
  sveglia();
});

/* PIZZICARE ALL'INDIETRO E' USCIRE. Allargare le dita avvicina, stringerle
   allontana — e allontanarsi abbastanza vuol dire tornare al quadro di
   prima: dal pezzo all'espositore, dall'espositore al banco. E' lo stesso
   verso del gesto, non un comando in piu' da imparare; e sotto il dito si
   vede la scena rimpicciolire mentre lo si fa, quindi si capisce dove sta
   andando prima di lasciare. La soglia sta a 0,82 e il limite a 0,70: c'e'
   un pezzo di corsa dopo la soglia, per poter cambiare idea tornando
   indietro con le dita senza alzare. */
const PIZZICO_ESCI = 0.82;
function chiudiDito(e){
  dita.delete(e.pointerId);
  if(dita.size < 2 && pizzico){
    pizzico = null;
    if(zoom < PIZZICO_ESCI && livello > 0){ indietro(); return; }
    // sotto un ingrandimento minimo si torna da soli al quadro giusto:
    // restare al 103 per cento non e' una scelta, e' un residuo
    if(zoom < 1.06){ tornaAlPosto(); sveglia(); }
  }
}

addEventListener("pointerup", e => {
  const eraPizzico = !!pizzico;
  const fermava = giu && giu.fermava;
  chiudiDito(e);
  stanza.classList.remove("tira");
  if(!giu){ if(eraPizzico) sveglia(); return; }
  const dx = mosso, dy = mossoY;
  giu = null;
  tocco();
  if(Math.abs(dx) > 24) segnaImparato();

  /* IL FRENO SI FERMA E BASTA. Nessuna stazione riassegnata, nessuna
     uscita dal pezzo: il gesto e' gia' servito a qualcosa — ha fermato la
     scena — e un gesto solo non ne fa due. Al rilascio la fila si posa
     sulla stazione piu' vicina, che e' come si comporta una lista con
     l'aggancio quando la si trattiene e la si lascia. */
  if(fermava && Math.abs(dx) < 8 && Math.abs(dy) < 8){
    if(livello === 1){
      posMeta = Math.max(0, Math.min(limiteN(), Math.round(pos)));
      mostraScheda();
    }
    sveglia();
    return;
  }

  if(livello === 2){
    /* ══════════════════════════════════════════════════════════
       COME SI LASCIA ANDARE UN GIOIELLO — tre modi, e Massimo sceglie

       La velocita' del dito e' in pixel al secondo; diventa radianti al
       secondo con lo stesso cambio del trascinamento: una passata di
       schermo, un giro. Quello che cambia fra le tre varianti e' cosa
       succede DOPO che il dito si e' alzato, e non e' una rifinitura —
       e' il carattere dell'oggetto che si ha in mano.

       · a · NIENTE LANCIO. Si ferma dove lo lasci, con un assestamento
             critico di 50 ms. E' la scelta del visualizzatore 3D di
             Google (Damper.ts, DECAY_MILLISECONDS = 50): un oggetto che
             stai esaminando non deve continuare per conto suo. Coda
             misurata: 0 radianti.
       · b · LANCIO BREVE, la proiezione dello scorrimento di iPhone:
             lambda 0,998 al millisecondo, cioe' una costante di 0,4995 s,
             con la coda tagliata a 45 gradi (0,785 rad). E' il gesto di
             far girare una cosa fra le dita e lasciarla andare un po'.
       · c · QUELLA DI OGGI: tetto 4,5 rad/s, costante 0,38 s.
             IL COMMENTO DI PRIMA MENTIVA. Diceva «al piu' un ottavo di
             giro»: un ottavo sono 45 gradi, e la coda vera — misurata al
             rilascio con il banco _I1_ — e' di 1,78 radianti, cioe' 102
             gradi. Piu' di un quarto di giro, e ci mette 1,68 secondi a
             scendere sotto i 0,02 rad/s. Il numero giusto e' questo, e
             sta scritto qui perche' e' quello che decide se (c) resta.

       Si scelgono con `?moto=a|b|c`, e si cambiano al volo da
       `window.__moto`. Di serie resta (c) finche' Massimo non decide.
       ══════════════════════════════════════════════════════════ */
    const m = MOTI[window.__moto] || MOTI[MOTO_DI_SERIE];
    const perPixel = 2 * Math.PI / innerWidth;
    const v = velDito * perPixel;
    giroV = ridotto ? 0 : Math.max(-m.tetto, Math.min(m.tetto, v));
    giroBase = giroP;
    dondolo = 0;
  }

  if(livello === 1){
    /* LA LEGGE DELLO SFOGLIO. Proiettare la velocita' e arrotondare e' la
       legge di una lista lunga, non di cinque pezzi: un accompagnamento di
       poco piu' di una stazione ne scorreva due. Si parte dalla stazione su
       cui il dito e' SCESO, un lancio ne vale UNO, e solo un lancio molto
       deciso ne scavalca di piu'. */
    /* UNO SWIPE, UNA STAZIONE. Mai due, per quanto forte sia il lancio:
       qui non si sfoglia una lista lunga, si cambia visuale. Un lancio che
       ne scavalca tre lascia chi guarda senza sapere dove e' finito, e su
       cinque anelli non serve a niente.
       Si decide sul gesto, non sulla posizione: se il dito ha percorso
       abbastanza strada o e' partito abbastanza in fretta, si va avanti di
       uno; altrimenti si torna dov'eravamo. */
    const n = limiteN(), base = Math.round(posGiu);
    const STRADA = 30;                       // pixel di dito percorsi
    let passo = 0;
    if(Math.abs(velDito) > LANCIO_PX) passo = Math.sign(velDito);
    else if(Math.abs(dx) > STRADA) passo = -Math.sign(dx);
    posMeta = Math.max(0, Math.min(n, base + passo));
    mostraScheda();
    /* LA MOLLA EREDITA LA VELOCITA' DEL DITO, ma non piu' di quanta ne
       possa assorbire senza superare il bersaglio, e solo se punta verso di
       esso: al capo della fila il dito spinge ancora in fuori mentre la
       meta e' indietro. */
    const verso = Math.sign(posMeta - pos);
    const w = Math.sqrt(K_POS) * Math.abs(pos - posMeta);
    // la molla eredita la velocita' in STAZIONI al secondo: quella del
    // dito e' in pixel, e il cambio di unita' lo fa il passo della famiglia
    const velStaz = velDito / PASSO_DITO;
    posV = Math.sign(velDito) === verso
         ? Math.max(-w, Math.min(w, velStaz)) : 0;
    sveglia();
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8) return;
  }

  /* UN GESTO, UN COMANDO. Il trascinamento verso il basso torna indietro —
     ma sul PEZZO lo stesso trascinamento e' quello che alza e abbassa la
     macchina attorno al gioiello. Facevano tutti e due: si girava il pezzo
     verso l'alto e al rilascio la vista usciva. Non e' un difetto di
     taratura, sono due comandi sullo stesso movimento, e da fuori si legge
     come un'applicazione che non obbedisce.
     Sul pezzo si esce con «indietro», col pizzico all'indietro, o toccando
     fuori dal gioiello: tre strade, nessuna delle quali e' il gesto con cui
     lo si sta guardando. */
  if(livello !== 2 && dy > 70 && Math.abs(dy) > Math.abs(dx)){ indietro(); return; }
  if(Math.abs(dx) < 8 && Math.abs(dy) < 8) tocca(e);
  sveglia();
});
addEventListener("pointercancel", e => { chiudiDito(e); stanza.classList.remove("tira"); });

/* ══════════════════════════════════════════════════════════════
   LA SCRIVANIA — rotella, frecce, Invio, Escape

   Contato prima di questo blocco: la rotella non muoveva niente, le
   frecce nemmeno, Escape non chiudeva la carta. Su un portatile la
   stanza si poteva solo trascinare col mouse tenendo premuto — cioe' si
   usava un telefono con un mouse in mano.
   Una regola sola sotto tutto: i comandi della stanza valgono quando
   sopra non c'e' niente. Se la carta o la galleria sono aperte, la
   rotella scorre il LORO contenuto e le frecce appartengono a loro.
   ══════════════════════════════════════════════════════════════ */
const sopraCiSta = () => !cartaPezzo.hidden || !galleria.hidden;

/* LA ROTELLA SI ACCUMULA, NON SCATTA A OGNI TICCHETTIO. Un pad di un
   portatile manda venti eventi da tre punti per un gesto solo: un passo
   per evento farebbe volare via venti stazioni. Si somma finche' non si
   arriva a un colpo pieno — 120 punti, quello che manda una rotella
   vera — e si azzera. E si azzera anche dopo un terzo di secondo di
   silenzio, perche' due gesti separati non si sommano fra loro. */
const SCATTO_ROTELLA = 120, PAUSA_ROTELLA = 320;
let rotellaSomma = 0, rotellaQuando = 0;
addEventListener("wheel", e => {
  if(sopraCiSta()) return;
  tocco(); sveglia();
  const ora = performance.now();
  if(ora - rotellaQuando > PAUSA_ROTELLA) rotellaSomma = 0;
  rotellaQuando = ora;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;

  if(livello === 2){
    /* AL PEZZO LA ROTELLA GIRA, e continua: un giro non e' un passo
       discreto. Un colpo pieno di rotella vale un ottavo di giro —
       la stessa strada che il dito fa in un ottavo di schermo. */
    if(ridotto || !inMoto()){
      giroP -= d / SCATTO_ROTELLA * (Math.PI / 4);
      giroBase = giroP; giroV = 0; dondolo = 0;
      inquadraPezzo();
    }
    e.preventDefault();
    return;
  }
  rotellaSomma += d;
  if(Math.abs(rotellaSomma) < SCATTO_ROTELLA) return;
  const passo = Math.sign(rotellaSomma);
  rotellaSomma = 0;
  if(livello === 1){
    posMeta = Math.max(0, Math.min(limiteN(), Math.round(posMeta) + passo));
    mostraScheda();
  } else if(livello === 0){
    // al banco si cammina di famiglia in famiglia: e' l'unica misura che
    // esista li', e portare la macchina «di tot metri» non vuol dire niente
    const i = Math.max(0, Math.min(FAMIGLIE.length - 1,
      FAMIGLIE.findIndex(f => f.id === davanti) + passo));
    vaiDavantiA(FAMIGLIE[i].id);
  }
  e.preventDefault();
}, {passive:false});

/* portare la macchina davanti a una famiglia SENZA entrarci: e' quello
   che fa lo scorrimento del banco, e prima esisteva solo dentro il
   trascinamento */
function vaiDavantiA(id){
  if(!gruppi[id]) return;
  partenzaBanco = gruppi[id].position.x;
  occhioObiettivo.x = partenzaBanco; miraObiettivo.x = partenzaBanco;
  if(davanti !== id){
    davanti = id; segnaMenu();
    const f = FAMIGLIE.find(x => x.id === id);
    scritte(f.nome, "", stazioni(id).length + " in vetrina",
            "scorri per scorrere il banco · tocca per entrare");
  }
  sveglia();
}

addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;

  /* ESCAPE CHIUDE QUELLO CHE STA SOPRA, uno strato per volta, e non entra
     nel contenuto di niente: chiama la stessa funzione del tasto. */
  if(e.key === "Escape"){
    if(!galleria.hidden){ chiudiGalleria(); e.preventDefault(); return; }
    if(!cartaPezzo.hidden){ chiudiCarta(); e.preventDefault(); return; }
  }
  if(sopraCiSta()) return;
  // un bottone del cromo che ha il fuoco si aziona con Invio o con la
  // barra: quelle due li' appartengono a lui, non alla stanza
  if((e.key === "Enter" || e.key === " ") && t && t.tagName === "BUTTON") return;
  tocco();

  const passo = d => {
    if(livello === 2){
      /* un colpo di freccia vale quindici gradi: e' la misura con cui si
         gira una cosa in mano per vederne un altro lato, non per
         rivoltarla */
      giroP += d * (Math.PI / 12);
      giroBase = giroP; giroV = 0; dondolo = 0;
      inquadraPezzo();
    } else if(livello === 1){
      posMeta = Math.max(0, Math.min(limiteN(), Math.round(posMeta) + d));
      mostraScheda();
    } else {
      const i = Math.max(0, Math.min(FAMIGLIE.length - 1,
        FAMIGLIE.findIndex(f => f.id === davanti) + d));
      vaiDavantiA(FAMIGLIE[i].id);
    }
    sveglia();
  };

  switch(e.key){
    case "ArrowRight": passo(1);  e.preventDefault(); break;
    case "ArrowLeft":  passo(-1); e.preventDefault(); break;
    case "ArrowUp": case "Enter":
      /* SI ENTRA DI UN PASSO: banco → famiglia → pezzo. Lo stesso
         cammino del tocco, con un tasto invece di un dito. */
      if(livello === 0 && davanti) entra(davanti);
      else if(livello === 1) apriPezzo(indice);
      e.preventDefault(); break;
    case "ArrowDown": case "Escape":
      if(livello > 0) indietro();
      e.preventDefault(); break;
  }
});

/* -- QUELLO CHE LA POSIZIONE MUOVE, PER FAMIGLIA --------------
   E' qui che i tre modi diventano tre cose diverse: la STESSA posizione
   continua muove la macchina lungo la fila degli anelli, la salta da un
   nastro all'altro, e sulle collane fa uscire un espositore e ne fa
   entrare un altro. */
function applicaPos(mentreTrascina){
  if(livello !== 1 || !attiva || !banchi[attiva]) return;
  const g0 = banchi[attiva][0], n = stazioni(attiva).length;
  const modo = MODI[attiva];
  if(modo === "cammina" || modo === "salta"){
    const x = centroStazione(attiva, pos);
    occhioObiettivo.x = x; miraObiettivo.x = x;
    /* ── E QUI LA X SI RISCRIVE, quindi lo scostamento va rimesso ────
       `inquadraFamiglia` centra la famiglia sull'area visibile, ma due
       righe dopo passa di qui il dito e questa funzione SOVRASCRIVE la x
       del bersaglio con quella della stazione. Misurato a 1440x900: la
       fila di anelli tornava centrata sulla tela e non sulla scena, cioe'
       425 punti piu' a destra, con la colonna in quadro mezza dietro il
       pannello. Il modo «scambia» non passa di qui — li' si muovono gli
       espositori, non la macchina — e infatti non aveva il difetto. */
    const lt = scostaDiLato(occhioObiettivo.distanceTo(miraObiettivo), 0);
    if(lt){ occhioObiettivo.x += lt.x; miraObiettivo.x += lt.x; }
  } else {
    /* SCAMBIA: la macchina sta ferma e sono gli ESPOSITORI a scorrere. Il
       primo esce da un lato mentre il secondo entra dall'altro, e in ogni
       istante se ne vedono due — che e' la differenza fra sfogliare e
       cambiare diapositiva. */
    const passo = PASSO_BANCO[attiva], casa = CASA[attiva];
    banchi[attiva].forEach((g, k) => {
      g.position.x = casa + (k - pos) * passo;
      g.visible = Math.abs(k - pos) < 1.6;
    });
  }
}

/* ── TOCCARE UN PEZZO ────────────────────────────────────────
   Non si spara un raggio sulla GEOMETRIA del gioiello. Misurato: la banda
   di una creola da 16 mm, a mezzo metro, e' spessa cinque pixel sullo
   schermo; un perno ne occupa diciassette. Il polpastrello ne copre
   quaranta. Un bersaglio di cinque pixel non si colpisce, e chi prova e
   sbaglia tre volte pensa che l'app sia rotta — non che abbia mancato.
   Quindi si guarda DOVE CADE il dito e si prende il pezzo il cui centro e'
   piu' vicino, entro un raggio comodo. E' la stessa cosa che fa una mano
   davanti a un espositore vero: indica, non infila. */
const _sca = new THREE.Box3(), _pun = new THREE.Vector3();
function schermoDi(p){
  _sca.setFromObject(p); _sca.getCenter(_pun).project(camera);
  return [(_pun.x*0.5+0.5)*innerWidth, (-_pun.y*0.5+0.5)*innerHeight, _pun.z];
}
function pezzoVicino(x, y){
  let quale = -1, minimo = 1e9;
  (merci[attiva] || []).forEach((p, k) => {
    if(!p || !p.visible) return;
    const [sx, sy, sz] = schermoDi(p);
    if(sz > 1) return;                       // dietro la macchina
    const d = Math.hypot(sx - x, sy - y);
    if(d < minimo){ minimo = d; quale = k; }
  });
  return minimo < Math.min(innerWidth, innerHeight) * 0.24 ? quale : -1;
}

/* ── SONO SUL SOGGETTO, O NELL'AMBIENTE? ─────────────────────
   Serve per uscire toccando fuori. Non si spara un raggio sulla geometria —
   un anello e' un filo di pochi pixel e quasi ogni tocco cadrebbe «fuori»
   anche quando il dito e' chiaramente sul gioiello. Si prende invece il
   CERCHIO che il pezzo occupa sullo schermo: si proietta il centro, si
   proietta un punto a un raggio di distanza lungo la destra della
   macchina, e la distanza fra i due in pixel e' il raggio vero. Dentro
   quello (con un dito di margine) si e' sul soggetto. */
const _c1 = new THREE.Vector3(), _c2 = new THREE.Vector3(),
      _lato = new THREE.Vector3();
function cerchioDelPezzo(){
  /* la destra della macchina si legge dalla SUA matrice, non dal vettore
     che il ciclo di disegno si tiene da parte: quello vale solo dopo che un
     fotogramma e' passato, e il primo tocco puo' arrivare prima. Misurato:
     raggio zero, e ogni tocco — anche in mezzo all'anello — risultava
     «fuori dal soggetto». */
  _lato.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _c1.copy(centroP).project(camera);
  _c2.copy(centroP).addScaledVector(_lato, raggioP).project(camera);
  const x1 = (_c1.x*0.5+0.5)*innerWidth, y1 = (-_c1.y*0.5+0.5)*innerHeight;
  const x2 = (_c2.x*0.5+0.5)*innerWidth, y2 = (-_c2.y*0.5+0.5)*innerHeight;
  return [x1, y1, Math.hypot(x2 - x1, y2 - y1)];
}

function tocca(e){
  schermo.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raggio.setFromCamera(schermo, camera);

  if(livello === 2){
    /* SUL PEZZO SI TOCCA IL PEZZO. Fuori si torna indietro — e' il gesto
       di riappoggiare una cosa che ti hanno messo in mano. Sopra, si apre
       la sua CARTA: la foto, i dati, la dedica e quello che con quel pezzo
       si puo' fare. */
    const [cx, cy, r] = cerchioDelPezzo();
    if(Math.hypot(e.clientX - cx, e.clientY - cy) > r * 1.18) indietro();
    else apriCarta(attiva, scelto);
    return;
  }
  if(livello === 1 && merci[attiva] && merci[attiva].length){
    const k = pezzoVicino(e.clientX, e.clientY);
    if(k < 0){
      /* niente merce sotto il dito. Se ha toccato l'ESPOSITORE non succede
         niente — e' il mobile, ci si sta guardando sopra. Se ha toccato
         l'AMBIENTE — il fondo, il ripiano, quello che c'e' di lato — si
         torna al banco: guardare altrove e' gia' dire che hai finito qui. */
      for(const g of banchi[attiva])
        if(g.visible && raggio.intersectObject(g, true).length) return;
      indietro();
      return;
    }
    const qui = stazioni(attiva)[Math.round(pos)] || [];
    if(qui.indexOf(k) >= 0){ apriPezzo(k); return; }
    /* il pezzo toccato sta su un'altra stazione: PRIMA ci si va. Aprirlo
       di colpo da lontano salterebbe un passaggio, e il cliente perde il
       filo di dove si trova. */
    const dove = stazioni(attiva).findIndex(g => g.indexOf(k) >= 0);
    if(dove >= 0){ posMeta = dove; mostraScheda(); sveglia(); }
    return;
  }
  if(livello === 0){
    for(const f of FAMIGLIE){
      const b = (banchi[f.id] || [])[0];
      if(b && raggio.intersectObject(b, true).length){ entra(f.id); return; }
    }
  }
}

/* == IL MOTO ==================================================
   Tutto quello che si muove qui e' una MOLLA CRITICAMENTE SMORZATA, non
   un'interpolazione. Un lerp rallenta all'infinito senza mai arrivare, e a
   occhio da' quella sensazione molliccia che si riconosce subito. */
function molla(x, v, meta, k, dt){
  const d = 2 * Math.sqrt(k);
  v += (-k * (x - meta) - d * v) * dt;
  return [x + v * dt, v];
}

let ultimoFrame = 0;
const occhioV = new THREE.Vector3(), miraV = new THREE.Vector3();
function sveglia(){ if(!vivo){ vivo = requestAnimationFrame(gira); } }

const ALTO_MONDO = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3(), _destra = new THREE.Vector3(),
      _su = new THREE.Vector3(), _spost = new THREE.Vector3(),
      _mira = new THREE.Vector3();

function gira(ora){
  /* IL FOTOGRAMMA E' «IN CORSO», NON «SPENTO». Qui stava `vivo = 0`, e
     una `sveglia()` chiamata DENTRO il fotogramma — la finestra della
     carta la chiama a ogni passo mentre segue il riquadro — trovava il
     ciclo spento e ne apriva un secondo. Due cicli chiamano due
     `sveglia()`, quattro ne chiamano quattro: misurato con la carta
     aperta, 4.096 → 8.192 → 16.384 → 32.768 richieste al secondo, e la
     pagina si pianta. Con un valore che dice «sto disegnando», la sveglia
     dentro il fotogramma non fa nulla, ed e' la coda del fotogramma a
     decidere se ce n'e' un altro. */
  vivo = -1;
  /* IL PASSO DI TEMPO SI MISURA E SI LIMITA: legata ai fotogrammi, la
     stessa molla e' due volte piu' veloce su uno schermo a 120 Hz; e se la
     scheda torna in primo piano dopo un minuto, un dt enorme fa esplodere
     l'integrazione e il pezzo parte per la tangente. */
  // e non puo' mai essere NEGATIVO: l'orologio dei fotogrammi e' monotono,
  // ma il banco di prova pilota il moto a mano e li' un passo all'indietro
  // faceva TORNARE INDIETRO il colore a meta' passaggio
  const dt = ultimoFrame
    ? Math.max(0, Math.min(0.034, (ora - ultimoFrame) / 1000)) : 0.016;
  ultimoFrame = ora;

  // da quanto nessuno tocca: si somma qui, un fotogramma per volta
  if(giu || pizzico) etaFerma = 0; else etaFerma += dt;

  passoVela(dt);
  /* ── LA FINESTRA SI SEGUE, NON SI RINCORRE A SCATTI ────────────
     Con `?carta=finestra` il ritaglio nel cartoncino si misura sul
     riquadro impaginato, e il riquadro nei primi mezzo secondo si sta
     ancora impaginando: la carta entra scalata di 3,5 centesimi, il
     cartellino si ritira in 0,22 s e l'altezza si assesta in 0,34.
     Prima c'erano due CORREZIONI ritardate, a 240 e a 480 ms: due
     strappi su un bersaglio verso cui la molla stava gia' andando, cioe'
     lo stesso difetto del volo al pezzo, un livello piu' su. Adesso il
     bersaglio segue il riquadro a ogni fotogramma finche' il riquadro si
     muove: e' un tragitto solo, e finisce dove il riquadro si ferma. */
  if(seguiFinestra > 0){
    seguiFinestra = Math.max(0, seguiFinestra - dt);
    inquadraNellaFinestra();
    if(!seguiFinestra) rifaiFinestra();
  }

  if(vesteT < 1){
    vesteT = Math.min(1, vesteT + dt / 0.45);
    // una curva morbida in entrata e in uscita: il colore non parte di
    // scatto e non si ferma di scatto
    const t = vesteT * vesteT * (3 - 2 * vesteT);
    tingi(_ora.copy(_da).lerp(_a, t));
  }

  if(!giu && livello === 1){
    if(ridotto){ pos = posMeta; posV = 0; }
    else { const r = molla(pos, posV, posMeta, K_POS, dt); pos = r[0]; posV = r[1]; }
    applicaPos(false);
  }

  /* AL PEZZO LA MACCHINA NON STA MAI FERMA DEL TUTTO. Un oggetto in mano lo
     si muove sempre un po', e quel minimo di movimento e' quello che dice
     che e' un oggetto e non una figura. Si ferma appena lo tocchi.
     MA NON GIRA VIA. Sommava 0,085 radianti al secondo senza mai tornare:
     in tre secondi la macchina era a quattordici gradi, cioe' fuori dal
     piano del fondale — quello nitido — e dietro al gioiello restava la
     parete liscia della panoramica. E' la «parete piatta» che tornava sul
     pezzo. Un oggetto in mano lo si DONDOLA, non lo si mette su un
     tornio: undici centesimi di radiante avanti e indietro, dentro il
     campo che il fondale copre, e il movimento si vede uguale. */
  /* ── E IL DONDOLO HA UNA FINE ──────────────────────────────────
     Misurato prima di questa riga: al livello del pezzo il ciclo non si
     spegneva MAI — 899 fotogrammi in quindici secondi di scena
     immobile — per un'oscillazione di 0,11 radianti con un periodo di
     quasi quindici secondi. Sessanta disegni al secondo, con occlusione
     e sfocatura addosso, per un movimento che in un fotogramma vale
     trentadue millesimi di grado. Su un telefono quello e' la batteria.
     Un oggetto in mano si muove finche' qualcuno lo sta guardando.
     Dodici secondi senza che nessuno tocchi, e si posa: l'ampiezza
     scende nell'ultimo secondo e due — se si spegnesse di colpo sarebbe
     uno scatto di 0,11 radianti — e poi il ciclo puo' fermarsi davvero.
     Qualunque tocco lo risveglia, perche' `tocco()` azzera il contatore. */
  const DONDOLO_VITA = 12, DONDOLO_SPEGNI = 1.2;
  const dondoloVivo = !ridotto && etaFerma < DONDOLO_VITA;
  /* ── E NON MENTRE LA MACCHINA STA ANCORA ARRIVANDO ─────────────
     Il dondolo e' il minimo movimento di una cosa tenuta in mano, e una
     cosa la si tiene in mano quando ce l'hai. Partendo dall'istante del
     tocco oscillava DURANTE il volo — misurato: 0,027 radianti a meta'
     strada — e siccome il giro entra nel conto del bersaglio, il
     bersaglio si spostava a ogni fotogramma. Comincia all'arrivo. */
  if(livello === 2 && !giu && !pizzico && !voloAlPezzo){
    /* E RESTA DOVE LO LASCI. Per un po' il dondolo era un BERSAGLIO e la
       macchina ci tornava sempre: l'avevo fatto perche' il piano del
       fondale copriva solo i primi dieci gradi e girando si perdeva la
       stanza. Quel motivo non c'e' piu' — al livello del pezzo lavora la
       sfera, che e' la stessa stanza da ogni angolo — e il ritorno
       rimaneva solo come un difetto: giravi il gioiello e se ne tornava
       indietro da solo, che e' un altro modo di sembrare lento.
       Adesso il dondolo oscilla attorno a DOVE L'HAI LASCIATO. E dopo un
       lancio la rotazione prosegue e si spegne in mezzo secondo: e' quella
       coda a far sentire il gesto, piu' di qualunque taratura. */
    if(Math.abs(giroV) > 0.02){
      giroP += giroV * dt;
      giroV *= Math.exp(-dt / ((MOTI[window.__moto] || MOTI[MOTO_DI_SERIE]).tau));
      giroBase = giroP;
      dondolo = 0;
    } else if(dondoloVivo){
      giroV = 0;
      dondolo += dt;
      // l'ampiezza si ritira nell'ultimo secondo e due invece di sparire
      const forza = Math.max(0, Math.min(1, (DONDOLO_VITA - etaFerma) / DONDOLO_SPEGNI));
      giroP = giroBase + 0.11 * forza * Math.sin(dondolo * 0.42);
    } else {
      giroV = 0;
      giroP = giroBase;      // posato: da qui in poi non c'e' piu' niente da disegnare
    }
    /* SOLO IL GIRO: distanza e scarto sono quelli decisi al tocco */
    inquadraPezzo(true);
  }

  /* ══════════════════════════════════════════════════════════════
     MENTRE IL DITO E' GIU', LA MACCHINA NON HA MOLLA

     Il valore logico seguiva il dito uno a uno — verificato: 0,01612
     radianti per pixel contro 0,01611 teorici — ma la MACCHINA no: fra
     lei e il dito c'era la stessa molla dei voli, e misurato al livello
     del pezzo restava indietro di 2,12 radianti, cioe' 132 pixel di
     dito. Un oggetto che si gira in mano non ha un ritardo: il tuo dito
     e' sulla superficie, e la superficie e' li'.
     Quindi finche' il dito e' sullo schermo la macchina E' il valore
     logico. La molla torna al rilascio — li' e' giusta, perche' li' non
     c'e' piu' nessun dito da seguire e quello che si guarda e' una cosa
     che si posa.
     ══════════════════════════════════════════════════════════════ */
  /* ── QUANTO DURA UN VOLO ────────────────────────────────────────
     Era k = 118: pulsazione 10,86, e misurato con l'orologio pilotato a
     mano il 99 per cento del cammino arrivava a 667 millisecondi. I
     riferimenti stanno tutti sotto: la molla di serie di SwiftUI
     (response 0,5 · damping 0,825), lo «spatial» di Material 3 a 700 di
     rigidita'. Mezzo secondo e' la misura di un cambio di inquadratura,
     non di un viaggio.
     A k = 148 la pulsazione sale a 12,17 e il 99 per cento cade a 546 ms
     di conto — misurati 600 sul banco, dove entrano anche il passo di
     16,7 ms e la molla della mira. Resta CRITICAMENTE SMORZATA (lo
     smorzamento e' 2·radice di k): sovraelongazione zero, come deve
     essere su un gioiello — un rimbalzo elastico su una collana e' un
     giocattolo. */
  const K_VOLO = 148;
  if(giu && !pizzico){
    occhio.copy(occhioObiettivo); mira.copy(miraObiettivo);
    occhioV.set(0, 0, 0); miraV.set(0, 0, 0);
  } else if(ridotto){
    // meno movimento: la macchina non vola, si trova gia' arrivata
    occhio.copy(occhioObiettivo); mira.copy(miraObiettivo);
    occhioV.set(0, 0, 0); miraV.set(0, 0, 0);
  } else {
    for(const c of ["x", "y", "z"]){
      const a = molla(occhio[c], occhioV[c], occhioObiettivo[c], K_VOLO, dt);
      occhio[c] = a[0]; occhioV[c] = a[1];
      const b = molla(mira[c], miraV[c], miraObiettivo[c], K_VOLO, dt);
      mira[c] = b[0]; miraV[c] = b[1];
    }
  }
  /* ── QUANDO IL VOLO E' FINITO ─────────────────────────
     Non a tempo: a DISTANZA. Tre millimetri su un volo che ne fa da
     trecento a seicento valgono meno di due punti di schermo, ed e' li'
     che il dondolo puo' cominciare senza che si legga un cambio di
     rotta. A movimento ridotto la macchina si trova gia' arrivata, e il
     volo finisce nello stesso fotogramma in cui e' cominciato. */
  if(voloAlPezzo && (ridotto || occhio.distanceTo(occhioObiettivo) < 0.003))
    voloAlPezzo = false;
  if(!pizzico){
    const z = molla(zoom, zoomV, zoomMeta, 150, dt); zoom = z[0]; zoomV = z[1];
    const px = molla(panX, panVX, panMetaX, 150, dt); panX = px[0]; panVX = px[1];
    const py = molla(panY, panVY, panMetaY, 150, dt); panY = py[0]; panVY = py[1];
  }

  /* L'INGRANDIMENTO E LO SPOSTAMENTO SI APPLICANO SOPRA, non dentro la
     molla: la molla porta la macchina dove deve stare, il pizzico la
     sposta rispetto a li'. Mescolarli faceva tornare indietro il pizzico
     ogni volta che la molla si assestava. */
  _dir.subVectors(occhio, mira);
  const dist = _dir.length() || 0.001;
  _dir.divideScalar(dist);
  _destra.crossVectors(_dir, ALTO_MONDO).normalize();
  _su.crossVectors(_destra, _dir).normalize();
  _spost.copy(_destra).multiplyScalar(panX).addScaledVector(_su, panY);
  _mira.copy(mira).add(_spost);
  camera.position.copy(_mira).addScaledVector(_dir, dist / zoom);
  camera.lookAt(_mira);
  /* ── E LA POSA SI METTE A POSTO CON QUESTA MACCHINA, NON CON
     QUELLA DI PRIMA ─────────────────────────────────────────────
     La sua strada e' scritta in punti di schermo, e i punti di schermo
     li fa la macchina: chiamata in cima al ciclo userebbe quella del
     fotogramma precedente, e a ventisei punti di velocita' di punta un
     fotogramma di scarto e' un salto di ventisei punti. */
  camera.updateMatrixWorld(true);
  passoPosa();

  /* IL PIANO NON LAMPEGGIA PIU'. Avevo provato a tenerlo anche sul pezzo,
     dissolvendolo quando la rotazione ne avrebbe mostrato il bordo: e la
     dissolvenza si vede — «la parete addobbata fa ancora un effetto appare
     e scompare». Un fondo che va e viene e' peggio di un fondo meno nitido.
     Adesso al livello del pezzo lavora SOLO la sfera, ferma e sempre la
     stessa. Prima non si poteva, perche' la sfera mostrava una fetta
     qualunque di pavimento: la panoramica era resa da una macchina che
     guardava in basso. Orientata e rimessa in verso, la sfera e' la stessa
     stanza da ogni angolo — e a quel livello la profondita' di campo la
     sfoca di quarantaquattro pixel, dove la differenza di nitidezza col
     piano non si legge. */
  parete.visible = (livello !== 2);

  if(sfoca.enabled){
    /* IL FUOCO STA SUL SOGGETTO DEL MOMENTO. Sul pezzo quando se ne guarda
       uno; sul punto che si sta mirando quando si guarda un espositore o
       tutto il banco — se no, al banco la macchina metterebbe a fuoco un
       pezzo che non e' nemmeno in campo e la merce verrebbe molle. */
    sfoca.uniforms.focus.value = camera.position
      .distanceTo(livello === 2 ? centroP : _mira);
    // e la lampada segue la macchina, da sopra e da sinistra
    lampada.position.copy(camera.position)
      .addScaledVector(_su, 0.05).addScaledVector(_destra, -0.04);
    lampada.target.position.copy(centroP);
    lampada.target.updateMatrixWorld();
  }
  dipingi();

  const fermo = vesteT >= 1
             && !velaVerso
             && !posaMobile
             && !seguiFinestra
             && occhio.distanceTo(occhioObiettivo) < 0.0003
             && mira.distanceTo(miraObiettivo) < 0.0003
             && Math.abs(pos - posMeta) < 0.0015 && Math.abs(posV) < 0.004
             && Math.abs(zoom - zoomMeta) < 0.002
             && Math.abs(panX - panMetaX) < 0.0002
             && Math.abs(panY - panMetaY) < 0.0002;
  /* AL PEZZO IL MOTO ADESSO FINISCE. Stava scritto `|| livello === 2`, e
     quella riga da sola teneva acceso il ciclo per sempre: misurati 899
     fotogrammi in quindici secondi di scena immobile. Il dondolo ha una
     vita, e quando e' finita il livello del pezzo si ferma come tutti
     gli altri — il prossimo tocco lo risveglia. */
  if(!fermo || giu !== null || pizzico || (livello === 2 && dondoloVivo))
    vivo = requestAnimationFrame(gira);
  else { vivo = 0; pos = posMeta; posV = 0; ultimoFrame = 0; }
}

/* Il collaudo pilota il moto A MANO. In una scheda non visibile
   requestAnimationFrame non scatta affatto: senza questa presa la molla non
   si puo' misurare, e l'assenza di misura sembrerebbe un guasto. */
window.__passo = t => gira(t);
/* il banco di misura _I2_ ha bisogno di leggere la merce, quello che e'
   uscito dal cofanetto e la dispensa dei provini. Sono riferimenti, non
   copie, e stanno qui in fondo — accanto alle altre sonde — perche' un
   `const` letto prima della sua riga non e' indefinito: e' un errore che
   uccide il modulo intero, ed e' la stessa trappola gia' pagata su
   `cartaPezzo`. */
window.__merci = merci; window.__tolti = TOLTI; window.__pose = pose;
/* aprire la carta dal banco di prova, da qualunque livello si parta:
   dal banco si entra, in famiglia si prende il pezzo, sul pezzo si apre
   la carta — cioe' esattamente i passi che fa un dito. */
/* la sonda della FINESTRA: il rettangolo del ritaglio e quello che il
   pezzo occupa davvero sullo schermo adesso, con la macchina dov'e'.
   Serve al collaudo — il pezzo ci sta dentro? con quanto margine? — e
   proietta con la macchina VERA, non con quella di prova. */
window.__finestra = () => {
  const f = document.querySelector(".riga-foto").getBoundingClientRect();
  if(boxP.isEmpty()) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
             i & 2 ? boxP.max.y : boxP.min.y,
             i & 4 ? boxP.max.z : boxP.min.z).project(camera);
    const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const r = n => Math.round(n * 10) / 10;
  return {
    finestra:{x:r(f.left), y:r(f.top), w:r(f.width), h:r(f.height)},
    pezzo:{x:r(x0), y:r(y0), w:r(x1 - x0), h:r(y1 - y0)},
    dentro: x0 >= f.left - 0.5 && x1 <= f.right + 0.5
         && y0 >= f.top - 0.5 && y1 <= f.bottom + 0.5,
    margine:{sx:r(x0 - f.left), dx:r(f.right - x1),
             su:r(y0 - f.top), giu:r(f.bottom - y1)},
    riempie:{x:r((x1 - x0) / f.width * 100), y:r((y1 - y0) / f.height * 100)}
  };
};
window.__apriCarta = (fam, k) => {
  if(livello !== 1 || attiva !== fam) entra(fam);
  const dove = stazioni(fam).findIndex(g => g.indexOf(k) >= 0);
  if(dove >= 0){ pos = posMeta = posGiu = dove; posV = 0; applicaPos(false); }
  mostraScheda();
  apriPezzo(k);
  apriCarta(fam, k);
  ferma();
};
window.__sonda = () => ({pos:+pos.toFixed(4), posMeta:+posMeta.toFixed(3),
  posV:+posV.toFixed(3), vel:+velDito.toFixed(2), giu:!!giu, zoom:+zoom.toFixed(3),
  indice, scelto, livello, attiva,
  /* giroBase e' il giro SENZA il dondolo: serve al banco per misurare la
     coda di un rilascio, che altrimenti si legge sommata a 0,11 radianti
     di oscillazione e ogni variante risulta piu' lunga di quello che e' */
  giroP:+giroP.toFixed(4), giroBase:+giroBase.toFixed(4),
  giroV:+giroV.toFixed(4), eta:+etaFerma.toFixed(2),
  moto:window.__moto, ridotto, vela:velaVerso, velaT:+velaT.toFixed(3)});

/* ══════════════════════════════════════════════════════════════
   LO STATO SI LEGGE, NON SI RICORDA

   Era un oggetto RISCRITTO dentro gira(), una volta per fotogramma. Con
   il ciclo che adesso si spegne davvero — il dondolo ha una fine — chi lo
   legge a scena ferma troverebbe la fotografia dell'ultimo fotogramma
   disegnato, che puo' essere di dodici secondi prima. Un getter lo
   calcola quando lo si chiede, e allora e' sempre vero.
   ══════════════════════════════════════════════════════════════ */
Object.defineProperty(window, "__stato", {
  configurable: true,
  get(){ return {livello, attiva, scelto, indice,
    pos:+pos.toFixed(3), posMeta:+posMeta.toFixed(3), vel:+velDito.toFixed(2),
    zoom:+zoom.toFixed(2), giroP:+giroP.toFixed(3), moto:window.__moto}; }
});

/* la preferenza di movimento si puo' accendere ad applicazione aperta */
menoMoto.addEventListener("change", e => {
  ridotto = e.matches;
  if(ridotto && velaVerso) chiudiVela();
  sveglia();
});

addEventListener("resize", ()=>{
  rend.setSize(innerWidth, innerHeight);
  passe.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  /* ── PRIMA L'IMPIANTO, POI L'INQUADRATURA ─────────────────────
     Trascinando il bordo della finestra da 1440 a 700 il pannello sparisce
     e il cartellino torna in basso: se l'ordine si invertisse, la macchina
     si rifarebbe il quadro su un'area che sta per cambiare, e il primo
     fotogramma dopo il ridimensionamento avrebbe il pezzo fuori posto.
     `adattaTitolo` sta in mezzo perche' il corpo del nome dipende dal
     lato in cui siamo, e l'altezza del cartellino dipende dal corpo. */
  /* la coda trasparente della testata dipende dalla tacca del telefono, e
     la tacca coricando lo schermo cambia lato: la misura si butta via e
     `areaUtile` la riprende alla prima richiesta */
  codaAlto = null;
  /* e con lei la banda ferma del pezzo: uno schermo che cambia misura e'
     l'altro dei due momenti in cui la banda cambia per davvero */
  bandaPezzo = null;
  const eraLarga = larga;
  larga = LARGO.matches;
  if(larga !== eraLarga){ sistemaImpianto(); applicaCarta(); }
  adattaTitolo();
  if(livello === 0) vaiAlBanco(true);
  else if(livello === 1){ inquadraFamiglia(); applicaPos(false); }
  else { bandaPezzo = misuraArea(); inquadraPezzo(); }
  /* e la striscia si ricentra: trascinando il bordo della finestra il
     pannello compare e sparisce, e con lui il centro della scena */
  centraToast();
  sveglia();
});

/* ── scorciatoia per il collaudo ────────────────────────────────
   Le fotografie di prova prendevano la macchina MENTRE volava, non
   arrivata: il fotogramma sembrava sbagliato e non lo era. */
function ferma(){
  occhio.copy(occhioObiettivo); mira.copy(miraObiettivo);
  camera.position.copy(occhio); camera.lookAt(mira);
  camera.updateMatrixWorld(true);
  if(sfoca.enabled) sfoca.uniforms.focus.value = camera.position
    .distanceTo(livello === 2 ? centroP : mira);
  dipingi();
}
function scorciatoia(){
  /* E UNA FAMIGLIA CHE NON ESISTE NON APRE NIENTE. `entra` si fidava del
     valore nell'indirizzo: con un `f` sbagliato — un link copiato a mano,
     un vecchio segnalibro — `banchi[attiva]` usciva indefinito e l'app
     restava allo schermo nero. Un indirizzo storto deve portare al banco,
     non nel vuoto. */
  const f = q.get("f");
  if(f && FAMIGLIE.some(x => x.id === f)) entra(f);
  if(q.get("st")){ pos = posMeta = posGiu = parseFloat(q.get("st"));
                   applicaPos(false); mostraScheda(); }
  if(q.get("p")) apriPezzo(parseInt(q.get("p"), 10));
  if(q.get("subito")){ attesa.remove(); ferma(); }
}

/* SI PARTE DA QUI, e non a meta' file: tutto quello che il caricatore
   tocca — le famiglie, i banchi, la macchina, il cartellino — e' gia'
   stato dichiarato. Un `const` letto prima della sua riga non e'
   indefinito: e' un errore che uccide il modulo intero. */
avvia();
</script>
