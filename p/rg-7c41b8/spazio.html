function fermaBanco(){ bancoVola = false; bancoCoda = 0; bancoV = 0; }
/* LA GOMMA NON È UNA FRAZIONE, È UN ASINTOTO. Con un terzo fisso il dito
   porta la scena tre pezzi oltre l'ultimo, e c'è uno spigolo sul capo:
   dentro il dito vale 1, fuori 0,32, e quel gradino si sente. Qui la
   resistenza cresce da 1 a infinito e la scena non esce MAI oltre mezzo
   pezzo, per quanto forte si tiri. */
const OLTRE = 0.55;
function gomma(x, lo, hi){
  if(x < lo) return lo - OLTRE * (1 - 1 / ((lo - x) / OLTRE + 1));
  if(x > hi) return hi + OLTRE * (1 - 1 / ((x - hi) / OLTRE + 1));
  return x;
}

/* ── IL PIZZICO: ingrandire e spostare con le stesse due dita ─
   Non sono due gesti in fila, è un gesto solo: la distanza fra le dita
   decide l'ingrandimento, e il loro punto di mezzo decide dove si guarda.
   Si applica DOPO la molla e senza smorzarlo: un pizzico deve seguire le
   dita uno a uno, o sembra che l'immagine scivoli via da sotto. */
let zoom = 1, panX = 0, panY = 0;
let zoomMeta = 1, panMetaX = 0, panMetaY = 0;
let zoomV = 0, panVX = 0, panVY = 0;
const dita = new Map();
let pizzico = null;

function azzeraPizzico(){
  zoom = zoomMeta = 1; panX = panMetaX = 0; panY = panMetaY = 0;
  zoomV = panVX = panVY = 0; pizzico = null;
}
/* IL POSTO GIUSTO NON È SEMPRE IL CENTRO. Con la carta a finestra
   aperta, il posto del pezzo è la FINESTRA: è lì che lo si è messo
   aprendo la carta, e un pizzico lasciato a metà deve riportarlo lì,
   non al centro dello schermo sotto il cartoncino. */
function tornaAlPosto(){
  if(inquadraNellaFinestra()) return;
  zoomMeta = 1; panMetaX = 0; panMetaY = 0;
}

function misuraDita(){
  const [a, b] = [...dita.values()];
  return {d: Math.hypot(a.x - b.x, a.y - b.y),
          mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
}

/* ══════════════════════════════════════════════════════════════
   IL DITO AGGIORNA UN VALORE, IL CICLO DISEGNA UNA VOLTA

   Un telefono campiona il tocco più in fretta di quanto disegni: su un
   iPhone il pannello legge a 120 Hz e lo schermo mostra 60 fotogrammi, e
   `pointermove` arriva due volte per fotogramma — di più se il sistema
   accumula. Fin qui ogni arrivo rifaceva TUTTO il lavoro del gesto:
   in selezione la gomma, la posizione e `applicaPos`; sul pezzo l'intera
   `inquadraPezzo`, che rimisura il quadro e proietta gli otto spigoli
   della scatola fino a tre volte. Misurato col banco _F_ a due
   `pointermove` per fotogramma: 90 eventi su 89 fotogrammi disegnati,
   cioè metà di quel lavoro buttato via prima di diventare un pixel.
   Adesso il dito scrive solo DOVE STA — e la velocita' media, che ha
   bisogno di ogni campione — e alza una bandierina. Il ciclo la
   raccoglie una volta per fotogramma, subito prima di muovere la
   macchina. Quello che si vede è identico, perché quello che si vede
   è un fotogramma. */
let gestoSporco = 0;
stanza.addEventListener("pointerdown", e => {
  dita.set(e.pointerId, {x:e.clientX, y:e.clientY});
  // la cattura del puntatore serve perché il dito possa uscire dal
  // riquadro senza perdere il gesto, ma non deve poter far cadere il
  // resto: se il browser la rifiuta, il pizzico non si apriva nemmeno
  try { stanza.setPointerCapture(e.pointerId); } catch(_) {}
  if(dita.size === 2 && livello > 0){
    // il secondo dito apre il pizzico e chiude il trascinamento: tenerli
    // aperti tutti e due faceva scorrere la fila mentre si ingrandiva
    giu = null;
    const m = misuraDita();
    pizzico = {d:m.d, mx:m.mx, my:m.my, zoom:zoom, panX:panX, panY:panY};
    return;
  }
  if(dita.size > 1) return;
  /* CHI SCENDE MENTRE QUALCOSA SI MUOVE È UN FRENO, non un comando. Lo si
     decide QUI, al contatto, non al rilascio: fra i due c'è mezzo secondo
     in cui la scena si sarebbe fermata da sola e la domanda non avrebbe
     più risposta. */
  const fermava = inMoto();
  tocco();
  stanza.classList.add("tira");
  giu = {x:e.clientX, y:e.clientY, fermava}; mosso = 0; mossoY = 0;
  /* il banco si pianta DOVE STA, come la fila: la coda del lancio non ha
     più un bersaglio da raggiungere, e il trascinamento riparte da qui */
  if(fermava && livello === 0){ fermaBanco(); partenzaBanco = occhioObiettivo.x; }
  if(fermava && livello === 1){
    /* la fila si pianta DOVE STA, come una lista che si scorre: la molla
       non ha più un bersaglio lontano da raggiungere */
    posMeta = pos; posV = 0;
  }
  /* DA DOVE RIPARTE IL GIRO. Non da zero: da DOVE STA. Il pezzo si girava
     con `giroP = -mosso*0.0075` e `altP = 0.12 - mossoY*0.0045`, cioè
     sempre a partire dall'origine — alzavi il dito e lo riappoggiavi, e la
     macchina saltava di colpo indietro all'angolo di partenza. Sulla posa
     stesa, che si guarda da 1,22 radianti, il salto era di settanta gradi
     al primo tocco. Un oggetto che si rigira in mano riparte da come lo si
     è lasciato. */
  giroGiu = giroP; altGiu = altP; giroV = 0;
  partenzaX = occhioObiettivo.x;
  posGiu = pos; posV = 0; velDito = 0;
  /* e la coda di prima finisce qui: il dito è tornato, e da adesso
     comanda lui */
  fermaCoda();
  ultimoX = e.clientX; ultimoT = performance.now();
  campioni.length = 0; campiona(ultimoT, ultimoX);
});

stanza.addEventListener("pointermove", e => {
  if(dita.has(e.pointerId)) dita.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(pizzico && dita.size === 2){
    const m = misuraDita();
    zoom = zoomMeta = Math.max(0.7, Math.min(5,
             pizzico.zoom * (m.d / Math.max(24, pizzico.d))));
    /* lo spostamento si misura in METRI, non in pixel: quanto mondo copre
       un pixel dipende da quanto si è lontani, e a quattro centimetri da
       una creola un pixel vale un decimo di quello che vale al banco. */
    const dist = occhio.distanceTo(mira) / zoom;
    const perPixel = 2 * dist * Math.tan(camera.fov*Math.PI/360) / innerHeight;
    panX = panMetaX = pizzico.panX - (m.mx - pizzico.mx) * perPixel;
    panY = panMetaY = pizzico.panY + (m.my - pizzico.my) * perPixel;
    sveglia();
    return;
  }

  if(!giu) return;
  tocco();
  mosso = e.clientX - giu.x; mossoY = e.clientY - giu.y;
  /* LA VELOCITA' SI MISURA SU UNA FINESTRA DI TEMPO: vedi `velFinestra`.
     Un solo campione fra due fotogrammi è rumore, e un flick misurato
     male manda il pezzo tre posizioni più in la' senza che nessuno
     l'abbia chiesto. */
  const ora = performance.now();
  campiona(ora, e.clientX);
  velDito = velFinestra();
  ultimoX = e.clientX; ultimoT = ora;

  gestoSporco = 1;
  sveglia();
});

/* il lavoro del gesto, una volta per fotogramma: lo chiama `gira` prima
   di muovere la macchina, e il rilascio lo chiama un'ultima volta perché
   l'ultimo millimetro di dito non vada perso. */
function passoDito(){
  gestoSporco = 0;
  if(!giu) return;
  if(livello === 0){
    const lim = Math.max(0, LARGO_BANCO/2 - 0.06);
    occhioObiettivo.x = Math.max(-lim, Math.min(lim, partenzaX - mosso*0.0016*GUADAGNO));
    miraObiettivo.x = occhioObiettivo.x;
    partenzaBanco = occhioObiettivo.x;
    segnaVicino(occhioObiettivo.x);
  } else if(livello === 1){
    /* SOTTO IL DITO LA SCENA È IL DITO. Uno a uno, senza freno: il
       trascinamento non decide più NIENTE — dove si va lo decide la
       proiezione al rilascio — e quindi non ha più bisogno di trattenere
       niente. Con il freno la scena si muoveva per quarantasei pixel e poi
       si incollava: è quella la cosa che il cliente ha visto e chiamato
       «si muove solo quando il dito è appoggiato».
       L'unica resistenza resta ai CAPI della fila (`gomma`): lì non c'è
       niente da mostrare, e la gomma dice che la fila è finita senza
       chiudere una porta in faccia. */
    pos = gomma(posGiu - corsaMorbida(mosso * GUADAGNO / PASSO_DITO, CORSA_DITO), 0, limiteN());
    posMeta = pos; posV = 0;
    applicaPos(true);
  } else if(livello === 2){
    /* AL PEZZO IL DITO NON SCORRE, GIRA. Il gioiello è lì davanti: la
       cosa che si vuole fare è voltarlo, come lo si volterebbe in mano.
       E QUANTO GIRA SI DICHIARA, non si tara a caso. Era 0,0075 radianti
       per pixel: una passata di dito su tutto lo schermo — trecentonovanta
       punti — valeva 168 gradi, meno di mezzo giro. Per vedere il retro di
       un anello servivano due passate, e il gesto si legge come pesante.
       Una passata di schermo vale UN GIRO INTERO: 2*pi / larghezza. Su un
       telefono da 390 fa 0,0161 rad per pixel, su uno stretto un po' di
       più — che è giusto, perché il gesto è «attraversa lo schermo»,
       non «percorri tot pixel». */
    giroP = giroGiu - mosso * (2 * Math.PI / innerWidth);
    /* E NON SI SCENDE SOTTO IL BANCO. L'alzata arrivava a -0,45: la
       macchina passava sotto il piano di pietra, che è opaco, e il pezzo
       spariva dietro il proprio appoggio. Il fondo dipende da come sta il
       pezzo — uno steso sulla pietra lo si guarda dall'alto e sotto i venti
       gradi non c'è niente da vedere; uno in piedi lo si può guardare
       quasi in faccia, ma mai da sotto. */
    /* e il fondo di un pezzo STESO non è «sopra il banco», è «abbastanza
       da vederlo»: a ventidue gradi una collana distesa diventa una riga
       sottile e la posa non racconta più niente. Trentadue gradi è il
       taglio più basso con cui un catalogo fotografa un vassoio. */
    const [giu_, su_] = stesa(attiva, scelto) ? [0.56, 1.48] : [0.02, 1.00];
    altP = Math.max(giu_, Math.min(su_, altGiu - mossoY * 0.0045));
    inquadraPezzo();
  }
}

/* PIZZICARE ALL'INDIETRO È USCIRE. Allargare le dita avvicina, stringerle
   allontana — e allontanarsi abbastanza vuol dire tornare al quadro di
   prima: dal pezzo all'espositore, dall'espositore al banco. È lo stesso
   verso del gesto, non un comando in più da imparare; e sotto il dito si
   vede la scena rimpicciolire mentre lo si fa, quindi si capisce dove sta
   andando prima di lasciare. La soglia sta a 0,82 e il limite a 0,70: c'è
   un pezzo di corsa dopo la soglia, per poter cambiare idea tornando
   indietro con le dita senza alzare. */
const PIZZICO_ESCI = 0.82;
function chiudiDito(e){
  dita.delete(e.pointerId);
  if(dita.size < 2 && pizzico){
    pizzico = null;
    if(zoom < PIZZICO_ESCI && livello > 0){ indietro(); return; }
    // sotto un ingrandimento minimo si torna da soli al quadro giusto:
    // restare al 103 per cento non è una scelta, è un residuo
    if(zoom < 1.06){ tornaAlPosto(); sveglia(); }
  }
}

addEventListener("pointerup", e => {
  /* l'ultimo millimetro di dito non si perde: se è arrivato un
     `pointermove` dopo l'ultimo fotogramma, lo si serve adesso — se no il
     rilascio leggerebbe una posizione vecchia di un fotogramma, che a
     ventisei punti di velocita' di punta sono ventisei punti di scarto. */
  if(gestoSporco) passoDito();
  const eraPizzico = !!pizzico;
  const fermava = giu && giu.fermava;
  chiudiDito(e);
  stanza.classList.remove("tira");
  if(!giu){ if(eraPizzico) sveglia(); return; }
  const dx = mosso, dy = mossoY;
  giu = null;
  tocco();
  if(Math.abs(dx) > 24) segnaImparato();

  /* IL FRENO SI FERMA E BASTA. Nessuna stazione riassegnata, nessuna
     uscita dal pezzo: il gesto è già servito a qualcosa — ha fermato la
     scena — e un gesto solo non ne fa due. Al rilascio la fila si posa
     sulla stazione più vicina, che è come si comporta una lista con
     l'aggancio quando la si trattiene e la si lascia. */
  if(fermava && Math.abs(dx) < 8 && Math.abs(dy) < 8){
    if(livello === 1){
      posMeta = Math.max(0, Math.min(limiteN(), Math.round(pos)));
      fermaCoda();                  // un aggancio, non un lancio
      mostraScheda();
    }
    sveglia();
    return;
  }

  if(livello === 2){
    /* ══════════════════════════════════════════════════════════
       COME SI LASCIA ANDARE UN GIOIELLO — tre modi, e Massimo sceglie

       La velocita' del dito è in pixel al secondo; diventa radianti al
       secondo con lo stesso cambio del trascinamento: una passata di
       schermo, un giro. Quello che cambia fra le tre varianti è cosa
       succede DOPO che il dito si è alzato, e non è una rifinitura —
       è il carattere dell'oggetto che si ha in mano.

       · a · NIENTE LANCIO. Si ferma dove lo lasci, con un assestamento
             critico di 50 ms. È la scelta del visualizzatore 3D di
             Google (Damper.ts, DECAY_MILLISECONDS = 50): un oggetto che
             stai esaminando non deve continuare per conto suo. Coda
             misurata: 0 radianti.
       · b · LANCIO BREVE, la proiezione dello scorrimento di iPhone:
             lambda 0,998 al millisecondo, cioè una costante di 0,4995 s,
             con la coda tagliata a 45 gradi (0,785 rad). È il gesto di
             far girare una cosa fra le dita e lasciarla andare un po'.
       · c · QUELLA DI OGGI: tetto 4,5 rad/s, costante 0,38 s.
             IL COMMENTO DI PRIMA MENTIVA. Diceva «al più un ottavo di
             giro»: un ottavo sono 45 gradi, e la coda vera — misurata al
             rilascio con il banco _I1_ — è di 1,78 radianti, cioè 102
             gradi. Più di un quarto di giro, e ci mette 1,68 secondi a
             scendere sotto i 0,02 rad/s. Il numero giusto è questo, e
             sta scritto qui perché è quello che decide se (c) resta.

       Si scelgono con `?moto=a|b|c`, e si cambiano al volo da
       `window.__moto`. Di serie resta (c) finché Massimo non decide.
       ══════════════════════════════════════════════════════════ */
    const m = MOTI[window.__moto] || MOTI[MOTO_DI_SERIE];
    const perPixel = 2 * Math.PI / innerWidth;
    const v = velDito * perPixel;
    giroV = ridotto ? 0 : Math.max(-m.tetto, Math.min(m.tetto, v));
    giroBase = giroP;
    dondolo = 0;
  }

  if(livello === 1){
    /* -- IL BERSAGLIO SI PROIETTA, NON SI CONTA --------------------
       Stava scritto «uno swipe, una stazione», deciso su due soglie: 320
       px/s di velocita' oppure 30 px di strada. Due soglie sono due
       gradini, e un gradino è esattamente cio' che si sente come «non
       fluido»: sotto la soglia non succede niente, sopra succede tutto, e
       in mezzo il gesto non ha peso. Peggio, la stazione di partenza era
       `Math.round(posGiu)` — DOVE IL DITO ERA SCESO — quindi un dito che
       aveva già portato la fila a metà strada tornava indietro.
       Adesso il gesto ha peso ovunque: si proietta dove lo scorrimento
       sarebbe arrivato da solo e si prende la stazione più vicina a quel
       punto. Un colpetto appena sopra mezza stazione va alla prossima, uno
       appena sotto torna indietro, un lancio forte ne scavalca più d'una
       — fino a tre. Nessuna soglia: c'è solo un arrotondamento, e
       l'arrotondamento è continuo nella velocita'. */
    const n = limiteN();
    const velStaz = velDito * GUADAGNO / PASSO_DITO;   // stazioni al secondo, con lo stesso guadagno del dito
    /* IL BUDGET DEL GESTO SI CONTA DA DOVE IL DITO È SCESO. Ma il tetto
       non può riportare la fila DIETRO a dove il trascinamento l'ha già
       portata: `Math.round(pos)` è il pavimento (o il soffitto) in quella
       direzione, e disfare il lavoro del dito non è un tetto, è un
       rimbalzo. */
    const ancora = Math.round(posGiu), qui = Math.round(pos);
    const su = Math.max(ancora + TETTO_SALTO, qui);
    const giuu = Math.min(ancora - TETTO_SALTO, qui);
    let meta = Math.round(pos + velStaz * CODA_MS);
    posMeta = Math.max(0, Math.min(n, Math.max(giuu, Math.min(su, meta))));
    mostraScheda();
    /* -- E DA QUI IN POI NON C'E' PIÙ NESSUNA FORZA ---------------
       Si risolve il lambda che fa finire la coda esattamente qui (vedi
       `codaDi`) e si lascia decadere. Due casi restano alla molla:
       il bersaglio DIETRO al verso del dito — un colpetto che non è
       bastato, e che torna indietro — e il rilascio troppo lento perché
       si possa chiamarlo lancio: in tutti e due non c'è velocita' da
       onorare, e una molla che parte da ferma è la cosa giusta. */
    const d = Math.abs(posMeta - pos);
    const verso = Math.sign(posMeta - pos);
    const lancio = verso !== 0 && Math.sign(velStaz) === verso
                && Math.abs(velStaz) * TAU_LANCIO > d;
    if(lancio){
      const c = codaDi(d, velStaz);
      codaTau = c.unSuTau; coda = 1;
      posV = velStaz;
    } else {
      coda = 0; kPos = K_POS;
      posV = 0;
    }
    sveglia();
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8) return;
  }

  if(livello === 0){
    /* -- LO STESSO MODELLO, CON LE FAMIGLIE COME STAZIONI ----------
       Un pixel di dito vale 0,0016 metri di banco (lo fissa `passoDito`),
       quindi la velocita' in metri al secondo è la stessa moltiplicazione.
       Si proietta, si prende la famiglia più vicina al punto proiettato —
       ma senza uscire dal banco — e si lascia correre la stessa molla.
       IL TETTO È LO STESSO: tre famiglie. Su cinque, un lancio che ne
       scavalca quattro porta da un capo all'altro della vetrina. */
    const PER_PX = 0.0016;
    const lim = Math.max(0, LARGO_BANCO/2 - 0.06);
    const qui = occhioObiettivo.x;
    const v = velDito * PER_PX * GUADAGNO;        // metri al secondo, con lo stesso guadagno del dito
    const punto = Math.max(-lim, Math.min(lim, qui + v * CODA_MS));
    const ord = FAMIGLIE.filter(f => gruppi[f.id])
                        .map(f => gruppi[f.id].position.x)
                        .sort((a, b) => a - b);
    if(ord.length){
      const vicina = x => ord.reduce((m, y, i) =>
        Math.abs(y - x) < Math.abs(ord[m] - x) ? i : m, 0);
      // il budget si conta da dove il dito è SCESO, come nella fila
      const iVia = vicina(partenzaX), iQui = vicina(qui);
      const su = Math.max(iVia + TETTO_SALTO, iQui);
      const giuu = Math.min(iVia - TETTO_SALTO, iQui);
      const iMeta = Math.max(giuu, Math.min(su, vicina(punto)));
      bancoMeta = Math.max(-lim, Math.min(lim, ord[iMeta]));
      const d = Math.abs(bancoMeta - qui);
      const verso = Math.sign(bancoMeta - qui);
      if(verso !== 0 && Math.sign(v) === verso && Math.abs(v) * TAU_LANCIO > d){
        bancoTau = codaDi(d, v).unSuTau; bancoCoda = 1; bancoV = v;
      } else {
        bancoCoda = 0; bancoK = K_POS; bancoV = 0;
      }
      bancoVola = d > 1e-5;
      sveglia();
    }
  }

  /* UN GESTO, UN COMANDO. Il trascinamento verso il basso torna indietro —
     ma sul PEZZO lo stesso trascinamento è quello che alza e abbassa la
     macchina attorno al gioiello. Facevano tutti e due: si girava il pezzo
     verso l'alto e al rilascio la vista usciva. Non è un difetto di
     taratura, sono due comandi sullo stesso movimento, e da fuori si legge
     come un'applicazione che non obbedisce.
     Sul pezzo si esce con «indietro», col pizzico all'indietro, o toccando
     fuori dal gioiello: tre strade, nessuna delle quali è il gesto con cui
     lo si sta guardando. */
  if(livello !== 2 && dy > 70 && Math.abs(dy) > Math.abs(dx)){ indietro(); return; }
  if(Math.abs(dx) < 8 && Math.abs(dy) < 8) tocca(e);
  sveglia();
});
addEventListener("pointercancel", e => { chiudiDito(e); stanza.classList.remove("tira"); });

/* ══════════════════════════════════════════════════════════════
   LA SCRIVANIA — rotella, frecce, Invio, Escape

   Contato prima di questo blocco: la rotella non muoveva niente, le
   frecce nemmeno, Escape non chiudeva la carta. Su un portatile la
   stanza si poteva solo trascinare col mouse tenendo premuto — cioè si
   usava un telefono con un mouse in mano.
   Una regola sola sotto tutto: i comandi della stanza valgono quando
   sopra non c'è niente. Se la carta o la galleria sono aperte, la
   rotella scorre il LORO contenuto e le frecce appartengono a loro.
   ══════════════════════════════════════════════════════════════ */
const sopraCiSta = () => !cartaPezzo.hidden || !galleria.hidden;

/* LA ROTELLA SI ACCUMULA, NON SCATTA A OGNI TICCHETTIO. Un pad di un
   portatile manda venti eventi da tre punti per un gesto solo: un passo
   per evento farebbe volare via venti stazioni. Si somma finché non si
   arriva a un colpo pieno — 120 punti, quello che manda una rotella
   vera — e si azzera. E si azzera anche dopo un terzo di secondo di
   silenzio, perché due gesti separati non si sommano fra loro. */
const SCATTO_ROTELLA = 120, PAUSA_ROTELLA = 320;
let rotellaSomma = 0, rotellaQuando = 0;
addEventListener("wheel", e => {
  if(sopraCiSta()) return;
  tocco(); sveglia();
  const ora = performance.now();
  if(ora - rotellaQuando > PAUSA_ROTELLA) rotellaSomma = 0;
  rotellaQuando = ora;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;

  if(livello === 2){
    /* AL PEZZO LA ROTELLA GIRA, e continua: un giro non è un passo
       discreto. Un colpo pieno di rotella vale un ottavo di giro —
       la stessa strada che il dito fa in un ottavo di schermo. */
    if(ridotto || !inMoto()){
      giroP -= d / SCATTO_ROTELLA * (Math.PI / 4);
      giroBase = giroP; giroV = 0; dondolo = 0;
      inquadraPezzo();
    }
    e.preventDefault();
    return;
  }
  rotellaSomma += d;
  if(Math.abs(rotellaSomma) < SCATTO_ROTELLA) return;
  const passo = Math.sign(rotellaSomma);
  rotellaSomma = 0;
  if(livello === 1){
    posMeta = Math.max(0, Math.min(limiteN(), Math.round(posMeta) + passo));
    fermaCoda();                    // un passo di rotella non è un lancio
    mostraScheda();
  } else if(livello === 0){
    // al banco si cammina di famiglia in famiglia: è l'unica misura che
    // esista lì, e portare la macchina «di tot metri» non vuol dire niente
    const i = Math.max(0, Math.min(FAMIGLIE.length - 1,
      FAMIGLIE.findIndex(f => f.id === davanti) + passo));
    vaiDavantiA(FAMIGLIE[i].id);
  }
  e.preventDefault();
}, {passive:false});

/* portare la macchina davanti a una famiglia SENZA entrarci: è quello
   che fa lo scorrimento del banco, e prima esisteva solo dentro il
   trascinamento */
function vaiDavantiA(id){
  if(!gruppi[id]) return;
  fermaBanco();
  partenzaBanco = gruppi[id].position.x;
  occhioObiettivo.x = partenzaBanco; miraObiettivo.x = partenzaBanco;
  if(davanti !== id){
    davanti = id; segnaMenu();
    const f = FAMIGLIE.find(x => x.id === id);
    scritte(f.nome, "", stazioni(id).length + " in vetrina",
            "scorri per scorrere il banco · tocca per entrare");
  }
  sveglia();
}

addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;

  /* ESCAPE CHIUDE QUELLO CHE STA SOPRA, uno strato per volta, e non entra
     nel contenuto di niente: chiama la stessa funzione del tasto. */
  if(e.key === "Escape"){
    if(!galleria.hidden){ chiudiGalleria(); e.preventDefault(); return; }
    if(!cartaPezzo.hidden){ chiudiCarta(); e.preventDefault(); return; }
  }
  if(sopraCiSta()) return;
  // un bottone del cromo che ha il fuoco si aziona con Invio o con la
  // barra: quelle due lì appartengono a lui, non alla stanza
  if((e.key === "Enter" || e.key === " ") && t && t.tagName === "BUTTON") return;
  tocco();

  const passo = d => {
    if(livello === 2){
      /* un colpo di freccia vale quindici gradi: è la misura con cui si
         gira una cosa in mano per vederne un altro lato, non per
         rivoltarla */
      giroP += d * (Math.PI / 12);
      giroBase = giroP; giroV = 0; dondolo = 0;
      inquadraPezzo();
    } else if(livello === 1){
      posMeta = Math.max(0, Math.min(limiteN(), Math.round(posMeta) + d));
      fermaCoda();                  // una freccia non è un lancio
      mostraScheda();
    } else {
      const i = Math.max(0, Math.min(FAMIGLIE.length - 1,
        FAMIGLIE.findIndex(f => f.id === davanti) + d));
      vaiDavantiA(FAMIGLIE[i].id);
    }
    sveglia();
  };

  switch(e.key){
    case "ArrowRight": passo(1);  e.preventDefault(); break;
    case "ArrowLeft":  passo(-1); e.preventDefault(); break;
    case "ArrowUp": case "Enter":
      /* SI ENTRA DI UN PASSO: banco → famiglia → pezzo. Lo stesso
         cammino del tocco, con un tasto invece di un dito. */
      if(livello === 0 && davanti) entra(davanti);
      else if(livello === 1) apriPezzo(indice);
      e.preventDefault(); break;
    case "ArrowDown": case "Escape":
      if(livello > 0) indietro();
      e.preventDefault(); break;
  }
});

/* -- QUELLO CHE LA POSIZIONE MUOVE, PER FAMIGLIA --------------
   È qui che i tre modi diventano tre cose diverse: la STESSA posizione
   continua muove la macchina lungo la fila degli anelli, la salta da un
   nastro all'altro, e sulle collane fa uscire un espositore e ne fa
   entrare un altro. */
function applicaPos(mentreTrascina){
  if(livello !== 1 || !attiva || !banchi[attiva]) return;
  /* qui la ROBA si sposta (nel modo «scambia» sono gli espositori a
     scorrere), quindi la mappa d'ombra è scaduta: vedi `ombraDaRifare`.
     MA SOLO SE SI È SPOSTATA DAVVERO: questa funzione la chiama `gira()`
     a OGNI fotogramma finché si sta al livello 1, anche a fila ferma, e
     senza questo confronto la mappa si sarebbe rifatta sessanta volte al
     secondo davanti a un banco immobile — cioè l'ombra cara di prima con
     un nome nuovo. */
  if(pos !== ultimaPosOmbra){ ultimaPosOmbra = pos; ombraDaRifare(); }
  const g0 = banchi[attiva][0], n = stazioni(attiva).length;
  const modo = MODI[attiva];
  if(modo === "cammina" || modo === "salta"){
    const x = centroStazione(attiva, pos);
    occhioObiettivo.x = x; miraObiettivo.x = x;
    /* ── E QUI LA X SI RISCRIVE, quindi lo scostamento va rimesso ────
       `inquadraFamiglia` centra la famiglia sull'area visibile, ma due
       righe dopo passa di qui il dito e questa funzione SOVRASCRIVE la x
       del bersaglio con quella della stazione. Misurato a 1440x900: la
       fila di anelli tornava centrata sulla tela e non sulla scena, cioè
       425 punti più a destra, con la colonna in quadro mezza dietro il
       pannello. Il modo «scambia» non passa di qui — lì si muovono gli
       espositori, non la macchina — e infatti non aveva il difetto. */
    const lt = scostaDiLato(occhioObiettivo.distanceTo(miraObiettivo), 0);
    if(lt){ occhioObiettivo.x += lt.x; miraObiettivo.x += lt.x; }
  } else {
    /* SCAMBIA: la macchina sta ferma e sono gli ESPOSITORI a scorrere. Il
       primo esce da un lato mentre il secondo entra dall'altro, e in ogni
       istante se ne vedono due — che è la differenza fra sfogliare e
       cambiare diapositiva. */
    const passo = PASSO_BANCO[attiva], casa = CASA[attiva];
    banchi[attiva].forEach((g, k) => {
      g.position.x = casa + (k - pos) * passo;
      g.visible = Math.abs(k - pos) < 1.6;
    });
  }
}

/* ── TOCCARE UN PEZZO ────────────────────────────────────────
   Non si spara un raggio sulla GEOMETRIA del gioiello. Misurato: la banda
   di una creola da 16 mm, a mezzo metro, è spessa cinque pixel sullo
   schermo; un perno ne occupa diciassette. Il polpastrello ne copre
   quaranta. Un bersaglio di cinque pixel non si colpisce, e chi prova e
   sbaglia tre volte pensa che l'app sia rotta — non che abbia mancato.
   Quindi si guarda DOVE CADE il dito e si prende il pezzo il cui centro è
   più vicino, entro un raggio comodo. È la stessa cosa che fa una mano
   davanti a un espositore vero: indica, non infila. */
const _sca = new THREE.Box3(), _pun = new THREE.Vector3();
function schermoDi(p){
  _sca.setFromObject(p); _sca.getCenter(_pun).project(camera);
  return [(_pun.x*0.5+0.5)*innerWidth, (-_pun.y*0.5+0.5)*innerHeight, _pun.z];
}
function pezzoVicino(x, y){
  let quale = -1, minimo = 1e9;
  (merci[attiva] || []).forEach((p, k) => {
    if(!p || !p.visible) return;
    const [sx, sy, sz] = schermoDi(p);
    if(sz > 1) return;                       // dietro la macchina
    const d = Math.hypot(sx - x, sy - y);
    if(d < minimo){ minimo = d; quale = k; }
  });
  return minimo < Math.min(innerWidth, innerHeight) * 0.24 ? quale : -1;
}

/* ── SONO SUL SOGGETTO, O NELL'AMBIENTE? ─────────────────────
   Serve per uscire toccando fuori. Non si spara un raggio sulla geometria —
   un anello è un filo di pochi pixel e quasi ogni tocco cadrebbe «fuori»
   anche quando il dito è chiaramente sul gioiello. Si prende invece il
   CERCHIO che il pezzo occupa sullo schermo: si proietta il centro, si
   proietta un punto a un raggio di distanza lungo la destra della
   macchina, e la distanza fra i due in pixel è il raggio vero. Dentro
   quello (con un dito di margine) si è sul soggetto. */
const _c1 = new THREE.Vector3(), _c2 = new THREE.Vector3(),
      _lato = new THREE.Vector3();
function cerchioDelPezzo(){
  /* la destra della macchina si legge dalla SUA matrice, non dal vettore
     che il ciclo di disegno si tiene da parte: quello vale solo dopo che un
     fotogramma è passato, e il primo tocco può arrivare prima. Misurato:
     raggio zero, e ogni tocco — anche in mezzo all'anello — risultava
     «fuori dal soggetto». */
  _lato.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _c1.copy(centroP).project(camera);
  _c2.copy(centroP).addScaledVector(_lato, raggioP).project(camera);
  const x1 = (_c1.x*0.5+0.5)*innerWidth, y1 = (-_c1.y*0.5+0.5)*innerHeight;
  const x2 = (_c2.x*0.5+0.5)*innerWidth, y2 = (-_c2.y*0.5+0.5)*innerHeight;
  return [x1, y1, Math.hypot(x2 - x1, y2 - y1)];
}

function tocca(e){
  schermo.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raggio.setFromCamera(schermo, camera);

  if(livello === 2){
    /* SUL PEZZO SI TOCCA IL PEZZO. Fuori si torna indietro — è il gesto
       di riappoggiare una cosa che ti hanno messo in mano. Sopra, si apre
       la sua CARTA: la foto, i dati, la dedica e quello che con quel pezzo
       si può fare. */
    const [cx, cy, r] = cerchioDelPezzo();
    if(Math.hypot(e.clientX - cx, e.clientY - cy) > r * 1.18) indietro();
    else apriCarta(attiva, scelto);
    return;
  }
  if(livello === 1 && merci[attiva] && merci[attiva].length){
    const k = pezzoVicino(e.clientX, e.clientY);
    if(k < 0){
      /* niente merce sotto il dito. Se ha toccato l'ESPOSITORE non succede
         niente — è il mobile, ci si sta guardando sopra. Se ha toccato
         l'AMBIENTE — il fondo, il ripiano, quello che c'è di lato — si
         torna al banco: guardare altrove è già dire che hai finito qui. */
      for(const g of banchi[attiva])
        if(g.visible && raggio.intersectObject(g, true).length) return;
      indietro();
      return;
    }
    const qui = stazioni(attiva)[Math.round(pos)] || [];
    if(qui.indexOf(k) >= 0){ apriPezzo(k); return; }
    /* il pezzo toccato sta su un'altra stazione: PRIMA ci si va. Aprirlo
       di colpo da lontano salterebbe un passaggio, e il cliente perde il
       filo di dove si trova. */
    const dove = stazioni(attiva).findIndex(g => g.indexOf(k) >= 0);
    if(dove >= 0){ posMeta = dove; fermaCoda(); mostraScheda(); sveglia(); }
    return;
  }
  if(livello === 0){
    for(const f of FAMIGLIE){
      const b = (banchi[f.id] || [])[0];
      if(b && raggio.intersectObject(b, true).length){ entra(f.id); return; }
    }
  }
}

/* == IL MOTO ==================================================
   Tutto quello che si muove qui è una MOLLA CRITICAMENTE SMORZATA, non
   un'interpolazione. Un lerp rallenta all'infinito senza mai arrivare, e a
   occhio da' quella sensazione molliccia che si riconosce subito. */
function molla(x, v, meta, k, dt){
  const d = 2 * Math.sqrt(k);
  v += (-k * (x - meta) - d * v) * dt;
  return [x + v * dt, v];
}

let ultimoFrame = 0;
/* da quanti millisecondi non si muove più nulla, e dopo quanti la
   catena delle passate torna in servizio (vedi `dipingi`). Un quarto di
   secondo è il tempo in cui una mano si ferma per davvero: più corto e
   la sfocatura rientra dentro la coda della molla, più lungo e il fondo
   resta nitido abbastanza da farsi notare. */
let fermoDa = 1e9;
const POST_A_RIPOSO = 250;
/* dove stava la fila l'ultima volta che si è rifatta la mappa d'ombra */
let ultimaPosOmbra = NaN;
const occhioV = new THREE.Vector3(), miraV = new THREE.Vector3();
/* IL BANCO SI PUÒ FERMARE DA FUORI. Quando la sezione non è più in
   vista - la scocca passa a un'altra schermata e l'iframe resta montato -
   il ciclo non deve più chiedere fotogrammi: una GPU che continua a
   disegnare una stanza che nessuno guarda è batteria del telefono
   spesa a vuoto. Non si smonta niente e non si scarica niente: si
   smette di chiedere, e `banco/riprendi` riparte da dov'era.
   La sua dichiarazione sta in cima accanto a `vivo`, e per la stessa
   ragione: `sveglia()` la chiama la stanza mentre si veste, cioè prima
   di questa riga, e un `let` letto prima della sua riga non è `false` -
   è un ReferenceError che uccide il modulo intero. Pagata: il velo
   restava su «apparecchio il banco» e ogni texture si annunciava con lo
   stesso errore. */
function sveglia(){ if(!vivo && !sospeso){ vivo = requestAnimationFrame(gira); } }

const ALTO_MONDO = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3(), _destra = new THREE.Vector3(),
      _su = new THREE.Vector3(), _spost = new THREE.Vector3(),
      _mira = new THREE.Vector3();

function gira(ora){
  /* IL FOTOGRAMMA È «IN CORSO», NON «SPENTO». Qui stava `vivo = 0`, e
     una `sveglia()` chiamata DENTRO il fotogramma — la finestra della
     carta la chiama a ogni passo mentre segue il riquadro — trovava il
     ciclo spento e ne apriva un secondo. Due cicli chiamano due
     `sveglia()`, quattro ne chiamano quattro: misurato con la carta
     aperta, 4.096 → 8.192 → 16.384 → 32.768 richieste al secondo, e la
     pagina si pianta. Con un valore che dice «sto disegnando», la sveglia
     dentro il fotogramma non fa nulla, ed è la coda del fotogramma a
     decidere se ce n'e' un altro. */
  vivo = -1;
  /* e se il banco è sospeso il fotogramma finisce qui, prima di ogni
     conto: `ultimoFrame` si azzera perché al ritorno il passo di tempo
     non sia il minuto passato in un'altra schermata - un dt enorme fa
     esplodere le molle e il pezzo parte per la tangente. */
  if(sospeso){ vivo = 0; ultimoFrame = 0; return; }
  /* quanto costa il fotogramma in JS — disegno compreso, per quel che la
     chiamata a WebGL sa dire. Serve al monitor e al riquadro di diagnosi:
     letto accanto alla distanza fra un fotogramma e l'altro, dice se la
     macchina è in affanno o se sta solo disegnando meno spesso. */
  const _lavoro0 = performance.now();
  rend.info.reset();               // vedi `rend.info.autoReset`: si conta il FOTOGRAMMA
  /* i fotogrammi DISEGNATI, non le richieste di rAF: il banco di prova
     pilota il gesto con un rAF suo, e dividere per quelle darebbe numeri
     per fotogramma più bassi del vero */
  window.__fotogrammi = (window.__fotogrammi || 0) + 1;
  /* IL PASSO DI TEMPO SI MISURA E SI LIMITA: legata ai fotogrammi, la
     stessa molla è due volte più veloce su uno schermo a 120 Hz; e se la
     scheda torna in primo piano dopo un minuto, un dt enorme fa esplodere
     l'integrazione e il pezzo parte per la tangente. */
  // e non può mai essere NEGATIVO: l'orologio dei fotogrammi è monotono,
  // ma il banco di prova pilota il moto a mano e lì un passo all'indietro
  // faceva TORNARE INDIETRO il colore a metà passaggio
  /* e il passo GREZZO — quello vero, senza tetto — è il solo numero che
     dica se un fotogramma è andato lungo: è quello che legge il
     monitor, in fondo al ciclo. Il `dt` limitato serve alle molle, non
     alla diagnosi. */
  const grezzo = ultimoFrame ? ora - ultimoFrame : 0;
  const dt = ultimoFrame
    ? Math.max(0, Math.min(0.034, (ora - ultimoFrame) / 1000)) : 0.016;
  ultimoFrame = ora;

  // da quanto nessuno tocca: si somma qui, un fotogramma per volta
  if(giu || pizzico) etaFerma = 0; else etaFerma += dt;

  /* IL GESTO SI SERVE QUI, e prima di tutto il resto: quello che il dito
     ha scritto dall'ultimo fotogramma diventa il bersaglio della
     macchina, una volta sola, e subito dopo la macchina ci si mette. */
  if(gestoSporco) passoDito();

  /* ── SOTTO IL DITO SI DISEGNA A MENO PIXEL ─────────────────────
     Mentre il dito è giu' — e finché la molla del rilascio corre forte —
     la tela scende a sette decimi di lato, cioè a metà dei pixel. Non
     è un compromesso sulla qualità: è la stessa scelta che fa
     qualunque visualizzatore 3D, perché quello che si sta guardando in
     quel momento si sta MUOVENDO, e su un'immagine in movimento la
     nitidezza non si legge — la cadenza si'.
     Si torna pieni in due fotogrammi, con un gradino in mezzo: un salto
     unico da 0,7 a 1 su un'immagine ormai ferma si vede come uno scatto
     di messa a fuoco. Il ciclo non si spegne finché non ci è tornato
     (vedi `fermo`, in fondo), o l'ultimo fotogramma resterebbe sgranato. */
  const inGesto = giu !== null || pizzico
    || Math.abs(posV) > 0.9 || Math.abs(giroV) > 0.9
    /* e la coda del banco è la stessa cosa: un lancio fra famiglie muove
       tutta la vetrina, ed è il fotogramma più largo che ci sia */
    || (bancoVola && Math.abs(bancoV) > 0.02);
  if(inGesto){ gestoScala = scalaSottoIlDito(); ripresaGesto = 0; }
  else if(gestoScala < 1){
    ripresaGesto++;
    gestoScala = ripresaGesto >= 2 ? 1 : (gestoScala + 1) / 2;
  }
  /* e mentre il dito è giu' NON si rialloca: vedi `risoluzione`. Il
     valore nuovo, se il monitor ne ha deciso uno, lo prende il primo
     fotogramma a riposo — che ripassa comunque di qui. */
  bloccaRisoluzione = telefono && inGesto;
  risoluzione();

  passoVela(dt);
  /* ── LA FINESTRA SI SEGUE, NON SI RINCORRE A SCATTI ────────────
     Con `?carta=finestra` il ritaglio nel cartoncino si misura sul
     riquadro impaginato, e il riquadro nei primi mezzo secondo si sta
     ancora impaginando: la carta entra scalata di 3,5 centesimi, il
     cartellino si ritira in 0,22 s e l'altezza si assesta in 0,34.
     Prima c'erano due CORREZIONI ritardate, a 240 e a 480 ms: due
     strappi su un bersaglio verso cui la molla stava già andando, cioè
     lo stesso difetto del volo al pezzo, un livello più su. Adesso il
     bersaglio segue il riquadro a ogni fotogramma finché il riquadro si
     muove: è un tragitto solo, e finisce dove il riquadro si ferma. */
  if(seguiFinestra > 0){
    seguiFinestra = Math.max(0, seguiFinestra - dt);
    inquadraNellaFinestra();
    if(!seguiFinestra) rifaiFinestra();
  }

  /* LA DISSOLVENZA DELLA CATENA, accanto a quella della fodera: sono lo
     stesso mestiere - un'opacita' che corre su una curva - e stanno
     vicine perché chi cambia una guardi anche l'altra. */
  /* e la dissolvenza NON entra fra i moti che staccano la catena delle
     passate (vedi `muove`, più sotto): staccarla spegnerebbe sfocato e
     occlusione per i suoi quindici fotogrammi, e al rientro il fondo
     tornerebbe sfocato di colpo - un lampo grosso per nascondere uno
     scambio piccolo. Tiene acceso il ciclo (vedi `fermo`) e nient'altro. */
  if(dissolvenze.length) passoDissolvenze(dt);
  /* e i riti, con la stessa regola delle dissolvenze: tengono acceso il
     ciclo (vedi `fermo`) e NON entrano fra i moti che staccano la catena
     delle passate — staccarla spegnerebbe sfocato e occlusione proprio
     nella scena in cui si guarda un pezzo arrivare. */
  if(RITI.length) passoRiti();
  if(vesteT < 1){
    vesteT = Math.min(1, vesteT + dt / 0.45);
    // una curva morbida in entrata e in uscita: il colore non parte di
    // scatto e non si ferma di scatto
    const t = vesteT * vesteT * (3 - 2 * vesteT);
    tingi(_ora.copy(_da).lerp(_a, t));
  }

  if(!giu && livello === 1){
    if(ridotto){ pos = posMeta; posV = 0; coda = 0; }
    else if(coda){
      /* -- LA CODA: SOLO DECADIMENTO --------------------------------
         Una riga, ed è tutta la fisica: la velocita' è SEMPRE la strada
         che resta diviso tau. È la stessa identica cosa di «decade del
         fattore lambda a ogni millisecondo» — in un decadimento
         esponenziale velocita' e strada residua sono proporzionali — ma
         scritta così si corregge da sola.
         PERCHÉ NON `v *= lambda^ms`: provato, e la fila si piantava un
         pixel e due decimi prima della stazione. Sommando la velocita'
         DOPO il decadimento, fotogramma per fotogramma, il totale vale
         v0·(tau - dt/2) invece di v0·tau: mezzo fotogramma di strada che
         non si fa mai, e con una soglia di aggancio a tre decimi di pixel
         quel residuo non si chiude più. Misurato: coda ferma a 1,2 px
         dal bersaglio, ciclo che non si spegne.
         Legata alla strada residua, invece, la coda finisce esattamente
         dove deve, resta monotona (la strada scende, quindi la velocita'
         scende) e non può superare il bersaglio: un passo vale
         resta·dt/tau, e dt è sempre molto meno di tau.
         Il `min` con la velocita' di prima è la garanzia scritta che
         nessun fotogramma sia più veloce del precedente — serve quando il
         PAVIMENTO ha allungato la coda oltre la strada disponibile, e lì
         il primo fotogramma taglia la velocita' invece di alzarla. */
      const resta = Math.abs(posMeta - pos), verso = Math.sign(posMeta - pos);
      const agg = AGGANCIO_PX / PASSO_DITO;
      if(resta < agg){ pos = posMeta; posV = 0; coda = 0; }
      else {
        posV = verso * Math.min(resta * codaTau, Math.abs(posV));
        pos += posV * dt;
        if(Math.abs(posMeta - pos) < agg){ pos = posMeta; posV = 0; coda = 0; }
      }
    }
    else { const r = molla(pos, posV, posMeta, kPos, dt); pos = r[0]; posV = r[1]; }
    applicaPos(false);
  }

  /* -- LA CODA DEL BANCO -----------------------------------------
     Stessa molla della fila, in metri invece che in stazioni. Il
     bersaglio della macchina si muove da solo, e la macchina ci sta
     ATTACCATA: la molla dei voli, più avanti, aggiungerebbe un secondo
     ritardo sopra questo — una molla dentro una molla — e il lancio si
     leggerebbe molle esattamente come il difetto che stiamo togliendo. */
  if(bancoVola && livello === 0 && !giu && !pizzico){
    if(ridotto){ occhioObiettivo.x = bancoMeta; bancoV = 0; bancoVola = false; }
    else {
      // tre decimi di pixel di dito, in metri: la stessa soglia della fila
      const agg = AGGANCIO_PX * 0.0016;
      const resta = Math.abs(bancoMeta - occhioObiettivo.x);
      const verso = Math.sign(bancoMeta - occhioObiettivo.x);
      if(resta < agg){ occhioObiettivo.x = bancoMeta; bancoV = 0; bancoVola = false; }
      else if(bancoCoda){
        // vedi la coda della fila: la velocita' è la strada che resta
        // diviso tau, e il min con quella di prima la tiene non crescente
        bancoV = verso * Math.min(resta * bancoTau, Math.abs(bancoV));
        occhioObiettivo.x += bancoV * dt;
        if(Math.abs(bancoMeta - occhioObiettivo.x) < agg){
          occhioObiettivo.x = bancoMeta; bancoV = 0; bancoVola = false; bancoCoda = 0;
        }
      } else {
        const r = molla(occhioObiettivo.x, bancoV, bancoMeta, bancoK, dt);
        occhioObiettivo.x = r[0]; bancoV = r[1];
        if(Math.abs(occhioObiettivo.x - bancoMeta) < agg && Math.abs(bancoV) < 0.004){
          occhioObiettivo.x = bancoMeta; bancoV = 0; bancoVola = false;
        }
      }
    }
    miraObiettivo.x = occhioObiettivo.x;
    partenzaBanco = occhioObiettivo.x;
    segnaVicino(occhioObiettivo.x);
  } else if(bancoVola) fermaBanco();

  /* AL PEZZO LA MACCHINA NON STA MAI FERMA DEL TUTTO. Un oggetto in mano lo
     si muove sempre un po', e quel minimo di movimento è quello che dice
     che è un oggetto e non una figura. Si ferma appena lo tocchi.
     MA NON GIRA VIA. Sommava 0,085 radianti al secondo senza mai tornare:
     in tre secondi la macchina era a quattordici gradi, cioè fuori dal
     piano del fondale — quello nitido — e dietro al gioiello restava la
     parete liscia della panoramica. È la «parete piatta» che tornava sul
     pezzo. Un oggetto in mano lo si DONDOLA, non lo si mette su un
     tornio: undici centesimi di radiante avanti e indietro, dentro il
     campo che il fondale copre, e il movimento si vede uguale. */
  /* ── E IL DONDOLO HA UNA FINE ──────────────────────────────────
     Misurato prima di questa riga: al livello del pezzo il ciclo non si
     spegneva MAI — 899 fotogrammi in quindici secondi di scena
     immobile — per un'oscillazione di 0,11 radianti con un periodo di
     quasi quindici secondi. Sessanta disegni al secondo, con occlusione
     e sfocatura addosso, per un movimento che in un fotogramma vale
     trentadue millesimi di grado. Su un telefono quello è la batteria.
     Un oggetto in mano si muove finché qualcuno lo sta guardando.
     Dodici secondi senza che nessuno tocchi, e si posa: l'ampiezza
     scende nell'ultimo secondo e due — se si spegnesse di colpo sarebbe
     uno scatto di 0,11 radianti — e poi il ciclo può fermarsi davvero.
     Qualunque tocco lo risveglia, perché `tocco()` azzera il contatore. */
  const DONDOLO_VITA = 12, DONDOLO_SPEGNI = 1.2;
  const dondoloVivo = !ridotto && etaFerma < DONDOLO_VITA;
  /* ── E NON MENTRE LA MACCHINA STA ANCORA ARRIVANDO ─────────────
     Il dondolo è il minimo movimento di una cosa tenuta in mano, e una
     cosa la si tiene in mano quando ce l'hai. Partendo dall'istante del
     tocco oscillava DURANTE il volo — misurato: 0,027 radianti a metà
     strada — e siccome il giro entra nel conto del bersaglio, il
     bersaglio si spostava a ogni fotogramma. Comincia all'arrivo. */
  if(livello === 2 && !giu && !pizzico && !voloAlPezzo){
    /* E RESTA DOVE LO LASCI. Per un po' il dondolo era un BERSAGLIO e la
       macchina ci tornava sempre: l'avevo fatto perché il piano del
       fondale copriva solo i primi dieci gradi e girando si perdeva la
       stanza. Quel motivo non c'è più — al livello del pezzo lavora la
       sfera, che è la stessa stanza da ogni angolo — e il ritorno
       rimaneva solo come un difetto: giravi il gioiello e se ne tornava
       indietro da solo, che è un altro modo di sembrare lento.
       Adesso il dondolo oscilla attorno a DOVE L'HAI LASCIATO. E dopo un
       lancio la rotazione prosegue e si spegne in mezzo secondo: è quella
       coda a far sentire il gesto, più di qualunque taratura. */
    if(Math.abs(giroV) > 0.02){
      giroP += giroV * dt;
      giroV *= Math.exp(-dt / ((MOTI[window.__moto] || MOTI[MOTO_DI_SERIE]).tau));
      giroBase = giroP;
      dondolo = 0;
    } else if(dondoloVivo){
      giroV = 0;
      dondolo += dt;
      // l'ampiezza si ritira nell'ultimo secondo e due invece di sparire
      const forza = Math.max(0, Math.min(1, (DONDOLO_VITA - etaFerma) / DONDOLO_SPEGNI));
      giroP = giroBase + 0.11 * forza * Math.sin(dondolo * 0.42);
    } else {
      giroV = 0;
      giroP = giroBase;      // posato: da qui in poi non c'è più niente da disegnare
    }
    /* SOLO IL GIRO: distanza e scarto sono quelli decisi al tocco */
    inquadraPezzo(true);
  }

  /* ══════════════════════════════════════════════════════════════
     MENTRE IL DITO È GIU', LA MACCHINA NON HA MOLLA

     Il valore logico seguiva il dito uno a uno — verificato: 0,01612
     radianti per pixel contro 0,01611 teorici — ma la MACCHINA no: fra
     lei e il dito c'era la stessa molla dei voli, e misurato al livello
     del pezzo restava indietro di 2,12 radianti, cioè 132 pixel di
     dito. Un oggetto che si gira in mano non ha un ritardo: il tuo dito
     è sulla superficie, e la superficie è lì.
     Quindi finché il dito è sullo schermo la macchina È il valore
     logico. La molla torna al rilascio — lì è giusta, perché lì non
     c'è più nessun dito da seguire e quello che si guarda è una cosa
     che si posa.
     ══════════════════════════════════════════════════════════════ */
  /* ── QUANTO DURA UN VOLO ────────────────────────────────────────
     Era k = 118: pulsazione 10,86, e misurato con l'orologio pilotato a
     mano il 99 per cento del cammino arrivava a 667 millisecondi. I
     riferimenti stanno tutti sotto: la molla di serie di SwiftUI
     (response 0,5 · damping 0,825), lo «spatial» di Material 3 a 700 di
     rigidita'. Mezzo secondo è la misura di un cambio di inquadratura,
     non di un viaggio.
     A k = 148 la pulsazione sale a 12,17 e il 99 per cento cade a 546 ms
     di conto — misurati 600 sul banco, dove entrano anche il passo di
     16,7 ms e la molla della mira. Resta CRITICAMENTE SMORZATA (lo
     smorzamento è 2·radice di k): sovraelongazione zero, come deve
     essere su un gioiello — un rimbalzo elastico su una collana è un
     giocattolo. */
  const K_VOLO = 148;
  /* e durante la CODA del banco vale la stessa regola del dito giu': la
     decelerazione è già una molla, e metterne un'altra in fila le
     sommerebbe i ritardi */
  if((giu || bancoVola) && !pizzico){
    occhio.copy(occhioObiettivo); mira.copy(miraObiettivo);
    occhioV.set(0, 0, 0); miraV.set(0, 0, 0);
  } else if(ridotto){
    // meno movimento: la macchina non vola, si trova già arrivata
    occhio.copy(occhioObiettivo); mira.copy(miraObiettivo);
    occhioV.set(0, 0, 0); miraV.set(0, 0, 0);
  } else {
    for(const c of ["x", "y", "z"]){
      const a = molla(occhio[c], occhioV[c], occhioObiettivo[c], K_VOLO, dt);
      occhio[c] = a[0]; occhioV[c] = a[1];
      const b = molla(mira[c], miraV[c], miraObiettivo[c], K_VOLO, dt);
      mira[c] = b[0]; miraV[c] = b[1];
    }
  }
  /* ── QUANDO IL VOLO È FINITO ─────────────────────────
     Non a tempo: a DISTANZA. Tre millimetri su un volo che ne fa da
     trecento a seicento valgono meno di due punti di schermo, ed è lì
     che il dondolo può cominciare senza che si legga un cambio di
     rotta. A movimento ridotto la macchina si trova già arrivata, e il
     volo finisce nello stesso fotogramma in cui è cominciato. */
  if(voloAlPezzo && (ridotto || occhio.distanceTo(occhioObiettivo) < 0.003))
    voloAlPezzo = false;
  if(!pizzico){
    const z = molla(zoom, zoomV, zoomMeta, 150, dt); zoom = z[0]; zoomV = z[1];
    const px = molla(panX, panVX, panMetaX, 150, dt); panX = px[0]; panVX = px[1];
    const py = molla(panY, panVY, panMetaY, 150, dt); panY = py[0]; panVY = py[1];
  }

  /* L'INGRANDIMENTO E LO SPOSTAMENTO SI APPLICANO SOPRA, non dentro la
     molla: la molla porta la macchina dove deve stare, il pizzico la
     sposta rispetto a lì. Mescolarli faceva tornare indietro il pizzico
     ogni volta che la molla si assestava. */
  _dir.subVectors(occhio, mira);
  const dist = _dir.length() || 0.001;
  _dir.divideScalar(dist);
  _destra.crossVectors(_dir, ALTO_MONDO).normalize();
  _su.crossVectors(_destra, _dir).normalize();
  _spost.copy(_destra).multiplyScalar(panX).addScaledVector(_su, panY);
  _mira.copy(mira).add(_spost);
  camera.position.copy(_mira).addScaledVector(_dir, dist / zoom);
  camera.lookAt(_mira);
  /* ── E LA POSA SI METTE A POSTO CON QUESTA MACCHINA, NON CON
     QUELLA DI PRIMA ─────────────────────────────────────────────
     La sua strada è scritta in punti di schermo, e i punti di schermo
     li fa la macchina: chiamata in cima al ciclo userebbe quella del
     fotogramma precedente, e a ventisei punti di velocita' di punta un
     fotogramma di scarto è un salto di ventisei punti. */
  camera.updateMatrixWorld(true);
  passoPosa();

  /* IL PIANO NON LAMPEGGIA PIÙ. Avevo provato a tenerlo anche sul pezzo,
     dissolvendolo quando la rotazione ne avrebbe mostrato il bordo: e la
     dissolvenza si vede — «la parete addobbata fa ancora un effetto appare
     e scompare». Un fondo che va e viene è peggio di un fondo meno nitido.
     Adesso al livello del pezzo lavora SOLO la sfera, ferma e sempre la
     stessa. Prima non si poteva, perché la sfera mostrava una fetta
     qualunque di pavimento: la panoramica era resa da una macchina che
     guardava in basso. Orientata e rimessa in verso, la sfera è la stessa
     stanza da ogni angolo — e a quel livello la profondita' di campo la
     sfoca di quarantaquattro pixel, dove la differenza di nitidezza col
     piano non si legge. */
  parete.visible = (livello !== 2);

  /* ── E IL FUOCO SI TIENE AGGIORNATO ANCHE A PASSATA SPENTA ─────
     Questo blocco stava sotto `if(sfoca.enabled)`, e la condizione era
     sempre vera perché nessuno spegneva mai la passata. Adesso qualcuno
     la spegne — durante il gesto — e se il blocco ci restasse dentro
     succederebbero due cose: il fuoco tornerebbe con il valore di mezzo
     secondo prima, e la LAMPADA del gioielliere smetterebbe di seguire la
     macchina durante il volo al pezzo, per poi saltarci addosso
     all'arrivo. Costano due sottrazioni di vettori: si fanno sempre. */
  {
    /* IL FUOCO STA SUL SOGGETTO DEL MOMENTO. Sul pezzo quando se ne guarda
       uno; sul punto che si sta mirando quando si guarda un espositore o
       tutto il banco — se no, al banco la macchina metterebbe a fuoco un
       pezzo che non è nemmeno in campo e la merce verrebbe molle. */
    sfoca.uniforms.focus.value = camera.position
      .distanceTo(livello === 2 ? centroP : _mira);
    // e la lampada segue la macchina, da sopra e da sinistra
    lampada.position.copy(camera.position)
      .addScaledVector(_su, 0.05).addScaledVector(_destra, -0.04);
    lampada.target.position.copy(centroP);
    lampada.target.updateMatrixWorld();
  }

  /* ── CHI SI MUOVE, E DA QUANTO NON SI MUOVE PIÙ ───────────────
     Non è `inGesto`: il dito lascia lo schermo e la molla continua a
     correre per mezzo secondo, e quella è la parte del gesto che si
     guarda di più. Si contano tutti i moti che disegnano — il dito, il
     volo, la vela, la posa che scivola, la finestra che si insegue, il
     colore che attraversa — e si misura da quanti millisecondi sono
     finiti TUTTI. Un quarto di secondo: è il tempo in cui una mano si
     ferma davvero, ed è sotto la soglia in cui un ritorno di fuoco si
     legge come un ripensamento. */
  const muove = inGesto || voloAlPezzo || velaVerso || posaMobile || bancoVola
    || seguiFinestra > 0 || vesteT < 1
    || occhio.distanceTo(occhioObiettivo) > 0.0012
    || Math.abs(pos - posMeta) > 0.002;
  if(muove) fermoDa = 0; else fermoDa += Math.max(1, Math.min(100, grezzo || 16.7));
  /* ── E IL VOLO AL PEZZO VALE COME UN GESTO ─────────────────────
     `livello` diventa 2 nell'istante del tocco, ma il volo che porta il
     gioiello in mano dura mezzo secondo e in quel mezzo secondo la scena
     è ancora tutta quella del banco: tenerci la catena addosso vuol dire
     pagare il fotogramma più caro proprio durante il movimento più
     largo. Si vola diretti, e la lente si apre all'arrivo — che è anche
     il gesto vero di un obiettivo che va sul soggetto. */
  postDiretto = telefono && (livello < 2 || voloAlPezzo)
             && fermoDa < POST_A_RIPOSO;
  if(postDiretto) sfocaT = 0;
  else if(sfocaT < 1){
    sfocaT = Math.min(1, sfocaT + dt / RIENTRO_S);
    sfoca.uniforms.maxblur.value = sfocaMax * sfocaT;
  }
  dipingi();

  const fermo = vesteT >= 1
             && !dissolvenze.length
             && !RITI.length
             && gestoScala >= 1
             && !velaVerso
             && !bancoVola
             && !posaMobile
             && !seguiFinestra
             && occhio.distanceTo(occhioObiettivo) < 0.0003
             && mira.distanceTo(miraObiettivo) < 0.0003
             && Math.abs(pos - posMeta) < 0.0015 && Math.abs(posV) < 0.004
             && Math.abs(zoom - zoomMeta) < 0.002
             && Math.abs(panX - panMetaX) < 0.0002
             && Math.abs(panY - panMetaY) < 0.0002;
  /* AL PEZZO IL MOTO ADESSO FINISCE. Stava scritto `|| livello === 2`, e
     quella riga da sola teneva acceso il ciclo per sempre: misurati 899
     fotogrammi in quindici secondi di scena immobile. Il dondolo ha una
     vita, e quando è finita il livello del pezzo si ferma come tutti
     gli altri — il prossimo tocco lo risveglia. */
  monitor(ora, grezzo, performance.now() - _lavoro0);
  /* e il canale sa dove siamo (vedi `raccontaDoveSiamo`, in fondo): qui
     perché è l'unico posto che vede OGNI cambio di livello, da
     qualunque strada sia arrivato */
  if(window.__raccontaDoveSiamo) window.__raccontaDoveSiamo();
  if(DIAG) scriviDiagnosi();
  /* ── E NON SI SPEGNE PRIMA DI AVER RIMESSO LA SFOCATURA ────────
     Con la catena staccata, l'ultimo fotogramma disegnato sarebbe quello
     DIRETTO: il gesto finisce, la molla si posa, il ciclo si ferma — e la
     stanza resta nitida per sempre, cioè l'app perde la sua firma proprio
     nel momento in cui ci si ferma a guardarla. `postDiretto` tiene acceso
     il ciclo per il quarto di secondo che manca; poi passa un fotogramma
     con la catena, e lì si spegne. Sono una quindicina di fotogrammi
     diretti, che è la forma più economica che abbia questo ciclo. */
  if(!fermo || giu !== null || pizzico || postDiretto || sfocaT < 1
     || (livello === 2 && dondoloVivo))
    vivo = requestAnimationFrame(gira);
  else { vivo = 0; pos = posMeta; posV = 0; ultimoFrame = 0; }
}

/* Il collaudo pilota il moto A MANO. In una scheda non visibile
   requestAnimationFrame non scatta affatto: senza questa presa la molla non
   si può misurare, e l'assenza di misura sembrerebbe un guasto. */
window.__passo = t => gira(t);
/* il banco di misura _I2_ ha bisogno di leggere la merce, quello che è
   uscito dal cofanetto e la dispensa dei provini. Sono riferimenti, non
   copie, e stanno qui in fondo — accanto alle altre sonde — perché un
   `const` letto prima della sua riga non è indefinito: è un errore che
   uccide il modulo intero, ed è la stessa trappola già pagata su
   `cartaPezzo`. */
window.__merci = merci; window.__tolti = TOLTI; window.__pose = pose;
/* aprire la carta dal banco di prova, da qualunque livello si parta:
   dal banco si entra, in famiglia si prende il pezzo, sul pezzo si apre
   la carta — cioè esattamente i passi che fa un dito. */
/* la sonda della FINESTRA: il rettangolo del ritaglio e quello che il
   pezzo occupa davvero sullo schermo adesso, con la macchina dov'e'.
   Serve al collaudo — il pezzo ci sta dentro? con quanto margine? — e
   proietta con la macchina VERA, non con quella di prova. */
window.__finestra = () => {
  const f = document.querySelector(".riga-foto").getBoundingClientRect();
  if(boxP.isEmpty()) return null;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
             i & 2 ? boxP.max.y : boxP.min.y,
             i & 4 ? boxP.max.z : boxP.min.z).project(camera);
    const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const r = n => Math.round(n * 10) / 10;
  return {
    finestra:{x:r(f.left), y:r(f.top), w:r(f.width), h:r(f.height)},
    pezzo:{x:r(x0), y:r(y0), w:r(x1 - x0), h:r(y1 - y0)},
    dentro: x0 >= f.left - 0.5 && x1 <= f.right + 0.5
         && y0 >= f.top - 0.5 && y1 <= f.bottom + 0.5,
    margine:{sx:r(x0 - f.left), dx:r(f.right - x1),
             su:r(y0 - f.top), giu:r(f.bottom - y1)},
    riempie:{x:r((x1 - x0) / f.width * 100), y:r((y1 - y0) / f.height * 100)}
  };
};
/* APRIRE UN POSTO, da qualunque parte arrivi l'ordine. Tre cose in fila e
   l'ordine conta: la famiglia (che l'aspetta se il suo .glb non è ancora
   sceso e rimette gli espositori a casa), la stazione, il pezzo. Lo usano
   il canale (`banco/mostra`) e la sonda; scriverlo due volte vorrebbe dire
   che un giorno una delle due copie aprira' il pezzo prima della fila. */
window.__apriPosto = (fam, k) => {
  const vai = () => {
    if(!merci[fam] || !merci[fam][k]) return;
    if(livello !== 1 || attiva !== fam) entra(fam);
    const dove = stazioni(fam).findIndex(g => g.indexOf(k) >= 0);
    if(dove >= 0){ pos = posMeta = posGiu = dove; posV = 0; applicaPos(false); }
    mostraScheda();
    apriPezzo(k);
  };
  if(banchi[fam] && banchi[fam].length) vai();
  else {
    const f = FAMIGLIE.find(x => x.id === fam);
    if(!f) return;
    scritte(f.nome, "", "arrivano…", "ancora un momento");
    subitoQuesta(f).then(vai).catch(() => mostraToast("Questo reparto non è arrivato. Riprova."));
  }
};
window.__apriCarta = (fam, k) => {
  if(livello !== 1 || attiva !== fam) entra(fam);
  const dove = stazioni(fam).findIndex(g => g.indexOf(k) >= 0);
  if(dove >= 0){ pos = posMeta = posGiu = dove; posV = 0; applicaPos(false); }
  mostraScheda();
  apriPezzo(k);
  apriCarta(fam, k);
  ferma();
};
/* SEI DECIMALI SU `pos`, NON QUATTRO. Un decimillesimo di stazione è
   un centesimo di pixel, e a quattro decimi la differenza fra due
   fotogrammi di coda lenta è fatta di pochi quanti: il banco leggeva
   risalite di velocita' che non esistono, dentro un decadimento che è
   monotono per costruzione. */
window.__sonda = () => ({pos:+pos.toFixed(6), posMeta:+posMeta.toFixed(3),
  posV:+posV.toFixed(3), vel:+velDito.toFixed(2), giu:!!giu, zoom:+zoom.toFixed(3),
  /* il passo del dito è quello che traduce una stazione in pixel di
     schermo: senza, il banco non sa dire se la scena ha seguito il dito
     uno a uno, e ogni numero resta in unita' che cambiano da famiglia a
     famiglia. */
  passo:+PASSO_DITO.toFixed(1),
  /* la rigidita' scelta per il lancio in corso e la velocita' che la
     molla ha EREDITATO: senza queste due il banco misura la velocita'
     sul primo fotogramma, che è già un fotogramma di decelerazione —
     al 13 per cento su un lancio forte — e la scambia per un salto. */
  k:+kPos.toFixed(1), bancoV:+bancoV.toFixed(4), bancoVola,
  /* la coda in corso: il lambda risolto per QUESTO lancio, ricavato da
     1/tau. Il banco misura che sia davvero quello che il rilascio ha
     scelto, e non un numero fisso travestito. */
  coda, lam: coda ? +Math.exp(-codaTau / 1000).toFixed(5) : null,
  bancoLam: bancoCoda ? +Math.exp(-bancoTau / 1000).toFixed(5) : null,
  indice, scelto, livello, attiva,
  /* giroBase è il giro SENZA il dondolo: serve al banco per misurare la
     coda di un rilascio, che altrimenti si legge sommata a 0,11 radianti
     di oscillazione e ogni variante risulta più lunga di quello che è */
  giroP:+giroP.toFixed(4), giroBase:+giroBase.toFixed(4),
  giroV:+giroV.toFixed(4), eta:+etaFerma.toFixed(2),
  moto:window.__moto, ridotto, vela:velaVerso, velaT:+velaT.toFixed(3)});

/* ══════════════════════════════════════════════════════════════
   LO STATO SI LEGGE, NON SI RICORDA

   Era un oggetto RISCRITTO dentro gira(), una volta per fotogramma. Con
   il ciclo che adesso si spegne davvero — il dondolo ha una fine — chi lo
   legge a scena ferma troverebbe la fotografia dell'ultimo fotogramma
   disegnato, che può essere di dodici secondi prima. Un getter lo
   calcola quando lo si chiede, e allora è sempre vero.
   ══════════════════════════════════════════════════════════════ */
Object.defineProperty(window, "__stato", {
  configurable: true,
  get(){ return {livello, attiva, scelto, indice,
    pos:+pos.toFixed(3), posMeta:+posMeta.toFixed(3), vel:+velDito.toFixed(2),
    zoom:+zoom.toFixed(2), giroP:+giroP.toFixed(3), moto:window.__moto}; }
});

/* la preferenza di movimento si può accendere ad applicazione aperta */
menoMoto.addEventListener("change", e => {

addEventListener("resize", ()=>{
  rend.setSize(innerWidth, innerHeight);
  /* e i bersagli delle passate li rimette `risoluzione`, che è l'unico
     posto dove si sa a quanti pixel si sta disegnando adesso */
  risoluzione(true);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  /* ── PRIMA L'IMPIANTO, POI L'INQUADRATURA ─────────────────────
     Trascinando il bordo della finestra da 1440 a 700 il pannello sparisce
     e il cartellino torna in basso: se l'ordine si invertisse, la macchina
     si rifarebbe il quadro su un'area che sta per cambiare, e il primo
     fotogramma dopo il ridimensionamento avrebbe il pezzo fuori posto.
     `adattaTitolo` sta in mezzo perché il corpo del nome dipende dal
     lato in cui siamo, e l'altezza del cartellino dipende dal corpo. */
  /* la coda trasparente della testata dipende dalla tacca del telefono, e
     la tacca coricando lo schermo cambia lato: la misura si butta via e
     `areaUtile` la riprende alla prima richiesta */
  codaAlto = null;
  /* e con lei la banda ferma del pezzo: uno schermo che cambia misura è
     l'altro dei due momenti in cui la banda cambia per davvero */
  bandaPezzo = null;
  scadeArea();
  const eraLarga = larga;
  larga = LARGO.matches;
  if(larga !== eraLarga){ sistemaImpianto(); applicaCarta(); scadeArea(); }
  adattaTitolo();
  if(livello === 0) vaiAlBanco(true);
  else if(livello === 1){ inquadraFamiglia(); applicaPos(false); }
  else { bandaPezzo = misuraArea(); inquadraPezzo(); }
  /* e la striscia si ricentra: trascinando il bordo della finestra il
     pannello compare e sparisce, e con lui il centro della scena */
  centraToast();
  /* e il nastro della carta riconta le sue colonne: passando da telefono
     a pannello la carta cambia larghezza, e le parole che ci stavano in

  if(!cartaPezzo.hidden) sistemaNastro();
