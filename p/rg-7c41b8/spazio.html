#rimuovi.qui .velo{opacity:1;
  transition:opacity var(--entra) var(--curva-entra)}
/* UN FOGLIO È UNA DELLE DUE COSE CHE IL MATERIALE SE LO MERITANO —
   «solo su barre e fogli», dice il sistema, e questo è un foglio che
   sale sulla scena in tre dimensioni. Prende il materiale THICK (40 di
   sfocatura, 88% di tinta): sotto ci sono un gioiello e un velo scuro,
   e un vetro sottile lì sopra lascerebbe passare la merce dentro il
   testo. Il raggio è quello del sistema per un foglio (14, la stessa
   famiglia dell'avviso) e l'ombra è `--ombra-sheet`, cioè quella
   dichiarata per i fogli: lunga, bassa, e rivolta in su. */
#rimuovi .foglio{position:relative;width:min(390px,100vw);
  max-height:88%;overflow-y:auto;
  border-radius:var(--r-alert) var(--r-alert) 0 0;
  padding:10px 16px calc(16px + max(env(safe-area-inset-bottom),8px));
  transform:translateY(100%);
  transition:transform var(--esce) var(--curva-esce);
  box-shadow:var(--vetro-stacco), var(--ombra-sheet)}
/* il filo di luce del foglio corre solo in alto, come sulla capsula */
#rimuovi .foglio::after{content:"";position:absolute;inset:0;
  border-radius:inherit;pointer-events:none;
  border:1px solid var(--vetro-riflesso);border-bottom:0;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 18%);
  mask-image:linear-gradient(to bottom,#000 0%,transparent 18%)}
#rimuovi.qui .foglio{transform:translateY(0);
  transition:transform var(--entra) var(--curva-entra)}
/* IL FOGLIO PRENDE IL FUOCO E NON LO DISEGNA. `tabindex="-1"` serve al
   lettore di schermo — entrando in una finestra modale il fuoco deve
   entrarci davvero — ma Chrome, quando il fuoco lo sposta il codice, su
   un contenitore ci disegna l'anello: una riga turchese lungo il bordo
   alto del foglio, fotografata. È la stessa cura che il file ha già
   per le facce della carta. */
#rimuovi .foglio:focus, #rimuovi .foglio:focus-visible{outline:none}
#rimuovi .manico{display:block;width:36px;height:5px;border-radius:var(--r-capsula);
  background:var(--bordo);margin:0 auto 16px;opacity:.55}
#rimuovi h2{font:400 28px/1.15 Bodoni,Didot,Georgia,serif;
  color:var(--testo);margin-bottom:10px}
/* LA LISTA INSET GROUPED del sistema: un contenitore a raggio 10 col
   suo filo, e dentro le righe separate da un hairline. Le righe NON
   hanno un raggio proprio: un filo che si incurva alle estremita' di
   ogni riga disegna tre rettangoli arrotondati uno sull'altro, e non è
   una lista — è quello che si vedeva nello scatto di prova. */
#rimuovi-righe{border-radius:10px;overflow:hidden;
  background:rgba(255,255,255,.46);
  box-shadow:inset 0 0 0 1px var(--linea)}
#rimuovi .r{display:block;width:100%;min-height:56px;text-align:left;
  border:0;background:none;padding:11px 14px;
  border-top:1px solid var(--linea);cursor:pointer;
  transition:background var(--d-tocco) var(--ios)}
#rimuovi .r:first-child{border-top:0}
#rimuovi .r b{display:block;font:400 17px/1.35 Inter,sans-serif;
  color:var(--testo)}
#rimuovi .r span{display:block;margin-top:2px;
  font:400 13px/1.4 Inter,sans-serif;color:var(--quieto)}
#rimuovi .r:active{background:var(--cipria)}
/* il secondario del sistema: LA STESSA CAPSULA SVUOTATA, filo hairline
   e testo. Prima era un pieno di cipria, cioè un secondo pieno accanto
   a niente — su un foglio dove l'unica azione piena non c'è. */
#rimuovi .annulla{margin-top:16px;width:100%;height:50px;
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;
  background:rgba(255,255,255,.52)}

/* ── LA PILLOLA DI CONFERMA, quella del sistema ───────────────────
   36 punti di altezza, `--vano` su `--luce`, dentro in 100 e fuori in
   250: sono i numeri scritti nel sistema, e valgono per la rimozione —
   l'unica azione che toglie qualcosa. La striscia generica resta com'e'
   per tutto il resto (durate 300/250, altezza libera): una pillola e una
   striscia non sono la stessa cosa e non devono somigliarsi per forza. */
#toast.pillola .corpo{min-height:36px;padding:0 6px 0 14px;align-items:center}
#toast.pillola .detto{font:400 13px/1.3 Inter,sans-serif}
#toast.pillola{transition:opacity .25s var(--curva-esce),
                          transform .25s var(--curva-esce)}
#toast.pillola.qui{transition-duration:.1s;
  transition-timing-function:var(--curva-entra)}

/* ── IL COFANETTO VUOTO ───────────────────────────────────────────
   Mai una barra a zero (carta psicologica): un cofanetto senza pezzi non
   è un progresso a zero per cento, è un cofanetto pronto. Si vedono i
   vani con la loro fodera, e una riga dice cosa succede adesso — con la
   porta per andarci. */
#vuoto{margin-top:12px}
#vuoto[hidden]{display:none}
/* a cofanetto vuoto il cartellino dice una cosa sola: quello che succede
   adesso. La riga «Gli espositori di Regina, in scala vera» e la fila
   delle fodere restano per quando ci sarà qualcosa da vestire. */
/* e nemmeno «Il banco» in Bodoni 34 sopra: uno stato vuoto è UN titolo,
   un corpo secondario e un'azione (anatomia iOS del sistema). Due titoli
   di display incolonnati sono due voci che si contendono la stessa
   frase. */
/* `.riga2` è la riga che porta la materia E i dischetti delle fodere:
   da quando stanno insieme (16/09) si spegne la riga, non i due nodi. */
#cartello.vuoto .riga, #cartello.vuoto .riga2, #cartello.vuoto #sotto,
#cartello.vuoto #basso,
#cartello.vuoto #insieme, #cartello.vuoto #rail-sugg{display:none}
#cartello.vuoto #vuoto{margin-top:4px}
#vuoto b{display:block;font:400 22px/1.2 Bodoni,Didot,Georgia,serif;
  font-weight:400;color:var(--testo)}
#vuoto p{margin-top:6px;font:400 15px/1.45 Inter,sans-serif;
  color:var(--quieto)}
#vuoto button{margin-top:14px;height:50px;padding:0 26px;border:0;
  border-radius:var(--r-capsula);background:var(--accento);color:var(--accento-testo);
  cursor:pointer;font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;
  transition:transform var(--tocco) var(--curva-entra)}
#vuoto button:active{transform:scale(.97)}

/* ── IL CARTELLINO CHE ARRIVA COL PEZZO ───────────────────────────
   Ultimo atto della scena del pezzo che entra: 250 ms di dissolvenza,
   niente spostamento. Il nome e «Tuo da oggi» erano già lì un istante
   prima: quello che cambia è che adesso si leggono. */
/* la dedica non compare: si POSA. Duecentocinquanta millisecondi di
   dissolvenza sul posto, e nessuna striscia in basso — una conferma per
   una cosa che si sta guardando è una conferma di troppo (49 §7.9). */
@keyframes dedica-posa{from{opacity:0}to{opacity:1}}
#dedica.posa{animation:dedica-posa .25s var(--curva-entra) both}
@keyframes cartellino-nuovo{from{opacity:0}to{opacity:1}}
#cartello.nuovo{animation:cartellino-nuovo .25s var(--curva-entra) both}

/* ── E SE SI È CHIESTO MENO MOVIMENTO ────────────────────────────
   La giravolta della carta smette di essere una rotazione e diventa una
   DISSOLVENZA di 200 ms: è quello che il sistema prescrive («tessera che
   si gira → crossfade fronte→retro 250, nessuna rotazione»). Il blocco
   generale qui sopra porta ogni transizione a 120 ms; questo, che viene
   dopo e ha la stessa forza, rimette i 200 dove il sistema li vuole.
   Le due facce non possono più nascondersi con la faccia posteriore
   (non c'è più una faccia posteriore): si sovrappongono e si passano
   l'opacita', e il retro sta sopra quando è il suo turno. */
@media (prefers-reduced-motion: reduce){
  #foglio{transform:none !important;
    transition:height .15s linear !important}
  #foglio .faccia{backface-visibility:visible;
    -webkit-backface-visibility:visible;
    /* 200, non 250: il tetto del movimento ridotto e' 200 ms (SISTEMA-DESIGN
       regola 4, «dissolvenze 150-200») e il banco lo misura. */
    transition:opacity .2s linear !important}
  #foglio .retro{transform:none;opacity:0;z-index:1}
  #foglio.girata .retro{opacity:1;z-index:2}
  #foglio.girata .fronte{opacity:0}
  #rimuovi .foglio{transform:none;opacity:0;
    transition:opacity .15s linear !important}
  #rimuovi.qui .foglio{opacity:1}
  #voci.nastro button.stato{animation:none}
}

/* la lista della collezione, sul retro */
.coll{margin-top:16px;display:grid;gap:1px}
.coll .r{display:flex;align-items:center;gap:11px;padding:9px 0;
  border-bottom:1px solid rgba(255,240,215,.10)}
.coll .r img{width:40px;height:34px;object-fit:cover;background:#3A332B;flex:none}
/* UN PEZZO CHE NON HAI ANCORA NON HA UNA FOTOGRAFIA TUA. Al posto della
   foto stava un <img> senza sorgente: un rettangolo grigio pieno, che su
   tre righe su cinque si legge come immagine rotta e non come «questo
   manca». Un riquadro di filo, vuoto, dice la stessa cosa senza mentire. */
.coll .r .vuoto{width:40px;height:34px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,240,215,.16)}
.coll .r .n{flex:1;font:400 15px/1.15 Bodoni,Didot,Georgia,serif}
/* ── TRE STATI, TRE PAROLE ────────────────────────────────────────
   Erano due, e uno dei due mentiva. Un pezzo RICEVUTO IN REGALO — che
   ce l'hai, si vede nel cofanetto, lo indossi — portava la classe
   `manca`: nome sbiadito, stato in ambra, cioè disegnato esattamente
   come un pezzo che non hai. La regola vera è un'altra: ce l'hai, ma
   per la chiusura non conta. Sono due cose diverse e vogliono due segni
   diversi.
     · TUO — turchese, la firma: è tuo e conta.
     · RICEVUTO · NON CONTA — neutro: è tuo, non conta. Il nome resta
       pieno, perché il pezzo c'è.
     · DA PRENDERE · 31,00 € — ambra, e solo qui il nome sbiadisce:
       quello è l'unico che davvero manca.
   E LA PAROLA STA SU UNA RIGA, il seguito su un'altra. Scritte di fila
   con un punto in mezzo e lasciate andare a capo dove capita, uscivano
   «RICEVUTO · NON / CONTA» e «DA PRENDERE · 31,00 / €»: un euro da solo
   sulla seconda riga, fotografato. Sono DUE cose — lo stato e il suo
   seguito — e si impaginano come due cose: la parola in maiuscoletto col
   suo colore, il seguito sotto, più piccolo e neutro, tutti e due
   allineati a destra e nessuno dei due spezzabile. */
.coll .r .s{display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  flex:none;max-width:118px;text-align:right}
/* occhiello: 11/.12em (era 8 con .11em); e la data accanto sale a 11,
   che è il fondo della scala (era 9,5) */
.coll .r .s i{font:700 11px/1.2 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:#7FC0C4;font-style:normal;white-space:nowrap}
.coll .r .s em{font:400 11px/1.2 Inter,sans-serif;font-style:normal;
  /* #8A7E70 sul retro scuro faceva 3,6:1; #B3A795 è il grigio che il
     retro usa già per le note e ne fa 6,4 */
  color:#B3A795;white-space:nowrap;font-variant-numeric:lining-nums}
.coll .r.ricevuto .s i{color:#A79C8D}
.coll .r.manca .n{color:#B3A795}
.coll .r.manca .s i{color:#C8A24E}
.coll .r.manca .s em{color:#C8A24E}
.coll .r.chiude{border-bottom:0;margin-top:8px;padding-top:14px;
  border-top:1px solid rgba(255,240,215,.22)}
.coll .r.chiude .s i{color:#EDE7DF}
.promo{margin-top:14px;padding:12px 13px;background:rgba(16,96,104,.20);
  border-radius:8px;box-shadow:inset 0 0 0 1px rgba(127,192,196,.28)}
.promo div{font-size:12px;line-height:1.5;color:#DCEFF0}
.promo div + div{margin-top:6px}

/* IL CHIUDI È UN TONDO SULLA FOTO. Era una linguetta rettangolare
   incastrata nell'angolo: tagliava il raggio della carta proprio dove il
   raggio si deve vedere. */
#chiudi-carta{position:absolute;top:10px;right:10px;z-index:3;border:0;
  cursor:pointer;width:30px;height:30px;border-radius:50%;padding:0;
  background:rgba(250,248,245,.90);color:var(--testo);
  box-shadow:0 1px 4px rgba(0,0,0,.22);
  display:grid;place-items:center;font:400 15px/1 Inter,sans-serif;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
/* il tondo resta 30 — più grande diventerebbe una pastiglia sulla foto —
   e il bersaglio diventa 44 con sette punti di aria tutt'intorno, presi
   sul bordo della carta dove non c'è nient'altro da colpire */
#chiudi-carta::before{content:"";position:absolute;inset:-7px;border-radius:50%}
#chiudi-carta:active{transform:scale(.9);background:var(--cipria)}

/* ══════════════════════════════════════════════════════════════
   LA GALLERIA — quattro cose che non c'erano, e una che mentiva

   Com'era: una rotaia a scorrimento nativo su nero puro, i puntini in
   basso, e l'unica uscita una scritta CHIUDI in alto a destra, misurata
   a 9 punti dal bordo e larga 73,8x41 — cioè nell'angolo più lontano
   dal pollice di una mano che tiene il telefono. Il pizzico non c'era:
   quello che c'è è agganciato a #stanza (la scena in tre dimensioni) e
   qui sopra non arriva. Una fotografia di un gioiello che non si può
   ingrandire è l'unica cosa che si va a guardare in una galleria.

   Com'e': la fotografia si ingrandisce col pizzico e col doppio tocco, e
   da ingrandita si sposta col dito. Si esce trascinando in giu' — la
   foto segue il dito e il velo si schiarisce mentre scende, così si
   vede dove sta andando prima di lasciare — o con una X in basso al
   centro, dentro un bersaglio da 44, dove il pollice arriva senza
   cambiare presa. La didascalia sta SOTTO la foto invece che sopra, e il
   fondo non è più il nero puro: è #1C1813, lo stesso nero caldo del
   retro della carta, perché è lo stesso oggetto visto dall'altra
   parte.
   Lo scorrimento nativo se ne va: `touch-action:none` serve al pizzico,
   e con lo scorrimento nativo acceso il browser si prende il gesto e lo
   spostamento a foto ingrandita non si può più fare. La fila si muove
   allora con un trasformo, che è anche l'unico modo di farla scendere
   insieme al velo.
   ══════════════════════════════════════════════════════════════ */
#galleria{position:fixed;inset:0;z-index:8;
  background:rgba(28,24,19,var(--velo,1));
  display:flex;flex-direction:column;touch-action:none;overflow:hidden}
#galleria[hidden]{display:none}
/* `touch-action:none` sta sia sul contenitore sia sulla rotaia: il
   browser la legge sull'elemento che riceve il tocco, e il tocco cade
   sulla rotaia o su una sua figura — non sul contenitore */
#rotaia{flex:1;display:flex;min-height:0;touch-action:none;
  transform:translate3d(var(--scorri,0px), var(--giu,0px), 0)}
#rotaia.posa{transition:transform .34s cubic-bezier(.2,.7,.3,1)}
#rotaia figure{flex:0 0 100%;min-width:0;display:grid;
  grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:14px;
  padding:calc(18px + max(env(safe-area-inset-top), 8px)) 18px 6px}
#rotaia img{min-height:0;max-width:100%;max-height:100%;object-fit:contain;
  -webkit-user-drag:none;user-select:none;
  transform-origin:center center}
#rotaia img.posa{transition:transform .26s cubic-bezier(.2,.7,.3,1)}
/* LA DIDASCALIA STA SOTTO LA FOTO, e sta solo qui. Sulla carta il
   cartoncino non la porta: è una nota sul mestiere («lo scatto ritrae la
   collezione, non il solo pezzo») e va detta dove si sta guardando lo
   scatto, non dove si sta guardando il pezzo. */
/* etichetta: 13 (era 11,5) */
#rotaia figcaption{font-size:13px;line-height:1.45;color:#A59A8C;
  text-align:center;max-width:36em;
  transition:opacity var(--stato) linear}
#rotaia.grande figcaption{opacity:0}
#gal-fondo{flex:none;display:flex;flex-direction:column;align-items:center;gap:11px;
  padding:8px 0 calc(10px + max(env(safe-area-inset-bottom), 8px));
  transform:translateY(var(--giu,0px))}
#punti{display:flex;justify-content:center;gap:7px;pointer-events:none}
#punti i{width:5px;height:5px;border-radius:50%;background:rgba(255,240,215,.28);
  transition:background var(--stato) linear}
#punti i.qui{background:#EDE7DF}
/* L'USCITA STA IN BASSO AL CENTRO. Non è un gusto: è dove arriva il
   pollice di chi regge il telefono con una mano, e una galleria a
   schermo pieno si guarda con una mano. */
#chiudi-galleria{width:44px;height:44px;border-radius:50%;border:0;padding:0;
  cursor:pointer;background:rgba(255,240,215,.10);color:#EDE7DF;
  display:grid;place-items:center;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
#chiudi-galleria svg{width:15px;height:15px}
#chiudi-galleria svg path{stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;fill:none}
#chiudi-galleria:active{transform:scale(.9);background:rgba(255,240,215,.22)}

/* ══════════════════════════════════════════════════════════════
   IL RISCONTRO — una striscia in basso, e si può disfare

   Prima non c'era. «Rimuovi» non faceva niente, «copia il link» non
   faceva niente, e i due che qualcosa la facevano — girare la carta —
   la facevano in silenzio. Il verdetto di Massimo dice che zero
   conferme fanno sembrare un sito quello che dovrebbe essere
   un'applicazione, ed è esattamente quello che si vedeva.
   Ma una conferma non è una spunta animata in mezzo allo schermo: è
   una riga in basso che dice cosa è successo e — quando l'azione si
   può disfare — offre di disfarla. Sta sopra il menu, dura quattro o
   cinque secondi, si ferma se ci tieni il dito sopra (chi legge non
   deve rincorrere) e se ne va se lo si butta giu' col dito.
   `aria-live="polite"` perché chi non la vede la senta, e «polite» e
   non «assertive» perché non è un allarme: è un riscontro.
   ══════════════════════════════════════════════════════════════ */
/* LA PILLOLA STA SOPRA LA CAPSULA, NON ADDOSSO. Misurato: col menu
   diventato una capsula che galleggia a 770, la striscia a 58+safe
   finiva a 777 — sette punti DENTRO il vetro. L'altezza non si riscrive
   a mano: si chiede alla stessa `--menu-zona` che il velo di carta usa
   per sapere dove fermarsi, così le due misure non possono divergere. */
#toast{position:fixed;left:50%;z-index:9;pointer-events:none;
  bottom:var(--menu-zona);
  width:min(360px, calc(100vw - 28px));
  transform:translate(-50%, 16px);opacity:0;
  transition:opacity var(--esce) var(--curva-esce),
             transform var(--esce) var(--curva-esce)}
#toast.qui{opacity:1;transform:translate(-50%, var(--giu, 0px));pointer-events:auto;
  transition-duration:var(--entra);transition-timing-function:var(--curva-entra)}
#toast.tira{transition:none}
/* LA PILLOLA NON DIVENTA DI VETRO, ED È UNA DECISIONE, NON UNA
   DIMENTICANZA. La regola 5 del sistema di design la locka: «la
   conferma è UNA pillola 36 pt `--vano`/`--luce`, entra in 100 ms ed
   esce in 250». È l'unico pezzo di cromo che deve restare LEGGIBILE
   sopra qualunque cosa - una scena chiara, una carta, un velo scuro - e
   un materiale traslucido è esattamente cio' che non garantisce un
   fondo. Prende però la FORMA della famiglia: raggio pieno quando è
   una pillola, e sotto di se' `--ombra-2`, l'ombra dichiarata, invece
   di due ombre scritte a mano. */
#toast .corpo{display:flex;align-items:center;gap:12px;
  padding:12px 12px 12px 15px;border-radius:var(--r-card);
  background:var(--vano);color:var(--luce);
  box-shadow:var(--ombra-2), 0 18px 34px -16px rgba(0,0,0,.60)}
#toast.pillola .corpo{border-radius:var(--r-capsula)}
/* etichetta: 13 (era 12) */
#toast .detto{flex:1;min-width:0;font:400 13px/1.35 Inter,sans-serif}
/* IL DISFARE HA IL PESO DI UN COMANDO, non di un link. È l'unica cosa
   sulla striscia che si tocca: maiuscoletto, il turchese della firma, e
   il suo bersaglio da 44 preso con lo pseudo, che la pastiglia resta
   della misura del testo. */
#toast .disfa{position:relative;flex:none;border:0;cursor:pointer;
  padding:8px 12px;border-radius:var(--r-capsula);background:rgba(127,192,196,.14);
  /* occhiello: 11 (era 9,5) */
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:#7FC0C4;
  transition:transform var(--tocco) var(--curva-entra), background var(--tocco)}
#toast .disfa::before{content:"";position:absolute;inset:-9px -6px}
#toast .disfa:active{transform:scale(.94);background:rgba(127,192,196,.26)}
/* LA STRISCIA NON SI NASCONDE CON `hidden`, e non è pigrizia: `hidden`
   porta `display:none`, e un elemento in `display:none` esce
   dall'albero di accessibilita'. Un'area viva dichiarata lì dentro non
   viene osservata da nessun lettore di schermo — si annuncia solo cio'
   che CAMBIA dentro una regione già presente. Quindi la striscia sta
   sempre nel documento, vuota e trasparente, e quando arriva un testo
   quel testo è una modifica dentro una regione osservata. Il corpo, a
   opacita' zero, non prende tocchi e non ha figli raggiungibili col
   tabulatore: il tasto «annulla» viene creato con la striscia e tolto
   quando se ne va. */

/* ══════════════════════════════════════════════════════════════
   IL TELEFONO CORICATO — 844x390

   Misurato prima: alla carta lo schermo concede 338 punti e il contenuto
   ne vuole 489. Il nastro delle azioni cadeva a 385, cioè quarantasette
   punti SOTTO il bordo della carta, e niente diceva che ci fosse. Il
   verdetto di Massimo è che le opzioni si devono vedere subito: coricato
   non si vedevano affatto.
   Due strade c'erano: due colonne con la foto a sinistra, o la foto
   ridotta a una fascia. Le due colonne però non garantiscono niente —
   spostano il contenuto, non lo accorciano, e con una dedica lunga il
   nastro torna sotto la piega. Quella che TIENE IL NASTRO SEMPRE
   VISIBILE è un'altra: il nastro esce dallo scorrimento e si incolla in
   fondo alla carta, come fanno già i tasti sul retro. La foto intanto
   diventa una fascia da 96 punti — coricato un ritratto a 16:8 si prende
   la metà dell'altezza disponibile per dire quello che una fascia dice
   lo stesso — e il contenuto scorre sotto la fascia e sopra il nastro.
   ══════════════════════════════════════════════════════════════ */
@media (orientation: landscape) and (max-height: 520px){
  #carta-pezzo{padding:12px 16px}
  #porta{max-width:430px}
  #ritratto{aspect-ratio:auto;height:96px;object-position:center 42%}
  .riga-foto.senza-foto{aspect-ratio:auto;height:96px}
  #carta-dentro{padding:11px 16px 2px}
  #carta-dentro .nome{font-size:23px}
  #dedica{margin:11px 16px 12px;padding:11px 13px}
  #dedica p{font-size:22px;line-height:1.35}
  /* IL NASTRO SI INCOLLA IN FONDO. Va a tutta larghezza, se no il
     contenuto che scorre gli passerebbe di fianco; gli angoli in basso
     glieli taglia l'`overflow:hidden` della faccia, quindi il raggio
     della carta resta. */
  #voci.nastro{position:sticky;bottom:0;z-index:2;margin:12px 0 0;
    border-radius:0;box-shadow:0 -1px 0 var(--filo)}
  #voci.nastro button{padding:10px 4px 9px;gap:6px}
  #voci .segno{width:19px;height:19px}
  #foglio .fronte.senza-dedica .dentro-carta{padding-bottom:0}
}

/* ── «C'E' ALTRO SOTTO» ───────────────────────────────────────────
   Una colonna che scorre e non lo dice è una colonna che finisce lì:
   chi guarda non prova nemmeno. Un velo di carta in fondo, acceso solo
   quando c'è davvero qualcosa da raggiungere e spento quando si è
   arrivati in fondo, è il segno più piccolo che dice la cosa giusta —
   e sta SOTTO il nastro incollato, che ha lo strato sopra: così il velo
   si vede sfumare proprio dove il contenuto sparisce dietro i comandi. */
#foglio .piega{position:absolute;left:0;right:0;bottom:0;height:42px;
  pointer-events:none;z-index:1;opacity:0;
  transition:opacity var(--stato) linear;
  background:linear-gradient(to top, var(--carta) 18%, rgba(250,248,245,0))}
#foglio .retro .piega{background:linear-gradient(to top, #1C1813 18%, rgba(28,24,19,0))}
#foglio .faccia.scorre .piega{opacity:1}

/* ══════════════════════════════════════════════════════════════
   LA SCRIVANIA — quello che esiste solo dove c'è un puntatore

   Il pezzo è nato per un telefono e si vede: contato prima di questo
   blocco, zero regole sotto `@media (hover:hover)`, zero
   `:focus-visible`, e il cursore sulla stanza a `auto`. Su un portatile
   l'applicazione non diceva mai che cosa fosse toccabile, e chi naviga
   col tasto di tabulazione non vedeva mai DOVE si trovava.
   L'hover sta dentro la sua media query perché su un telefono «hover»
   vuol dire «l'ultima cosa che hai toccato resta accesa»: uno stato che
   non si spegne più finché non si tocca altrove.
   ══════════════════════════════════════════════════════════════ */
@media (hover:hover) and (pointer:fine){
  #menu button:hover{color:var(--testo)}
  #menu button:hover::before{left:36%;right:36%;opacity:.5}
  #dietro:hover{opacity:.72}
  #vesti button:hover{transform:scale(1.10)}
  #maniglia:hover span{background:var(--voce)}
  #tasto-insieme:hover{border-color:var(--firma);background:rgba(255,255,255,.8)}
  #chiudi-galleria:hover{background:rgba(255,240,215,.20)}
  #accanto .carta:hover{box-shadow:0 0 0 1px rgba(255,240,215,.30)}
  #insieme button:hover{background:#0C4C52}
  #retro-fondo button:hover{background:rgba(255,240,215,.18)}
  #ritratto:hover{opacity:.93}
  #chiudi-carta:hover{background:#fff}
}
/* L'ANELLO È IL TURCHESE DELLA FIRMA, e si vede solo a chi arriva con la
   tastiera: `:focus-visible` non scatta sul clic del mouse né sul tocco,
   quindi non c'è niente da nascondere a mano dopo. */
:focus-visible{outline:2px solid var(--firma);outline-offset:2px;border-radius:3px}
#galleria :focus-visible, #foglio .retro :focus-visible,
#accanto :focus-visible{outline-color:#7FC0C4}
/* ── E NON CINGE UN POZZO ─────────────────────────────────────────
   La regola qui sopra è globale, e va bene: si vede solo a chi arriva
   con la tastiera. Ma la carta del pezzo e la galleria portano il fuoco
   su un CONTENITORE — `.faccia` e `#galleria`, tutti e due con
   `tabindex="-1"` — per dire al lettore di schermo dove si è finiti.
   Il commento di `apriCarta` dava per scontato che un foglio con
   `tabindex="-1"` ricevesse il fuoco senza anello: non è vero quando
   la carta si apre con INVIO. Chrome eredita la modalita' tastiera
   dall'ultimo tocco, `:focus-visible` scatta anche sul pozzo, e la
   carta intera esce cinta di turchese — misurato, un contorno da 2
   punti attorno a tutti i 320x520 del foglio. Un contenitore che
   riceve il fuoco come pozzo non è un controllo, e un anello attorno a
   un intero pannello non dice niente a nessuno: si spegne LÌ, e resta
   su tutti i comandi veri che ci stanno dentro — il primo tabulatore
   accende ancora il tondo che chiude. */
#foglio .faccia:focus-visible, #galleria:focus-visible{outline:none}

/* ══════════════════════════════════════════════════════════════
   LE VARIANTI DI GUSTO — due decisioni aperte, e il loro guardaroba

   Qui non si sceglie: si COSTRUISCE il ventaglio. Due decisioni
   estetiche del Cofanetto sono aperte, e ognuna ha tre forme
   strutturalmente diverse — non tre tarature dello stesso disegno —
   montate tutte e tre dentro l'app, sul materiale vero, così Massimo
   sceglie guardando e non immaginando.
     · `?sugg=a|b|c`  — che FORMA hanno i suggerimenti (di serie: a)
     · `?carta=foto|finestra|due` — cosa APRE la carta (di serie: finestra)
   La variante si scrive su <html data-sugg/data-carta>, e tutto quello
   che segue è agganciato lì: cambiare l'attributo — che è quello che
   fa il globale `window.__sugg` — ricolora l'interfaccia senza
   ricaricare e senza che nessuno debba ricostruire un pezzo di DOM.
   ══════════════════════════════════════════════════════════════ */

/* ── 1a · LA RIGA IN ALTO ─────────────────────────────────────────
   Il pattern di settore, verificato su Cartier, Mejuri e Boucheron: i
   suggerimenti non stanno MAI accanto alla foto del prodotto. Qui la
   tesi è portata al limite — non stanno nemmeno in un pannello: sono
   una riga di testo nel cromo, sotto la barra «indietro», e la scena
   resta completamente libera. Costa una riga di undici punti e non
   toglie un pixel all'ambiente.
   IL VELO DI CARTA SI ALLUNGA. #alto è un gradiente che svanisce: una
   riga di testo che cade nella parte trasparente finisce sopra la
   stanza, e sul crema del bancone non si legge più. Con la riga
   accesa la carta piena arriva al 74 per cento dell'altezza della
   fascia, cioè sotto la riga, e la misura non dipende più da cosa c'è
   dietro. */
#riga-sugg{display:none}
:root[data-sugg="a"] #alto{flex-wrap:wrap;padding-bottom:26px;
  background:linear-gradient(to bottom, var(--carta) 80%,
             rgba(250,248,245,.82) 92%, transparent)}
:root[data-sugg="a"] #riga-sugg{display:flex;flex-wrap:wrap;
  align-items:center;gap:6px;width:100%;order:3;margin-top:10px;
  pointer-events:auto;
  /* occhiello: 11/.12em (era 9 con .06em). Questa è la riga dei
     suggerimenti in alto, cioè la variante (a) — quella DI SERIE: era
     il testo più piccolo di tutto il cromo, e adesso è la prima cosa
     che si legge sopra la scena. Va a capo per conto suo (`flex-wrap`),
     quindi non c'è niente che possa troncare. */
  font:700 11px/1.5 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--voce)}
:root[data-sugg="a"] #riga-sugg[hidden]{display:none}
/* I TRE COLORI DELLA RIGA LI HA DECISI LA MISURA, non il gusto.
   Prima: occhiello e prezzo a `--tenue`, che su questo velo di carta
   misura 3,22:1 — sotto la soglia che il progetto si è dato, e proprio
   sul prezzo, che è un dato. Adesso l'occhiello prende `--voce` (5,4),
   il nome `--testo` (che è anche il segno che quella parte si tocca) e
   il prezzo `--quieto` (5,5). Resta tenue solo il puntino di mezzo, che
   non è testo: è il segno che separa due voci, e infatti è nascosto a
   chi legge con lo schermo. */
#riga-sugg .eco{flex:none;align-self:center}
/* ── E ADESSO IL SUGGERIMENTO È UNA CAPSULA ─────────────────────
   Era testo toccabile: nessuna pastiglia, nessun contorno, e il fatto
   che si toccasse lo diceva solo il colore. In un'applicazione dove
   TUTTO cio' che si tocca è una capsula — la tab bar della scocca, il
   tasto «Elenco» sopra il banco, i chip della vetrina, e da adesso il
   menu delle famiglie — un comando senza forma è l'unico comando che
   bisogna indovinare.
   Resta senza vetro per la stessa ragione del tasto «suggerimenti»:
   sta dentro il velo di carta della testata, e lì dietro non c'è
   niente da sfocare. Forma sì, materiale no.
   Il bersaglio: la capsula è alta 30 e i sette che mancano li mette
   lo pseudo, sopra e sotto. */
/* L'ALPHA LA DECIDE LA MISURA. Al 62% del primitivo, il secondo chip —
   quello che va a capo e cade dove il velo della testata è già
   sfumato, cioè sulla stanza — misurava 4,01:1 sul fondo vero. Non si
   scurisce il testo (è `--testo`, e la regola dice di alzare il
   materiale, non di cambiare il colore): si porta il pieno all'88%, che
   è l'alpha «thick» del sistema. */
#riga-sugg button{position:relative;display:inline-flex;align-items:center;
  gap:6px;height:30px;padding:0 11px;cursor:pointer;
  background:rgba(255,255,255,.88);
  font:inherit;letter-spacing:inherit;color:var(--testo)}
#riga-sugg button::after{content:"";position:absolute;left:0;right:0;
  top:-7px;bottom:-7px}
#riga-sugg button em{font-style:normal;color:var(--quieto);
  font-variant-numeric:lining-nums}

/* ── 1b · LE CARTE VELATE, e il contrasto risolto sotto il testo ──
   Il `brightness(.34)` nel filtro risolveva la leggibilita' chiudendo
   di due stop TUTTA la carta: sul crema del bancone usciva un blocco
   scuro, e il verdetto è stato «due blocchi neri, bocciata».
   Qui il rimedio è locale: il filtro torna a essere solo un velo
   (sfocatura e desaturazione, niente esposizione), e sotto le TRE RIGHE
   DI TESTO — solo lì — si mette un letto scuro breve, che sfuma in
   quattordici punti dentro la fotografia. La carta resta un velo dove è
   fotografia, e le scritte hanno il loro fondo dove sono scritte.
   Il letto è all'80 per cento: misurato, anche col caso peggiore — un
   fondo bianco pieno dietro — l'occhiello resta sopra 4,5:1. */
:root[data-sugg="b"] #accanto .carta{
  backdrop-filter:blur(9px) saturate(.85);
  -webkit-backdrop-filter:blur(9px) saturate(.85)}
#accanto .carta .dice{position:relative;margin:0 -8px -8px;padding:6px 8px 8px;
  background:rgba(8,6,4,.80)}
#accanto.steso .carta .dice{margin:0 -7px -7px;padding:5px 7px 7px}
#accanto .carta .dice::before{content:"";position:absolute;left:0;right:0;
  bottom:100%;height:14px;pointer-events:none;
  background:linear-gradient(to top, rgba(8,6,4,.80), rgba(8,6,4,0))}

/* ── 1c · IL RAIL NELLA SCHEDA ────────────────────────────────────
   La forma che i cataloghi veri usano davvero: i pezzi che ci stanno
   insieme in fila SOTTO la scheda, non addosso al prodotto. La scena
   torna completamente pulita e i suggerimenti non sono più un
   sovrimpresso — sono contenuto della scheda, e ci restano anche a
   scheda ritirata, perché il rail sta fuori dal blocco che si chiude.
   La card è la stessa del Cofanetto: foto 4:5 sul fondo di carta,
   nome in Bodoni a 13, prezzo a 11. Niente riquadro bianco: la carta è
   già la pagina.
   E LA LISTA DENTRO LA SCHEDA NON SI RIPETE. «Con questo ci sta anche»
   e il rail sono lo stesso dato: qui il rail È quella lista, quindi
   l'occhiello e le righe escono e di #insieme resta solo il suo tasto. */
#rail-sugg{display:none}
:root[data-sugg="c"] #rail-sugg{display:flex;gap:10px;margin-top:12px;
  pointer-events:auto;overflow-x:auto;scrollbar-width:none}
:root[data-sugg="c"] #rail-sugg[hidden]{display:none}
#rail-sugg::-webkit-scrollbar{display:none}
#rail-sugg .card{flex:0 0 80px;border:0;padding:0;background:none;
  cursor:pointer;text-align:left;
  transition:transform var(--tocco) var(--curva-entra)}
#rail-sugg .card:active{transform:scale(.97)}
#rail-sugg .card img{display:block;width:100%;aspect-ratio:4/5;
  object-fit:cover;background:var(--cipria)}
#rail-sugg .card .vuota{display:block;width:100%;aspect-ratio:4/5;
  background:var(--cipria);box-shadow:inset 0 0 0 1px var(--filo)}
#rail-sugg .card .dati{display:block;min-width:0}
#rail-sugg .card .n{display:block;margin-top:9px;
  font:400 13px/1.15 Bodoni,Didot,Georgia,serif;color:var(--testo)}
#rail-sugg .card .p{display:block;margin-top:3px;
  font:400 11px/1 Inter,sans-serif;color:var(--quieto);
  font-variant-numeric:lining-nums}
:root[data-sugg="c"] #insieme .eco,
:root[data-sugg="c"] #insieme-righe{display:none}
:root[data-sugg="c"] #insieme{margin-top:6px;padding-top:0;border-top:0}

/* ── 2 · LA CARTA CON LA FINESTRA ─────────────────────────────────
   La fotografia esce e al suo posto resta un RITAGLIO: il velo e la
   faccia della carta hanno un buco (clip-path a regola pari-dispari,
   scavato dal codice sulla misura vera del riquadro), e dietro ci sta il
   pezzo in tre dimensioni, che continua a girare col dito.
   Tre conseguenze, tutte da qui:
     · il buco non prende i tocchi — il clip taglia anche il collaudo
       del puntatore — e sotto non ci deve essere nessun altro strato
       che li raccolga: #carta-pezzo diventa un telaio trasparente e il
       tocco lo prendono solo il velo (che chiude) e il foglio;
     · la fotografia non è più la porta della galleria. La porta
       scende sotto la finestra (#strisciafoto), fuori dal buco;
     · il tondo che chiude non può stare SULLA fotografia, perché lì
       non c'è più carta: la finestra si stacca dal bordo alto e si
       apre una fascia di carta dove il tondo ha di che appoggiarsi.
   Il filetto attorno al ritaglio è un `outline`, non un bordo: si
   disegna FUORI dalla scatola, cioè appena fuori dal buco, ed è
   l'unica cosa del riquadro che il clip non porta via. */
:root[data-carta="finestra"] .riga-foto,
:root[data-carta="due"] .riga-foto{margin:44px 12px 0;border-radius:8px;
  outline:1px solid var(--filo);outline-offset:0}
:root[data-carta="finestra"] #ritratto,
:root[data-carta="due"] #ritratto{border-radius:8px;visibility:hidden}
:root[data-carta="finestra"] .riga-foto .quante,
:root[data-carta="due"] .riga-foto .quante{display:none}
:root[data-carta="finestra"] .riga-foto.senza-foto,
:root[data-carta="due"] .riga-foto.senza-foto{border-bottom:0}
:root[data-carta="finestra"] #carta-pezzo,
:root[data-carta="due"] #carta-pezzo{pointer-events:none}
:root[data-carta="finestra"] #carta-pezzo .velo,
:root[data-carta="due"] #carta-pezzo .velo,
:root[data-carta="finestra"] #porta,
:root[data-carta="due"] #porta{pointer-events:auto}
/* girata, la finestra non esiste: il retro è pieno e deve coprire tutto.
   Si toglie il clip alla faccia, così anche a metà giravolta non si
   apre un buco in mezzo al cartoncino. */
#foglio.girata .fronte{clip-path:none !important}

/* `flex:none` non è un dettaglio: la colonna della carta è un flex, e
   un figlio senza questa riga si SCHIACCIA quando il contenuto supera
   l'altezza concessa. Misurato: la striscia delle miniature usciva alta
   quattordici punti invece di cinquantacinque, tagliata a metà dal nome
   del pezzo. Tutti gli altri figli della colonna ce l'hanno già. */
#strisciafoto{display:none;flex:none}
:root[data-carta="finestra"] #strisciafoto,
:root[data-carta="due"] #strisciafoto{display:flex;flex:none;
  margin:10px 12px 0}
:root[data-carta="finestra"] #strisciafoto[hidden],
:root[data-carta="due"] #strisciafoto[hidden]{display:none}
:root[data-carta="finestra"] #strisciafoto{justify-content:flex-end}
#strisciafoto .tutte{position:relative;border:0;background:none;cursor:pointer;
  /* occhiello: 11 (era 8,5) */
  padding:0 0 3px;font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--firma);
  border-bottom:1px solid var(--firma);
  transition:opacity var(--tocco) linear}
#strisciafoto .tutte::after{content:"";position:absolute;inset:-15px -12px}
#strisciafoto .tutte:active{opacity:.55}
:root[data-carta="due"] #strisciafoto{gap:7px;overflow-x:auto;
  scrollbar-width:none}
#strisciafoto::-webkit-scrollbar{display:none}
#strisciafoto .mini{flex:0 0 44px;border:0;padding:0;background:none;
  cursor:pointer;transition:transform var(--tocco) var(--curva-entra)}
#strisciafoto .mini img{display:block;width:44px;height:55px;object-fit:cover;
  border-radius:3px;background:var(--cipria);
  box-shadow:0 0 0 1px rgba(26,22,20,.10)}
#strisciafoto .mini:active{transform:scale(.94)}

/* ── CORICATO ─────────────────────────────────────────────────────
   Due cose cambiano forma, e per la stessa ragione: coricato lo schermo
   ha 390 punti di altezza e il cromo se ne prende già 195.
   · LA CARTA ha 366 punti in tutto: la fascia sopra la finestra si
     stringe e la striscia delle foto sta più vicina.
   · IL RAIL non può restare una card verticale. Misurato: con la foto
     4:5 in piedi il cartellino arrivava a 359 punti su 390 — il 92 per
     cento dello schermo per due suggerimenti, e dell'ambiente non
     restava niente. Coricata, la card si CORICA anche lei: la foto a
     sinistra, il nome e il prezzo a destra. Stesso rapporto 4:5, stessa
     tipografia, cinquantasei punti invece di centocinquantatre'. */
@media (orientation: landscape) and (max-height: 520px){
  :root[data-carta="finestra"] .riga-foto,
  :root[data-carta="due"] .riga-foto{margin:34px 12px 0}
  :root[data-sugg="c"] #rail-sugg{margin-top:9px;gap:14px}
  #rail-sugg .card{flex:0 0 auto;display:flex;align-items:center;gap:9px;
    max-width:210px}
  #rail-sugg .card img, #rail-sugg .card .vuota{width:38px;flex:none}
  #rail-sugg .card .dati{min-width:0}
  #rail-sugg .card .n{margin-top:0;font-size:12.5px}
  #rail-sugg .card .p{margin-top:2px;font-size:10.5px}
  :root[data-carta="finestra"] #strisciafoto,
  :root[data-carta="due"] #strisciafoto{margin:8px 12px 0}
  #strisciafoto .mini{flex:0 0 38px}
  #strisciafoto .mini img{width:38px;height:47px}
}
@media (hover:hover) and (pointer:fine){
  #riga-sugg button:hover{background:#fff}
  #rail-sugg .card:hover .n{color:var(--firma)}
  #strisciafoto .tutte:hover{opacity:.75}
}

/* ══════════════════════════════════════════════════════════════
   MOVIMENTO RIDOTTO

   Contate prima di questo blocco: zero occorrenze di
   `prefers-reduced-motion` in tutto il file. Chi ha chiesto meno
   movimento al sistema operativo — e lo chiede chi dal movimento sta
   male — riceveva l'applicazione intera: i voli di macchina, il dondolo
   del pezzo, l'inerzia, la carta che si gira su se stessa.
   Qui non si spegne tutto: si toglie lo SPOSTAMENTO e si tiene la
   DISSOLVENZA, che è quello che le linee guida chiedono. Ogni durata
   scende a 120 ms e nessuna cosa si muove più nello spazio: compare e
   sparisce. I voli e il dondolo li spegne il codice, non il foglio di
   stile — lì si muove una macchina, non un rettangolo.
   ══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.12s !important;
    animation-iteration-count:1 !important;
    animation-delay:0s !important;
    transition-duration:.12s !important;
    transition-delay:0s !important}
  #cartello.via, #dietro.via, #fondo.via{transform:none}
  #carta-pezzo.via #porta{transform:none}
  #galleria.via{transform:none}
  /* LA GIRAVOLTA DELLA CARTA RESTA. Toglierle la rotazione la
     romperebbe: il retro è nascosto dalla faccia posteriore, e senza il
     giro non comparirebbe mai. Le basta il tetto dei 120 ms qui sopra —
     0,62 s diventano 0,12, ed è un cambio di faccia, non un carosello. */
  /* la carta arriva senza alzarsi da terra */
  @keyframes porgi{from{opacity:0}to{opacity:1}}
  #menu button:active, #dietro:active, #vesti button:active{transform:none}
  /* la striscia del riscontro non si alza da sotto: compare e sparisce,
     e resta dove sta. Il `translate(-50%)` non è movimento — è come si
     centra un elemento — quindi resta. */
  #toast{transform:translate(-50%, 0)}
  #toast.qui{transform:translate(-50%, var(--giu, 0px))}
  /* e nella galleria non si posa niente con una molla: la fotografia
     cambia e basta. Lo spostamento sotto il dito resta, perché quello
     non è un'animazione: è il dito. */
  #rotaia.posa, #rotaia img.posa{transition:none}
  #chiudi-carta:active, #chiudi-galleria:active, #insieme button:active,
  #retro-fondo button:active, #tasto-insieme:active,
  #rail-sugg .card:active, #strisciafoto .mini:active{transform:none}
  /* la carta accanto tiene il suo `translate`: quello non è movimento,
     è come si centra un elemento su un punto dello spazio */
  #accanto .carta:active{transform:translate(-50%,-50%)}
  #maniglia:active span{transform:none}
  #fondo.apribile:not(.ritirato) #maniglia:active span{transform:scaleY(-1)}
  /* ── IL CROMO IN LINGUA DI VETRO, per chi ha chiesto meno movimento ──
     Le capsule non si comprimono: cambiano e basta (il tetto dei 120 ms
     qui sopra lo fa da solo). Quello che va spento a mano è cio' che
     non è una transizione: la compressione a scatto resta, ma il
     menu al livello 2 se ne va in dissolvenza SENZA scivolare, e la
     pista non scorre con l'animazione — `scroll-behavior` non è una
     transizione e il tetto non lo tocca. */
  .capsula:active, #voci.nastro button:active{transform:none}
  :root[data-liv="2"] #menu{transform:none}
  #menu .pista{scroll-behavior:auto}
}

/* ══════════════════════════════════════════════════════════════
   LO SCHERMO LARGO — la scena piena e il pannello a destra

   IL CRITERIO È DICHIARATO: `(min-width:900px)` OPPURE
   `(min-aspect-ratio:6/5)`, l'unione delle due. Serve l'unione perché i
   due casi non si contengono: il telefono CORICATO è largo di forma
   (844x390, proporzione 2,16) ma stretto di punti, e una finestra di
   desktop rimpicciolita (1000x900, proporzione 1,11) è larga di punti ma
   quasi quadrata. Tutti e due sono «schermi larghi» — c'è posto per una
   colonna accanto alla scena — e tutti e due devono prendere questo
   impianto. Sotto le due soglie non cambia NIENTE: il telefono verticale
   (390x844 → 0,46 e 390 punti) non entra qui dentro da nessuna delle due
   porte, ed è finito com'e'.

   MISURATO PRIMA DI QUESTO BLOCCO, a 1440x900 con un anello aperto:
   il cartellino era una fascia da 1440 punti con il nome a sinistra e il
   prezzo a 1.416 punti di distanza, il menu cinque parole da 9,5 px
   distribuite con 290 punti di vuoto in mezzo, il marchio 18 px in cima a
   1440, i dischetti della fodera all'estremita' opposta della loro riga, e
   la carta del pezzo un rettangolo da 330 punti sospeso in mezzo allo
   schermo. Non era un disegno per schermi larghi: era il telefono stirato.

   L'IMPIANTO È QUELLO DEI CONFIGURATORI DI SETTORE (Rolex, Serpenti; le
   schede prodotto di Boucheron e Cartier): scena piena, e una colonna
   sottile di carta a destra che porta tutto il testo e tutti i comandi.
   Non si costruisce un secondo pannello: si SPOSTA il cartellino. #fondo
   contiene già nome, prezzo, materiale, riga del gesto, fodera,
   suggerimenti nella forma scelta e «metti da parte» — cioè esattamente
   l'elenco che il pannello deve ospitare — e tutto il codice che ci
   scrive dentro continua a funzionare senza sapere dove sta.
   ══════════════════════════════════════════════════════════════ */
@media (min-width:900px), (min-aspect-ratio:6/5){

  /* 360 punti è la banda dei riferimenti (320-400). Sotto i 320 la riga
     di testo scende sotto i 45 caratteri e il nome in Bodoni va a capo
     due volte; sopra i 400 la colonna comincia a rubare scena. */
  /* il corpo del nome del pezzo è un TOKEN e non un numero nel codice:
     `adattaTitolo` scrive la misura in riga (una regola CSS non batte uno
     stile in riga) e deve poterla LEGGERE da qui, se no il coricato
     resterebbe a 42 px come il desktop — che è quello che succedeva. */
  :root{--pannello:360px; --barra:46px; --nome:42px}

  /* ── 1 · IL CARTELLINO DIVENTA IL PANNELLO ──────────────────── */
  #fondo{left:auto; right:0; top:0; bottom:0; width:var(--pannello);
         padding-top:calc(var(--barra) + 18px);
         pointer-events:auto; overflow-y:auto; overflow-x:hidden;
         overscroll-behavior:contain;
         /* di carta piena, non un gradiente: un velo che sfuma ha senso
            sopra la scena, non accanto. Il filetto e l'ombra sono quelli
            del sistema — il filo di #filo e l'ombra lunga e bassa che la
            carta del pezzo ha già. */
         background:var(--carta);
         border-left:1px solid var(--filo);
         box-shadow:-20px 0 48px -30px rgba(26,22,20,.42)}
  #cartello{padding:0 28px 26px}
  /* la maniglia non ha più niente da tirare: il pannello è alto quanto
     lo schermo e il contenuto ci sta tutto (e se non ci sta, scorre) */
  #maniglia, #fondo.apribile #maniglia{display:none}
  #fondo.ritirato{padding-top:calc(var(--barra) + 18px)}
  /* e il ritiro si disfa: `scheda(true)` continua a essere chiamato — è
     giusto che lo sia, è il telefono a decidere cosa nascondere — ma qui
     non c'è niente da nascondere. Si rimettono i valori di partenza a
     mano, uno per uno, perché da `max-height:0` non si torna con una
     parola sola. */
  #fondo.ritirato #sotto{opacity:1; max-height:96px; visibility:visible;
                         pointer-events:auto; margin-top:14px}
  #fondo.ritirato #insieme{opacity:1; max-height:320px; visibility:visible;
                           pointer-events:auto; margin-top:18px;
                           padding-top:14px; border-top-width:1px}

  /* ── 2 · LA TIPOGRAFIA DEL PANNELLO ─────────────────────────────
     Nome e prezzo non stanno più su una riga: in 304 punti di colonna
     `space-between` li spingerebbe ai due bordi con il nome a capo, che è
     lo stesso difetto di prima in piccolo. Si impilano, come nelle schede
     prodotto di riferimento. I corpi sono quelli chiesti: Bodoni 42 per il
     nome (il rapporto col corpo del testo resta 3,0, dentro la banda
     2,6-3,7 delle maison), Inter 14 per il materiale, 20 per il prezzo,
     10 in maiuscoletto per gli occhielli. */
  #cartello .riga{display:block}
  #cartello b{font-size:42px; line-height:1.02; display:block}
  #cartello .prezzo{display:block; margin-top:12px;
                    font-size:20px; color:var(--testo)}
  /* la misura di riga: 60 caratteri è il tetto dei riferimenti, e a 14 px
     una colonna da 304 punti ne tiene 44 — il tetto non tocca mai, ed è
     scritto perché regga anche il pannello da 400 a 1920. */
  #cartello p{margin-top:14px; font-size:14px; line-height:1.55;
              max-width:60ch}
  #cartello .gesto{margin-top:2px; font-size:13px; max-height:40px;
                   align-items:flex-start}
  #cartello .gesto svg{margin-top:2px}
  #insieme .eco{font-size:11px}   /* il fondo della scala, non 10 */
  #insieme .r b{font-size:18px}
  #insieme button{padding:0 16px; font-size:11px}

  /* ── 3 · LA FODERA E LA SUA DIDASCALIA, ACCANTO ──────────────────
     I quattro dischetti stavano a `align-self:flex-end`: su 1440 punti
     finivano all'angolo opposto della riga che li spiega, e un comando
     senza nome accanto è una decorazione. Nel pannello tornano a
     sinistra e si portano dietro l'etichetta — che il tag `aria-label`
     già diceva a chi ascolta e nessuno diceva a chi guarda. */
  /* nel pannello la riga della materia torna una COLONNA: 304 punti di
     larghezza sono una misura di lettura, non una riga di comandi, e
     l'etichetta «La fodera» qui sotto vuole il suo posto. */
  .riga2{display:block; margin-top:0}
  .riga2 #sotto{margin-top:14px}
  #basso{gap:14px}
  #vesti{align-self:flex-start; align-items:center; margin-top:14px}
  #vesti::before{content:"La fodera"; font:700 11px/1 Inter,sans-serif;
                 letter-spacing:.12em; text-transform:uppercase;
                 color:var(--quieto); margin-right:4px}
  #tasto-insieme{align-self:flex-start}

  /* ── 4 · LA BARRA IN ALTO: i reparti a sinistra, il marchio a destra ──
     La riga delle famiglie sta SULLA SCENA, non nel pannello. Il pannello
     è il PEZZO — cambia con quello che si guarda — mentre i reparti non
     cambiano mai: metterli insieme renderebbe ambigua l'unica cosa che il
     pannello deve dire. È anche la posizione dei configuratori citati.
     Il marchio non è più centrato sul viewport (lì cadrebbe a cavallo
     del pannello): sta all'estremita' della scena, come l'insegna sopra
     la vetrina, e i reparti gli stanno a sinistra. */
  /* LE TRE COSE DELLA BARRA SI CENTRANO SULLA STESSA RIGA. Prima erano
     appese in alto con tre `margin-top:15px` uguali, che andava bene
     finché il menu era una riga di parole alta 40. Adesso il menu è
     una capsula alta 52 e tre margini uguali la lascerebbero sfalsata
     rispetto al marchio: si centra la fascia, e i margini spariscono.
     La fascia cresce di sei punti (24 -> 30) per far stare la capsula
     con la sua aria; `--barra` non si tocca, perché la usa anche il
     pannello per sapere dove comincia. */
  #alto{right:var(--pannello); height:calc(var(--barra) + 30px);
        align-items:center; padding:0 20px; gap:18px; z-index:5;
        background:linear-gradient(to bottom, var(--carta) 30%,
                   rgba(250,248,245,.62) 66%, transparent)}
  /* `flex:none` non è un dettaglio: in una riga flessibile l'immagine si
     lascia stringere, e misurato il marchio usciva schiacciato nell'angolo
     invece che alto 16 punti. */
  #alto img{position:static; top:auto; transform:none; margin-left:auto; flex:none;
            height:16px; margin-top:0}
  #dietro{flex:none; margin-top:0}
  /* LA CAPSULA STA SULLA SCENA ANCHE QUI, ma più bassa: in cima non c'è
     il pollice, c'è il puntatore, e 52 punti bastano a tenere il
     bersaglio da 44 dentro un'imbottitura da 4.
     E QUI IL MENU NON SI COMPRIME E NON SE NE VA. In fondo a un telefono
     è il cromo che ruba schermo all'ambiente; qui sta in cima, sulla
     scena, ed è navigazione permanente accanto a un pannello che parla
     del PEZZO: sparire al livello 2 vorrebbe dire togliere i reparti
     proprio mentre si guarda una cosa e si potrebbe volerne un'altra. */
  #menu{flex:0 0 auto; width:max-content; max-width:calc(100% - 40px);
        margin:0; height:52px; padding:4px}
  #menu .pista{height:44px; gap:3px}
  #menu button{padding:0 14px 0 11px; font-size:11px; letter-spacing:.1em}
  :root[data-liv="2"] #menu{opacity:1; transform:none; pointer-events:auto}
  :root[data-liv="1"] #menu button:not(.qui) .nm,
  :root[data-liv="2"] #menu button:not(.qui) .nm{max-width:11em; opacity:1; margin-left:0}
  :root[data-liv="1"] #menu button:not(.qui),
  :root[data-liv="2"] #menu button:not(.qui){padding:0 14px 0 11px}
  /* e il velo del cartellino torna intero: qui sotto non c'è più
     nessuna capsula da lasciar galleggiare */
  #fondo::before{bottom:0}
  /* variante (a): la riga dei suggerimenti esce dalla testata — che qui è
     alta 46 punti e non ha posto per una seconda riga — e il codice la
     porta nel pannello. Qui si rimette a posto la fascia. */
  :root[data-sugg="a"] #alto{flex-wrap:nowrap; padding:0 20px;
    background:linear-gradient(to bottom, var(--carta) 34%,
               rgba(250,248,245,.70) 72%, transparent)}
  :root[data-sugg="a"] #riga-sugg{order:0; margin-top:16px}
  /* variante (c): il rail è già dentro il cartellino, quindi è già nel
     pannello. Prende solo un po' più d'aria. */
  #rail-sugg .card{flex:0 0 92px}

  /* ── 5 · LA CARTA DEL PEZZO SI AGGANCIA NEL PANNELLO ─────────────
     Non galleggia più al centro: OCCUPA il pannello. È la stessa mossa
     delle schede prodotto 60/40 — la scena resta intera a sinistra, la
     scheda prende la colonna — e risolve da sola i 330 punti sospesi in
     mezzo a 1440. Il velo sparisce: non c'è più niente da scostare,
     perché la carta non copre la scena. Il retro si gira nello stesso
     posto, perché il posto è il foglio, non lo schermo. */
  #carta-pezzo{left:auto; right:0; width:var(--pannello); padding:0;
               place-items:stretch}
  #carta-pezzo .velo{display:none}
  #porta{max-width:none; width:100%; height:100%; perspective:1600px}
  /* l'altezza la scrive `misuraCarta` in riga, e in riga vince: qui la
     carta non si misura sul contenuto, riempie la colonna. È l'unico
     `!important` del blocco, e c'è scritto perché. */
  #foglio{height:100% !important}
  /* piatta contro il pannello: il raggio e le due ombre servivano a
     staccarla dal velo, e il velo non c'è più. Il filetto di sinistra lo
     porta già il pannello. */
  #foglio .faccia{border-radius:0;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,
               -1px 0 0 0 var(--filo)}
  #chiudi-carta{top:12px; right:12px}
  /* ── E LA CARTA È IL PANNELLO, quindi ne porta la scala ─────────
     Aperta, la carta COPRE il pannello: se il nome del pezzo restasse a
     27 px mentre il pannello lo scrive a 42, la stessa colonna cambierebbe
     scala tipografica a seconda che la carta sia aperta o chiusa — e per
     chi guarda è la stessa cosa, letta due volte in due modi. I corpi
     sono quelli della regola: Bodoni 40 per il nome, Inter 14 per il
     materiale, 20 per il prezzo, 10 in maiuscoletto per gli occhielli.
     La misura di riga resta sotto i 60 caratteri: 328 punti a 14 px ne
     tengono 47. */
  #carta-dentro{padding:20px 24px 2px}
  #carta-dentro .nome{font-size:40px}
  #carta-dentro .mat{margin-top:8px; font-size:14px; max-width:60ch}
  #carta-dentro .prezzo{margin-top:12px; font-size:20px}
  #carta-dentro .dati{margin-top:16px; padding-top:14px; font-size:13px}
  #carta-dentro .stato{font-size:11px}
  #dedica{margin:18px 24px 20px; padding:16px 18px}
  #dedica .eco{font-size:11px}
  #voci.nastro{margin:18px 24px 0}
  #retro-titolo{font-size:32px}
  #retro-sotto{font-size:13px}
  #foglio .retro .dentro-carta{padding:26px 24px}

  /* ── 6 · LA FINESTRA DELLA CARTA NON SERVE PIÙ ──────────────────
     La variante `carta=finestra` scava un buco nel cartoncino per far
     vedere il pezzo vero: su un telefono è l'unico modo, perché la carta
     copre tutto lo schermo. Qui la scena è GIÀ accanto — il pezzo si
     vede e continua a girare col dito a due dita di distanza — e un buco
     nella colonna mostrerebbe il pannello, non la stanza. Quindi in
     desktop la carta si riprende la sua fotografia e il riquadro lo fa la
     macchina, sulla scena a sinistra (il codice spegne il ritaglio). */
  :root[data-carta="finestra"] #ritratto,
  :root[data-carta="due"] #ritratto{visibility:visible}
  :root[data-carta="finestra"] .riga-foto,
  :root[data-carta="due"] .riga-foto{margin:0; border-radius:0; outline:0}
  :root[data-carta="finestra"] .riga-foto .quante,
  :root[data-carta="due"] .riga-foto .quante{display:block}
  :root[data-carta="finestra"] .riga-foto.senza-foto,
  :root[data-carta="due"] .riga-foto.senza-foto{border-bottom:1px solid var(--filo)}
  :root[data-carta="finestra"] #carta-pezzo,
  :root[data-carta="due"] #carta-pezzo{pointer-events:auto}
  :root[data-carta="finestra"] #strisciafoto{justify-content:flex-start}
}

/* A 1920 la colonna sale a 400 — il tetto della banda dei riferimenti —
   perché lì 360 punti su 1920 cominciano a sembrare un ritaglio. */
@media (min-width:1800px){ :root{--pannello:400px} }

/* IL TELEFONO CORICATO È UNO SCHERMO LARGO, ma da 390 punti di altezza:
   la colonna scende a 300 (sotto il minimo dei riferimenti, ma lì il
   riferimento è un desktop) e la barra si assottiglia, perché ogni punto

@media (min-aspect-ratio:6/5) and (max-height:560px){

  #fondo.ritirato #insieme{margin-top:11px; padding-top:9px}
  #insieme .r{padding:2px 0}
  #insieme .r b{font-size:15px}
  #insieme button{margin-top:8px; height:46px; padding:0 14px}
  #fondo{padding-top:calc(var(--barra) + 12px)}
  #fondo.ritirato{padding-top:calc(var(--barra) + 12px)}
  #alto{height:calc(var(--barra) + 18px); padding:0 14px}
  #alto img{height:14px; margin-top:11px}
  #dietro{margin-top:11px}
  /* coricato lo schermo è largo ma alto 390: ogni punto tolto in cima è
     un punto che la scena non ha. La capsula scende a 44 e i chip a 36 —
     sotto il bersaglio da 44, ma qui il dito non arriva mai in cima allo
     schermo in orizzontale: è la stessa forbice che il file si è già
     preso sui dischetti della fodera, dove l'area la allarga uno pseudo. */
  #alto{height:calc(var(--barra) + 20px)}
  #alto img{height:14px; margin-top:0}
  #dietro{margin-top:0}
  #menu{height:44px; padding:4px}
  #menu .pista{height:36px; gap:3px}
  #menu button{height:36px; min-width:36px; padding:0 12px 0 9px}
  #menu button::after{content:""; position:absolute; left:0; right:0; top:-4px; bottom:-4px}
  #menu button{position:relative}
  /* e la carta, che qui è il pannello, scende con lui: 40 px di Bodoni in

  #carta-dentro{padding:14px 18px 2px}
  #carta-dentro .nome{font-size:30px}
  #carta-dentro .mat{margin-top:6px; font-size:13px}
  #carta-dentro .prezzo{margin-top:9px; font-size:17px}
  #carta-dentro .dati{margin-top:12px; padding-top:10px; font-size:13px}
  #dedica{margin:12px 18px 14px; padding:12px 14px}
  #voci.nastro{margin:12px 18px 0}
  #retro-titolo{font-size:26px}
  #foglio .retro .dentro-carta{padding:18px 18px}
}

const q = new URLSearchParams(location.search);

/* ══════════════════════════════════════════════════════════════
   LE VARIANTI DI GUSTO — due decisioni aperte, tre forme ciascuna

   Il canone di Massimo dice che il gusto sta a MONTE: ogni decisione
   estetica nuova è un ventaglio di almeno tre opzioni
   strutturalmente diverse, costruite sul materiale vero, e la sceglie
   lui PRIMA del volume. Qui le decisioni aperte sono due, e le forme
   stanno tutte dentro l'app, finite e collaudate:

     · `?sugg=a|b|c` — CHE FORMA HANNO I SUGGERIMENTI
       a · una riga di testo nel cromo, in alto, fuori dalla scena;
       b · le carte velate agganciate al pezzo (quella di oggi), col
           contrasto risolto da un letto scuro sotto il solo testo;
       c · un rail di card 4:5 dentro la scheda, sotto il nome.
       DI SERIE È (a), la riga in alto. Il ventaglio è stato guardato e
       la scelta è chiusa: i suggerimenti non stanno ACCANTO alla merce.
       È il modo delle maison - la scena del pezzo resta pulita, una cosa
       sola in campo, e il «con questo ci sta anche» vive nel cromo, in
       alto, dove sta la navigazione e non la vetrina. Le carte velate (b)
       mettevano due cartoncini da 104 punti su uno schermo da 390, cioè
       più di metà schermo davanti alla cosa che si è aperti per
       guardare; il rail (c) le porta dentro la scheda e chiude la banda
       da 623 punti a 378, cioè costringe il gioiello in un terzo di
       schermo. (b) e (c) restano selezionabili, e sono ancora finite.

     · `?carta=foto|finestra|due` — COSA APRE LA CARTA DEL PEZZO
       foto     · la fotografia, com'e' oggi;
       finestra · un ritaglio trasparente con dietro il pezzo VERO,
                  che continua a girare col dito dentro la finestra;
       due      · la finestra più la striscia delle foto vere sotto.
       DI SERIE È (finestra). Una carta con una FOTOGRAFIA dentro ce
       l'hanno tutti, e Regina per giunta le fotografie non le ha - sono
       tre packshot su ventidue posti. La finestra invece scava il
       cartoncino e dietro ci mette il pezzo VERO, che continua a girare
       col dito dentro il buco: è l'unica cosa che nessun'altra app di
       gioielleria fa, ed è gratis - il modello è già in scena, a
       fuoco, illuminato. (foto) e (due) restano selezionabili.

   I due valori si leggono dall'indirizzo all'avvio e si cambiano al
   volo dai globali `window.__sugg` / `window.__carta`: sono proprietà
   con un accessore, non variabili, così scriverci dentro RIAPPLICA la
   variante — non serve ricaricare e non serve chiamare niente a mano.
   Stessa forma di `window.__moto`, che è la decisione già aperta sul
   rilascio del gesto.
   ══════════════════════════════════════════════════════════════ */
/* i nomi portano il prefisso V_ perché `CARTA` in questo file è già
   il colore della carta (0xFAF8F5), e due `const` con lo stesso nome nel
   modulo non sono un'ombra: sono un errore che uccide il file intero */
const V_SUGG = ["a", "b", "c"], SUGG_DI_SERIE = "a";
const V_CARTA = ["foto", "finestra", "due"], CARTA_DI_SERIE = "finestra";
const scegli = (nome, elenco, serie) => {
  const v = (q.get(nome) || "").toLowerCase();
  return elenco.indexOf(v) >= 0 ? v : serie;
};
let sugg = scegli("sugg", V_SUGG, SUGG_DI_SERIE);
let carta = scegli("carta", V_CARTA, CARTA_DI_SERIE);
document.documentElement.dataset.sugg = sugg;
document.documentElement.dataset.carta = carta;
/* l'accessore è su `window`, non un `let` esportato: da una sonda o
   dalla console si scrive `window.__sugg = "c"` e l'interfaccia cambia
   sotto gli occhi. Un valore fuori elenco viene ignorato in silenzio —
   è un banco di prova, non deve poter rompere l'app. */
Object.defineProperty(window, "__sugg", {
  get: () => sugg,
  set: v => { v = String(v).toLowerCase();
              if(V_SUGG.indexOf(v) < 0 || v === sugg) return;
              sugg = v; applicaSugg(); }
});
Object.defineProperty(window, "__carta", {
  get: () => carta,
  set: v => { v = String(v).toLowerCase();
              if(V_CARTA.indexOf(v) < 0 || v === carta) return;
              carta = v; applicaCarta(); }
});

       posizione.
     · la RIGA dei suggerimenti (variante a) vive dentro la testata, che
       qui è alta 46 punti e ospita una riga sola. Va nel pannello, sotto
       il nome del pezzo, dove il suo occhiello ha senso.
   Il ritorno è esatto: ogni nodo torna al posto che aveva nel documento,
   così rimpicciolire la finestra rimette il telefono com'era. */
function sistemaImpianto(){
  /* `menu` non si può nominare da qui: più sotto nel modulo c'è un
     `const menu`, e fino a quella riga il nome è in zona morta — la
     scorciatoia globale dell'id non salva, la dichiarazione la copre
     comunque. Si chiede al documento, che risponde sempre. */
  const nav = document.getElementById("menu");
  if(larga){
    if(nav.parentNode !== alto) alto.insertBefore(nav, document.getElementById("marchio"));
    const rs = document.getElementById("riga-sugg");
    if(rs.parentNode !== cartello) cartello.insertBefore(rs, document.getElementById("rail-sugg"));
  } else {
    if(nav.parentNode !== fondo) fondo.appendChild(nav);
    const rs = document.getElementById("riga-sugg");
    if(rs.parentNode !== alto) alto.appendChild(rs);
  }
}

/* ── QUANTO SCHERMO VEDE LA SCENA ─────────────────────────────
   Largo: da zero al bordo del pannello, dal filo della barra al fondo. I
   due limiti si MISURANO sui nodi veri invece di ripetere qui i 360 e i 46
   punti del foglio di stile - a 1920 il pannello ne vale 400 e coricato
   300, e un numero scritto due volte è un numero che divergera'.
   Stretto: la stessa domanda, sugli stessi nodi. Diceva «tutto lo
   schermo», e non è vero: in cima c'è la testata col marchio, in fondo
   la scheda, e in mezzo resta una BANDA. Misurato a 390x844, col pezzo
   aperto e la scheda ritirata la banda va da 49 a 677 - 628 punti su 844
   - e scende a 378 con la variante (c) dei suggerimenti e la scheda
   tirata su. Prendere la finestra intera al posto della banda è
   esattamente il motivo per cui il soggetto finiva schiacciato in alto
   con mezzo schermo di crema vuota sotto: si centrava su un rettangolo di
   cui un quarto non si vede.
   IL FONDO DELLA TESTATA NON È `#alto.bottom`. Quel rettangolo si porta
   dietro i 30 punti di coda TRASPARENTE del gradiente - il suo
   `padding-bottom` - e contarli chiuderebbe la banda dove non c'è ancora
   niente da coprire. Tolta la coda restano i 44 punti che questo file
   aveva scritti a mano dentro `scartoVero`; la differenza è che adesso
   seguono la tacca del telefono invece di ignorarla.
   LA CIMA DELLA SCHEDA è `#cartello.top`, non `#fondo.top`: sopra il
   cartellino, #fondo ha solo i suoi 38-52 punti di gradiente che sfumano
   nel niente. E si misura NELLO STATO IN CUI SIAMO - per questo qui
   dentro non c'è nessun numero: la banda è diversa fra sugg=a/b/c e fra
   scheda ritirata e aperta, e chi la chiede la vuole adesso. */
/* la coda del gradiente non cambia durante una sessione, ma
   `getComputedStyle` costa uno svuotamento dello stile - e `areaUtile` la
   chiedono anche le carte in scena, un fotogramma alla volta. Si legge
   una volta sola; il ridimensionamento la butta via, perché dipende
   dalla tacca e la tacca coricando il telefono cambia lato. */
let codaAlto = null;
/* ── LA BANDA SI FERMA QUANDO LA MACCHINA PARTE ──────────────────
   Il cartellino non cambia forma di scatto: `#fondo` transisce il suo
   padding in 0,18 s e il blocco dei suggerimenti si ritira in 0,22 s.
   Misurato al tocco di un pezzo (telefono 390): la banda finisce a 672,
   subito dopo il tocco vale 652 e torna a 677 nel mezzo secondo dopo —
   il suo CENTRO si sposta di dodici punti, e l'inquadratura del pezzo,
   che si rifaceva a ogni fotogramma, lo inseguiva. È uno dei due
   secondi movimenti che il cliente vedeva: il gioiello si ferma, e poi
   si sposta ancora.
   Un volo si decide PRIMA di partire. Entrando nel pezzo la banda si
   ferma sul valore che aveva al tocco e resta quella per tutta la
   permanenza. Costa 5 punti di bordo contro la banda finale — 2,5 sul
   centro, cioè lo 0,4 per cento dell'altezza della banda, dove _I5
   concede il 2 — e li costa FERMI, che è tutta la differenza. La si
   rilegge solo quando cambia per davvero: la scheda che si apre, lo
   schermo che si ridimensiona. */
let bandaPezzo = null;
/* ── E NEMMENO L'ALTRA BANDA SI RIMISURA A OGNI FOTOGRAMMA ──────
   `bandaPezzo` congela la misura al livello del pezzo. Al banco e in
   selezione no, e lì la misura la chiede `scostaDiLato` — che passa da
   `applicaPos`, cioè da OGNI pointermove. Contato col banco _F_ durante
   uno swipe: 180 `getBoundingClientRect` in 89 fotogrammi, due per
   fotogramma, e ognuna su un telefono è una sincronizzazione di stile e
   layout — il browser deve impaginare la pagina prima di poter
   rispondere, in mezzo al gesto.
   La misura non cambia per conto suo: cambia quando cambia l'altezza di
   uno dei nodi che la fanno (la testata, il cartellino, il pannello, la
   barra dei reparti) o quando cambia lo schermo. Allora la si tiene, e la
   si butta via quando quei nodi si muovono davvero — lo dice un
   `ResizeObserver`, che costa zero per fotogramma perché parla solo
   quando c'è qualcosa da dire. */
let areaCache = null;
function scadeArea(){ areaCache = null; }
function areaUtile(){ return bandaPezzo || misuraArea(); }
function misuraArea(){
  if(areaCache) return areaCache;
  if(larga){
    const p = fondo.getBoundingClientRect();
    const m = document.getElementById("menu").getBoundingClientRect();
    return (areaCache = {x0:0, y0:Math.max(0, m.bottom + 8),
            x1:Math.max(120, p.left), y1:innerHeight});
  }
  const ra = alto.getBoundingClientRect();
  if(codaAlto === null)
    codaAlto = parseFloat(getComputedStyle(alto).paddingBottom) || 0;
  const cima = Math.max(0, ra.bottom - codaAlto);
  const giu = cartello.getBoundingClientRect().top;
  /* UNA BANDA NON PUÒ ESSERE PIÙ CORTA DI UN QUARTO DI SCHERMO. Fra la
     riscrittura del nome e il quadro dopo, il cartellino per un istante
     può essere impaginato a un'altezza che non è ancora la sua: senza
     questo pavimento il rapporto schizzerebbe e la macchina si butterebbe
     fuori dal mondo per un fotogramma. */
  /* `giuCartello` è il filo del cartellino PRIMA del pavimento del quarto
     di schermo: serve alle carte-suggerimento, che fin qui se lo andavano
     a rileggere da sole — una terza sincronizzazione di layout per
     fotogramma. Sta qui perché è la stessa misura, presa una volta. */
  return (areaCache = {x0:0, y0:cima, x1:innerWidth, giuCartello:giu,
          y1:Math.max(cima + innerHeight * 0.25, Math.min(innerHeight, giu))});
}
/* QUANDO LA MISURA SCADE. Non a tempo e non «per sicurezza»: quando uno
   dei quattro nodi che la compongono cambia forma, e quando finisce una
   transizione o un'animazione dentro il pannello — lì il cartellino si
   SPOSTA senza cambiare misura, e un osservatore di dimensioni non se ne
   accorgerebbe. */
if(window.ResizeObserver){
  const occhi = new ResizeObserver(scadeArea);
  for(const n of [alto, cartello, fondo, document.getElementById("menu")])
    if(n) occhi.observe(n);
}
for(const t of ["transitionend", "animationend"]){
  fondo.addEventListener(t, scadeArea);
  alto.addEventListener(t, scadeArea);
}
sistemaImpianto();

/* ── LA MACCHINA MIRA DI LATO ─────────────────────────────────────
   Il pannello toglie 360 punti alla destra della finestra, ma la tela resta
   larga quanto lo schermo — e deve restare: rimpicciolire il canvas
   vorrebbe dire tagliare la stanza, e il fondo sfocato dietro il pannello
   è quello che gli da' la profondita'. Quindi il soggetto non va messo al
   centro della TELA, va messo al centro di quello che si vede.
   Si sposta la macchina lungo il suo asse trasversale — non lungo X del
   mondo: sul pezzo la macchina gira attorno al gioiello, e a mezzo giro
   «destra» non è più X. Il vettore è (cos giro, 0, -sin giro), che è
   la normalizzata di (avanti × su).
   Quanto: il centro visibile sta `(x0+x1)/2` e il centro della tela
   `innerWidth/2`; la differenza in punti, divisa per mezza larghezza di
   schermo, moltiplicata per mezza larghezza di campo sul piano del
   bersaglio. Spostando OCCHIO e MIRA della stessa quantita' la macchina
   trasla parallela a se' stessa: il soggetto scorre sullo schermo di
   esattamente quei punti, senza che l'inquadratura giri di un grado. */
const _fianco = new THREE.Vector3();
function scostaDiLato(d, giro){
  const a = areaUtile();
  const dxPx = (a.x0 + a.x1) / 2 - innerWidth / 2;
  if(!dxPx) return null;
  const mezzaLarga = d * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  const s = -(2 * dxPx / innerWidth) * mezzaLarga;
  return _fianco.set(Math.cos(giro || 0) * s, 0, -Math.sin(giro || 0) * s);
}

/* ═══════════════════════════════════════════════════════════════
   IL CARICAMENTO A TAPPE — gli attrezzi, che servono subito.
   Il banco non arriva tutto insieme perché non si guarda tutto
   insieme: si guarda UNA famiglia, e le altre stanno di lato. Qui
   stanno i due attrezzi che la stanza e il banco useranno trecento
   righe più sotto: `scarica`, che conta i byte mentre entrano, e
   `tessuto`, che ne fa una texture senza far diventare asincrono tutto
   il resto del file. Il caricatore vero e proprio — chi scende per
   primo, chi dietro, cosa succede se non arriva — sta più avanti,
   dove ci sono le famiglie.
   ═══════════════════════════════════════════════════════════════ */
/* IL TIMBRO. Lo riscrive impacchetta.py al momento del pacco, e chi
   pubblica lo copia nel telaio index.html: è l'unica cosa che fa
   arrivare una correzione a chi ha già la pagina in cache. Ogni
   richiesta di `scarica` se lo porta dietro, perché il telaio mette il
   `?v=` solo sulla PAGINA — e un modello vecchio rimasto in cache
   accanto a una pagina nuova è una correzione che non arriva. */
const VERSIONE = "2026-09-15g";
/* `vivo` STA QUI, non giu' col disegnatore. La stanza si veste durante la
   valutazione del modulo e chiama `sveglia()`: un `let` letto prima della
   sua riga non è zero, è un ReferenceError, e un ReferenceError lì
   uccide il modulo intero — la stessa trappola già pagata su `cartaPezzo`
   e su `merci`. */
let vivo = 0;
/* e con lui `sospeso`, che `sveglia` legge a ogni chiamata: vedi il
   commento sopra `sveglia` per il perché sta qui e non lì. */
let sospeso = false;
const VIA = "assets/";
const DRACO_VIA = "./lib/jsm/libs/draco/gltf/";
/* DENTRO resta null quando gli asset sono file veri. Il file unico —
   quello che va in chat — se li porta appresso qui dentro, e `scarica`
   li legge senza toccare la rete. */
let MANIFESTO = {}, DENTRO = null;

const velo     = document.getElementById("attesa");
const striscia = document.getElementById("striscia");
const dice     = document.getElementById("dice");
const riprova  = document.getElementById("riprova");
let attesi = 0, arrivati = 0;
function conta(b){
  arrivati += b;
  if(attesi > 0 && striscia)
    striscia.style.width = Math.min(100, arrivati * 100 / attesi) + "%";
}
/* E IL VELO NON PARLA PIÙ QUANDO È ANDATO VIA. Le famiglie della
   coda continuano ad annunciarsi, e la parola cambiava sotto agli
   occhi durante i sei decimi della dissolvenza. */
function annuncia(t){ if(dice && velo && !velo.hidden) dice.textContent = t; }

/* SCARICA A PEZZI. Il fetch normale dice solo «fatto»; il lettore del
   corpo dice quanti byte sono entrati, ed è l'unico modo di avere una
   riga che si allunga invece di saltare da zero a cento. */
async function scarica(nome){
  if(DENTRO && DENTRO[nome] !== undefined){
    const t = atob(DENTRO[nome]), b = new Uint8Array(t.length);
    for(let i = 0; i < t.length; i++) b[i] = t.charCodeAt(i);
    conta(b.length);
    return b.buffer;
  }
  const r = await fetch(VIA + nome + "?v=" + VERSIONE);
  if(!r.ok) throw new Error(nome + " — HTTP " + r.status);
  if(!r.body){ const b = await r.arrayBuffer(); conta(b.byteLength); return b; }
  const lettore = r.body.getReader(), pezzi = [];
  let quanti = 0;
  for(;;){
    const {done, value} = await lettore.read();
    if(done) break;
    pezzi.push(value); quanti += value.length; conta(value.length);
  }
  const fuori = new Uint8Array(quanti);
  let o = 0; for(const p of pezzi){ fuori.set(p, o); o += p.length; }
  return fuori.buffer;
}

/* UNA TEXTURE DAGLI STESSI BYTE, per non perderla dal conto della riga.
   IL GIRO VA FATTO ALL'INGRESSO: una ImageBitmap ignora il flipY di
   three — lo dice pure con un avviso — e il fondale uscirebbe
   capovolto, e con lui il repeat.x = -1 della sfera, che è calibrato su
   un'immagine dritta. Chi le UV le ha dal glTF (il marchio dei plinti, i
   quadranti) chiede giro:false, che è esattamente il flipY = false che
   aveva prima. */
async function tela(nome, gira){
  const buf = await scarica(nome);
  return await createImageBitmap(new Blob([buf]),
    {imageOrientation: gira === false ? "none" : "flipY"});
}
/* UN PIXEL BIANCO, finché i byte non arrivano. Una texture senza
   immagine non è «vuota» per three: è un errore al momento di
   caricarla sulla scheda. Bianco perché una mappa di colore si
   moltiplica, e moltiplicare per bianco vuol dire non fare niente. */
const VUOTA = document.createElement("canvas");
VUOTA.width = VUOTA.height = 1;
{ const c = VUOTA.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 1, 1); }
/* E LA TEXTURE TORNA SUBITO, e si riempie quando i byte arrivano: è
   quello che faceva `tex.load`, ed è il motivo per cui il resto del
   file non ha dovuto diventare asincrono. */
function tessuto(nome, opz){
  const o = opz || {}, t = new THREE.Texture(VUOTA);
  t.flipY = false;                      // il giro l'ha già fatto la bitmap
  if(o.spazio) t.colorSpace = o.spazio;
  tela(nome, o.giro).then(bmp => {
    t.image = bmp; t.needsUpdate = true;
    if(o.poi) o.poi(t);
    sveglia();
  }).catch(e => console.warn("texture non arrivata:", nome, e));
  return t;
}
const stanza = document.getElementById("stanza");

/* ══════════════════════════════════════════════════════════════
   MOVIMENTO RIDOTTO — la parte che il foglio di stile non può fare

   Il CSS toglie lo spostamento ai rettangoli. Qui si tolgono le due cose
   che vivono in tre dimensioni: il VOLO della macchina, che diventa un
   salto con un lampo di tela, e il DONDOLO del pezzo in mano, che
   semplicemente non c'è. Anche l'inerzia sparisce: al rilascio la scena
   è già dove deve stare.
   Si legge a ogni cambio, non una volta sola: la preferenza si può
   accendere mentre l'applicazione è aperta.
   ══════════════════════════════════════════════════════════════ */
const menoMoto = matchMedia("(prefers-reduced-motion: reduce)");
let ridotto = menoMoto.matches;
const salto = document.createElement("div");
salto.id = "salto"; salto.setAttribute("aria-hidden", "true");
document.body.appendChild(salto);
/* il lampo si riarma togliendo e rimettendo la classe: senza il
   `offsetWidth` in mezzo il browser non vede due stati e l'animazione non
   riparte mai dalla seconda volta in poi */
function lampo(){
  if(!ridotto) return;
  salto.classList.remove("acceso");
  void salto.offsetWidth;
  salto.classList.add("acceso");
}

/* ══════════════════════════════════════════════════════════════
   IL CONGEDO — un solo modo di andarsene

   `hidden` porta `display:none`, e un elemento che smette di esistere non
   anima niente: è il motivo per cui la carta del pezzo entrava in 240 ms
   e usciva in 13, e la galleria in 6. Qui l'ordine si rovescia — prima si
   anima, `hidden` arriva sul transitionend — e la durata la decide il
   foglio di stile, non questo codice.
   ══════════════════════════════════════════════════════════════ */
function congeda(el, poi, nascondi){
  if(!el || el.hidden) return;
  // già per strada: un secondo clic sul velo non deve far ripartire il
  // cronometro e tenere la carta aperta più a lungo del dovuto
  if(el.classList.contains("via")) return;
  if(el.__congedo){ clearTimeout(el.__congedo.t);
                    el.removeEventListener("transitionend", el.__congedo.f); }
  const fine = () => {
    if(el.__congedo){ clearTimeout(el.__congedo.t);
                      el.removeEventListener("transitionend", el.__congedo.f); }
    el.__congedo = null;
    el.classList.remove("via");
    if(nascondi !== false) el.hidden = true;
    if(poi) poi();
  };
  const f = e => { if(e.target === el && e.propertyName === "opacity") fine(); };
  el.classList.add("via");
  el.addEventListener("transitionend", f);
  /* LA RETE DI SICUREZZA NON È PARANOIA. `transitionend` non arriva se la
     transizione non parte davvero — scheda in secondo piano, elemento già
     trasparente, un foglio di stile che non ha ancora finito di caricare —
     e senza di lei la carta resterebbe aperta per sempre. Il cronometro
     è un po' più lungo dell'uscita dichiarata (220 + 140), così non
     taglia un'animazione che sta girando bene. */
  el.__congedo = {t: setTimeout(fine, 360), f};
}
/* e chi rientra deve trovare la lavagna pulita: una classe `.via` rimasta
   addosso terrebbe il pannello invisibile a schermo intero */
function accogli(el){
  if(!el) return;
