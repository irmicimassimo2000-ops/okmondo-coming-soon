  /* OGNI FAMIGLIA CHE ARRIVA RIFA' LA CODA. Con le famiglie a tappe la
     lista dei pezzi cresce: una coda costruita quando ce n'era una sola
     non fotograferebbe mai le altre quattro. La generazione spegne la
     precedente senza doverla rincorrere, e i provini già fatti stanno
     nella dispensa — rifarla non costa niente. */
  const mia = ++geneProvini;
  const chiama = window.requestIdleCallback
    ? window.requestIdleCallback.bind(window)
    : (cb, o) => setTimeout(() => cb({timeRemaining:() => 6, didTimeout:true}),
                            (o && o.timeout) ? 120 : 120);
  /* le due misure che l'applicazione chiede davvero: la carta del pezzo
     (560x385) e le carte dell'insieme insieme alla lista della
     collezione (la misura di serie). La galleria ne vuole una terza,
     900x900, e resta pigra: è una sola alla volta e si apre da una
     carta già aperta, cioè mai sotto il primo tocco. */
  const coda = [];
  /* si comincia dalla famiglia in cui si è — se si è già entrati in
     una: è quella in cui si aprira' una carta fra due secondi */
  const ordine = FAMIGLIE.slice().sort(
    (a, b) => (a.id === attiva ? -1 : 0) - (b.id === attiva ? -1 : 0));
  for(const f of ordine)
    (merci[f.id] || []).forEach((o, k) => {
      if(!o) return;
      coda.push([f.id, k, 288, 216]);
      coda.push([f.id, k, 560, 385]);
    });
  let i = 0;
  provinoOzio = scad => {
    if(mia !== geneProvini) return;   // sorpassata da una famiglia nuova
    const fam = coda[i] && coda[i][0];
    let fatti = 0;
    while(i < coda.length && coda[i][0] === fam &&
          (fatti === 0 || !scad || scad.didTimeout || scad.timeRemaining() > 4)){
      const [f, k, w, h] = coda[i++];
      try { provino(f, k, w, h); } catch(_) { /* un provino in meno, non un guasto */ }
      fatti++;
    }
    window.__proviniPronti = i;
    if(fatti){
      dipingi();                       // la tela non deve restare col provino sopra
      /* e le carte già in scena vanno a prendersi la fotografia che un
         istante fa non c'era: è qui che si chiude il buco della famiglia
         che arriva dopo la carta */
      ripassaCarteSenzaFoto();
    }
    if(i < coda.length) chiama(provinoOzio, {timeout:1200});
    else provinoOzio = null;
  };
  requestAnimationFrame(() => requestAnimationFrame(
    () => { if(mia === geneProvini) chiama(provinoOzio, {timeout:1200}); }));
}
window.__provini = provinoDi; window.__provino = provino;


/* ══════════════════════════════════════════════════════════════
   IL PEZZO COME OGGETTO INTERATTIVO
   Verdetto di Massimo: «ogni pezzo acquistato e collezionato deve essere
   una possibilita' di fare, ricevere o partecipare a qualcosa». Non
   servizi da sbrigare — porte. Ogni voce del menu preannuncia un sistema

/* L'IMPIANTO È SCELTO. Se ne sono costruiti tre sulla carta vera, con il
   contenuto vero e all'altezza che ha un telefono con le barre di Safari:
   il TAVOLIERE (riquadri a due colonne, come le mosse di un gioco da
   tavolo), il REGISTRO (righe incise, la lingua del Libretto) e il NASTRO.
   Massimo ha scelto il nastro, e gli altri due escono dal file: il
   deliverable è il pezzo finito, non il ventaglio. */
function disegnaVoci(voci){
  const V = document.getElementById("voci");
  V.className = "nastro";
  V.innerHTML = voci.map(v =>
    `<button data-fa="${v.id}"${v.grave ? ' class="grave"' : ""}>` +
    (SEGNI[v.id] || "") + `<span class="che">${v.che}</span>` +
    `<span class="perche">${v.perche}</span></button>`).join("");
  for(const b of V.children) b.onclick = () => faiVoce(b.dataset.fa, b);
  sistemaNastro();
}

/* ── QUANTE COLONNE CI STANNO ─────────────────────────────────
   Non lo decide un numero scritto qui e non lo decide il conto delle
   voci: lo decide la PAROLA PIÙ LUNGA di questo pezzo, sul carattere
   vero, alla larghezza vera della carta — che sul telefono è 298 punti
   e dentro il pannello del desktop è un'altra. Si parte da «tutte in
   riga», che è la forma che Massimo ha scelto, e si scende di una
   colonna per volta finché nessuna etichetta si taglia. Al massimo
   quattro passate, una volta per carta aperta: costa quattro
   impaginazioni in un momento in cui non si sta muovendo niente.
   Il segno «> clientWidth» e non un conto sui caratteri: una parola non
   è larga quanto le sue lettere: dipende dalle coppie, dal maiuscoletto
   e dalla spaziatura, e l'unico che lo sa è il browser. */
function sistemaNastro(){
  const V = document.getElementById("voci");
  if(!V || !V.classList.contains("nastro")) return 0;
  const n = V.children.length;
  if(!n) return 0;
  /* E NON SI MISURA UNA CARTA CHE NON È ANCORA SULLO SCHERMO. Il nastro
     si disegna mentre la carta è ancora nascosta: lì ogni larghezza è
     zero, nessuna etichetta «tronca», e il conto direbbe sempre che
     cinque colonne ci stanno. Pagata: cinque voci a 11 px una accanto
     all'altra su 298 punti, tutte e quattro tagliate. Si rimanda di due
     fotogrammi - lo stesso rinvio di `misuraCarta`, per la stessa
     ragione: il primo impagina, il secondo può leggere. */
  if(!V.clientWidth){
    requestAnimationFrame(() => requestAnimationFrame(sistemaNastro));
    return 0;
  }
  for(let c = n; c > 1; c--){
    V.style.setProperty("--col", c);
    let tronca = false;
    for(const b of V.children){
      const t = b.querySelector(".che");
      if(t && t.scrollWidth > t.clientWidth + 0.5){ tronca = true; break; }
    }
    if(!tronca) return c;
  }
  /* due colonne è il fondo: sotto, un tasto largo mezza carta con una
     parola sola dentro non è più un nastro, e se non ci sta nemmeno lì
     il problema non è il nastro */
  V.style.setProperty("--col", 2);
  return 2;
}
window.__nastroColonne = () => {
  const V = document.getElementById("voci");
  return V ? +(getComputedStyle(V).getPropertyValue("--col") || 0) : 0;
};

let cartaFam = null, cartaK = -1;
/* da dove veniva il fuoco quando la carta si è aperta: la tela non è
   raggiungibile col tabulatore e non deve esserlo, ma deve poter
   RICEVERE il fuoco quando glielo si restituisce — se no chiudendo la
   carta il fuoco torna in cima al documento e chi naviga con la tastiera
   riparte da capo ogni volta */
let tornaIlFuoco = null;
document.getElementById("stanza").setAttribute("tabindex", "-1");

function apriCarta(fam, k){
  /* ── GIÀ APERTA SU QUESTO PEZZO: NON SI RIAPRE ────────────────
     Serve alla carta con la finestra. Lì il tocco dentro il ritaglio
     scende alla tela, e al livello del pezzo un tocco sul gioiello vuol
     dire «apri la sua carta»: la carta è già aperta, e riaprirla
     rifarebbe tutto da capo — fuoco compreso, che salterebbe via da
     dove lo si è lasciato — per non cambiare niente. */
  if(!cartaPezzo.hidden && cartaFam === fam && cartaK === k && !riVeste) return;
  /* se la dedica c'era già non si posa una seconda volta: si posa quando
     ARRIVA, ed è l'unico caso in cui quella dissolvenza vuol dire
     qualcosa */
  const dedicaPrima = !dedicaBox.hidden;
  cartaFam = fam; cartaK = k;
  portaScatti();                  // T3: la galleria si apre da qui, non prima
  const r = (RIPIANI[fam] || [])[k] || ["", "", ""];
  /* LA CARTA LEGGE L'ESEMPLARE, e la scheda è il ripiego. `SCHEDA` è
     la copia in chiaro che il banco si porta dietro per quando gira da
     solo; quando la scocca manda `esemplare/dati` — una dedica appena
     scritta, un regalo ricevuto — la verita' è quella, e la carta deve
     dirla senza riaprirsi. */
  const sc = datiCarta(fam, k);
  foglio.classList.remove("girata");
  /* SI LEGGE DALLA DISPENSA. `provino` tiene la sua cache: se il lavoro
     a vuoto l'ha già fatta, qui non si disegna niente e l'apertura non
     costa un fotogramma. Se non l'ha fatta — carta aperta nel primo
     secondo — si disegna adesso, come prima: la cache è un vantaggio,
     non una dipendenza. */
  document.querySelector(".riga-foto").classList.remove("senza-foto");
  ritratto.src = provino(fam, k, 560, 385);
  document.getElementById("quante-foto").textContent =
    (1 + SCATTI.length) + " foto";
  document.getElementById("carta-nome").textContent = r[0];
  document.getElementById("carta-mat").textContent = r[1];
  /* ── NOME · MATERIALE · PREZZO, e poi due righe ────────────────
     Il prezzo esce dalla tabella e prende il suo posto: terzo, sotto il
     materiale, con un corpo suo. È l'ordine con cui lo si legge in una
     vetrina — che cos'e', di che cos'e' fatto, quanto costa — e nessuna
     maison lo mette in una casella con l'etichetta «VALORE» sopra.
     Poi restano DUE righe, non tre caselle:
       · quando è entrato e in che collezione sta;
       · se è un regalo, da chi e cosa comporta.
     La prima c'è sempre: senza scheda dice «In negozio», che è vero e
     non lascia un buco. Erano 240 punti di bianco su un pezzo che ha il
     solo valore — misurati — e adesso non c'è più una casella che
     possa restare vuota, perché non ci sono più caselle. */
  const col = collezioneDi(fam, k);
  document.getElementById("carta-prezzo").textContent = r[2] ? r[2] + " €" : "";
  const righeDati = [];
  righeDati.push("<div>" + (sc.quando ? "Dal " + sc.quando : "In negozio") +
                 (col ? " · " + col.nome : "") + "</div>");
  /* ── E CHI HA RICEVUTO UN REGALO DEVE SAPERLO QUI ──────────────
     Su un pezzo con un nome in `da` il tasto «Regala» non compare — è
     la regola etica di Massimo, un dono non rimbalza — ma la ragione
     stava scritta SOLO sul retro di quel tasto, cioè nell'unico posto
     che quel pezzo non può aprire. Chi riceve vedeva un nastro con un
     tasto in meno e nessuna spiegazione: un'assenza non insegna niente.
     La regola sale sul fronte, sotto i dati, e lo stato si dice come lo
     dicono le maison — una parola in maiuscoletto, non una pastiglia
     colorata. */
  if(sc.da) righeDati.push('<div class="regalo"><span class="stato">Ricevuto da ' +
    sc.da + "</span> · non si rigira e non chiude collezioni</div>");
  document.getElementById("carta-dati").innerHTML = righeDati.join("");

  const ded = dedicaBox;
  if(sc.dedica){
    ded.hidden = false;
    document.getElementById("dedica-testo").textContent = "« " + sc.dedica + " »";
    document.getElementById("dedica-firma").textContent = sc.da ? sc.da : "";
    /* LUNGA O CORTA LO DICONO I PIXEL, non il numero di lettere. Si misura
       l'altezza vera del paragrafo: se supera tre righe, si taglia e si
       offre di girare la carta. Contando i caratteri, una dedica di
       centoventi lettere tutte strette ci stava e veniva tagliata comunque. */
    ded.classList.remove("lunga");
    /* e se la dedica è ARRIVATA ADESSO — non c'era e ora c'è — si posa
       con la sua dissolvenza invece di comparire di scatto */
    if(riVeste && !dedicaPrima){
      ded.classList.remove("posa"); void ded.offsetWidth;
      ded.classList.add("posa");
      clearTimeout(ded.__posa);
      ded.__posa = setTimeout(() => ded.classList.remove("posa"), 300);
    }
    requestAnimationFrame(() => {
      const p = document.getElementById("dedica-testo");
      const riga = parseFloat(getComputedStyle(p).lineHeight) || 21;
      if(p.scrollHeight > riga * 4.4) ded.classList.add("lunga");
    });
  } else ded.hidden = true;
  foglio.querySelector(".fronte").classList.toggle("senza-dedica", !sc.dedica);

  /* ── CHI C'E' SUL NASTRO LO DECIDE IL PEZZO ────────────────────
     Non un menu fisso con le voci spente: le voci che non hanno senso per
     QUESTO pezzo non esistono, e le altre si dividono la riga in parti
     uguali. Due regole, e vengono dai dati, non dal gusto:
       · LA COLLEZIONE si dichiara. Un pezzo che non appartiene a nessuna
         non ha niente da mostrare, e il tasto non c'è;
       · UN REGALO NON SI RIGALA. Se il pezzo è arrivato da qualcuno — c'è
         un nome in `da` — il tasto «regala» esce. È una regola etica
         prima che funzionale: passare avanti una cosa che ti è stata
         data è un'altra faccenda, e un'app non deve renderla comoda.
     Resta sempre quello che vale per ogni pezzo: assistenza, condividi,
     rimuovi. */
  /* ── E ADESSO IL NASTRO HA DUE MESTIERI, non uno ───────────────
     «Certificato» e «Collezione» GIRANO LA CARTA: il seguito è qui
     dietro e si legge senza uscire dal banco.
     «Dedica», «Regala», «Assistenza», «Condividi» e «Metti da parte»
     MANDANO UN MESSAGGIO alla scocca, che apre il suo foglio: hanno tutte
     bisogno di una tastiera o di un foglio di sistema, e nessuna delle due
     cose vive bene dentro un telaio. Qui il tasto si limita a dire che ha
     sentito il dito.
     «Rimuovi» resta in casa: non c'è niente da scrivere. */
  const voci = [];
  voci.push({id:"certificato", che:"Certificato", perche:"il passaporto del pezzo"});
  const diCasa = !!codiceDiScena(fam, k);
  if(diCasa) voci.push({id:"dedica", che:"Dedica",
                        perche: sc.dedica ? "cambiala" : "scrivine una"});
  if(diCasa && !sc.da) voci.push({id:"regala", che:"Regala", perche:"con una scansione"});
  if(col) voci.push({id:"collezione", che:"Collezione",
                     perche:"cosa manca a " + col.nome});
  voci.push({id:"assistenza", che:"Assistenza", perche:"una misura, una saldatura"});
  voci.push({id:"condividi", che:"Condividi", perche:"fallo vedere a chi vuoi"});
  /* METTI DA PARTE VIVE SOLO IN VETRINA. Un pezzo che è già nel
     cofanetto non si mette da parte: ce l'hai. La domanda «è di
     vetrina?» ha una risposta sola e non è un'opinione — il ponte dei
     codici non gli conosce un esemplare. */
  if(!diCasa) voci.push({id:"parte", che:"Metti da parte",
                         perche:"te lo teniamo in negozio"});
  if(diCasa) voci.push({id:"rimuovi", che:"Rimuovi",
                        perche:"smarrito, o non più tuo", grave:true});
  disegnaVoci(voci);

  accogli(cartaPezzo);
  /* ── IL FUOCO ENTRA CON LA CARTA ─────────────────────────────
     `role="dialog" aria-modal="true"` era dichiarato e il fuoco restava
     sul corpo della pagina: misurato, `document.activeElement` era BODY
     prima, dentro e dopo. Per un lettore di schermo quella non è una
     finestra modale, è testo comparso da qualche parte; e per chi
     naviga con la tastiera il primo tabulatore riparte dall'inizio del
     documento, cioè da sotto la carta.
     Il fuoco va sulla FACCIA, non sul tondo che chiude. Provato con il
     tondo e fotografato: l'anello turchese del fuoco compariva sopra la
     fotografia del gioiello appena la carta si apriva — Chrome, quando
     il fuoco lo sposta il codice, decide da solo se disegnare l'anello,
     e su un bottone lo disegna volentieri. Un foglio con `tabindex="-1"`
     riceve il fuoco senza anello, dice al lettore di schermo dove si è
     finiti, e il primo tabulatore va comunque sul tondo che chiude,
     perché è il primo comando dentro la faccia. E si ricorda da dove
     veniva il fuoco, per rimetterlo lì alla chiusura. */
  /* ── E UN AGGIORNAMENTO DI DATI NON RUBA IL FUOCO ──────────────
     `rivestiCarta` ripassa di qui per riscrivere una carta già aperta
     (la dedica arrivata dalla scocca). Se anche in quel caso il fuoco
     tornasse sulla faccia, chi sta leggendo col lettore di schermo
     verrebbe riportato in cima alla carta da un dato che è cambiato
     altrove: un movimento che nessuno ha chiesto. */
  const prendiIlFuoco = !riVeste;
  if(prendiIlFuoco) tornaIlFuoco = document.activeElement;
  requestAnimationFrame(() => {
    if(prendiIlFuoco && !cartaPezzo.hidden) foglio.querySelector(".fronte").focus();
  });
  /* la finestra viene DOPO il contenuto: il ritaglio si misura sul
     riquadro impaginato, e l'inquadratura si fa sul ritaglio. Il buco si
     rifa' anche a entrata finita, perché mentre la carta si porge è
     ancora scalata di 3,5 centesimi e spostata di otto punti. */
  vestiStriscia();
  segnaSugg();
  misuraCarta();
  inquadraNellaFinestra();
  rifaiFinestra();
  /* ── E SI SEGUE FINCHÉ NON SI È POSATO ──────────────────────
     L'inquadratura della finestra si calcola sul riquadro impaginato, e
     nei primi mezzo secondo il riquadro si sta ancora impaginando: la
     carta entra scalata, il cartellino si ritira in 0,22 s e l'altezza
     si assesta in 0,34. Erano due correzioni ritardate, a 240 e a 480
     ms — due strappi in mezzo a un volo. Adesso si segue il riquadro a
     ogni fotogramma finché si muove (vedi il ciclo): una strada sola,
     dal punto in cui sta il pezzo al centro della finestra. */
  seguiFinestra = SEGUI_S;
}

/* SI CHIUDE COME SI È APERTA, PIÙ IN FRETTA. Prima: `hidden = true`, e
   la carta spariva in 13 millisecondi misurati — un fotogramma — dopo
   essere entrata in 240. La faccia si rimette sul fronte solo a uscita
   FINITA: girarla mentre è ancora in campo si vedrebbe. */
function chiudiCarta(){
  if(cartaPezzo.hidden) return;
  /* IL FUOCO SI RESTITUISCE SUBITO, non a uscita finita: fra l'una e
     l'altra ci sono 220 millisecondi in cui il fuoco starebbe su un
     bottone che si sta dissolvendo, e un lettore di schermo lo
     annuncerebbe mentre sparisce. */
  const dove = tornaIlFuoco;
  tornaIlFuoco = null;
  if(dove && dove.isConnected && dove !== document.body) dove.focus();
  else document.getElementById("stanza").focus();
  /* LA MACCHINA TORNA DOV'ERA. Con la finestra la carta si era portata il
     pezzo dentro il ritaglio spostando e ingrandendo: chiudendola, quel
     prestito si restituisce, e lo si restituisce con la molla — non di
     scatto — perché è un'inquadratura che torna, non un taglio. Il buco
     invece si toglie subito: un velo che sta svanendo con un foro dentro
     lascia una macchia chiara per due decimi di secondo. */
  zoomMeta = 1; panMetaX = 0; panMetaY = 0;
  seguiFinestra = 0;
  veloCarta.style.clipPath = fronteCarta.style.clipPath = "";
  strisciaFoto.hidden = true;
  sveglia();
  /* e i suggerimenti in scena tornano a USCITA FINITA, non adesso:
     `segnaSugg` guarda se la carta è nascosta, e per altri duecento
     millisecondi non lo è — chiamata qui direbbe sempre di tenerli
     spenti, e non li riaccenderebbe più nessuno. */
  congeda(cartaPezzo, () => { foglio.classList.remove("girata"); segnaSugg(); });
}

/* quanto è alta la faccia che si sta guardando, e quanto ne concede lo
   schermo. Si misura DOPO l'impaginazione: chiesta subito, scrollHeight
   torna l'altezza della carta di prima. */
function misuraCarta(){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const girata = foglio.classList.contains("girata");
    /* SI MISURA IL CONTENUTO, NON IL CONTENITORE. Leggevo lo scrollHeight
       dello scorrevole: ma quello è `flex:1`, quindi quando il contenuto
       è più corto della carta il suo scrollHeight È l'altezza della
       carta — e la carta non si accorciava mai. Passando dalla collezione
       (614) all'assistenza (che ne vuole 450) restava a 614, con
       centosessanta punti di carta vuota sotto.
       Si sommano le altezze dei figli: in una colonna flessibile i margini
       non collassano, quindi la somma è esatta. */
    const d = foglio.querySelector((girata ? ".retro" : ".fronte") + " .dentro-carta");
    const sd = getComputedStyle(d);
    let alto = parseFloat(sd.paddingTop) + parseFloat(sd.paddingBottom);
    for(const c of d.children){
      if(c.hidden) continue;
      const cs = getComputedStyle(c);
      if(cs.display === "none") continue;
      /* e un margine che vale più di 120 punti non è un margine: è
         un `auto` risolto nello spazio libero. Non si somma. */
      const ms = m => (m > 120 ? 0 : m);
      alto += c.offsetHeight + ms(parseFloat(cs.marginTop)) + ms(parseFloat(cs.marginBottom));
    }
    const concesso = cartaPezzo.clientHeight - 52;
    foglio.style.height = Math.min(concesso, Math.ceil(alto)) + "px";
    segnaScorrimento();
    /* l'altezza appena scritta sposta la carta in verticale — sta al
       centro dello schermo — e con lei il riquadro della finestra: il
       buco e l'inquadratura vanno rifatti sulla misura nuova, non su
       quella di prima. È anche l'unico momento in cui il riquadro è
       davvero al suo posto: chiamata dall'apertura, la misura sarebbe
       ancora quella della carta di prima. */
    inquadraNellaFinestra();
    rifaiFinestra();
  }));
}

/* ── «C'E' ALTRO SOTTO» ───────────────────────────────────────────
   Coricato, misurato: alla carta lo schermo concede 338 punti e il
   contenuto ne vuole 489. La colonna scorreva e non lo diceva in nessun
   modo — niente barra, niente sfumatura, niente — e il nastro delle
   azioni, che il verdetto di Massimo vuole visibile subito, cadeva
   quarantasette punti sotto il bordo della carta.
   Il nastro se lo risolve il foglio di stile incollandolo in fondo. Qui
   si accende il segno che dice che sotto c'è altro, e si spegne quando
   si è arrivati in fondo: una sfumatura che resta accesa a fine corsa
   è una bugia piccola ma continua. */
function segnaScorrimento(){
  for(const f of foglio.querySelectorAll(".faccia")){
    const d = f.querySelector(".dentro-carta");
    if(!d) continue;
    f.classList.toggle("scorre",
      d.scrollHeight > d.clientHeight + 1 &&
      d.scrollTop + d.clientHeight < d.scrollHeight - 2);
  }
}
for(const d of foglio.querySelectorAll(".dentro-carta"))
  d.addEventListener("scroll", segnaScorrimento, {passive:true});

/* ── IL RETRO ─────────────────────────────────────────────────
   Ogni azione ha il suo seguito qui: il titolo, cosa comporta, e — dove
   serve — il codice da far inquadrare. Il codice è un QR VERO, generato
   da codici.py: un quadrato che ha l'aria di un QR lo si scopre la prima
   volta che qualcuno prova a leggerlo. */
/* QUALE PROMO SI VEDE LO DICE QUANTO MANCA. Nessun testo inventato al
   volo: si scelgono fra quelli scritti nei dati della collezione. */
/* E IL NUMERO LO DICE IL NUMERO. La riga per «ne manca più di uno» era
   scritta «A un pezzo dalla chiusura…»: la stessa frase del caso in cui
   ne manca esattamente uno, letta da chi ne ha ancora tre da prendere.
   Non era una svista di copia: era una frase che non aveva un posto dove
   mettere la quantita'. Adesso ce l'ha — un segnaposto {n} — e la si
   riempie qui, dove il numero è già stato contato. */
function righePromo(col, mancano){
  const p = col.promo || {};
  const righe = [];
  if(mancano === 0 && p.chiusa) righe.push(p.chiusa);
  else if(mancano === 1 && p.manca1) righe.push(p.manca1);
  else if(mancano > 1 && p.manca) righe.push(p.manca.replace("{n}", mancano));
  if(p.sempre) righe.push(p.sempre);
  if(!righe.length) return "";
  return '<div class="promo">' + righe.map(t => "<div>" + t + "</div>").join("") + "</div>";
}

function giraCarta(fa){
  const r = (RIPIANI[cartaFam] || [])[cartaK] || ["", "", ""];
  const cod = CODICE(cartaFam, cartaK);
  const col = collezioneDi(cartaFam, cartaK);
  const T = document.getElementById("retro-titolo");
  const S = document.getElementById("retro-sotto");
  const Q = document.getElementById("retro-qr");
  const C = document.getElementById("retro-codice");
  const N = document.getElementById("retro-note");
  const F = document.getElementById("retro-fondo");
  Q.classList.remove("c-e"); C.textContent = ""; N.innerHTML = "";
  /* quale faccia si sta guardando, scritto dove chiunque lo può leggere:
     serve a `rivestiCarta` per rimettere la stessa dopo un aggiornamento
     di dati, e a chi collauda per sapere cosa sta misurando. */
  foglio.dataset.fa = fa;
  foglio.querySelector(".retro").classList.toggle("cert", fa === "certificato");
  const conQR = (testo) => {
    document.getElementById("retro-qr-img").src = QR[cod] || "";
    Q.classList.add("c-e");
    C.textContent = cod;
    if(testo) N.innerHTML = testo;
  };
  /* ══════════════════════════════════════════════════════════════
     OGNI TASTO PORTA LA SUA AZIONE

     Com'era, in due righe: si disegnavano tutti i tasti, e poi
     `F.children[F.children.length - 1].onclick = …` ne collegava UNO —
     l'ultimo — al ritorno sul fronte. Tutti gli altri restavano
     rettangoli colorati senza gestore: misurati, tre su sei. «Rimuovi»
     in rosso pieno, «Copia il link» in turchese e «Annulla» sul regalo
     si premevano e non succedeva niente. Non è una funzione mancante:
     è un tasto che promette e non mantiene, che è peggio di un tasto
     che non c'è.
     Adesso ogni voce della lista porta la propria azione come terzo
     elemento, e chi non ce l'ha torna sul fronte — che è il
     comportamento di serie sensato per un tasto sul retro di una carta.
     ══════════════════════════════════════════════════════════════ */
  const tornaAlFronte = () => { foglio.classList.remove("girata"); misuraCarta(); };
  const tasti = (lista) => {
    F.innerHTML = lista.map(([t, cl]) =>
      `<button type="button"${cl ? ' class="' + cl + '"' : ""}>${t}</button>`).join("");
    [...F.children].forEach((b, i) => {
      const fa = lista[i][2];
      b.onclick = fa ? () => fa(b) : tornaAlFronte;
    });
  };

  /* ── COPIA IL LINK, e lo copia davvero ─────────────────────────
     Due strade perché `navigator.clipboard` esiste solo in un contesto
     sicuro: su `https` e su `localhost` c'è, su un indirizzo di rete
     locale in chiaro — cioè il telefono di Massimo che apre la pagina
     dal computer — non c'è affatto, e la promessa cadrebbe proprio nel
     posto dove la si prova. La riserva è vecchia ma funziona ovunque.
     E il riscontro sta SUL TASTO: due secondi di «copiato» al posto
     dell'etichetta. Una striscia in basso, qui, direbbe una cosa che si
     è appena fatta col dito a tre centimetri di distanza. */
  const copiaIlLink = (b) => {
    const via = location.origin + location.pathname +
                "?f=" + cartaFam + "&p=" + cartaK;
    const detto = () => {
      if(b.__t) return;
      const prima = b.textContent;
      b.textContent = "copiato";
      b.__t = setTimeout(() => { b.textContent = prima; b.__t = null; }, 2000);
    };
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(via).then(detto, () => riserva(via, detto));
    else riserva(via, detto);
  };
  const riserva = (testo, poi) => {
    const a = document.createElement("textarea");
    a.value = testo; a.setAttribute("readonly", "");
    a.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); poi(); } catch(_) {}
    a.remove();
  };

  /* ── RIMUOVI ───────────────────────────────────────────────────
     Il tasto rosso chiude la carta, spegne il pezzo nella scena e lo
     dice in basso con cinque secondi per cambiare idea. Cinque e non
     quattro: è l'unica azione di tutta l'applicazione che toglie
     qualcosa, e chi la sbaglia col pollice deve avere il tempo di
     accorgersene DOPO aver visto la scena senza il pezzo — cioè dopo
     che la carta se n'e' andata e la macchina è tornata indietro. */
  const faiRimuovi = () => {
    const fam = cartaFam, k = cartaK;
    const nome = ((RIPIANI[fam] || [])[k] || [""])[0];
    chiudiCarta();
    TOLTI.add(fam + ":" + k);
    if(livello === 2 && attiva === fam && scelto === k) indietro();
    else { applicaTolti(); if(livello === 1 && attiva === fam) mostraScheda(); }
    sveglia();
    mostraToast("Tolto dal cofanetto · " + nome, {
      durata: 5000, etichetta: "annulla",
      disfa: () => {
        TOLTI.delete(fam + ":" + k);
        const o = (merci[fam] || [])[k];
        /* si riaccendono solo le mesh della MERCE. La posa stesa resta
           spenta: al banco e in famiglia lo è sempre, e in selezione la
           riaccende `isolaPezzo` quando serve. Riaccenderla qui
           lascerebbe una collana distesa sul bancone. */
        if(o) o.traverse(m => { if(m.isMesh) m.visible = true; });
        if(livello === 1 && attiva === fam) mostraScheda();
        sveglia();
      }});
  };

  if(fa === "certificato"){
    disegnaCertificato(T, S, N);
    tasti([["torna alla carta"]]);
  } else if(fa === "dedica-lunga"){
    const d = datiCarta(cartaFam, cartaK);
    T.textContent = "La dedica";
    S.textContent = d.da ? "Scritta da " + d.da : "";
    N.innerHTML = "<b>« " + (d.dedica || "") + " »</b>";
    tasti([["torna alla carta"]]);
  } else if(fa === "regala"){
    T.textContent = "Regala " + r[0];
    S.textContent = "Fai inquadrare questo codice dal telefono di chi lo " +
                    "riceve. Il pezzo entra nella sua collezione ed esce " +
                    "dalla tua, nello stesso istante.";
    /* E QUI NON SI DICE CHE SI PUÒ RIGIRARE. Il testo prometteva «si
       può regalare a sua volta», e il sistema fa l'opposto: chi riceve un
       pezzo in regalo non trova il tasto Regala, per il principio etico
       che Massimo ha fissato. Un dono che rimbalza non è un dono. */
    conQR("<b>Un pezzo ricevuto in regalo non chiude una collezione.</b> " +
          "Entra nel cofanetto, si vede, si indossa, resta suo — ma non " +
          "si rigira, e per il pezzo che chiude non conta. Altrimenti " +
          "basterebbe passarsi gli stessi quattro pezzi fra amici.");
    /* DUE USCITE IDENTICHE, DI CUI UNA MORTA. C'erano «annulla» e «torna
       alla carta»: due tasti affiancati che avrebbero fatto la stessa
       identica cosa — rimettere la carta sul fronte — se non che il
       primo non aveva gestore e non faceva niente. Non c'è nessuna
       azione in corso da annullare: mostrare un codice non è una
       procedura, è una schermata. Il doppione esce. */
    tasti([["torna alla carta"]]);
  } else if(fa === "condividi"){
    T.textContent = "Fallo vedere";
    S.textContent = "Questo codice porta alla pagina del pezzo. Chi lo " +
                    "apre lo vede e lo gira, ma resta tuo.";
    conQR("");
    tasti([["copia il link", "fa", copiaIlLink], ["torna alla carta"]]);
  } else if(fa === "assistenza"){
    T.textContent = "Assistenza";
    S.textContent = "Il codice identifica il pezzo: mostralo in negozio e " +
                    "Stefano sa esattamente di che si tratta, quando l’hai " +
                    "comprato e cosa è stato fatto prima.";
    conQR("<b>Il centro assistenza del pezzo è da costruire.</b> Qui " +
          "andranno la storia degli interventi, i tempi e il ritiro.");
    tasti([["torna alla carta"]]);
  } else if(fa === "rimuovi"){
    T.textContent = "Rimuovi dalla collezione";
    S.textContent = "Il pezzo esce dal cofanetto. Se lo ritrovi lo si " +
                    "rimette scansionando il suo codice.";
    N.innerHTML = "Quello che hai speso resta contato. Ma <b>la collezione " +
                  (col ? col.nome : "") + " torna incompleta</b>, e il pezzo " +
                  "che la chiude non arriva.";
    tasti([["rimuovi", "grave", faiRimuovi], ["torna alla carta"]]);
  } else if(fa === "collezione" && col){
    T.textContent = col.nome;
    /* UN PEZZO RICEVUTO NON CONTA, e qui lo si vede. È la regola del
       gioco — se no la collezione si chiude passandosi gli stessi quattro
       pezzi fra amici — e va detta dove la persona guarda quanto le manca,
       non solo nel retro del regalo. */
    /* ── TRE STATI, E UN CONTO CHE TORNA ───────────────────────────
       Il retro diceva «2 di 5 pezzi» sopra SEI righe: cinque della
       collezione più il pezzo che la chiude, che nel conto non c'era.
       Chi guarda conta le righe, non legge il codice, e trovava un
       numero che non corrisponde a quello che vede. Il pezzo che chiude
       si dichiara a parte — non è uno dei cinque, non si compra, e
       metterlo dentro il totale renderebbe la collezione impossibile
       per costruzione.
       E poi i tre stati. Un pezzo RICEVUTO IN REGALO portava la classe
       `manca`: nome sbiadito e stato in ambra, cioè disegnato come un
       pezzo che non hai — mentre ce l'hai, sta nel cofanetto, lo porti.
       Quello che non fa è CONTARE per la chiusura, ed è un'altra cosa.
       Tre parole, tre stati:
         TUO · RICEVUTO · NON CONTA · DA PRENDERE con il prezzo.
       Un pezzo tolto dal cofanetto torna fra quelli da prendere, con il
       suo prezzo dal catalogo: è esattamente quello che il retro di
       «rimuovi» promette. */
    const via = p => p.fam && cTolto(p.fam, p.k);
    const mio = p => p.fam && !schedaDi(p.fam, p.k).da && !via(p);
    const ho = col.pezzi.filter(mio).length;
    S.textContent = ho + " di " + col.pezzi.length + " · e il pezzo che chiude";
    const prezzoDi = p => ((RIPIANI[p.fam] || [])[p.k] || ["", "", ""])[2];
    N.innerHTML =
      '<div class="coll">' +
      col.pezzi.map(p => {
        const stato = (parola, seguito) => `<span class="s"><i>${parola}</i>` +
          (seguito ? `<em>${seguito}</em>` : "") + "</span>";
        if(!p.fam || via(p)){
          const prezzo = p.fam ? prezzoDi(p) : p.prezzo;
          return `<div class="r manca"><span class="vuoto"></span>` +
                 `<span class="n">${p.nome}</span>` +
                 stato("da prendere", prezzo + " €") + "</div>";
        }
        const dono = schedaDi(p.fam, p.k).da;
        return `<div class="r${dono ? " ricevuto" : ""}">` +
               `<img src="${provino(p.fam, p.k)}" alt="">` +
               `<span class="n">${p.nome}</span>` +
               (dono ? stato("ricevuto", "non conta") : stato("tuo")) + "</div>";
      }).join("") +
      `<div class="r chiude"><span class="vuoto"></span><span class="n">${col.chiude.nome}</span>` +
      `<span class="s"><i>non si compra</i></span></div></div>` +
      `<div style="margin-top:10px;font-size:11.5px;line-height:1.5;color:#B3A795">` +
      col.chiude.nota + "</div>" +
      righePromo(col, col.pezzi.length - ho);
    tasti([["torna alla carta"]]);
  }
  foglio.classList.add("girata");
  misuraCarta();
}

/* ══════════════════════════════════════════════════════════════
   LA FINESTRA — il buco nella carta, e la macchina che ci riquadra

   Variante 2 (`finestra` e `due`). L'area della fotografia diventa
   davvero trasparente: non un'immagine finta del pezzo, il PEZZO, che
   continua a girare col dito dentro il ritaglio.
   Tre attrezzi, e nessuno dei tre tocca il ciclo di disegno:
     · `poligonoBuco` — scava il ritaglio in un elemento con un
       clip-path a regola pari-dispari: un anello esterno più grande
       della scatola (se no il clip porterebbe via l'ombra della carta) e
       dentro il rettangolo del riquadro con i suoi angoli tondi. Lo
       stesso buco va sul velo (che così non sfoca il pezzo e non
       raccoglie i tocchi che ci cadono dentro) e sulla faccia della
       carta (che così non ci mette sopra la sua carta opaca).
     · `quadroDelPezzo` — dove cade il pezzo sullo schermo con la
       macchina ARRIVATA e senza pizzico. Si proietta con una macchina di
       prova messa sul bersaglio, perché quella vera in quel momento sta
       ancora volando e darebbe un rettangolo che non è quello di fra
       mezzo secondo.
     · `inquadraNellaFinestra` — sposta e ingrandisce perché quel
       rettangolo ci stia dentro la finestra, centrato, col dodici per
       cento di margine per lato. Usa `zoomMeta` e `panMeta*`, cioè il
       meccanismo che il file ha già per il pizzico: la molla porta la
       macchina dove deve stare, questo la sposta rispetto a lì. Il
       volo, il dondolo e il rilascio non se ne accorgono.
   ══════════════════════════════════════════════════════════════ */
const veloCarta = cartaPezzo.querySelector(".velo");
const rigaFoto = document.querySelector(".riga-foto");
const strisciaFoto = document.getElementById("strisciafoto");

function arcoBuco(pts, cx, cy, g, a0, a1){
  for(let i = 0; i <= 4; i++){
    const a = a0 + (a1 - a0) * i / 4;
    pts.push([cx + g * Math.cos(a), cy + g * Math.sin(a)]);
  }
}
function poligonoBuco(el, r, raggio){
  const b = el.getBoundingClientRect();
  if(!b.width || !b.height || !r.width || !r.height) return "";
  const O = 160;
  const fuori = [[-O, -O], [b.width + O, -O],
                 [b.width + O, b.height + O], [-O, b.height + O], [-O, -O]];
  const x0 = r.left - b.left, y0 = r.top - b.top,
        x1 = r.right - b.left, y1 = r.bottom - b.top;
  const g = Math.max(0, Math.min(raggio, (x1 - x0) / 2, (y1 - y0) / 2));
  const dentro = [];
  arcoBuco(dentro, x0 + g, y0 + g, g, Math.PI, Math.PI * 1.5);
  arcoBuco(dentro, x1 - g, y0 + g, g, Math.PI * 1.5, Math.PI * 2);
  arcoBuco(dentro, x1 - g, y1 - g, g, 0, Math.PI * 0.5);
  arcoBuco(dentro, x0 + g, y1 - g, g, Math.PI * 0.5, Math.PI);
  dentro.push(dentro[0]);
  return "polygon(evenodd, " + fuori.concat(dentro)
    .map(([x, y]) => x.toFixed(1) + "px " + y.toFixed(1) + "px").join(", ") + ")";
}

const fronteCarta = foglio.querySelector(".fronte");
let finestraAttesa = 0;
function aggiornaFinestra(){
  /* ── E SU SCHERMO LARGO IL BUCO NON SI SCAVA ──────────────────
     Il ritaglio esiste perché sul telefono la carta copre tutta la
     scena: l'unico modo di far vedere il pezzo vero è aprirle un buco.
     Nel pannello a destra il buco darebbe sul pannello, e la scena è già
     tutta lì accanto, intera e girabile. Quindi: niente ritaglio, niente
     prestito di zoom, e la carta si riprende la sua fotografia (lo dice il
     foglio di stile). Il riquadro del pezzo lo fa la macchina
     sull'area visibile, che è quello che già fa. */
  const viva = !larga && carta !== "foto" && !cartaPezzo.hidden
            && !foglio.classList.contains("girata");
  if(!viva){
    veloCarta.style.clipPath = fronteCarta.style.clipPath = "";
    return;
  }
  const r = rigaFoto.getBoundingClientRect();
  veloCarta.style.clipPath   = poligonoBuco(veloCarta, r, 8);
  fronteCarta.style.clipPath = poligonoBuco(fronteCarta, r, 8);
}
/* si rifa' a un fotogramma di distanza e una volta sola per fotogramma:
   l'altezza della carta, la giravolta e lo scorrimento del contenuto
   possono chiamarla tre volte nello stesso battito */
function rifaiFinestra(){
  if(finestraAttesa) return;
  finestraAttesa = requestAnimationFrame(() => {
    finestraAttesa = 0; aggiornaFinestra();
  });
}

const _camProva = new THREE.PerspectiveCamera();
function quadroDelPezzo(){
  _camProva.fov = camera.fov; _camProva.aspect = camera.aspect;
  _camProva.near = camera.near; _camProva.far = camera.far;
  _camProva.up.copy(camera.up);
  _camProva.position.copy(occhioObiettivo);
  _camProva.lookAt(miraObiettivo);
  _camProva.updateMatrixWorld(true);
  _camProva.updateProjectionMatrix();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
             i & 2 ? boxP.max.y : boxP.min.y,
             i & 4 ? boxP.max.z : boxP.min.z).project(_camProva);
    const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  return {x0, y0, x1, y1};
}

const MARGINE_FINESTRA = 0.12;
/* PER QUANTO SI SEGUE IL RIQUADRO. Mezzo secondo è quanto ci mette la
   più lenta delle tre cose che lo muovono (l'altezza della carta, 0,34
   s) più il margine di un'impaginazione. Si conta in secondi di CICLO,
   non con un orologio: il banco di prova pilota il tempo a mano, e un
   `setTimeout` lì non scatterebbe mai. */
const SEGUI_S = 0.52;
let seguiFinestra = 0;
function inquadraNellaFinestra(){
  /* largo non c'è nessuna finestra in cui riquadrare (vedi
     `aggiornaFinestra`): il prestito si restituisce e si esce. Senza
     questa riga la macchina inseguirebbe il rettangolo della fotografia
     DENTRO il pannello, cioè porterebbe il gioiello sotto il pannello. */
  if(larga){ zoomMeta = 1; panMetaX = panMetaY = 0; return false; }
  if(carta === "foto" || cartaPezzo.hidden) return false;
  /* girata, il riquadro sta sulla faccia voltata: il suo rettangolo a
     schermo è specchiato e non vuol dire più niente. L'inquadratura
     resta quella che c'era, e torna giusta quando la carta si rigira. */
  if(foglio.classList.contains("girata")) return false;
  if(livello !== 2 || boxP.isEmpty()) return false;
  const f = rigaFoto.getBoundingClientRect();
  if(f.width < 8 || f.height < 8) return false;
  const p = quadroDelPezzo();
  const largo = Math.max(1, p.x1 - p.x0), alto = Math.max(1, p.y1 - p.y0);
  const utile = 1 - 2 * MARGINE_FINESTRA;
  let z = Math.min(f.width * utile / largo, f.height * utile / alto);
  /* IL FONDO DELLA SCALA STAVA A 0,35 E TAGLIAVA. Misurato sulla collana
     del busto: per starci dentro la finestra ne voleva 0,30, il tetto
     minimo la teneva a 0,35 e il pezzo riempiva l'88 per cento
     dell'altezza — un punto e otto decimi dal bordo alto invece dei
     dodici per cento chiesti. Il limite serve solo contro un riquadro
     degenere (una finestra alta due punti mentre la carta si impagina),
     e per quello 0,15 basta. */
  z = Math.max(0.15, Math.min(4.5, z));
  /* quanti pixel vale un'unita' di mondo sul piano del pezzo, a questo
     ingrandimento: la macchina sta a `d/z` dal bersaglio, e mezza altezza
     di campo lì vale `(d/z)·tan(fov/2)` */
  const d = occhioObiettivo.distanceTo(miraObiettivo) || 0.001;
  const perMondo = z * (innerHeight / 2)
                 / (d * Math.tan(camera.fov * Math.PI / 360));
  /* la proiezione scala attorno al punto mirato, che a spostamento zero
     è il centro dello schermo: il rettangolo del pezzo si allontana dal
     centro esattamente di `z` volte */
  const sx = innerWidth / 2 + ((p.x0 + p.x1) / 2 - innerWidth / 2) * z;
  const sy = innerHeight / 2 + ((p.y0 + p.y1) / 2 - innerHeight / 2) * z;
  zoomMeta = z;
  panMetaX = -((f.left + f.right) / 2 - sx) / perMondo;
  panMetaY =  ((f.top + f.bottom) / 2 - sy) / perMondo;
  sveglia();
  return true;
}

/* ── QUELLO CHE STA SOTTO LA FINESTRA ─────────────────────────────
   In `finestra` una riga sola che apre la galleria — la fotografia non
   si può più toccare, e una galleria senza porta non esiste. In `due`
   le foto VERE in miniatura, che è la stessa porta ma detta con le
   immagini: si vede cosa c'è dentro prima di aprirla. */
function vestiStriscia(){
  if(carta === "foto" || cartaPezzo.hidden){ strisciaFoto.hidden = true; return; }
  if(carta === "finestra"){
    strisciaFoto.innerHTML =
      `<button type="button" class="tutte">${1 + SCATTI.length} fotografie</button>`;
  } else {
    const mini = SCATTI.map(([u]) => scattoDi(u))
      .concat([provino(cartaFam, cartaK, 288, 216)]);
    strisciaFoto.innerHTML = mini.map((u, i) =>
      `<button type="button" class="mini" aria-label="apri la fotografia ${i + 1}">` +
      `<img src="${u}" alt=""></button>`).join("");
  }
  strisciaFoto.hidden = false;
}
strisciaFoto.onclick = () => apriGalleria();

/* il globale scrive l'attributo, poi rimette a posto le due cose che il
   foglio di stile da solo non sa fare: il buco e l'inquadratura */
function applicaCarta(){
  document.documentElement.dataset.carta = carta;
  if(!cartaPezzo.hidden){
    vestiStriscia();
    seguiFinestra = 0;
    if(carta === "foto"){ zoomMeta = 1; panMetaX = panMetaY = 0; }
    else {
      inquadraNellaFinestra();
      /* cambiando variante al volo la carta cambia forma — la finestra
         si stacca dal bordo, la striscia compare, l'altezza si rifa' — e
         per due o tre decimi di secondo il riquadro non è ancora dove
         sarà. Misurato senza questa riga: il pezzo finiva 7 punti SOTTO
         il bordo basso della finestra. Si segue, come all'apertura. */
      seguiFinestra = SEGUI_S;
    }
    misuraCarta();
  }
  aggiornaFinestra();
  sveglia();
}

/* SE IL CONTENUTO SCORRE, IL BUCO LO SEGUE. Coricato — o con una dedica
   lunga — la colonna della carta scorre sotto la finestra: il ritaglio è
   disegnato su coordinate di schermo, e senza questa riga resterebbe
   fermo mentre il riquadro gli scivola via da sotto. */
for(const d of foglio.querySelectorAll(".dentro-carta"))
  d.addEventListener("scroll", rifaiFinestra, {passive:true});

document.getElementById("chiudi-carta").onclick = chiudiCarta;
document.querySelector("#dedica .tutto").onclick = () => giraCarta("dedica-lunga");
addEventListener("resize", () => {
  if(cartaPezzo.hidden) return;
  misuraCarta(); inquadraNellaFinestra(); rifaiFinestra();
});
/* E SI RICONTROLLA A GIRAVOLTA FINITA. Se per qualunque ragione la misura
   è stata presa sulla faccia sbagliata — succede se qualcosa cambia la
   classe fuori da giraCarta — sotto la faccia visibile resta una striscia
   di carta vuota. Alla fine della rotazione si rimisura, e si corregge da
   sola. */
foglio.addEventListener("transitionend", e => {
  if(cartaPezzo.hidden) return;
  if(e.propertyName === "transform") misuraCarta();
  /* e a giravolta finita il buco cambia padrone: girata, la faccia col
     ritaglio è quella nascosta e il retro copre tutto; tornata sul
     fronte, il ritaglio deve riesserci */
  if(e.propertyName === "transform" || e.propertyName === "height")
    rifaiFinestra();
});
/* «porgi» dura 240 ms e per tutto quel tempo la carta è scalata di
   0,965 e spostata di otto punti: il buco del VELO — che non si scala
   con lei, perché il velo è un altro elemento — va rifatto quando la
   carta è arrivata dov'e' */
/* e si prende per id, non per nome: `porta` in questo file è già una
   funzione del caricatore, e la scorciatoia degli id globali qui darebbe
   quella */
document.getElementById("porta").addEventListener("animationend", rifaiFinestra);
cartaPezzo.addEventListener("click", e => { if(e.target.classList.contains("velo")) chiudiCarta(); });

/* ══════════════════════════════════════════════════════════════
   LA GALLERIA — il gesto sta QUI, e non tocca la stanza

   Il pizzico dell'applicazione è agganciato a #stanza, che è la scena
   in tre dimensioni: lì due dita avvicinano la macchina al gioiello, e
   quel gesto non si tocca. La galleria sta SOPRA la stanza, con il suo
   fondo pieno, e i suoi eventi non arrivano mai laggiu': si scrive un
   gestore suo, sui suoi elementi, e le due cose non si incontrano.
   Lo scorrimento nativo con aggancio se ne va per un motivo solo: con
   `touch-action` diverso da `none` il browser si prende il gesto a due
   dita e lo spostamento della foto ingrandita, e non li restituisce. La
   fila si muove allora con un trasformo — che è anche l'unico modo di
   farla scendere insieme al velo quando la si butta giu' per uscire.

   QUATTRO GESTI, uno per ogni cosa che si vuole fare davanti a una
   fotografia di un gioiello:
     · due dita — ingrandisce e sposta insieme, come sulla stanza;
     · doppio tocco — ingrandisce dove hai toccato, per chi ha una mano
       sola (ed è il gesto che tutti provano per secondo);
     · un dito di lato — cambia fotografia, con il lancio che decide;
     · un dito in giu' — esce, e la foto scende col dito mentre il velo
       si schiarisce: si vede dove sta andando prima di lasciare.
   ══════════════════════════════════════════════════════════════ */
const GAL_INGRANDITO = 2.4;      // quanto vale un doppio tocco
const GAL_ESCI = 80;             // punti di caduta che chiudono
let galFoto = [], galI = 0, galZoom = 1, galPx = 0, galPy = 0;
let galDita = new Map(), galPizzico = null, galDito = null, galVerso = null;
let galUltimoTocco = 0, galUltimoDove = null;

const galImg = () => rotaia.children[galI]
  ? rotaia.children[galI].querySelector("img") : null;

function galPosa(quanto){
  rotaia.classList.toggle("posa", quanto !== false);
  rotaia.style.setProperty("--scorri", (-galI * innerWidth) + "px");
}
function galSegnaPunti(){
  for(let i = 0; i < punti.children.length; i++)
    punti.children[i].classList.toggle("qui", i === galI);
}
/* IL LIMITE DELLO SPOSTAMENTO LO DA' L'IMMAGINE, non lo schermo. Una
   fotografia in `object-fit:contain` occupa meno del suo riquadro: usare
   il riquadro lascerebbe trascinare la foto fuori dal campo e poi
   riportarla indietro a vuoto. */
function galFrena(){
  const im = galImg();
  if(!im){ galPx = galPy = 0; return; }
  const lx = Math.max(0, (im.offsetWidth * galZoom - innerWidth) / 2);
  const ly = Math.max(0, (im.offsetHeight * galZoom -
                          im.parentElement.clientHeight) / 2);
  galPx = Math.max(-lx, Math.min(lx, galPx));
  galPy = Math.max(-ly, Math.min(ly, galPy));
}
function galApplica(conPosa){
  const im = galImg();
  if(!im) return;
  im.classList.toggle("posa", !!conPosa);
  im.style.transform = "translate(" + galPx + "px," + galPy + "px) scale(" + galZoom + ")";
  rotaia.classList.toggle("grande", galZoom > 1.05);
}
function galAzzeraZoom(conPosa){
  galZoom = 1; galPx = 0; galPy = 0; galApplica(conPosa);
}

function apriGalleria(){
  /* IL PRIMO SCATTO È QUELLO INDOSSATO. Il render era primo perché è
     fedele e isola l'articolo — che è giusto sulla CARTA, dove serve a
     riconoscere il pezzo. In una galleria si entra per vedere com'e'
     addosso: gli scatti di Regina sono fotografie di gioielli portati, e
     vanno per primi. Il modello resta, ultimo, con la sua didascalia. */
  const modello = [provino(cartaFam, cartaK, 900, 900),
                   "Il modello del pezzo, fedele alle sue misure vere."];
  galFoto = SCATTI.length
    ? SCATTI.map(([u, d]) => [scattoDi(u), d]).concat([modello]) : [modello];
  rotaia.innerHTML = galFoto.map(([u, d]) =>
    `<figure><img src="${u}" alt=""><figcaption>${d}</figcaption></figure>`).join("");
  punti.innerHTML = galFoto.map((_, i) =>
    `<i${i === 0 ? ' class="qui"' : ""}></i>`).join("");
  galI = 0; galAzzeraZoom(false);
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  galPosa(false);
  accogli(galleria);
  /* stessa regola della carta: il fuoco va sul contenitore, non sulla X.
     Sulla X compariva l'anello turchese sopra la fotografia. */
  requestAnimationFrame(() => { if(!galleria.hidden) galleria.focus(); });
}
/* la galleria usciva in 6 millisecondi misurati. Esce con lo stesso
   congedo di tutto il resto, e con un soffio di scala in più: è una
   cosa a schermo pieno, e le cose grandi si allontanano andandosene. */
function chiudiGalleria(){
  if(galleria.hidden) return;
  galDita.clear(); galPizzico = null; galDito = null; galVerso = null;
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  congeda(galleria, () => { galAzzeraZoom(false); });
  /* il fuoco torna sulla fotografia da cui si era partiti: è l'unico
     posto da cui la galleria si apre, ed è lì che ci si aspetta di
     ritrovarsi */
  if(!cartaPezzo.hidden) ritratto.focus();
}

const galMisura = () => {
  const d = [...galDita.values()];
  return {d: Math.hypot(d[0].x - d[1].x, d[0].y - d[1].y),
          mx: (d[0].x + d[1].x) / 2, my: (d[0].y + d[1].y) / 2};
};

galleria.addEventListener("pointerdown", e => {
  if(e.target.closest("#chiudi-galleria")) return;
  galDita.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { galleria.setPointerCapture(e.pointerId); } catch(_) {}
  if(galDita.size === 2){
    galDito = null; galVerso = null;
    const m = galMisura();
    galPizzico = {d:m.d, mx:m.mx, my:m.my, z:galZoom, px:galPx, py:galPy};
    rotaia.classList.remove("posa");
    return;
  }
  if(galDita.size > 1) return;
  galDito = {x:e.clientX, y:e.clientY, t:performance.now(),
             px:galPx, py:galPy, mosso:0};
  galVerso = null;
  rotaia.classList.remove("posa");
});

galleria.addEventListener("pointermove", e => {
  if(galDita.has(e.pointerId)) galDita.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(galPizzico && galDita.size === 2){
    const m = galMisura();
    galZoom = Math.max(1, Math.min(5, galPizzico.z * (m.d / Math.max(24, galPizzico.d))));
    /* IL PUNTO DI MEZZO È UN'ANCORA, non uno spostamento a parte: la
       foto deve restare sotto le dita mentre cresce, se no sembra che
       scivoli via. Si tiene fermo il punto dell'immagine che stava sotto
       il centro del pizzico, e lo spostamento è la differenza. */
    const s = galZoom / galPizzico.z;
    galPx = galPizzico.px * s + (m.mx - galPizzico.mx) -
            (galPizzico.mx - innerWidth / 2) * (s - 1);
    galPy = galPizzico.py * s + (m.my - galPizzico.my) -
            (galPizzico.my - innerHeight / 2) * (s - 1);
    galFrena();
    galApplica(false);
    return;
  }

  if(!galDito) return;
  const dx = e.clientX - galDito.x, dy = e.clientY - galDito.y;
  galDito.mosso = Math.max(galDito.mosso, Math.hypot(dx, dy));

  /* A FOTO INGRANDITA IL DITO SPOSTA, E BASTA. Cambiare fotografia
     mentre se ne sta guardando un dettaglio non è quello che si sta
     chiedendo: si esce dall'ingrandimento, semmai, col doppio tocco. */
  if(galZoom > 1.05){
    galPx = galDito.px + dx; galPy = galDito.py + dy;
    galFrena(); galApplica(false);
    return;
  }

  /* L'ASSE SI DECIDE UNA VOLTA SOLA, al primo movimento vero: deciderlo
     a ogni evento farebbe cambiare gesto a metà strada, e un gesto che
     cambia natura sotto il dito è il difetto che si legge come
     «scattoso». */
  if(!galVerso && Math.hypot(dx, dy) > 10)
    galVerso = Math.abs(dx) > Math.abs(dy) ? "lato" : "giu";

  if(galVerso === "lato"){
    /* ai capi la stessa gomma della fila di espositori: oltre la prima e
       oltre l'ultima la rotaia resiste e torna */
    let d = dx;
    if((galI === 0 && dx > 0) || (galI === galFoto.length - 1 && dx < 0)) d = dx * 0.35;
    rotaia.style.setProperty("--scorri", (-galI * innerWidth + d) + "px");
  } else if(galVerso === "giu"){
    const g = Math.max(0, dy);
    galleria.style.setProperty("--giu", g + "px");
    /* IL VELO SI SCHIARISCE MENTRE SCENDE. È l'unica cosa che dice
       «stai uscendo» prima che si lasci: senza, il gesto è una scommessa
       — o si chiude, o torna su, e non si sa quale delle due finché non
       è successo. */
    galleria.style.setProperty("--velo",
      String(Math.max(0.28, 1 - g / (innerHeight * 0.7))));
  }
});

const galLascia = e => {
  galDita.delete(e.pointerId);
  if(galDita.size < 2 && galPizzico){
    galPizzico = null;
    /* sotto un ingrandimento minimo si torna al posto: restare al 103
       per cento è un residuo, non una scelta — stessa regola del
       pizzico della stanza */
    if(galZoom < 1.06) galAzzeraZoom(true);
    return;
  }
  if(!galDito) return;
  const dx = e.clientX - galDito.x, dy = e.clientY - galDito.y;
  const dt = Math.max(16, performance.now() - galDito.t);
  const mosso = galDito.mosso;
  const verso = galVerso;
  galDito = null; galVerso = null;

  if(verso === "giu"){
    galleria.style.removeProperty("--giu");
    galleria.style.removeProperty("--velo");
    if(dy > GAL_ESCI || (dy > 24 && dy / dt * 1000 > 700)){ chiudiGalleria(); return; }
    return;
  }
  if(verso === "lato"){
    const lancio = Math.abs(dx) / dt * 1000 > 420;
    if((Math.abs(dx) > innerWidth * 0.22 || lancio) && Math.abs(dx) > 12)
      galI = Math.max(0, Math.min(galFoto.length - 1, galI - Math.sign(dx)));
    galPosa(true);
    galSegnaPunti();
    galAzzeraZoom(false);
    return;
  }

  /* IL DOPPIO TOCCO. Due tocchi fermi entro trecento millisecondi e
     trenta punti: fermi, perché due colpetti dati mentre si scorre non
     sono un doppio tocco, sono uno scorrimento con un rimbalzo. */
  if(mosso < 10){
    const ora = performance.now();
    const vicino = galUltimoDove &&
      Math.hypot(e.clientX - galUltimoDove.x, e.clientY - galUltimoDove.y) < 30;
    if(ora - galUltimoTocco < 300 && vicino){
      galUltimoTocco = 0; galUltimoDove = null;
      if(galZoom > 1.05) galAzzeraZoom(true);
      else {
        galZoom = GAL_INGRANDITO;
        /* si ingrandisce DOVE si è toccato: il punto sotto il dito resta
           sotto il dito, che è quello che si chiede quando si batte due
           volte su un dettaglio */
        galPx = -(e.clientX - innerWidth / 2) * (galZoom - 1);
        galPy = -(e.clientY - innerHeight / 2) * (galZoom - 1);
        galFrena(); galApplica(true);
      }
      return;
    }
    galUltimoTocco = ora;
    galUltimoDove = {x:e.clientX, y:e.clientY};
  }
  galPosa(true);
};
galleria.addEventListener("pointerup", galLascia);
galleria.addEventListener("pointercancel", e => {
  galDita.delete(e.pointerId); galPizzico = null; galDito = null; galVerso = null;
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  galPosa(true);
});
addEventListener("resize", () => { if(!galleria.hidden){ galPosa(false); galApplica(false); } });

document.getElementById("chiudi-galleria").onclick = chiudiGalleria;
ritratto.onclick = apriGalleria;
ritratto.onkeydown = e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); apriGalleria(); }
};
/* ── SE LA FOTOGRAFIA NON ARRIVA ──────────────────────────────────
   Un <img> che non carica lascia l'icona di immagine rotta del browser:
   un blocco con dentro un simbolo che non è nostro, in cima a una carta
   di gioielleria. È la stessa bugia già corretta nella lista della
   collezione, dove i pezzi che mancano hanno un riquadro di filo e non
   un rettangolo grigio. Qui il riquadro si spegne e resta un posto
   disegnato che dice che la fotografia arrivera'. */
ritratto.onerror = () => {
  document.querySelector(".riga-foto").classList.add("senza-foto");
  if(!cartaPezzo.hidden) misuraCarta();
};

/* ── LE CARTE SI FANNO DA PARTE, NON SPARISCONO ──────────────────
   Anche qui c'era il taglio netto: `innerHTML = ""` e le due carte
   svanivano nello stesso fotogramma, mentre erano entrate con i loro
   340 millisecondi di dissolvenza. Ma c'è un caso in cui il taglio
   serve: quando le carte si RIFANNO subito dopo — aprendo un pezzo
   nuovo — perché una dissolvenza differita cancellerebbe le carte
   appena messe. Quindi il congedo ha due modi, e chi chiama sceglie. */
/* ── E ADESSO I CONTENITORI SONO TRE ──────────────────────────────
   Le carte in scena, la riga in alto e il rail nella scheda sono tre
   DISEGNI dello stesso dato. Si costruiscono tutti e tre insieme (sono
   due voci: costa niente) e a decidere chi si vede è `segnaSugg`. Così
   cambiare variante al volo non ricostruisce niente — accende un
   contenitore e ne spegne un altro, ognuno con la sua dissolvenza — e
   non c'è nessun fotogramma in cui la scena salta. */
const rigaSugg = document.getElementById("riga-sugg");
const railSugg = document.getElementById("rail-sugg");

function togliInsieme(subito){
  const vuota = () => { ancore = []; accanto.innerHTML = ""; raggioQuadro = 0;
                        rigaSugg.innerHTML = ""; railSugg.innerHTML = "";
                        misuraCarte(); };
  insieme.hidden = true;
  const vivi = [accanto, rigaSugg, railSugg].filter(e => !e.hidden);
  if(subito || !vivi.length){
    vuota(); for(const e of vivi){ e.classList.remove("qui"); e.hidden = true; }
    return;
  }
  let restano = vivi.length;
  for(const e of vivi){
    e.classList.remove("qui");
    congeda(e, () => { if(--restano === 0){ vuota(); segnaSugg(); } }, true);
  }
}

/* ── UNA FORMA SOLA PER VOLTA ─────────────────────────────────────
   L'insieme si dice in due modi: le CARTE agganciate al pezzo nello
   spazio, e la LISTA «Con questo ci sta anche» dentro la scheda. Sono
   due disegni dello stesso dato, e comparivano insieme: aprendo la
   scheda si leggevano gli stessi due nomi e gli stessi due prezzi in due
   posti diversi, uno sopra l'altro, con le carte che per giunta finivano
   coperte dalla scheda che si era appena alzata.
   Quando la scheda è aperta parla la lista; quando è ritirata parlano
   le carte. Il tasto dei suggerimenti resta sopra tutti e due: se sono
   spenti, sono spenti.
   LA REGOLA VALE SOLO DOVE HA SENSO. Nella variante (a) il suggerimento
   sta nel cromo in alto, dall'altra parte dello schermo rispetto alla
   scheda: non c'è niente da cui farsi da parte. Nella (c) il rail È la
   scheda, quindi non può nascondersi quando la scheda si apre — sparisce
   invece la lista, che lì sarebbe il doppione (la fa sparire il foglio
   di stile, sotto `[data-sugg="c"]`). */
function mostraOnasconde(el, vuoi){
  if(!el) return;
  if(vuoi){
    accogli(el);
    /* il `.qui` arriva un fotogramma dopo: da `display:none` a visibile
       non c'è transizione se il valore cambia nello stesso stile
       ricalcolato, e il contenitore comparirebbe di scatto */
    requestAnimationFrame(() => { if(!el.hidden) el.classList.add("qui"); });
  } else if(!el.hidden){
    el.classList.remove("qui");
    congeda(el, null, true);
  }
}
function segnaSugg(){
  const acceso = vuoleInsieme && ancore.length > 0;
  const schedaAperta = livello === 2 && !fondo.classList.contains("ritirato");
  /* E CON LA CARTA APERTA LE CARTE IN SCENA SE NE VANNO. Finché la carta
     era un rettangolo opaco a schermo intero la cosa non si vedeva —
     erano dietro — ma con la finestra c'è un buco, e dal buco si vedeva
     spuntare un cartoncino del suggerimento dentro l'inquadratura del
     pezzo. Dalla finestra si deve vedere la STANZA, non il cromo. */
  mostraOnasconde(accanto,  acceso && sugg === "b" && !schedaAperta
                            && cartaPezzo.hidden);
  mostraOnasconde(rigaSugg, acceso && sugg === "a");
  mostraOnasconde(railSugg, acceso && sugg === "c");
}
/* il globale scrive l'attributo e basta: il disegno delle tre forme sta
   già nel foglio di stile, e chi si vede lo dice `segnaSugg`. */
function applicaSugg(){
  document.documentElement.dataset.sugg = sugg;
  segnaSugg();
  sveglia();
}

function mostraInsieme(){
  const lista = INSIEME[attiva] || [];
  if(!lista.length) return;
  /* GLI ASSI SONO QUELLI DI DOPO. Letti dalla matrice della macchina qui
     sono ancora quelli della vista dell'espositore: la macchina si sposta
     sul pezzo con una molla e ci mette qualche fotogramma. La posizione
     finale la dicono giro e alzata, e si scrive a mano. */
  const cg = Math.cos(giroP), sg = Math.sin(giroP);
  const ca = Math.cos(altP), sa = Math.sin(altP);
  _dx.set(cg, 0, -sg);
  _dy.set(-sa * sg, ca, -sa * cg);
  const righe = [], righeSugg = [], cardRail = [];
  for(const [fam, k] of lista){
    const r = (RIPIANI[fam] || [])[k];
    if(!r) continue;
    const [ax, ay] = DOVE_ADDOSSO[fam] || [0.9, 0.8];
    /* PIÙ LARGO SUL PEZZO STESO. Un pezzo che sta in piedi occupa una
       colonna stretta e le carte gli stanno di fianco; uno steso occupa
       tutta la larghezza, e a 1,12 raggi la carta dell'Anello Cabochon
       finiva SOPRA la collana, coprendogliene metà. */
    const d = raggioP * (stesa(attiva, scelto) ? 2.60 : 1.12);
    const punto = new THREE.Vector3().copy(centroP)
      .addScaledVector(_dx, ax * d).addScaledVector(_dy, ay * d);
    const el = document.createElement("div");
    el.className = "carta";
    /* la carta si porta dietro CHI È: senza, quando il provino arriva
       dopo non c'è modo di sapere quale fotografia le tocca, e resterebbe
       vuota per sempre (vedi `ripassaCarteSenzaFoto`) */
    el.dataset.fam = fam; el.dataset.k = String(k);
    const foto = provino(fam, k);
    /* IL TESTO STA IN UN BLOCCO SUO. Serve alla variante (b): il letto
       scuro che risolve il contrasto va messo dietro le TRE RIGHE, non
       sotto tutta la carta — e per metterlo dietro tre righe, le tre
       righe devono essere una cosa sola. */
    el.innerHTML = (foto ? `<img src="${foto}" alt="">` : "") +
                   `<div class="dice"><i>${FAMIGLIE.find(f => f.id === fam).nome}</i>` +
                   `<b>${r[0]}</b><span>${r[2]} €</span></div>`;
    /* E IL SUGGERIMENTO PORTA DOVE DICE. È un cartoncino, non un
       bottone — il disegno non cambia — ma per chi naviga con la
       tastiera o col lettore di schermo deve DICHIARARSI un comando,
       se no è un rettangolo muto che non si raggiunge mai. */
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.setAttribute("aria-label", "vai a " + r[0] + ", " + r[2] + " euro");
    el.onclick = () => vaiAlPezzo(fam, k);
    el.onkeydown = ev => {
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); vaiAlPezzo(fam, k); }
    };
    accanto.appendChild(el);
    ancore.push({p:punto, el, x:null, y:null, lato:-1});
    righe.push(`<div class="r"><b>${r[0]}</b><span>${r[2]} €</span></div>`);

    /* ── (a) LA RIGA IN ALTO ─────────────────────────────────────
       Niente miniatura e niente pannello: il nome e il prezzo, in
       maiuscoletto, toccabili. Il puntino che li separa non è un
       tasto e non si tocca. */
    /* IL PUNTINO SE N'E' ANDATO. Serviva a separare due parole in fila;
       fra due capsule il separatore è lo spazio fra le capsule, e un
       carattere di punteggiatura in mezzo diventa un terzo oggetto che
       non è né l'una né l'altra. */
    righeSugg.push(
      `<button type="button" class="capsula" data-fam="${fam}" data-k="${k}" ` +
      `aria-label="vai a ${r[0]}, ${r[2]} euro">${r[0]} ` +
      `<em>${r[2]} €</em></button>`);

    /* ── (c) IL RAIL NELLA SCHEDA ────────────────────────────────
       La card del Cofanetto in piccolo: foto 4:5, nome, prezzo. Il
       provino può non essere ancora pronto — si mette allora un posto
       vuoto disegnato, come nella lista della collezione, e non un
       <img> senza sorgente che il browser marca come rotto. */
    cardRail.push(
      `<button type="button" class="card" data-fam="${fam}" data-k="${k}" ` +
      `aria-label="vai a ${r[0]}, ${r[2]} euro">` +
      (foto ? `<img src="${foto}" alt="">` : '<span class="vuota"></span>') +
      /* nome e prezzo stanno in un blocco loro: in piedi non cambia
         niente, coricato è quel blocco a mettersi di fianco alla foto */
      `<span class="dati"><span class="n">${r[0]}</span>` +
      `<span class="p">${r[2]} €</span></span></button>`);
  }
  accanto.classList.toggle("steso", !!stesa(attiva, scelto));
  if(!ancore.length){ segnaSugg(); return; }
  rigaSugg.innerHTML = '<span class="eco">Con questo</span>' + righeSugg.join("");
  railSugg.innerHTML = cardRail.join("");
  /* un gestore solo per contenitore: il bersaglio porta con se' famiglia
     e indice, e non c'è una chiusura per ogni card da tenere in vita */
  for(const c of [rigaSugg, railSugg]) c.onclick = ev => {
    const b = ev.target.closest("button[data-fam]");
    if(b) vaiAlPezzo(b.dataset.fam, +b.dataset.k);
  };
  segnaSugg();
  /* le carte stanno SOPRA la scena, non dentro: l'inquadratura non si
     allarga più — ed è anche il motivo per cui l'orizzonte non rientra */
  requestAnimationFrame(() => ancore.forEach(a => a.el.classList.add("qui")));
  misuraCarte();
  document.getElementById("insieme-righe").innerHTML = righe.join("");
  insieme.hidden = false;
}

/* ── LE CARTE SI RIEMPIONO QUANDO LA FOTOGRAFIA ARRIVA ────────
   Le famiglie scendono a tappe, e il suggerimento ATTRAVERSA le famiglie:
   è il suo mestiere - «con questo ci sta anche l'Anello Cabochon». Chi
   apre un pezzo nel primo secondo trova quindi carte i cui provini non
   esistono ancora: la carta in scena nasce senza `<img>`, quella del rail
   col posto vuoto disegnato. Fin qui è giusto - un `<img>` senza sorgente
   il browser lo marca come rotto. Sbagliato era che restassero così
   finché non si richiudeva e riapriva il pezzo: il provino arrivava
   trenta secondi dopo e nessuno andava a dirglielo.
   Glielo dice la coda dei provini, a fine turno di ogni famiglia. Si
   guarda solo nella DISPENSA e non si chiama `provino`: chiamarlo
   scatterebbe la fotografia qui, cioè un fotogramma pagato per intero
   dentro un ripasso che deve costare niente - e per le carte visibili la
   dispensa a fine turno ce l'ha già.
   L'immagine non entra di scatto: `.arriva` le da' la tacca d'ingresso
   del resto dell'applicazione. */
function ripassaCarteSenzaFoto(){
  if(!ancore.length) return 0;
  let messe = 0;
  const riempi = el => {
    const fam = el.dataset.fam, k = el.dataset.k;
    if(!fam || k === undefined || el.querySelector("img")) return;
    /* la stessa chiave che `provino` userebbe con le sue misure di serie:
       288x216 è quella che il rail e la carta in scena chiedono */
    const foto = provinoDi[fam + ":" + k + ":288x216"];
    if(!foto) return;
    const img = document.createElement("img");
    img.src = foto; img.alt = ""; img.className = "arriva";
    const posto = el.querySelector(".vuota");
    if(posto) posto.replaceWith(img);
    else el.insertBefore(img, el.firstChild);
    messe++;
  };
  for(const el of accanto.querySelectorAll(".carta")) riempi(el);
  for(const el of railSugg.querySelectorAll("button.card")) riempi(el);
  return messe;
}
window.__ripassaCarte = ripassaCarteSenzaFoto;

/* si riproiettano a ogni fotogramma: sono agganciate a un punto dello
   spazio, e lo spazio si muove sotto di loro */
function seguiCarte(){
  /* e si riproiettano SOLO nella variante che le usa: nelle altre due le
     carte sono costruite ma il contenitore è spento, e riproiettarle a
     ogni fotogramma sarebbe lavoro di impaginazione per niente */
  if(!ancore.length || sugg !== "b" || accanto.hidden) return;
  // il rettangolo che il pezzo occupa sullo schermo, adesso
  let quadro = null;
  if(livello === 2 && !boxP.isEmpty()){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for(let i = 0; i < 8; i++){
      _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
               i & 2 ? boxP.max.y : boxP.min.y,
               i & 4 ? boxP.max.z : boxP.min.z).project(camera);
      const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
      const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
      y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
    }
    // un filo d'aria attorno al pezzo: appoggiate al bordo si leggono
    // ancora come una cosa che gli sta sopra
    quadro = {x0: x0 - 8, y0: y0 - 8, x1: x1 + 8, y1: y1 + 8};
  }
  /* ── DOVE POSSONO CADERE LE CARTE ────────────────────────────────
     Il recinto era: da 50 punti sotto il bordo alto fino al filo del
     cartellino, e per la larghezza tutto lo schermo. Su schermo largo il
     cartellino È il pannello e il suo `top` vale zero: preso alla lettera
     il recinto verticale si chiudeva in negativo e le carte finivano
     incastrate in cima. Il recinto è l'area visibile, misurata: sotto la
     barra dei reparti, sopra il fondo, e a sinistra del pannello. */
  const au = areaUtile();
  /* ── E LA MISURA DELLA CARTA NON SI RILEGGE OGNI FOTOGRAMMA ─────
     Erano tre sincronizzazioni di layout per fotogramma per ogni carta —
     `offsetWidth`, `offsetHeight` e il filo del cartellino — contate col
     banco _F_ mentre il dito girava il gioiello: 270 letture in 90
     fotogrammi. Su un telefono ognuna è un'impaginazione forzata in
     mezzo al gesto, e sono tre proprio nel momento in cui il ciclo non
     deve fare altro che disegnare.
     Una carta cambia misura in due soli momenti — quando nasce e quando
     le arriva il provino — e tutti e due li dice un `ResizeObserver`
     (vedi `misuraCarte`). Il filo del cartellino lo porta già la banda,
     misurata con lei. */
  for(const a of ancore){
    const el = a.el;
    if(a.w === undefined){ a.w = el.offsetWidth; a.h = el.offsetHeight; }
    const l = a.w / 2, alt = a.h / 2;
    const cielo = larga ? au.y0 + alt + 12 : alt + 50;
    const suolo = larga ? au.y1 - alt - 12
                        : (au.giuCartello !== undefined ? au.giuCartello : au.y1)
                          - alt - 20;
    const manca = larga ? au.x0 + l + 12 : l + 12;
    const dritta = larga ? au.x1 - l - 12 : innerWidth - l - 12;

    /* ── LA CARTA ORBITA, NON SALTA ───────────────────────────────────
       Era agganciata a un PUNTO del mondo — dove il pezzo suggerito
       starebbe addosso — e proiettata sullo schermo fotogramma per
       fotogramma. Girando il gioiello quel punto gli passa DIETRO, la
       carta finiva addosso al pezzo, e la spinta che la scacciava dal
       riquadro cambiava lato di colpo: misurato, 55 pixel di salto fra due
       fotogrammi e diciassette strappi in un solo giro di dito. «Scattano
       e saltano in maniera troppo netta», ed era vero.
       Del punto si tiene la DIREZIONE, non la posizione: da dove sta il
       pezzo, verso dove starebbe il suggerimento. La carta si mette su
       quella direzione, appena fuori dal riquadro del gioiello. Girando,
       la direzione ruota piano e la carta gli gira intorno — resta un
       insieme, e non attraversa mai il pezzo. */
    let cx = innerWidth / 2, cy = innerHeight * 0.42, rx = 90, ry = 90;
    if(quadro){
      cx = (quadro.x0 + quadro.x1) / 2; cy = (quadro.y0 + quadro.y1) / 2;
      rx = (quadro.x1 - quadro.x0) / 2; ry = (quadro.y1 - quadro.y0) / 2;
    }
    _pr.copy(a.p).project(camera);
    let ux = (_pr.x * 0.5 + 0.5) * innerWidth - cx;
    let uy = (-_pr.y * 0.5 + 0.5) * innerHeight - cy;
    const m = Math.hypot(ux, uy) || 1;
    ux /= m; uy /= m;
    // la direzione si muove piano: è lei l'unica cosa che cambia
    if(a.ux === undefined){ a.ux = ux; a.uy = uy; }
    else {
      a.ux += (ux - a.ux) * 0.05; a.uy += (uy - a.uy) * 0.05;
      const q = Math.hypot(a.ux, a.uy) || 1; a.ux /= q; a.uy /= q;
    }
    /* QUANTO LONTANO, e da che parte si scavalca il pezzo. Per non
       toccarlo basta scavalcarlo su UN asse: o la carta sta tutta di
       fianco al suo riquadro, o tutta sopra o sotto. Le due distanze non
       sono la stessa cosa, e la prima versione le confondeva prendendo il
       massimo di due prodotti — un conto senza senso, che lasciava la
       carta addosso all'anello.
       Su un telefono si scavalca in VERTICALE: la larghezza non c'è
       (trecentonovanta punti, un anello che ne occupa centosessanta al
       centro e una carta che ne vuole centodiciotto), l'altezza si'. Se
       nemmeno sopra o sotto ci sta, si prova di fianco; e se non ci sta da
       nessuna parte c'è il tasto per spegnerle. */
    const perAsse = (r, mezzo, comp) =>
      (r + mezzo + 12) / Math.max(Math.abs(comp), 0.25);
    const dv = perAsse(ry, alt, a.uy), dh = perAsse(rx, l, a.ux);
    const dentroV = y => y > cielo && y < suolo;
    const dentroH = x => x > manca && x < dritta;
    /* e su schermo largo si scavalca in ORIZZONTALE, che è il rovescio
       esatto del ragionamento fatto per il telefono: lì la larghezza non
       c'era e l'altezza si'; qui, a 1440 meno il pannello, restano 1.080
       punti di scena contro 854 di altezza, e le due carte trovano posto
       una per lato del gioiello invece di impilarsi sopra e sotto. */
    let d = larga ? dh : dv;
    if(larga){
      if(!dentroH(cx + a.ux * dh) && dentroV(cy + a.uy * dv)) d = dv;
    } else if(!dentroV(cy + a.uy * dv) && dentroH(cx + a.ux * dh)) d = dh;
    let tx = Math.min(dritta, Math.max(manca, cx + a.ux * d));
    let ty = Math.min(suolo, Math.max(cielo, cy + a.uy * d));

    /* e ci arriva scivolando: la posizione è un bersaglio, non un ordine */
    if(a.x === null){ a.x = tx; a.y = ty; }
    else { a.x += (tx - a.x) * 0.10; a.y += (ty - a.y) * 0.10; }
    /* E SI SCRIVE SOLO SE CAMBIA. Una posizione che si avvicina al
       bersaglio del dieci per cento per fotogramma arriva a un decimo di
       punto e poi continua a muoversi di millesimi: riscrivere `left` e
       `top` con lo stesso valore arrotondato è lavoro di impaginazione
       regalato al browser, per sempre, anche a scena ferma. Mezzo punto
       è metà del più piccolo passo che uno schermo a due punti per
       pixel sappia mostrare. */
    const px = Math.round(a.x * 2) / 2, py = Math.round(a.y * 2) / 2;
    if(px !== a.px){ a.px = px; el.style.left = px + "px"; }
    if(py !== a.py){ a.py = py; el.style.top = py + "px"; }
  }
}
/* le carte si rimisurano quando cambiano davvero: nascono senza
   fotografia e il provino arriva dopo, e quello è l'unico momento in cui
   l'altezza si muove. */
let occhiCarte = null;
function misuraCarte(){
  if(!window.ResizeObserver) return;
  if(!occhiCarte) occhiCarte = new ResizeObserver(voci => {
    for(const v of voci){
      const a = ancore.find(x => x.el === v.target);
      if(a){ a.w = v.target.offsetWidth; a.h = v.target.offsetHeight; }
    }
  });
  occhiCarte.disconnect();
  for(const a of ancore){ a.w = undefined; occhiCarte.observe(a.el); }
}

/* ══════════════════════════════════════════════════════════════
   IL GESTO DEL GIOIELLIERE — l'espositore si DISSOLVE

   È il momento che dovrebbe essere il più bello dell'applicazione: il
   pezzo viene fuori dalla vetrina e te lo mettono in mano. Misurato prima
   di questo blocco: le mesh visibili dell'espositore passavano da tutte a
   ZERO al fotogramma zero — mentre la macchina, lei, ci metteva ancora
   667 millisecondi ad arrivare. Il mobile non si toglieva di mezzo:
   spariva, e il pezzo restava sospeso nel buco che aveva lasciato.
   Un gioielliere non fa sparire la vetrina. Tira fuori il pezzo, e la
   vetrina resta dietro finché non conta più. Qui l'espositore si spegne
   nello stesso tempo del volo, con la stessa curva morbida del colore
   delle vesti, e tornando indietro rientra allo stesso modo.

   DUE TRAPPOLE, e tutte e due si vedono solo con la passata di sfocatura
   accesa:
   · un materiale trasparente che continua a SCRIVERE LA PROFONDITA'
     lascia la sua sagoma nel buffer che il fuoco legge — il pezzo dietro
     viene sfocato come se avesse davanti un vetro, e attorno restano
     righe e buchi. Quindi `depthWrite:false` per tutta la dissolvenza, e
     si rimette com'era alla fine;
   · `transparent` fa parte della chiave con cui three.js sceglie il
     programma: cambiata senza `needsUpdate` il materiale resta compilato
     come opaco e l'opacita' non si vede affatto.
   ══════════════════════════════════════════════════════════════ */
/* DURA MENO DEL VOLO, E DEVE. Erano 0,42 s: misurato, l'espositore
   spariva a 433 ms su un volo che ne dura 600, cioè al 72 per cento
   della strada — il pezzo si «staccava» quando era già quasi arrivato,
   e il mobile gli restava addosso per tutto il viaggio. A 0,30 sparisce
   a 300 ms, cioè a metà volo: il gioiello si stacca MENTRE si avvicina,
   che è il gesto del gioielliere che lo tira fuori. */
const VELA_S = 0.30;
let velaLista = [], velaContro = [], velaT = 1, velaVerso = 0;

// le mesh dell'espositore: tutto quello che è acceso e NON è il pezzo
// che si sta portando davanti
function mesiEspositore(gruppo, tieni){
  const out = [];
  gruppo.traverse(o => {
    if(!o.isMesh || !o.material || !o.visible) return;
    let n = o, suo = false;
    while(n){ if(n === tieni){ suo = true; break; } n = n.parent; }
    if(!suo) out.push(o);
  });
  return out;
}
// rimettere il materiale com'era è un passo a se': una vela nuova che
// parte mentre la vecchia corre lascerebbe i materiali di prima
// trasparenti e senza profondita' per sempre
function rendiMateriali(lista){
  for(const o of lista){
    const m = o.material;
    if(!m || m.__opBase === undefined) continue;
    m.opacity = m.__opBase;
    if(m.transparent !== m.__trBase){ m.transparent = m.__trBase; m.needsUpdate = true; }
    m.depthWrite = m.__dwBase;
    o.renderOrder = 0;
  }
}
/* le mesh di un oggetto solo: serve per la CONTROVELA, cioè la posa */
function mesiDi(o){
  const out = [];
  o.traverse(m => { if(m.isMesh && m.material) out.push(m); });
  return out;
}
/* ── LA VELA HA DUE METÀ ────────────────────────────────────────
   `lista` è chi segue il verso, `contro` chi fa l'opposto nello stesso
   istante. Serve per le famiglie con la posa: il busto si spegne e la
   collana stesa si accende, sulla stessa curva e nello stesso tempo. Con
   la posa accesa di colpo a opacita' piena — com'era — nel fotogramma
   del tocco il gioiello compariva 354 punti più in basso di dov'era, e
   quello è il salto che il cliente ha visto. */
function avviaVela(lista, verso, contro){
  if(velaVerso){ rendiMateriali(velaLista); rendiMateriali(velaContro); }
  velaLista = lista; velaContro = contro || []; velaVerso = verso;
  velaT = verso < 0 ? 1 : 0;
  for(const o of velaLista.concat(velaContro)){
    const m = o.material;
