    try { document.execCommand("copy"); poi(); } catch(_) {}
    a.remove();
  };

  /* ── RIMUOVI ───────────────────────────────────────────────────
     Il tasto rosso chiude la carta, spegne il pezzo nella scena e lo
     dice in basso con cinque secondi per cambiare idea. Cinque e non
     quattro: e' l'unica azione di tutta l'applicazione che toglie
     qualcosa, e chi la sbaglia col pollice deve avere il tempo di
     accorgersene DOPO aver visto la scena senza il pezzo — cioe' dopo
     che la carta se n'e' andata e la macchina e' tornata indietro. */
  const faiRimuovi = () => {
    const fam = cartaFam, k = cartaK;
    const nome = ((RIPIANI[fam] || [])[k] || [""])[0];
    chiudiCarta();
    TOLTI.add(fam + ":" + k);
    if(livello === 2 && attiva === fam && scelto === k) indietro();
    else { applicaTolti(); if(livello === 1 && attiva === fam) mostraScheda(); }
    sveglia();
    mostraToast("Tolto dal cofanetto · " + nome, {
      durata: 5000, etichetta: "annulla",
      disfa: () => {
        TOLTI.delete(fam + ":" + k);
        const o = (merci[fam] || [])[k];
        /* si riaccendono solo le mesh della MERCE. La posa stesa resta
           spenta: al banco e in famiglia lo e' sempre, e in selezione la
           riaccende `isolaPezzo` quando serve. Riaccenderla qui
           lascerebbe una collana distesa sul bancone. */
        if(o) o.traverse(m => { if(m.isMesh) m.visible = true; });
        if(livello === 1 && attiva === fam) mostraScheda();
        sveglia();
      }});
  };

  if(fa === "dedica"){
    T.textContent = "La dedica";
    S.textContent = schedaDi(cartaFam, cartaK).da
      ? "Scritta da " + schedaDi(cartaFam, cartaK).da : "";
    N.innerHTML = "<b>« " + schedaDi(cartaFam, cartaK).dedica + " »</b>";
    tasti([["torna alla carta"]]);
  } else if(fa === "regala"){
    T.textContent = "Regala " + r[0];
    S.textContent = "Fai inquadrare questo codice dal telefono di chi lo " +
                    "riceve. Il pezzo entra nella sua collezione ed esce " +
                    "dalla tua, nello stesso istante.";
    /* E QUI NON SI DICE CHE SI PUO' RIGIRARE. Il testo prometteva «si
       puo' regalare a sua volta», e il sistema fa l'opposto: chi riceve un
       pezzo in regalo non trova il tasto Regala, per il principio etico
       che Massimo ha fissato. Un dono che rimbalza non e' un dono. */
    conQR("<b>Un pezzo ricevuto in regalo non chiude una collezione.</b> " +
          "Entra nel cofanetto, si vede, si indossa, resta suo — ma non " +
          "si rigira, e per il pezzo che chiude non conta. Altrimenti " +
          "basterebbe passarsi gli stessi quattro pezzi fra amici.");
    /* DUE USCITE IDENTICHE, DI CUI UNA MORTA. C'erano «annulla» e «torna
       alla carta»: due tasti affiancati che avrebbero fatto la stessa
       identica cosa — rimettere la carta sul fronte — se non che il
       primo non aveva gestore e non faceva niente. Non c'e' nessuna
       azione in corso da annullare: mostrare un codice non e' una
       procedura, e' una schermata. Il doppione esce. */
    tasti([["torna alla carta"]]);
  } else if(fa === "condividi"){
    T.textContent = "Fallo vedere";
    S.textContent = "Questo codice porta alla pagina del pezzo. Chi lo " +
                    "apre lo vede e lo gira, ma resta tuo.";
    conQR("");
    tasti([["copia il link", "fa", copiaIlLink], ["torna alla carta"]]);
  } else if(fa === "assistenza"){
    T.textContent = "Assistenza";
    S.textContent = "Il codice identifica il pezzo: mostralo in negozio e " +
                    "Stefano sa esattamente di che si tratta, quando l’hai " +
                    "comprato e cosa e’ stato fatto prima.";
    conQR("<b>Il centro assistenza del pezzo e’ da costruire.</b> Qui " +
          "andranno la storia degli interventi, i tempi e il ritiro.");
    tasti([["torna alla carta"]]);
  } else if(fa === "rimuovi"){
    T.textContent = "Rimuovi dalla collezione";
    S.textContent = "Il pezzo esce dal cofanetto. Se lo ritrovi lo si " +
                    "rimette scansionando il suo codice.";
    N.innerHTML = "Quello che hai speso resta contato. Ma <b>la collezione " +
                  (col ? col.nome : "") + " torna incompleta</b>, e il pezzo " +
                  "che la chiude non arriva.";
    tasti([["rimuovi", "grave", faiRimuovi], ["torna alla carta"]]);
  } else if(fa === "collezione" && col){
    T.textContent = col.nome;
    /* UN PEZZO RICEVUTO NON CONTA, e qui lo si vede. E' la regola del
       gioco — se no la collezione si chiude passandosi gli stessi quattro
       pezzi fra amici — e va detta dove la persona guarda quanto le manca,
       non solo nel retro del regalo. */
    /* ── TRE STATI, E UN CONTO CHE TORNA ───────────────────────────
       Il retro diceva «2 di 5 pezzi» sopra SEI righe: cinque della
       collezione piu' il pezzo che la chiude, che nel conto non c'era.
       Chi guarda conta le righe, non legge il codice, e trovava un
       numero che non corrisponde a quello che vede. Il pezzo che chiude
       si dichiara a parte — non e' uno dei cinque, non si compra, e
       metterlo dentro il totale renderebbe la collezione impossibile
       per costruzione.
       E poi i tre stati. Un pezzo RICEVUTO IN REGALO portava la classe
       `manca`: nome sbiadito e stato in ambra, cioe' disegnato come un
       pezzo che non hai — mentre ce l'hai, sta nel cofanetto, lo porti.
       Quello che non fa e' CONTARE per la chiusura, ed e' un'altra cosa.
       Tre parole, tre stati:
         TUO · RICEVUTO · NON CONTA · DA PRENDERE con il prezzo.
       Un pezzo tolto dal cofanetto torna fra quelli da prendere, con il
       suo prezzo dal catalogo: e' esattamente quello che il retro di
       «rimuovi» promette. */
    const via = p => p.fam && cTolto(p.fam, p.k);
    const mio = p => p.fam && !schedaDi(p.fam, p.k).da && !via(p);
    const ho = col.pezzi.filter(mio).length;
    S.textContent = ho + " di " + col.pezzi.length + " · e il pezzo che chiude";
    const prezzoDi = p => ((RIPIANI[p.fam] || [])[p.k] || ["", "", ""])[2];
    N.innerHTML =
      '<div class="coll">' +
      col.pezzi.map(p => {
        const stato = (parola, seguito) => `<span class="s"><i>${parola}</i>` +
          (seguito ? `<em>${seguito}</em>` : "") + "</span>";
        if(!p.fam || via(p)){
          const prezzo = p.fam ? prezzoDi(p) : p.prezzo;
          return `<div class="r manca"><span class="vuoto"></span>` +
                 `<span class="n">${p.nome}</span>` +
                 stato("da prendere", prezzo + " €") + "</div>";
        }
        const dono = schedaDi(p.fam, p.k).da;
        return `<div class="r${dono ? " ricevuto" : ""}">` +
               `<img src="${provino(p.fam, p.k)}" alt="">` +
               `<span class="n">${p.nome}</span>` +
               (dono ? stato("ricevuto", "non conta") : stato("tuo")) + "</div>";
      }).join("") +
      `<div class="r chiude"><span class="vuoto"></span><span class="n">${col.chiude.nome}</span>` +
      `<span class="s"><i>non si compra</i></span></div></div>` +
      `<div style="margin-top:10px;font-size:11.5px;line-height:1.5;color:#B3A795">` +
      col.chiude.nota + "</div>" +
      righePromo(col, col.pezzi.length - ho);
    tasti([["torna alla carta"]]);
  }
  foglio.classList.add("girata");
  misuraCarta();
}

/* ══════════════════════════════════════════════════════════════
   LA FINESTRA — il buco nella carta, e la macchina che ci riquadra

   Variante 2 (`finestra` e `due`). L'area della fotografia diventa
   davvero trasparente: non un'immagine finta del pezzo, il PEZZO, che
   continua a girare col dito dentro il ritaglio.
   Tre attrezzi, e nessuno dei tre tocca il ciclo di disegno:
     · `poligonoBuco` — scava il ritaglio in un elemento con un
       clip-path a regola pari-dispari: un anello esterno piu' grande
       della scatola (se no il clip porterebbe via l'ombra della carta) e
       dentro il rettangolo del riquadro con i suoi angoli tondi. Lo
       stesso buco va sul velo (che cosi' non sfoca il pezzo e non
       raccoglie i tocchi che ci cadono dentro) e sulla faccia della
       carta (che cosi' non ci mette sopra la sua carta opaca).
     · `quadroDelPezzo` — dove cade il pezzo sullo schermo con la
       macchina ARRIVATA e senza pizzico. Si proietta con una macchina di
       prova messa sul bersaglio, perche' quella vera in quel momento sta
       ancora volando e darebbe un rettangolo che non e' quello di fra
       mezzo secondo.
     · `inquadraNellaFinestra` — sposta e ingrandisce perche' quel
       rettangolo ci stia dentro la finestra, centrato, col dodici per
       cento di margine per lato. Usa `zoomMeta` e `panMeta*`, cioe' il
       meccanismo che il file ha gia' per il pizzico: la molla porta la
       macchina dove deve stare, questo la sposta rispetto a li'. Il
       volo, il dondolo e il rilascio non se ne accorgono.
   ══════════════════════════════════════════════════════════════ */
const veloCarta = cartaPezzo.querySelector(".velo");
const rigaFoto = document.querySelector(".riga-foto");
const strisciaFoto = document.getElementById("strisciafoto");

function arcoBuco(pts, cx, cy, g, a0, a1){
  for(let i = 0; i <= 4; i++){
    const a = a0 + (a1 - a0) * i / 4;
    pts.push([cx + g * Math.cos(a), cy + g * Math.sin(a)]);
  }
}
function poligonoBuco(el, r, raggio){
  const b = el.getBoundingClientRect();
  if(!b.width || !b.height || !r.width || !r.height) return "";
  const O = 160;
  const fuori = [[-O, -O], [b.width + O, -O],
                 [b.width + O, b.height + O], [-O, b.height + O], [-O, -O]];
  const x0 = r.left - b.left, y0 = r.top - b.top,
        x1 = r.right - b.left, y1 = r.bottom - b.top;
  const g = Math.max(0, Math.min(raggio, (x1 - x0) / 2, (y1 - y0) / 2));
  const dentro = [];
  arcoBuco(dentro, x0 + g, y0 + g, g, Math.PI, Math.PI * 1.5);
  arcoBuco(dentro, x1 - g, y0 + g, g, Math.PI * 1.5, Math.PI * 2);
  arcoBuco(dentro, x1 - g, y1 - g, g, 0, Math.PI * 0.5);
  arcoBuco(dentro, x0 + g, y1 - g, g, Math.PI * 0.5, Math.PI);
  dentro.push(dentro[0]);
  return "polygon(evenodd, " + fuori.concat(dentro)
    .map(([x, y]) => x.toFixed(1) + "px " + y.toFixed(1) + "px").join(", ") + ")";
}

const fronteCarta = foglio.querySelector(".fronte");
let finestraAttesa = 0;
function aggiornaFinestra(){
  /* ── E SU SCHERMO LARGO IL BUCO NON SI SCAVA ──────────────────
     Il ritaglio esiste perche' sul telefono la carta copre tutta la
     scena: l'unico modo di far vedere il pezzo vero e' aprirle un buco.
     Nel pannello a destra il buco darebbe sul pannello, e la scena e' gia'
     tutta li' accanto, intera e girabile. Quindi: niente ritaglio, niente
     prestito di zoom, e la carta si riprende la sua fotografia (lo dice il
     foglio di stile). Il riquadro del pezzo lo fa la macchina
     sull'area visibile, che e' quello che gia' fa. */
  const viva = !larga && carta !== "foto" && !cartaPezzo.hidden
            && !foglio.classList.contains("girata");
  if(!viva){
    veloCarta.style.clipPath = fronteCarta.style.clipPath = "";
    return;
  }
  const r = rigaFoto.getBoundingClientRect();
  veloCarta.style.clipPath   = poligonoBuco(veloCarta, r, 8);
  fronteCarta.style.clipPath = poligonoBuco(fronteCarta, r, 8);
}
/* si rifa' a un fotogramma di distanza e una volta sola per fotogramma:
   l'altezza della carta, la giravolta e lo scorrimento del contenuto
   possono chiamarla tre volte nello stesso battito */
function rifaiFinestra(){
  if(finestraAttesa) return;
  finestraAttesa = requestAnimationFrame(() => {
    finestraAttesa = 0; aggiornaFinestra();
  });
}

const _camProva = new THREE.PerspectiveCamera();
function quadroDelPezzo(){
  _camProva.fov = camera.fov; _camProva.aspect = camera.aspect;
  _camProva.near = camera.near; _camProva.far = camera.far;
  _camProva.up.copy(camera.up);
  _camProva.position.copy(occhioObiettivo);
  _camProva.lookAt(miraObiettivo);
  _camProva.updateMatrixWorld(true);
  _camProva.updateProjectionMatrix();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
             i & 2 ? boxP.max.y : boxP.min.y,
             i & 4 ? boxP.max.z : boxP.min.z).project(_camProva);
    const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  return {x0, y0, x1, y1};
}

const MARGINE_FINESTRA = 0.12;
/* PER QUANTO SI SEGUE IL RIQUADRO. Mezzo secondo e' quanto ci mette la
   piu' lenta delle tre cose che lo muovono (l'altezza della carta, 0,34
   s) piu' il margine di un'impaginazione. Si conta in secondi di CICLO,
   non con un orologio: il banco di prova pilota il tempo a mano, e un
   `setTimeout` li' non scatterebbe mai. */
const SEGUI_S = 0.52;
let seguiFinestra = 0;
function inquadraNellaFinestra(){
  /* largo non c'e' nessuna finestra in cui riquadrare (vedi
     `aggiornaFinestra`): il prestito si restituisce e si esce. Senza
     questa riga la macchina inseguirebbe il rettangolo della fotografia
     DENTRO il pannello, cioe' porterebbe il gioiello sotto il pannello. */
  if(larga){ zoomMeta = 1; panMetaX = panMetaY = 0; return false; }
  if(carta === "foto" || cartaPezzo.hidden) return false;
  /* girata, il riquadro sta sulla faccia voltata: il suo rettangolo a
     schermo e' specchiato e non vuol dire piu' niente. L'inquadratura
     resta quella che c'era, e torna giusta quando la carta si rigira. */
  if(foglio.classList.contains("girata")) return false;
  if(livello !== 2 || boxP.isEmpty()) return false;
  const f = rigaFoto.getBoundingClientRect();
  if(f.width < 8 || f.height < 8) return false;
  const p = quadroDelPezzo();
  const largo = Math.max(1, p.x1 - p.x0), alto = Math.max(1, p.y1 - p.y0);
  const utile = 1 - 2 * MARGINE_FINESTRA;
  let z = Math.min(f.width * utile / largo, f.height * utile / alto);
  /* IL FONDO DELLA SCALA STAVA A 0,35 E TAGLIAVA. Misurato sulla collana
     del busto: per starci dentro la finestra ne voleva 0,30, il tetto
     minimo la teneva a 0,35 e il pezzo riempiva l'88 per cento
     dell'altezza — un punto e otto decimi dal bordo alto invece dei
     dodici per cento chiesti. Il limite serve solo contro un riquadro
     degenere (una finestra alta due punti mentre la carta si impagina),
     e per quello 0,15 basta. */
  z = Math.max(0.15, Math.min(4.5, z));
  /* quanti pixel vale un'unita' di mondo sul piano del pezzo, a questo
     ingrandimento: la macchina sta a `d/z` dal bersaglio, e mezza altezza
     di campo li' vale `(d/z)·tan(fov/2)` */
  const d = occhioObiettivo.distanceTo(miraObiettivo) || 0.001;
  const perMondo = z * (innerHeight / 2)
                 / (d * Math.tan(camera.fov * Math.PI / 360));
  /* la proiezione scala attorno al punto mirato, che a spostamento zero
     e' il centro dello schermo: il rettangolo del pezzo si allontana dal
     centro esattamente di `z` volte */
  const sx = innerWidth / 2 + ((p.x0 + p.x1) / 2 - innerWidth / 2) * z;
  const sy = innerHeight / 2 + ((p.y0 + p.y1) / 2 - innerHeight / 2) * z;
  zoomMeta = z;
  panMetaX = -((f.left + f.right) / 2 - sx) / perMondo;
  panMetaY =  ((f.top + f.bottom) / 2 - sy) / perMondo;
  sveglia();
  return true;
}

/* ── QUELLO CHE STA SOTTO LA FINESTRA ─────────────────────────────
   In `finestra` una riga sola che apre la galleria — la fotografia non
   si puo' piu' toccare, e una galleria senza porta non esiste. In `due`
   le foto VERE in miniatura, che e' la stessa porta ma detta con le
   immagini: si vede cosa c'e' dentro prima di aprirla. */
function vestiStriscia(){
  if(carta === "foto" || cartaPezzo.hidden){ strisciaFoto.hidden = true; return; }
  if(carta === "finestra"){
    strisciaFoto.innerHTML =
      `<button type="button" class="tutte">${1 + SCATTI.length} fotografie</button>`;
  } else {
    const mini = SCATTI.map(([u]) => scattoDi(u))
      .concat([provino(cartaFam, cartaK, 288, 216)]);
    strisciaFoto.innerHTML = mini.map((u, i) =>
      `<button type="button" class="mini" aria-label="apri la fotografia ${i + 1}">` +
      `<img src="${u}" alt=""></button>`).join("");
  }
  strisciaFoto.hidden = false;
}
strisciaFoto.onclick = () => apriGalleria();

/* il globale scrive l'attributo, poi rimette a posto le due cose che il
   foglio di stile da solo non sa fare: il buco e l'inquadratura */
function applicaCarta(){
  document.documentElement.dataset.carta = carta;
  if(!cartaPezzo.hidden){
    vestiStriscia();
    seguiFinestra = 0;
    if(carta === "foto"){ zoomMeta = 1; panMetaX = panMetaY = 0; }
    else {
      inquadraNellaFinestra();
      /* cambiando variante al volo la carta cambia forma — la finestra
         si stacca dal bordo, la striscia compare, l'altezza si rifa' — e
         per due o tre decimi di secondo il riquadro non e' ancora dove
         sara'. Misurato senza questa riga: il pezzo finiva 7 punti SOTTO
         il bordo basso della finestra. Si segue, come all'apertura. */
      seguiFinestra = SEGUI_S;
    }
    misuraCarta();
  }
  aggiornaFinestra();
  sveglia();
}

/* SE IL CONTENUTO SCORRE, IL BUCO LO SEGUE. Coricato — o con una dedica
   lunga — la colonna della carta scorre sotto la finestra: il ritaglio e'
   disegnato su coordinate di schermo, e senza questa riga resterebbe
   fermo mentre il riquadro gli scivola via da sotto. */
for(const d of foglio.querySelectorAll(".dentro-carta"))
  d.addEventListener("scroll", rifaiFinestra, {passive:true});

document.getElementById("chiudi-carta").onclick = chiudiCarta;
document.querySelector("#dedica .tutto").onclick = () => giraCarta("dedica");
addEventListener("resize", () => {
  if(cartaPezzo.hidden) return;
  misuraCarta(); inquadraNellaFinestra(); rifaiFinestra();
});
/* E SI RICONTROLLA A GIRAVOLTA FINITA. Se per qualunque ragione la misura
   e' stata presa sulla faccia sbagliata — succede se qualcosa cambia la
   classe fuori da giraCarta — sotto la faccia visibile resta una striscia
   di carta vuota. Alla fine della rotazione si rimisura, e si corregge da
   sola. */
foglio.addEventListener("transitionend", e => {
  if(cartaPezzo.hidden) return;
  if(e.propertyName === "transform") misuraCarta();
  /* e a giravolta finita il buco cambia padrone: girata, la faccia col
     ritaglio e' quella nascosta e il retro copre tutto; tornata sul
     fronte, il ritaglio deve riesserci */
  if(e.propertyName === "transform" || e.propertyName === "height")
    rifaiFinestra();
});
/* «porgi» dura 240 ms e per tutto quel tempo la carta e' scalata di
   0,965 e spostata di otto punti: il buco del VELO — che non si scala
   con lei, perche' il velo e' un altro elemento — va rifatto quando la
   carta e' arrivata dov'e' */
/* e si prende per id, non per nome: `porta` in questo file e' gia' una
   funzione del caricatore, e la scorciatoia degli id globali qui darebbe
   quella */
document.getElementById("porta").addEventListener("animationend", rifaiFinestra);
cartaPezzo.addEventListener("click", e => { if(e.target.classList.contains("velo")) chiudiCarta(); });

/* ══════════════════════════════════════════════════════════════
   LA GALLERIA — il gesto sta QUI, e non tocca la stanza

   Il pizzico dell'applicazione e' agganciato a #stanza, che e' la scena
   in tre dimensioni: li' due dita avvicinano la macchina al gioiello, e
   quel gesto non si tocca. La galleria sta SOPRA la stanza, con il suo
   fondo pieno, e i suoi eventi non arrivano mai laggiu': si scrive un
   gestore suo, sui suoi elementi, e le due cose non si incontrano.
   Lo scorrimento nativo con aggancio se ne va per un motivo solo: con
   `touch-action` diverso da `none` il browser si prende il gesto a due
   dita e lo spostamento della foto ingrandita, e non li restituisce. La
   fila si muove allora con un trasformo — che e' anche l'unico modo di
   farla scendere insieme al velo quando la si butta giu' per uscire.

   QUATTRO GESTI, uno per ogni cosa che si vuole fare davanti a una
   fotografia di un gioiello:
     · due dita — ingrandisce e sposta insieme, come sulla stanza;
     · doppio tocco — ingrandisce dove hai toccato, per chi ha una mano
       sola (ed e' il gesto che tutti provano per secondo);
     · un dito di lato — cambia fotografia, con il lancio che decide;
     · un dito in giu' — esce, e la foto scende col dito mentre il velo
       si schiarisce: si vede dove sta andando prima di lasciare.
   ══════════════════════════════════════════════════════════════ */
const GAL_INGRANDITO = 2.4;      // quanto vale un doppio tocco
const GAL_ESCI = 80;             // punti di caduta che chiudono
let galFoto = [], galI = 0, galZoom = 1, galPx = 0, galPy = 0;
let galDita = new Map(), galPizzico = null, galDito = null, galVerso = null;
let galUltimoTocco = 0, galUltimoDove = null;

const galImg = () => rotaia.children[galI]
  ? rotaia.children[galI].querySelector("img") : null;

function galPosa(quanto){
  rotaia.classList.toggle("posa", quanto !== false);
  rotaia.style.setProperty("--scorri", (-galI * innerWidth) + "px");
}
function galSegnaPunti(){
  for(let i = 0; i < punti.children.length; i++)
    punti.children[i].classList.toggle("qui", i === galI);
}
/* IL LIMITE DELLO SPOSTAMENTO LO DA' L'IMMAGINE, non lo schermo. Una
   fotografia in `object-fit:contain` occupa meno del suo riquadro: usare
   il riquadro lascerebbe trascinare la foto fuori dal campo e poi
   riportarla indietro a vuoto. */
function galFrena(){
  const im = galImg();
  if(!im){ galPx = galPy = 0; return; }
  const lx = Math.max(0, (im.offsetWidth * galZoom - innerWidth) / 2);
  const ly = Math.max(0, (im.offsetHeight * galZoom -
                          im.parentElement.clientHeight) / 2);
  galPx = Math.max(-lx, Math.min(lx, galPx));
  galPy = Math.max(-ly, Math.min(ly, galPy));
}
function galApplica(conPosa){
  const im = galImg();
  if(!im) return;
  im.classList.toggle("posa", !!conPosa);
  im.style.transform = "translate(" + galPx + "px," + galPy + "px) scale(" + galZoom + ")";
  rotaia.classList.toggle("grande", galZoom > 1.05);
}
function galAzzeraZoom(conPosa){
  galZoom = 1; galPx = 0; galPy = 0; galApplica(conPosa);
}

function apriGalleria(){
  /* IL PRIMO SCATTO E' QUELLO INDOSSATO. Il render era primo perche' e'
     fedele e isola l'articolo — che e' giusto sulla CARTA, dove serve a
     riconoscere il pezzo. In una galleria si entra per vedere com'e'
     addosso: gli scatti di Regina sono fotografie di gioielli portati, e
     vanno per primi. Il modello resta, ultimo, con la sua didascalia. */
  const modello = [provino(cartaFam, cartaK, 900, 900),
                   "Il modello del pezzo, fedele alle sue misure vere."];
  galFoto = SCATTI.length
    ? SCATTI.map(([u, d]) => [scattoDi(u), d]).concat([modello]) : [modello];
  rotaia.innerHTML = galFoto.map(([u, d]) =>
    `<figure><img src="${u}" alt=""><figcaption>${d}</figcaption></figure>`).join("");
  punti.innerHTML = galFoto.map((_, i) =>
    `<i${i === 0 ? ' class="qui"' : ""}></i>`).join("");
  galI = 0; galAzzeraZoom(false);
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  galPosa(false);
  accogli(galleria);
  /* stessa regola della carta: il fuoco va sul contenitore, non sulla X.
     Sulla X compariva l'anello turchese sopra la fotografia. */
  requestAnimationFrame(() => { if(!galleria.hidden) galleria.focus(); });
}
/* la galleria usciva in 6 millisecondi misurati. Esce con lo stesso
   congedo di tutto il resto, e con un soffio di scala in piu': e' una
   cosa a schermo pieno, e le cose grandi si allontanano andandosene. */
function chiudiGalleria(){
  if(galleria.hidden) return;
  galDita.clear(); galPizzico = null; galDito = null; galVerso = null;
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  congeda(galleria, () => { galAzzeraZoom(false); });
  /* il fuoco torna sulla fotografia da cui si era partiti: e' l'unico
     posto da cui la galleria si apre, ed e' li' che ci si aspetta di
     ritrovarsi */
  if(!cartaPezzo.hidden) ritratto.focus();
}

const galMisura = () => {
  const d = [...galDita.values()];
  return {d: Math.hypot(d[0].x - d[1].x, d[0].y - d[1].y),
          mx: (d[0].x + d[1].x) / 2, my: (d[0].y + d[1].y) / 2};
};

galleria.addEventListener("pointerdown", e => {
  if(e.target.closest("#chiudi-galleria")) return;
  galDita.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { galleria.setPointerCapture(e.pointerId); } catch(_) {}
  if(galDita.size === 2){
    galDito = null; galVerso = null;
    const m = galMisura();
    galPizzico = {d:m.d, mx:m.mx, my:m.my, z:galZoom, px:galPx, py:galPy};
    rotaia.classList.remove("posa");
    return;
  }
  if(galDita.size > 1) return;
  galDito = {x:e.clientX, y:e.clientY, t:performance.now(),
             px:galPx, py:galPy, mosso:0};
  galVerso = null;
  rotaia.classList.remove("posa");
});

galleria.addEventListener("pointermove", e => {
  if(galDita.has(e.pointerId)) galDita.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(galPizzico && galDita.size === 2){
    const m = galMisura();
    galZoom = Math.max(1, Math.min(5, galPizzico.z * (m.d / Math.max(24, galPizzico.d))));
    /* IL PUNTO DI MEZZO E' UN'ANCORA, non uno spostamento a parte: la
       foto deve restare sotto le dita mentre cresce, se no sembra che
       scivoli via. Si tiene fermo il punto dell'immagine che stava sotto
       il centro del pizzico, e lo spostamento e' la differenza. */
    const s = galZoom / galPizzico.z;
    galPx = galPizzico.px * s + (m.mx - galPizzico.mx) -
            (galPizzico.mx - innerWidth / 2) * (s - 1);
    galPy = galPizzico.py * s + (m.my - galPizzico.my) -
            (galPizzico.my - innerHeight / 2) * (s - 1);
    galFrena();
    galApplica(false);
    return;
  }

  if(!galDito) return;
  const dx = e.clientX - galDito.x, dy = e.clientY - galDito.y;
  galDito.mosso = Math.max(galDito.mosso, Math.hypot(dx, dy));

  /* A FOTO INGRANDITA IL DITO SPOSTA, E BASTA. Cambiare fotografia
     mentre se ne sta guardando un dettaglio non e' quello che si sta
     chiedendo: si esce dall'ingrandimento, semmai, col doppio tocco. */
  if(galZoom > 1.05){
    galPx = galDito.px + dx; galPy = galDito.py + dy;
    galFrena(); galApplica(false);
    return;
  }

  /* L'ASSE SI DECIDE UNA VOLTA SOLA, al primo movimento vero: deciderlo
     a ogni evento farebbe cambiare gesto a meta' strada, e un gesto che
     cambia natura sotto il dito e' il difetto che si legge come
     «scattoso». */
  if(!galVerso && Math.hypot(dx, dy) > 10)
    galVerso = Math.abs(dx) > Math.abs(dy) ? "lato" : "giu";

  if(galVerso === "lato"){
    /* ai capi la stessa gomma della fila di espositori: oltre la prima e
       oltre l'ultima la rotaia resiste e torna */
    let d = dx;
    if((galI === 0 && dx > 0) || (galI === galFoto.length - 1 && dx < 0)) d = dx * 0.35;
    rotaia.style.setProperty("--scorri", (-galI * innerWidth + d) + "px");
  } else if(galVerso === "giu"){
    const g = Math.max(0, dy);
    galleria.style.setProperty("--giu", g + "px");
    /* IL VELO SI SCHIARISCE MENTRE SCENDE. E' l'unica cosa che dice
       «stai uscendo» prima che si lasci: senza, il gesto e' una scommessa
       — o si chiude, o torna su, e non si sa quale delle due finche' non
       e' successo. */
    galleria.style.setProperty("--velo",
      String(Math.max(0.28, 1 - g / (innerHeight * 0.7))));
  }
});

const galLascia = e => {
  galDita.delete(e.pointerId);
  if(galDita.size < 2 && galPizzico){
    galPizzico = null;
    /* sotto un ingrandimento minimo si torna al posto: restare al 103
       per cento e' un residuo, non una scelta — stessa regola del
       pizzico della stanza */
    if(galZoom < 1.06) galAzzeraZoom(true);
    return;
  }
  if(!galDito) return;
  const dx = e.clientX - galDito.x, dy = e.clientY - galDito.y;
  const dt = Math.max(16, performance.now() - galDito.t);
  const mosso = galDito.mosso;
  const verso = galVerso;
  galDito = null; galVerso = null;

  if(verso === "giu"){
    galleria.style.removeProperty("--giu");
    galleria.style.removeProperty("--velo");
    if(dy > GAL_ESCI || (dy > 24 && dy / dt * 1000 > 700)){ chiudiGalleria(); return; }
    return;
  }
  if(verso === "lato"){
    const lancio = Math.abs(dx) / dt * 1000 > 420;
    if((Math.abs(dx) > innerWidth * 0.22 || lancio) && Math.abs(dx) > 12)
      galI = Math.max(0, Math.min(galFoto.length - 1, galI - Math.sign(dx)));
    galPosa(true);
    galSegnaPunti();
    galAzzeraZoom(false);
    return;
  }

  /* IL DOPPIO TOCCO. Due tocchi fermi entro trecento millisecondi e
     trenta punti: fermi, perche' due colpetti dati mentre si scorre non
     sono un doppio tocco, sono uno scorrimento con un rimbalzo. */
  if(mosso < 10){
    const ora = performance.now();
    const vicino = galUltimoDove &&
      Math.hypot(e.clientX - galUltimoDove.x, e.clientY - galUltimoDove.y) < 30;
    if(ora - galUltimoTocco < 300 && vicino){
      galUltimoTocco = 0; galUltimoDove = null;
      if(galZoom > 1.05) galAzzeraZoom(true);
      else {
        galZoom = GAL_INGRANDITO;
        /* si ingrandisce DOVE si e' toccato: il punto sotto il dito resta
           sotto il dito, che e' quello che si chiede quando si batte due
           volte su un dettaglio */
        galPx = -(e.clientX - innerWidth / 2) * (galZoom - 1);
        galPy = -(e.clientY - innerHeight / 2) * (galZoom - 1);
        galFrena(); galApplica(true);
      }
      return;
    }
    galUltimoTocco = ora;
    galUltimoDove = {x:e.clientX, y:e.clientY};
  }
  galPosa(true);
};
galleria.addEventListener("pointerup", galLascia);
galleria.addEventListener("pointercancel", e => {
  galDita.delete(e.pointerId); galPizzico = null; galDito = null; galVerso = null;
  galleria.style.removeProperty("--giu");
  galleria.style.removeProperty("--velo");
  galPosa(true);
});
addEventListener("resize", () => { if(!galleria.hidden){ galPosa(false); galApplica(false); } });

document.getElementById("chiudi-galleria").onclick = chiudiGalleria;
ritratto.onclick = apriGalleria;
ritratto.onkeydown = e => {
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); apriGalleria(); }
};
/* ── SE LA FOTOGRAFIA NON ARRIVA ──────────────────────────────────
   Un <img> che non carica lascia l'icona di immagine rotta del browser:
   un blocco con dentro un simbolo che non e' nostro, in cima a una carta
   di gioielleria. E' la stessa bugia gia' corretta nella lista della
   collezione, dove i pezzi che mancano hanno un riquadro di filo e non
   un rettangolo grigio. Qui il riquadro si spegne e resta un posto
   disegnato che dice che la fotografia arrivera'. */
ritratto.onerror = () => {
  document.querySelector(".riga-foto").classList.add("senza-foto");
  if(!cartaPezzo.hidden) misuraCarta();
};

/* ── LE CARTE SI FANNO DA PARTE, NON SPARISCONO ──────────────────
   Anche qui c'era il taglio netto: `innerHTML = ""` e le due carte
   svanivano nello stesso fotogramma, mentre erano entrate con i loro
   340 millisecondi di dissolvenza. Ma c'e' un caso in cui il taglio
   serve: quando le carte si RIFANNO subito dopo — aprendo un pezzo
   nuovo — perche' una dissolvenza differita cancellerebbe le carte
   appena messe. Quindi il congedo ha due modi, e chi chiama sceglie. */
/* ── E ADESSO I CONTENITORI SONO TRE ──────────────────────────────
   Le carte in scena, la riga in alto e il rail nella scheda sono tre
   DISEGNI dello stesso dato. Si costruiscono tutti e tre insieme (sono
   due voci: costa niente) e a decidere chi si vede e' `segnaSugg`. Cosi'
   cambiare variante al volo non ricostruisce niente — accende un
   contenitore e ne spegne un altro, ognuno con la sua dissolvenza — e
   non c'e' nessun fotogramma in cui la scena salta. */
const rigaSugg = document.getElementById("riga-sugg");
const railSugg = document.getElementById("rail-sugg");

function togliInsieme(subito){
  const vuota = () => { ancore = []; accanto.innerHTML = ""; raggioQuadro = 0;
                        rigaSugg.innerHTML = ""; railSugg.innerHTML = ""; };
  insieme.hidden = true;
  const vivi = [accanto, rigaSugg, railSugg].filter(e => !e.hidden);
  if(subito || !vivi.length){
    vuota(); for(const e of vivi){ e.classList.remove("qui"); e.hidden = true; }
    return;
  }
  let restano = vivi.length;
  for(const e of vivi){
    e.classList.remove("qui");
    congeda(e, () => { if(--restano === 0){ vuota(); segnaSugg(); } }, true);
  }
}

/* ── UNA FORMA SOLA PER VOLTA ─────────────────────────────────────
   L'insieme si dice in due modi: le CARTE agganciate al pezzo nello
   spazio, e la LISTA «Con questo ci sta anche» dentro la scheda. Sono
   due disegni dello stesso dato, e comparivano insieme: aprendo la
   scheda si leggevano gli stessi due nomi e gli stessi due prezzi in due
   posti diversi, uno sopra l'altro, con le carte che per giunta finivano
   coperte dalla scheda che si era appena alzata.
   Quando la scheda e' aperta parla la lista; quando e' ritirata parlano
   le carte. Il tasto dei suggerimenti resta sopra tutti e due: se sono
   spenti, sono spenti.
   LA REGOLA VALE SOLO DOVE HA SENSO. Nella variante (a) il suggerimento
   sta nel cromo in alto, dall'altra parte dello schermo rispetto alla
   scheda: non c'e' niente da cui farsi da parte. Nella (c) il rail E' la
   scheda, quindi non puo' nascondersi quando la scheda si apre — sparisce
   invece la lista, che li' sarebbe il doppione (la fa sparire il foglio
   di stile, sotto `[data-sugg="c"]`). */
function mostraOnasconde(el, vuoi){
  if(!el) return;
  if(vuoi){
    accogli(el);
    /* il `.qui` arriva un fotogramma dopo: da `display:none` a visibile
       non c'e' transizione se il valore cambia nello stesso stile
       ricalcolato, e il contenitore comparirebbe di scatto */
    requestAnimationFrame(() => { if(!el.hidden) el.classList.add("qui"); });
  } else if(!el.hidden){
    el.classList.remove("qui");
    congeda(el, null, true);
  }
}
function segnaSugg(){
  const acceso = vuoleInsieme && ancore.length > 0;
  const schedaAperta = livello === 2 && !fondo.classList.contains("ritirato");
  /* E CON LA CARTA APERTA LE CARTE IN SCENA SE NE VANNO. Finche' la carta
     era un rettangolo opaco a schermo intero la cosa non si vedeva —
     erano dietro — ma con la finestra c'e' un buco, e dal buco si vedeva
     spuntare un cartoncino del suggerimento dentro l'inquadratura del
     pezzo. Dalla finestra si deve vedere la STANZA, non il cromo. */
  mostraOnasconde(accanto,  acceso && sugg === "b" && !schedaAperta
                            && cartaPezzo.hidden);
  mostraOnasconde(rigaSugg, acceso && sugg === "a");
  mostraOnasconde(railSugg, acceso && sugg === "c");
}
/* il globale scrive l'attributo e basta: il disegno delle tre forme sta
   gia' nel foglio di stile, e chi si vede lo dice `segnaSugg`. */
function applicaSugg(){
  document.documentElement.dataset.sugg = sugg;
  segnaSugg();
  sveglia();
}

function mostraInsieme(){
  const lista = INSIEME[attiva] || [];
  if(!lista.length) return;
  /* GLI ASSI SONO QUELLI DI DOPO. Letti dalla matrice della macchina qui
     sono ancora quelli della vista dell'espositore: la macchina si sposta
     sul pezzo con una molla e ci mette qualche fotogramma. La posizione
     finale la dicono giro e alzata, e si scrive a mano. */
  const cg = Math.cos(giroP), sg = Math.sin(giroP);
  const ca = Math.cos(altP), sa = Math.sin(altP);
  _dx.set(cg, 0, -sg);
  _dy.set(-sa * sg, ca, -sa * cg);
  const righe = [], righeSugg = [], cardRail = [];
  for(const [fam, k] of lista){
    const r = (RIPIANI[fam] || [])[k];
    if(!r) continue;
    const [ax, ay] = DOVE_ADDOSSO[fam] || [0.9, 0.8];
    /* PIU' LARGO SUL PEZZO STESO. Un pezzo che sta in piedi occupa una
       colonna stretta e le carte gli stanno di fianco; uno steso occupa
       tutta la larghezza, e a 1,12 raggi la carta dell'Anello Cabochon
       finiva SOPRA la collana, coprendogliene meta'. */
    const d = raggioP * (stesa(attiva, scelto) ? 2.60 : 1.12);
    const punto = new THREE.Vector3().copy(centroP)
      .addScaledVector(_dx, ax * d).addScaledVector(_dy, ay * d);
    const el = document.createElement("div");
    el.className = "carta";
    /* la carta si porta dietro CHI E': senza, quando il provino arriva
       dopo non c'e' modo di sapere quale fotografia le tocca, e resterebbe
       vuota per sempre (vedi `ripassaCarteSenzaFoto`) */
    el.dataset.fam = fam; el.dataset.k = String(k);
    const foto = provino(fam, k);
    /* IL TESTO STA IN UN BLOCCO SUO. Serve alla variante (b): il letto
       scuro che risolve il contrasto va messo dietro le TRE RIGHE, non
       sotto tutta la carta — e per metterlo dietro tre righe, le tre
       righe devono essere una cosa sola. */
    el.innerHTML = (foto ? `<img src="${foto}" alt="">` : "") +
                   `<div class="dice"><i>${FAMIGLIE.find(f => f.id === fam).nome}</i>` +
                   `<b>${r[0]}</b><span>${r[2]} €</span></div>`;
    /* E IL SUGGERIMENTO PORTA DOVE DICE. E' un cartoncino, non un
       bottone — il disegno non cambia — ma per chi naviga con la
       tastiera o col lettore di schermo deve DICHIARARSI un comando,
       se no e' un rettangolo muto che non si raggiunge mai. */
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.setAttribute("aria-label", "vai a " + r[0] + ", " + r[2] + " euro");
    el.onclick = () => vaiAlPezzo(fam, k);
    el.onkeydown = ev => {
      if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); vaiAlPezzo(fam, k); }
    };
    accanto.appendChild(el);
    ancore.push({p:punto, el, x:null, y:null, lato:-1});
    righe.push(`<div class="r"><b>${r[0]}</b><span>${r[2]} €</span></div>`);

    /* ── (a) LA RIGA IN ALTO ─────────────────────────────────────
       Niente miniatura e niente pannello: il nome e il prezzo, in
       maiuscoletto, toccabili. Il puntino che li separa non e' un
       tasto e non si tocca. */
    if(righeSugg.length)
      righeSugg.push('<span class="punto" aria-hidden="true">·</span>');
    righeSugg.push(
      `<button type="button" data-fam="${fam}" data-k="${k}" ` +
      `aria-label="vai a ${r[0]}, ${r[2]} euro">${r[0]} ` +
      `<em>${r[2]} €</em></button>`);

    /* ── (c) IL RAIL NELLA SCHEDA ────────────────────────────────
       La card del Cofanetto in piccolo: foto 4:5, nome, prezzo. Il
       provino puo' non essere ancora pronto — si mette allora un posto
       vuoto disegnato, come nella lista della collezione, e non un
       <img> senza sorgente che il browser marca come rotto. */
    cardRail.push(
      `<button type="button" class="card" data-fam="${fam}" data-k="${k}" ` +
      `aria-label="vai a ${r[0]}, ${r[2]} euro">` +
      (foto ? `<img src="${foto}" alt="">` : '<span class="vuota"></span>') +
      /* nome e prezzo stanno in un blocco loro: in piedi non cambia
         niente, coricato e' quel blocco a mettersi di fianco alla foto */
      `<span class="dati"><span class="n">${r[0]}</span>` +
      `<span class="p">${r[2]} €</span></span></button>`);
  }
  accanto.classList.toggle("steso", !!stesa(attiva, scelto));
  if(!ancore.length){ segnaSugg(); return; }
  rigaSugg.innerHTML = '<span class="eco">Con questo</span>' + righeSugg.join("");
  railSugg.innerHTML = cardRail.join("");
  /* un gestore solo per contenitore: il bersaglio porta con se' famiglia
     e indice, e non c'e' una chiusura per ogni card da tenere in vita */
  for(const c of [rigaSugg, railSugg]) c.onclick = ev => {
    const b = ev.target.closest("button[data-fam]");
    if(b) vaiAlPezzo(b.dataset.fam, +b.dataset.k);
  };
  segnaSugg();
  /* le carte stanno SOPRA la scena, non dentro: l'inquadratura non si
     allarga piu' — ed e' anche il motivo per cui l'orizzonte non rientra */
  requestAnimationFrame(() => ancore.forEach(a => a.el.classList.add("qui")));
  document.getElementById("insieme-righe").innerHTML = righe.join("");
  insieme.hidden = false;
}

/* ── LE CARTE SI RIEMPIONO QUANDO LA FOTOGRAFIA ARRIVA ────────
   Le famiglie scendono a tappe, e il suggerimento ATTRAVERSA le famiglie:
   e' il suo mestiere - «con questo ci sta anche l'Anello Cabochon». Chi
   apre un pezzo nel primo secondo trova quindi carte i cui provini non
   esistono ancora: la carta in scena nasce senza `<img>`, quella del rail
   col posto vuoto disegnato. Fin qui e' giusto - un `<img>` senza sorgente
   il browser lo marca come rotto. Sbagliato era che restassero cosi'
   finche' non si richiudeva e riapriva il pezzo: il provino arrivava
   trenta secondi dopo e nessuno andava a dirglielo.
   Glielo dice la coda dei provini, a fine turno di ogni famiglia. Si
   guarda solo nella DISPENSA e non si chiama `provino`: chiamarlo
   scatterebbe la fotografia qui, cioe' un fotogramma pagato per intero
   dentro un ripasso che deve costare niente - e per le carte visibili la
   dispensa a fine turno ce l'ha gia'.
   L'immagine non entra di scatto: `.arriva` le da' la tacca d'ingresso
   del resto dell'applicazione. */
function ripassaCarteSenzaFoto(){
  if(!ancore.length) return 0;
  let messe = 0;
  const riempi = el => {
    const fam = el.dataset.fam, k = el.dataset.k;
    if(!fam || k === undefined || el.querySelector("img")) return;
    /* la stessa chiave che `provino` userebbe con le sue misure di serie:
       288x216 e' quella che il rail e la carta in scena chiedono */
    const foto = provinoDi[fam + ":" + k + ":288x216"];
    if(!foto) return;
    const img = document.createElement("img");
    img.src = foto; img.alt = ""; img.className = "arriva";
    const posto = el.querySelector(".vuota");
    if(posto) posto.replaceWith(img);
    else el.insertBefore(img, el.firstChild);
    messe++;
  };
  for(const el of accanto.querySelectorAll(".carta")) riempi(el);
  for(const el of railSugg.querySelectorAll("button.card")) riempi(el);
  return messe;
}
window.__ripassaCarte = ripassaCarteSenzaFoto;

/* si riproiettano a ogni fotogramma: sono agganciate a un punto dello
   spazio, e lo spazio si muove sotto di loro */
function seguiCarte(){
  /* e si riproiettano SOLO nella variante che le usa: nelle altre due le
     carte sono costruite ma il contenitore e' spento, e riproiettarle a
     ogni fotogramma sarebbe lavoro di impaginazione per niente */
  if(!ancore.length || sugg !== "b" || accanto.hidden) return;
  // il rettangolo che il pezzo occupa sullo schermo, adesso
  let quadro = null;
  if(livello === 2 && !boxP.isEmpty()){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for(let i = 0; i < 8; i++){
      _ang.set(i & 1 ? boxP.max.x : boxP.min.x,
               i & 2 ? boxP.max.y : boxP.min.y,
               i & 4 ? boxP.max.z : boxP.min.z).project(camera);
      const sx = (_ang.x * 0.5 + 0.5) * innerWidth;
      const sy = (-_ang.y * 0.5 + 0.5) * innerHeight;
      x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
      y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
    }
    // un filo d'aria attorno al pezzo: appoggiate al bordo si leggono
    // ancora come una cosa che gli sta sopra
    quadro = {x0: x0 - 8, y0: y0 - 8, x1: x1 + 8, y1: y1 + 8};
  }
  /* ── DOVE POSSONO CADERE LE CARTE ────────────────────────────────
     Il recinto era: da 50 punti sotto il bordo alto fino al filo del
     cartellino, e per la larghezza tutto lo schermo. Su schermo largo il
     cartellino E' il pannello e il suo `top` vale zero: preso alla lettera
     il recinto verticale si chiudeva in negativo e le carte finivano
     incastrate in cima. Il recinto e' l'area visibile, misurata: sotto la
     barra dei reparti, sopra il fondo, e a sinistra del pannello. */
  const au = areaUtile();
  for(const a of ancore){
    const el = a.el;
    const l = el.offsetWidth / 2, alt = el.offsetHeight / 2;
    const cielo = larga ? au.y0 + alt + 12 : alt + 50;
    const suolo = larga ? au.y1 - alt - 12
                        : cartello.getBoundingClientRect().top - alt - 20;
    const manca = larga ? au.x0 + l + 12 : l + 12;
    const dritta = larga ? au.x1 - l - 12 : innerWidth - l - 12;

    /* ── LA CARTA ORBITA, NON SALTA ───────────────────────────────────
       Era agganciata a un PUNTO del mondo — dove il pezzo suggerito
       starebbe addosso — e proiettata sullo schermo fotogramma per
       fotogramma. Girando il gioiello quel punto gli passa DIETRO, la
       carta finiva addosso al pezzo, e la spinta che la scacciava dal
       riquadro cambiava lato di colpo: misurato, 55 pixel di salto fra due
       fotogrammi e diciassette strappi in un solo giro di dito. «Scattano
       e saltano in maniera troppo netta», ed era vero.
       Del punto si tiene la DIREZIONE, non la posizione: da dove sta il
       pezzo, verso dove starebbe il suggerimento. La carta si mette su
       quella direzione, appena fuori dal riquadro del gioiello. Girando,
       la direzione ruota piano e la carta gli gira intorno — resta un
       insieme, e non attraversa mai il pezzo. */
    let cx = innerWidth / 2, cy = innerHeight * 0.42, rx = 90, ry = 90;
    if(quadro){
      cx = (quadro.x0 + quadro.x1) / 2; cy = (quadro.y0 + quadro.y1) / 2;
      rx = (quadro.x1 - quadro.x0) / 2; ry = (quadro.y1 - quadro.y0) / 2;
    }
    _pr.copy(a.p).project(camera);
    let ux = (_pr.x * 0.5 + 0.5) * innerWidth - cx;
    let uy = (-_pr.y * 0.5 + 0.5) * innerHeight - cy;
    const m = Math.hypot(ux, uy) || 1;
    ux /= m; uy /= m;
    // la direzione si muove piano: e' lei l'unica cosa che cambia
    if(a.ux === undefined){ a.ux = ux; a.uy = uy; }
    else {
      a.ux += (ux - a.ux) * 0.05; a.uy += (uy - a.uy) * 0.05;
      const q = Math.hypot(a.ux, a.uy) || 1; a.ux /= q; a.uy /= q;
    }
    /* QUANTO LONTANO, e da che parte si scavalca il pezzo. Per non
       toccarlo basta scavalcarlo su UN asse: o la carta sta tutta di
       fianco al suo riquadro, o tutta sopra o sotto. Le due distanze non
       sono la stessa cosa, e la prima versione le confondeva prendendo il
       massimo di due prodotti — un conto senza senso, che lasciava la
       carta addosso all'anello.
       Su un telefono si scavalca in VERTICALE: la larghezza non c'e'
       (trecentonovanta punti, un anello che ne occupa centosessanta al
       centro e una carta che ne vuole centodiciotto), l'altezza si'. Se
       nemmeno sopra o sotto ci sta, si prova di fianco; e se non ci sta da
       nessuna parte c'e' il tasto per spegnerle. */
    const perAsse = (r, mezzo, comp) =>
      (r + mezzo + 12) / Math.max(Math.abs(comp), 0.25);
    const dv = perAsse(ry, alt, a.uy), dh = perAsse(rx, l, a.ux);
    const dentroV = y => y > cielo && y < suolo;
    const dentroH = x => x > manca && x < dritta;
    /* e su schermo largo si scavalca in ORIZZONTALE, che e' il rovescio
       esatto del ragionamento fatto per il telefono: li' la larghezza non
       c'era e l'altezza si'; qui, a 1440 meno il pannello, restano 1.080
       punti di scena contro 854 di altezza, e le due carte trovano posto
       una per lato del gioiello invece di impilarsi sopra e sotto. */
    let d = larga ? dh : dv;
    if(larga){
      if(!dentroH(cx + a.ux * dh) && dentroV(cy + a.uy * dv)) d = dv;
    } else if(!dentroV(cy + a.uy * dv) && dentroH(cx + a.ux * dh)) d = dh;
    let tx = Math.min(dritta, Math.max(manca, cx + a.ux * d));
    let ty = Math.min(suolo, Math.max(cielo, cy + a.uy * d));

    /* e ci arriva scivolando: la posizione e' un bersaglio, non un ordine */
    if(a.x === null){ a.x = tx; a.y = ty; }
    else { a.x += (tx - a.x) * 0.10; a.y += (ty - a.y) * 0.10; }
    el.style.left = a.x + "px";
    el.style.top = a.y + "px";
  }
}

/* ══════════════════════════════════════════════════════════════
   IL GESTO DEL GIOIELLIERE — l'espositore si DISSOLVE

   E' il momento che dovrebbe essere il piu' bello dell'applicazione: il
   pezzo viene fuori dalla vetrina e te lo mettono in mano. Misurato prima
   di questo blocco: le mesh visibili dell'espositore passavano da tutte a
   ZERO al fotogramma zero — mentre la macchina, lei, ci metteva ancora
   667 millisecondi ad arrivare. Il mobile non si toglieva di mezzo:
   spariva, e il pezzo restava sospeso nel buco che aveva lasciato.
   Un gioielliere non fa sparire la vetrina. Tira fuori il pezzo, e la
   vetrina resta dietro finche' non conta piu'. Qui l'espositore si spegne
   nello stesso tempo del volo, con la stessa curva morbida del colore
   delle vesti, e tornando indietro rientra allo stesso modo.

   DUE TRAPPOLE, e tutte e due si vedono solo con la passata di sfocatura
   accesa:
   · un materiale trasparente che continua a SCRIVERE LA PROFONDITA'
     lascia la sua sagoma nel buffer che il fuoco legge — il pezzo dietro
     viene sfocato come se avesse davanti un vetro, e attorno restano
     righe e buchi. Quindi `depthWrite:false` per tutta la dissolvenza, e
     si rimette com'era alla fine;
   · `transparent` fa parte della chiave con cui three.js sceglie il
     programma: cambiata senza `needsUpdate` il materiale resta compilato
     come opaco e l'opacita' non si vede affatto.
   ══════════════════════════════════════════════════════════════ */
/* DURA MENO DEL VOLO, E DEVE. Erano 0,42 s: misurato, l'espositore
   spariva a 433 ms su un volo che ne dura 600, cioe' al 72 per cento
   della strada — il pezzo si «staccava» quando era gia' quasi arrivato,
   e il mobile gli restava addosso per tutto il viaggio. A 0,30 sparisce
   a 300 ms, cioe' a meta' volo: il gioiello si stacca MENTRE si avvicina,
   che e' il gesto del gioielliere che lo tira fuori. */
const VELA_S = 0.30;
let velaLista = [], velaContro = [], velaT = 1, velaVerso = 0;

// le mesh dell'espositore: tutto quello che e' acceso e NON e' il pezzo
// che si sta portando davanti
function mesiEspositore(gruppo, tieni){
  const out = [];
  gruppo.traverse(o => {
    if(!o.isMesh || !o.material || !o.visible) return;
    let n = o, suo = false;
    while(n){ if(n === tieni){ suo = true; break; } n = n.parent; }
    if(!suo) out.push(o);
  });
  return out;
}
// rimettere il materiale com'era e' un passo a se': una vela nuova che
// parte mentre la vecchia corre lascerebbe i materiali di prima
// trasparenti e senza profondita' per sempre
function rendiMateriali(lista){
  for(const o of lista){
    const m = o.material;
    if(!m || m.__opBase === undefined) continue;
    m.opacity = m.__opBase;
    if(m.transparent !== m.__trBase){ m.transparent = m.__trBase; m.needsUpdate = true; }
    m.depthWrite = m.__dwBase;
    o.renderOrder = 0;
  }
}
/* le mesh di un oggetto solo: serve per la CONTROVELA, cioe' la posa */
function mesiDi(o){
  const out = [];
  o.traverse(m => { if(m.isMesh && m.material) out.push(m); });
  return out;
}
/* ── LA VELA HA DUE META' ────────────────────────────────────────
   `lista` e' chi segue il verso, `contro` chi fa l'opposto nello stesso
   istante. Serve per le famiglie con la posa: il busto si spegne e la
   collana stesa si accende, sulla stessa curva e nello stesso tempo. Con
   la posa accesa di colpo a opacita' piena — com'era — nel fotogramma
   del tocco il gioiello compariva 354 punti piu' in basso di dov'era, e
   quello e' il salto che il cliente ha visto. */
function avviaVela(lista, verso, contro){
  if(velaVerso){ rendiMateriali(velaLista); rendiMateriali(velaContro); }
  velaLista = lista; velaContro = contro || []; velaVerso = verso;
  velaT = verso < 0 ? 1 : 0;
  for(const o of velaLista.concat(velaContro)){
    const m = o.material;
    if(m.__opBase === undefined){
      m.__opBase = m.opacity; m.__trBase = m.transparent; m.__dwBase = m.depthWrite;
    }
    if(!m.transparent){ m.transparent = true; m.needsUpdate = true; }
    m.depthWrite = false;
    o.renderOrder = 2;
    o.visible = true;
  }
  for(const o of velaLista) o.material.opacity = velaT;
  for(const o of velaContro) o.material.opacity = controDi(velaT);
  if(ridotto) chiudiVela();          // meno movimento: si salta, non si vela
  sveglia();
}
function chiudiVela(){
  const spento = velaVerso < 0;
  rendiMateriali(velaLista); rendiMateriali(velaContro);
  for(const o of velaLista) o.visible = !spento;
  /* la controvela e' l'altra meta' dello stesso gesto: quando
     l'espositore si spegne, la posa resta accesa — e viceversa */
  for(const o of velaContro) o.visible = spento;
  velaVerso = 0; velaLista = []; velaContro = [];
  /* E QUI RITORNAVA IL PEZZO TOLTO. La riga sopra riaccende ogni mesh
     che la vela stava velando, e fra quelle c'e' anche la merce degli
     altri pezzi: misurato, il pezzo rimosso spariva e riappariva
     quattrocento millisecondi dopo, cioe' esattamente quando la vela
     finiva la sua corsa. Tornare indietro lo spegneva di nuovo, e lo
     riaccendeva di nuovo. Lo stato si riapplica dove la visibilita'
     viene riscritta — sono due posti, e questo e' il secondo. */
  applicaTolti();
}
function passoVela(dt){
  if(!velaVerso) return;
  velaT += velaVerso * dt / VELA_S;
  if(velaT <= 0 || velaT >= 1){ velaT = velaT <= 0 ? 0 : 1; chiudiVela(); return; }
  // la stessa curva con cui passa il colore delle vesti: non parte di
  // scatto e non si ferma di scatto
  const e = velaT * velaT * (3 - 2 * velaT);
  for(const o of velaLista) if(o.material) o.material.opacity = e;
  for(const o of velaContro) if(o.material) o.material.opacity = controDi(velaT);
}
/* ── LA META' CHE ENTRA NON ASPETTA LA META' CHE ESCE ───────────
   In una dissolvenza incrociata simmetrica, per meta' del tempo non c'e'
   un soggetto: ce ne sono due a meta' opacita'. Va benissimo quando i
   due stanno nello stesso posto — il ritorno, dove la posa scivola sul
   pezzo indossato — e va male all'andata, dove il busto se ne vola via
   con la macchina mentre la posa scende: per un terzo di secondo l'occhio
   non sa piu' quale dei due sta guardando.
   Quindi all'ANDATA la posa diventa solida nel primo 40 per cento della
   vela (120 ms sui 300), cioe' finche' e' ancora vicina a dov'era il
   pezzo: da li' in poi c'e' un soggetto solo, e fa una strada sola. Al
   RITORNO la dissolvenza resta simmetrica, perche' li' i due si
   incontrano invece di separarsi. */
function controDi(t){
  const e = t * t * (3 - 2 * t);
  return velaVerso < 0 ? Math.min(1, (1 - e) / 0.40) : 1 - e;
}

/* ── LA POSA NON APPARE ALTROVE: SI STACCA DAL PEZZO ─────────────
   Per il busto e per la rampa il pezzo cambia POSA quando lo si prende:
   la collana indossata lascia il posto alla collana stesa, che sta sul
   ripiano, mezzo schermo piu' in basso. Misurato: 354 punti per il
   busto, 154 per la rampa, percorsi in UN fotogramma, prima che la
   macchina si fosse mossa di un millimetro. E' il salto vero del
   verdetto — il pezzo parte da un punto, ricompare in un altro, e solo
   dopo il volo lo riporta indietro.
   Provate tutte e due le strade chieste, e misurate:
   · mirare a un punto che passa con continuita' dall'una all'altra non
     toglie niente, perche' a saltare non e' la MIRA: e' l'oggetto;
   · far ENTRARE la posa dove sta quella indossata azzera il salto (0
     punti contro 354), e in piu' racconta una cosa vera — il gioiello
     si stacca dal busto e si posa mentre la macchina si avvicina.
   Si sceglie la seconda. La posa parte dal centro del pezzo indossato,
   si accende con la controvela mentre l'espositore si spegne, e scivola
   a casa sua CON LA MACCHINA: la frazione di strada che ha fatto la
   molla e' la stessa frazione che ha fatto lei. Un tempo suo sarebbe un
   secondo movimento, ed e' esattamente quello che si sta togliendo. */
/* ── E LA STRADA SI DISEGNA SULLO SCHERMO, NON NEL MONDO ────────
   Primo tentativo, misurato: si spostava la posa nel MONDO, dal centro
   del pezzo indossato a casa sua, con la stessa frazione di strada fatta
   dalla macchina. Sulla carta e' una strada sola; a schermo no. La
   macchina all'inizio corre (una molla critica fa il trenta per cento
   del cammino nei primi due decimi) e si tira dietro tutto verso l'alto,
   mentre la posa scende piano: misurata, la collana saliva da 264 a 187
   punti e poi tornava giu' a 362 — una inversione, cioe' di nuovo due
   movimenti.
   Quindi la strada si scrive dove il cliente la guarda: SULLO SCHERMO.
   Due punti fissi — dov'era il pezzo indossato al tocco, e dove la posa
   si fermera' (proiettata con la macchina ARRIVATA, che si conosce gia'
   perche' il bersaglio e' chiuso) — e in mezzo una curva sola. A ogni
   fotogramma si guarda dove cadrebbe la posa a casa sua, si vede di
   quanti punti manca, e si sposta di quei punti. All'arrivo lo scarto e'
   zero per costruzione, e la posa e' esattamente a casa. */
let posaMobile = null, posaVia = 0;
const posaA = new THREE.Vector3(), posaS0 = new THREE.Vector2(),
      posaS1 = new THREE.Vector2(),
      _pBox = new THREE.Box3(), _pCw = new THREE.Vector3(),
      _pCp = new THREE.Vector3(), _pInv = new THREE.Matrix4(),
      _pZero = new THREE.Vector3(), _pPro = new THREE.Vector3(),
      _pDes = new THREE.Vector3(), _pAsse = new THREE.Vector3();
/* dove cade un punto del mondo, con la macchina ARRIVATA: `_camMisura`
   e' gia' apparecchiata sul bersaglio da `riquadroSulBersaglio` */
function schermoArrivo(punto, fuori){
  _camMisura.fov = camera.fov; _camMisura.aspect = camera.aspect;
  _camMisura.near = camera.near; _camMisura.far = camera.far;
  _camMisura.up.copy(camera.up);
  _camMisura.position.copy(occhioObiettivo);
  _camMisura.lookAt(miraObiettivo);
  _camMisura.updateMatrixWorld(true);
  _camMisura.updateProjectionMatrix();
  _pPro.copy(punto).project(_camMisura);
  return fuori.set((_pPro.x * 0.5 + 0.5) * innerWidth,
                   (-_pPro.y * 0.5 + 0.5) * innerHeight);
}
function fermaPosa(){
  /* SI TORNA SEMPRE A CASA, anche al ritorno: la posa e' un oggetto del
     modello, e lasciarla spostata vorrebbe dire trovarla fuori posto la
     volta dopo. Al ritorno e' trasparente da un pezzo, e non si vede. */
  if(posaMobile) posaMobile.position.copy(posaA);
  posaMobile = null; posaVia = 0;
}
function avviaPosa(verso){
  fermaPosa();
  const ste = stesa(attiva, scelto), ind = (merci[attiva] || [])[scelto];
  if(!ste || !ind || ridotto) return;
  scena.updateMatrixWorld(true);
  _pBox.setFromObject(ind); if(_pBox.isEmpty()) return; _pBox.getCenter(_pCw);
  _pBox.setFromObject(ste); if(_pBox.isEmpty()) return; _pBox.getCenter(_pCp);
  posaA.copy(ste.position);          // casa sua, sul ripiano
  /* i due capi della strada, in punti di schermo. All'andata si parte da
     dove sta il pezzo indossato ADESSO e si arriva dove la posa cadra'
     con la macchina arrivata; al ritorno esattamente al contrario. */
  if(verso < 0){
    _pPro.copy(_pCw).project(camera);
    posaS0.set((_pPro.x * 0.5 + 0.5) * innerWidth,
               (-_pPro.y * 0.5 + 0.5) * innerHeight);
    schermoArrivo(_pCp, posaS1);
  } else {
    _pPro.copy(_pCp).project(camera);
    posaS0.set((_pPro.x * 0.5 + 0.5) * innerWidth,
               (-_pPro.y * 0.5 + 0.5) * innerHeight);
    schermoArrivo(_pCw, posaS1);
  }
  _pInv.copy(ste.parent.matrixWorld).invert();
  _pZero.set(0, 0, 0).applyMatrix4(_pInv);
  posaMobile = ste;
  posaVia = occhio.distanceTo(occhioObiettivo);
  passoPosa();                       // in posto subito, senza un fotogramma di scarto
  sveglia();
}
function passoPosa(){
  if(!posaMobile) return;
  /* la frazione di volo gia' fatta dalla macchina: e' lei l'orologio.
     Un tempo suo sarebbe un secondo movimento, ed e' quello che si sta
     togliendo. Sotto un millimetro di strada non c'e' niente da
     accompagnare. */
  const q = posaVia > 0.001
    ? Math.max(0, Math.min(1, 1 - occhio.distanceTo(occhioObiettivo) / posaVia)) : 1;
  const e = q * q * (3 - 2 * q);
  const xd = posaS0.x + (posaS1.x - posaS0.x) * e;
  const yd = posaS0.y + (posaS1.y - posaS0.y) * e;
  /* dove cadrebbe se stesse gia' a casa, con la macchina di ADESSO */
  _pPro.copy(_pCp).project(camera);
  const sx = (_pPro.x * 0.5 + 0.5) * innerWidth;
  const sy = (-_pPro.y * 0.5 + 0.5) * innerHeight;
  /* quanti metri vale un punto di schermo sul piano del pezzo */
  const perPunto = 2 * camera.position.distanceTo(_pCp)
                 * Math.tan(camera.fov * Math.PI / 360) / innerHeight;
  _pDes.set(0, 0, 0);
  _pAsse.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _pDes.addScaledVector(_pAsse, (xd - sx) * perPunto);
  _pAsse.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
  _pDes.addScaledVector(_pAsse, -(yd - sy) * perPunto);
  /* lo scarto si misura nel MONDO e si scrive nel PADRE: il gruppo di
     una famiglia «scambia» viene traslato dallo swipe, e sommare un
     vettore di mondo a una posizione locale sarebbe giusto per caso */
  _pDes.applyMatrix4(_pInv).sub(_pZero);
  posaMobile.position.copy(posaA).add(_pDes);
  posaMobile.updateMatrixWorld(true);
  if(q > 0.995) fermaPosa();
}

function isolaPezzo(){
  const p = merci[attiva][scelto], g = bancoDi(scelto);
  const ste = stesa(attiva, scelto);
  /* GLI ALTRI BANCHI SPARISCONO SUBITO. Sono fuori quadro — la macchina e'
     gia' dentro la famiglia — e una dissolvenza che nessuno vede e' solo
     lavoro in piu' su ogni fotogramma del volo. */
  for(const f of FAMIGLIE) for(const gg of (banchi[f.id] || []))
    if(gg !== g) gg.visible = false;
  g.visible = true;
  /* SI ACCENDE LA POSA, quando c'e'. La collana indossata resta spenta:
     e' la stessa catena, ma quella tiene la forma solo finche' il busto
     c'e'. Anelli e orologi non hanno posa e si accendono come sempre. */
  const tieni = ste || p;
  const vela = mesiEspositore(g, tieni);
  tieni.traverse(o => { if(o.isMesh) o.visible = true; });
  /* e la posa ENTRA mentre l'espositore esce (vedi `avviaVela`) */
  avviaVela(vela, -1, ste ? mesiDi(ste) : []);
  /* L'OCCLUSIONE RESTA ACCESA. La spegnevo entrando nel pezzo, e insieme
     al faro era meta' del guaio: misurato sullo stesso fotogramma, il
     Tulum stava a 123,8 di luce al banco e a 162,6 in selezione, e i due
     terzi di quella salita venivano da qui e dal faro in parti quasi
     uguali. Senza occlusione le maglie del bracciale non hanno piu' la
     riga d'ombra che le separa e il pezzo diventa una sagoma piatta —
     proprio nel momento in cui lo si sta guardando da vicino. */
  ao.enabled = !aoSpenta; ao.updateGtaoMaterial(ste ? AO_POSATO : AO_BANCO);
  profondita(2);
  /* QUANTA LUCE SERVE LO DICE IL PEZZO, non il livello.
     Un metallo lucido non ha colore suo: fa vedere quello che gli sta
     intorno, e tolto l'espositore, davanti a una parete scura, una creola
     d'argento non ha piu' NIENTE da riflettere — usciva nera. Per quella
     serviva una scatola di luce, ed e' come si fotografa un gioiello.
     Ma un Regina Swatch non e' metallo: e' VERNICIATO, il colore ce l'ha
     suo, e la stessa scatola di luce glielo SCHIARISCE — entrava in
     selezione e il verde salvia diventava un verde pallido. Su un prodotto
     monocromo il colore E' il prodotto, quindi non si tocca.
     Si guarda di che cosa e' fatto il pezzo e si alza solo per la parte
     metallica. */
  let metalliche = 0, tutte = 0;
  p.traverse(o => { if(o.isMesh && o.material){
    tutte++; if(o.material.metalness > 0.5) metalliche++; } });
  const metallico = tutte ? metalliche / tutte : 1;
  /* IL FARO E' TUTTO PER IL METALLO, E NIENTE PER LA VERNICE. Lo avevo
     gia' reso proporzionale, ma sotto ci avevo lasciato un fondo di 1,35
     che toccava tutti: e su un Regina Swatch, che verniciato e' e il
     colore ce l'ha suo, quel fondo era solo luce bianca in piu'. Adesso
     va a zero, e il pezzo in selezione ha lo stesso colore che aveva sul
     suo espositore — che e' l'unico modo di guardarlo da vicino senza che
     cambi merce mentre lo guardi. Il metallo tiene i suoi 2,60 di prima:
     quello senza scatola di luce resta nero. */
  lampada.intensity = 2.60 * metallico;
  scena.environmentIntensity = AMBIENTE * (1 + 2.2 * metallico);
  /* NIENTE OMBRA, E ADESSO SO PERCHE'. Riaccesa e misurata: non compare
     un solo pixel. Il pezzo sta a venticinque centimetri sopra il piano —
     e' l'altezza a cui stava sul busto — e il punto del banco che gli sta
     sotto cade FUORI dal quadro, sotto il bordo basso. Un'ombra li' non
     la vede nessuno, e il calcolo lo si paga lo stesso.
     Che la collana isolata sembri un filo d'oro a mezz'aria e' vero, ma
     la causa non e' l'ombra: e' che una collana la sua posa ce l'ha dal
     BUSTO, e tolto quello resta un anello appeso al niente. Un anello e
     un orologio reggono da soli, una collana no. Sistemarlo vuol dire
     decidere se per le famiglie «scambia» il pezzo si isola davvero: e'
     una scelta di Massimo, non una rifinitura, e sta scritta qui. */
  /* IL RIPIANO RESTA. Provato a spegnerlo perche' con l'insieme attorno
     l'inquadratura si allarga e il bordo del banco rientrava in campo: ma
     sotto l'orizzonte non c'e' nient'altro, e restava una banda nera netta
     — peggio del bordo. Il ripiano e' la meta' bassa del mondo. La
     soluzione e' tenere l'insieme STRETTO, dentro l'inquadratura che il
     pezzo da solo aveva gia'. */
  /* ALZARE IL SOLE NON SERVE, PROVATO E MISURATO. L'idea era che l'ombra
     portata di una luce direzionale non entra nel buco degli anelli, e
     quindi avrebbe fatto il contatto senza spegnere l'oro. Ma un filo
     posato SULLA pietra proietta la sua ombra esattamente sotto di se', e
     da questa alzata la nasconde il filo stesso: a 1,85 volte la caduta
     misurata passava da 15,6 a 14,3, cioe' niente. Il contatto lo puo'
     fare solo l'occlusione. */
  const appoggia = !!ste;
  rend.shadowMap.enabled = appoggia;
  scena.traverse(o => { if(o.isMesh) o.castShadow = appoggia; });
}

function mostraTutto(conVela){
  /* e la posa torna a casa sua prima di tutto: se e' rimasta a meta'
     strada di uno scivolamento, tutto quello che segue la misurerebbe
     dove non sta */
  fermaPosa();
  /* SI RIENTRA COME SI E' USCITI. Se la vela e' ancora in corsa va chiusa
     prima, o i suoi materiali resterebbero trasparenti sotto quelli
     riaccesi qui sotto. */
  if(velaVerso) chiudiVela();
  togliInsieme();
  fondo.classList.remove("apribile", "ritirato");
  maniglia.setAttribute("aria-expanded", "true");
  cartello.classList.remove("pezzo");
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach((g, k) => {
    g.traverse(o => { if(o.isMesh) o.visible = true; });
    /* UNA COPIA SOLA PER FAMIGLIA, tranne quella in cui si e' entrati.
       Al banco tre busti in fila sarebbero un magazzino, non una vetrina.
       E dentro una famiglia vale lo stesso per le ALTRE: scritto
       «altrimenti tutte», passando da collane a orecchini col menu
       restavano accesi i tre busti e i due bracciali — accesi e fermi dove
       lo swipe li aveva lasciati, perche' a spostarli e' `applicaPos`, che
       tocca solo la famiglia attiva. In quadro finiva un espositore di
       un'altra categoria, grande il doppio e davanti a tutto. */
    g.visible = (livello >= 1 && f.id === attiva) ? true : k === 0;
  });
  /* E LE POSE SI SPENGONO QUI, DOPO. Le spegnevo in cima alla funzione, e
     due righe piu' sotto `g.traverse(o => o.visible = true)` riaccendeva
     ogni mesh del gruppo — posa compresa. Tornando al banco dalle collane
     restava una collana stesa sul bancone davanti al plinto: un pezzo per
     terra, che non c'entra niente con l'espositore. L'ordine conta: prima
     si riaccende tutto, poi si spegne quello che non va acceso. */
  for(const f of FAMIGLIE) (pose[f.id] || []).forEach(o => { if(o) o.visible = false; });
  ao.enabled = !aoSpenta; ao.updateGtaoMaterial(AO_BANCO); profondita(livello);
  lampada.intensity = 0;
  scena.environmentIntensity = AMBIENTE;
  rend.shadowMap.enabled = true;
  scena.traverse(o => { if(o.isMesh) o.castShadow = true; });
  /* E L'ESPOSITORE RIENTRA. Non ricompare: si riforma mentre la macchina
     si tira indietro, che e' lo stesso gesto letto al contrario — il
     gioielliere rimette il pezzo e la vetrina torna a essere la vetrina.
     La lista si prende DOPO aver riacceso tutto, se no ci finirebbero
     dentro solo le mesh che erano rimaste accese. */
  if(conVela && attiva && banchi[attiva] && scelto >= 0){
    const g = bancoDi(scelto);
    const ste = stesa(attiva, scelto);
    const tieni = ste || (merci[attiva] || [])[scelto];
    /* la posa esce mentre l'espositore rientra: la stessa dissolvenza
       incrociata dell'andata, letta al contrario */
    avviaVela(mesiEspositore(g, tieni), +1, ste ? mesiDi(ste) : []);
  }
  /* PER ULTIMO, quello che e' uscito dal cofanetto. Va per forza in
     fondo: qui sopra un `traverse` riaccende ogni mesh del gruppo, e un
     pezzo tolto tornerebbe in vetrina tornando indietro. E' lo stesso
     ordine che le pose hanno gia' imparato dodici righe piu' su. */
  applicaTolti();
}

/* SI TORNA INDIETRO DI UN PASSO PER VOLTA: dal pezzo all'espositore,
   dall'espositore al banco. Il tasto in alto e il trascinamento verso il
   basso fanno la stessa cosa, perche' su un telefono la mano non sale. */
function indietro(){
  /* ── UN PASSO E' UN PASSO, E LA CARTA E' UN PASSO ──────────────
     Con la finestra la carta non copre piu' tutto lo schermo per il
     collaudo del puntatore: un tocco che cade nel ritaglio arriva alla
     tela, e se cade fuori dal cerchio del gioiello la stanza lo legge
     come «riappoggia il pezzo» e uscirebbe dal pezzo CON LA CARTA ANCORA
     APERTA. Il passo indietro piu' vicino, quando c'e' una carta aperta,
     e' la carta: si chiude lei, e il pezzo resta dov'e'. Vale anche per
     il pizzico all'indietro, che passa di qui. */
  if(!cartaPezzo.hidden){ chiudiCarta(); return; }
  if(livello === 2){
    livello = 1;
    tocco();
    lampo();
    /* il quadro del pezzo non vale piu' niente: la banda torna quella
       vera e il volo verso il pezzo non e' piu' in corso */
    voloAlPezzo = false; bandaPezzo = null;
    mostraTutto(true);
    azzeraPizzico();
    inquadraFamiglia();
    applicaPos(false);
    /* e la posa torna dove il pezzo stava sull'espositore, con la stessa
       legge dell'andata: viaggia con la macchina, non con un tempo suo.
       Si chiama DOPO `inquadraFamiglia`, che e' chi decide la strada. */
    avviaPosa(+1);
    mostraScheda();
    sveglia();
  } else if(livello === 1) vaiAlBanco();
}
document.getElementById("dietro").onclick = indietro;

function mostraScheda(){
  /* LA STAZIONE E' QUELLA DOVE SI VA, NON QUELLA DOVE SI E'.
     Leggeva `pos`, cioe' la posizione ISTANTANEA della scena. Ma al
     rilascio di uno swipe `pos` sta ancora sulla stazione di partenza — il
     dito la muove al massimo di quarantasei pixel, una frazione di
     stazione — mentre la destinazione appena decisa sta in `posMeta`, e ci
     arriva la molla nel mezzo secondo dopo. Risultato: la macchina andava
     sul secondo anello e il cartellino restava sul primo. E con lui
     `indice`, cioe' il pezzo che un tocco avrebbe aperto: si vedeva il
     secondo e si apriva il primo.
     La scheda descrive la DESTINAZIONE, sempre. */
  const st = stazioni(attiva), qui = st[Math.round(posMeta)] || [];
  if(!qui.length) return;
  indice = qui.find(k => !cTolto(attiva, k));
  if(indice === undefined) indice = qui[0];
  if(qui.length === 1){
    const p = RIPIANI[attiva][qui[0]] || ["", "", ""];
    /* E UN POSTO VUOTO LO DICE. Tolto un pezzo, la sua fermata resta —
       e' una sede dell'espositore, non una riga di lista — ma il
       cartellino non puo' continuare a battere nome e prezzo di una cosa
       che non c'e' piu'. Il prezzo se ne va con lei: quello e' il valore
       di un pezzo nel cofanetto, e quel pezzo fuori. */
    if(cTolto(attiva, qui[0]))
      scritte(p[0], "", "Non e’ piu’ nel cofanetto.", GESTI[MODI[attiva]]);
    else scritte(p[0], p[2] + " €", p[1], GESTI[MODI[attiva]]);
  } else {
    /* una stazione con piu' pezzi non ha UN nome: dice quali ci sono e
       invita a toccarne uno. Mettere il nome del primo sarebbe una scelta
       fatta al posto del cliente. */
    const nomi = qui.filter(k => !cTolto(attiva, k))
                    .map(k => (RIPIANI[attiva][k] || [""])[0]);
    scritte(FAMIGLIE.find(f => f.id === attiva).nome, "",
            nomi.join(" · "),
            // «tocca un pezzo» sta gia' dentro GESTI: ripeterlo qui dava
            // «tocca un pezzo · scorri per cambiare nastro · tocca un pezzo»
            GESTI[MODI[attiva]]);
  }
}

/* ── QUANTO CARTELLINO SI VEDE ────────────────────────────────────
   Ritirato: nome, prezzo e gesto. Aperto: anche il materiale, l'insieme e
   il bottone. L'inquadratura si rifa' DOPO che il browser ha impaginato
   l'altezza nuova — chiesta subito, getBoundingClientRect torna ancora
   quella vecchia e la macchina centra su una banda che non esiste piu'. */
function scheda(ritirata){
  fondo.classList.toggle("ritirato", ritirata);
  maniglia.setAttribute("aria-expanded", ritirata ? "false" : "true");
  maniglia.setAttribute("aria-label", ritirata ? "apri la scheda" : "chiudi la scheda");
  segnaSugg();
  adattaTitolo();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    /* ── E NON MENTRE LA MACCHINA VOLA ──────────────────────────
       Entrando nel pezzo e' `apriPezzo` a chiamare questa funzione, e
       due fotogrammi dopo il volo e' gia' partito: rifare il quadro qui
       vuol dire cambiare il bersaglio in corsa — la «correzione
       ritardata» che il verdetto del cliente descrive. Il quadro del
       pezzo lo decide `apriPezzo`, in fondo, una volta sola. */
    if(voloAlPezzo){ sveglia(); return; }
    if(livello === 2){
      /* la scheda che si apre o si chiude cambia la banda DAVVERO, ed e'
         l'unico momento in cui la si rilegge */
      bandaPezzo = misuraArea();
      inquadraPezzo();
    }
    else if(livello === 1) inquadraFamiglia();
    sveglia();
  }));
}
maniglia.onclick = () => scheda(!fondo.classList.contains("ritirato"));

let vuoleInsieme = true;
try { vuoleInsieme = localStorage.getItem("regina.insieme") !== "no"; } catch(_) {}
const tastoInsieme = document.getElementById("tasto-insieme");
function segnaInsieme(){
  tastoInsieme.setAttribute("aria-pressed", vuoleInsieme ? "true" : "false");
  segnaSugg();
}
tastoInsieme.onclick = () => {
  vuoleInsieme = !vuoleInsieme;
  try { localStorage.setItem("regina.insieme", vuoleInsieme ? "si" : "no"); } catch(_) {}
  segnaInsieme();
  sveglia();
};
segnaInsieme();

/* ── «METTI DA PARTE L'INSIEME» ───────────────────────────────────
   Il tasto c'era, largo quanto la scheda, in turchese pieno — e non
   aveva nessun gestore: si premeva e non succedeva niente. E' il peggio
   dei tasti morti, perche' e' anche il piu' evidente.
   Adesso risponde, e risponde in due posti insieme: il tasto stesso dice
   «Messo da parte» con una spunta disegnata (non un'emoji: sarebbe
   l'unico segno della schermata a venire da un altro alfabeto), e la
   striscia in basso dice dove e' finito l'insieme. Tre secondi e il
   tasto torna com'era, perche' un comando che resta «fatto» per sempre
   non si puo' piu' rifare — e un insieme si mette da parte ogni volta
   che se ne compone uno nuovo. */
const tastoDaParte = document.querySelector("#insieme button.primo");
if(tastoDaParte) tastoDaParte.onclick = () => {
  if(tastoDaParte.classList.contains("fatto")) return;
  const d = tastoDaParte.querySelector(".detto");
  const prima = d.textContent;
  tastoDaParte.classList.add("fatto");
  d.textContent = "Messo da parte";
  mostraToast("L’insieme e’ in vetrina.", {durata:4000});
  clearTimeout(tastoDaParte.__t);
  tastoDaParte.__t = setTimeout(() => {
    tastoDaParte.classList.remove("fatto");
    d.textContent = prima;
  }, 3000);
};

/* ══════════════════════════════════════════════════════════════
   L'AIUTO SI IMPARA PER LIVELLO, NON UNA VOLTA PER SEMPRE

   `cartello.classList.add("imparato")` si attaccava a QUALUNQUE
   trascinamento di piu' di 24 pixel, a qualunque livello, e non si
   toglieva mai: bastava uno scorrimento al banco — il primo gesto che
   chiunque fa — e la riga spariva anche dentro il pezzo, dove e' l'unico
   posto senza un appiglio visibile per capire cosa si puo' fare. E
   spariva per sempre, anche alla visita di domani: nessuna chiave in
   memoria, quindi ricaricando tornava, ma dentro la stessa visita no.
   Ogni livello — e al livello 1 ogni MODO, perche' scorrere una fila di
   anelli e far ruotare gli espositori delle collane sono due gesti
   diversi — si impara per conto suo e se lo ricorda.
   ══════════════════════════════════════════════════════════════ */
function chiaveGesto(){
  if(livello === 0) return "rj.gesto.L0.banco";
  if(livello === 1) return "rj.gesto.L1." + (MODI[attiva] || "cammina");
  if(livello === 2) return "rj.gesto.L2.pezzo";
  return null;
}
function giaImparato(k){
  try { return localStorage.getItem(k) === "si"; } catch(_) { return false; }
}
function segnaImparato(){
  const k = chiaveGesto(); if(!k) return;
  try { localStorage.setItem(k, "si"); } catch(_) {}
  aggiornaAiuto();
}
function aggiornaAiuto(){
  const k = chiaveGesto();
  cartello.classList.toggle("imparato", !!k && giaImparato(k));
}

let livelloScritto = -1;
function scritte(t, n, s, g){
  insieme.hidden = true;
  /* IL CARTELLINO CAMBIA CON UN BATTITO. Non e' un vezzo: al cambio di
     livello cambiano tutte e quattro le righe insieme, e quattro
     sostituzioni simultanee lette a schermo pieno sembrano un errore di
     caricamento. Il testo si mette SUBITO — l'impaginazione, che
     `adattaTitolo` misura, deve essere quella nuova — e a muoversi e'
     solo l'opacita'. Dentro lo stesso livello non succede niente:
     scorrendo il banco il nome della famiglia cambia a ogni espositore,
     e li' un battito sarebbe uno sfarfallio. */
  const cambio = livello !== livelloScritto;
  livelloScritto = livello;
  titolo.textContent = t; numero.textContent = n;
  sotto.textContent = s; document.getElementById("gesto-testo").textContent = g;
  adattaTitolo();
  aggiornaAiuto();
  clearTimeout(cartello.__t);
  if(cambio && !ridotto){
    cartello.classList.add("via");
    // due fotogrammi perche' il battito si VEDA, e un cronometro dietro
    // perche' in una scheda che non disegna rAF non scatta affatto e il
    // cartellino resterebbe trasparente
    requestAnimationFrame(() => requestAnimationFrame(
      () => cartello.classList.remove("via")));
    cartello.__t = setTimeout(() => cartello.classList.remove("via"), 90);
  } else cartello.classList.remove("via");
}

/* Si prova a 34 e si scende di due in due finche' il nome non sta su una
   riga sola. Non si indovina quanti caratteri ci stanno: si GUARDA se e'
   andato a capo — l'altezza del blocco lo dice, e funziona con qualunque
   nome, anche quelli di Stefano che non abbiamo ancora. */
function adattaTitolo(){
  /* e a cartellino ritirato il nome parte piu' piccolo: li' non e' la
     testata di una pagina, e' l'etichetta sotto un oggetto che si sta
     guardando. La misura la scrive questa funzione, non il foglio di
     stile: una regola CSS non batte uno stile in riga. */
  /* ── E NEL PANNELLO IL NOME PUO' ANDARE A CAPO ────────────────
     Su un telefono il nome sta su una riga per forza: sotto c'e' la scena
     e ogni riga in piu' e' ambiente in meno. In una colonna da 304 punti
     no — «Bracciale Maglia Larga» a 42 px vuole due righe, ed e' cosi'
     che lo impaginano le schede prodotto di riferimento. Si scende solo
     se ne vuole tre, e mai sotto il 72 per cento della misura di partenza:
     a 42 fa 30, e con un corpo di 14 il rapporto resta 2,14 — gia' sotto
     la banda 2,6-3,7 delle maison, quindi e' il fondo, non un margine.
     La misura di partenza la dice il foglio di stile (`--nome`): 42 su
     desktop, 32 col telefono coricato, dove l'altezza e' 390 punti. */
  if(larga){
    let px = parseFloat(getComputedStyle(document.documentElement)
                          .getPropertyValue("--nome")) || 42;
    const fondoScala = Math.max(22, Math.round(px * 0.72));
    titolo.style.fontSize = px + "px";
