   male — riceveva l'applicazione intera: i voli di macchina, il dondolo
   del pezzo, l'inerzia, la carta che si gira su se stessa.
   Qui non si spegne tutto: si toglie lo SPOSTAMENTO e si tiene la
   DISSOLVENZA, che e' quello che le linee guida chiedono. Ogni durata
   scende a 120 ms e nessuna cosa si muove piu' nello spazio: compare e
   sparisce. I voli e il dondolo li spegne il codice, non il foglio di
   stile — li' si muove una macchina, non un rettangolo.
   ══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.12s !important;
    animation-iteration-count:1 !important;
    animation-delay:0s !important;
    transition-duration:.12s !important;
    transition-delay:0s !important}
  #cartello.via, #dietro.via, #fondo.via{transform:none}
  #carta-pezzo.via #porta{transform:none}
  #galleria.via{transform:none}
  /* LA GIRAVOLTA DELLA CARTA RESTA. Toglierle la rotazione la
     romperebbe: il retro e' nascosto dalla faccia posteriore, e senza il
     giro non comparirebbe mai. Le basta il tetto dei 120 ms qui sopra —
     0,62 s diventano 0,12, ed e' un cambio di faccia, non un carosello. */
  /* la carta arriva senza alzarsi da terra */
  @keyframes porgi{from{opacity:0}to{opacity:1}}
  #menu button:active, #dietro:active, #vesti button:active{transform:none}
  /* la striscia del riscontro non si alza da sotto: compare e sparisce,
     e resta dove sta. Il `translate(-50%)` non e' movimento — e' come si
     centra un elemento — quindi resta. */
  #toast{transform:translate(-50%, 0)}
  #toast.qui{transform:translate(-50%, var(--giu, 0px))}
  /* e nella galleria non si posa niente con una molla: la fotografia
     cambia e basta. Lo spostamento sotto il dito resta, perche' quello
     non e' un'animazione: e' il dito. */
  #rotaia.posa, #rotaia img.posa{transition:none}
  #chiudi-carta:active, #chiudi-galleria:active, #insieme button:active,
  #retro-fondo button:active, #tasto-insieme:active,
  #rail-sugg .card:active, #strisciafoto .mini:active{transform:none}
  /* la carta accanto tiene il suo `translate`: quello non e' movimento,
     e' come si centra un elemento su un punto dello spazio */
  #accanto .carta:active{transform:translate(-50%,-50%)}
  #maniglia:active span{transform:none}
  #fondo.apribile:not(.ritirato) #maniglia:active span{transform:scaleY(-1)}
}

/* ══════════════════════════════════════════════════════════════
   LO SCHERMO LARGO — la scena piena e il pannello a destra

   IL CRITERIO E' DICHIARATO: `(min-width:900px)` OPPURE
   `(min-aspect-ratio:6/5)`, l'unione delle due. Serve l'unione perche' i
   due casi non si contengono: il telefono CORICATO e' largo di forma
   (844x390, proporzione 2,16) ma stretto di punti, e una finestra di
   desktop rimpicciolita (1000x900, proporzione 1,11) e' larga di punti ma
   quasi quadrata. Tutti e due sono «schermi larghi» — c'e' posto per una
   colonna accanto alla scena — e tutti e due devono prendere questo
   impianto. Sotto le due soglie non cambia NIENTE: il telefono verticale
   (390x844 → 0,46 e 390 punti) non entra qui dentro da nessuna delle due
   porte, ed e' finito com'e'.

   MISURATO PRIMA DI QUESTO BLOCCO, a 1440x900 con un anello aperto:
   il cartellino era una fascia da 1440 punti con il nome a sinistra e il
   prezzo a 1.416 punti di distanza, il menu cinque parole da 9,5 px
   distribuite con 290 punti di vuoto in mezzo, il marchio 18 px in cima a
   1440, i dischetti della fodera all'estremita' opposta della loro riga, e
   la carta del pezzo un rettangolo da 330 punti sospeso in mezzo allo
   schermo. Non era un disegno per schermi larghi: era il telefono stirato.

   L'IMPIANTO E' QUELLO DEI CONFIGURATORI DI SETTORE (Rolex, Serpenti; le
   schede prodotto di Boucheron e Cartier): scena piena, e una colonna
   sottile di carta a destra che porta tutto il testo e tutti i comandi.
   Non si costruisce un secondo pannello: si SPOSTA il cartellino. #fondo
   contiene gia' nome, prezzo, materiale, riga del gesto, fodera,
   suggerimenti nella forma scelta e «metti da parte» — cioe' esattamente
   l'elenco che il pannello deve ospitare — e tutto il codice che ci
   scrive dentro continua a funzionare senza sapere dove sta.
   ══════════════════════════════════════════════════════════════ */
@media (min-width:900px), (min-aspect-ratio:6/5){

  /* 360 punti e' la banda dei riferimenti (320-400). Sotto i 320 la riga
     di testo scende sotto i 45 caratteri e il nome in Bodoni va a capo
     due volte; sopra i 400 la colonna comincia a rubare scena. */
  /* il corpo del nome del pezzo e' un TOKEN e non un numero nel codice:
     `adattaTitolo` scrive la misura in riga (una regola CSS non batte uno
     stile in riga) e deve poterla LEGGERE da qui, se no il coricato
     resterebbe a 42 px come il desktop — che e' quello che succedeva. */
  :root{--pannello:360px; --barra:46px; --nome:42px}

  /* ── 1 · IL CARTELLINO DIVENTA IL PANNELLO ──────────────────── */
  #fondo{left:auto; right:0; top:0; bottom:0; width:var(--pannello);
         padding-top:calc(var(--barra) + 18px);
         pointer-events:auto; overflow-y:auto; overflow-x:hidden;
         overscroll-behavior:contain;
         /* di carta piena, non un gradiente: un velo che sfuma ha senso
            sopra la scena, non accanto. Il filetto e l'ombra sono quelli
            del sistema — il filo di #filo e l'ombra lunga e bassa che la
            carta del pezzo ha gia'. */
         background:var(--carta);
         border-left:1px solid var(--filo);
         box-shadow:-20px 0 48px -30px rgba(26,22,20,.42)}
  #cartello{padding:0 28px 26px}
  /* la maniglia non ha piu' niente da tirare: il pannello e' alto quanto
     lo schermo e il contenuto ci sta tutto (e se non ci sta, scorre) */
  #maniglia, #fondo.apribile #maniglia{display:none}
  #fondo.ritirato{padding-top:calc(var(--barra) + 18px)}
  /* e il ritiro si disfa: `scheda(true)` continua a essere chiamato — e'
     giusto che lo sia, e' il telefono a decidere cosa nascondere — ma qui
     non c'e' niente da nascondere. Si rimettono i valori di partenza a
     mano, uno per uno, perche' da `max-height:0` non si torna con una
     parola sola. */
  #fondo.ritirato #sotto{opacity:1; max-height:96px; visibility:visible;
                         pointer-events:auto; margin-top:14px}
  #fondo.ritirato #insieme{opacity:1; max-height:320px; visibility:visible;
                           pointer-events:auto; margin-top:18px;
                           padding-top:14px; border-top-width:1px}

  /* ── 2 · LA TIPOGRAFIA DEL PANNELLO ─────────────────────────────
     Nome e prezzo non stanno piu' su una riga: in 304 punti di colonna
     `space-between` li spingerebbe ai due bordi con il nome a capo, che e'
     lo stesso difetto di prima in piccolo. Si impilano, come nelle schede
     prodotto di riferimento. I corpi sono quelli chiesti: Bodoni 42 per il
     nome (il rapporto col corpo del testo resta 3,0, dentro la banda
     2,6-3,7 delle maison), Inter 14 per il materiale, 20 per il prezzo,
     10 in maiuscoletto per gli occhielli. */
  #cartello .riga{display:block}
  #cartello b{font-size:42px; line-height:1.02; display:block}
  #cartello .prezzo{display:block; margin-top:12px;
                    font-size:20px; color:var(--testo)}
  /* la misura di riga: 60 caratteri e' il tetto dei riferimenti, e a 14 px
     una colonna da 304 punti ne tiene 44 — il tetto non tocca mai, ed e'
     scritto perche' regga anche il pannello da 400 a 1920. */
  #cartello p{margin-top:14px; font-size:14px; line-height:1.55;
              max-width:60ch}
  #cartello .gesto{margin-top:2px; font-size:11.5px; max-height:40px;
                   align-items:flex-start}
  #cartello .gesto svg{margin-top:2px}
  #insieme .eco{font-size:10px}
  #insieme .r b{font-size:18px}
  #insieme button{padding:15px 10px; font-size:10px}

  /* ── 3 · LA FODERA E LA SUA DIDASCALIA, ACCANTO ──────────────────
     I quattro dischetti stavano a `align-self:flex-end`: su 1440 punti
     finivano all'angolo opposto della riga che li spiega, e un comando
     senza nome accanto e' una decorazione. Nel pannello tornano a
     sinistra e si portano dietro l'etichetta — che il tag `aria-label`
     gia' diceva a chi ascolta e nessuno diceva a chi guarda. */
  #basso{gap:14px}
  #vesti{align-self:flex-start; align-items:center}
  #vesti::before{content:"La fodera"; font:700 10px/1 Inter,sans-serif;
                 letter-spacing:.12em; text-transform:uppercase;
                 color:var(--tenue); margin-right:4px}
  #tasto-insieme{align-self:flex-start}

  /* ── 4 · LA BARRA IN ALTO: i reparti a sinistra, il marchio a destra ──
     La riga delle famiglie sta SULLA SCENA, non nel pannello. Il pannello
     e' il PEZZO — cambia con quello che si guarda — mentre i reparti non
     cambiano mai: metterli insieme renderebbe ambigua l'unica cosa che il
     pannello deve dire. E' anche la posizione dei configuratori citati.
     Il marchio non e' piu' centrato sul viewport (li' cadrebbe a cavallo
     del pannello): sta all'estremita' della scena, come l'insegna sopra
     la vetrina, e i reparti gli stanno a sinistra. */
  #alto{right:var(--pannello); height:calc(var(--barra) + 24px);
        align-items:flex-start; padding:0 20px; gap:18px; z-index:5;
        background:linear-gradient(to bottom, var(--carta) 34%,
                   rgba(250,248,245,.70) 72%, transparent)}
  /* `flex:none` non e' un dettaglio: in una riga flessibile l'immagine si
     lascia stringere, e misurato il marchio usciva schiacciato nell'angolo
     invece che alto 16 punti. */
  #alto img{position:static; transform:none; margin-left:auto; flex:none;
            height:16px; margin-top:15px}
  #dietro{flex:none; margin-top:15px}
  #menu{flex:0 1 auto; padding:0; gap:26px; justify-content:flex-start}
  /* `flex:1 1 0` distribuiva le cinque voci su tutta la larghezza: e' la
     regola giusta su un telefono da 390 punti e la sola causa dei 290
     punti di vuoto qui. Ogni voce torna larga quanto la sua parola. */
  #menu button{flex:0 0 auto; padding:16px 0 13px; font-size:10px}
  #menu button::before{bottom:7px}
  #menu button.qui::before{left:0; right:0}
  /* variante (a): la riga dei suggerimenti esce dalla testata — che qui e'
     alta 46 punti e non ha posto per una seconda riga — e il codice la
     porta nel pannello. Qui si rimette a posto la fascia. */
  :root[data-sugg="a"] #alto{flex-wrap:nowrap; padding:0 20px;
    background:linear-gradient(to bottom, var(--carta) 34%,
               rgba(250,248,245,.70) 72%, transparent)}
  :root[data-sugg="a"] #riga-sugg{order:0; margin-top:16px}
  /* variante (c): il rail e' gia' dentro il cartellino, quindi e' gia' nel
     pannello. Prende solo un po' piu' d'aria. */
  #rail-sugg .card{flex:0 0 92px}

  /* ── 5 · LA CARTA DEL PEZZO SI AGGANCIA NEL PANNELLO ─────────────
     Non galleggia piu' al centro: OCCUPA il pannello. E' la stessa mossa
     delle schede prodotto 60/40 — la scena resta intera a sinistra, la
     scheda prende la colonna — e risolve da sola i 330 punti sospesi in
     mezzo a 1440. Il velo sparisce: non c'e' piu' niente da scostare,
     perche' la carta non copre la scena. Il retro si gira nello stesso
     posto, perche' il posto e' il foglio, non lo schermo. */
  #carta-pezzo{left:auto; right:0; width:var(--pannello); padding:0;
               place-items:stretch}
  #carta-pezzo .velo{display:none}
  #porta{max-width:none; width:100%; height:100%; perspective:1600px}
  /* l'altezza la scrive `misuraCarta` in riga, e in riga vince: qui la
     carta non si misura sul contenuto, riempie la colonna. E' l'unico
     `!important` del blocco, e c'e' scritto perche'. */
  #foglio{height:100% !important}
  /* piatta contro il pannello: il raggio e le due ombre servivano a
     staccarla dal velo, e il velo non c'e' piu'. Il filetto di sinistra lo
     porta gia' il pannello. */
  #foglio .faccia{border-radius:0;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,
               -1px 0 0 0 var(--filo)}
  #chiudi-carta{top:12px; right:12px}
  /* ── E LA CARTA E' IL PANNELLO, quindi ne porta la scala ─────────
     Aperta, la carta COPRE il pannello: se il nome del pezzo restasse a
     27 px mentre il pannello lo scrive a 42, la stessa colonna cambierebbe
     scala tipografica a seconda che la carta sia aperta o chiusa — e per
     chi guarda e' la stessa cosa, letta due volte in due modi. I corpi
     sono quelli della regola: Bodoni 40 per il nome, Inter 14 per il
     materiale, 20 per il prezzo, 10 in maiuscoletto per gli occhielli.
     La misura di riga resta sotto i 60 caratteri: 328 punti a 14 px ne
     tengono 47. */
  #carta-dentro{padding:20px 24px 2px}
  #carta-dentro .nome{font-size:40px}
  #carta-dentro .mat{margin-top:8px; font-size:14px; max-width:60ch}
  #carta-dentro .prezzo{margin-top:12px; font-size:20px}
  #carta-dentro .dati{margin-top:16px; padding-top:14px; font-size:12.5px}
  #carta-dentro .stato{font-size:10px}
  #dedica{margin:18px 24px 20px; padding:16px 18px}
  #dedica .eco{font-size:10px}
  #voci.nastro{margin:18px 24px 0}
  #retro-titolo{font-size:32px}
  #retro-sotto{font-size:13.5px}
  #foglio .retro .dentro-carta{padding:26px 24px}

  /* ── 6 · LA FINESTRA DELLA CARTA NON SERVE PIU' ──────────────────
     La variante `carta=finestra` scava un buco nel cartoncino per far
     vedere il pezzo vero: su un telefono e' l'unico modo, perche' la carta
     copre tutto lo schermo. Qui la scena e' GIA' accanto — il pezzo si
     vede e continua a girare col dito a due dita di distanza — e un buco
     nella colonna mostrerebbe il pannello, non la stanza. Quindi in
     desktop la carta si riprende la sua fotografia e il riquadro lo fa la
     macchina, sulla scena a sinistra (il codice spegne il ritaglio). */
  :root[data-carta="finestra"] #ritratto,
  :root[data-carta="due"] #ritratto{visibility:visible}
  :root[data-carta="finestra"] .riga-foto,
  :root[data-carta="due"] .riga-foto{margin:0; border-radius:0; outline:0}
  :root[data-carta="finestra"] .riga-foto .quante,
  :root[data-carta="due"] .riga-foto .quante{display:block}
  :root[data-carta="finestra"] .riga-foto.senza-foto,
  :root[data-carta="due"] .riga-foto.senza-foto{border-bottom:1px solid var(--filo)}
  :root[data-carta="finestra"] #carta-pezzo,
  :root[data-carta="due"] #carta-pezzo{pointer-events:auto}
  :root[data-carta="finestra"] #strisciafoto{justify-content:flex-start}
}

/* A 1920 la colonna sale a 400 — il tetto della banda dei riferimenti —
   perche' li' 360 punti su 1920 cominciano a sembrare un ritaglio. */
@media (min-width:1800px){ :root{--pannello:400px} }

/* IL TELEFONO CORICATO E' UNO SCHERMO LARGO, ma da 390 punti di altezza:
   la colonna scende a 300 (sotto il minimo dei riferimenti, ma li' il
   riferimento e' un desktop) e la barra si assottiglia, perche' ogni punto
   tolto in alto e' un punto che la scena non ha. Misurato prima: la
   finestra utile era 181 punti su 390 e il pezzo usciva dal quadro in
   alto. */
@media (min-aspect-ratio:6/5) and (max-height:560px){
  :root{--pannello:300px; --barra:38px; --nome:32px}
  #cartello{padding:0 20px 16px}
  #cartello b{font-size:32px}
  #cartello .prezzo{margin-top:7px; font-size:17px}
  #cartello p{margin-top:9px; font-size:13px}
  #cartello .gesto{font-size:11px}
  #basso{gap:9px; margin-top:9px}
  #fondo.ritirato #sotto{margin-top:9px}
  #fondo.ritirato #insieme{margin-top:11px; padding-top:9px}
  #insieme .r{padding:2px 0}
  #insieme .r b{font-size:15px}
  #insieme button{margin-top:8px; padding:11px 10px}
  #fondo{padding-top:calc(var(--barra) + 12px)}
  #fondo.ritirato{padding-top:calc(var(--barra) + 12px)}
  #alto{height:calc(var(--barra) + 18px); padding:0 14px}
  #alto img{height:14px; margin-top:11px}
  #dietro{margin-top:11px}
  #menu{gap:16px}
  #menu button{padding:12px 0 10px; font-size:9px; letter-spacing:.07em}
  #menu button::before{bottom:5px}
  /* e la carta, che qui e' il pannello, scende con lui: 40 px di Bodoni in
     una colonna da 300 con 390 punti di altezza sarebbero due righe di
     nome e nient'altro in campo. */
  #carta-dentro{padding:14px 18px 2px}
  #carta-dentro .nome{font-size:30px}
  #carta-dentro .mat{margin-top:6px; font-size:13px}
  #carta-dentro .prezzo{margin-top:9px; font-size:17px}
  #carta-dentro .dati{margin-top:12px; padding-top:10px; font-size:11.5px}
  #dedica{margin:12px 18px 14px; padding:12px 14px}
  #voci.nastro{margin:12px 18px 0}
  #retro-titolo{font-size:26px}
  #foglio .retro .dentro-carta{padding:18px 18px}
}
</style>

<script type="module">
import * as THREE from "three";
/* IL CARICATORE DEI MODELLI NON STA PIU' QUI. Un import statico e' una
   richiesta che parte prima del primo fotogramma, e GLTFLoader col suo
   decoder Draco serve solo quando arriva la prima famiglia — cioe' dopo
   che la stanza si vede gia'. Scende con lei, in `caricaTutto()`. */
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
/* NIENTE RoomEnvironment. E' lo studio di serie della libreria: lo stesso
   ambiente in ogni pagina al mondo che usa three.js, ed e' il motivo per cui
   gli espositori sembravano resi e non fotografati. Qui la luce se la
   costruisce Regina, e si chiama vetrina. */

/* ═══════════════════════════════════════════════════════════════
   UNA STANZA SOLA.

   Non tre schermate con dentro un'immagine: un banco vero, e una
   macchina che ci si avvicina. «Indietro» non e' una pagina che

/* ══════════════════════════════════════════════════════════════
   LE VARIANTI DI GUSTO — due decisioni aperte, tre forme ciascuna

   Il canone di Massimo dice che il gusto sta a MONTE: ogni decisione
   estetica nuova e' un ventaglio di almeno tre opzioni
   strutturalmente diverse, costruite sul materiale vero, e la sceglie
   lui PRIMA del volume. Qui le decisioni aperte sono due, e le forme
   stanno tutte dentro l'app, finite e collaudate:

     · `?sugg=a|b|c` — CHE FORMA HANNO I SUGGERIMENTI
       a · una riga di testo nel cromo, in alto, fuori dalla scena;
       b · le carte velate agganciate al pezzo (quella di oggi), col
           contrasto risolto da un letto scuro sotto il solo testo;
       c · un rail di card 4:5 dentro la scheda, sotto il nome.
       Di serie resta (b), che e' quella che Massimo sta guardando.

     · `?carta=foto|finestra|due` — COSA APRE LA CARTA DEL PEZZO
       foto     · la fotografia, com'e' oggi;
       finestra · un ritaglio trasparente con dietro il pezzo VERO,
                  che continua a girare col dito dentro la finestra;
       due      · la finestra piu' la striscia delle foto vere sotto.
       Di serie resta (foto).

   I due valori si leggono dall'indirizzo all'avvio e si cambiano al
   volo dai globali `window.__sugg` / `window.__carta`: sono proprieta'
   con un accessore, non variabili, cosi' scriverci dentro RIAPPLICA la
   variante — non serve ricaricare e non serve chiamare niente a mano.
   Stessa forma di `window.__moto`, che e' la decisione gia' aperta sul
   rilascio del gesto.
   ══════════════════════════════════════════════════════════════ */
/* i nomi portano il prefisso V_ perche' `CARTA` in questo file e' gia'
   il colore della carta (0xFAF8F5), e due `const` con lo stesso nome nel
   modulo non sono un'ombra: sono un errore che uccide il file intero */
const V_SUGG = ["a", "b", "c"], SUGG_DI_SERIE = "b";
const V_CARTA = ["foto", "finestra", "due"], CARTA_DI_SERIE = "foto";
const scegli = (nome, elenco, serie) => {
  const v = (q.get(nome) || "").toLowerCase();
  return elenco.indexOf(v) >= 0 ? v : serie;
};
let sugg = scegli("sugg", V_SUGG, SUGG_DI_SERIE);
let carta = scegli("carta", V_CARTA, CARTA_DI_SERIE);
document.documentElement.dataset.sugg = sugg;
document.documentElement.dataset.carta = carta;
/* l'accessore e' su `window`, non un `let` esportato: da una sonda o
   dalla console si scrive `window.__sugg = "c"` e l'interfaccia cambia
   sotto gli occhi. Un valore fuori elenco viene ignorato in silenzio —
   e' un banco di prova, non deve poter rompere l'app. */
Object.defineProperty(window, "__sugg", {
  get: () => sugg,
  set: v => { v = String(v).toLowerCase();
              if(V_SUGG.indexOf(v) < 0 || v === sugg) return;
              sugg = v; applicaSugg(); }
});
Object.defineProperty(window, "__carta", {
  get: () => carta,
  set: v => { v = String(v).toLowerCase();
              if(V_CARTA.indexOf(v) < 0 || v === carta) return;
              carta = v; applicaCarta(); }

  const nav = document.getElementById("menu");

    if(nav.parentNode !== alto) alto.insertBefore(nav, document.getElementById("marchio"));

  }
}

/* ── QUANTO SCHERMO VEDE LA SCENA ─────────────────────────────
   Largo: da zero al bordo del pannello, dal filo della barra al fondo. I
   due limiti si MISURANO sui nodi veri invece di ripetere qui i 360 e i 46
   punti del foglio di stile - a 1920 il pannello ne vale 400 e coricato
   300, e un numero scritto due volte e' un numero che divergera'.
   Stretto: la stessa domanda, sugli stessi nodi. Diceva «tutto lo
   schermo», e non e' vero: in cima c'e' la testata col marchio, in fondo
   la scheda, e in mezzo resta una BANDA. Misurato a 390x844, col pezzo
   aperto e la scheda ritirata la banda va da 49 a 677 - 628 punti su 844
   - e scende a 378 con la variante (c) dei suggerimenti e la scheda
   tirata su. Prendere la finestra intera al posto della banda e'
   esattamente il motivo per cui il soggetto finiva schiacciato in alto
   con mezzo schermo di crema vuota sotto: si centrava su un rettangolo di
   cui un quarto non si vede.
   IL FONDO DELLA TESTATA NON E' `#alto.bottom`. Quel rettangolo si porta
   dietro i 30 punti di coda TRASPARENTE del gradiente - il suo
   `padding-bottom` - e contarli chiuderebbe la banda dove non c'e' ancora
   niente da coprire. Tolta la coda restano i 44 punti che questo file
   aveva scritti a mano dentro `scartoVero`; la differenza e' che adesso
   seguono la tacca del telefono invece di ignorarla.
   LA CIMA DELLA SCHEDA e' `#cartello.top`, non `#fondo.top`: sopra il
   cartellino, #fondo ha solo i suoi 38-52 punti di gradiente che sfumano
   nel niente. E si misura NELLO STATO IN CUI SIAMO - per questo qui
   dentro non c'e' nessun numero: la banda e' diversa fra sugg=a/b/c e fra
   scheda ritirata e aperta, e chi la chiede la vuole adesso. */
/* la coda del gradiente non cambia durante una sessione, ma
   `getComputedStyle` costa uno svuotamento dello stile - e `areaUtile` la
   chiedono anche le carte in scena, un fotogramma alla volta. Si legge
   una volta sola; il ridimensionamento la butta via, perche' dipende
   dalla tacca e la tacca coricando il telefono cambia lato. */
let codaAlto = null;
/* ── LA BANDA SI FERMA QUANDO LA MACCHINA PARTE ──────────────────
   Il cartellino non cambia forma di scatto: `#fondo` transisce il suo
   padding in 0,18 s e il blocco dei suggerimenti si ritira in 0,22 s.
   Misurato al tocco di un pezzo (telefono 390): la banda finisce a 672,
   subito dopo il tocco vale 652 e torna a 677 nel mezzo secondo dopo —
   il suo CENTRO si sposta di dodici punti, e l'inquadratura del pezzo,
   che si rifaceva a ogni fotogramma, lo inseguiva. E' uno dei due
   secondi movimenti che il cliente vedeva: il gioiello si ferma, e poi
   si sposta ancora.
   Un volo si decide PRIMA di partire. Entrando nel pezzo la banda si
   ferma sul valore che aveva al tocco e resta quella per tutta la
   permanenza. Costa 5 punti di bordo contro la banda finale — 2,5 sul
   centro, cioe' lo 0,4 per cento dell'altezza della banda, dove _I5
   concede il 2 — e li costa FERMI, che e' tutta la differenza. La si
   rilegge solo quando cambia per davvero: la scheda che si apre, lo
   schermo che si ridimensiona. */
let bandaPezzo = null;
function areaUtile(){ return bandaPezzo || misuraArea(); }
function misuraArea(){
  if(larga){
    const p = fondo.getBoundingClientRect();
    const m = document.getElementById("menu").getBoundingClientRect();
    return {x0:0, y0:Math.max(0, m.bottom + 8),
            x1:Math.max(120, p.left), y1:innerHeight};
  }
  const ra = alto.getBoundingClientRect();
  if(codaAlto === null)
    codaAlto = parseFloat(getComputedStyle(alto).paddingBottom) || 0;
  const cima = Math.max(0, ra.bottom - codaAlto);
  const giu = cartello.getBoundingClientRect().top;
  /* UNA BANDA NON PUO' ESSERE PIU' CORTA DI UN QUARTO DI SCHERMO. Fra la
     riscrittura del nome e il quadro dopo, il cartellino per un istante
     puo' essere impaginato a un'altezza che non e' ancora la sua: senza
     questo pavimento il rapporto schizzerebbe e la macchina si butterebbe
     fuori dal mondo per un fotogramma. */
  return {x0:0, y0:cima, x1:innerWidth,
          y1:Math.max(cima + innerHeight * 0.25, Math.min(innerHeight, giu))};
}
sistemaImpianto();

/* ── LA MACCHINA MIRA DI LATO ─────────────────────────────────────
   Il pannello toglie 360 punti alla destra della finestra, ma la tela resta
   larga quanto lo schermo — e deve restare: rimpicciolire il canvas
   vorrebbe dire tagliare la stanza, e il fondo sfocato dietro il pannello
   e' quello che gli da' la profondita'. Quindi il soggetto non va messo al
   centro della TELA, va messo al centro di quello che si vede.
   Si sposta la macchina lungo il suo asse trasversale — non lungo X del
   mondo: sul pezzo la macchina gira attorno al gioiello, e a mezzo giro
   «destra» non e' piu' X. Il vettore e' (cos giro, 0, -sin giro), che e'
   la normalizzata di (avanti × su).
   Quanto: il centro visibile sta `(x0+x1)/2` e il centro della tela
   `innerWidth/2`; la differenza in punti, divisa per mezza larghezza di
   schermo, moltiplicata per mezza larghezza di campo sul piano del
   bersaglio. Spostando OCCHIO e MIRA della stessa quantita' la macchina
   trasla parallela a se' stessa: il soggetto scorre sullo schermo di
   esattamente quei punti, senza che l'inquadratura giri di un grado. */
const _fianco = new THREE.Vector3();
function scostaDiLato(d, giro){
  const a = areaUtile();
  const dxPx = (a.x0 + a.x1) / 2 - innerWidth / 2;
  if(!dxPx) return null;
  const mezzaLarga = d * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  const s = -(2 * dxPx / innerWidth) * mezzaLarga;
  return _fianco.set(Math.cos(giro || 0) * s, 0, -Math.sin(giro || 0) * s);
}

/* ═══════════════════════════════════════════════════════════════
   IL CARICAMENTO A TAPPE — gli attrezzi, che servono subito.
   Il banco non arriva tutto insieme perche' non si guarda tutto
   insieme: si guarda UNA famiglia, e le altre stanno di lato. Qui
   stanno i due attrezzi che la stanza e il banco useranno trecento
   righe piu' sotto: `scarica`, che conta i byte mentre entrano, e
   `tessuto`, che ne fa una texture senza far diventare asincrono tutto
   il resto del file. Il caricatore vero e proprio — chi scende per
   primo, chi dietro, cosa succede se non arriva — sta piu' avanti,
   dove ci sono le famiglie.
   ═══════════════════════════════════════════════════════════════ */
/* IL TIMBRO. Lo riscrive impacchetta.py al momento del pacco, e chi
   pubblica lo copia nel telaio index.html: e' l'unica cosa che fa
   arrivare una correzione a chi ha gia' la pagina in cache. Ogni
   richiesta di `scarica` se lo porta dietro, perche' il telaio mette il
   `?v=` solo sulla PAGINA — e un modello vecchio rimasto in cache
   accanto a una pagina nuova e' una correzione che non arriva. */
const VERSIONE = "2026-09-13d";
/* `vivo` STA QUI, non giu' col disegnatore. La stanza si veste durante la
   valutazione del modulo e chiama `sveglia()`: un `let` letto prima della
   sua riga non e' zero, e' un ReferenceError, e un ReferenceError li'
   uccide il modulo intero — la stessa trappola gia' pagata su `cartaPezzo`
   e su `merci`. */
let vivo = 0;
const VIA = "assets/";
const DRACO_VIA = "./lib/jsm/libs/draco/gltf/";
/* DENTRO resta null quando gli asset sono file veri. Il file unico —
   quello che va in chat — se li porta appresso qui dentro, e `scarica`
   li legge senza toccare la rete. */
let MANIFESTO = {}, DENTRO = null;

const velo     = document.getElementById("attesa");
const striscia = document.getElementById("striscia");
const dice     = document.getElementById("dice");
const riprova  = document.getElementById("riprova");
let attesi = 0, arrivati = 0;
function conta(b){
  arrivati += b;
  if(attesi > 0 && striscia)
    striscia.style.width = Math.min(100, arrivati * 100 / attesi) + "%";
}
/* E IL VELO NON PARLA PIU' QUANDO E' ANDATO VIA. Le famiglie della
   coda continuano ad annunciarsi, e la parola cambiava sotto agli
   occhi durante i sei decimi della dissolvenza. */
function annuncia(t){ if(dice && velo && !velo.hidden) dice.textContent = t; }

/* SCARICA A PEZZI. Il fetch normale dice solo «fatto»; il lettore del
   corpo dice quanti byte sono entrati, ed e' l'unico modo di avere una
   riga che si allunga invece di saltare da zero a cento. */
async function scarica(nome){
  if(DENTRO && DENTRO[nome] !== undefined){
    const t = atob(DENTRO[nome]), b = new Uint8Array(t.length);
    for(let i = 0; i < t.length; i++) b[i] = t.charCodeAt(i);
    conta(b.length);
    return b.buffer;
  }
  const r = await fetch(VIA + nome + "?v=" + VERSIONE);
  if(!r.ok) throw new Error(nome + " — HTTP " + r.status);
  if(!r.body){ const b = await r.arrayBuffer(); conta(b.byteLength); return b; }
  const lettore = r.body.getReader(), pezzi = [];
  let quanti = 0;
  for(;;){
    const {done, value} = await lettore.read();
    if(done) break;
    pezzi.push(value); quanti += value.length; conta(value.length);
  }
  const fuori = new Uint8Array(quanti);
  let o = 0; for(const p of pezzi){ fuori.set(p, o); o += p.length; }
  return fuori.buffer;
}

/* UNA TEXTURE DAGLI STESSI BYTE, per non perderla dal conto della riga.
   IL GIRO VA FATTO ALL'INGRESSO: una ImageBitmap ignora il flipY di
   three — lo dice pure con un avviso — e il fondale uscirebbe
   capovolto, e con lui il repeat.x = -1 della sfera, che e' calibrato su
   un'immagine dritta. Chi le UV le ha dal glTF (il marchio dei plinti, i
   quadranti) chiede giro:false, che e' esattamente il flipY = false che
   aveva prima. */
async function tela(nome, gira){
  const buf = await scarica(nome);
  return await createImageBitmap(new Blob([buf]),
    {imageOrientation: gira === false ? "none" : "flipY"});
}
/* UN PIXEL BIANCO, finche' i byte non arrivano. Una texture senza
   immagine non e' «vuota» per three: e' un errore al momento di
   caricarla sulla scheda. Bianco perche' una mappa di colore si
   moltiplica, e moltiplicare per bianco vuol dire non fare niente. */
const VUOTA = document.createElement("canvas");
VUOTA.width = VUOTA.height = 1;
{ const c = VUOTA.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 1, 1); }
/* E LA TEXTURE TORNA SUBITO, e si riempie quando i byte arrivano: e'
   quello che faceva `tex.load`, ed e' il motivo per cui il resto del
   file non ha dovuto diventare asincrono. */
function tessuto(nome, opz){
  const o = opz || {}, t = new THREE.Texture(VUOTA);
  t.flipY = false;                      // il giro l'ha gia' fatto la bitmap
  if(o.spazio) t.colorSpace = o.spazio;
  tela(nome, o.giro).then(bmp => {
    t.image = bmp; t.needsUpdate = true;
    if(o.poi) o.poi(t);
    sveglia();
  }).catch(e => console.warn("texture non arrivata:", nome, e));
  return t;
}
const stanza = document.getElementById("stanza");

/* ══════════════════════════════════════════════════════════════
   MOVIMENTO RIDOTTO — la parte che il foglio di stile non puo' fare

   Il CSS toglie lo spostamento ai rettangoli. Qui si tolgono le due cose
   che vivono in tre dimensioni: il VOLO della macchina, che diventa un
   salto con un lampo di tela, e il DONDOLO del pezzo in mano, che
   semplicemente non c'e'. Anche l'inerzia sparisce: al rilascio la scena
   e' gia' dove deve stare.
   Si legge a ogni cambio, non una volta sola: la preferenza si puo'
   accendere mentre l'applicazione e' aperta.
   ══════════════════════════════════════════════════════════════ */
const menoMoto = matchMedia("(prefers-reduced-motion: reduce)");
let ridotto = menoMoto.matches;
const salto = document.createElement("div");
salto.id = "salto"; salto.setAttribute("aria-hidden", "true");
document.body.appendChild(salto);
/* il lampo si riarma togliendo e rimettendo la classe: senza il
   `offsetWidth` in mezzo il browser non vede due stati e l'animazione non
   riparte mai dalla seconda volta in poi */
function lampo(){
  if(!ridotto) return;
  salto.classList.remove("acceso");
  void salto.offsetWidth;
  salto.classList.add("acceso");
}

/* ══════════════════════════════════════════════════════════════
   IL CONGEDO — un solo modo di andarsene

   `hidden` porta `display:none`, e un elemento che smette di esistere non
   anima niente: e' il motivo per cui la carta del pezzo entrava in 240 ms
   e usciva in 13, e la galleria in 6. Qui l'ordine si rovescia — prima si
   anima, `hidden` arriva sul transitionend — e la durata la decide il
   foglio di stile, non questo codice.
   ══════════════════════════════════════════════════════════════ */
function congeda(el, poi, nascondi){
  if(!el || el.hidden) return;
  // gia' per strada: un secondo clic sul velo non deve far ripartire il
  // cronometro e tenere la carta aperta piu' a lungo del dovuto
  if(el.classList.contains("via")) return;
  if(el.__congedo){ clearTimeout(el.__congedo.t);
                    el.removeEventListener("transitionend", el.__congedo.f); }
  const fine = () => {
    if(el.__congedo){ clearTimeout(el.__congedo.t);
                      el.removeEventListener("transitionend", el.__congedo.f); }
    el.__congedo = null;
    el.classList.remove("via");
    if(nascondi !== false) el.hidden = true;
    if(poi) poi();
  };
  const f = e => { if(e.target === el && e.propertyName === "opacity") fine(); };
  el.classList.add("via");
  el.addEventListener("transitionend", f);
  /* LA RETE DI SICUREZZA NON E' PARANOIA. `transitionend` non arriva se la
     transizione non parte davvero — scheda in secondo piano, elemento gia'
     trasparente, un foglio di stile che non ha ancora finito di caricare —
     e senza di lei la carta resterebbe aperta per sempre. Il cronometro
     e' un po' piu' lungo dell'uscita dichiarata (220 + 140), cosi' non
     taglia un'animazione che sta girando bene. */
  el.__congedo = {t: setTimeout(fine, 360), f};
}
/* e chi rientra deve trovare la lavagna pulita: una classe `.via` rimasta
   addosso terrebbe il pannello invisibile a schermo intero */
function accogli(el){
  if(!el) return;
  if(el.__congedo){ clearTimeout(el.__congedo.t);
                    el.removeEventListener("transitionend", el.__congedo.f);
                    el.__congedo = null; }
  el.classList.remove("via");
  el.hidden = false;
}

/* ══════════════════════════════════════════════════════════════
   IL RISCONTRO — un attrezzo solo, per tutta l'applicazione

   Non si costruisce una striscia per ogni azione: se ne costruisce UNA e
   la si riempie. Tre cose la distinguono da una notifica qualunque, e
   ognuna viene da come si tiene un telefono in mano:
   · SI FERMA SOTTO IL DITO. Quattro secondi bastano per leggere sei
     parole, non per leggerle e decidere se annullare: chi appoggia il
     dito sulla striscia ha smesso di guardare altro, e il cronometro si
     ferma finche' non lo alza (e riparte con almeno un secondo e due,
     non con quello che restava).
   · SE NE VA COL DITO. Buttarla giu' e' piu' veloce che aspettare, ed e'
     il gesto che tutti provano per primo.
   · DICE QUELLO CHE E' SUCCESSO, e dove serve offre di disfarlo. Il
     «rimuovi» senza un annulla sarebbe una porta a senso unico su una
     cosa che si puo' sbagliare col pollice.
   `aria-live="polite"` sta sull'elemento nel corpo della pagina, non
   qui: un'area viva va dichiarata PRIMA che il testo ci arrivi dentro,
   se no il lettore di schermo non ha niente da osservare.
   ══════════════════════════════════════════════════════════════ */
const toast = document.getElementById("toast");
const toastCorpo = toast.querySelector(".corpo");
const toastDetto = toast.querySelector(".detto");
let toastScade = 0, toastResto = 0, toastCrono = null, toastDito = null;

function chiudiToast(){
  clearTimeout(toastCrono); toastCrono = null;
  toastDito = null;
  if(!toast.classList.contains("qui")) return;
  toast.classList.remove("qui", "tira");
  toast.style.removeProperty("--giu");
  toast.style.removeProperty("opacity");
  clearTimeout(toast.__fine);
  /* si svuota DOPO la dissolvenza, non prima: il testo che sparisce
     mentre la striscia e' ancora in campo si legge come un guasto. E il
     cronometro e' la stessa rete di sicurezza del congedo — se la
     transizione non parte (scheda in secondo piano) il tasto «annulla»
     resterebbe raggiungibile col tabulatore dentro una striscia
     invisibile. */
  toast.__fine = setTimeout(() => {
    if(toast.classList.contains("qui")) return;
    toastDetto.textContent = "";
    for(const b of [...toastCorpo.querySelectorAll(".disfa")]) b.remove();
  }, 300);
}
function armaToast(ms){
  clearTimeout(toastCrono);
  toastScade = performance.now() + ms;
  toastCrono = setTimeout(chiudiToast, ms);
}
/* ── LA STRISCIA STA AL CENTRO DI QUELLO CHE SI GUARDA ─────────
   `left:50%` e' il centro della FINESTRA, e per un telefono e' la stessa
   cosa. Su schermo largo no: il pannello si prende 360 punti a destra, la
   scena ne tiene 1080, e una striscia centrata sulla finestra cade 180
   punti fuori dal centro di quello che si sta guardando - misurato a
   1440x900, il suo bordo destro finiva sotto il pannello. Si centra
   sull'area utile, che e' lo stesso rettangolo su cui si centra il
   soggetto: il riscontro appartiene alla scena, non alla pagina.
   Stretto la proprieta' si TOGLIE invece di riscriverla a 195: cosi' la
   regola del foglio di stile torna padrona, `min(360px, 100vw - 28px)`
   compreso, e non c'e' un secondo posto dove il numero puo' divergere. */
function centraToast(){
  if(!larga){ toast.style.removeProperty("left"); return; }
  const a = areaUtile();
  toast.style.left = Math.round((a.x0 + a.x1) / 2) + "px";
}
function mostraToast(detto, opz){
  opz = opz || {};
  clearTimeout(toast.__fine);
  for(const b of [...toastCorpo.querySelectorAll(".disfa")]) b.remove();
  toastDetto.textContent = detto;
  if(opz.disfa){
    const b = document.createElement("button");
    b.type = "button"; b.className = "disfa";
    b.textContent = opz.etichetta || "annulla";
    b.onclick = () => { chiudiToast(); opz.disfa(); };
    toastCorpo.appendChild(b);
  }
  centraToast();                        // prima del quadro, o entra storta
  void toast.offsetWidth;               // due stati, o la transizione non parte
  toast.classList.add("qui");
  armaToast(opz.durata || 4000);
}
toast.addEventListener("pointerdown", e => {
  if(e.target.closest(".disfa")) return;
  clearTimeout(toastCrono); toastCrono = null;
  toastResto = Math.max(1200, toastScade - performance.now());
  toastDito = {y:e.clientY, id:e.pointerId};
  toast.classList.add("tira");
  try { toast.setPointerCapture(e.pointerId); } catch(_) {}
});
toast.addEventListener("pointermove", e => {
  if(!toastDito || e.pointerId !== toastDito.id) return;
  const dy = Math.max(0, e.clientY - toastDito.y);
  toast.style.setProperty("--giu", dy + "px");
  toast.style.opacity = String(Math.max(0, 1 - dy / 110));
});
const lasciaToast = e => {
  if(!toastDito || e.pointerId !== toastDito.id) return;
  const dy = Math.max(0, e.clientY - toastDito.y);
  toastDito = null;
  toast.classList.remove("tira");
  if(dy > 44){ chiudiToast(); return; }
  toast.style.removeProperty("--giu");
  toast.style.removeProperty("opacity");
  armaToast(toastResto);
};
toast.addEventListener("pointerup", lasciaToast);
toast.addEventListener("pointercancel", lasciaToast);

const rend = new THREE.WebGLRenderer({antialias:true, powerPreference:"low-power"});
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.setSize(innerWidth, innerHeight);
rend.outputColorSpace = THREE.SRGBColorSpace;
rend.toneMapping = THREE.ACESFilmicToneMapping;
rend.toneMappingExposure = 0.62;
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFShadowMap;
stanza.appendChild(rend.domElement);

const scena = new THREE.Scene();
/* IL FONDO E' LA FODERA. Era il marrone di una vetrina da negozio: questo
   non e' un negozio, e' il COFANETTO di chi porta i gioielli, e dentro un
   astuccio il fondo e' velluto quasi nero. */
scena.background = new THREE.Color(0x14110E);
const pm = new THREE.PMREMGenerator(rend);
/* ── LA VETRINA: l'ambiente che si riflette nelle cose ───────
   Tre fatti di una vetrina vera, nessuno dei quali c'era prima.
   1. E' una SCATOLA SCURA con dentro dei fari. I neri non sono un
      vezzo: sono l'unica cosa che dia un bordo al metallo. In un
      ambiente chiaro dappertutto una creola d'acciaio non ha contorno,
      e nessuna lucidatura la salva.
   2. La luce ha un VERSO. Un taglio caldo che scende da sinistra e un
      riempimento freddo da destra: e' cosi' che si illumina la merce, e
      l'ombra che ne esce dice la forma. Una luce uguale da ogni parte
      non e' morbida, e' assente.
   3. C'e' un RIMBALZO dal ripiano, e un filo di luce basso davanti —
      quello che nelle vetrine arriva dal vetro e disegna gli spigoli. */
function laVetrina(){
  const v = new THREE.Scene();
  const cubo = new THREE.BoxGeometry();
  cubo.deleteAttribute("uv");

  const scatola = new THREE.Mesh(cubo, new THREE.MeshStandardMaterial(
    {side:THREE.BackSide, roughness:1, metalness:0}));
  scatola.material.color.setHex(0x0E0D0C);     // i NERI
  scatola.scale.set(9, 6, 9);
  v.add(scatola);

  const faro = (colore, forza, px,py,pz, sx,sy,sz)=>{
    const m = new THREE.MeshStandardMaterial({roughness:1, metalness:0});
    m.color.setHex(0x000000);
    m.emissive.setHex(colore); m.emissiveIntensity = forza;
    const q = new THREE.Mesh(cubo, m);
    q.position.set(px,py,pz); q.scale.set(sx,sy,sz);
    v.add(q);
  };
  // MISURATO sul riferimento vero (un espositore da gioielleria
  // fotografato): il fusto di una colonnina scende dal colmo al fianco di
  // 0,31 — cioe' il fianco e' un terzo piu' scuro. Il nostro stava a 0,17,
  // la meta'. Non e' la forma a mancare, e' la LUCE: un riempimento largo
  // e forte da destra rialza il fianco in ombra e appiattisce il cilindro.
  // Quindi il taglio caldo si stringe e sale, il riempimento scende.
  faro(0xFFE2B8, 19.0, -2.5, 2.9, 1.2,  2.2, 0.10, 2.4);  // il taglio caldo, stretto
  faro(0xC9DEE8,  3.9,  3.3, 1.3, 0.5,  0.10, 1.8, 2.6);  // il riempimento freddo
  faro(0xF6EFE4,  1.0,  0.0,-1.4, 0.7,  4.5, 0.10, 3.5);  // il rimbalzo dal ripiano
  faro(0xFFFFFF,  1.8,  0.0, 0.10, 2.9, 2.6, 0.05, 0.10); // il filo basso davanti
  return v;
}
scena.environment = pm.fromScene(laVetrina(), 0.02).texture;
// e l'ambiente pesa meno del faretto: e' il faretto a portare l'ombra, e
// finche' l'ambiente riempie tutto non c'e' un solo angolo buio addosso
// agli oggetti — nemmeno dove il fusto tocca il plinto.
const AMBIENTE = 0.92;
scena.environmentIntensity = AMBIENTE;

// e il faretto vero, quello che fa l'ombra: caldo, da sinistra e in alto
const SOLE = 2.05;
const sole = new THREE.DirectionalLight(0xFFF1DC, SOLE);
sole.position.set(-0.62, 1.25, 0.78);
sole.castShadow = true;
// 2048 su un fronte di 1,6 m fa 0,8 mm per campione: e' la misura che
// serve per vedere l'ombra dove il fusto appoggia sul plinto, che a 1024
// spariva dentro un solo campione
sole.shadow.mapSize.set(2048, 2048);
sole.shadow.camera.left = -0.8; sole.shadow.camera.right = 0.8;
sole.shadow.camera.top = 0.8;   sole.shadow.camera.bottom = -0.5;
sole.shadow.camera.near = 0.05; sole.shadow.camera.far = 3;
sole.shadow.bias = -0.0006;
scena.add(sole);
// il contrasto da destra: non illumina, mette un bordo freddo sul metallo
const contro = new THREE.DirectionalLight(0xBFD8E4, 0.30);
contro.position.set(0.95, 0.55, -0.35);
scena.add(contro);
// l'ambiente adesso fa il riempimento, quindi l'ambientale scende quasi a zero:
// lasciata a 0,15 rialzava le ombre e ricancellava il verso della luce
scena.add(new THREE.AmbientLight(0xffffff, 0.05));

/* ── LA LAMPADA DEL GIOIELLIERE ──────────────────────────────
   Si accende solo quando il pezzo viene avanti da solo, e sta ATTACCATA
   ALLA MACCHINA: e' la lampada che il gioielliere gira verso di te quando
   ti mette una cosa in mano. Senza, una creola d'argento davanti a una
   parete scura non ha piu' niente che la illumini — l'ambiente della
   vetrina lavora sui pezzi in vetrina, e il pezzo non e' piu' li'. */
const lampada = new THREE.DirectionalLight(0xFFF4E6, 0);
scena.add(lampada);
scena.add(lampada.target);

// IL PIANO DEL BANCO. Senza un piano gli oggetti galleggiano nel nulla e
// la profondita' non si legge: e' l'ombra sul ripiano a dire quanto e'
// lontano ciascuno.
// IL RIPIANO E' DUE PIANI, non uno. Fatto di materiale illuminato usciva
// GRIGIO — la posa e' tarata bassa apposta, perche' il turchese a piena luce
// diventa un pastello (misurato: 136,181,185 invece di 45,96,101), e la
// stessa esposizione che salva la similpelle spegne il ripiano.
// Quindi: un piano PIATTO nel colore giusto, e sopra un secondo piano che
// non ha colore e porta solo l'ombra. Cosi' il ripiano e' carta e l'ombra
// resta vera.
// e anche il ripiano si spegne verso il fondo: e' quello che fa sembrare
/* IL CARICATORE STA SOPRA A CHI LO USA. Era dichiarato centocinquanta
   righe piu' giu': vestiStanza() moriva su «Cannot access 'tex' before
   initialization», il fondale non si e' MAI caricato, e il piano restava
   nero senza che niente in pagina lo dicesse. Un `const` non si solleva. */
const tex = new THREE.TextureLoader();

// il banco profondo invece che un foglio bianco steso
/* ── IL BANCONE ───────────────────────────────────────────────────
   Era un PIANO: un colore steso a y=0, senza spessore. Un piano non e' un
   bancone — gli manca la cosa che lo fa riconoscere, cioe' il BORDO. In una
   gioielleria il bancone e' un volume: un piano di pietra sopra, un fianco
   che scende, e un filo di luce sullo spigolo dove il piano finisce.
   La pietra e' un materiale ILLUMINATO, non un colore steso: un bancone si
   riconosce da come la luce ci scivola sopra. Era stato tenuto piatto
   apposta quando il fondo era chiaro — a quella esposizione un materiale
   vero usciva grigio — ma adesso la stanza e' scura e il problema non c'e'
   piu'.
   L'orizzonte, che era il difetto peggiore (138 livelli di salto in un
   pixel), qui non torna: dietro il bancone non c'e' un secondo piano
   incollato, c'e' una STANZA, e la stanza e' sfocata. E' cosi' che sta in
   una fotografia vera. */
/* E LA PIETRA E' UNA PIETRA. Era `color:0xD5D2C6`: un beige identico in
   ogni suo punto, quattrocento pixel di niente sotto la merce, ed era il
   pezzo che piu' di ogni altro diceva «disegnato». La lastra si costruisce
   in Blender (pietra.py) e arriva qui come due immagini — il colore e la
   ruvidezza — perche' quello che fa il marmo non e' la venatura disegnata,
   e' che il riflesso della vetrina si SPEZZA dove passa la vena. Una
   LA PIASTRELLA NON SI RIPETE. Messa a due giri sui 2,70 m lasciava una
   CUCITURA verticale netta in mezzo al banco: l'immagine non e' periodica,
   e una lastra di marmo non ha una giunta al centro. Se ne stende una
   sola, tirata su tutta la lunghezza: le vene vengono il doppio piu'
   larghe, ed e' giusto cosi' — un banco da 2,70 e' una lastra grande. */
const PIANO_L = 2.70, PIANO_P = 0.78, PIANO_H = 0.055, LASTRA = 1.35;
const pietraCol = tessuto("banco_pietra.webp", {spazio: THREE.SRGBColorSpace}),
      pietraRuv = tessuto("banco_ruvido.webp");
for(const t of [pietraCol, pietraRuv]){
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, PIANO_P / LASTRA);
  t.anisotropy = 8;
}
const cimaBanco = new THREE.MeshStandardMaterial(
  {map:pietraCol, roughnessMap:pietraRuv, roughness:1.0, metalness:0.0});
/* solo la FACCIA DI SOPRA prende la lastra. Un box in three.js usa le
   stesse coordinate su tutte e sei le facce: sul filo davanti, alto cinque
   centimetri e mezzo, la stessa piastrella verrebbe schiacciata, e il filo
   e' proprio quello che si guarda quando si dice «che spessore ha». */
const filoBanco = new THREE.MeshStandardMaterial(
  {color:0x9C968A, roughness:0.34, metalness:0.0});
const banco = new THREE.Mesh(
  new THREE.BoxGeometry(PIANO_L, PIANO_H, PIANO_P),
  [filoBanco, filoBanco, cimaBanco, filoBanco, filoBanco, filoBanco]);
banco.position.set(0, -PIANO_H / 2, 0.06);
banco.receiveShadow = true;
scena.add(banco);

/* il fianco: piu' scuro del piano, perche' non prende la luce di taglio —
   ed e' quel salto fra piano e fianco a dire lo SPESSORE */
const fianco = new THREE.Mesh(
  new THREE.BoxGeometry(PIANO_L, 0.90, PIANO_P - 0.05),
  new THREE.MeshStandardMaterial({color:0x7E7A70, roughness:0.66, metalness:0.0}));
fianco.position.set(0, -PIANO_H - 0.45, 0.045);
scena.add(fianco);
/* IL RIFLESSO SUL RIPIANO: PROVATO E TOLTO. In una fotografia di vetrina
   vera il piede dell'espositore si specchia un poco nel piano, ed e'
   l'ultimo indizio di «render» rimasto. Montato un Reflector sotto il
   ripiano, misurato: scuriva tutto di 4,8 livelli in modo UNIFORME e sotto
   il plinto non guadagnava NIENTE. Anche escludendo il ripiano dal suo
   scatto — che va fatto agganciando il suo `onBeforeRender`, perche' la
   macchina dello specchio sta in una mappa interna e non si configura una
   volta per tutte — il numero non si muoveva: un velo scuro, non un
   riflesso. Un passaggio che costa e non rende non si spedisce.
   Se si riprende: il piano dello specchio e' piccolo (2,6 x 2,0) e il
   soggetto sta in alto, quindi probabilmente cade fuori dal suo tronco di
   visuale — la strada e' allargarlo e alzargli il campo, non alzare
   l'opacita'. */

/* E IL PIANO CHE RACCOGLIE L'OMBRA HA L'IMPRONTA DEL BANCO.
   Era sei metri per sei: invisibile, ma scriveva profondita' per due metri
   e settanta OLTRE il filo del banco, dove non c'e' nessuna superficie.
   Visto da una macchina che sta otto centimetri sopra di lui, il suo filo
   lontano si proietta come una riga dritta attraverso tutto lo schermo, e
   la sfocatura la trasforma in un taglio: il raggio con cui raccoglie il
   colore lo prende dalla profondita' del pixel centrale, e sopra quella
   riga la profondita' e' quella del fondo lontano mentre sotto e' quella
   di un piano a mezz'aria. Massimo l'ha visto da desktop, dove lo schermo
   e' largo e la riga attraversa tutto.
   Misurato sul fotogramma girato a 1440x900, riga 300: contrasto relativo
   fra righe 0,535 -> 0,035, salto assoluto 9,47 -> 0,83. Nasconderlo del
   tutto da 0,032, cioe' lo stesso: quindi non serve toglierlo, serve
   ridurlo a quello che deve fare. L'ombra di contatto cade a centimetri
   dal pezzo, dentro il banco: fuori dal banco quel piano non serve a
   niente e rovina l'immagine. */
const ombraBanco = new THREE.Mesh(new THREE.PlaneGeometry(PIANO_L, PIANO_P),
  new THREE.ShadowMaterial({opacity:0.30}));
ombraBanco.rotation.x = -Math.PI/2;
ombraBanco.position.set(0, 0.0004, 0.06);
ombraBanco.receiveShadow = true;
scena.add(ombraBanco);

// e una parete dietro, che chiude la stanza
// LA PARETE NON SI ILLUMINA. Fatta di materiale che risponde alla luce
// usciva grigia — e uno sfondo grigio non e' una stanza, e' nebbia. Piatta
// nel cipria del brand, invece, fa da fondale e la linea dove incontra il
// banco diventa l'orizzonte: e' quella riga a dire che c'e' un pavimento.
// ...ma PIATTA nel senso di non illuminata, non nel senso di uniforme.
// Un fondale dello stesso colore da cima a fondo e' una parete di studio:
// in una vetrina il fondo si SPEGNE salendo e allontanandosi, ed e' quella
// caduta a dire che c'e' una scatola e non un infinito.
function sfumatura(alto, basso, versoSotto){
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d").createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, versoSotto ? alto : basso);
  g.addColorStop(1, versoSotto ? basso : alto);
  const x = c.getContext("2d"); x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* ══ LA STANZA ═══════════════════════════════════════════════════
   Verdetto di Massimo: «sembra un cartone animato molto brutto». Aveva
   ragione, ed era un errore di METODO prima che di gusto: parete,
   pavimento e piante li avevo montati con primitive qui dentro — colori
   stesi, nessuna materia, nessun rimbalzo di luce, foglie che erano sette
   sagome piatte a tinta unita. Il contratto del progetto lo dice da mesi:
   **il codice misura e impagina, la forma si costruisce altrove.**
   Adesso la stanza e' resa in Cycles (`stanza.py`): calce, rovere, una
   finestra vera che illumina da sinistra, un mobile di fondo, e piante
   fatte di centinaia di foglie con la luce che ci passa attraverso.
   Qui dentro arriva come FONDALE — una fotografia su un piano lontano —
   e la profondita' di campo dell'app la sfoca ancora, sopra il mosso che
   ha gia' di suo.
   L'AMBIENTE CHE ILLUMINA LA MERCE NON CAMBIA. Resta la scatola di luce
   tarata sui gioielli: e' esattamente quello che si fa in una fotografia
   di prodotto — il pezzo sta dentro una scatola di luce, la stanza sta
   dietro. Cambiarlo qui vorrebbe dire rifare da capo la taratura dei
   colori degli orologi, che e' chiusa a 0,8 su 255. */
const AMBIENTI = [
  {id:"boutique", nome:"Boutique", fondale:"stanza_fondale.webp",
   giro:"stanza_giro.webp"},
];
let ambienteScelto = "boutique";
try { const v = localStorage.getItem("regina.ambiente");
      if(v && AMBIENTI.some(x => x.id === v)) ambienteScelto = v; } catch(_) {}
if(q.get("ambiente") && AMBIENTI.some(x => x.id === q.get("ambiente")))
  ambienteScelto = q.get("ambiente");
const ambiente = () => AMBIENTI.find(a => a.id === ambienteScelto) || AMBIENTI[0];

/* IL PIANO E' UNA FINESTRA, e i suoi numeri sono gli stessi con cui e'
   stato scattato il fondale (stanza.py li ricalcola da qui).
   Sta a 2,30 m dietro l'origine, cioe' 3,206 dall'occhio del banco, ed
   e' largo 2,00 per 3,3333 — la proporzione dei 1800x3000 renderizzati.
   Il suo CENTRO sta all'altezza dell'occhio, non a mezz'aria: solo cosi'
   l'asse della macchina di Blender lo colpisce perpendicolare e
   l'immagine non ha trapezio. Di quei 2,00 m l'app ne vede 0,85: il
   resto e' margine per quando la macchina gira sul pezzo. */
const OCCHIO_ALTO = 0.0738, OCCHIO_INDIETRO = 0.9056, FONDALE = 3.206;
const parete = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 10/3),
  new THREE.MeshBasicMaterial({toneMapped:false}));
parete.position.set(0, OCCHIO_ALTO, -2.30);
scena.add(parete);

/* IL GIRO. Il piano e' nitido ma finisce: appena la macchina gira attorno
   al pezzo gli esce di fianco, e il gioiello restava su un nero pieno.
   Passare da una stanza a un nero non e' «piu' sfocato», e' «sparito».
   Dietro al piano ci sta quindi tutta la stanza su una sfera — stesso
   punto di vista, stesso raggio — che non finisce mai. Al banco sfera e
   piano combaciano nel centro del quadro e si vede il piano, che li' e'
   quello nitido; girando attorno al pezzo resta solo la sfera, sfocata di
   quarantaquattro pixel, dove non conta leggere ma esserci. */
/* IL RAGGIO E' PIU' LUNGO DELLA DISTANZA DEL PIANO, e non di un caso.
   Con il raggio uguale a FONDALE la sfera passa esattamente per il piano
   del fondale: stessa distanza, stessi pixel, e chi vince lo decide
   l'ultima cifra del numero. Finche' la sfera non scriveva profondita' il
   piano vinceva sempre; tolto quel puntello — per un'altra ragione, la
   riga netta che si vedeva su desktop — i due hanno cominciato a
   contendersi il fondo, e dietro agli espositori e' comparsa una parete
   piatta al posto della stanza. Venticinque centimetri piu' in la' e la
   sfera sta dietro, dove deve stare. */
const giro = new THREE.Mesh(
  new THREE.SphereGeometry(FONDALE + 0.25, 64, 40),
  /* E LA SFERA SCRIVE LA SUA PROFONDITA'. Con `depthWrite:false` il
     buffer, dove c'e' solo lei, resta al valore di fondo — infinito. La
     sfocatura legge la profondita' per decidere quanto sfocare, e fra il
     banco (settanta centimetri) e un fondo a infinito il salto e' netto:
     il diaframma non puo' far sconfinare il fondo sopra il bordo del
     banco, e quel bordo resta TAGLIATO COL RASOIO in mezzo a
     un'immagine tutta sfocata. E' la riga che si vede su desktop
     inclinando la macchina verso il basso. Con la profondita' vera —
     3,2 metri, che e' dove sta la stanza — il salto e' quello di una
     stanza vera e il passaggio si chiude. */
  new THREE.MeshBasicMaterial({toneMapped:false, side:THREE.BackSide}));
giro.position.set(0, OCCHIO_ALTO, OCCHIO_INDIETRO);
/* E L'ANGOLO NON SI INDOVINA, SI MISURA. Una sfera in three.js porta il
   centro della sua immagine su -X; una panoramica di Blender lo porta
   dove guarda la macchina. Fra le due c'e' un quarto di giro, ma quale
   dei quattro non si deduce dalla documentazione: si spegne il piano del
   fondale, si gira la sfera di quindici gradi per volta e si confronta con
   quello che il piano mostrava nello stesso punto dello schermo.
   Il piano da' 1-98-50 di luminanza da sinistra a destra (mobile scuro,
   parete chiara, pianta); la sfera a 270 gradi da' 7-83-82 — scarto 53 —
   e la seconda migliore sta a 106. Non c'e' ambiguita'. */
giro.rotation.y = Math.PI * 1.5;
scena.add(giro);

function vestiStanza(){
  {
    const t = tessuto(ambiente().fondale, {spazio: THREE.SRGBColorSpace});
    parete.material.map = t;
    parete.material.needsUpdate = true;
  }
  {
    const t = tessuto(ambiente().giro, {spazio: THREE.SRGBColorSpace});
    /* IL PANORAMA VA ROVESCIATO. Una sfera guardata da DENTRO — lato
       interno — mostra la propria texture specchiata: il mobile, che nella
       stanza sta a sinistra, cadeva a destra. Misurato sul banco con il
       piano del fondale spento: la sfera dava 40-118-7 da sinistra a
       destra dove il fondale da' 1-98-50, cioe' lo stesso disegno al
       rovescio. Si specchia la texture, non la geometria: scalare la sfera
       di -1 rovescerebbe anche le normali. */
    t.wrapS = THREE.RepeatWrapping;
    t.repeat.x = -1;
    t.offset.x = 1;
    giro.material.map = t;
    giro.material.needsUpdate = true;
  }
  sveglia();
}
vestiStanza();


const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.01, 30);

/* ── L'OCCLUSIONE NEGLI ANGOLI ────────────────────────────────
   MISURATO sul riferimento vero: il fusto di una colonnina, appena sopra
   il punto dove appoggia sul vassoio, e' 24 per cento piu' scuro che a
   meta' altezza. Da noi era 3 per cento: il palo sembrava POSATO SOPRA
   una fotografia del vassoio, non infilato dentro.
   Non e' un difetto di luce e non lo risolve nessun faro: e' che la luce
   d'ambiente arriva da tutte le direzioni anche dentro una fessura da un
   millimetro, e nella realta' li' non ci arriva. L'ombra del faretto non
   c'entra — cade a fianco del palo, non addosso.
   Serve l'occlusione ambientale, e qui si calcola sullo schermo: per ogni
   pixel si guarda quanto cielo vede davvero. Costa una passata in piu' e
   paga tutti gli angoli del banco insieme — il piede di ogni colonnina, la
   scanalatura, il collo del busto, dove il nastro entra nel plinto. */
const passe = new EffectComposer(rend);
passe.addPass(new RenderPass(scena, camera));
const ao = new GTAOPass(scena, camera, innerWidth, innerHeight);
// il raggio e' in METRI, e gli oggetti qui sono alti otto centimetri: un
// raggio da mezzo metro (quello di serie) guarda fuori dal pezzo e non
// trova nessun angolo. Dodici millimetri e' la misura della fessura vera.
const AO_BANCO = {radius: 0.018, distanceExponent: 1.0, thickness: 0.020,
                  scale: 3.0, samples: 9, screenSpaceRadius: false};
/* E SUL PEZZO STESO IL RAGGIO E' UN ALTRO. Diciotto millimetri sono la
   misura della fessura sotto una colonnina; il filo di una catena e' spesso
   un millimetro e mezzo, e il contatto fra il filo e la pietra e' una riga
   sottilissima. Con un raggio dodici volte piu' grande l'occlusione non
   vede quella riga: misurata, la caduta di luce nei sei pixel sotto il filo
   era di otto punti — la penombra di un oggetto sospeso, non il nero di una
   cosa che tocca. */
/* ma la forza si tiene BASSA. A 3,8 l'occlusione stretta entrava anche
   dentro il buco di ogni anello e la catena perdeva l'oro: usciva sporca,
   scura, come ossidata. Il contatto lo fa il raggio, non la forza. */
const AO_POSATO = {radius: 0.0055, distanceExponent: 1.0, thickness: 0.007,
                   scale: 1.9, samples: 11, screenSpaceRadius: false};
ao.updateGtaoMaterial(AO_BANCO);
// e la passata che toglie il granello: senza, l'occlusione arriva sporca e
// il granello su una superficie chiara si legge come rumore di compressione
ao.updatePdMaterial({lumaPhi: 10, depthPhi: 2, normalPhi: 3,
                     radius: 5, radiusExponent: 1, rings: 2, samples: 10});
passe.addPass(ao);
/* ── LO SFOCATO, SOLO SUL PEZZO ──────────────────────────────
   Quando il gioiello viene avanti da solo, la stanza dietro deve uscire di
   fuoco. Non e' un effetto: e' quello che fa un occhio quando mette a fuoco
   una cosa a quattro centimetri — tutto il resto se ne va. Senza, il pezzo
   «galleggia» davanti a una parete nitida e si continua a leggere la
   parete. La messa a fuoco la sposta il moto, fotogramma per fotogramma,
   sulla distanza vera del pezzo. */
const sfoca = new BokehPass(scena, camera,
  {focus: 0.35, aperture: 0.0022, maxblur: 0.014});
/* LA STANZA E' SEMPRE FUORI FUOCO, E SEMPRE DI PIU'. Prima la sfocatura si
   accendeva solo entrando in un pezzo, e al banco il fondo era nitido come
   la merce: e' l'opposto di come si fotografa una gioielleria, dove
   l'obiettivo e' aperto e dietro c'e' una poltiglia morbida.
   Tre gradini, uno per livello — il banco, l'espositore, il pezzo — e a
   ogni passo avanti il mondo dietro si allontana un po' di piu'. E' il
   modo piu' semplice che esista per dire «adesso guardi QUESTO». */
/* IL TAGLIO NETTO, E PERCHE' C'ERA.
   Verdetto di Massimo: «quel taglio netto che si vede nell'ambiente e che
   divide la visuale sfuocata da quella non sfuocata». Era vero, e stava
   sul filo lontano del banco: una riga dritta, dura come un ritaglio di
   carta, con i dentini quadrati della passata di sfocatura lungo il bordo.
   La sfocatura di three.js raccoglie il colore intorno con un raggio preso
   dalla profondita' del pixel CENTRALE. Se da un pixel al successivo la
   profondita' salta, salta anche il raggio — e il salto si vede come una
   linea. Al livello del pezzo il salto e' enorme: il filo del banco sta a
   49 cm, e dietro non c'e' NULLA per 2,2 metri, perche' li' la parete
   piatta si spegne e resta solo la sfera del panorama a 3,45 m.
   La misura ha scartato due colpevoli: le schede dei suggerimenti (salto
   7,83 con e 7,88 senza, lontano dalle carte) e il piano che raccoglie
   l'ombra (togliergli la profondita' PEGGIORA il taglio da 27,9 a 57,7:
   faceva da rampa). Il colpevole era la taratura.
   L'apertura si diceva in numeri assoluti, e quei numeri dicevano che il
   fondo va in poltiglia solo a QUATTRO METRI dal fuoco. Ma qui si mette a
   fuoco a 15 cm: un obiettivo vero, a quella distanza, ha una profondita'
   di campo di millimetri, e tutto cio' che sta 40 cm piu' indietro e' gia'
   una macchia. Con la saturazione a 4 m, invece, il cerchio di confusione
   era ancora in salita ripida proprio dove cade il filo del banco — 84%
   da una parte e 100% dall'altra non fanno una linea, 20% e 100% si'.
   Quindi non si tara piu' l'apertura: si dichiara PROFONDO, cioe' a quanti
   metri oltre il fuoco il mondo e' del tutto morbido, e l'apertura si
   ricava (satura quando distanza-fuoco >= massimo/apertura). Cosi' la
   taratura e' una scelta fotografica leggibile, e oltre quella soglia
   nessun salto di profondita' puo' piu' produrre un salto di raggio.
   Misurato sul telefono, sul filo del banco: 32,5 -> 12,4 di salto, e il
   profilo del pezzo passa da 17,0 a 18,3 — il soggetto non ci perde
   nitidezza, ci guadagna stacco. */
const FUOCO = [
  {profondo: 6.18, massimo: 0.0210},   // il banco: la stanza gia' respira
  {profondo: 4.66, massimo: 0.0270},   // un espositore
  {profondo: 0.40, massimo: 0.0560},   // un pezzo solo: macro, e la stanza sparisce
];
function profondita(liv){
  const f = FUOCO[Math.max(0, Math.min(2, liv))];
  sfoca.uniforms.aperture.value = f.massimo / f.profondo;
  sfoca.uniforms.maxblur.value = f.massimo;
  sfoca.enabled = true;
}
sfoca.enabled = true;
passe.addPass(sfoca);
passe.addPass(new OutputPass());
/* L'OCCLUSIONE SI SPEGNE DA SOLA SE IL TELEFONO NON CE LA FA.
   E' una passata in piu' su ogni fotogramma, e su un telefono di tre anni
   fa puo' costare piu' di tutto il resto messo insieme. Invece di
   indovinare il modello, si guarda: si cronometrano i primi fotogrammi di
   movimento e, se il disegno va oltre i 30 millisecondi (cioe' sotto i
   trentatre al secondo), si toglie. Meglio un banco senza l'ombra negli
   angoli che un banco che scatta: lo scatto si sente sotto il dito, il
   grigio in fondo a una fessura no. */
let provini = [], aoSpenta = false;
function dipingi(){
  const t0 = aoSpenta ? 0 : performance.now();
  passe.render();
  /* le carte si riproiettano DOPO il disegno, quando la macchina e' dove
     dice di essere: proiettate prima restano indietro di un fotogramma e
     sull'oscillazione della molla si vede che scivolano */
  seguiCarte();
  if(aoSpenta || provini.length >= 24) return;
  provini.push(performance.now() - t0);
  if(provini.length < 24) return;
  const ordinati = provini.slice().sort((a, b) => a - b);
  const mediana = ordinati[12];
  if(mediana > 30){
    ao.enabled = false; aoSpenta = true;
    console.log("occlusione spenta: il disegno costava " +
                mediana.toFixed(1) + " ms");
  }
}
window.__cam = camera; window.__scena = scena; window.__THREE = THREE;
window.__sfoca = sfoca; window.__dipingi = () => dipingi();
window.__ao = ao; window.__ombraBanco = ombraBanco; window.__giro = giro;

/* ── la materia ────────────────────────────────────────────── */
function ripeti(t,n){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(n,n); t.anisotropy=8; return t; }
/* LA GRANA E LA RUVIDEZZA ARRIVANO CON LA PRIMA FAMIGLIA, non prima:
   `granaPer` CLONA queste due per ogni mesh, e un clone fatto su una
   texture ancora vuota resterebbe vuoto per sempre. Qui si preparano, e
   `caricaTutto` le riempie PRIMA di dare il primo modello al
   caricatore. */
const grana = ripeti(new THREE.Texture(VUOTA),5), ruv = ripeti(new THREE.Texture(VUOTA),5);
grana.flipY = ruv.flipY = false;      // il giro lo fa la bitmap all'ingresso

/* ── IL MARCHIO SUL PLINTO ARRIVA DA FUORI, NON DA DENTRO ────
   Il turchese del plinto e il marchio dorato sono una texture cotta in
   Blender, e viaggiavano DENTRO il modello. Il caricatore, per le immagini
   che stanno dentro un .glb, non le legge dai byte: ne fa un indirizzo
   `blob:` e le richiede come se fossero su un server. Una pagina ospitata
   puo' avere il permesso di chiedere solo a certi indirizzi, e `blob:` non
   e' fra quelli: l'immagine non arriva, il materiale resta il suo bianco di
   partenza, e le basi escono BIANCHE. Senza un errore che lo dica.
   In locale non si vedeva, perche' in locale quel permesso non c'e'.
   Quindi la si porta dentro la pagina come tutto il resto, e il modello
   quella che ha dentro se la tiene per se'. */
const MARCHI = {busto:"REGINA_busto_plinto.webp",
                orecchini:"REGINA_orecchini_plinto.webp",
                anelli:"REGINA_anelli_plinto.webp",
                rampa:"REGINA_rampa_plinto.webp",
                orologi:"REGINA_orologi_plinto.webp"};
/* i quadranti degli orologi: la stampa col marchio arriva da qui, come il
   marchio del plinto, e per la stessa ragione — dentro il modello non
   passerebbe. Uno per colore, perche' sul Regina la stampa e' tono su tono
   e cambia con la cassa. */
const QUADRANTI = {quadrante0:"REGINA_orologi_quadrante0.webp",
                   quadrante1:"REGINA_orologi_quadrante1.webp",
                   quadrante2:"REGINA_orologi_quadrante2.webp"};
const marchi = {};
function marchioDi(id, dove){
  if(marchi[id]) return marchi[id];
  // le UV dei modelli sono quelle del glTF, che ha l'origine in alto: una
  // texture caricata a parte arriva capovolta e il marchio finisce a testa
  // in giu' sul fondo del plinto — percio' `giro:false`, che e' il
  // vecchio flipY = false detto al momento giusto, cioe' sulla bitmap
  const t = tessuto(dove || MARCHI[id], {spazio: THREE.SRGBColorSpace, giro: false});
  t.anisotropy = 4;
  marchi[id] = t;
  return t;
}

/* ── LA GRANA HA LA STESSA MISURA SU OGNI PEZZO ──────────────
   Una cella di similpelle e' larga un millimetro, e deve restarlo dovunque:
   sul fusto di una colonnina, sul fianco del plinto, sul collo del busto.
   Il guaio e' che ogni pezzo si porta dietro le SUE coordinate di texture,
   e non sono alla stessa scala: i corpi hanno una proiezione a cubo in
   misura di mondo, il plinto tiene le sue perche' sopra ci e' cotto il
   marchio, il busto quelle della scansione. Ripetuta cinque volte per tutti,
   la stessa immagine usciva a tre grandezze diverse — e accostati si vede
   subito quale pezzo e' «di un altro materiale».
   Non si indovina il numero: si MISURA. Per ogni mesh si confronta l'area
   in coordinate di texture con l'area vera in metri; la radice del rapporto
   dice quante unita' di texture ci stanno in un metro, e da li' la
   ripetizione che fa la cella da un millimetro esce da sola. */
const CELLA = 0.018;          // il lato del riquadro di grana, in metri
function unitaPerMetro(geo){
  const pos = geo.getAttribute("position"), uv = geo.getAttribute("uv");
  if(!pos || !uv) return 0;
  const ind = geo.getIndex();
  const quanti = ind ? ind.count : pos.count;
  /* SI GUARDANO TUTTI I TRIANGOLI, e si scartano quelli senza area in
     coordinate di texture. MISURATO sulla rampa: 1.608 triangoli su 3.248
     hanno le UV schiacciate a zero — sono le costole della solidificazione,
     superficie vera che nella texture non occupa niente. Contandoli si
     gonfia l'area di mondo senza gonfiare quella di texture, e il rapporto
     esce cinque volte sbagliato: la ripetizione veniva 52,7 invece di 10,6
     e la grana spariva sotto il pixel. Campionarne uno ogni sedici era
     anche peggio, perche' i degeneri stanno in blocchi contigui e il
     campione ci finiva dentro tutto. */
  let areaUV = 0, areaXYZ = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for(let i = 0; i + 2 < quanti; i += 3){
    const i0 = ind ? ind.getX(i) : i, i1 = ind ? ind.getX(i+1) : i+1,
          i2 = ind ? ind.getX(i+2) : i+2;
    const u0 = uv.getX(i0), v0 = uv.getY(i0);
    const au = Math.abs((uv.getX(i1)-u0) * (uv.getY(i2)-v0)
                      - (uv.getX(i2)-u0) * (uv.getY(i1)-v0)) * 0.5;
    if(au < 1e-9) continue;
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1);
    c.fromBufferAttribute(pos, i2);
    b.sub(a); c.sub(a);
    areaXYZ += b.cross(c).length() * 0.5;
    areaUV += au;
  }
  return areaXYZ > 1e-12 ? Math.sqrt(areaUV / areaXYZ) : 0;
}
function granaPer(geo, scala){
  /* si DIVIDE per la scala, non si moltiplica: l'area si misura sulle
     coordinate locali, e nel mondo e' scala al quadrato — quindi le unita'
     di texture per metro vero sono quelle locali divise per la scala. */
  const u = unitaPerMetro(geo) / (scala || 1);
  if(!u) return [grana, ruv];
  const r = 1 / (u * CELLA);
  const n = grana.clone(), v = ruv.clone();
  n.repeat.set(r, r); v.repeat.set(r, r);
  n.needsUpdate = v.needsUpdate = true;
  return [n, v];
}
// IL BIANCO DI SERIE. Il turchese resta sul plinto, dove sta il marchio ed
// e' li' che il colore firma; il corpo bianco fa sparire l'espositore dietro
// la merce, che e' il suo mestiere.
// IL BIANCO RESTA IL BIANCO. L'avevo abbassato a #E9E3DA per fare spazio
// al lampo, e il fusto usciva beige — che non e' il bianco lockato. Era
// una correzione inutile: rimesso il bianco, col taglio caldo stretto e
// l'ambiente sceso, il modellato misura 0,30 contro lo 0,28 del
// riferimento, cioe' MEGLIO del beige (0,33). Il contrasto lo faceva la
// luce, non l'albedo; avevo cambiato due cose insieme e attribuito il
// merito a quella sbagliata.
/* LE QUATTRO VESTI. Il bianco e' quella di serie — non bianco puro: una
   similpelle bianca assoluta non esiste, e in render legge come carta.
   Il turchese resta comunque sul plinto, dove sta il marchio: e' li' che il
   colore firma, e non cambia mai. */
const VESTI = [
  /* IL VELLUTO E' LA FODERA DEL COFANETTO, ed e' la veste di serie: gli
     espositori qui non sono mobili da negozio, sono le IMBOTTITURE
     dell'astuccio — il cuscino del collo, il rullo degli anelli, il nastro
     degli orecchini. In un astuccio sono tutti dello stesso velluto. */
  {id:"velluto",  nome:"Velluto",  corpo:0x241F19},
  {id:"bianco",   nome:"Bianco",   corpo:0xF2F0EC},
  {id:"avorio",   nome:"Avorio",   corpo:0xD8CEBE},
  {id:"turchese", nome:"Turchese", corpo:0x106068},
  /* VIA IL NOTTE. Era il quarto colore quando la fodera era un marrone da
     vetrina; adesso che di serie c'e' il VELLUTO — lo stesso nero, ma caldo
     — sono due modi di dire la stessa cosa, e cinque pastiglie non stanno
     accanto al testo del gesto su uno schermo da 390. */
];
/* la scelta si RICORDA. Un cliente che prova il notte e torna al banco deve
   ritrovarlo, e Stefano deve poter sapere quale veste prova la gente. */
let vesteScelta = "velluto";
try { const v = localStorage.getItem("regina.veste");
      if(v && VESTI.some(x => x.id === v)) vesteScelta = v; } catch(_) {}
if(q.get("veste") && VESTI.some(x => x.id === q.get("veste"))) vesteScelta = q.get("veste");
function vesteDi(id){ return VESTI.find(v => v.id === id) || VESTI[0]; }
let veste = "#" + vesteDi(vesteScelta).corpo.toString(16).padStart(6, "0");

/* ── i quattro espositori, in fila e IN SCALA VERA ──────────── */
const gruppi = {}, corpi = {};
/* il caricatore nasce in `caricaTutto()`, insieme al suo decoder */
let caricatore = null;
let posX = 0;

function metti(f, g){
  const gr = g.scene;
  gr.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const m = o.material; if(!m) return;
    if(QUADRANTI[m.name]){
      /* IL QUADRANTE NON E' SIMILPELLE. Passato per lo stesso ramo del
         corpo si portava dietro la grana e il velo: un quadrante con la
         buccia di un espositore. E' una superficie stampata sotto un
         vetro — liscia, appena satinata, senza rilievo. */
      const v = new THREE.MeshPhysicalMaterial({
        color: 0xE8E8E6, metalness: 0, roughness: 0.44,
        map: marchioDi(m.name, QUADRANTI[m.name]),
      });
      v.name = m.name;
      o.material = v;
      return;
    }
    if(m.name === "corpo" || m.name === "plinto"){
      // SIMILPELLE, NON PLASTICA. Il riferimento vero e' opaco e vellutato:
      // le colonnine non hanno una riga speculare lungo il fianco, hanno un
      // passaggio largo e morbido, e i BORDI sono piu' chiari del centro.
      // Quel bordo chiaro e' il VELO — la retroriflessione dei tessuti sugli
      // angoli radenti — e senza di esso qualunque materiale opaco legge
      // come polipropilene. Il MeshStandard non ce l'ha: serve il Physical.
      const v = new THREE.MeshPhysicalMaterial({
        color: m.name === "plinto" ? 0xffffff : new THREE.Color(veste),
        metalness: 0, roughness: 0.64,
        map: m.name === "plinto" ? marchioDi(f.id) : (m.map || null),
        sheen: 0.55, sheenRoughness: 0.62,
        // IL VELO NON E' BIANCO. Bianco e stretto fa raso; per la similpelle
        // va tinto come il corpo, appena schiarito, e largo.
        sheenColor: new THREE.Color(m.name === "plinto" ? 0xD8E8E8 : veste)
          .lerp(new THREE.Color(0xffffff), 0.42),
      });
      v.name = m.name;
      // la scala del pezzo conta: la mesh e' in coordinate locali e il
      // contenitore non e' scalato, ma il busto della scansione si'
      o.updateWorldMatrix(true, false);
      const sc = new THREE.Vector3(); o.getWorldScale(sc);
      const [n, ruvidezza] = granaPer(o.geometry, (sc.x + sc.y + sc.z) / 3);
      v.normalMap = n; v.roughnessMap = ruvidezza;
      if(q.get("grana")) console.log("GRANA", f.id, m.name, o.name,
        "ripetizione", n.repeat.x.toFixed(2));
      v.normalScale.set(0.50, 0.50);
      o.material = v;
      if(m.name !== "plinto") (corpi[f.id] ||= []).push(v);
    }
  });
  /* LA MERCE SI RACCOGLIE PER NOME. Il costruttore in Blender unisce i
     gioielli pezzo per pezzo e li chiama «pezzo00», «pezzo01»... — metallo e
     pietra insieme, le due orecchine di una coppia insieme. E' quell'unico
     nome a rendere possibile toccarne uno, isolarlo e portarselo davanti. */
  const trovati = [];
  gr.traverse(o => { if(/^pezzo\d\d/.test(o.name)) trovati.push(o); });
  trovati.sort((a, b) => a.name.localeCompare(b.name));
  gr.traverse(o => { if(/^posa\d\d/.test(o.name)) o.visible = false; });

  /* LA POSA STA FUORI DALLA MISURA. Dentro al modello, accanto al pezzo
     indossato, c'e' anche la sua POSA STESA — la collana distesa sul
     plinto, che si vede solo entrando nel pezzo. E' larga quasi due volte
     il plinto: contandola, l'espositore risulterebbe piu' profondo di
     quello che e' e il passo fra le famiglie sul banco si allargherebbe
     per un oggetto che al banco non si vede nemmeno. */
  gr.updateMatrixWorld(true);
  const b = new THREE.Box3();
  gr.traverse(o => { if(o.isMesh && !/^posa\d\d/.test(o.name)) b.expandByObject(o); });
  const d = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  gr.position.y -= b.min.y;
  gr.position.x -= c.x;
  gr.position.z -= c.z;
  const contenitore = new THREE.Group();
  contenitore.add(gr);
  contenitore.userData = {f, largo:d.x, alto:d.y, fondo:d.z, pezzi:trovati};
  scena.add(contenitore);
  gruppi[f.id] = contenitore;
  (window.__gruppi ||= {})[f.id] = contenitore;
  return d;
}

/* CARICAMODELLO NON C'E' PIU'. Faceva due mestieri — leggere un file
   e decodificare i byte scritti dentro la pagina — e adesso li fa
   `scarica` per tutti gli asset, contando i byte mentre entrano; al
   caricatore arriva sempre e solo un ArrayBuffer, che e' l'unica cosa
   che non ha bisogno di un permesso di rete.
   QUEL CHE SEGUE E' IL VECCHIO COMMENTO, e vale ancora: */
/* IL MODELLO PUO' ARRIVARE DA UN FILE O DA DENTRO LA PAGINA.
   Quando il banco viaggia come pagina sola — quella che si apre sul
   telefono — i quattro modelli stanno dentro il file, scritti in base64.
   Li si potrebbe dare al caricatore come indirizzo `data:`, ma quello e'
   comunque una RICHIESTA DI RETE, e una pagina ospitata puo' avere il
   permesso di chiedere solo a certi indirizzi: si aprirebbe una stanza
   vuota senza un errore che lo dica. Decodificati a mano e passati come
   byte, non c'e' nessuna richiesta da fare e nessun permesso da avere. */
/* ── I BANCHI: quante copie, e dove stanno ───────────────────
   Il busto e la rampa portano UN pezzo per volta, ed e' cosi' che si
   portano davvero. Lo swipe non puo' scorrere dentro una fila che non
