/* ════════════════════════════════════════════════════════════
   I CORPI VENGONO DALLA SCALA, NON DALLO SPAZIO CHE AVANZA

   Questa pagina è nata prima del sistema di design dell'app
   (`studio/SISTEMA-DESIGN.md`, lockato il 15/09/2026) e i suoi corpi si
   erano formati per adattamento: ogni volta che una parola non ci stava
   si toglieva mezzo punto, e alla fine il cromo del banco parlava fra i
   7,5 e i 9,5 px - il nastro della carta a 7,5, l'occhiello della dedica
   a 8,5, la navigazione primaria (cinque reparti!) a 9,5. Mezzo punto
   per volta non si vede; tutti insieme sono un'app che sussurra.
   La scala dice quattro cose e basta:
     occhiello  11 px, 600/700, maiuscoletto, 0,12 em  (mai sotto 11)
     etichetta  13 px
     nome       17 px Inter  oppure  22 px Bodoni
     titolo     34 px Bodoni
   Sotto, ogni regola che cambia porta il PRIMA accanto. Dove la parola
   non ci sta a 11 px non si scende: si misura e si cambia l'impianto -
   vedi `sistemaNastro`, che conta le colonne invece di rimpicciolire.
   ════════════════════════════════════════════════════════════ */
:root{--carta:#FAF8F5;--cipria:#F4EBE6;--testo:#1A1614;--quieto:#6C5D57;
      --tenue:#93837B;--filo:#E4DAD3;--firma:#106068;
      /* IL MENU NON È CONTORNO. Le cinque famiglie sono la navigazione
         primaria del banco, e stavano a --tenue: misurate, 3,42:1 sulla
         carta — sotto la soglia. Il grigio del contorno resta dov'e' (i
         sottotitoli, le etichette); la navigazione prende il suo, che la
         soglia la passa. */
      --voce:#6E5F57;
      /* IL GRIGIO DEL RETRO, che finora era #B3A795 ripetuto a mano in
         sette punti. È `--quieto` del sistema, cioè il secondario del
         tema SCURO: sul fondo del retro (#1C1813) fa 7,5:1. Il `--quieto`
         di questo foglio è quello del tema chiaro e resta dov'e': due
         ruoli diversi vogliono due nomi diversi, non lo stesso nome che
         cambia valore a metà file. */
      --quieto-scuro:#B3A795;
      /* ── IL BORDO, che era usato e mai dichiarato ──────────────────
         `var(--bordo)` compariva in due punti — la linguetta della
         maniglia e il pallino che dice lo stato dei suggerimenti — e in
         `:root` non c'era. Una variabile assente non è un colore
         sbagliato: è NESSUN colore, quindi `background:var(--bordo)`
         diventa `transparent`. Misurato: la maniglia della scheda
         tornava `rgba(0,0,0,0)` — invisibile — e il pallino spariva
         esattamente nello stato SPENTO, cioè l'unico in cui deve dire
         qualcosa (acceso lo ridipinge `--firma`).
         E QUANTO SCURO LO DECIDE LA MISURA, non il gusto. Il primo
         candidato era #C9BDB4, il filo di un gradino più scuro: sulla
         carta (#FAF8F5) fa 1,74:1. Ma la linguetta e il pallino non sono
         decorazione — dicono «questa scheda si apre» e «i suggerimenti
         sono spenti» — e un segno non testuale che porta informazione
         vuole 3:1. A 1,74 non si vede, e la prova era già scritta nel
         verdetto: «la maniglia è invisibile». Si prende allora il
         grigio che il progetto ha già per le etichette, --tenue
         (#93837B): misurato sulla carta fa 3,43:1, che la soglia la
         passa, e resta un grigio caldo — non un tratto nero in mezzo a
         una scheda di gioielleria. */
      --bordo:#93837B;
      /* ── I TEMPI DEL MOVIMENTO, IN UN POSTO SOLO ───────────────────
         Stavano sparsi: .12, .16, .2, .24, .26, .28, .3, .34, .62 — nove
         durate diverse per una schermata sola, e nessuna scritta due volte
         allo stesso modo. I riferimenti dicono tre misure e non nove:
         50-100 ms per il feedback al tocco, 150-200 per un cambio di
         stato, 300 in entrata e 250 in uscita per un pannello
         (Material 3 Motion; WWDC18 803).
         E L'USCITA È PIÙ CORTA DELL'ENTRATA. Non è simmetria mancata:
         entrando si presenta una cosa nuova e le si da' il tempo di
         arrivare; uscendo chi guarda ha già deciso, e ogni millisecondo
         in più è attesa. Anche le curve sono due: in entrata si arriva e
         ci si posa (decelera), in uscita si parte e si va via (accelera). */
      --tocco:.09s; --stato:.18s; --entra:.30s; --esce:.22s;
      /* ── I TRE TOKEN CHE MANCAVANO, E VENGONO DAL SISTEMA ──────────
         `--molla` è la curva del sistema (SISTEMA-DESIGN.md) per le cose
         che si posano: il vassoio che sale, il tasto che si riprende dopo
         la compressione. `--vano` e `--luce` sono i due colori della
         pillola di conferma, e qui erano scritti a mano — #1C1813 in sei
         punti — mentre il chiaro era #EDE7DF, che il sistema ha SCARTATO
         (su notte fa meno contrasto di #F2ECE1: 16,0:1 contro 14,0). Un
         hex scritto sei volte non è un colore: è sei occasioni di
         divergere. */
      --molla:cubic-bezier(.22,1,.36,1);
      --vano:#1C1813; --luce:#F2ECE1;
      --curva-entra:cubic-bezier(.16,1,.3,1);
      --curva-esce:cubic-bezier(.4,0,1,1);
      /* ══ LA LINGUA DELLA SCOCCA (F2.2) ═══════════════════════════
         Il banco vive dentro un telaio, e sotto di lui c'è la tab bar
         della scocca: una capsula di vetro che galleggia, col filo
         chiaro in alto e l'ombra morbida sotto. Finché il cromo del
         banco è stato testo nudo su un velo di carta, i due pezzi
         erano di due applicazioni diverse — si vede a colpo d'occhio
         mettendo lo scatto del banco accanto a quello della scocca.
         Qui entrano i token della barra approvata (app/sistema.css) e
         del sistema di design (studio/SISTEMA-DESIGN.md), con gli
         stessi nomi che hanno di la', così chi cerca `--linea` o
         `--ombra-2` li trova con lo stesso significato in tutti e due
         i fogli.

         PERCHÉ LA TINTA È BIANCA E NON `--carta`. Il sistema dice
         «tinta = fondo del tema», e il fondo qui è #FAF8F5. Ma il
         banco È la sezione «cofanetto», e proprio lì la scocca ha
         già pagato questa lezione, scritta nel suo foglio: «crema su
         crema non è un oggetto appoggiato, è una macchia». La sua
         capsula sul cofanetto sbianca a rgba(255,255,255,.74) e da'
         peso all'ombra. Il banco prende la STESSA ricetta, non una
         variante: è l'unico modo perché i due rettangoli si leggano
         come lo stesso materiale.

         LE TRE ALPHE SONO QUELLE DEI MATERIALI DEL SISTEMA (thin .60,
         regular .72/.74, thick .88): quando una capsula non regge il
         contrasto sul fondo MISURATO dietro il vetro, si sale di
         materiale — non si cambia il colore del testo. */
      --linea:color-mix(in srgb,#6F6459 45%,transparent);
      --ombra-1:0 1px 2px rgb(20 17 14/.06);
      --ombra-2:0 3px 8px rgb(20 17 14/.12);
      --ombra-sheet:0 -8px 24px rgb(20 17 14/.18);
      --accento:var(--firma); --accento-testo:var(--carta);   /* 6,8:1 */
      --r-capsula:9999px; --r-card:12px; --r-alert:14px;
      --ios:cubic-bezier(.2,.8,.2,1);
      --d-tocco:.1s; --d-push:.35s;
      /* il vetro: sfocatura e tinta della barra approvata, più il filo
         e lo stacco che la fanno stare SOPRA invece che dentro */
      --v-sfoca:30px; --v-tinta:74%;
      --vetro-riflesso:rgba(255,255,255,.92);
      --vetro-stacco:0 0 0 .5px rgba(26,22,20,.07);
      /* LA ZONA DELLA CAPSULA. Il menu non è più una riga in fondo al
         cartellino: è una capsula che galleggia, alta 56 (44 di
         bersaglio più 6 di imbottitura per lato — raggi concentrici
         per costruzione, che su due capsule vuol dire lo stesso raggio
         pieno), staccata dal fondo come la barra della scocca. La
         `--menu-zona` è quanto spazio si tiene libero sotto il velo di
         carta: la capsula più la sua aria più i dodici punti che la
         staccano dal cartellino. */
      /* ── E DODICI PUNTI DAL FONDO, NON QUARANTAQUATTRO (16/09) ───
         `--menu-giu` valeva `10 + max(env(safe-area-inset-bottom), 8)`.
         Misurato dentro l'app su un iPhone grande in standalone: env()
         ARRIVA anche nella cornice (59 in cima, 34 in fondo), e la
         scocca l'aveva già riservata per conto suo nella fascia sotto
         l'iframe. Cioè la safe area si pagava DUE VOLTE — 34 punti di
         carta vuota fra la capsula e la tab bar, dentro quella che il
         cliente ha chiamato «fascia di scena morta». Qui la capsula sta
         a 12 punti dal fondo della CORNICE e la safe area la tiene la
         scocca, che è l'unica che tocca il bordo dello schermo.
         Quando invece questa pagina si apre DA SOLA (senza scocca:
         `data-solo`, lo scrive lo spillo qui sotto al foglio di stile)
         il bordo dello schermo è suo e la safe area torna sua. */
      --menu-h:56px;
      --menu-giu:12px;
      --menu-zona:calc(var(--menu-h) + var(--menu-giu) + 12px)}
:root[data-solo]{--menu-giu:calc(12px + max(env(safe-area-inset-bottom), 0px))}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--carta);color:var(--testo);font:400 14px/1.5 Inter,sans-serif}

/* LA STANZA È LA SCHERMATA. Non c'è una tela dentro una scheda: la tela è
   tutto, e i comandi ci galleggiano sopra. */
/* E SU UNA SCRIVANIA LA TELA DICE CHE SI PUÒ PRENDERE. Il cursore stava a
   `auto` — la freccia con cui si clicca un link: davanti a una stanza che
   si trascina è l'unico segno disponibile, ed era quello sbagliato. */
#stanza{position:fixed;inset:0;touch-action:none;cursor:grab}
#stanza.tira{cursor:grabbing}
#stanza canvas{display:block;width:100%;height:100%}

/* ══════════════════════════════════════════════════════════════
   I DUE PRIMITIVI DEL CROMO — la capsula, e il vetro

   Tutto il cromo del banco si scrive con questi due, e non con cinque
   ricette scritte a mano in cinque posti (era il difetto di prima: il
   tasto dei suggerimenti aveva un contorno, il nastro un altro, il
   foglio di «rimuovi» nessuno, e nessuno dei tre somigliava alla barra
   della scocca).

   · `.capsula` è la FORMA: raggio pieno, il filo hairline del sistema
     preso come contorno interno — `inset 0 0 0 1px` invece di un
     `border`, così non entra nel conto della scatola e il raggio
     interno resta uguale a quello esterno — e UNA ombra sola. Lo stato
     acceso è la capsula PIENA di `--accento`, come i chip della
     vetrina: cambia in 100 ms, che è la durata del tocco.
   · `.vetro` è il MATERIALE, e si da' SOLO a cio' che galleggia sopra
     la scena in tre dimensioni: il menu delle famiglie e il foglio di
     «rimuovi». Il resto del cromo — il tasto dentro il cartellino, il
     nastro dentro la carta — vive su carta piena: lì un
     `backdrop-filter` non sfoca niente (dietro c'è una tinta piatta),
     costerebbe un livello di composizione a ogni fotogramma e
     violerebbe la riga del sistema «materiali solo su barre e fogli,
     mai sul contenuto». Quelli prendono la FORMA e non il materiale.
   ══════════════════════════════════════════════════════════════ */
.capsula{border:0;border-radius:var(--r-capsula);
  box-shadow:inset 0 0 0 1px var(--linea), var(--ombra-1);
  background:rgba(255,255,255,.62);color:var(--voce);
  transition:background var(--d-tocco) var(--ios),
             color var(--d-tocco) var(--ios),
             box-shadow var(--d-tocco) var(--ios),
             transform var(--tocco) var(--ios)}
.capsula.piena{background:var(--accento);color:var(--accento-testo);
  box-shadow:var(--ombra-2)}
.capsula:active{transform:scale(.96)}

.vetro{-webkit-backdrop-filter:blur(var(--v-sfoca)) saturate(1.4);
  backdrop-filter:blur(var(--v-sfoca)) saturate(1.4);
  background:color-mix(in srgb,#fff var(--v-tinta),transparent);
  box-shadow:var(--vetro-stacco), var(--ombra-2)}
.vetro.thin{--v-sfoca:20px;--v-tinta:60%}
.vetro.regular{--v-sfoca:30px;--v-tinta:74%}
.vetro.thick{--v-sfoca:40px;--v-tinta:88%}
/* IL FILO DI LUCE vive in alto e si spegne scendendo. Se corre
   tutt'intorno diventa un bordo, e un bordo è un'altra cosa: è la
   stessa maschera della capsula della scocca, con gli stessi numeri. */
.vetro{position:relative}
.vetro::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;border:1px solid var(--vetro-riflesso);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.34) 34%,transparent 70%);
  mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.34) 34%,transparent 70%)}

/* ── I SEGNI A FILO DELLE FAMIGLIE ─────────────────────────────
   Griglia 24, area viva 20 (i tratti stanno fra 2 e 22), tratto 1,5
   dichiarato in PIXEL DI SCHERMO grazie a `non-scaling-stroke` — così
   lo stesso disegno a 20 o a 24 non ingrassa — giunti arrotondati,
   terminali PIATTI. Sono le regole di `app/ui/segni.js`, applicate
   qui perché i cinque reparti del banco non stanno di la'.
   Il segno cade a -1 px sulla riga di base del testo: è la regola
   scritta del sistema («icona e testo sulla stessa baseline con
   l'icona a -1 px»). */
.segno-filo{display:block;width:20px;height:20px;flex:none;
  transform:translateY(-1px)}
.segno-filo *{fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:butt;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* ══════════════════════════════════════════════════════════════
   IL CONGEDO — come se ne vanno le cose

   Misurato prima di questo blocco: la carta del pezzo ENTRAVA con
   `porgi` (0,24 s) e il velo con `sfuma` (0,28 s), e USCIVA in 13
   millisecondi. La galleria in 6. Un fotogramma: un taglio di pellicola.
   Il motivo non era una transizione mancante — erano dichiarate — ma
   `hidden`, che porta `display:none`: un elemento che smette di esistere
   non ha niente da animare, e la regola scritta non gira mai. Si vedeva
   solo su #attesa, l'unico che conserva il display.
   Qui l'ordine si rovescia: prima si ANIMA (classe `.via`), e `hidden`
   arriva alla fine, sul transitionend. Una regola sola per tutti, così
   non si torna a nove durate diverse.
   ══════════════════════════════════════════════════════════════ */
#carta-pezzo, #galleria, #accanto, #dietro, #cartello, #fondo, #maniglia,
#riga-sugg, #rail-sugg{
  transition:opacity var(--entra) var(--curva-entra),
             transform var(--entra) var(--curva-entra)}
.via{transition-duration:var(--esce) !important;
     transition-timing-function:var(--curva-esce) !important}
#carta-pezzo.via, #galleria.via, #accanto.via{opacity:0}
/* LE TRE FORME DEL SUGGERIMENTO ENTRANO ED ESCONO NELLO STESSO MODO.
   Il loro contenitore parte trasparente e prende `.qui` quando tocca a
   lui: così cambiare variante al volo è una dissolvenza incrociata —
   una forma si spegne mentre l'altra si accende — e non uno scatto.
   Prima l'unica dissolvenza era quella delle CARTE (`.carta.qui`), e a
   variante cambiata le carte erano già accese: sarebbero comparse di
   colpo. */
#accanto, #riga-sugg, #rail-sugg{opacity:0}
#accanto.qui, #riga-sugg.qui, #rail-sugg.qui{opacity:1}
/* la carta non svanisce e basta: si RITIRA, cioè fa al contrario il
   gesto con cui era stata porta */
#carta-pezzo.via #porta{opacity:0;transform:translateY(6px) scale(.972);
  animation:none;
  transition:opacity var(--esce) var(--curva-esce),
             transform var(--esce) var(--curva-esce)}
#galleria.via{transform:scale(1.014)}
#dietro.via{opacity:0;transform:translateX(-7px)}
#cartello.via{opacity:0;transform:translateY(8px)}
/* #fondo e la maniglia NON hanno un `.via`: non se ne vanno mai, cambiano
   ALTEZZA. Il loro scatto era un altro — `display:none` sul materiale e
   sull'insieme quando la scheda si ritira — e si cura più sotto, dove
   quelle due righe si chiudono invece di sparire. */

/* ── IL LAMPO DELLA TELA ────────────────────────────────────────
   Serve solo a chi ha chiesto meno movimento: lì la macchina non vola
   più, SALTA, e un salto senza niente in mezzo si legge come un guasto.
   Un velo di carta che si spegne in 120 ms dice «è cambiata
   l'inquadratura» senza muovere un pixel in orizzontale. */
#salto{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
       background:var(--carta)}
#salto.acceso{animation:lampoDiTela .12s linear}
@keyframes lampoDiTela{from{opacity:.5}to{opacity:0}}

/* IL CARTELLINO E IL MENU STANNO SULLO STESSO FONDO.
   Prima erano due velature sovrapposte e il basso dello schermo usciva
   torbido. Una sola, e dentro ci stanno le due cose che restano. */
/* IL VELO DI CARTA SI FERMA SOPRA LA CAPSULA, e questo è il punto.
   Finché il gradiente arrivava fino in fondo, il menu delle famiglie
   stava su carta piena: mettergli il vetro lì sarebbe stato vetro
   finto — un `backdrop-filter` che sfoca una tinta piatta non sfoca
   niente, e la lezione è già scritta nel foglio della scocca. Il
   velo adesso copre il cartellino (che è CONTENUTO, e va letto) e si
   ferma dodici punti sopra la capsula; sotto, la capsula galleggia
   sulla stanza vera e il vetro ha finalmente della materia da sfocare.
   Il gradiente passa su uno pseudo perché deve stare DIETRO ai figli:
   `#fondo` ha già il suo z-index, quindi è una radice di
   impilamento e un `z-index:-1` qui dentro non scavalca niente fuori. */
/* ── E IL VELO ARRIVA FINO IN FONDO (16/09) ────────────────────────
   Il velo si fermava dodici punti sopra la capsula perché il vetro
   avesse della materia vera da sfocare. Verdetto del cliente: sotto la
   capsula restava una STRISCIA DI SCENA SFOCATA — nella sua misura una
   «fascia di scena morta» fra il cartellino e la tab bar della scocca.
   Una striscia di ambiente alta trenta punti, tagliata sopra e sotto,
   non è ambiente: è un ritaglio. Quindi il velo scende a zero e la
   capsula galleggia sulla CARTA, come la tab bar della scocca fa sul
   cofanetto — dove il vetro è sbiancato e il suo stacco è l'ombra, non
   la sfocatura.
   E LA SFUMATURA NON DIPENDE PIÙ DALL'ALTEZZA DEL CARTELLINO. Prima le
   fermate erano in per cento di un'altezza che cambia col livello: al
   62% di un pannello basso la carta piena cominciava sotto il nome del
   pezzo. Adesso la coda trasparente è una MISURA — `--velo-coda`, la
   stessa imbottitura che #fondo si tiene sopra il cartellino — e la
   carta è piena da lì in giu', sempre. */
#fondo{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
       --velo-coda:30px;
       padding-top:var(--velo-coda);background:none}
/* col pezzo aperto la coda resta quella di prima: lì dentro ci sta il
   bersaglio allargato della maniglia, che vive nei punti trasparenti */
#fondo.apribile{--velo-coda:52px}
#fondo.apribile.ritirato{--velo-coda:38px}
#fondo::before{content:"";position:absolute;z-index:-1;
       left:0;right:0;top:0;bottom:0;
       background:linear-gradient(to bottom,
                  transparent 0,
                  rgba(250,248,245,.90) calc(var(--velo-coda) * .58),
                  var(--carta) var(--velo-coda));
       transition:bottom var(--d-push) var(--ios)}

/* la transizione non sta più qui: sta nel blocco del CONGEDO, con quella
   di tutti gli altri pannelli. Nove durate sparse erano il problema. */
#cartello{padding:0 22px 4px}

/* ── LA SCHEDA SI RITIRA ──────────────────────────────────────────
   Verdetto di Massimo: «il layout degli elementi del menu lascia poco
   spazio alla visualizzazione dell'ambiente tridimensionale, che è la
   parte principale della sezione».
   Misurato sul pezzo: della finestra da 844 punti, 44 li prendeva la
   testata e 297 il cartellino — il 40 per cento dello schermo per un nome,
   un prezzo, due righe di suggerimento e un bottone. All'ambiente ne
   restavano 503.
   Quindi il cartellino ha due altezze. Di serie sta RITIRATO: il nome, il
   prezzo e il gesto, che sono le tre cose che servono per guardare. Chi
   vuole comprare tira su la maniglia e trova il materiale, l'insieme e il
   bottone. E l'inquadratura si rifa' a ogni cambio, perché la macchina
   centra sulla parte che si VEDE e quella parte è appena cambiata. */
#maniglia{display:none;pointer-events:auto;width:100%;border:0;background:none;
          padding:10px 0 9px;cursor:pointer;margin-top:-10px;position:relative}
/* IL BERSAGLIO È PIÙ GRANDE DEL SEGNO. Misurata, la maniglia era alta
   22,5 punti: metà del dito con cui la si tira. Ingrandire la linguetta
   la trasformerebbe in una barra, e non è una barra; si allarga l'AREA,
   che è invisibile, verso l'alto — dentro i 52 punti di gradiente
   trasparente che #fondo ha sopra di se' e che non contengono nient'altro.
   Il segno resta di 42x3,5, il bersaglio diventa 44. */
#maniglia::before{content:"";position:absolute;left:0;right:0;
                  top:-11px;height:44px}
/* e l'opacita' se ne va: a .78 il grigio composito sulla carta misurava
   2,49:1, cioè sotto la soglia proprio dopo aver cambiato colore per
   passarla. A piena opacita' fa 3,43:1. */
#maniglia span{display:block;width:42px;height:3.5px;border-radius:2px;margin:0 auto;
               background:var(--bordo);
               transition:transform .24s cubic-bezier(.2,.7,.3,1),
                          background var(--tocco) linear}
#fondo.apribile #maniglia{display:block}
#fondo.apribile:not(.ritirato) #maniglia span{transform:scaleY(-1)}
/* LA PRESSIONE SI VEDE ANCHE QUI. Una linguetta che non risponde al dito
   fa sembrare la scheda incollata: si stringe e si scurisce nella tacca
   del feedback (90 ms), come tutti gli altri comandi. */
#maniglia:active span{transform:scaleX(.84);background:var(--testo)}
#fondo.apribile:not(.ritirato) #maniglia:active span{transform:scaleY(-1) scaleX(.84)}
/* ── LA SCHEDA SI RITIRA, NON SCOMPARE ────────────────────────────
   Il materiale e l'insieme uscivano con `display:none`: nessuna
   transizione può girare su una riga che smette di esistere, e la
   scheda faceva un salto di cento punti in un fotogramma — con la
   macchina che subito dopo si rifaceva l'inquadratura su un'altezza
   diversa. Adesso si ritirano: si chiudono in altezza e si spengono
   nella stessa mezza tacca di tempo del resto. `visibility` arriva DOPO
   la chiusura, così il bottone dell'insieme non resta raggiungibile
   col tasto di tabulazione dentro una scheda chiusa. */
#fondo{transition:padding-top var(--stato) var(--curva-entra),
                  opacity var(--entra) var(--curva-entra),
                  transform var(--entra) var(--curva-entra)}
/* il tetto serve per forza: da `none` non si transisce, e senza un numero
   di partenza la chiusura tornerebbe uno scatto. Sono due misure larghe —
   la riga del materiale e il blocco dell'insieme non ci arrivano mai — e
   larghe vanno bene, perché il tetto non taglia, accompagna. */
#sotto{max-height:96px}
#insieme{max-height:320px}
#sotto, #insieme{overflow:hidden;
  transition:opacity var(--esce) var(--curva-esce),
             max-height var(--esce) var(--curva-esce),
             margin-top var(--esce) var(--curva-esce),
             padding-top var(--esce) var(--curva-esce),
             visibility 0s linear 0s}
/* il padding non si riscrive più qui: lo porta `--velo-coda` (vedi sopra),
   così il velo e l'imbottitura non possono divergere. */
#fondo.ritirato #sotto, #fondo.ritirato #insieme{
  opacity:0;max-height:0;margin-top:0;padding-top:0;border-top-width:0;
  visibility:hidden;pointer-events:none;
  transition-delay:0s, 0s, 0s, 0s, var(--esce)}
#cartello .riga{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
/* IL NOME DEL PEZZO PORTA IL RAPPORTO DELLE MAISON. Stava a 24 px contro
   un corpo di 12,5: rapporto 1,92, sotto la banda 2,6-3,7 misurata sulle
   maison. A 34 su 12 fa 2,83, ed è la differenza fra una scheda prodotto
   e una pagina di gioielleria. */
/* IL NOME DEL PEZZO STA SU UNA RIGA, e si restringe per la LUNGHEZZA DEL
   NOME, non per la larghezza dello schermo. Con `clamp(24px, 7.4vw, 34px)`
   si restringeva su un telefono stretto: a 375 px il titolo scendeva a
   27,75 e il rapporto col corpo del testo cadeva a 2,31, sotto la banda
   2,6-3,7 delle maison. Ma su un telefono la merce non è più piccola —
   c'è solo meno posto, e il nome del pezzo è la cosa che deve restare
   grande. Il corpo resta 34 e a rimpicciolirlo è il MISURATORE qui sotto,
   solo quando il nome vero non ci sta in una riga. */
#cartello b{font:400 34px/1.04 Bodoni,Didot,Georgia,serif;letter-spacing:-.005em}
/* IL PREZZO È UN NOME, NON UNA NOTA (14 → 17). Sta sulla stessa
   linea di base del nome del pezzo e dice l'altra metà di quello che il
   cliente è venuto a sapere: a 14 contro 34 il rapporto era 2,43 e il
   prezzo leggeva come una didascalia. A 17 il rapporto è 2,0 e i due
   sono due cose dello stesso ordine. */
#cartello .prezzo{font:400 17px/1 Inter,sans-serif;color:var(--quieto);
                  font-variant-numeric:tabular-nums;white-space:nowrap}
/* la materia del pezzo è un'etichetta: 13 (era 12) */
#cartello p{margin-top:7px;font-size:13px;color:var(--quieto)}
/* IL SUGGERIMENTO DEL GESTO SI RITIRA. Serve una volta: chi ha già
   trascinato non ha bisogno che glielo si ripeta per tutta la visita, e
   una riga che resta quando non serve più è solo rumore. */
/* E IL SUGGERIMENTO SI DEVE LEGGERE. Stava a `--tenue`: misurato contro il
   fondo vero sotto la riga — la carta piena, perché lì il gradiente di
   #fondo è già opaco (la riga cade al 39,6% dal basso, sotto la soglia
   del 62%) — fa 3,43:1, sotto i 4,5 che questo progetto si è dato. È
   l'unica riga che INSEGNA come si usa la stanza: se non si legge, non
   insegna. Passa a `--voce`, lo stesso grigio caldo della navigazione,
   che sullo stesso fondo misura 5,76:1. */
/* E LA RIGA CHE INSEGNA È UN'ETICHETTA, non una nota a pie' di pagina
   (11 → 13). È l'unica riga che dice come si usa la stanza: se si
   legge a fatica non insegna, e allora tanto vale non scriverla.
   IL TETTO SALE CON LEI. `max-height` non è decorazione: è la misura su
   cui corre la ritirata quando il gesto è stato imparato. A 22 punti con
   un corpo di 13 la riga verrebbe tagliata a metà — 26 è il suo
   riquadro vero misurato, più l'aria del disegnino del dito. */
#cartello .gesto{display:flex;align-items:center;gap:8px;min-width:0;
                 font:400 13px/1.15 Inter,sans-serif;color:var(--voce);
                 transition:opacity var(--esce) var(--curva-esce),
                            max-height var(--esce) var(--curva-esce);
                 max-height:26px;overflow:hidden}
#cartello .gesto svg{width:34px;flex:none}
#cartello.imparato .gesto{opacity:0;max-height:0;margin-top:0}

/* ── LE VESTI: quattro dischetti, e basta ────────────────────
   Il colore dell'espositore lo sceglie il cliente, e il comando sta sulla
   scheda. Quattro dischetti del colore vero, non quattro nomi: un colore si
   riconosce guardandolo, e «avorio» scritto non dice quale avorio.
   Il plinto non cambia mai: lì il turchese è la firma, ed è sotto il
   marchio. */
/* A 390 PX LA RIGA SBORDAVA, e la scorciatoia era stringere il testo con i
   puntini: usciva «trascina per scorrere · tocca per …». Una didascalia che
   non finisce non insegna il gesto, che è l'unica cosa per cui esiste. Le
   due cose non stanno su una riga sola, quindi non ci stanno: la
   didascalia prende tutta la larghezza e i dischetti vanno sotto, a
   destra. Nessuno dei due perde niente. */
#basso{display:flex;flex-direction:column;align-items:stretch;gap:10px;
       margin-top:11px}
/* e quando il gesto è già stato imparato il blocco si ritira DAVVERO:
   con `margin-top` fisso restavano undici punti di aria intorno al
   niente. Al livello 2 il tasto dei suggerimenti resta, e l'aria la
   riprende lui. */
#cartello.imparato #basso{margin-top:0}
#cartello.imparato #tasto-insieme{margin-top:11px}
#gesto{min-width:0}
#gesto span{display:block}
/* LA RIGA DELLA MATERIA: il testo a sinistra, i dischetti a destra. Il
   testo può andare a capo (al banco la frase è lunga), i dischetti no. */
.riga2{display:flex;align-items:center;justify-content:space-between;
       gap:16px;margin-top:7px}
.riga2 #sotto{margin-top:0;min-width:0}
#vesti{display:flex;gap:12px;pointer-events:auto;flex:none;
       align-self:center}
/* ── IL TASTO CHE SPEGNE I SUGGERIMENTI ──────────────────────────
   Massimo: «devo avere la possibilita' di nasconderli». Due carte da
   centoquattro punti su uno schermo da trecentonovanta ne prendono più
   di metà, e a volte stanno davanti alla cosa che si è aperti per
   guardare. Il comando sta dove sta il gesto, ha la forma delle voci del
   menu — maiuscoletto e filetto — e si ricorda la scelta: chi li spegne
   non deve rispegnerli a ogni pezzo. */
/* ERA TROPPO IN OMBRA. Otto pixel di maiuscoletto grigio tenue in fondo a
   destra: un comando che c'è solo se lo si cerca. Adesso è una pastiglia
   con il suo contorno, un pallino che dice lo stato e un corpo leggibile.
   Resta piccola — è un interruttore, non un richiamo — ma si vede. */
/* IL BERSAGLIO È 44, LA PASTIGLIA NO. Misurata, era alta 25,5 punti.
   Gonfiare la pastiglia fino a 44 la farebbe diventare il comando più
   grosso della riga — e non lo è: è un interruttore accanto a una
   didascalia. Si allarga l'area con uno pseudo-elemento steso sopra e
   sotto (9,25 punti per parte), che non si vede e non sposta niente. */
/* ORA È UNA CAPSULA, e lo stato lo dice il PIENO. Prima era un contorno
   grigio con un pallino dentro che cambiava colore: due segni per dire
   una cosa sola, e nessuno dei due era la lingua della scocca. Un
   interruttore acceso è una capsula piena di `--accento` — la stessa
   forma dei chip della vetrina e dei chip del menu qui sotto — e
   spento è la stessa capsula svuotata, col filo hairline. Il pallino
   se ne va: con il fondo pieno era ridondante, e senza fondo pieno non
   bastava.
   NIENTE VETRO QUI. Vive DENTRO il cartellino, cioè su carta piena: un
   `backdrop-filter` non avrebbe niente da sfocare, costerebbe un
   livello di composizione a ogni fotogramma, e il sistema dice
   «materiali solo su barre e fogli, mai sul contenuto». Prende la
   forma, non il materiale.
   IL BERSAGLIO È 44, LA CAPSULA NO. Misurata, era alta 25,5 punti;
   adesso è 34 - l'altezza dei chip della scocca - e i cinque che
   mancano per lato li mette uno pseudo steso sopra e sotto, che non si
   vede e non sposta niente. */
#tasto-insieme{display:none;pointer-events:auto;align-self:flex-end;
  cursor:pointer;height:34px;padding:0 13px 0 13px;
  /* occhiello: 11/.12em (era 9,5 con .10em) */
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  position:relative;align-items:center;gap:7px}
#tasto-insieme::after{content:"";position:absolute;left:0;right:0;
  top:-5px;bottom:-5px}
#fondo.apribile #tasto-insieme{display:inline-flex}
#tasto-insieme[aria-pressed="true"]{background:var(--accento);
  color:var(--accento-testo);box-shadow:var(--ombra-2)}
/* UN DISCHETTO DA 21 È UN BERSAGLIO DA 21. Il colore si riconosce a 21
   punti — più grande diventerebbe una macchia di vernice accanto al nome
   del pezzo, e quattro macchie sono un'altra cosa — ma il dito ne vuole
   44. Il segno resta 21, l'area di tocco diventa 44 con uno pseudo
   invisibile steso di 11,5 per lato. E lo spazio fra un dischetto e
   l'altro è 9: le aree si toccherebbero, quindi il `gap` sale a 12 e
   nessun dito cade su due colori insieme. */
#vesti button{width:21px;height:21px;padding:0;border-radius:50%;cursor:pointer;
              border:1px solid rgba(26,22,20,.16);background:var(--tinta);
              position:relative;
              transition:transform .16s cubic-bezier(.2,.7,.3,1)}
#vesti button::before{content:"";position:absolute;inset:-11.5px;border-radius:50%}
#vesti button::after{content:"";position:absolute;inset:-4px;border-radius:50%;
                     border:1px solid var(--firma);opacity:0;
                     transition:opacity .2s}
#vesti button.qui::after{opacity:1}
#vesti button:active{transform:scale(.88)}
/* sul pezzo l'espositore non si vede più, quindi le vesti non hanno più
   niente da colorare: spariscono loro, non tutta la riga — il suggerimento
   del gesto lì serve più che altrove, perché è l'unico posto senza
   nessun appiglio visibile per uscire. */
#cartello.pezzo #vesti{display:none}

/* ── IL MENU: quattro parole, ed è anche il «dove sei» ───────
   Una vetrina vera ha i suoi reparti scritti una volta sola. Prima le
   stesse quattro parole comparivano tre volte — sulle targhette appese
   sopra gli oggetti, nella riga in alto e dentro il cartellino — e in
   più non c'era modo di saltare da una famiglia all'altra: bisognava
   tornare indietro e camminare. Questa striscia le dice una volta, dice
   dove sei, e ci si va toccandola. */
/* (qui in mezzo, fra il commento del menu e le regole di #strade, stava
   una terza copia di `#insieme[hidden]{display:none}`: nemmeno vicina
   alle altre due, e senza nessun rapporto con il blocco in cui era
   finita. Via anche quella.) */
#strade button{width:100%;border:0;cursor:pointer;padding:13px 10px;
  /* occhiello: 11 (era 10) */
  font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;border-radius:2px}
#strade .primo{background:#106068;color:#fff}
#strade .secondo{background:transparent;color:var(--testo);
  box-shadow:inset 0 0 0 1px var(--filo)}
/* e le cinque famiglie devono starci tutte: con cinque voci a spaziatura
   piena l'ultima usciva dallo schermo, e una famiglia che non si vede non
   esiste. Si distribuiscono, e la spaziatura cala quando serve. */
/* ── LE CARTE ACCANTO AL PEZZO ─────────────────────────────────────
   Non oggetti in tre dimensioni: CARTE. E la carta non è inventata — è la
   Carta del Pezzo, il cartoncino che Regina mette già negli astucci, in
   piccolo. Così il suggerimento parla la lingua del marchio invece di
   quella di un visore: niente cornici luminose, niente trattini tecnici —
   un cartoncino su velluto, un filetto, e il nome in Bodoni.
   Restano AGGANCIATE al punto dello spazio dove starebbero addosso, quindi
   girando il pezzo si spostano con lui: è quello a farne un insieme. */
#accanto{position:fixed;inset:0;pointer-events:none;z-index:3}
#accanto[hidden]{display:none}
/* ── LE CARTE SI FANNO DA PARTE ───────────────────────────────────
   Massimo: «devono essere più amalgamate nell'ambiente, in modo da
   lasciare spazio e visibilita' al pezzo».
   Erano due cartoncini neri pieni con un filetto scuro attorno e un'ombra
   portata: su una crema sfocata sono i due oggetti più contrastati del
   quadro, e lo squint test li trovava prima del gioiello. Adesso sono
   VELATE — il fondo del cofanetto con un velo di sfocatura sotto, non un
   blocco opaco — e restano leggibili perché il testo ha il suo contrasto,
   non perché ha un muro dietro. Il filetto è un capello di luce, non un
   bordo nero. */
/* E LA CARTA PORTA LA SUA ESPOSIZIONE, non quella di cio' che ha dietro.
   Il velo era soltanto trasparente: sul nero della stanza la carta usciva
   scura e leggibile, ma quando scorrendo finiva sopra la crema del
   bancone il composito saliva a #666054 e le scritte più tenui
   sparivano — l'occhiello «BRACCIALI» misurava 1,57:1 e il prezzo 2,67:1,
   contro i 4,5:1 che questo progetto si è dato e annota accanto a ogni
   coppia in sistema.css. La stessa carta, in alto sul nero, dava 4,82 e
   8,06: lo stesso pezzo di interfaccia, leggibile o invisibile secondo
   dove passava.
   Si aggiunge `brightness` al filtro: la carta prende cio' che ha dietro,
   lo sfuoca E lo chiude di due stop. Così resta VELATA come voleva
   Massimo — dentro l'ambiente, non un blocco opaco davanti — ma il valore
   del suo fondo non dipende più dal caso. E l'occhiello sale al tono del
   prezzo: a sette punti e mezzo in maiuscoletto, quel grigio non arriva a
   4,5:1 su nessun fondo medio. */
/* ── E ADESSO SI TOCCANO ──────────────────────────────────────────
   Stavano a `pointer-events:none`: due cartoncini che dicono «con questo
   ci sta anche l'Anello Cabochon a 39 €» e non portavano da nessuna
   parte. Un suggerimento che non si può seguire non è un suggerimento,
   è una didascalia — e su un telefono la prima cosa che si fa davanti a
   una carta con dentro una foto e un prezzo è toccarla.
   La FORMA non cambia di un pixel: velo, sfocatura e brightness restano
   quelli scelti (le varianti le fa un altro). Cambia solo che il tocco
   arriva, e che la pressione si vede — la carta si stringe di quattro
   centesimi nella tacca del feedback, senza toccare il suo colore. */
#accanto .carta{position:absolute;transform:translate(-50%,-50%);
  pointer-events:auto;cursor:pointer;
  width:118px;padding:7px 8px 8px;
  background:rgba(26,22,18,.34);
  backdrop-filter:blur(9px) saturate(.85) brightness(.34);
  -webkit-backdrop-filter:blur(9px) saturate(.85) brightness(.34);
  box-shadow:0 0 0 1px rgba(255,240,215,.13);
  opacity:0;transition:opacity .34s ease,
                       transform var(--tocco) var(--curva-entra)}
#accanto .carta.qui{opacity:1}
/* ══════════════════════════════════════════════════════════════
   IL FILTRO DI FONDO SOPRA LA TELA — e perché su un telefono va via

   `backdrop-filter` non sfoca un'immagine ferma: sfoca QUELLO CHE STA
   SOTTO, adesso. E sotto c'è una tela WebGL che si ridisegna a ogni
   fotogramma. Su Safari questo obbliga il compositore a rifare la
   sfocatura del fondale sessanta volte al secondo, su un'area che non è
   nemmeno quella della carta: è un secondo effetto a schermo, pagato dal
   sistema invece che da noi, e non compare in nessuna delle nostre
   misure — per questo era rimasto invisibile.
   `#accanto` è `position:fixed; inset:0` sopra `#stanza`: le sue carte
   stanno SOPRA la tela, e al livello del pezzo la tela si muove (il
   dondolo). Quindi dove si tocca il filtro se ne va e resta un fondo
   semiopaco — il velo lo faceva già quasi tutto: `brightness(.34)` su un
   fondo già scuro è un nero all'80 per cento, che qui si scrive e
   basta. Il filtro resta dove la scena è davvero ferma: il velo della
   carta del pezzo e la pastiglia dentro la carta, che compaiono su una
   stanza che non si sta disegnando per loro.
   ══════════════════════════════════════════════════════════════ */
:root[data-resa="leggera"] #accanto .carta,
:root[data-resa="leggera"][data-sugg="b"] #accanto .carta{
  backdrop-filter:none;-webkit-backdrop-filter:none;
  background:rgba(10,8,6,.80)}
#accanto .carta:active{transform:translate(-50%,-50%) scale(.96)}
/* SUL PEZZO STESO LE CARTE SI STRINGONO. Un gioiello in piedi occupa una
   colonna e le carte gli stanno di fianco; uno steso prende il settanta per
   cento della larghezza, e su un telefono da 390 punti non restano due
   corridoi da 126. O si rimpicciolisce il pezzo — ma il pezzo è il motivo
   per cui si è entrati — o si stringono le carte. Si stringono. */
#accanto.steso .carta{width:100px;padding:6px 7px 7px}
#accanto.steso .carta i{font-size:7px;padding-bottom:4px;margin-bottom:5px}
#accanto.steso .carta b{font-size:12.5px}
#accanto.steso .carta span{font-size:9.5px}
#accanto .carta img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  border-radius:0;margin-bottom:6px;background:rgba(255,240,215,.04);
  opacity:.92}
/* LA FOTOGRAFIA PUÒ ARRIVARE DOPO LA CARTA. Se si apre un pezzo prima
   che la famiglia suggerita sia scesa, il provino non c'è e la carta
   nasce senza immagine; quando il provino si fa, l'immagine ci entra
   dentro. Entrarci di colpo è uno scatto in mezzo a una scena ferma:
   la dissolvenza dura una tacca d'ingresso e basta. Il fotogramma
   finale della sequenza non si scrive — senza `to` vale la regola qui
   sopra, cioè 0,92 sulla carta in scena e 1 sul rail, e a sequenza
   finita non resta niente addosso all'elemento. */
@keyframes fotoArriva{from{opacity:0}}
#accanto .carta img.arriva, #rail-sugg .card img.arriva{
  animation:fotoArriva var(--entra) var(--curva-entra)}
#accanto .carta i{display:block;font:600 7.5px/1 Inter,system-ui,sans-serif;
  letter-spacing:.13em;text-transform:uppercase;color:#b3a795;font-style:normal;
  padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid rgba(255,240,215,.13)}
#accanto .carta b{display:block;font:400 14px/1.15 Bodoni,Didot,Georgia,serif;
  color:#f2ece1;font-weight:400}
#accanto .carta span{display:block;margin-top:3px;font:400 10.5px/1 Inter,system-ui,sans-serif;
  color:#b3a795;font-variant-numeric:lining-nums}
/* IL BLOCCO `#insieme` STAVA SCRITTO DUE VOLTE, identico, a dodici righe di
   distanza: sette regole doppie che il browser risolveva sempre a favore
   della seconda. Non cambiava niente a schermo, ed è proprio questo il
   danno — chi va a toccare la prima copia non vede effetto e conclude che
   il foglio di stile non lo ascolta. Ne resta una, quella più in basso,
   accanto alle altre regole del cartellino. */
/* ══ IL MENU DELLE FAMIGLIE — la capsula che galleggia ═══════════
   Era una riga di cinque parole in fondo al cartellino, su carta
   piena, con un filetto turchese sotto quella attiva. Sotto di essa,
   nell'applicazione vera, c'è la tab bar della scocca: una capsula di
   vetro col filo di luce e l'ombra morbida. Messi uno sopra l'altro
   sembravano di due programmi diversi, ed è esattamente il difetto
   che questa sezione doveva chiudere.
   Adesso è la stessa cosa detta col materiale della scocca: una
   capsula di vetro larga quanto le sue voci, centrata, staccata dal
   fondo, e dentro cinque chip. Lo stato attivo è la capsula PIENA di
   `--accento` — la stessa forma dei chip della vetrina — e non più un
   filetto: un filetto sotto una parola è una sottolineatura, un chip
   pieno è un oggetto selezionato.
   `--menu-giu` porta il `max` perché quando la pagina è ospitata e
   non può dichiarare viewport-fit=cover, env() torna zero e la
   capsula finirebbe addosso alla barra di casa dell'iPhone. */
#menu{position:relative;pointer-events:auto;
      display:flex;align-items:center;overflow:hidden;
      width:max-content;max-width:calc(100% - 24px);
      margin:12px auto var(--menu-giu);
      height:var(--menu-h);padding:6px;border-radius:var(--r-capsula);
      transition:opacity var(--d-push) var(--ios),
                 transform var(--d-push) var(--ios)}
/* LA PISTA. Il vetro, il filo e l'ombra stanno sulla capsula; i chip
   scorrono DENTRO. Sono due elementi perché devono essere due: se il
   filo di luce scorresse coi chip, alla prima scorsa il riflesso
   uscirebbe dallo schermo e la capsula resterebbe spenta. */
#menu .pista{display:flex;align-items:center;gap:4px;
  height:44px;min-width:0;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -ms-overflow-style:none;scroll-behavior:smooth;
  overscroll-behavior-x:contain}
#menu .pista::-webkit-scrollbar{display:none}
/* QUANDO SCORRE, LE DUE ESTREMITA' SFUMANO. Un chip tagliato di netto
   dal bordo della capsula sembra un errore di impaginazione; lo stesso
   chip che svanisce dice «c'è dell'altro, di la'». La classe la mette
   JavaScript, e solo se la pista scorre per davvero: a livello 1 i
   cinque ci stanno esatti, e lì una sfumatura mangerebbe il primo e
   l'ultimo segno senza motivo. */
#menu.scorre .pista{
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,
                     #000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 18px,
             #000 calc(100% - 18px),transparent 100%)}
/* min-width:0 e un corpo più piccolo: quattro reparti devono stare anche
   su uno schermo da 320, e se il carattere non fa in tempo a caricarsi la
   riserva è più larga. Senza, «Bracciali» finiva fuori dallo schermo e il
   menu ne mostrava tre. */
#insieme{display:block;margin-top:13px;padding-top:12px;border-top:1px solid var(--filo)}
#insieme[hidden]{display:none}
/* occhiello: 11 (era 9) */
#insieme .eco{font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;
/* IL GRIGIO CHIARO NON È TESTO. `--tenue` (#93837B) sulla carta misura
   3,43:1 e sulla cipria 3,11: sotto i 4,5 che il sistema di design chiede
   a un testo, e lo dice anche la diagnosi in `studio/SISTEMA-DESIGN.md`
   («--tenue ... NON è testo nel tema chiaro»). Resta dov'e' come SEGNO
   - la linguetta della maniglia, il pallino di stato, il puntino fra due
   voci - e come testo passa a `--quieto` (#6C5D57), che sulla carta fa
   5,93 e sulla cipria 5,37. */
  text-transform:uppercase;color:var(--quieto);margin-bottom:8px}
#insieme .r{display:flex;align-items:baseline;justify-content:space-between;
  gap:14px;padding:4px 0}
#insieme .r b{font:400 16px/1.15 Bodoni,Didot,Georgia,serif}
#insieme .r span{font-size:13px;color:var(--quieto);
  font-variant-numeric:lining-nums;white-space:nowrap}
/* UN TASTO PRIMARIO È UNA CAPSULA DA 50. Stava a raggio 2, cioè un
   rettangolo: l'unica forma di tutta l'applicazione che non fosse né
   una capsula né una carta. Il colore e l'altezza li dice il sistema
   (`--accento` su `--accento-testo`, 6,8:1, capsula da 50, uno per
   schermo) e adesso li dice anche la forma. */
#insieme button{width:100%;border:0;cursor:pointer;height:50px;padding:0 16px;margin-top:11px;
  background:var(--accento);color:var(--accento-testo);border-radius:var(--r-capsula);
  /* occhiello: 11 (era 10) */
  font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform var(--tocco) var(--curva-entra), background var(--stato)}
#insieme button:active{transform:scale(.96);background:#0C4C52}
/* ── «MESSO DA PARTE», e il segno di spunta è DISEGNATO ──────────
   Niente emoji: una spunta di sistema porta dentro il carattere di un
   altro — su iPhone arriva colorata — ed è l'unica cosa nella schermata
   che non è stata disegnata qui. Sono due segmenti a filo, nello stesso
   spessore dei segni del nastro. Lo stato dura tre secondi e torna:
   un tasto che resta «fatto» per sempre non si può rifare. */
#insieme button .spunta{width:13px;height:13px;flex:none;display:none}
#insieme button .spunta path{fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#insieme button.fatto{background:#0C4C52}
#insieme button.fatto .spunta{display:block}
/* IL CHIP. Un bersaglio da 44 pieni (era 38: misurato, e sotto la
   soglia del sistema), il segno a filo della famiglia e l'occhiello
   accanto. Lo stato acceso cambia in 100 ms — la durata del tocco —
   e non ha rimbalzo: è un fondo che si accende, non una cosa che
   arriva.
   UNDICI PUNTI, che è il FONDO della scala. È la navigazione
   primaria del banco - cinque reparti - e stava un punto e mezzo sotto
   il minimo che il sistema di design ammette per un maiuscoletto.
   LA SPAZIATURA STA AL FONDO DELLA BANDA (.08em invece di .12): il
   sistema da' agli occhielli 0,08-0,12 em, e col segno accanto ogni
   decimo di em è larghezza che la capsula deve portarsi. */
#menu button{flex:0 0 auto;display:inline-flex;align-items:center;
             justify-content:center;gap:7px;
             height:44px;min-width:44px;padding:0 14px 0 11px;
             background:none;border:0;border-radius:var(--r-capsula);
             cursor:pointer;color:var(--voce);
             font:700 11px/1 Inter,sans-serif;letter-spacing:.08em;
             text-transform:uppercase;white-space:nowrap;
             transition:background var(--d-tocco) var(--ios),
                        color var(--d-tocco) var(--ios),
                        padding var(--d-push) var(--ios),
                        transform var(--tocco) var(--ios)}
/* Lo stato si dice con una CLASSE, non col selettore sull'attributo.
   `aria-current` resta perché serve a chi legge lo schermo, ma come
   aggancio di stile non ha retto: con l'attributo giusto sull'elemento
   giusto e la regola caricata, il colore restava quello di prima. */
#menu button.qui{background:var(--accento);color:var(--accento-testo)}
#menu button:active{transform:scale(.94)}
#menu button:focus-visible{outline:2px solid var(--accento);outline-offset:-3px;
             border-radius:var(--r-capsula)}
/* UN REPARTO CHE NON È ANCORA ARRIVATO SI VEDE, ma si vede che non c'è
   ancora. Toccarlo non è un tocco muto: lo porta in cima alla coda e il
   cartellino dice che sta arrivando. */
#menu button.attende{opacity:.42}
/* l'etichetta è un blocco a se' perché al passaggio di livello deve
   poter CHIUDERSI: una parola che svanisce lasciando il suo posto vuoto
   non è una compressione, è un buco */
#menu .nm{display:block;max-width:11em;overflow:hidden;
  transition:max-width var(--d-push) var(--ios),
             opacity 160ms var(--ios),
             margin-left var(--d-push) var(--ios)}

/* ══ IL PASSAGGIO DI LIVELLO ═════════════════════════════════════
   Tre livelli, tre forme della stessa capsula, e le durate sono quelle
   del sistema: 350 ms col `--ios` per il push, 100 per lo stato del
   chip. Niente rimbalzo — la molla si tiene per le cose che si posano
   (il vassoio, il tasto che si riprende), non per una barra.
     L0 · il banco. Le cinque famiglie per esteso: qui si sceglie.
     L1 · dentro una famiglia. La capsula si COMPRIME: la famiglia in
          cui si sta resta col suo nome, le altre quattro perdono
          l'etichetta e restano il segno. Non spariscono - da dentro
          una famiglia si passa a un'altra con un tocco, ed è il
          motivo per cui i segni esistono: lì dentro il segno porta il
          nome da solo. Ed è anche cio' che fa stare la fila senza
          scorrere.
     L2 · il pezzo aperto. La capsula se ne va, verso il basso e in
          dissolvenza: il cartellino del pezzo prende tutta la riga, e
          Massimo l'aveva già detto una volta che il cromo lascia poco
          spazio all'ambiente. Si torna con «indietro».
   Sul pannello largo (>= 900) il menu NON è in fondo: sta in cima,
   sulla scena, ed è navigazione permanente. Lì non se ne va e non si
   comprime — la regola si disfa dentro la sua media query. */
:root[data-liv="1"] #menu button:not(.qui) .nm,
:root[data-liv="2"] #menu button:not(.qui) .nm{max-width:0;opacity:0;margin-left:-7px}
:root[data-liv="1"] #menu button:not(.qui),
:root[data-liv="2"] #menu button:not(.qui){padding:0 12px}
:root[data-liv="2"] #menu{opacity:0;transform:translateY(20px);pointer-events:none}
/* e col menu via, il velo di carta si riprende la riga */
:root[data-liv="2"] #fondo::before{bottom:0}

#alto{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
      padding:calc(13px + max(env(safe-area-inset-top), 8px)) 16px 30px;
      pointer-events:none;z-index:3;
      background:linear-gradient(to bottom, var(--carta) 26%, rgba(250,248,245,.66) 58%, transparent)}
/* IL MARCHIO STA IN MEZZO, come l'insegna sopra la vetrina. Di lato, con
   accanto altre due scritte, era una barra di navigazione qualunque. */
/* E STA SULLA PRIMA RIGA, con un `top` scritto. Senza, un figlio in
   posizione assoluta di un contenitore flessibile prende la sua
   posizione statica dall'allineamento del contenitore - qui
   `align-items:center` - cioè si centra sull'ALTEZZA INTERA di #alto.
   Finché la testata era una riga sola non si vedeva. Con la variante
   (a) dei suggerimenti, che è quella di serie, #alto va a capo e
   diventa alta il doppio: misurato a 390x844, il marchio scendeva a
   metà altezza e cadeva esattamente sopra la prima riga dei
   suggerimenti - «Creola Media 28,00 €» passava sotto il marchio.
   Il `top` è l'imbottitura di #alto più due punti e mezzo, che è quanto
   serve per centrare 18 punti di marchio sui 23 del tasto «indietro»:
   sulla riga sola il marchio non si muove di un pixel, sulle due righe
   resta dov'era invece di scendere. */
#alto img{height:18px;opacity:.92;position:absolute;left:50%;transform:translateX(-50%);
          top:calc(13px + max(env(safe-area-inset-top), 8px) + 2.5px)}
#dietro{pointer-events:auto;display:flex;align-items:center;gap:7px;background:none;
        border:0;cursor:pointer;color:var(--testo);font:400 11px/1 Inter,sans-serif;
        padding:6px 2px;
        /* la pressione risponde in una tacca di feedback (90 ms), il
           congedo nella sua: sono due cose diverse e prima erano una */
        transition:opacity var(--entra) var(--curva-entra),
                   transform var(--tocco) var(--curva-entra)}
#dietro svg{width:16px}
#dietro[hidden]{display:none}
#dietro:active{transform:scale(.94)}

#attesa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:var(--carta);transition:opacity .6s;font:400 15px/1 Inter,sans-serif;
        color:var(--incisa)}  /* --incisa su carta 5,4:1; --quieto faceva 2,8 e Bodoni sotto 22 e' vietato */
#attesa[hidden]{opacity:0;pointer-events:none;display:flex;visibility:hidden;
                transition:opacity .6s,visibility 0s .6s}
/* E IL VELO SPARISCE ANCHE DALL'ALBERO. `opacity:0` con `display:flex`
   lo toglieva agli occhi e lo lasciava a tutto il resto: a VoiceOver,
   al fuoco della tastiera e a chi misura - il banco dei contrasti
   leggeva «le collane...» a 1,53:1 sopra la scena, cioe' un testo che
   nessuno vede. `visibility:hidden` arriva a dissolvenza finita (0s di
   durata, 0,6 s di ritardo: la stessa della opacita'), quindi il velo
   si spegne come prima e poi smette di esistere per davvero. Il
   `display` resta, perche' e' quello che permette alla dissolvenza di
   girare (vedi IL CONGEDO piu' sopra). */
/* IL VELO DICE COSA STA ARRIVANDO. Non una percentuale — un numero che
   sale non è un'informazione, è un orologio — ma il NOME della cosa:
   «le collane…», «gli orecchini…». La riga sotto è alta un pixel: è un
   filo che si allunga, non una barra di sistema. */
#attesa .dentro{display:flex;flex-direction:column;align-items:center;gap:14px;
                min-width:180px}
#attesa .binario{width:180px;height:1px;background:rgba(20,17,14,.14)}
#attesa .binario i{display:block;height:1px;width:0;background:var(--tenue);
                   transition:width .25s linear}
#attesa #riprova{border:0;background:none;cursor:pointer;color:var(--incisa);
                 font:400 12px/1 Inter,sans-serif;letter-spacing:.08em;
                 text-decoration:underline;text-underline-offset:4px;padding:6px}
#attesa #riprova[hidden]{display:none}

/* ══════════════════════════════════════════════════════════════
   LA CARTA DEL PEZZO
   Il pezzo non è una scheda da leggere: è un OGGETTO con cui si fa
   qualcosa. Toccarlo apre la sua carta — la foto, i dati, la dedica — e
   ogni voce del menu è una porta su un sistema: il regalo passa da una
   scansione, la collezione dice cosa manca e cosa si apre chiudendola.
   La carta si GIRA. Non si apre una seconda schermata sopra la prima:
   ogni azione mostra il proprio seguito sul retro dello stesso
   cartoncino, e si torna girandolo. È il gesto di una carta vera, ed è
   anche il motivo per cui il codice del dono sta dietro: un codice si
   mostra, e per mostrarlo si volta la carta verso l'altro.
   ══════════════════════════════════════════════════════════════ */
#carta-pezzo{position:fixed;inset:0;z-index:7;display:grid;place-items:center;
  padding:26px 18px}
#carta-pezzo[hidden]{display:none}
/* IL VELO NON SPEGNE, SCOSTA. A 0,58 di nero l'ambiente dietro spariva e
   la carta diventava una schermata: ma la carta si APPOGGIA sopra
   l'interfaccia, e per appoggiarsi ha bisogno che sotto ci sia ancora
   qualcosa. Un terzo di nero e una sfocatura più piena tengono la stanza
   leggibile e la mandano indietro. */
#carta-pezzo .velo{position:absolute;inset:0;background:rgba(12,9,6,.34);
  backdrop-filter:blur(7px) saturate(.86);
  -webkit-backdrop-filter:blur(7px) saturate(.86);
  animation:sfuma .28s ease}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
/* e la carta ARRIVA: non compare, si alza. Novantasei centesimi di scala
   e otto punti più in basso, in due decimi di secondo — quel tanto che
   dice «è un oggetto che ti è stato porto». */
@keyframes porgi{from{opacity:0;transform:translateY(8px) scale(.965)}
                 to{opacity:1;transform:none}}
/* L'ALTEZZA LA DETTA IL CONTENUTO, non un numero. Era `min(660px, 100%)`:
   una carta senza dedica lasciava duecento punti di fondo vuoto, e una
   carta con la collezione dietro veniva tagliata. Ora la misura chi ci sta
   dentro — la si chiede alla faccia attiva dopo che il browser l'ha
   impaginata — e la si limita a quello che lo schermo concede. Cambia
   anche girando, e cambia con una transizione: una carta che si accorcia
   di scatto sembra rotta. */
/* L'ENTRATA STA SU UN ALTRO ELEMENTO, e non è un vezzo di struttura.
   L'animazione «porgi» stava sul foglio stesso con `fill-mode: both`: a
   fine corsa il suo ultimo fotogramma — `transform: none` — RESTA
   applicato, e un valore che viene da un'animazione batte una regola
   normale. Quindi `#foglio.girata{transform:rotateY(180deg)}` non ha mai
   avuto effetto: la carta non si girava, si limitava a cambiare altezza
   sulla misura del retro, e sotto il fronte restava una striscia di carta
   vuota. È il difetto che Massimo ha visto premendo «collezione».
   L'entrata va quindi su un involucro, e la rotazione resta sul foglio.
   La prospettiva si sposta con lei: `perspective` agisce sui FIGLI, e col
   foglio diventato nipote si sarebbe perso il 3D. */
#porta{width:100%;max-width:330px;perspective:1400px;
  animation:porgi .24s cubic-bezier(.2,.7,.3,1) both}
#foglio{position:relative;width:100%;
  transform-style:preserve-3d;
  /* ── SEICENTO MILLISECONDI, E I NOVANTA GRADI A METÀ CORSA ────
     La misura e la curva vengono dal sistema (49 § tessera che si gira):
     `rotateY` 0→180 in 600, con il fotogramma chiave a 90 gradi al
     cinquanta per cento. Quel fotogramma chiave serve a una cosa sola —
     garantire che a 300 ms la carta sia DI TAGLIO, cioè che il cambio di
     faccia cada dove l'occhio non vede niente — e una curva SIMMETRICA lo
     garantisce per costruzione: cubic-bezier(.4,0,.6,1) ribaltata attorno
     a (0,5 · 0,5) è se stessa, quindi a metà tempo sta a metà corsa.
     Si tiene la transizione e non un'animazione con `forwards`: la carta
     si può rigirare a metà volo, e una transizione interrotta torna
     indietro da dov'e' mentre un'animazione riempita salta all'inizio.
     Era 0,62 con una curva asimmetrica, e i 90 gradi cadevano a 220 ms:
     misurato. */
  transition:transform .6s cubic-bezier(.4,0,.6,1),
             height .34s cubic-bezier(.3,.1,.2,1)}
#foglio.girata{transform:rotateY(180deg)}
/* UNA CARTA HA UN BORDO SUO. Spigoli vivi, nessun raggio e un'ombra
   secca: era un pannello. Dieci punti di raggio, un filo di luce sul
   contorno che la stacca dal velo, e due ombre invece di una — una
   stretta che la appoggia, una larga e morbida che le da' l'aria sotto.
   E `overflow:hidden` sul contorno, se no la fotografia esce dagli
   angoli arrotondati e il raggio non si vede dove conta. */
#foglio .faccia{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;background:var(--carta);
  border-radius:10px;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,
             0 0 0 1px rgba(26,22,20,.10),
             0 2px 6px -1px rgba(0,0,0,.28),
             0 34px 64px -24px rgba(0,0,0,.62);
  display:flex;flex-direction:column}
/* lo scorrimento sta DENTRO, non sul contorno */
#foglio .faccia > *{flex:none}
#foglio .dentro-carta{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column}
#foglio .dentro-carta::-webkit-scrollbar{width:0}
/* SENZA DEDICA, un filo di carta sotto i tasti. Altrimenti il bordo
   inferiore dell'ultimo tasto È il bordo della carta, e la carta sembra
   tagliata invece che finita. */
#foglio .fronte.senza-dedica .dentro-carta{padding-bottom:16px}
#foglio .retro{transform:rotateY(180deg);background:#1C1813;color:#EDE7DF}
#foglio .faccia::-webkit-scrollbar{width:0}

/* il fronte: la foto in alto, i dati, la dedica, il menu */
/* LA FOTO È UNA FASCIA, e le OPZIONI stanno sopra la piega.
   Verdetto di Massimo, con lo scatto del suo iPhone: «le opzioni si devono
   vedere subito sulla carta». Su un telefono vero la barra di Safari in
   alto e la sua barra in basso si prendono quasi un terzo dello schermo:
   alla carta ne restano cinquecentosessanta punti, e con la foto a 16:11,
   cinque righe di dati e la dedica, il menu cominciava a
   cinquecentoquattordici. Restava una scheda da leggere.
   Tre tagli, e nessuno butta via niente: la foto passa a 16:8, i dati da
   cinque righe in colonna a tre su due colonne, e la DEDICA scende SOTTO
   il menu — resta sempre sul fronte, come deve, ma dopo le cose da fare.
   Prima si agisce, poi si legge. */
/* IL FONDO DIETRO LA FOTO È LA CARTA, NON IL FANGO. Stava a #6A625A —
   il grigio medio con cui si FOTOGRAFA un gioiello, che lì dentro è
   giusto e resta dov'e' — ma messo come fondo del riquadro usciva fuori
   dallo scatto: prima che l'immagine arrivi, e in tutta la fascia che
   l'immagine non copre, la carta cominciava con una banda color terra.
   Una carta comincia con la sua carta. */
#ritratto{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;
  border-radius:10px 10px 0 0;
  background:var(--carta);cursor:pointer;
  transition:opacity var(--tocco) linear}
#ritratto:active{opacity:.86}
.riga-foto{position:relative;flex:none}
/* ── SE LA FOTO NON C'E', UN POSTO VUOTO DISEGNATO ────────────────
   Un <img> che non carica lascia l'icona di immagine rotta del browser —
   un blocco grigio con dentro un simbolo che non è nostro, ed è la
   stessa bugia dei posti vuoti nella lista della collezione, già
   corretta lì. Qui il riquadro si spegne e al suo posto resta la carta
   con un filetto e una riga in Bodoni: è un posto che aspetta una
   fotografia, e lo dice. */
.riga-foto.senza-foto #ritratto{display:none}
.riga-foto.senza-foto{aspect-ratio:16/8;display:grid;place-items:center;
  border-bottom:1px solid var(--filo);
  background:linear-gradient(var(--carta), var(--cipria))}
.riga-foto.senza-foto::after{content:"La fotografia di questo pezzo arriva";
  font:italic 400 13px/1.3 Bodoni,Didot,Georgia,serif;color:var(--quieto);
  text-align:center;padding:0 24px}
.riga-foto.senza-foto .quante{display:none}
/* anche la pastiglia delle foto prende il suo raggio: un rettangolo a
   spigoli vivi dentro una carta arrotondata è l'unica cosa che si vede */
.riga-foto .quante{position:absolute;right:10px;bottom:10px;pointer-events:none;
  background:rgba(12,9,6,.52);color:#F2ECE1;padding:5px 9px;border-radius:999px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  /* occhiello: 11/.12em (era 8,5 con .11em) */
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
/* ══════════════════════════════════════════════════════════════
   LA GERARCHIA DELLA CARTA: nome · materiale · prezzo, a peso calante

   Era una griglia. «VALORE / 59,00 €» stava in una casella accanto a
   «NEL COFANETTO DAL / 12 luglio 2026», e succedevano tre cose, tutte
   misurate:
     · il PREZZO era un dato fra i dati. In una vetrina il prezzo è la
       terza cosa che si legge, dopo il nome e di che cosa è fatto — non
       la prima di una tabella;
     · «NEL COFANETTO DAL» in una colonna da 91,3 punti andava a capo, e
       il suo valore scendeva di 8 punti rispetto agli altri due: tre
       valori su tre linee di base diverse dentro la stessa riga;
     · un pezzo senza scheda aveva UNA casella su tre, e le altre due
       restavano bianche.
   Nessuno dei tre è un difetto di taratura: la griglia è la forma
   sbagliata. Cartier, Boucheron, Pomellato e Mejuri, guardati uno
   accanto all'altro, non fanno tabelle — fanno RIGHE, e le etichette le
   sciolgono dentro la frase: «Dal 12 luglio 2026 · Filo di Luce». Due
   righe, non una tabella. Senza colonne non c'è una linea di base da
   disallineare e non c'è una casella da lasciare vuota.
   ══════════════════════════════════════════════════════════════ */
#carta-dentro{padding:14px 16px 2px;flex:none}
#carta-dentro .nome{font:400 27px/1.06 Bodoni,Didot,Georgia,serif;
  letter-spacing:-.005em}
/* etichetta: 13 (era 12) */
#carta-dentro .mat{margin-top:5px;font-size:13px;line-height:1.45;color:var(--quieto)}
/* IL PREZZO HA IL SUO PESO, e i numeri sono quelli allineati: su un
   serif le cifre in stile antico ballano, e un importo che balla su una
   carta di gioielleria si nota subito. Qui è Inter, quindi basta
   dichiarare `lining-nums` e i tabulari per la virgola. */
#carta-dentro .prezzo{margin-top:9px;
  font:400 17px/1 Inter,sans-serif;color:var(--testo);
  font-variant-numeric:lining-nums tabular-nums}
#carta-dentro .dati{margin-top:11px;padding-top:11px;
  border-top:1px solid var(--filo);
  /* etichetta: 13 (era 11) */
  font-size:13px;line-height:1.5;color:var(--quieto)}
#carta-dentro .dati div + div{margin-top:3px}
/* ── LO STATO È UNA PAROLA, NON UN COLORE ────────────────────────
   Chi ha ricevuto un pezzo in regalo non trovava il tasto «Regala» e
   nessuno gli diceva perché: la regola stava scritta solo sul retro di
   quel tasto — cioè esattamente nel posto che quel pezzo non può
   aprire. La si porta sul fronte, dove la persona guarda, e si dice come
   la dicono le maison: una parola in maiuscoletto Inter, non una
   pastiglia colorata. */
/* occhiello: 11 (era 8,5) */
#carta-dentro .stato{font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--testo)}
#carta-dentro .dati .regalo{margin-top:7px}
#carta-dentro .dati .regalo .stato{color:var(--voce)}

/* LA DEDICA STA SEMPRE SUL FRONTE, e non è un'opzione del menu: è la
   ragione per cui una collana è quella collana e non un'altra uguale.
   Se è lunga si taglia a tre righe e si offre di girare la carta. */
/* LA DEDICA PRENDE LO SPAZIO CHE HA. Quando c'è è la cosa più
   importante della carta: arriva fino al bordo, respira, e si legge fino
   a quattro righe prima di chiedere di girare. Quando non c'è — un pezzo
   comprato da se' — non resta un vuoto: il blocco esce e la carta si
   accorcia di quello che occupava. */
#dedica{margin:14px 16px 16px;padding:14px 15px;background:var(--cipria);
  border-radius:8px;flex:none;position:relative}
/* occhiello: 11 (era 8,5) */
#dedica .eco{font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--quieto);margin-bottom:7px}
/* BODONI STA SOPRA I 22, o non è Bodoni: sotto quella misura il
   contrasto dei tratti si chiude e il carattere diventa una serif
   qualunque (regola 2 del sistema). La dedica è l'unico posto della
   carta dove il display ha un mestiere — è scrittura di qualcuno — e
   stava a 16, cioè fuori scala e senza il motivo per esserci. */
#dedica p{font:italic 400 22px/1.4 Bodoni,Didot,Georgia,serif;color:#2A1F1C}
#dedica.lunga p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden}
/* etichetta: 13 (era 11). E il grigio sale: vedi `--tenue`, che su
   cipria misura 3,4:1 — sotto la soglia — mentre `--quieto` fa 5,0. */
#dedica .firma{margin-top:8px;font-size:13px;color:var(--quieto)}
#dedica .tutto{display:none;margin-top:9px;border:0;background:none;padding:0 0 3px;
  /* occhiello: 11/.12em (era 8,5 con .11em) */
  cursor:pointer;font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--firma);
  border-bottom:1px solid var(--firma);
  transition:opacity var(--tocco) linear}
#dedica .tutto:active{opacity:.55}
#dedica.lunga .tutto{display:inline-block}

#voci{flex:none}
/* ══════════════════════════════════════════════════════════════
   IL MENU È IL LAYOUT DELLA CARTA
   Verdetto di Massimo: «il menu è il layout della carta, tutte le
   opzioni vanno fatte in un modo più professionale, con un'estetica
   personalizzata e più accattivante».
   Aveva ragione: erano righe con un nome e una didascalia grigia a
   destra — funzionanti e anonime, il genere di lista che potrebbe stare
   in qualunque applicazione. Qui la scelta estetica non la fa
   l'esecutore: si costruiscono TRE impianti strutturalmente diversi sulla
   carta vera, con il contenuto vero, e si scegliera'.
     · A · IL TAVOLIERE — riquadri, come le mosse di un gioco da tavolo.
     · B · IL REGISTRO — righe incise, come le voci di un libretto.
     · C · IL NASTRO — pastiglie in fila sotto la foto, sempre in vista.
   I segni sono disegnati a filo, nello spessore del marchio: nessuna
   emoji e nessuna libreria di icone.
   ══════════════════════════════════════════════════════════════ */
#voci .segno{flex:none;width:22px;height:22px;display:block}
#voci .segno path, #voci .segno circle, #voci .segno line, #voci .segno rect{
  fill:none;stroke:var(--firma);stroke-width:1.15;
  stroke-linecap:round;stroke-linejoin:round}
#voci button.grave .segno path, #voci button.grave .segno circle,
#voci button.grave .segno line{stroke:#9B4034}

/* ── IL NASTRO ──────────────────────────────────────────────
   Scelto da Massimo. E con una regola sulla forma: «lo spazio deve essere
   coperto tutto, diviso in parti eque in base al numero di tasti».
   Quindi non pastiglie di larghezza fissa allineate a sinistra — che con
   tre tasti lasciano un vuoto a destra e con cinque scorrono — ma tasti
   che si dividono la riga in parti uguali, quanti che siano. Il numero
   non è mai lo stesso: lo decide il PEZZO. */
/* IL NASTRO È UN GRUPPO DENTRO LA CARTA, non una fascia incollata fra
   due. Prima andava da bordo a bordo con due filetti e un fondo diverso:
   quattro strisce sovrapposte non sono una carta, sono quattro schede.
   Adesso sta nei margini del testo, ha il suo riquadro e il suo raggio, e
   si legge come un gruppo di comandi che appartiene al cartoncino. */
/* ── E IL NASTRO PARLA LA STESSA LINGUA ─────────────────────────
   Era un blocco di tasti separati da un filo di un pixel: il disegno
   dei segmented control di dieci anni fa. Adesso è un vassoio col suo
   filo hairline e, dentro, tasti a raggio proprio staccati di quattro:
   RAGGI CONCENTRICI, che è la regola del sistema — l'interno è
   l'esterno meno l'imbottitura, 14 meno 4 fa 10 — e la stessa forma
   dei chip che stanno ovunque nell'applicazione.
   Niente vetro: il nastro vive DENTRO la carta del pezzo, che è
   contenuto; il materiale sta sulle barre e sui fogli. */
#voci.nastro{display:flex;gap:4px;margin:14px 16px 0;
  padding:4px;border-radius:var(--r-alert);
  background:var(--cipria);box-shadow:inset 0 0 0 1px var(--linea)}
#voci.nastro button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:8px;
  padding:11px 4px 10px;border:0;border-radius:10px;
  background:#FFFDFB;cursor:pointer;box-shadow:var(--ombra-1);
  transition:background var(--d-tocco) var(--ios),
             box-shadow var(--d-tocco) var(--ios),
             transform var(--tocco) var(--ios)}
#voci.nastro button:active{background:var(--cipria);transform:scale(.97)}
/* L'ETICHETTA DEVE STARCI, non accorciarsi con i puntini — E NON PUÒ
   RIMPICCIOLIRSI PER STARCI. Il conto di prima era giusto e la
   conclusione era sbagliata: con cinque tasti su una carta da 298 punti
   ognuno ne ha 58,8 e dentro l'imbottitura ne restano 50,8, e
   «ASSISTENZA» a 11 px ne vuole 69,5 — quindi si era sceso a 7,5,
   che è tre punti e mezzo sotto il minimo del sistema di design e quasi
   la metà di un occhiello.
   La misura non dice «rimpicciolisci»: dice che CINQUE COLONNE NON
   CI STANNO. A tre colonne ogni tasto ne ha 98,7 e dentro ne restano
   90,7, e la parola più lunga ne vuole 69,5: ci sta con ventuno punti
   d'aria. Il numero di colonne lo sceglie `sistemaNastro` misurando le
   parole vere di QUESTO pezzo — il nastro ne porta tre, quattro o
   cinque secondo chi ha regalato cosa — e la regola di Massimo («lo
   spazio coperto tutto, diviso in parti eque in base al numero di
   tasti») resta vera riga per riga: l'ultima riga si divide fra chi è
   rimasto.
   La spaziatura sta al FONDO della banda degli occhielli (.08em invece
   di .12): a .12 «ASSISTENZA» arriva a 82,7 e a quattro colonne non
   passerebbe. */
#voci.nastro{flex-wrap:wrap}
#voci.nastro button{flex:1 1 calc(100% / var(--col, 5) - 4px)}
#voci.nastro .che{font:700 11px/1.25 Inter,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--testo);text-align:center;
  max-width:100%;white-space:nowrap}
#voci.nastro .perche{display:none}
#voci.nastro button.grave{background:#FDF4F2}
#voci.nastro button.grave .che{color:#9B4034}

/* il retro: il codice, e cio' che l'azione comporta */
#foglio .retro .dentro-carta{padding:22px 20px}
#retro-titolo{font:400 25px/1.1 Bodoni,Didot,Georgia,serif;flex:none}
/* etichetta: 13 (era 12,5) */
#retro-sotto{margin-top:8px;font-size:13px;line-height:1.5;color:#B3A795;flex:none}
#retro-qr{margin:20px auto 0;width:172px;height:172px;background:#F6F0E6;
  padding:12px;display:none;flex:none;border-radius:8px}
#retro-qr img{display:block;width:100%;height:100%}
#retro-qr.c-e{display:block}
/* occhiello: 11/.12em (era 10 con .16em). La spaziatura larga serviva a
   far leggere un codice che si detta al telefono, ma a 11 punti i gruppi
   di tre si staccano già da soli, e .16 sta fuori dalla banda del
   sistema (0,08-0,12). */
#retro-codice{margin-top:11px;text-align:center;flex:none;
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;color:#B3A795}
#retro-note{margin-top:18px;padding-top:14px;flex:none;
  border-top:1px solid rgba(255,240,215,.14);
  /* etichetta: 13 (era 11,5) */
  font-size:13px;line-height:1.55;color:#B3A795}
#retro-note b{color:#EDE7DF;font-weight:400}
/* I TASTI DEL RETRO STANNO ATTACCATI AL FONDO. Sulla collezione il retro
   è più alto della carta e «torna alla carta» finiva sotto la piega: si
   restava girati senza un modo evidente di tornare. Appiccicato in basso
   c'è sempre. */
/* I TASTI IN FONDO, SENZA MARGINE AUTOMATICO. Stavano col
   `margin-top:auto` per cadere in basso quando il retro era corto. Ma
   ora la carta prende l'altezza del contenuto, e per misurare il
   contenuto si sommano le altezze dei figli con i loro margini: un
   margine automatico, letto da getComputedStyle, torna come lo spazio
   LIBERO in pixel — cioè esattamente quello che manca per riempire la
   carta. La somma tornava sempre uguale all'altezza della carta, e la
   carta non si accorciava più (714, 718, 722, 726: cresceva di quattro
   punti a ogni giro, inseguendo se stessa). Un margine dichiarato, e il
   fondo cade in basso da solo perché la carta finisce dove finisce. */
#retro-fondo{margin-top:22px;padding:0;display:flex;gap:10px;flex:none;
  position:sticky;bottom:-22px;background:linear-gradient(to top,
    #1C1813 62%, rgba(28,24,19,.92) 82%, rgba(28,24,19,0))}
#retro-fondo button{flex:1;border:0;cursor:pointer;padding:13px 10px;
  border-radius:7px;
  /* occhiello: 11 (era 9,5) */
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(255,240,215,.10);color:#EDE7DF;
  transition:transform var(--tocco) var(--curva-entra), background var(--stato)}
#retro-fondo button:active{transform:scale(.94);background:rgba(255,240,215,.22)}
#retro-fondo button.fa{background:var(--firma)}
#retro-fondo button.fa:active{background:#0C4C52}
#retro-fondo button.grave{background:#9B4034}
#retro-fondo button.grave:active{background:#7E3229}


/* ══════════════════════════════════════════════════════════════
   F3 · IL CERTIFICATO — il retro non è più «il seguito del tasto»

   Prima il retro cambiava mestiere a ogni voce del nastro: era il
   codice del regalo, la nota dell'assistenza, l'avviso della rimozione.
   Adesso quelle quattro azioni le apre la SCOCCA (hanno bisogno di una
   tastiera, e una tastiera dentro un telaio è un guaio), e il retro
   torna a essere una cosa sola: il CERTIFICATO del pezzo — quello che
   Panerai, Breitling e Bvlgari mettono dietro la carta di garanzia.
   Perciò ha un ordine fisso e non si riscrive: occhiello, marchio,
   numero, tre dati, stato, storia datata, cura, QR, firma.
   ══════════════════════════════════════════════════════════════ */
#foglio .retro.cert #retro-titolo{font-size:22px;text-align:center}
#foglio .retro.cert #retro-sotto{order:-1;margin-top:0;text-align:center;
  font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:var(--quieto-scuro)}
#cert{flex:none}
#cert .occhio{font:700 11px/1 Inter,sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--quieto-scuro)}
/* IL NUMERO NON È UN CARATTERE MONOSPAZIATO PRESO A PRESTITO. Un font
   di sistema cambia da telefono a telefono e il codice è la cosa che si
   detta al banco: si tiene Inter, si accendono le cifre tabulari e si
   allarga la spaziatura — che è esattamente quello che «mono-spaziato»
   deve ottenere qui, cioè nove caratteri che si contano a colpo d'occhio. */
#cert .num{margin-top:12px;text-align:center;
  font:400 17px/1.3 Inter,sans-serif;letter-spacing:.12em;
  font-feature-settings:"tnum";color:var(--luce)}
#cert .num + .occhio{margin-top:6px;text-align:center;display:block}
#cert .dati{margin-top:18px;display:flex;flex-wrap:wrap;gap:16px}
#cert .dati > div{flex:1 1 40%;min-width:0}
#cert .dati .v{margin-top:3px;font:400 15px/1.4 Inter,sans-serif;color:var(--luce)}
#cert .stato{margin-top:16px;font:400 15px/1.4 Inter,sans-serif;color:var(--luce)}
#cert .storia{margin-top:18px;padding-top:14px;
  border-top:1px solid rgba(255,240,215,.14)}
#cert .storia .r{display:flex;gap:12px;padding:5px 0;
  font:400 13px/1.45 Inter,sans-serif;color:var(--luce)}
#cert .storia .r time{flex:none;width:86px;color:var(--quieto-scuro);
  font-feature-settings:"tnum"}
#cert .cura{margin-top:14px;font:400 13px/1.5 Inter,sans-serif;
  color:var(--quieto-scuro)}
#cert .qr{margin:22px auto 0;width:120px;height:120px;display:block}
#cert .qr svg{display:block;width:100%;height:100%;border-radius:3px}
#cert .inquadra{margin-top:8px;text-align:center;
  font:400 11px/1.35 Inter,sans-serif;color:var(--quieto-scuro)}
/* LA FIRMA È TESTO, non un carattere che finge una mano. Bodoni corsivo
   a 22: è il corsivo del display del sistema, e un pezzo da 40 euro
   firmato con una calligrafia finta è la cosa che lo fa sembrare finto. */
#cert .firma{margin-top:24px;text-align:center;
  font:italic 400 22px/1.25 Bodoni,Didot,Georgia,serif;color:var(--luce)}
#cert .coda{height:32px}

/* ── IL TASTO CHE DIVENTA LO STATO ────────────────────────────────
   Le quattro azioni che la scocca raccoglie non hanno niente da mostrare
   qui dentro: la loro risposta è un foglio che si apre DI LA'. Nel
   frattempo il tasto deve dire di aver sentito il dito, e lo dice come lo
   dice il sistema — 0,96 che torna a 1 in 300 ms, sulla molla — più il
   colore della firma addosso. Nessuna etichetta che cambia: cambiarla
   direbbe «fatto» di una cosa che sta succedendo altrove. */
@keyframes voce-stato{from{transform:scale(.96)}to{transform:scale(1)}}
#voci.nastro button.stato{animation:voce-stato .3s var(--molla) both;
  background:var(--cipria);box-shadow:inset 0 0 0 1px var(--linea)}
#voci.nastro button.stato .che{color:var(--firma)}

/* ── IL FOGLIO DI «RIMUOVI» ───────────────────────────────────────
   Un gioiello non si elimina: si dice cosa gli è successo. Tre righe e
   un annulla, dentro la scena, perché qui non c'è niente da scrivere e
   mandare la persona fuori dal banco per tre parole sarebbe un viaggio
   più lungo della decisione. Nessun «sei sicuro?»: la pillola con
   l'annulla, sei secondi, sostituisce la domanda. */
#rimuovi{position:fixed;inset:0;z-index:11;display:flex;
  align-items:flex-end;justify-content:center;pointer-events:none}
#rimuovi[hidden]{display:none}
#rimuovi.qui{pointer-events:auto}
#rimuovi .velo{position:absolute;inset:0;background:rgba(20,17,14,.46);
  opacity:0;transition:opacity var(--esce) var(--curva-esce)}
