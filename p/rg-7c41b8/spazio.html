  if(el.__congedo){ clearTimeout(el.__congedo.t);
                    el.removeEventListener("transitionend", el.__congedo.f);
                    el.__congedo = null; }
  el.classList.remove("via");
  el.hidden = false;
}

/* ══════════════════════════════════════════════════════════════
   IL RISCONTRO — un attrezzo solo, per tutta l'applicazione

   Non si costruisce una striscia per ogni azione: se ne costruisce UNA e
   la si riempie. Tre cose la distinguono da una notifica qualunque, e
   ognuna viene da come si tiene un telefono in mano:
   · SI FERMA SOTTO IL DITO. Quattro secondi bastano per leggere sei
     parole, non per leggerle e decidere se annullare: chi appoggia il
     dito sulla striscia ha smesso di guardare altro, e il cronometro si
     ferma finché non lo alza (e riparte con almeno un secondo e due,
     non con quello che restava).
   · SE NE VA COL DITO. Buttarla giu' è più veloce che aspettare, ed è
     il gesto che tutti provano per primo.
   · DICE QUELLO CHE È SUCCESSO, e dove serve offre di disfarlo. Il
     «rimuovi» senza un annulla sarebbe una porta a senso unico su una
     cosa che si può sbagliare col pollice.
   `aria-live="polite"` sta sull'elemento nel corpo della pagina, non
   qui: un'area viva va dichiarata PRIMA che il testo ci arrivi dentro,
   se no il lettore di schermo non ha niente da osservare.
   ══════════════════════════════════════════════════════════════ */
const toast = document.getElementById("toast");
const toastCorpo = toast.querySelector(".corpo");
const toastDetto = toast.querySelector(".detto");
let toastScade = 0, toastResto = 0, toastCrono = null, toastDito = null;

function chiudiToast(){
  clearTimeout(toastCrono); toastCrono = null;
  toastDito = null;
  if(!toast.classList.contains("qui")) return;
  toast.classList.remove("qui", "tira");
  toast.style.removeProperty("--giu");
  toast.style.removeProperty("opacity");
  clearTimeout(toast.__fine);
  /* si svuota DOPO la dissolvenza, non prima: il testo che sparisce
     mentre la striscia è ancora in campo si legge come un guasto. E il
     cronometro è la stessa rete di sicurezza del congedo — se la
     transizione non parte (scheda in secondo piano) il tasto «annulla»
     resterebbe raggiungibile col tabulatore dentro una striscia
     invisibile. */
  toast.__fine = setTimeout(() => {
    if(toast.classList.contains("qui")) return;
    toastDetto.textContent = "";
    for(const b of [...toastCorpo.querySelectorAll(".disfa")]) b.remove();
  }, 300);
}
function armaToast(ms){
  clearTimeout(toastCrono);
  toastScade = performance.now() + ms;
  toastCrono = setTimeout(chiudiToast, ms);
}
/* ── LA STRISCIA STA AL CENTRO DI QUELLO CHE SI GUARDA ─────────
   `left:50%` è il centro della FINESTRA, e per un telefono è la stessa
   cosa. Su schermo largo no: il pannello si prende 360 punti a destra, la
   scena ne tiene 1080, e una striscia centrata sulla finestra cade 180
   punti fuori dal centro di quello che si sta guardando - misurato a
   1440x900, il suo bordo destro finiva sotto il pannello. Si centra
   sull'area utile, che è lo stesso rettangolo su cui si centra il
   soggetto: il riscontro appartiene alla scena, non alla pagina.
   Stretto la proprietà si TOGLIE invece di riscriverla a 195: così la
   regola del foglio di stile torna padrona, `min(360px, 100vw - 28px)`
   compreso, e non c'è un secondo posto dove il numero può divergere. */
function centraToast(){
  if(!larga){ toast.style.removeProperty("left"); return; }
  const a = areaUtile();
  toast.style.left = Math.round((a.x0 + a.x1) / 2) + "px";
}
function mostraToast(detto, opz){
  opz = opz || {};
  clearTimeout(toast.__fine);
  for(const b of [...toastCorpo.querySelectorAll(".disfa")]) b.remove();
  toastDetto.textContent = detto;
  /* LA PILLOLA E LA STRISCIA NON SONO LA STESSA COSA. La striscia dice
     un fatto e se ne va in tre secondi; la pillola è la conferma del
     sistema — 36 punti, `--vano` su `--luce`, dentro in 100 e fuori in
     250 — e la si chiede per nome quando serve. Oggi serve a una cosa
     sola: l'unica azione che toglie qualcosa. */
  toast.classList.toggle("pillola", !!opz.pillola);
  if(opz.disfa){
    const b = document.createElement("button");
    b.type = "button"; b.className = "disfa";
    b.textContent = opz.etichetta || "annulla";
    b.onclick = () => { chiudiToast(); opz.disfa(); };
    toastCorpo.appendChild(b);
  }
  centraToast();                        // prima del quadro, o entra storta
  void toast.offsetWidth;               // due stati, o la transizione non parte
  toast.classList.add("qui");
  armaToast(opz.durata || 4000);
}
toast.addEventListener("pointerdown", e => {
  if(e.target.closest(".disfa")) return;
  clearTimeout(toastCrono); toastCrono = null;
  toastResto = Math.max(1200, toastScade - performance.now());
  toastDito = {y:e.clientY, id:e.pointerId};
  toast.classList.add("tira");
  try { toast.setPointerCapture(e.pointerId); } catch(_) {}
});
toast.addEventListener("pointermove", e => {
  if(!toastDito || e.pointerId !== toastDito.id) return;
  const dy = Math.max(0, e.clientY - toastDito.y);
  toast.style.setProperty("--giu", dy + "px");
  toast.style.opacity = String(Math.max(0, 1 - dy / 110));
});
const lasciaToast = e => {
  if(!toastDito || e.pointerId !== toastDito.id) return;
  const dy = Math.max(0, e.clientY - toastDito.y);
  toastDito = null;
  toast.classList.remove("tira");
  if(dy > 44){ chiudiToast(); return; }
  toast.style.removeProperty("--giu");
  toast.style.removeProperty("opacity");
  armaToast(toastResto);
};
toast.addEventListener("pointerup", lasciaToast);
toast.addEventListener("pointercancel", lasciaToast);

/* ══════════════════════════════════════════════════════════════
   IL PROFILO DI RESA — e perché sta QUI, in cima al disegnatore

   La misura vera, dal telefono del cliente: registrazione dello schermo
   di un iPhone 1180x2556 (tre punti per pixel) con la batteria al dieci
   per cento. Sui diciotto secondi, ai livelli 0 e 1, i fotogrammi NUOVI
   al secondo stanno fra 4 e 25, mediana circa DIECI. Verdetto: «il
   telefono si appesantisce, gli swipe sono macchinosi».
   Il tetto ai punti per pixel, l'occlusione spenta e la tela a sette
   decimi c'erano già e non sono bastati, perché attaccavano i pixel di
   UNA passata mentre il fotogramma ne paga quattro, e la geometria la
   attraversa QUATTRO volte: colore, profondita' per la sfocatura, e due
   volte la mappa d'ombra (misurato col banco _M_: 4 passate, 2,96 Mpx di
   colore e 8,39 Mpx di ombra per fotogramma, 795.130 triangoli al
   livello 1).
   Quindi il profilo non è una manopola: è una DICHIARAZIONE che sta
   prima di tutto il resto, perché la mappa d'ombra, i materiali e la
   catena delle passate si costruiscono dopo e devono leggerla.
   `?resa=leggera|piena` la forza, per poter guardare i due mondi sullo
   stesso schermo senza cambiare telefono.
   ══════════════════════════════════════════════════════════════ */
/* dove si TOCCA. Non è «è un telefono»: è «il bersaglio è un
   polpastrello», che è la domanda giusta — un portatile con lo schermo
   a tocco non deve degradarsi, e infatti non ha `pointer:coarse`. */
const TOCCO_GROSSO = matchMedia("(pointer:coarse)");
const RESA_DETTA = scegli("resa", ["leggera", "piena"], "");
let telefono = RESA_DETTA ? RESA_DETTA === "leggera" : TOCCO_GROSSO.matches;
/* e la diagnosi si accende dall'indirizzo: serve a LEGGERE i numeri da
   una registrazione dello schermo del cliente, che è l'unico posto dove
   il telefono vero si lascia misurare */
const DIAG = q.get("diag") === "1";
/* il profilo si scrive sulla radice perché anche il FOGLIO DI STILE deve
   saperlo: il filtro di fondo sopra la tela (vedi `#accanto .carta`) non
   si spegne da JavaScript, si spegne con una regola. */
document.documentElement.dataset.resa = telefono ? "leggera" : "piena";

/* ══════════════════════════════════════════════════════════════
   I FLAG DI CREAZIONE, MISURATI E NON EREDITATI

   `antialias:true` non serviva a NIENTE e costava un buffer multicampione
   grande quanto la tela. Il quadro finito non passa mai dal multicampione:
   a riposo lo compone la catena delle passate, che disegna dentro i propri
   bersagli e poi appoggia UN rettangolo a tutto schermo sul framebuffer di
   default — e l'unico bordo che il multicampione potrebbe levigare è il
   perimetro di quel rettangolo, cioè il bordo dello schermo. Durante il
   gesto, dove il disegno adesso va diretto (vedi `dipingi`), un'immagine
   che si muove non si legge sui contorni: si legge sulla cadenza.
   `low-power` chiedeva esplicitamente all'iPhone la GPU meno capace:
   è l'opposto di quello che serve a quindici fotogrammi al secondo.
   `stencil:false` toglie otto bit per pixel su ogni bersaglio: qui nessun
   materiale usa lo stencil. La profondita' serve e resta. */
const rend = new THREE.WebGLRenderer({antialias:false, stencil:false,
  depth:true, preserveDrawingBuffer:false,
  powerPreference:"high-performance"});
rend.setPixelRatio(Math.min(devicePixelRatio, 2));
rend.setSize(innerWidth, innerHeight);
rend.outputColorSpace = THREE.SRGBColorSpace;
rend.toneMapping = THREE.ACESFilmicToneMapping;
rend.toneMappingExposure = 0.62;
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFShadowMap;
/* ── L'OMBRA NON SI RIDISEGNA SESSANTA VOLTE AL SECONDO ────────
   Misurato col banco _M_ prima di questa riga: DUE mappe d'ombra per
   fotogramma, 2048 per 2048 ciascuna, cioè 8,39 megapixel — più del
   colore (2,96). Due, non una, perché la mappa si rifa' all'inizio di
   OGNI `renderer.render`, e la catena delle passate la scena la disegna
   due volte: una per il colore e una per la profondita' della sfocatura.
   Ed è una passata di GEOMETRIA: quei 2048 quadrati costano anche tutti
   i triangoli del banco, un'altra volta.
   Ma qui dentro l'ombra la fa `sole`, che è FISSO, e la getta su un
   ripiano fisso. Cambia solo quando cambia la roba: un livello, una posa
   che scivola, un pezzo tolto, la fine di un volo. Quindi su telefono la
   si calcola quando serve — `ombraDaRifare()` — e negli altri fotogrammi
   si riusa. Su desktop resta automatica: lì non è mai stata il
   problema, e una scelta non misurata non si estende.
   La misura da 2048 a 512 la porta da 4,19 a 0,26 megapixel: su un fronte
   di 1,6 metri sono 3,1 millimetri per campione contro 0,8. L'ombra di
   contatto sotto il fusto resta (verificata col banco: vedi la tabella
   nella consegna), quella che si perde è la nitidezza del bordo lontano,
   che sul telefono cade dentro la sfocatura di campo. */
/* ── E LA SPORCA È LA ROBA, NON LA MACCHINA ───────────────────
   L'errore facile qui sarebbe legare il rinfresco al MOVIMENTO, cioè al
   dito. Ma la mappa d'ombra la disegna `sole`, che è fisso, su un
   ripiano fisso: non dipende da dove guarda la macchina. Girare attorno
   al banco non cambia un'ombra di un pixel, e infatti col rinfresco
   legato alla macchina si pagavano sessanta mappe al secondo per niente.
   Cambia invece quando cambia la ROBA: un espositore che scorre, una
   posa che scivola, un livello, un pezzo tolto, la vela che accende e
   spegne le mesh. Quindi la chiamano quelle — `applicaPos`, `passoPosa`,
   il passo della vela, i cambi di livello — e nessun altro. */
if(telefono) rend.shadowMap.autoUpdate = false;
function ombraDaRifare(){ if(telefono) rend.shadowMap.needsUpdate = true; }
/* ══════════════════════════════════════════════════════════════
   E CHI GETTA L'OMBRA: gli espositori, non la merce

   La mappa d'ombra è una passata di GEOMETRIA, e la sua inquadratura è
   quella del faretto — un fronte di 1,6 metri che tiene dentro TUTTO il
   banco, mentre la macchina ne vede una fetta. Misurato: durante uno
   swipe al livello 1 la passata d'ombra attraversa circa 194.000
   triangoli, quanto la passata a colori. E quasi tutti quei triangoli
   sono CATENA: un busto è 93.000 triangoli e 64.000 sono le maglie delle
   due collane, per tre busti in fila.
   Cosa getta quella catena? La sua ombra sul busto, che sta già dentro
   la penombra del collo — e sul ripiano non arriva, perché fra la
   collana e il ripiano c'è il busto intero. Si paga la geometria più
   cara del banco per un'ombra che quasi non si vede.
   Quindi dove si tocca la merce non getta: gettano il busto, il plinto,
   il nastro, la colonnina — cioè le cose che appoggiano sul ripiano ed è
   la loro ombra che dice quanto sono lontane. La merce continua a
   RICEVERE, che è quello che la tiene attaccata all'espositore. */
function chiOmbra(){
  if(!telefono) return;
  for(const f of FAMIGLIE){
    for(const o of (merci[f.id] || []))
      if(o) o.traverse(m => { if(m.isMesh) m.castShadow = false; });
    for(const o of (pose[f.id] || []))
      if(o) o.traverse(m => { if(m.isMesh) m.castShadow = false; });
  }
  ombraDaRifare();
}
/* il contatore delle chiamate di disegno si azzera a ogni `render`, e con
   la catena delle passate un fotogramma ne fa quattro: letto in fondo al
   ciclo direbbe «1 chiamata, 2 triangoli», cioè il rettangolo di uscita.
   Spento l'azzeramento automatico e rimesso in cima a `gira()`, il numero
   diventa quello del FOTOGRAMMA — che è l'unico che si possa leggere da
   una registrazione dello schermo e confrontare con una tabella. */
rend.info.autoReset = false;
stanza.appendChild(rend.domElement);

const scena = new THREE.Scene();
/* IL FONDO È LA FODERA. Era il marrone di una vetrina da negozio: questo
   non è un negozio, è il COFANETTO di chi porta i gioielli, e dentro un
   astuccio il fondo è velluto quasi nero. */
scena.background = new THREE.Color(0x14110E);
const pm = new THREE.PMREMGenerator(rend);
/* ── LA VETRINA: l'ambiente che si riflette nelle cose ───────
   Tre fatti di una vetrina vera, nessuno dei quali c'era prima.
   1. È una SCATOLA SCURA con dentro dei fari. I neri non sono un
      vezzo: sono l'unica cosa che dia un bordo al metallo. In un
      ambiente chiaro dappertutto una creola d'acciaio non ha contorno,
      e nessuna lucidatura la salva.
   2. La luce ha un VERSO. Un taglio caldo che scende da sinistra e un
      riempimento freddo da destra: è così che si illumina la merce, e
      l'ombra che ne esce dice la forma. Una luce uguale da ogni parte
      non è morbida, è assente.
   3. C'è un RIMBALZO dal ripiano, e un filo di luce basso davanti —
      quello che nelle vetrine arriva dal vetro e disegna gli spigoli. */
function laVetrina(){
  const v = new THREE.Scene();
  const cubo = new THREE.BoxGeometry();
  cubo.deleteAttribute("uv");

  const scatola = new THREE.Mesh(cubo, new THREE.MeshStandardMaterial(
    {side:THREE.BackSide, roughness:1, metalness:0}));
  scatola.material.color.setHex(0x0E0D0C);     // i NERI
  scatola.scale.set(9, 6, 9);
  v.add(scatola);

  const faro = (colore, forza, px,py,pz, sx,sy,sz)=>{
    const m = new THREE.MeshStandardMaterial({roughness:1, metalness:0});
    m.color.setHex(0x000000);
    m.emissive.setHex(colore); m.emissiveIntensity = forza;
    const q = new THREE.Mesh(cubo, m);
    q.position.set(px,py,pz); q.scale.set(sx,sy,sz);
    v.add(q);
  };
  // MISURATO sul riferimento vero (un espositore da gioielleria
  // fotografato): il fusto di una colonnina scende dal colmo al fianco di
  // 0,31 — cioè il fianco è un terzo più scuro. Il nostro stava a 0,17,
  // la metà. Non è la forma a mancare, è la LUCE: un riempimento largo
  // e forte da destra rialza il fianco in ombra e appiattisce il cilindro.
  // Quindi il taglio caldo si stringe e sale, il riempimento scende.
  faro(0xFFE2B8, 19.0, -2.5, 2.9, 1.2,  2.2, 0.10, 2.4);  // il taglio caldo, stretto
  faro(0xC9DEE8,  3.9,  3.3, 1.3, 0.5,  0.10, 1.8, 2.6);  // il riempimento freddo
  faro(0xF6EFE4,  1.0,  0.0,-1.4, 0.7,  4.5, 0.10, 3.5);  // il rimbalzo dal ripiano
  faro(0xFFFFFF,  1.8,  0.0, 0.10, 2.9, 2.6, 0.05, 0.10); // il filo basso davanti
  return v;
}
scena.environment = pm.fromScene(laVetrina(), 0.02).texture;
// e l'ambiente pesa meno del faretto: è il faretto a portare l'ombra, e
// finché l'ambiente riempie tutto non c'è un solo angolo buio addosso
// agli oggetti — nemmeno dove il fusto tocca il plinto.
const AMBIENTE = 0.92;
scena.environmentIntensity = AMBIENTE;

// e il faretto vero, quello che fa l'ombra: caldo, da sinistra e in alto
const SOLE = 2.05;
const sole = new THREE.DirectionalLight(0xFFF1DC, SOLE);
sole.position.set(-0.62, 1.25, 0.78);
sole.castShadow = true;
// 2048 su un fronte di 1,6 m fa 0,8 mm per campione: è la misura che
// serve per vedere l'ombra dove il fusto appoggia sul plinto, che a 1024
// spariva dentro un solo campione
// e dove si tocca la misura scende a 512: la mappa passa da 4,19 a 0,26
// megapixel, e a quel punto rifarla ogni tanto non costa più niente
sole.shadow.mapSize.set(telefono ? 512 : 2048, telefono ? 512 : 2048);
sole.shadow.camera.left = -0.8; sole.shadow.camera.right = 0.8;
sole.shadow.camera.top = 0.8;   sole.shadow.camera.bottom = -0.5;
sole.shadow.camera.near = 0.05; sole.shadow.camera.far = 3;
sole.shadow.bias = -0.0006;
scena.add(sole);
// il contrasto da destra: non illumina, mette un bordo freddo sul metallo
const contro = new THREE.DirectionalLight(0xBFD8E4, 0.30);
contro.position.set(0.95, 0.55, -0.35);
scena.add(contro);
// l'ambiente adesso fa il riempimento, quindi l'ambientale scende quasi a zero:
// lasciata a 0,15 rialzava le ombre e ricancellava il verso della luce
scena.add(new THREE.AmbientLight(0xffffff, 0.05));

/* ── LA LAMPADA DEL GIOIELLIERE ──────────────────────────────
   Si accende solo quando il pezzo viene avanti da solo, e sta ATTACCATA
   ALLA MACCHINA: è la lampada che il gioielliere gira verso di te quando
   ti mette una cosa in mano. Senza, una creola d'argento davanti a una
   parete scura non ha più niente che la illumini — l'ambiente della
   vetrina lavora sui pezzi in vetrina, e il pezzo non è più lì. */
const lampada = new THREE.DirectionalLight(0xFFF4E6, 0);
scena.add(lampada);
scena.add(lampada.target);

// IL PIANO DEL BANCO. Senza un piano gli oggetti galleggiano nel nulla e
// la profondita' non si legge: è l'ombra sul ripiano a dire quanto è
// lontano ciascuno.
// IL RIPIANO È DUE PIANI, non uno. Fatto di materiale illuminato usciva
// GRIGIO — la posa è tarata bassa apposta, perché il turchese a piena luce
// diventa un pastello (misurato: 136,181,185 invece di 45,96,101), e la
// stessa esposizione che salva la similpelle spegne il ripiano.
// Quindi: un piano PIATTO nel colore giusto, e sopra un secondo piano che
// non ha colore e porta solo l'ombra. Così il ripiano è carta e l'ombra
// resta vera.
// e anche il ripiano si spegne verso il fondo: è quello che fa sembrare
/* IL CARICATORE STA SOPRA A CHI LO USA. Era dichiarato centocinquanta
   righe più giu': vestiStanza() moriva su «Cannot access 'tex' before
   initialization», il fondale non si è MAI caricato, e il piano restava
   nero senza che niente in pagina lo dicesse. Un `const` non si solleva. */
const tex = new THREE.TextureLoader();

// il banco profondo invece che un foglio bianco steso
/* ── IL BANCONE ───────────────────────────────────────────────────
   Era un PIANO: un colore steso a y=0, senza spessore. Un piano non è un
   bancone — gli manca la cosa che lo fa riconoscere, cioè il BORDO. In una
   gioielleria il bancone è un volume: un piano di pietra sopra, un fianco
   che scende, e un filo di luce sullo spigolo dove il piano finisce.
   La pietra è un materiale ILLUMINATO, non un colore steso: un bancone si
   riconosce da come la luce ci scivola sopra. Era stato tenuto piatto
   apposta quando il fondo era chiaro — a quella esposizione un materiale
   vero usciva grigio — ma adesso la stanza è scura e il problema non c'è
   più.
   L'orizzonte, che era il difetto peggiore (138 livelli di salto in un
   pixel), qui non torna: dietro il bancone non c'è un secondo piano
   incollato, c'è una STANZA, e la stanza è sfocata. È così che sta in
   una fotografia vera. */
/* E LA PIETRA È UNA PIETRA. Era `color:0xD5D2C6`: un beige identico in
   ogni suo punto, quattrocento pixel di niente sotto la merce, ed era il
   pezzo che più di ogni altro diceva «disegnato». La lastra si costruisce
   in Blender (pietra.py) e arriva qui come due immagini — il colore e la
   ruvidezza — perché quello che fa il marmo non è la venatura disegnata,
   è che il riflesso della vetrina si SPEZZA dove passa la vena. Una
   LA PIASTRELLA NON SI RIPETE. Messa a due giri sui 2,70 m lasciava una
   CUCITURA verticale netta in mezzo al banco: l'immagine non è periodica,
   e una lastra di marmo non ha una giunta al centro. Se ne stende una
   sola, tirata su tutta la lunghezza: le vene vengono il doppio più
   larghe, ed è giusto così — un banco da 2,70 è una lastra grande. */
const PIANO_L = 2.70, PIANO_P = 0.78, PIANO_H = 0.055, LASTRA = 1.35;
const pietraCol = tessuto("banco_pietra.webp", {spazio: THREE.SRGBColorSpace}),
      pietraRuv = tessuto("banco_ruvido.webp");
for(const t of [pietraCol, pietraRuv]){
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, PIANO_P / LASTRA);
  t.anisotropy = 8;
}
const cimaBanco = new THREE.MeshStandardMaterial(
  {map:pietraCol, roughnessMap:pietraRuv, roughness:1.0, metalness:0.0});
/* solo la FACCIA DI SOPRA prende la lastra. Un box in three.js usa le
   stesse coordinate su tutte e sei le facce: sul filo davanti, alto cinque
   centimetri e mezzo, la stessa piastrella verrebbe schiacciata, e il filo
   è proprio quello che si guarda quando si dice «che spessore ha». */
const filoBanco = new THREE.MeshStandardMaterial(
  {color:0x9C968A, roughness:0.34, metalness:0.0});
const banco = new THREE.Mesh(
  new THREE.BoxGeometry(PIANO_L, PIANO_H, PIANO_P),
  [filoBanco, filoBanco, cimaBanco, filoBanco, filoBanco, filoBanco]);
banco.position.set(0, -PIANO_H / 2, 0.06);
banco.receiveShadow = true;
scena.add(banco);

/* il fianco: più scuro del piano, perché non prende la luce di taglio —
   ed è quel salto fra piano e fianco a dire lo SPESSORE */
const fianco = new THREE.Mesh(
  new THREE.BoxGeometry(PIANO_L, 0.90, PIANO_P - 0.05),
  new THREE.MeshStandardMaterial({color:0x7E7A70, roughness:0.66, metalness:0.0}));
fianco.position.set(0, -PIANO_H - 0.45, 0.045);
scena.add(fianco);
/* IL RIFLESSO SUL RIPIANO: PROVATO E TOLTO. In una fotografia di vetrina
   vera il piede dell'espositore si specchia un poco nel piano, ed è
   l'ultimo indizio di «render» rimasto. Montato un Reflector sotto il
   ripiano, misurato: scuriva tutto di 4,8 livelli in modo UNIFORME e sotto
   il plinto non guadagnava NIENTE. Anche escludendo il ripiano dal suo
   scatto — che va fatto agganciando il suo `onBeforeRender`, perché la
   macchina dello specchio sta in una mappa interna e non si configura una
   volta per tutte — il numero non si muoveva: un velo scuro, non un
   riflesso. Un passaggio che costa e non rende non si spedisce.
   Se si riprende: il piano dello specchio è piccolo (2,6 x 2,0) e il
   soggetto sta in alto, quindi probabilmente cade fuori dal suo tronco di
   visuale — la strada è allargarlo e alzargli il campo, non alzare
   l'opacita'. */

/* E IL PIANO CHE RACCOGLIE L'OMBRA HA L'IMPRONTA DEL BANCO.
   Era sei metri per sei: invisibile, ma scriveva profondita' per due metri
   e settanta OLTRE il filo del banco, dove non c'è nessuna superficie.
   Visto da una macchina che sta otto centimetri sopra di lui, il suo filo
   lontano si proietta come una riga dritta attraverso tutto lo schermo, e
   la sfocatura la trasforma in un taglio: il raggio con cui raccoglie il
   colore lo prende dalla profondita' del pixel centrale, e sopra quella
   riga la profondita' è quella del fondo lontano mentre sotto è quella
   di un piano a mezz'aria. Massimo l'ha visto da desktop, dove lo schermo
   è largo e la riga attraversa tutto.
   Misurato sul fotogramma girato a 1440x900, riga 300: contrasto relativo
   fra righe 0,535 -> 0,035, salto assoluto 9,47 -> 0,83. Nasconderlo del
   tutto da 0,032, cioè lo stesso: quindi non serve toglierlo, serve
   ridurlo a quello che deve fare. L'ombra di contatto cade a centimetri
   dal pezzo, dentro il banco: fuori dal banco quel piano non serve a
   niente e rovina l'immagine. */
const ombraBanco = new THREE.Mesh(new THREE.PlaneGeometry(PIANO_L, PIANO_P),
  new THREE.ShadowMaterial({opacity:0.30}));
ombraBanco.rotation.x = -Math.PI/2;
ombraBanco.position.set(0, 0.0004, 0.06);
ombraBanco.receiveShadow = true;
scena.add(ombraBanco);

// e una parete dietro, che chiude la stanza
// LA PARETE NON SI ILLUMINA. Fatta di materiale che risponde alla luce
// usciva grigia — e uno sfondo grigio non è una stanza, è nebbia. Piatta
// nel cipria del brand, invece, fa da fondale e la linea dove incontra il
// banco diventa l'orizzonte: è quella riga a dire che c'è un pavimento.
// ...ma PIATTA nel senso di non illuminata, non nel senso di uniforme.
// Un fondale dello stesso colore da cima a fondo è una parete di studio:
// in una vetrina il fondo si SPEGNE salendo e allontanandosi, ed è quella
// caduta a dire che c'è una scatola e non un infinito.
function sfumatura(alto, basso, versoSotto){
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d").createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, versoSotto ? alto : basso);
  g.addColorStop(1, versoSotto ? basso : alto);
  const x = c.getContext("2d"); x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* ══ LA STANZA ═══════════════════════════════════════════════════
   Verdetto di Massimo: «sembra un cartone animato molto brutto». Aveva
   ragione, ed era un errore di METODO prima che di gusto: parete,
   pavimento e piante li avevo montati con primitive qui dentro — colori
   stesi, nessuna materia, nessun rimbalzo di luce, foglie che erano sette
   sagome piatte a tinta unita. Il contratto del progetto lo dice da mesi:
   **il codice misura e impagina, la forma si costruisce altrove.**
   Adesso la stanza è resa in Cycles (`stanza.py`): calce, rovere, una
   finestra vera che illumina da sinistra, un mobile di fondo, e piante
   fatte di centinaia di foglie con la luce che ci passa attraverso.
   Qui dentro arriva come FONDALE — una fotografia su un piano lontano —
   e la profondita' di campo dell'app la sfoca ancora, sopra il mosso che
   ha già di suo.
   L'AMBIENTE CHE ILLUMINA LA MERCE NON CAMBIA. Resta la scatola di luce
   tarata sui gioielli: è esattamente quello che si fa in una fotografia
   di prodotto — il pezzo sta dentro una scatola di luce, la stanza sta
   dietro. Cambiarlo qui vorrebbe dire rifare da capo la taratura dei
   colori degli orologi, che è chiusa a 0,8 su 255. */
const AMBIENTI = [
  {id:"boutique", nome:"Boutique", fondale:"stanza_fondale.webp",
   giro:"stanza_giro.webp"},
];
let ambienteScelto = "boutique";
try { const v = localStorage.getItem("regina.ambiente");
      if(v && AMBIENTI.some(x => x.id === v)) ambienteScelto = v; } catch(_) {}
if(q.get("ambiente") && AMBIENTI.some(x => x.id === q.get("ambiente")))
  ambienteScelto = q.get("ambiente");
const ambiente = () => AMBIENTI.find(a => a.id === ambienteScelto) || AMBIENTI[0];

/* IL PIANO È UNA FINESTRA, e i suoi numeri sono gli stessi con cui è
   stato scattato il fondale (stanza.py li ricalcola da qui).
   Sta a 2,30 m dietro l'origine, cioè 3,206 dall'occhio del banco, ed
   è largo 2,00 per 3,3333 — la proporzione dei 1800x3000 renderizzati.
   Il suo CENTRO sta all'altezza dell'occhio, non a mezz'aria: solo così
   l'asse della macchina di Blender lo colpisce perpendicolare e
   l'immagine non ha trapezio. Di quei 2,00 m l'app ne vede 0,85: il
   resto è margine per quando la macchina gira sul pezzo. */
const OCCHIO_ALTO = 0.0738, OCCHIO_INDIETRO = 0.9056, FONDALE = 3.206;
const parete = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 10/3),
  new THREE.MeshBasicMaterial({toneMapped:false}));
parete.position.set(0, OCCHIO_ALTO, -2.30);
scena.add(parete);

/* IL GIRO. Il piano è nitido ma finisce: appena la macchina gira attorno
   al pezzo gli esce di fianco, e il gioiello restava su un nero pieno.
   Passare da una stanza a un nero non è «più sfocato», è «sparito».
   Dietro al piano ci sta quindi tutta la stanza su una sfera — stesso
   punto di vista, stesso raggio — che non finisce mai. Al banco sfera e
   piano combaciano nel centro del quadro e si vede il piano, che lì è
   quello nitido; girando attorno al pezzo resta solo la sfera, sfocata di
   quarantaquattro pixel, dove non conta leggere ma esserci. */
/* IL RAGGIO È PIÙ LUNGO DELLA DISTANZA DEL PIANO, e non di un caso.
   Con il raggio uguale a FONDALE la sfera passa esattamente per il piano
   del fondale: stessa distanza, stessi pixel, e chi vince lo decide
   l'ultima cifra del numero. Finché la sfera non scriveva profondita' il
   piano vinceva sempre; tolto quel puntello — per un'altra ragione, la
   riga netta che si vedeva su desktop — i due hanno cominciato a
   contendersi il fondo, e dietro agli espositori è comparsa una parete
   piatta al posto della stanza. Venticinque centimetri più in la' e la
   sfera sta dietro, dove deve stare. */
const giro = new THREE.Mesh(
  new THREE.SphereGeometry(FONDALE + 0.25, 64, 40),
  /* E LA SFERA SCRIVE LA SUA PROFONDITA'. Con `depthWrite:false` il
     buffer, dove c'è solo lei, resta al valore di fondo — infinito. La
     sfocatura legge la profondita' per decidere quanto sfocare, e fra il
     banco (settanta centimetri) e un fondo a infinito il salto è netto:
     il diaframma non può far sconfinare il fondo sopra il bordo del
     banco, e quel bordo resta TAGLIATO COL RASOIO in mezzo a
     un'immagine tutta sfocata. È la riga che si vede su desktop
     inclinando la macchina verso il basso. Con la profondita' vera —
     3,2 metri, che è dove sta la stanza — il salto è quello di una
     stanza vera e il passaggio si chiude. */
  new THREE.MeshBasicMaterial({toneMapped:false, side:THREE.BackSide}));
giro.position.set(0, OCCHIO_ALTO, OCCHIO_INDIETRO);
/* E L'ANGOLO NON SI INDOVINA, SI MISURA. Una sfera in three.js porta il
   centro della sua immagine su -X; una panoramica di Blender lo porta
   dove guarda la macchina. Fra le due c'è un quarto di giro, ma quale
   dei quattro non si deduce dalla documentazione: si spegne il piano del
   fondale, si gira la sfera di quindici gradi per volta e si confronta con
   quello che il piano mostrava nello stesso punto dello schermo.
   Il piano da' 1-98-50 di luminanza da sinistra a destra (mobile scuro,
   parete chiara, pianta); la sfera a 270 gradi da' 7-83-82 — scarto 53 —
   e la seconda migliore sta a 106. Non c'è ambiguita'. */
giro.rotation.y = Math.PI * 1.5;
scena.add(giro);

function vestiStanza(){
  {
    const t = tessuto(ambiente().fondale, {spazio: THREE.SRGBColorSpace});
    parete.material.map = t;
    parete.material.needsUpdate = true;
  }
  {
    const t = tessuto(ambiente().giro, {spazio: THREE.SRGBColorSpace});
    /* IL PANORAMA VA ROVESCIATO. Una sfera guardata da DENTRO — lato
       interno — mostra la propria texture specchiata: il mobile, che nella
       stanza sta a sinistra, cadeva a destra. Misurato sul banco con il
       piano del fondale spento: la sfera dava 40-118-7 da sinistra a
       destra dove il fondale da' 1-98-50, cioè lo stesso disegno al
       rovescio. Si specchia la texture, non la geometria: scalare la sfera
       di -1 rovescerebbe anche le normali. */
    t.wrapS = THREE.RepeatWrapping;
    t.repeat.x = -1;
    t.offset.x = 1;
    giro.material.map = t;
    giro.material.needsUpdate = true;
  }
  sveglia();
}
vestiStanza();


const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.01, 30);

/* ── L'OCCLUSIONE NEGLI ANGOLI ────────────────────────────────
   MISURATO sul riferimento vero: il fusto di una colonnina, appena sopra
   il punto dove appoggia sul vassoio, è 24 per cento più scuro che a
   metà altezza. Da noi era 3 per cento: il palo sembrava POSATO SOPRA
   una fotografia del vassoio, non infilato dentro.
   Non è un difetto di luce e non lo risolve nessun faro: è che la luce
   d'ambiente arriva da tutte le direzioni anche dentro una fessura da un
   millimetro, e nella realta' lì non ci arriva. L'ombra del faretto non
   c'entra — cade a fianco del palo, non addosso.
   Serve l'occlusione ambientale, e qui si calcola sullo schermo: per ogni
   pixel si guarda quanto cielo vede davvero. Costa una passata in più e
   paga tutti gli angoli del banco insieme — il piede di ogni colonnina, la
   scanalatura, il collo del busto, dove il nastro entra nel plinto. */
const passe = new EffectComposer(rend);
passe.addPass(new RenderPass(scena, camera));
const ao = new GTAOPass(scena, camera, innerWidth, innerHeight);
// il raggio è in METRI, e gli oggetti qui sono alti otto centimetri: un
// raggio da mezzo metro (quello di serie) guarda fuori dal pezzo e non
// trova nessun angolo. Dodici millimetri è la misura della fessura vera.
const AO_BANCO = {radius: 0.018, distanceExponent: 1.0, thickness: 0.020,
                  scale: 3.0, samples: 9, screenSpaceRadius: false};
/* E SUL PEZZO STESO IL RAGGIO È UN ALTRO. Diciotto millimetri sono la
   misura della fessura sotto una colonnina; il filo di una catena è spesso
   un millimetro e mezzo, e il contatto fra il filo e la pietra è una riga
   sottilissima. Con un raggio dodici volte più grande l'occlusione non
   vede quella riga: misurata, la caduta di luce nei sei pixel sotto il filo
   era di otto punti — la penombra di un oggetto sospeso, non il nero di una
   cosa che tocca. */
/* ma la forza si tiene BASSA. A 3,8 l'occlusione stretta entrava anche
   dentro il buco di ogni anello e la catena perdeva l'oro: usciva sporca,
   scura, come ossidata. Il contatto lo fa il raggio, non la forza. */
const AO_POSATO = {radius: 0.0055, distanceExponent: 1.0, thickness: 0.007,
                   scale: 1.9, samples: 11, screenSpaceRadius: false};
ao.updateGtaoMaterial(AO_BANCO);
// e la passata che toglie il granello: senza, l'occlusione arriva sporca e
// il granello su una superficie chiara si legge come rumore di compressione
ao.updatePdMaterial({lumaPhi: 10, depthPhi: 2, normalPhi: 3,
                     radius: 5, radiusExponent: 1, rings: 2, samples: 10});
passe.addPass(ao);
/* ── LO SFOCATO, SOLO SUL PEZZO ──────────────────────────────
   Quando il gioiello viene avanti da solo, la stanza dietro deve uscire di
   fuoco. Non è un effetto: è quello che fa un occhio quando mette a fuoco
   una cosa a quattro centimetri — tutto il resto se ne va. Senza, il pezzo
   «galleggia» davanti a una parete nitida e si continua a leggere la
   parete. La messa a fuoco la sposta il moto, fotogramma per fotogramma,
   sulla distanza vera del pezzo. */
const sfoca = new BokehPass(scena, camera,
  {focus: 0.35, aperture: 0.0022, maxblur: 0.014});
/* LA STANZA È SEMPRE FUORI FUOCO, E SEMPRE DI PIÙ. Prima la sfocatura si
   accendeva solo entrando in un pezzo, e al banco il fondo era nitido come
   la merce: è l'opposto di come si fotografa una gioielleria, dove
   l'obiettivo è aperto e dietro c'è una poltiglia morbida.
   Tre gradini, uno per livello — il banco, l'espositore, il pezzo — e a
   ogni passo avanti il mondo dietro si allontana un po' di più. È il
   modo più semplice che esista per dire «adesso guardi QUESTO». */
/* IL TAGLIO NETTO, E PERCHÉ C'ERA.
   Verdetto di Massimo: «quel taglio netto che si vede nell'ambiente e che
   divide la visuale sfuocata da quella non sfuocata». Era vero, e stava
   sul filo lontano del banco: una riga dritta, dura come un ritaglio di
   carta, con i dentini quadrati della passata di sfocatura lungo il bordo.
   La sfocatura di three.js raccoglie il colore intorno con un raggio preso
   dalla profondita' del pixel CENTRALE. Se da un pixel al successivo la
   profondita' salta, salta anche il raggio — e il salto si vede come una
   linea. Al livello del pezzo il salto è enorme: il filo del banco sta a
   49 cm, e dietro non c'è NULLA per 2,2 metri, perché lì la parete
   piatta si spegne e resta solo la sfera del panorama a 3,45 m.
   La misura ha scartato due colpevoli: le schede dei suggerimenti (salto
   7,83 con e 7,88 senza, lontano dalle carte) e il piano che raccoglie
   l'ombra (togliergli la profondita' PEGGIORA il taglio da 27,9 a 57,7:
   faceva da rampa). Il colpevole era la taratura.
   L'apertura si diceva in numeri assoluti, e quei numeri dicevano che il
   fondo va in poltiglia solo a QUATTRO METRI dal fuoco. Ma qui si mette a
   fuoco a 15 cm: un obiettivo vero, a quella distanza, ha una profondita'
   di campo di millimetri, e tutto cio' che sta 40 cm più indietro è già
   una macchia. Con la saturazione a 4 m, invece, il cerchio di confusione
   era ancora in salita ripida proprio dove cade il filo del banco — 84%
   da una parte e 100% dall'altra non fanno una linea, 20% e 100% si'.
   Quindi non si tara più l'apertura: si dichiara PROFONDO, cioè a quanti
   metri oltre il fuoco il mondo è del tutto morbido, e l'apertura si
   ricava (satura quando distanza-fuoco >= massimo/apertura). Così la
   taratura è una scelta fotografica leggibile, e oltre quella soglia
   nessun salto di profondita' può più produrre un salto di raggio.
   Misurato sul telefono, sul filo del banco: 32,5 -> 12,4 di salto, e il
   profilo del pezzo passa da 17,0 a 18,3 — il soggetto non ci perde
   nitidezza, ci guadagna stacco. */
const FUOCO = [
  {profondo: 6.18, massimo: 0.0210},   // il banco: la stanza già respira
  {profondo: 4.66, massimo: 0.0270},   // un espositore
  {profondo: 0.40, massimo: 0.0560},   // un pezzo solo: macro, e la stanza sparisce
];
/* ── LA LENTE SI RIAPRE, NON SI ACCENDE ───────────────────────
   Misurato il salto fra i due fotogrammi — quello diretto del gesto e
   quello con la catena — al livello 1 a riposo: la luminanza media del
   fondo passa da 57,8 a 49,1 (meno 15 per cento) e su tutto il quadro da
   84,2 a 79,3. Non è poco: un cambio secco si legge come un LAMPO che
   scurisce la stanza, cioè esattamente il difetto che già era costato
   la dissolvenza del piano sul pezzo («fa ancora un effetto appare e
   scompare»).
   La dissolvenza fra due immagini costerebbe due fotogrammi e una
   passata di mescolatura. Non serve: la sfocatura ha già la sua
   manopola fisica. Si rimette la catena con la lente CHIUSA — `maxblur`
   a zero, cioè un quadro che vale quello diretto — e la si apre in
   ventidue centesimi di secondo. Non è un'immagine che sfuma dentro
   un'altra: è un obiettivo che si apre, che è anche quello che fa un
   occhio quando smette di seguire una cosa che si muove.
   `sfocaMax` tiene il bersaglio del livello, `sfocaT` quanto se n'e'
   già aperta. Sul desktop restano fermi a uno e non succede nulla. */
let sfocaMax = 0.0210, sfocaT = 1;
const RIENTRO_S = 0.22;
function profondita(liv){
  const f = FUOCO[Math.max(0, Math.min(2, liv))];
  sfoca.uniforms.aperture.value = f.massimo / f.profondo;
  sfocaMax = f.massimo;
  sfoca.uniforms.maxblur.value = f.massimo * sfocaT;
  sfoca.enabled = true;
}
sfoca.enabled = true;
passe.addPass(sfoca);
passe.addPass(new OutputPass());

/* ══════════════════════════════════════════════════════════════
   QUANTI PIXEL SI DISEGNANO — e chi lo decide

   Il cliente, sul suo iPhone: «lo swipe nel cofanetto è poco fluido».
   Misurato col banco _F_ su 390x844 a due punti per pixel, prima di
   questo blocco: NOVE passate per fotogramma, 11,85 milioni di pixel, e
   la scena disegnata TRE volte — il colore, la profondita' con le normali
   per l'occlusione, e di nuovo la profondita' per la sfocatura. Al banco
   sono 279 chiamate di disegno e 734.244 triangoli; in selezione
   1.051.440. Nello stesso banco il JS costa 0,17 millisecondi per
   fotogramma. Il collo di bottiglia non è il codice: sono i pixel.
   Tre manopole, tutte misurate, nessuna indovinata:

   1 · IL TETTO AI PUNTI PER PIXEL. Un iPhone ne dichiara 3; qui erano
       già tagliati a 2, e due punti per pixel su 390x844 fanno comunque
       1,32 milioni di pixel per passata. Il tetto di 1,5 è quello che i
       visualizzatori 3D sul web usano da anni (Codrops: 1 su desktop,
       1,5 su telefono), e toglie il 44 per cento dei pixel di OGNI
       passata.
   2 · MENO PIXEL SOTTO IL DITO. Mentre il dito è giu' la tela si
       disegna a sette decimi di lato — metà dei pixel — e torna piena
       al rilascio in due fotogrammi. È il trucco di ogni visualizzatore
       serio: sotto il dito conta la FLUIDITA', non la nitidezza, perché
       quello che si guarda si sta muovendo. Fermo, la nitidezza torna
       intera.
   3 · L'OCCLUSIONE SPENTA DI SERIE DOVE SI TOCCA. Da sola vale cinque
       delle nove passate e la metà esatta dei pixel (misurato: 11,85 →
       5,27 Mpx, 9 → 4 passate, e una scena in meno da disegnare). Sul
       profilo del pezzo non toglie niente di leggibile: energia del
       gradiente 1.485.492 con, 1.485.044 senza — un quarto di per mille.
   ══════════════════════════════════════════════════════════════ */
/* `TOCCO_GROSSO` e `telefono` sono saliti in cima al disegnatore, col
   profilo di resa: la mappa d'ombra e i materiali si costruiscono prima
   di questa riga e devono già sapere su che macchina siamo. */
/* la scala dei punti per pixel, a gradini. Il primo è quello di serie.
   Sul desktop il primo gradino resta il 2 di sempre: quel quadro è stato
   approvato così, e non si tocca senza che nessuno l'abbia chiesto. */
const SCALE = () => telefono ? [1.5, 1.25, 1.0] : [2, 1.5, 1.25];
let gradino = 0;
/* sette decimi di lato fanno metà dei pixel (0,7 al quadrato = 0,49).
   E VALE DOVE SI TOCCA. Sul desktop no: quel quadro è stato approvato
   com'e', e misurato lì il trascinamento del mouse sarebbe passato da
   11,85 a 5,80 Mpx — cioè un'immagine che si ammorbidisce sotto il
   cursore su una macchina che non ne ha nessun bisogno. Se una macchina
   da scrivania non ce la fa, a toglierle pixel ci pensa il monitor, che
   la misura invece di presumerla. Da `window.__gesto` si accende
   comunque, per provarla. */
let GESTO_SCALA = 0.7, gestoAMano = false;
/* ══════════════════════════════════════════════════════════════
   SOTTO IL DITO NON SI RIALLOCA PIÙ NIENTE — dove si tocca

   La tela a sette decimi era una buona idea su carta e una cattiva su un
   iPhone. Scendere e risalire vuol dire cambiare la misura del
   framebuffer e dei TRE bersagli della catena (il bersaglio di lettura,
   quello di scrittura, la mappa di profondita' della sfocatura): tre
   texture buttate e tre riallocate, due volte per gesto. Misurato col
   banco _M_ su cinque swipe, PRIMA: 27 `setSize` e 9 `setPixelRatio`.
   Su iOS una riallocazione di quel genere non è gratis e non è
   nemmeno regolare — e cade esattamente all'inizio e alla fine dello
   swipe, che è dove il cliente dice «macchinoso».
   Quindi dove si tocca la risoluzione è FISSA: la sceglie il monitor,
   una volta, e non cambia in corsa. Se deve cambiare, cambia A RIPOSO —
   e lì un fotogramma che costa qualcosa non lo sente nessuno.
   Sul desktop la manopola resta, perché lì non c'è mai stata. */
const scalaSottoIlDito = () => gestoAMano ? GESTO_SCALA : 1;
let gestoScala = 1, ripresaGesto = 0, prOra = 0, msRisoluzione = 0;
/* alzata da `gira()` per la durata del gesto: finché è vera, la
   risoluzione non si tocca. Il valore nuovo lo prende il primo
   fotogramma a riposo, che ripassa comunque di qui. */
let bloccaRisoluzione = false;
const _tela = new THREE.Vector2();
function risoluzione(forza){
  if(bloccaRisoluzione && !forza) return false;
  const v = Math.min(devicePixelRatio, SCALE()[gradino] * gestoScala);
  if(!forza && Math.abs(v - prOra) < 0.002) return false;
  const t0 = performance.now();
  prOra = v;
  rend.setPixelRatio(v);
  /* e il composer NON si regola con lo stesso numero: `setPixelRatio` lì
     moltiplica la misura in punti CSS, e 390 per 1,05 fa 409,5 — un
     bersaglio con la virgola, che WebGL tronca a modo suo e che non
     combacia con la tela. Si prende invece la misura VERA della tela,
     già intera, e gliela si consegna. Così ogni passata scrive
     esattamente i pixel che poi finiscono sullo schermo. */
  rend.getDrawingBufferSize(_tela);
  passe.setPixelRatio(1);
  passe.setSize(_tela.x, _tela.y);
  msRisoluzione += performance.now() - t0;
  return true;
}
TOCCO_GROSSO.addEventListener("change", e => {
  telefono = e.matches; gradino = 0; risoluzione();
  /* e la scelta di serie sull'occlusione va rifatta: era stata presa
     quando il puntatore diceva un'altra cosa. Una decisione già presa
     dal cronometro o dalla sessione resta, perché quella è misurata. */
  politicaAO();
});
risoluzione();

/* ── L'OCCLUSIONE: SPENTA DOVE SI TOCCA, E LA MISURA PUÒ RIACCENDERLA
   È una passata in più su ogni fotogramma — anzi cinque, contate — e su
   un telefono di tre anni fa può costare più di tutto il resto messo
   insieme. Prima si accendeva sempre e si spegneva sola se il disegno
   andava oltre i 30 millisecondi: una via sola, e i primi ventiquattro
   fotogrammi — quelli dell'ingresso, quelli che si ricordano — li pagava
   comunque. Adesso: dove si tocca parte SPENTA, e se la misura dice che
   c'è margine largo (sotto i 12 ms, cioè meno di tre quarti del budget
   di un fotogramma) si accende. Se accendendola si sfonda, si spegne e
   non si riprova più: un interruttore che va avanti e indietro è peggio
   di tutti e due i suoi stati.
   E la decisione RESTA per la sessione: chi apre un pezzo, torna al banco
   ed entra in un'altra famiglia non deve ricominciare a cronometrare, e
   soprattutto non deve ritrovarsi l'ombra che va e viene. */
/* ── E IL MONITOR PUÒ DISFARE SOLO CIO' CHE HA FATTO LUI ──────
   Prima versione, provata e buttata: «se la mediana sta sotto i 12 ms,
   riaccendila». Su uno schermo a 120 Hz un fotogramma dura 8,3 ms e la
   regola scattava SEMPRE — non perché ci fosse margine, ma perché
   più veloce del pannello non si va. Da un orologio agganciato al
   ritracciamento il margine non si legge: si legge solo se si sta
   MANCANDO la cadenza.
   Quindi le due vie sono: il monitor toglie quando la cadenza si perde,
   e rimette solo quello che ha tolto lui. Lo spegnimento di SERIE dove
   si tocca non è una misura, è una scelta — e una misura che non sa
   provare il contrario non la ribalta. */
const CHIAVE_AO = "regina.occlusione";
let aoDetto = null;
try { aoDetto = sessionStorage.getItem(CHIAVE_AO); } catch(_) {}
/* `aoAccesa` è la VERITA', `ao.enabled` solo il suo riflesso: i due
   cambi di livello — al pezzo e al ritorno al banco — riaccendono la
   passata e devono chiedere a lei, se no una decisione presa dal
   cronometro dura fino al primo «indietro». */
let aoAccesa = aoDetto !== null ? aoDetto === "1" : !telefono;
/* `aoTolta`: l'ha spenta il monitor, e quindi può rimetterla.
   `aoFlop`: l'aveva già rimessa una volta e si è ripreso lo scatto —
   da qui in poi resta spenta, perché un interruttore che va avanti e
   indietro si vede più di tutti e due i suoi stati. Una decisione che
   arriva dalla sessione è già stata presa: non si rilitiga. */
let aoTolta = false, aoFlop = aoDetto === "0";
ao.enabled = aoAccesa;
/* la SCELTA DI SERIE, che non è una misura e quindi non si scrive nella
   sessione: dove si tocca, spenta. Si rifa' se il puntatore cambia
   natura — un tablet a cui si attacca un mouse, o un banco di prova che
   accende l'emulazione dopo l'avvio — e si tira indietro appena una
   misura ha deciso qualcosa, perché una misura batte una politica.
   PROVATO E CORRETTO QUI: scritta come `decidiAO`, questa riga finiva
   nella sessione. Un solo istante in cui l'emulazione del telefono si
   staccava bastava a scrivere «accesa», e da lì in poi l'occlusione
   restava accesa su tutte le famiglie successive — misurato: rampa e
   orologi con l'ombra, le prime tre senza. */
function politicaAO(){
  if(aoDetto !== null || aoTolta || aoFlop) return;
  const vuole = !telefono;
  if(aoAccesa === vuole) return;
  aoAccesa = vuole; ao.enabled = vuole;
}
function decidiAO(acceso, perche, delMonitor){
  if(aoAccesa === acceso) return;
  aoAccesa = acceso; ao.enabled = acceso;
  if(delMonitor){ if(acceso) aoTolta = false; else { if(aoTolta) aoFlop = true; aoTolta = true; } }
  try { sessionStorage.setItem(CHIAVE_AO, acceso ? "1" : "0"); } catch(_) {}
  console.log("occlusione " + (acceso ? "accesa" : "spenta") + ": " + perche);
}

/* ── IL CRONOMETRO DEI PRIMI VENTIQUATTRO: UNA SOLA VIA ────────────
   Misura quanto ci mette `passe.render()` a TORNARE, che non è quanto ci
   mette la scheda a disegnare: una chiamata a WebGL mette i comandi in
   coda e torna subito. Quindi come giudice è un bugiardo generoso —
   provato: su questa macchina, fingendosi telefono, diceva meno di 12 ms
   e avrebbe riacceso l'occlusione qualunque cosa fosse successa dopo.
   Resta come rete di sicurezza in UNA sola direzione: se perfino questa
   misura sfonda i 30 millisecondi, la macchina è così in ginocchio che
   non c'è niente da discutere e l'occlusione si spegne subito, in mezzo
   secondo di applicazione. A riaccenderla, se c'è margine, pensa
   `monitor`, che il tempo lo misura fra un fotogramma e l'altro. */
/* ══════════════════════════════════════════════════════════════
   LA SFOCATURA SI STACCA MENTRE CI SI MUOVE

   Ai livelli 0 e 1, un fotogramma con la catena intera costa (misurato
   col banco _M_, iPhone finto, 390x844 a 1,5 punti per pixel): QUATTRO
   passate — la scena a colori, la scena UN'ALTRA VOLTA in profondita' per
   la sfocatura, il quadro della sfocatura, il quadro di uscita — 2,96
   megapixel scritti e 795.130 triangoli attraversati al livello 1, più
   due mappe d'ombra. La sfocatura da sola vale la metà di tutto questo,
   e non è una passata qualunque: la sua seconda scena è geometria vera,
   e il suo quadro fa quarantuno prelievi per pixel a tutto schermo.
   Tutto questo per il FONDO. Il fondo morbido è la firma della vetrina e
   si guarda quando si guarda: mentre il dito trascina un espositore, gli
   occhi stanno sull'espositore, e un fondo che passa a sedici fotogrammi
   al secondo si vede molto più di un fondo nitido.
   Quindi dove si tocca, ai livelli 0 e 1 e SOLO mentre qualcosa si muove,
   la passata della sfocatura esce dalla catena. Restano la scena, una
   volta sola, e il quadro di uscita. A riposo — un quarto di secondo
   senza moto — rientra, e la lente si riapre in ventidue centesimi (vedi
   `profondita`). Al livello 2 non esce MAI: lì la scena è piccola —
   misurate 22 chiamate di disegno — e la sfocatura non è un fondale,
   è il pezzo.
   ══════════════════════════════════════════════════════════════ */
let postDiretto = false;
let provini = [], aoChiuso = false;
function dipingi(){
  const t0 = aoChiuso ? 0 : performance.now();
  /* SI STACCA LA PASSATA, NON LA CATENA — e questa è una correzione
     pagata sul banco. La prima stesura disegnava DIRETTO, con
     `rend.render(scena, camera)`, contando sul fatto che `toneMapping` e
     `outputColorSpace` stanno sul disegnatore e quindi il quadro non
     sarebbe cambiato. MISURATO: cambia, e di molto. Stessa scena, stesso
     istante, livello 1 a riposo — luminanza media del fondo 57,8 in
     diretta contro 48,7 con la catena a lente chiusa: il diciannove per
     cento più chiaro. E non è la sfocatura (a lente chiusa la catena
     da' 48,7 e a lente aperta 49,1: mezzo punto), è il passaggio dentro
     i bersagli della catena. Un quadro che schiarisce del diciannove per
     cento all'inizio di ogni swipe è un LAMPO, cioè molto peggio di un
     fondo nitido.
     Quindi la catena resta e se ne toglie il pezzo caro: la sfocatura,
     che è due terzi del costo — una seconda intera passata della scena
     per la profondita' più un quadro a tutto schermo con quarantuno
     prelievi per pixel. Restano la scena, una volta, e il quadro di
     uscita, che è un prelievo per pixel. Il colore è lo STESSO byte per
     byte, perché è la stessa strada. */
  const vuoiSfoca = !postDiretto;
  if(sfoca.enabled !== vuoiSfoca) sfoca.enabled = vuoiSfoca;
  passe.render();
  /* le carte si riproiettano DOPO il disegno, quando la macchina è dove
     dice di essere: proiettate prima restano indietro di un fotogramma e
     sull'oscillazione della molla si vede che scivolano */
  seguiCarte();
  if(aoChiuso) return;
  provini.push(performance.now() - t0);
  if(provini.length < 24) return;
  const ordinati = provini.slice().sort((a, b) => a - b);
  const mediana = ordinati[12];
  provini = []; aoChiuso = true;
  if(aoAccesa && mediana > 30)
    decidiAO(false, "il disegno costava " + mediana.toFixed(1) + " ms", true);
}

/* ══════════════════════════════════════════════════════════════
   IL MONITOR DEI FOTOGRAMMI — e perché non mente

   Non cronometra il disegno (una chiamata a WebGL torna prima che la
   scheda abbia finito): guarda QUANTO TEMPO PASSA fra un fotogramma e il
   successivo, che è esattamente quello che il dito sente. Mediana su
   sessanta, cioè un secondo di gesto: la media la sposta un fotogramma
   solo, la mediana no.
   Scende di un gradino se la mediana supera i 20 ms (cinquanta al
   secondo: sotto, il trascinamento comincia a «tirare»), risale se sta
   sotto i 12 per tre secondi di fila. Fra un cambio e l'altro passano
   almeno due secondi. Le tre soglie sono la distanza che impedisce il
   batti-e-ribatti: un sistema che scende e risale ogni mezzo secondo si
   vede più di quello che correggerebbe.
   E IN HEADLESS NON SI DEGRADA MAI. Lì il disegno lo fa SwiftShader, in
   software, e un fotogramma costa quello che non costerebbe su nessun
   telefono al mondo: degradare su quella misura vorrebbe dire collaudare
   un'applicazione diversa da quella che va sul telefono. */
const DURATE = new Array(60).fill(0);
let nDurate = 0, pDurate = 0, msMediana = 0, ultimoGradino = 0, bassoDa = 0;
/* lo SCARTO fra il primo e il terzo quarto delle sessanta durate, e il
   lavoro di JS dentro il fotogramma: servono al riconoscimento del tetto,
   qui sotto. Si affacciano anche in `__resa` e nel riquadro di diagnosi,
   perché da una registrazione dello schermo del cliente questi due
   numeri dicono se il telefono è lento o se è in risparmio energetico. */
let msScarto = 0, msLavoro = 0, tetto30 = false;
const LAVORI = new Array(60).fill(0);
let softGL = null;
function daSoftware(){
  if(softGL !== null) return softGL;
  softGL = false;
  /* due nomi, non uno: Chrome può mascherare `UNMASKED_RENDERER_WEBGL`
     per non far riconoscere la macchina, e allora il nome vero resta solo
     in `RENDERER`. Basta che uno dei due dica «software». */
  try {
    const gl = rend.getContext();
    const e = gl.getExtension("WEBGL_debug_renderer_info");
    const n = (e ? String(gl.getParameter(e.UNMASKED_RENDERER_WEBGL)) : "")
            + " " + String(gl.getParameter(gl.RENDERER))
            + " " + String(gl.getParameter(gl.VENDOR));
    softGL = /swiftshader|llvmpipe|software|basic render|microsoft basic/i.test(n);
    window.__gpu = n.trim();
  } catch(_) {}
  return softGL;
}
function monitor(ora, grezzo, lavoro){
  /* un ciclo che riparte dopo essere stato fermo non è un fotogramma
     lento: è un fotogramma che non c'era */
  if(grezzo <= 0 || grezzo > 100) return;
  /* ── E NON SI MISURA MENTRE SI STA BARANDO ────────────────────
     Sotto il dito la tela si disegna a metà dei pixel: è un trucco, e
     un trucco non può essere anche la prova che tutto va bene. Misurato
     lì, il monitor avrebbe visto fotogrammi facili e avrebbe RIACCESO
     l'occlusione in mezzo a uno swipe — cioè esattamente nel momento in
     cui il cliente dice che non è fluido. Si misura a piena
     risoluzione, e il momento giusto è subito dopo il rilascio, con le
     molle che ancora corrono. */
  if(gestoScala < 1){ bassoDa = 0; return; }
  DURATE[pDurate] = grezzo; LAVORI[pDurate] = lavoro || 0;
  pDurate = (pDurate + 1) % 60;
  if(nDurate < 60){ nDurate++; return; }
  const ord = DURATE.slice().sort((a, b) => a - b);
  msMediana = (ord[29] + ord[30]) / 2;
  msScarto = +(ord[44] - ord[15]).toFixed(2);
  const ordL = LAVORI.slice().sort((a, b) => a - b);
  msLavoro = +((ordL[29] + ordL[30]) / 2).toFixed(2);
  /* ── IL RISPARMIO ENERGETICO NON È LENTEZZA ───────────────────
     Su iOS, con la batteria bassa, il sistema limita `requestAnimationFrame`
     a trenta al secondo: la mediana si pianta a 33,3 ms e ci RESTA. Per il
     monitor di prima quello era «oltre i 20 ms», cioè una macchina in
     ginocchio: toglieva l'ombra, poi i pixel, poi ancora, e non finiva
     mai — degradando un'applicazione che stava disegnando benissimo,
     solo meno spesso. È esattamente il caso del cliente: registrazione
     fatta con la batteria al dieci per cento.
     I due casi si distinguono, e non serve indovinare: un TETTO è
     REGOLARE. Se il sistema decide la cadenza, i fotogrammi arrivano
     tutti alla stessa distanza — lo scarto fra il primo e il terzo quarto
     delle sessanta durate sta sotto i tre millesimi — e la distanza è un
     multiplo pulito del ritracciamento (33,3 ms, o 16,7 se il tetto è 60
     su un pannello a 120). Una macchina che non ce la fa arriva SLABBRATA:
     un fotogramma da 24, uno da 51, uno da 30. Misurato sul cliente: fra 4
     e 25 fotogrammi al secondo, cioè scarto enorme — lì il monitor deve
     degradare. Fermo a 30 pulito, no.
     E dal tetto non si legge nemmeno il MARGINE: la stessa ragione per cui
     non si risale a 120 Hz. Quindi sotto un tetto il monitor tace, in
     tutte e due le direzioni. */
  tetto30 = msScarto <= 3.0 && Math.abs(msMediana - 33.34) <= 2.0;
  if(tetto30){ bassoDa = 0; return; }
  /* ── UN OROLOGIO TROPPO VELOCE NON È UNO SCHERMO ─────────────
     Sotto i 6 millisecondi — più di 166 fotogrammi al secondo — non c'è
     nessun pannello al mondo: c'è un `requestAnimationFrame` che non è
     agganciato al ritracciamento, che è quello che succede in headless.
     Misurato: al primo caricamento il banco correva così, e il monitor
     dedusse che c'era margine e riaccese l'occlusione — una decisione
     presa su un orologio che nel telefono del cliente non esiste.
     A 60 come a 120 Hz (8,3 ms) la misura resta buona. */
  if(daSoftware() || msMediana < 6 || ora - ultimoGradino < 2000) return;
  const sc = SCALE();
  /* ── L'ORDINE IN CUI SI RINUNCIA ───────────────────────────────
     Scendendo si toglie PRIMA l'occlusione: da sola vale cinque passate
     su nove e la metà esatta dei pixel, e quello che porta via — il
     grigio in fondo a una fessura — non si guarda mentre il dito si
     muove. Solo dopo si tolgono punti per pixel, che invece si vedono
     sui contorni del gioiello. Risalendo si fa il contrario: prima
     tornano i pixel, poi l'ombra. */
  if(msMediana > 20){
    bassoDa = 0;
    if(aoAccesa){
      ultimoGradino = ora;
      decidiAO(false, msMediana.toFixed(1) + " ms per fotogramma", true);
    } else if(gradino < sc.length - 1){
      gradino++; ultimoGradino = ora;
      if(risoluzione()) console.log("meno pixel: " + msMediana.toFixed(1) +
        " ms per fotogramma, punti per pixel " + sc[gradino]);
    }
    return;
  }
  if(msMediana < 12){
    if(!bassoDa){ bassoDa = ora; return; }
    if(ora - bassoDa < 3000) return;
    bassoDa = 0;
    if(gradino > 0){
      gradino--; ultimoGradino = ora;
      if(risoluzione()) console.log("piu' pixel: " + msMediana.toFixed(1) +
        " ms per fotogramma, punti per pixel " + sc[gradino]);
    } else if(!aoAccesa && aoTolta && !aoFlop){
      /* solo quello che ha tolto lui: se l'occlusione è spenta perché
         qui si tocca, questa riga non la accende */
      ultimoGradino = ora;
      decidiAO(true, msMediana.toFixed(1) + " ms per fotogramma, la cadenza regge",
               true);
    }
  } else bassoDa = 0;
}
/* il monitor si legge da fuori: è il numero che dice se una taratura ha
   funzionato, e il banco lo interroga senza doverlo dedurre da uno
   scatto. `__fps` è quello chiesto; `__resa` è il dietro. */
Object.defineProperty(window, "__fps", {configurable:true,
  get: () => msMediana ? Math.round(1000 / msMediana) : 0});
/* ── E LE DUE MANOPOLE SI GIRANO DA FUORI ─────────────────────────
   Stessa forma di `window.__moto` e `window.__sugg`: sono decisioni che
   si provano guardando, non leggendo. `__gesto` è quanto si rimpicciolisce
   la tela sotto il dito (1 = niente); `__occlusione` forza l'ombra negli
   angoli, e forzarla a mano vale come una misura — da lì in poi la
   politica del dispositivo non la ribalta più. */
Object.defineProperty(window, "__gesto", {configurable:true,
  get: () => GESTO_SCALA,
  set: v => { v = Math.max(0.4, Math.min(1, +v || 1));
              GESTO_SCALA = v; gestoAMano = v < 1;
              if(gestoScala < 1) gestoScala = v;
              risoluzione(); sveglia(); }});
Object.defineProperty(window, "__occlusione", {configurable:true,
  get: () => aoAccesa,
  set: v => { aoDetto = v ? "1" : "0"; aoFlop = true; aoTolta = false;
              decidiAO(!!v, "chiesta a mano"); sveglia(); }});
Object.defineProperty(window, "__resa", {configurable:true,
  get: () => ({ms: +msMediana.toFixed(2), fps: window.__fps, gradino,
    tetto: SCALE()[gradino], dpr: +prOra.toFixed(3), gesto: gestoScala,
    telefono, ao: ao.enabled, aoAccesa, aoDetto, aoTolta, aoFlop,
    software: daSoftware(),
    scarto: msScarto, lavoro: msLavoro, tetto30,
    diretto: postDiretto, ombreAuto: rend.shadowMap.autoUpdate,
    ombraLato: sole.shadow.mapSize.x,
    draw: rend.info.render.calls, tri: rend.info.render.triangles,
    msRisoluzione: +msRisoluzione.toFixed(2)})});

/* ══════════════════════════════════════════════════════════════
   IL RIQUADRO DI DIAGNOSI — `?diag=1`

   Il telefono del cliente non si collega a nessun banco di prova: l'unica
   misura che torna indietro è una REGISTRAZIONE DELLO SCHERMO. Allora i
   numeri devono stare sullo schermo. Monospaziato a 11 punti, fondo scuro
   al 70 per cento e — questo è il punto — NESSUN filtro di fondo: un
   riquadro che sfoca quello che sta sotto falserebbe proprio la misura
   che sta mostrando.
   Si scrive una volta per fotogramma e solo se qualcosa è cambiato, così
   la diagnosi non è anche il difetto.
   ══════════════════════════════════════════════════════════════ */
let scriviDiagnosi = () => {};
if(DIAG){
  const d = document.createElement("div");
  d.id = "diag";
  d.setAttribute("aria-hidden", "true");
  d.style.cssText = "position:fixed;left:6px;top:6px;z-index:99;" +
    "pointer-events:none;white-space:pre;padding:5px 7px;border-radius:5px;" +
    "background:rgba(0,0,0,.70);color:#9FE8C0;" +
    "font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;" +
    "letter-spacing:.01em";
  (document.body || document.documentElement).appendChild(d);
  let ultimo = "";
  scriviDiagnosi = () => {
    const i = rend.info.render;
    const t = "fps " + (window.__fps || 0) + "  " + msMediana.toFixed(1) + " ms" +
      (tetto30 ? " (tetto)" : "") +
      "\nlavoro " + msLavoro.toFixed(1) + " ms · scarto " + msScarto.toFixed(1) +
      "\ndpr " + prOra.toFixed(2) + " · " + (telefono ? "touch" : "desktop") +
      (RESA_DETTA ? "*" : "") +
      "\ndof " + (postDiretto ? "OFF" : "ON") + " " + sfocaT.toFixed(2) +
      " · ombre " + (rend.shadowMap.enabled
        ? (rend.shadowMap.autoUpdate ? "auto" : "cache") + " " + sole.shadow.mapSize.x
        : "off") +
      "\nversione " + VERSIONE +
      "\ndraw " + i.calls + " · tri " + i.triangles +
      "\nlivello " + livello + (attiva ? " · " + attiva : "");
    if(t !== ultimo){ ultimo = t; d.textContent = t; }
  };
}
window.__cam = camera; window.__scena = scena; window.__THREE = THREE;
/* IL DISEGNATORE E LA CATENA DELLE PASSATE si affacciano qui perché il
   costo di un fotogramma non si indovina: `rend.info.render` dice quante
   chiamate di disegno e quanti triangoli, e avvolgendo `rend.render` si
   vede passata per passata — la scena è disegnata DUE volte, colore e
   profondita' per la sfocatura, e l'occlusione ne aggiunge altre tre a
   tutto schermo. Senza queste due prese la tabella si scrive a memoria. */
/* e il banco deve poter mettere a confronto i DUE fotogrammi — quello
   diretto e quello con la catena — sulla stessa scena e nello stesso
   istante: è l'unico modo di misurare quanto SALTA il quadro quando la
   sfocatura rientra, e quindi se quel rientro ha bisogno di una
   dissolvenza o se può essere un cambio secco. */
window.__diretto = v => { postDiretto = !!v; dipingi(); return postDiretto; };
window.__rend = rend; window.__passe = passe;
window.__sfoca = sfoca; window.__dipingi = () => dipingi();
window.__ao = ao; window.__ombraBanco = ombraBanco; window.__giro = giro;

/* ── la materia ────────────────────────────────────────────── */
function ripeti(t,n){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(n,n); t.anisotropy=8; return t; }
/* LA GRANA E LA RUVIDEZZA ARRIVANO CON LA PRIMA FAMIGLIA, non prima:
   `granaPer` CLONA queste due per ogni mesh, e un clone fatto su una
   texture ancora vuota resterebbe vuoto per sempre. Qui si preparano, e
   `caricaTutto` le riempie PRIMA di dare il primo modello al
   caricatore. */
const grana = ripeti(new THREE.Texture(VUOTA),5), ruv = ripeti(new THREE.Texture(VUOTA),5);
grana.flipY = ruv.flipY = false;      // il giro lo fa la bitmap all'ingresso

/* ── IL MARCHIO SUL PLINTO ARRIVA DA FUORI, NON DA DENTRO ────
   Il turchese del plinto e il marchio dorato sono una texture cotta in
   Blender, e viaggiavano DENTRO il modello. Il caricatore, per le immagini
   che stanno dentro un .glb, non le legge dai byte: ne fa un indirizzo
   `blob:` e le richiede come se fossero su un server. Una pagina ospitata
   può avere il permesso di chiedere solo a certi indirizzi, e `blob:` non
   è fra quelli: l'immagine non arriva, il materiale resta il suo bianco di
   partenza, e le basi escono BIANCHE. Senza un errore che lo dica.
   In locale non si vedeva, perché in locale quel permesso non c'è.
   Quindi la si porta dentro la pagina come tutto il resto, e il modello
   quella che ha dentro se la tiene per se'. */
const MARCHI = {busto:"REGINA_busto_plinto.webp",
                orecchini:"REGINA_orecchini_plinto.webp",
                anelli:"REGINA_anelli_plinto.webp",
                rampa:"REGINA_rampa_plinto.webp",
                orologi:"REGINA_orologi_plinto.webp"};
/* i quadranti degli orologi: la stampa col marchio arriva da qui, come il
   marchio del plinto, e per la stessa ragione — dentro il modello non
   passerebbe. Uno per colore, perché sul Regina la stampa è tono su tono
   e cambia con la cassa. */
const QUADRANTI = {quadrante0:"REGINA_orologi_quadrante0.webp",
                   quadrante1:"REGINA_orologi_quadrante1.webp",
                   quadrante2:"REGINA_orologi_quadrante2.webp"};
const marchi = {};
function marchioDi(id, dove){
  if(marchi[id]) return marchi[id];
  // le UV dei modelli sono quelle del glTF, che ha l'origine in alto: una
  // texture caricata a parte arriva capovolta e il marchio finisce a testa
  // in giu' sul fondo del plinto — perciò `giro:false`, che è il
  // vecchio flipY = false detto al momento giusto, cioè sulla bitmap
  const t = tessuto(dove || MARCHI[id], {spazio: THREE.SRGBColorSpace, giro: false});
  t.anisotropy = 4;
  marchi[id] = t;
  return t;
}

/* ── LA GRANA HA LA STESSA MISURA SU OGNI PEZZO ──────────────
   Una cella di similpelle è larga un millimetro, e deve restarlo dovunque:
   sul fusto di una colonnina, sul fianco del plinto, sul collo del busto.
   Il guaio è che ogni pezzo si porta dietro le SUE coordinate di texture,
   e non sono alla stessa scala: i corpi hanno una proiezione a cubo in
   misura di mondo, il plinto tiene le sue perché sopra ci è cotto il
   marchio, il busto quelle della scansione. Ripetuta cinque volte per tutti,
   la stessa immagine usciva a tre grandezze diverse — e accostati si vede
   subito quale pezzo è «di un altro materiale».
   Non si indovina il numero: si MISURA. Per ogni mesh si confronta l'area
   in coordinate di texture con l'area vera in metri; la radice del rapporto
   dice quante unita' di texture ci stanno in un metro, e da lì la
   ripetizione che fa la cella da un millimetro esce da sola. */
const CELLA = 0.018;          // il lato del riquadro di grana, in metri
function unitaPerMetro(geo){
  const pos = geo.getAttribute("position"), uv = geo.getAttribute("uv");
  if(!pos || !uv) return 0;
  const ind = geo.getIndex();
  const quanti = ind ? ind.count : pos.count;
  /* SI GUARDANO TUTTI I TRIANGOLI, e si scartano quelli senza area in
     coordinate di texture. MISURATO sulla rampa: 1.608 triangoli su 3.248
     hanno le UV schiacciate a zero — sono le costole della solidificazione,
     superficie vera che nella texture non occupa niente. Contandoli si
     gonfia l'area di mondo senza gonfiare quella di texture, e il rapporto
     esce cinque volte sbagliato: la ripetizione veniva 52,7 invece di 10,6
     e la grana spariva sotto il pixel. Campionarne uno ogni sedici era
     anche peggio, perché i degeneri stanno in blocchi contigui e il
     campione ci finiva dentro tutto. */
  let areaUV = 0, areaXYZ = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for(let i = 0; i + 2 < quanti; i += 3){
    const i0 = ind ? ind.getX(i) : i, i1 = ind ? ind.getX(i+1) : i+1,
          i2 = ind ? ind.getX(i+2) : i+2;
    const u0 = uv.getX(i0), v0 = uv.getY(i0);
    const au = Math.abs((uv.getX(i1)-u0) * (uv.getY(i2)-v0)
                      - (uv.getX(i2)-u0) * (uv.getY(i1)-v0)) * 0.5;
    if(au < 1e-9) continue;
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1);
    c.fromBufferAttribute(pos, i2);
    b.sub(a); c.sub(a);
    areaXYZ += b.cross(c).length() * 0.5;
    areaUV += au;
  }
  return areaXYZ > 1e-12 ? Math.sqrt(areaUV / areaXYZ) : 0;
}
function granaPer(geo, scala){
  /* si DIVIDE per la scala, non si moltiplica: l'area si misura sulle
     coordinate locali, e nel mondo è scala al quadrato — quindi le unita'
     di texture per metro vero sono quelle locali divise per la scala. */
  const u = unitaPerMetro(geo) / (scala || 1);
  if(!u) return [grana, ruv];
  const r = 1 / (u * CELLA);
  const n = grana.clone(), v = ruv.clone();
  n.repeat.set(r, r); v.repeat.set(r, r);
  n.needsUpdate = v.needsUpdate = true;
  return [n, v];
}
// IL BIANCO DI SERIE. Il turchese resta sul plinto, dove sta il marchio ed
// è lì che il colore firma; il corpo bianco fa sparire l'espositore dietro
// la merce, che è il suo mestiere.
// IL BIANCO RESTA IL BIANCO. L'avevo abbassato a #E9E3DA per fare spazio
// al lampo, e il fusto usciva beige — che non è il bianco lockato. Era
// una correzione inutile: rimesso il bianco, col taglio caldo stretto e
// l'ambiente sceso, il modellato misura 0,30 contro lo 0,28 del
// riferimento, cioè MEGLIO del beige (0,33). Il contrasto lo faceva la
// luce, non l'albedo; avevo cambiato due cose insieme e attribuito il
// merito a quella sbagliata.
/* LE QUATTRO VESTI. Il bianco è quella di serie — non bianco puro: una
   similpelle bianca assoluta non esiste, e in render legge come carta.
   Il turchese resta comunque sul plinto, dove sta il marchio: è lì che il
   colore firma, e non cambia mai. */
const VESTI = [
  /* IL VELLUTO È LA FODERA DEL COFANETTO, ed è la veste di serie: gli
     espositori qui non sono mobili da negozio, sono le IMBOTTITURE
     dell'astuccio — il cuscino del collo, il rullo degli anelli, il nastro
     degli orecchini. In un astuccio sono tutti dello stesso velluto. */
  {id:"velluto",  nome:"Velluto",  corpo:0x241F19},
  {id:"bianco",   nome:"Bianco",   corpo:0xF2F0EC},
  {id:"avorio",   nome:"Avorio",   corpo:0xD8CEBE},
  {id:"turchese", nome:"Turchese", corpo:0x106068},
  /* VIA IL NOTTE. Era il quarto colore quando la fodera era un marrone da
     vetrina; adesso che di serie c'è il VELLUTO — lo stesso nero, ma caldo
     — sono due modi di dire la stessa cosa, e cinque pastiglie non stanno
     accanto al testo del gesto su uno schermo da 390. */
];
/* la scelta si RICORDA. Un cliente che prova il notte e torna al banco deve
   ritrovarlo, e Stefano deve poter sapere quale veste prova la gente. */
let vesteScelta = "velluto";
try { const v = localStorage.getItem("regina.veste");
      if(v && VESTI.some(x => x.id === v)) vesteScelta = v; } catch(_) {}
if(q.get("veste") && VESTI.some(x => x.id === q.get("veste"))) vesteScelta = q.get("veste");
function vesteDi(id){ return VESTI.find(v => v.id === id) || VESTI[0]; }
let veste = "#" + vesteDi(vesteScelta).corpo.toString(16).padStart(6, "0");

/* ── i quattro espositori, in fila e IN SCALA VERA ──────────── */
const gruppi = {}, corpi = {};
/* il caricatore nasce in `caricaTutto()`, insieme al suo decoder */
let caricatore = null;
let posX = 0;

function metti(f, g){
  const gr = g.scene;
  gr.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const m = o.material; if(!m) return;
    if(QUADRANTI[m.name]){
      /* IL QUADRANTE NON È SIMILPELLE. Passato per lo stesso ramo del
         corpo si portava dietro la grana e il velo: un quadrante con la
         buccia di un espositore. È una superficie stampata sotto un
         vetro — liscia, appena satinata, senza rilievo. */
      const v = new THREE.MeshPhysicalMaterial({
        color: 0xE8E8E6, metalness: 0, roughness: 0.44,
        map: marchioDi(m.name, QUADRANTI[m.name]),
      });
      v.name = m.name;
      o.material = v;
      return;
    }
    if(m.name === "corpo" || m.name === "plinto"){
      // SIMILPELLE, NON PLASTICA. Il riferimento vero è opaco e vellutato:
      // le colonnine non hanno una riga speculare lungo il fianco, hanno un
      // passaggio largo e morbido, e i BORDI sono più chiari del centro.
      // Quel bordo chiaro è il VELO — la retroriflessione dei tessuti sugli
      // angoli radenti — e senza di esso qualunque materiale opaco legge
      // come polipropilene. Il MeshStandard non ce l'ha: serve il Physical.
      const v = new THREE.MeshPhysicalMaterial({
        color: m.name === "plinto" ? 0xffffff : new THREE.Color(veste),
        metalness: 0, roughness: 0.64,
        map: m.name === "plinto" ? marchioDi(f.id) : (m.map || null),
        sheen: 0.55, sheenRoughness: 0.62,
        // IL VELO NON È BIANCO. Bianco e stretto fa raso; per la similpelle
        // va tinto come il corpo, appena schiarito, e largo.
        sheenColor: new THREE.Color(m.name === "plinto" ? 0xD8E8E8 : veste)
          .lerp(new THREE.Color(0xffffff), 0.42),
      });
      v.name = m.name;
      // la scala del pezzo conta: la mesh è in coordinate locali e il
      // contenitore non è scalato, ma il busto della scansione si'
      o.updateWorldMatrix(true, false);
      const sc = new THREE.Vector3(); o.getWorldScale(sc);
      const [n, ruvidezza] = granaPer(o.geometry, (sc.x + sc.y + sc.z) / 3);
      v.normalMap = n; v.roughnessMap = ruvidezza;
      if(q.get("grana")) console.log("GRANA", f.id, m.name, o.name,
        "ripetizione", n.repeat.x.toFixed(2));
      v.normalScale.set(0.50, 0.50);
      o.material = v;
      if(m.name !== "plinto") (corpi[f.id] ||= []).push(v);
    }
  });
  /* LA MERCE SI RACCOGLIE PER NOME. Il costruttore in Blender unisce i
     gioielli pezzo per pezzo e li chiama «pezzo00», «pezzo01»... — metallo e
     pietra insieme, le due orecchine di una coppia insieme. È quell'unico
     nome a rendere possibile toccarne uno, isolarlo e portarselo davanti. */
  const trovati = [];
  gr.traverse(o => { if(/^pezzo\d\d/.test(o.name)) trovati.push(o); });
  trovati.sort((a, b) => a.name.localeCompare(b.name));
  gr.traverse(o => { if(/^posa\d\d/.test(o.name)) o.visible = false; });

  /* LA POSA STA FUORI DALLA MISURA. Dentro al modello, accanto al pezzo
     indossato, c'è anche la sua POSA STESA — la collana distesa sul
     plinto, che si vede solo entrando nel pezzo. È larga quasi due volte
     il plinto: contandola, l'espositore risulterebbe più profondo di
     quello che è e il passo fra le famiglie sul banco si allargherebbe
     per un oggetto che al banco non si vede nemmeno. */
  gr.updateMatrixWorld(true);
  const b = new THREE.Box3();
  gr.traverse(o => { if(o.isMesh && !/^posa\d\d/.test(o.name)) b.expandByObject(o); });
  const d = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  gr.position.y -= b.min.y;
  gr.position.x -= c.x;
  gr.position.z -= c.z;
  const contenitore = new THREE.Group();
  contenitore.add(gr);
  contenitore.userData = {f, largo:d.x, alto:d.y, fondo:d.z, pezzi:trovati};
  scena.add(contenitore);
  gruppi[f.id] = contenitore;
  (window.__gruppi ||= {})[f.id] = contenitore;
  return d;
}

/* CARICAMODELLO NON C'E' PIÙ. Faceva due mestieri — leggere un file
   e decodificare i byte scritti dentro la pagina — e adesso li fa
   `scarica` per tutti gli asset, contando i byte mentre entrano; al
   caricatore arriva sempre e solo un ArrayBuffer, che è l'unica cosa
   che non ha bisogno di un permesso di rete.
   QUEL CHE SEGUE È IL VECCHIO COMMENTO, e vale ancora: */
/* IL MODELLO PUÒ ARRIVARE DA UN FILE O DA DENTRO LA PAGINA.
   Quando il banco viaggia come pagina sola — quella che si apre sul
   telefono — i quattro modelli stanno dentro il file, scritti in base64.
   Li si potrebbe dare al caricatore come indirizzo `data:`, ma quello è
   comunque una RICHIESTA DI RETE, e una pagina ospitata può avere il
   permesso di chiedere solo a certi indirizzi: si aprirebbe una stanza
   vuota senza un errore che lo dica. Decodificati a mano e passati come
   byte, non c'è nessuna richiesta da fare e nessun permesso da avere. */
/* ── I BANCHI: quante copie, e dove stanno ───────────────────
   Il busto e la rampa portano UN pezzo per volta, ed è così che si
   portano davvero. Lo swipe non può scorrere dentro una fila che non
   c'è: deve far USCIRE un espositore e ENTRARE il prossimo. Servono quindi
   più espositori, e gli altri sono copie dello stesso modello — geometrie
   condivise, nessun byte in più da scaricare.
   Quello che cambia fra una copia e l'altra è il METALLO del gioiello, che
   il catalogo dichiara: una collana d'acciaio dorato e una d'argento non
   sono la stessa collana. */
const banchi = {}, merci = {}, CENTRI = {}, CASA = {};
/* LE POSE STESE, una per pezzo dove esiste. Massimo ha deciso che nella
   vista del pezzo singolo il gioiello si isola davvero; ma una collana la
   forma ce l'ha dal busto, e tolto quello restava un filo d'oro
   accartocciato a mezz'aria. Allora il modello porta DUE percorsi della
   stessa catena: quello addosso e quello steso. Qui si tiene il secondo,
   spento, accanto al primo. Le famiglie che reggono da sole — anelli,
   orecchini, orologi — non ne hanno e non ne hanno bisogno. */
const pose = {};
const stesa = (fam, k) => ((pose[fam] || [])[k]) || null;
const PASSO_BANCO = {};

/* ── QUELLO CHE È USCITO DAL COFANETTO ───────────────────────────
   «Rimuovi» era un tasto morto: apriva il retro, spiegava cosa comporta,
   e poi il tasto rosso non faceva nulla. Perché funzioni serve un posto
   dove scrivere che quel pezzo non c'è più, e il posto naturale è
   questo: i pezzi sono già elencati per FAMIGLIA e INDICE — `merci`,
   `RIPIANI`, `SCHEDA` usano tutti la stessa coppia — quindi lo stato usa
   la stessa chiave, «famiglia:indice», e non serve inventare nient'altro.
   Non si cancella niente: si mette da parte. L'annulla della striscia in
   basso ha cinque secondi per riportarlo dentro, e anche dopo il pezzo
   si rimette scansionando il suo codice, che è quello che il retro
   promette. */
const TOLTI = new Set();
const cTolto = (fam, k) => TOLTI.has(fam + ":" + k);
/* le mesh dei pezzi tolti si rispengono DOPO ogni riaccensione generale:
