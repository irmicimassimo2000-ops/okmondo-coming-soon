    if(m.__opBase === undefined){
      m.__opBase = m.opacity; m.__trBase = m.transparent; m.__dwBase = m.depthWrite;
    }
    if(!m.transparent){ m.transparent = true; m.needsUpdate = true; }
    m.depthWrite = false;
    o.renderOrder = 2;
    o.visible = true;
  }
  for(const o of velaLista) o.material.opacity = velaT;
  for(const o of velaContro) o.material.opacity = controDi(velaT);
  if(ridotto) chiudiVela();          // meno movimento: si salta, non si vela
  sveglia();
}
function chiudiVela(){
  const spento = velaVerso < 0;
  rendiMateriali(velaLista); rendiMateriali(velaContro);
  for(const o of velaLista) o.visible = !spento;
  /* la controvela è l'altra metà dello stesso gesto: quando
     l'espositore si spegne, la posa resta accesa — e viceversa */
  for(const o of velaContro) o.visible = spento;
  velaVerso = 0; velaLista = []; velaContro = [];
  /* E QUI RITORNAVA IL PEZZO TOLTO. La riga sopra riaccende ogni mesh
     che la vela stava velando, e fra quelle c'è anche la merce degli
     altri pezzi: misurato, il pezzo rimosso spariva e riappariva
     quattrocento millisecondi dopo, cioè esattamente quando la vela
     finiva la sua corsa. Tornare indietro lo spegneva di nuovo, e lo
     riaccendeva di nuovo. Lo stato si riapplica dove la visibilita'
     viene riscritta — sono due posti, e questo è il secondo. */
  applicaTolti();
}
function passoVela(dt){
  if(!velaVerso) return;
  ombraDaRifare();                 // le mesh della vela entrano ed escono
  velaT += velaVerso * dt / VELA_S;
  if(velaT <= 0 || velaT >= 1){ velaT = velaT <= 0 ? 0 : 1; chiudiVela(); return; }
  // la stessa curva con cui passa il colore delle vesti: non parte di
  // scatto e non si ferma di scatto
  const e = velaT * velaT * (3 - 2 * velaT);
  for(const o of velaLista) if(o.material) o.material.opacity = e;
  for(const o of velaContro) if(o.material) o.material.opacity = controDi(velaT);
}
/* ── LA METÀ CHE ENTRA NON ASPETTA LA METÀ CHE ESCE ───────────
   In una dissolvenza incrociata simmetrica, per metà del tempo non c'è
   un soggetto: ce ne sono due a metà opacita'. Va benissimo quando i
   due stanno nello stesso posto — il ritorno, dove la posa scivola sul
   pezzo indossato — e va male all'andata, dove il busto se ne vola via
   con la macchina mentre la posa scende: per un terzo di secondo l'occhio
   non sa più quale dei due sta guardando.
   Quindi all'ANDATA la posa diventa solida nel primo 40 per cento della
   vela (120 ms sui 300), cioè finché è ancora vicina a dov'era il
   pezzo: da lì in poi c'è un soggetto solo, e fa una strada sola. Al
   RITORNO la dissolvenza resta simmetrica, perché lì i due si
   incontrano invece di separarsi. */
function controDi(t){
  const e = t * t * (3 - 2 * t);
  return velaVerso < 0 ? Math.min(1, (1 - e) / 0.40) : 1 - e;
}

/* ── LA POSA NON APPARE ALTROVE: SI STACCA DAL PEZZO ─────────────
   Per il busto e per la rampa il pezzo cambia POSA quando lo si prende:
   la collana indossata lascia il posto alla collana stesa, che sta sul
   ripiano, mezzo schermo più in basso. Misurato: 354 punti per il
   busto, 154 per la rampa, percorsi in UN fotogramma, prima che la
   macchina si fosse mossa di un millimetro. È il salto vero del
   verdetto — il pezzo parte da un punto, ricompare in un altro, e solo
   dopo il volo lo riporta indietro.
   Provate tutte e due le strade chieste, e misurate:
   · mirare a un punto che passa con continuita' dall'una all'altra non
     toglie niente, perché a saltare non è la MIRA: è l'oggetto;
   · far ENTRARE la posa dove sta quella indossata azzera il salto (0
     punti contro 354), e in più racconta una cosa vera — il gioiello
     si stacca dal busto e si posa mentre la macchina si avvicina.
   Si sceglie la seconda. La posa parte dal centro del pezzo indossato,
   si accende con la controvela mentre l'espositore si spegne, e scivola
   a casa sua CON LA MACCHINA: la frazione di strada che ha fatto la
   molla è la stessa frazione che ha fatto lei. Un tempo suo sarebbe un
   secondo movimento, ed è esattamente quello che si sta togliendo. */
/* ── E LA STRADA SI DISEGNA SULLO SCHERMO, NON NEL MONDO ────────
   Primo tentativo, misurato: si spostava la posa nel MONDO, dal centro
   del pezzo indossato a casa sua, con la stessa frazione di strada fatta
   dalla macchina. Sulla carta è una strada sola; a schermo no. La
   macchina all'inizio corre (una molla critica fa il trenta per cento
   del cammino nei primi due decimi) e si tira dietro tutto verso l'alto,
   mentre la posa scende piano: misurata, la collana saliva da 264 a 187
   punti e poi tornava giu' a 362 — una inversione, cioè di nuovo due
   movimenti.
   Quindi la strada si scrive dove il cliente la guarda: SULLO SCHERMO.
   Due punti fissi — dov'era il pezzo indossato al tocco, e dove la posa
   si fermera' (proiettata con la macchina ARRIVATA, che si conosce già
   perché il bersaglio è chiuso) — e in mezzo una curva sola. A ogni
   fotogramma si guarda dove cadrebbe la posa a casa sua, si vede di
   quanti punti manca, e si sposta di quei punti. All'arrivo lo scarto è
   zero per costruzione, e la posa è esattamente a casa. */
let posaMobile = null, posaVia = 0;
const posaA = new THREE.Vector3(), posaS0 = new THREE.Vector2(),
      posaS1 = new THREE.Vector2(),
      _pBox = new THREE.Box3(), _pCw = new THREE.Vector3(),
      _pCp = new THREE.Vector3(), _pInv = new THREE.Matrix4(),
      _pZero = new THREE.Vector3(), _pPro = new THREE.Vector3(),
      _pDes = new THREE.Vector3(), _pAsse = new THREE.Vector3();
/* dove cade un punto del mondo, con la macchina ARRIVATA: `_camMisura`
   è già apparecchiata sul bersaglio da `riquadroSulBersaglio` */
function schermoArrivo(punto, fuori){
  _camMisura.fov = camera.fov; _camMisura.aspect = camera.aspect;
  _camMisura.near = camera.near; _camMisura.far = camera.far;
  _camMisura.up.copy(camera.up);
  _camMisura.position.copy(occhioObiettivo);
  _camMisura.lookAt(miraObiettivo);
  _camMisura.updateMatrixWorld(true);
  _camMisura.updateProjectionMatrix();
  _pPro.copy(punto).project(_camMisura);
  return fuori.set((_pPro.x * 0.5 + 0.5) * innerWidth,
                   (-_pPro.y * 0.5 + 0.5) * innerHeight);
}
function fermaPosa(){
  /* SI TORNA SEMPRE A CASA, anche al ritorno: la posa è un oggetto del
     modello, e lasciarla spostata vorrebbe dire trovarla fuori posto la
     volta dopo. Al ritorno è trasparente da un pezzo, e non si vede. */
  if(posaMobile) posaMobile.position.copy(posaA);
  posaMobile = null; posaVia = 0;
}
function avviaPosa(verso){
  fermaPosa();
  const ste = stesa(attiva, scelto), ind = (merci[attiva] || [])[scelto];
  if(!ste || !ind || ridotto) return;
  scena.updateMatrixWorld(true);
  _pBox.setFromObject(ind); if(_pBox.isEmpty()) return; _pBox.getCenter(_pCw);
  _pBox.setFromObject(ste); if(_pBox.isEmpty()) return; _pBox.getCenter(_pCp);
  posaA.copy(ste.position);          // casa sua, sul ripiano
  /* i due capi della strada, in punti di schermo. All'andata si parte da
     dove sta il pezzo indossato ADESSO e si arriva dove la posa cadra'
     con la macchina arrivata; al ritorno esattamente al contrario. */
  if(verso < 0){
    _pPro.copy(_pCw).project(camera);
    posaS0.set((_pPro.x * 0.5 + 0.5) * innerWidth,
               (-_pPro.y * 0.5 + 0.5) * innerHeight);
    schermoArrivo(_pCp, posaS1);
  } else {
    _pPro.copy(_pCp).project(camera);
    posaS0.set((_pPro.x * 0.5 + 0.5) * innerWidth,
               (-_pPro.y * 0.5 + 0.5) * innerHeight);
    schermoArrivo(_pCw, posaS1);
  }
  _pInv.copy(ste.parent.matrixWorld).invert();
  _pZero.set(0, 0, 0).applyMatrix4(_pInv);
  posaMobile = ste;
  posaVia = occhio.distanceTo(occhioObiettivo);
  passoPosa();                       // in posto subito, senza un fotogramma di scarto
  sveglia();
}
function passoPosa(){
  if(!posaMobile) return;
  ombraDaRifare();                 // la posa scivola: la sua ombra con lei
  /* la frazione di volo già fatta dalla macchina: è lei l'orologio.
     Un tempo suo sarebbe un secondo movimento, ed è quello che si sta
     togliendo. Sotto un millimetro di strada non c'è niente da
     accompagnare. */
  const q = posaVia > 0.001
    ? Math.max(0, Math.min(1, 1 - occhio.distanceTo(occhioObiettivo) / posaVia)) : 1;
  const e = q * q * (3 - 2 * q);
  const xd = posaS0.x + (posaS1.x - posaS0.x) * e;
  const yd = posaS0.y + (posaS1.y - posaS0.y) * e;
  /* dove cadrebbe se stesse già a casa, con la macchina di ADESSO */
  _pPro.copy(_pCp).project(camera);
  const sx = (_pPro.x * 0.5 + 0.5) * innerWidth;
  const sy = (-_pPro.y * 0.5 + 0.5) * innerHeight;
  /* quanti metri vale un punto di schermo sul piano del pezzo */
  const perPunto = 2 * camera.position.distanceTo(_pCp)
                 * Math.tan(camera.fov * Math.PI / 360) / innerHeight;
  _pDes.set(0, 0, 0);
  _pAsse.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
  _pDes.addScaledVector(_pAsse, (xd - sx) * perPunto);
  _pAsse.setFromMatrixColumn(camera.matrixWorld, 1).normalize();
  _pDes.addScaledVector(_pAsse, -(yd - sy) * perPunto);
  /* lo scarto si misura nel MONDO e si scrive nel PADRE: il gruppo di
     una famiglia «scambia» viene traslato dallo swipe, e sommare un
     vettore di mondo a una posizione locale sarebbe giusto per caso */
  _pDes.applyMatrix4(_pInv).sub(_pZero);
  posaMobile.position.copy(posaA).add(_pDes);
  posaMobile.updateMatrixWorld(true);
  if(q > 0.995) fermaPosa();
}

function isolaPezzo(){
  const p = merci[attiva][scelto], g = bancoDi(scelto);
  const ste = stesa(attiva, scelto);
  /* GLI ALTRI BANCHI SPARISCONO SUBITO. Sono fuori quadro — la macchina è
     già dentro la famiglia — e una dissolvenza che nessuno vede è solo
     lavoro in più su ogni fotogramma del volo. */
  for(const f of FAMIGLIE) for(const gg of (banchi[f.id] || []))
    if(gg !== g) gg.visible = false;
  g.visible = true;
  /* SI ACCENDE LA POSA, quando c'è. La collana indossata resta spenta:
     è la stessa catena, ma quella tiene la forma solo finché il busto
     c'è. Anelli e orologi non hanno posa e si accendono come sempre. */
  const tieni = ste || p;
  const vela = mesiEspositore(g, tieni);
  tieni.traverse(o => { if(o.isMesh) o.visible = true; });
  /* e la posa ENTRA mentre l'espositore esce (vedi `avviaVela`) */
  avviaVela(vela, -1, ste ? mesiDi(ste) : []);
  /* L'OCCLUSIONE RESTA ACCESA. La spegnevo entrando nel pezzo, e insieme
     al faro era metà del guaio: misurato sullo stesso fotogramma, il
     Tulum stava a 123,8 di luce al banco e a 162,6 in selezione, e i due
     terzi di quella salita venivano da qui e dal faro in parti quasi
     uguali. Senza occlusione le maglie del bracciale non hanno più la
     riga d'ombra che le separa e il pezzo diventa una sagoma piatta —
     proprio nel momento in cui lo si sta guardando da vicino. */
  ao.enabled = aoAccesa; ao.updateGtaoMaterial(ste ? AO_POSATO : AO_BANCO);
  profondita(2);
  /* QUANTA LUCE SERVE LO DICE IL PEZZO, non il livello.
     Un metallo lucido non ha colore suo: fa vedere quello che gli sta
     intorno, e tolto l'espositore, davanti a una parete scura, una creola
     d'argento non ha più NIENTE da riflettere — usciva nera. Per quella
     serviva una scatola di luce, ed è come si fotografa un gioiello.
     Ma un Regina Swatch non è metallo: è VERNICIATO, il colore ce l'ha
     suo, e la stessa scatola di luce glielo SCHIARISCE — entrava in
     selezione e il verde salvia diventava un verde pallido. Su un prodotto
     monocromo il colore È il prodotto, quindi non si tocca.
     Si guarda di che cosa è fatto il pezzo e si alza solo per la parte
     metallica. */
  let metalliche = 0, tutte = 0;
  p.traverse(o => { if(o.isMesh && o.material){
    tutte++; if(o.material.metalness > 0.5) metalliche++; } });
  const metallico = tutte ? metalliche / tutte : 1;
  /* IL FARO È TUTTO PER IL METALLO, E NIENTE PER LA VERNICE. Lo avevo
     già reso proporzionale, ma sotto ci avevo lasciato un fondo di 1,35
     che toccava tutti: e su un Regina Swatch, che verniciato è e il
     colore ce l'ha suo, quel fondo era solo luce bianca in più. Adesso
     va a zero, e il pezzo in selezione ha lo stesso colore che aveva sul
     suo espositore — che è l'unico modo di guardarlo da vicino senza che
     cambi merce mentre lo guardi. Il metallo tiene i suoi 2,60 di prima:
     quello senza scatola di luce resta nero. */
  lampada.intensity = 2.60 * metallico;
  scena.environmentIntensity = AMBIENTE * (1 + 2.2 * metallico);
  /* NIENTE OMBRA, E ADESSO SO PERCHÉ. Riaccesa e misurata: non compare
     un solo pixel. Il pezzo sta a venticinque centimetri sopra il piano —
     è l'altezza a cui stava sul busto — e il punto del banco che gli sta
     sotto cade FUORI dal quadro, sotto il bordo basso. Un'ombra lì non
     la vede nessuno, e il calcolo lo si paga lo stesso.
     Che la collana isolata sembri un filo d'oro a mezz'aria è vero, ma
     la causa non è l'ombra: è che una collana la sua posa ce l'ha dal
     BUSTO, e tolto quello resta un anello appeso al niente. Un anello e
     un orologio reggono da soli, una collana no. Sistemarlo vuol dire
     decidere se per le famiglie «scambia» il pezzo si isola davvero: è
     una scelta di Massimo, non una rifinitura, e sta scritta qui. */
  /* IL RIPIANO RESTA. Provato a spegnerlo perché con l'insieme attorno
     l'inquadratura si allarga e il bordo del banco rientrava in campo: ma
     sotto l'orizzonte non c'è nient'altro, e restava una banda nera netta
     — peggio del bordo. Il ripiano è la metà bassa del mondo. La
     soluzione è tenere l'insieme STRETTO, dentro l'inquadratura che il
     pezzo da solo aveva già. */
  /* ALZARE IL SOLE NON SERVE, PROVATO E MISURATO. L'idea era che l'ombra
     portata di una luce direzionale non entra nel buco degli anelli, e
     quindi avrebbe fatto il contatto senza spegnere l'oro. Ma un filo
     posato SULLA pietra proietta la sua ombra esattamente sotto di se', e
     da questa alzata la nasconde il filo stesso: a 1,85 volte la caduta
     misurata passava da 15,6 a 14,3, cioè niente. Il contatto lo può
     fare solo l'occlusione. */
  const appoggia = !!ste;
  rend.shadowMap.enabled = appoggia;
  scena.traverse(o => { if(o.isMesh) o.castShadow = appoggia; });
  if(appoggia) chiOmbra();         // la merce non getta: vedi `chiOmbra`
}

function mostraTutto(conVela){
  ombraDaRifare();
  /* e la posa torna a casa sua prima di tutto: se è rimasta a metà
     strada di uno scivolamento, tutto quello che segue la misurerebbe
     dove non sta */
  fermaPosa();
  /* SI RIENTRA COME SI È USCITI. Se la vela è ancora in corsa va chiusa
     prima, o i suoi materiali resterebbero trasparenti sotto quelli
     riaccesi qui sotto. */
  if(velaVerso) chiudiVela();
  togliInsieme();
  fondo.classList.remove("apribile", "ritirato");
  maniglia.setAttribute("aria-expanded", "true");
  cartello.classList.remove("pezzo");
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach((g, k) => {
    g.traverse(o => { if(o.isMesh) o.visible = true; });
    /* UNA COPIA SOLA PER FAMIGLIA, tranne quella in cui si è entrati.
       Al banco tre busti in fila sarebbero un magazzino, non una vetrina.
       E dentro una famiglia vale lo stesso per le ALTRE: scritto
       «altrimenti tutte», passando da collane a orecchini col menu
       restavano accesi i tre busti e i due bracciali — accesi e fermi dove
       lo swipe li aveva lasciati, perché a spostarli è `applicaPos`, che
       tocca solo la famiglia attiva. In quadro finiva un espositore di
       un'altra categoria, grande il doppio e davanti a tutto. */
    g.visible = (livello >= 1 && f.id === attiva) ? true : k === 0;
  });
  /* E LE POSE SI SPENGONO QUI, DOPO. Le spegnevo in cima alla funzione, e
     due righe più sotto `g.traverse(o => o.visible = true)` riaccendeva
     ogni mesh del gruppo — posa compresa. Tornando al banco dalle collane
     restava una collana stesa sul bancone davanti al plinto: un pezzo per
     terra, che non c'entra niente con l'espositore. L'ordine conta: prima
     si riaccende tutto, poi si spegne quello che non va acceso. */
  for(const f of FAMIGLIE) (pose[f.id] || []).forEach(o => { if(o) o.visible = false; });
  ao.enabled = aoAccesa; ao.updateGtaoMaterial(AO_BANCO); profondita(livello);
  lampada.intensity = 0;
  scena.environmentIntensity = AMBIENTE;
  rend.shadowMap.enabled = true;
  scena.traverse(o => { if(o.isMesh) o.castShadow = true; });
  chiOmbra();                      // e la merce torna a non gettare
  /* E L'ESPOSITORE RIENTRA. Non ricompare: si riforma mentre la macchina
     si tira indietro, che è lo stesso gesto letto al contrario — il
     gioielliere rimette il pezzo e la vetrina torna a essere la vetrina.
     La lista si prende DOPO aver riacceso tutto, se no ci finirebbero
     dentro solo le mesh che erano rimaste accese. */
  if(conVela && attiva && banchi[attiva] && scelto >= 0){
    const g = bancoDi(scelto);
    const ste = stesa(attiva, scelto);
    const tieni = ste || (merci[attiva] || [])[scelto];
    /* la posa esce mentre l'espositore rientra: la stessa dissolvenza
       incrociata dell'andata, letta al contrario */
    avviaVela(mesiEspositore(g, tieni), +1, ste ? mesiDi(ste) : []);
  }
  /* PER ULTIMO, quello che è uscito dal cofanetto. Va per forza in
     fondo: qui sopra un `traverse` riaccende ogni mesh del gruppo, e un
     pezzo tolto tornerebbe in vetrina tornando indietro. È lo stesso
     ordine che le pose hanno già imparato dodici righe più su. */
  applicaTolti();
}

/* SI TORNA INDIETRO DI UN PASSO PER VOLTA: dal pezzo all'espositore,
   dall'espositore al banco. Il tasto in alto e il trascinamento verso il
   basso fanno la stessa cosa, perché su un telefono la mano non sale. */
function indietro(){
  /* ── UN PASSO È UN PASSO, E LA CARTA È UN PASSO ──────────────
     Con la finestra la carta non copre più tutto lo schermo per il
     collaudo del puntatore: un tocco che cade nel ritaglio arriva alla
     tela, e se cade fuori dal cerchio del gioiello la stanza lo legge
     come «riappoggia il pezzo» e uscirebbe dal pezzo CON LA CARTA ANCORA
     APERTA. Il passo indietro più vicino, quando c'è una carta aperta,
     è la carta: si chiude lei, e il pezzo resta dov'e'. Vale anche per
     il pizzico all'indietro, che passa di qui. */
  if(!cartaPezzo.hidden){ chiudiCarta(); return; }
  if(livello === 2){
    livello = 1; segnaLivello();
    tocco();
    lampo();
    /* il quadro del pezzo non vale più niente: la banda torna quella
       vera e il volo verso il pezzo non è più in corso */
    voloAlPezzo = false; bandaPezzo = null;
    mostraTutto(true);
    azzeraPizzico();
    inquadraFamiglia();
    applicaPos(false);
    /* e la posa torna dove il pezzo stava sull'espositore, con la stessa
       legge dell'andata: viaggia con la macchina, non con un tempo suo.
       Si chiama DOPO `inquadraFamiglia`, che è chi decide la strada. */
    avviaPosa(+1);
    mostraScheda();
    sveglia();
  } else if(livello === 1) vaiAlBanco();
}
document.getElementById("dietro").onclick = indietro;

function mostraScheda(){
  /* LA STAZIONE È QUELLA DOVE SI VA, NON QUELLA DOVE SI È.
     Leggeva `pos`, cioè la posizione ISTANTANEA della scena. Ma al
     rilascio di uno swipe `pos` sta ancora sulla stazione di partenza — il
     dito la muove al massimo di quarantasei pixel, una frazione di
     stazione — mentre la destinazione appena decisa sta in `posMeta`, e ci
     arriva la molla nel mezzo secondo dopo. Risultato: la macchina andava
     sul secondo anello e il cartellino restava sul primo. E con lui
     `indice`, cioè il pezzo che un tocco avrebbe aperto: si vedeva il
     secondo e si apriva il primo.
     La scheda descrive la DESTINAZIONE, sempre. */
  const st = stazioni(attiva), qui = st[Math.round(posMeta)] || [];
  if(!qui.length) return;
  indice = qui.find(k => !cTolto(attiva, k));
  if(indice === undefined) indice = qui[0];
  if(qui.length === 1){
    const p = RIPIANI[attiva][qui[0]] || ["", "", ""];
    /* E UN POSTO VUOTO LO DICE. Tolto un pezzo, la sua fermata resta —
       è una sede dell'espositore, non una riga di lista — ma il
       cartellino non può continuare a battere nome e prezzo di una cosa
       che non c'è più. Il prezzo se ne va con lei: quello è il valore
       di un pezzo nel cofanetto, e quel pezzo fuori. */
    if(cTolto(attiva, qui[0]))
      scritte(p[0], "", "Non è più nel cofanetto.", GESTI[MODI[attiva]]);
    else scritte(p[0], p[2] + " €", p[1], GESTI[MODI[attiva]]);
  } else {
    /* una stazione con più pezzi non ha UN nome: dice quali ci sono e
       invita a toccarne uno. Mettere il nome del primo sarebbe una scelta
       fatta al posto del cliente. */
    const nomi = qui.filter(k => !cTolto(attiva, k))
                    .map(k => (RIPIANI[attiva][k] || [""])[0]);
    scritte(FAMIGLIE.find(f => f.id === attiva).nome, "",
            nomi.join(" · "),
            // «tocca un pezzo» sta già dentro GESTI: ripeterlo qui dava
            // «tocca un pezzo · scorri per cambiare nastro · tocca un pezzo»
            GESTI[MODI[attiva]]);
  }
}

/* ── QUANTO CARTELLINO SI VEDE ────────────────────────────────────
   Ritirato: nome, prezzo e gesto. Aperto: anche il materiale, l'insieme e
   il bottone. L'inquadratura si rifa' DOPO che il browser ha impaginato
   l'altezza nuova — chiesta subito, getBoundingClientRect torna ancora
   quella vecchia e la macchina centra su una banda che non esiste più. */
function scheda(ritirata){
  fondo.classList.toggle("ritirato", ritirata);
  maniglia.setAttribute("aria-expanded", ritirata ? "false" : "true");
  maniglia.setAttribute("aria-label", ritirata ? "apri la scheda" : "chiudi la scheda");
  segnaSugg();
  adattaTitolo();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    /* ── E NON MENTRE LA MACCHINA VOLA ──────────────────────────
       Entrando nel pezzo è `apriPezzo` a chiamare questa funzione, e
       due fotogrammi dopo il volo è già partito: rifare il quadro qui
       vuol dire cambiare il bersaglio in corsa — la «correzione
       ritardata» che il verdetto del cliente descrive. Il quadro del
       pezzo lo decide `apriPezzo`, in fondo, una volta sola. */
    if(voloAlPezzo){ sveglia(); return; }
    if(livello === 2){
      /* la scheda che si apre o si chiude cambia la banda DAVVERO, ed è
         l'unico momento in cui la si rilegge */
      bandaPezzo = misuraArea();
      inquadraPezzo();
    }
    else if(livello === 1) inquadraFamiglia();
    sveglia();
  }));
}
maniglia.onclick = () => scheda(!fondo.classList.contains("ritirato"));

let vuoleInsieme = true;
try { vuoleInsieme = localStorage.getItem("regina.insieme") !== "no"; } catch(_) {}
const tastoInsieme = document.getElementById("tasto-insieme");
function segnaInsieme(){
  tastoInsieme.setAttribute("aria-pressed", vuoleInsieme ? "true" : "false");
  segnaSugg();
}
function vuoiInsieme(si, daFuori){
  si = !!si;
  if(si === vuoleInsieme) return;
  vuoleInsieme = si;
  try { localStorage.setItem("regina.insieme", vuoleInsieme ? "si" : "no"); } catch(_) {}
  segnaInsieme();
  if(!daFuori) dico("preferenze/insieme", {insieme:vuoleInsieme});
  sveglia();
}
tastoInsieme.onclick = () => vuoiInsieme(!vuoleInsieme);
segnaInsieme();

/* ── «METTI DA PARTE L'INSIEME» ───────────────────────────────────
   Il tasto c'era, largo quanto la scheda, in turchese pieno — e non
   aveva nessun gestore: si premeva e non succedeva niente. È il peggio
   dei tasti morti, perché è anche il più evidente.
   Adesso risponde, e risponde in due posti insieme: il tasto stesso dice
   «Messo da parte» con una spunta disegnata (non un'emoji: sarebbe
   l'unico segno della schermata a venire da un altro alfabeto), e la
   striscia in basso dice dove è finito l'insieme. Tre secondi e il
   tasto torna com'era, perché un comando che resta «fatto» per sempre
   non si può più rifare — e un insieme si mette da parte ogni volta
   che se ne compone uno nuovo. */
const tastoDaParte = document.querySelector("#insieme button.primo");
if(tastoDaParte) tastoDaParte.onclick = () => {
  if(tastoDaParte.classList.contains("fatto")) return;
  const d = tastoDaParte.querySelector(".detto");
  const prima = d.textContent;
  tastoDaParte.classList.add("fatto");
  d.textContent = "Messo da parte";
  mostraToast("L’insieme è in vetrina.", {durata:4000});
  clearTimeout(tastoDaParte.__t);
  tastoDaParte.__t = setTimeout(() => {
    tastoDaParte.classList.remove("fatto");
    d.textContent = prima;
  }, 3000);
};

/* ══════════════════════════════════════════════════════════════
   L'AIUTO SI IMPARA PER LIVELLO, NON UNA VOLTA PER SEMPRE

   `cartello.classList.add("imparato")` si attaccava a QUALUNQUE
   trascinamento di più di 24 pixel, a qualunque livello, e non si
   toglieva mai: bastava uno scorrimento al banco — il primo gesto che
   chiunque fa — e la riga spariva anche dentro il pezzo, dove è l'unico
   posto senza un appiglio visibile per capire cosa si può fare. E
   spariva per sempre, anche alla visita di domani: nessuna chiave in
   memoria, quindi ricaricando tornava, ma dentro la stessa visita no.
   Ogni livello — e al livello 1 ogni MODO, perché scorrere una fila di
   anelli e far ruotare gli espositori delle collane sono due gesti
   diversi — si impara per conto suo e se lo ricorda.
   ══════════════════════════════════════════════════════════════ */
function chiaveGesto(){
  if(livello === 0) return "rj.gesto.L0.banco";
  if(livello === 1) return "rj.gesto.L1." + (MODI[attiva] || "cammina");
  if(livello === 2) return "rj.gesto.L2.pezzo";
  return null;
}
function giaImparato(k){
  try { return localStorage.getItem(k) === "si"; } catch(_) { return false; }
}
function segnaImparato(){
  const k = chiaveGesto(); if(!k) return;
  try { localStorage.setItem(k, "si"); } catch(_) {}
  aggiornaAiuto();
}
function aggiornaAiuto(){
  const k = chiaveGesto();

}

let livelloScritto = -1;
function scritte(t, n, s, g){
  insieme.hidden = true;
  /* IL CARTELLINO CAMBIA CON UN BATTITO. Non è un vezzo: al cambio di
     livello cambiano tutte e quattro le righe insieme, e quattro
     sostituzioni simultanee lette a schermo pieno sembrano un errore di
     caricamento. Il testo si mette SUBITO — l'impaginazione, che
     `adattaTitolo` misura, deve essere quella nuova — e a muoversi è
     solo l'opacita'. Dentro lo stesso livello non succede niente:
     scorrendo il banco il nome della famiglia cambia a ogni espositore,
     e lì un battito sarebbe uno sfarfallio. */
  const cambio = livello !== livelloScritto;
  livelloScritto = livello;
  titolo.textContent = t; numero.textContent = n;
  sotto.textContent = s; document.getElementById("gesto-testo").textContent = g;
  adattaTitolo();
  aggiornaAiuto();
  clearTimeout(cartello.__t);
  if(cambio && !ridotto){
    cartello.classList.add("via");
    // due fotogrammi perché il battito si VEDA, e un cronometro dietro
    // perché in una scheda che non disegna rAF non scatta affatto e il
    // cartellino resterebbe trasparente
    requestAnimationFrame(() => requestAnimationFrame(
      () => cartello.classList.remove("via")));
    cartello.__t = setTimeout(() => cartello.classList.remove("via"), 90);
  } else cartello.classList.remove("via");
}

/* Si prova a 34 e si scende di due in due finché il nome non sta su una
   riga sola. Non si indovina quanti caratteri ci stanno: si GUARDA se è
   andato a capo — l'altezza del blocco lo dice, e funziona con qualunque
   nome, anche quelli di Stefano che non abbiamo ancora. */
function adattaTitolo(){
  /* e a cartellino ritirato il nome parte più piccolo: lì non è la
     testata di una pagina, è l'etichetta sotto un oggetto che si sta
     guardando. La misura la scrive questa funzione, non il foglio di
     stile: una regola CSS non batte uno stile in riga. */
  /* ── E NEL PANNELLO IL NOME PUÒ ANDARE A CAPO ────────────────
     Su un telefono il nome sta su una riga per forza: sotto c'è la scena
     e ogni riga in più è ambiente in meno. In una colonna da 304 punti
     no — «Bracciale Maglia Larga» a 42 px vuole due righe, ed è così
     che lo impaginano le schede prodotto di riferimento. Si scende solo
     se ne vuole tre, e mai sotto il 72 per cento della misura di partenza:
     a 42 fa 30, e con un corpo di 14 il rapporto resta 2,14 — già sotto
     la banda 2,6-3,7 delle maison, quindi è il fondo, non un margine.
     La misura di partenza la dice il foglio di stile (`--nome`): 42 su
     desktop, 32 col telefono coricato, dove l'altezza è 390 punti. */
  if(larga){
    let px = parseFloat(getComputedStyle(document.documentElement)
                          .getPropertyValue("--nome")) || 42;
    const fondoScala = Math.max(22, Math.round(px * 0.72));
    titolo.style.fontSize = px + "px";
    while(px > fondoScala && titolo.offsetHeight > px * 2.3){
      px -= 2;
      titolo.style.fontSize = px + "px";
    }
    return;
  }
  /* ── E IL 34 È DEL PEZZO, NON DEL BANCO (16/09) ──────────────
     Trentaquattro punti di Bodoni sono la testata di una SCHEDA
     PRODOTTO: al livello 2, col pezzo in mano e la carta che si apre,
     il nome È il titolo della pagina. Al banco e dentro una famiglia
     no — lì il cartellino è l'ETICHETTA sotto un oggetto che si sta
     guardando, e quel 34 costava: verdetto del cliente, «gli elementi
     prendono troppo spazio togliendo visibilita' all'ambiente».
     Ventotto è `--t-1` (Title 1) del sistema di design, e col prezzo a
     17 e la materia a 13 la gerarchia nome > prezzo > materia resta
     intera. Il 34 resta dove è nato: al pezzo, con la scheda aperta. */
  let px = (livello === 2 && !fondo.classList.contains("ritirato")) ? 34 : 28;
  titolo.style.fontSize = px + "px";
  while(px > 21 && titolo.offsetHeight > px * 1.5){
    px -= 2;
    titolo.style.fontSize = px + "px";
  }
}

/* == LA FISICA DEL GESTO =====================================
   Uno swipe che si sente sotto il pollice ha tre cose, e nessuna è un
   abbellimento.
   1. UNA POSIZIONE CONTINUA, non una soglia: il dito muove `pos` uno a uno
      e la scena lo segue in ogni istante.
   2. L'INERZIA: al rilascio la velocita' prosegue e decide dove si finisce.
   3. L'AGGANCIO CON MOLLA, non con interpolazione: una molla arriva, si
      posa e si ferma.
   E ai capi la GOMMA: oltre l'ultimo pezzo la scena resiste e torna. */
/* ── QUANTO VALE UN DITO ───────────────────────────────────────────
   Era un numero solo per tutte le famiglie: 108 pixel di dito valgono una
   stazione. Ma una stazione non è la stessa cosa in nessuna delle cinque:
   sulle collane vale una LARGHEZZA DI QUADRO (il 94 per cento dello
   schermo), sugli anelli il passo fra due colonnine (poche decine di

   differenza fra una famiglia e l'altra. È quello che si sente come
   «non coordinato» e «un po' casuale», e non è un difetto di gusto: è
   la stessa costante usata per cinque grandezze diverse.
   Adesso il passo del dito è la MISURA SULLO SCHERMO di una stazione, e
   il freno è in pixel: il dito porta la scena uno a uno e si ferma sempre
   dopo gli stessi quarantasei pixel, in tutte e cinque. */

/* QUI STAVA IL FRENO, E IL FRENO ERA IL DIFETTO. `CENNO_PX = 46` con una
   tangente iperbolica: la scena rispondeva all'80 per cento a 22 pixel di
   dito, al 44 per cento a 40, e a 46 si fermava — misurato sugli anelli

   solo per un centimetro e mezzo, poi si incollava, e dove si andava lo
   decideva il rilascio. È esattamente il verdetto del cliente: «si muove
   solo quando il dito è appoggiato, non dando il senso di rallentamento
   della visuale».

   famiglie — il passo per stazione lo da' già `PASSO_DITO` — e l'unica
   resistenza è la gomma AI BORDI della fila, come in ogni lista di iOS.
   Anche nei modi «salta» e «scambia», dove un espositore intero entra ed
   esce: lì una stazione vale 367 pixel invece di 108, e uno a uno vuol
   dire «una passata di schermo, un espositore» — che è la paginazione di
   iOS, non un difetto. Il freno lì non serve, e infatti non c'è più.
   Spariti con lui: `LANCIO_PX` (la soglia del lancio) e la regola della
   STRADA percorsa. Dove si va non è più una soglia: è la PROIEZIONE
   della velocita'. */
/* -- LA PROIEZIONE, E LA DECELERAZIONE CHE PARTE DAL DITO --------
   Il modello è quello di UIScrollView con la paginazione «a bersaglio»:
   si proietta dove il dito sarebbe arrivato se lo scorrimento avesse
   continuato da solo, e la stazione più vicina a quel punto è il
   bersaglio. La proiezione è la formula di iOS — lo scorrimento decade
   di un fattore lambda a ogni millisecondo, e la distanza che resta da
   fare vale v/1000 · lambda/(1-lambda). Con lambda 0,998 quel rapporto
   fa 499, cioè mezzo secondo di velocita' corrente. */
/* LAMBDA È 0,997, NON 0,998. Con 0,998 la proiezione vale mezzo secondo
   di velocita' corrente — giusto su una lista di pixel, troppo su una
   fila di cinque anelli dove una stazione è 108 pixel: misurato, un
   lancio medio da 600 px/s ne scavalcava QUATTRO. A 0,997 la coda vale
   un terzo di secondo e lo stesso lancio ne fa due. */
const CODA_MS = 0.3323;      // secondi: lambda/(1-lambda)/1000, lambda 0,997
/* E UN LANCIO NON PUÒ SCAVALCARE TUTTO IL COFANETTO. Su cinque pezzi un
   lancio forte ne proietta otto: si arriverebbe in fondo senza aver visto
   niente in mezzo, e chi guarda perde il posto.
   IL TETTO SI CONTA DA DOVE IL GESTO È COMINCIATO, non da dove il dito
   si è alzato: fra i due c'è tutto il trascinamento uno a uno, e
   contando dal rilascio un lancio medio arrivava a quattro stazioni
   pur avendo un tetto di tre. Due è il budget dell'intero gesto — ma non
   può MAI riportare la fila dietro a dove il dito l'ha già portata:
   quello sarebbe disfare il trascinamento. */
/* E POI: «lo swipe deve essere meno sensibile». Con l'uno a uno e il tetto
   a due, una passata di pollice sugli anelli (108 px a stazione) portava
   via due pezzi sotto il dito e un terzo con la coda. Tre leve, tutte
   dichiarate: il tetto torna a UNO (la regola di sempre, «un lancio vale
   un pezzo», ora con la decelerazione vera); la scena segue il dito con un
   GUADAGNO sotto l'unita' (0,72: per una stazione servono 150 px di dito
   invece di 108), uguale sotto il dito e nella proiezione, così il moto
   resta continuo al rilascio; e sotto il dito la corsa si ferma a una
   stazione e un quarto dal punto di partenza con la stessa gomma dei
   capi della fila. `?sens=` e `window.__sens` la cambiano al volo. */
const TETTO_SALTO = 1;
const CORSA_DITO = 1.25;
let GUADAGNO = (() => { const s = parseFloat(q.get("sens")); return (s > 0.3 && s <= 1.5) ? s : 0.72; })();
Object.defineProperty(window, "__sens", { get: () => GUADAGNO,
  set: v => { const s = parseFloat(v); if(s > 0.3 && s <= 1.5) GUADAGNO = s; } });
/* la gomma della corsa: lineare fino a `lim`, poi ogni stazione in più
   costa sempre di più — la stessa legge dei capi della fila */
function corsaMorbida(x, lim){
  const a = Math.abs(x); if(a <= lim) return x;
  const oltre = a - lim;
  return Math.sign(x) * (lim + oltre / (1 + oltre / OLTRE));
}
/* ══════════════════════════════════════════════════════════════
   DOPO IL RILASCIO LA VELOCITA' SCENDE E BASTA

   Qui c'era una MOLLA verso il bersaglio, e una molla è un motore: se il
   bersaglio è più lontano di quanto la velocita' del dito porterebbe da
   sola, la molla TIRA. Misurato: 142-176 per cento della velocita' del
   dito al primo fotogramma, con punte fino al 247 a metà corsa. Si
   lasciava andare e la scena spingeva. È l'opposto del «senso di
   rallentamento» che si sta cercando: una decelerazione si riconosce
   perché ogni fotogramma è più lento del precedente, sempre.
   Adesso non c'è più nessuna forza. C'è UNA SOLA legge, quella dello
   scorrimento di iOS: la velocita' decade di un fattore lambda a ogni
   millisecondo, e la strada che resta da fare vale sempre
   v/1000 · lambda/(1-lambda). Scelto il bersaglio, si RISOLVE il lambda
   che rende quella strada esattamente la distanza al bersaglio:
       R = 1000·d/v        lambda' = R/(1+R)
   Con quel lambda la coda parte esatta alla velocita' del dito, scende in
   modo monotono, e finisce esattamente sulla stazione. Niente spinta,
   niente sorpasso: sono la stessa cosa, e spariscono insieme.
   ══════════════════════════════════════════════════════════════ */
const LAM_PAVIMENTO = 0.990;   // coda ~100 ms: sotto, il moto è un urto
/* IL TETTO DICHIARATO È 0,998 (coda 0,4995 s), ma tagliarci sopra lascia
   il bersaglio IRRAGGIUNGIBILE: a 150 px/s con 88 pixel da fare serve una
   coda di 588 ms, e una da 499 ne copre 75 — la fila si pianterebbe a
   tredici pixel dalla stazione a cui il gesto puntava. Coprire quei
   tredici pixel richiede più velocita' di quella che la coda ha in quel
   momento, cioè una spinta: esattamente la cosa che si sta togliendo.
   L'unico modo monotono di arrivarci è una coda più lunga, e 0,9992
   (1,25 s) è il punto oltre il quale non si parla più di lancio: lì
   sotto ci pensa l'AGGANCIO. */
const LAM_TETTO = 0.9992;
/* più lento di così non è un lancio, è un dito che si stacca: la fila
   si aggancia alla stazione con la molla di sempre. Una molla che parte
   da ferma ACCELERA — non c'è altro modo di partire da fermi — ma lì
   non c'è nessuna velocita' del dito da tradire. */
const TAU_LANCIO = 1.25;       // secondi: la coda più lunga che si accetti
/* sotto un pixel non c'è più niente da mostrare, e un asintoto che non
   finisce è un ciclo di disegno che non si spegne. Era 0,3: con la legge
   di iOS presa alla lettera un colpetto lento con una stazione da coprire
   restava in moto sub-pixel per un secondo intero (aggancio a 3.317 ms
   sugli anelli a 150 px/s). A un pixel la coda visibile è la stessa e
   il ciclo si spegne ~700 ms prima. */
const AGGANCIO_PX = 1.0;
/* da d e v (stesse unita') il lambda che fa finire la coda ESATTAMENTE
   sul bersaglio, e con lui 1/tau — che è quello che serve al ciclo */
function codaDi(d, v){
  const R = 1000 * d / Math.abs(v);
  const lam = Math.min(LAM_TETTO, Math.max(LAM_PAVIMENTO, R / (1 + R)));
  return {lam, unSuTau: -1000 * Math.log(lam)};
}
/* LA MOLLA È PIÙ MORBIDA DI PRIMA. A 210 arrivava in due decimi di
   secondo: giusta quando il dito portava la scena quasi a destinazione e
   alla molla restava solo l'ultimo pezzo di strada. Adesso che il dito si
   ferma a un terzo e il viaggio lo fa tutto la molla, quella rigidita' lo
   faceva sembrare uno scatto. A 130 dura poco meno di mezzo secondo:
   MISURATO, 468 ms dal rilascio alla quiete. Riprende la velocita' che
   aveva il dito e da lì rallenta fino a posarsi — e resta critica, quindi
   non supera il bersaglio e non torna mai indietro (sforamento 0 in tutte
   e cinque le prove). */
const K_POS = 130;
/* la rigidita' dell'AGGANCIO: vale quando non c'è una coda in corso —
   rotella, frecce, tocco su un pezzo lontano, freno, e i rilasci troppo
   lenti per essere un lancio. */
let kPos = K_POS;
/* LA CODA IN CORSO. `coda` è 0 quando la fila si aggancia con la molla e
   1 quando sta decelerando da sola; `codaTau` è 1/tau del decadimento
   scelto per QUEL lancio. Si spegne da se' all'aggancio, e la spegne
   qualunque comando che riassegni il bersaglio. */
let coda = 0, codaTau = 0;
function fermaCoda(){ coda = 0; kPos = K_POS; }

let giu = null, mosso = 0, mossoY = 0, partenzaX = 0;
let giroGiu = 0, altGiu = 0.12, dondolo = 0, giroBase = 0, giroV = 0;
let ultimoX = 0, ultimoT = 0, velDito = 0;
/* -- LA VELOCITA' DEL DITO SI LEGGE SU UNA FINESTRA ---------------
   Era un filtro esponenziale a 0,72/0,28 su ogni `pointermove`: comodo,
   ma la sua memoria dipende da QUANTI eventi arrivano, e un pannello a
   120 Hz e uno a 60 gli danno due costanti di tempo diverse. Peggio: un
   dito che si ferma e poi si alza lascia nel filtro la velocita' di
   prima, e la scena parte da sola dopo che il gesto era già finito.
   Adesso è una media pesata sugli ultimi novanta millisecondi veri, col
   peso che cresce verso il rilascio, e al rilascio si aggiunge un
   campione all'istante dell'alzata: se il dito è stato fermo per un
   decimo di secondo, la finestra è tutta ferma e la velocita' è zero.
   I campioni stanno in un array piatto (tempo, x, tempo, x): un oggetto
   per `pointermove` a 120 Hz è spazzatura che il raccoglitore viene a
   prendere in mezzo a un gesto. */
const FINESTRA_VEL = 90;
const campioni = [];
function campiona(t, x){
  campioni.push(t, x);
  while(campioni.length > 4 && t - campioni[0] > FINESTRA_VEL) campioni.splice(0, 2);

   verso in cui la posizione logica cresce */
function velFinestra(){
  if(campioni.length < 4) return 0;
  const fine = campioni[campioni.length - 2];
  let peso = 0, somma = 0;
  for(let i = 2; i < campioni.length; i += 2){
    const dt = campioni[i] - campioni[i-2];
    if(dt <= 0) continue;
    const w = dt * (1 - (fine - campioni[i]) / FINESTRA_VEL);
    if(w <= 0) continue;
    somma += (campioni[i-1] - campioni[i+1]) / (dt / 1000) * w;
    peso += w;
  }
  return peso > 0 ? somma / peso : 0;
}

/* ══════════════════════════════════════════════════════════════
   DA QUANTO NESSUNO TOCCA

   Non è un orologio: è un contatore che si somma dentro il ciclo di
   disegno, un fotogramma per volta. Deve essere così perché il collaudo
   pilota il tempo A MANO — con `performance.now()` il banco di prova
   misurerebbe sempre «fermo da dodici ore» e il dondolo non si potrebbe
   provare affatto.
   Lo leggono due cose: il dondolo del pezzo, che dopo dodici secondi si

   2,77 stazioni al secondo, un tocco portava fuori dalla famiglia
   (livello 1 → 0); al livello 2, con la coda della rotazione ancora in
   corsa, portava fuori dal pezzo (2 → 1). Cioè: mentre la scena si
   muoveva, il dito faceva una TERZA cosa — e nessuno tocca uno schermo in
   movimento per navigare, lo tocca per fermarlo. È il gesto più vecchio
   che ci sia: si appoggia la mano su una cosa che gira.
   Quindi: se al momento in cui il dito scende qualcosa si muove, quel
   gesto vale solo come freno. Agisce soltanto un tocco su scena ferma. */

   `tetto` è la velocita' massima che si eredita dal dito (rad/s),

   e del banco — proiezione con lambda 0,998, cioè una costante di 0,4995
   secondi — con la coda tagliata a 45 gradi perché un gioiello che si
   rivolta da solo di un quarto di giro non si sta più esaminando. La (c),
   tarata a mano, faceva 102 gradi di coda: era il carattere di un altro
   oggetto. (a) e (c) restano scegliibili con `?moto=a|c`. */
