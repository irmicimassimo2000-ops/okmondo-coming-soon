   `mostraTutto` riaccende tutto il gruppo con un traverse, e senza questo
   passo un pezzo tolto tornerebbe in vetrina al primo passo indietro */
function applicaTolti(){
  ombraDaRifare();                 // un pezzo che esce porta via la sua ombra
  /* ── IL VUOTO VALE ANCHE PER CHI ARRIVA DOPO ──────────────────
     Le famiglie scendono A TAPPE: quando `?demo=vuoto` decide che il
     cofanetto è vuoto, tre dei cinque reparti non sono ancora in scena, e
     la loro merce si apparecchiava accesa — misurati trentasette pezzi
     visibili in un cofanetto dichiarato vuoto. Qui è l'unico punto che
     ogni apparecchiatura attraversa, quindi è qui che la regola si
     riafferma, invece di sperare che l'ordine di arrivo sia quello
     giusto. */
  if(cofanettoVuoto)
    for(const f of FAMIGLIE)
      (merci[f.id] || []).forEach((o, k) => { if(o) TOLTI.add(f.id + ":" + k); });
  if(!TOLTI.size) return;
  for(const f of FAMIGLIE){
    (merci[f.id] || []).forEach((o, k) => {
      if(o && cTolto(f.id, k)) o.traverse(m => { if(m.isMesh) m.visible = false; });
    });
    (pose[f.id] || []).forEach((o, k) => {
      if(o && cTolto(f.id, k)) o.traverse(m => { if(m.isMesh) m.visible = false; });
    });
  }
}

/* SI APPARECCHIA UNA FAMIGLIA PER VOLTA. Prima si aspettavano tutte e
   cinque e si stendeva il banco in un colpo; a tappe ognuna si siede al
   suo posto appena arriva, e le altre non devono esserci. */
function apparecchia(solo){
  for(const f of (solo ? [solo] : FAMIGLIE)){
    if(!gruppi[f.id]) continue;
    const base = gruppi[f.id], quanti = COPIE[f.id];
    const lista = [base];
    for(let k = 1; k < quanti; k++){
      const c = base.clone(true);
      c.userData = Object.assign({}, base.userData);
      scena.add(c);
      lista.push(c);
    }
    banchi[f.id] = lista;
    // la merce, banco per banco: un clone porta il SUO pezzo, non quello
    // dell'originale, o toccandone uno si aprirebbe sempre il primo
    merci[f.id] = [];
    lista.forEach((g, k) => {
      const dentro = [];
      g.traverse(o => { if(/^pezzo\d\d/.test(o.name)) dentro.push(o); });
      dentro.sort((a, b) => a.name.localeCompare(b.name));
      const col = (METALLI[f.id] || [])[k];
      if(quanti > 1 && col !== undefined)
        dentro.forEach(o => o.traverse(m => {
          if(m.isMesh && m.material && m.material.metalness > 0.4){
            m.material = m.material.clone();
            m.material.color.setHex(col);
          }
        }));
      const stese = [];
      g.traverse(o => { if(/^posa\d\d/.test(o.name)) stese.push(o); });
      stese.sort((a, b) => a.name.localeCompare(b.name));
      if(quanti > 1 && col !== undefined)
        stese.forEach(o => o.traverse(m => {
          if(m.isMesh && m.material && m.material.metalness > 0.4){
            m.material = m.material.clone();
            m.material.color.setHex(col);
          }
        }));
      stese.forEach(o => { o.visible = false; });
      merci[f.id].push(...dentro);
      (pose[f.id] ||= []).push(...stese.length ? stese
        : dentro.map(() => null));
      g.userData.pezzi = dentro;
    });
    PASSO_BANCO[f.id] = base.userData.largo + 0.055;
    // DOVE STA DI CASA questa famiglia sul banco. Serve come riferimento
    // fisso per far scorrere le copie: prendere ogni volta la posizione
    // della prima copia non funziona, perché la prima copia è anche una
    // di quelle che si spostano — si sposta lei, e tutte le altre partono
    // da un punto che si è già mosso. Il banco scappava via di lato un
    // fotogramma alla volta.
    CASA[f.id] = base.position.x;
  }
  /* DOVE STA OGNI STAZIONE: si MISURA sulla merce, non si calcola.
     Il passo lo ricavavo dividendo la larghezza dell'espositore per il
     numero di fermate, e non è la stessa cosa: i tre nastri stanno a
     cinquantadue millimetri l'uno dall'altro, la formula ne dava sessanta,
     e la macchina si fermava otto millimetri accanto a ogni nastro invece
     che davanti. Il centro vero di una stazione è il centro della roba che
     ci sta sopra. */
  scena.updateMatrixWorld(true);
  const scatola = new THREE.Box3(), punto = new THREE.Vector3();
  for(const f of (solo ? [solo] : FAMIGLIE)){
    if(!gruppi[f.id]) continue;
    CENTRI[f.id] = stazioni(f.id).map(gruppo => {
      scatola.makeEmpty();
      for(const k of gruppo) if(merci[f.id][k]) scatola.expandByObject(merci[f.id][k]);
      return scatola.isEmpty() ? gruppi[f.id].position.x
                               : scatola.getCenter(punto).x;
    });
  }
  /* e la merce appena apparecchiata smette di gettare ombra: `metti` la
     accende su tutte le mesh del modello, e questa è l'unica riga che
     passa DOPO che `merci`/`pose` esistono */
  chiOmbra();
}

/* la x di una stazione, anche fra una e l'altra e anche oltre i capi */
function centroStazione(fam, dove){
  const c = CENTRI[fam] || [];
  if(!c.length) return gruppi[fam].position.x;
  if(c.length === 1) return c[0];
  const i0 = Math.max(0, Math.min(c.length - 2, Math.floor(dove)));
  return c[i0] + (c[i0 + 1] - c[i0]) * (dove - i0);
}

/* LE STAZIONI. Una stazione è quello che uno swipe sposta:
   · sugli anelli è un ANELLO — cinque colonnine, cinque fermate;
   · sugli orecchini è un NASTRO, e dentro ci stanno tre paia;
   · sulle collane e sui bracciali è un ESPOSITORE INTERO, uno per pezzo. */
/* e la lista NON si rifa' ogni volta che qualcuno ne chiede la lunghezza.
   `limiteN`, `applicaPos` e `scritte` la chiamano dentro il gesto, e ogni
   chiamata costruiva una matrice nuova — cinque array dentro un array —
   per leggerne `.length`. Cambia solo quando cambia il numero di pezzi
   della famiglia, e allora si rifa'. Nessuno la modifica: la si legge e
   basta (`.length`, `.map`, `.findIndex`, `.indexOf`). */
const STAZIONI_OREC = [[0,1,2],[3,4,5],[6,7,8]], STAZ = {};
function stazioni(fam){
  if(fam === "orecchini") return STAZIONI_OREC;
  const m = merci[fam] || [];
  let c = STAZ[fam];
  if(!c || c.length !== m.length) c = STAZ[fam] = m.map((_, i) => [i]);
  return c;
}
function bancoDi(k){
  const b = banchi[attiva] || [];
  if(!b.length) return null;
  const q = COPIE[attiva] > 1 ? k : 0;
  return b[Math.min(q, b.length - 1)];
}

/* ═══════════════════════════════════════════════════════════════
   IL CARICATORE A TAPPE.
   Si scarica la famiglia che si sta guardando, si toglie il velo, e le
   altre arrivano dietro mentre uno già si muove. La riga sotto al velo
   è sui BYTE — il manifesto porta il totale esatto prima che arrivi
   il primo — e il velo non è mai eterno: se qualcosa non arriva lo
   dice in italiano e si può riprovare.
   ═══════════════════════════════════════════════════════════════ */
/* LE LARGHEZZE SONO UNA COSTANTE, e non per pigrizia: la fila si dispone
   con le larghezze di TUTTE E CINQUE, e a tappe non ci sono. Misurate
   sull'app viva (userData.largo), non stimate: la somma più quattro
   volte l'aria fa 0,942112, che è il LARGO_BANCO di prima, e il busto
   cade a -0,376 come cadeva. Se un .glb cambia forma, questa riga si
   rimisura. */
const LARGHEZZE = {busto:0.190112, orecchini:0.150000, anelli:0.150000,
                   rampa:0.156000, orologi:0.176000};
const VOCI = {busto:"le collane…", orecchini:"gli orecchini…",
              anelli:"gli anelli…", rampa:"i bracciali…",
              orologi:"gli orologi…"};
const POSTO = {}, arrivate = new Set(), inCorso = {};
let inCoda = [], codaViva = false;

function disponi(){
  const ARIA = 0.030;
  const l = FAMIGLIE.map(f => LARGHEZZE[f.id]);
  const totale = l.reduce((a, b) => a + b, 0) + ARIA * (l.length - 1);
  LARGO_BANCO = totale;
  let x = -totale / 2;
  FAMIGLIE.forEach((f, i) => { POSTO[f.id] = x + l[i] / 2; x += l[i] + ARIA; });
}

/* UNA FAMIGLIA. Scarica, decodifica, la mette al suo posto — che era già
   riservato — e apparecchia solo lei. */
async function porta(f){
  if(arrivate.has(f.id)) return;
  if(inCorso[f.id]) return inCorso[f.id];
  const p = (async () => {
    annuncia(VOCI[f.id]);
    const buf = await scarica(fileDi(f));
    const g = await new Promise((ok, ko) => caricatore.parse(buf, "", ok, ko));
    metti(f, g);
    gruppi[f.id].position.x = POSTO[f.id];
    apparecchia(f);
    arrivate.add(f.id);
    tuttiICorpi = null;      // i materiali della nuova famiglia entrano nel giro
    applicaTolti();
    segnaMenu();
    provinaAOzio();          // i provini di QUESTA, non di quelle che mancano
    sveglia();
  })();
  inCorso[f.id] = p;
  try { await p; } finally { delete inCorso[f.id]; }
}

/* LE ALTRE DIETRO, e non solo «dopo»: dopo il PRIMO FOTOGRAMMA, e nei
   ritagli. Una famiglia che arriva mentre la macchina si muove fa saltare
   l'animazione, e il salto si vede più del ritardo. */
const quando = fn => (window.requestIdleCallback
  ? requestIdleCallback(fn, {timeout: 3000}) : setTimeout(fn, 200));
function passo(){
  const f = inCoda.shift();
  /* LA CODA VUOTA È UN MOMENTO, e serve: è quando la rete torna libera
     e si possono chiedere i file pieni delle due famiglie con il lite
     (vedi `alzaEspositori`). */
  if(!f){ codaViva = false; quando(alzaQuelloCheManca); return; }
  if(arrivate.has(f.id)) return passo();
  porta(f).catch(e => console.warn("famiglia non arrivata:", f.id, e))
          .then(() => quando(passo));
}
function avviaCoda(resto){
  inCoda = resto.slice();
  codaViva = true;
  requestAnimationFrame(() => requestAnimationFrame(() => quando(passo)));
}
/* UNA FAMIGLIA CHIESTA PASSA DAVANTI. Toccare un reparto che non è
   ancora sceso non deve essere un tocco muto: si mette in cima alla coda
   e lo si comincia subito. */
function subitoQuesta(f){
  const i = inCoda.findIndex(x => x.id === f.id);
  if(i >= 0) inCoda.splice(i, 1);
  inCoda.unshift(f);
  if(!codaViva){ codaViva = true; quando(passo); }
  return porta(f);
}
/* E IL MENU LO DICE. Il cartellino annuncia l'arrivo — è il posto dove
   l'app parla — e si entra appena il reparto è sul banco. */
function chiediFamiglia(id){
  const f = FAMIGLIE.find(x => x.id === id);
  if(!f) return;
  if(banchi[id] && banchi[id].length){ entra(id); return; }
  scritte(f.nome, "", "arrivano…", "ancora un momento");
  atteso = id;
  subitoQuesta(f).then(() => {
    if(atteso === id && banchi[id] && banchi[id].length) entra(id);
  }).catch(() => {
    if(atteso === id) mostraToast("Questo reparto non è arrivato. Riprova.");
  });
}
let atteso = null;

async function caricaTutto(){
  disponi();
  annuncia("apparecchio il banco…");
  /* IL DENOMINATORE NON SI INDOVINA: impacchetta.py scrive i byte esatti
     di ogni file in assets/manifesto.json. Se manca, la riga resta ferma
     e non mente. */
  try {
    if(DENTRO && DENTRO["manifesto.json"] !== undefined)
      MANIFESTO = JSON.parse(new TextDecoder()
        .decode(await scarica("manifesto.json")));
    else
      MANIFESTO = await (await fetch(VIA + "manifesto.json?v=" + VERSIONE)).json();
  } catch(_) { MANIFESTO = MANIFESTO || {}; }

  /* LA FAMIGLIA DEL LINK SCENDE PER PRIMA. La scorciatoia legge `f`: chi
     apre ?f=orologi non deve aspettare le collane per vedere gli
     orologi. */
  const chiesta = q.get("f");
  const prima = FAMIGLIE.find(f => f.id === chiesta) || FAMIGLIE[0];
  const resto = FAMIGLIE.filter(f => f !== prima);

  if(!caricatore){
    const [{GLTFLoader}, {DRACOLoader}] = await Promise.all([
      import("three/addons/loaders/GLTFLoader.js"),
      import("three/addons/loaders/DRACOLoader.js")]);
    caricatore = new GLTFLoader();
    caricatore.setDRACOLoader(new DRACOLoader().setDecoderPath(DRACO_VIA));
  }

  arrivati = 0;
  attesi = (MANIFESTO[fileDi(prima)] || 0) + (MANIFESTO["grana.jpg"] || 0)
         + (MANIFESTO["ruvidezza.webp"] || 0) + (MANIFESTO[MARCHI[prima.id]] || 0);

  /* LA MATERIA DEGLI ESPOSITORI PRIMA DEL MODELLO, e non è un dettaglio:
     `granaPer` clona queste due per ogni mesh, e un clone fatto su una
     texture ancora vuota resta vuoto. */
  if(!grana.image || grana.image === VUOTA){
    const [bg, br] = await Promise.all([tela("grana.jpg"), tela("ruvidezza.webp")]);
    grana.image = bg; grana.needsUpdate = true;
    ruv.image = br;   ruv.needsUpdate = true;
  }

  await porta(prima);
  avviaCoda(resto);
}

/* IL VELO NON È MAI ETERNO. Prima il Promise.all non aveva .catch e
   GLTFLoader non riceveva un onError: un byte storto e la pagina restava
   a «apparecchio il banco» finché qualcuno non la chiudeva. */
let spia = 0;
function guasto(e, ritenta){
  clearTimeout(spia);
  if(velo){
    if(!velo.isConnected) document.body.appendChild(velo);
    velo.hidden = false;
  }
  annuncia("Non riesco a portare il banco. Controlla la connessione.");
  if(striscia) striscia.style.width = "0%";
  if(riprova){
    riprova.hidden = false;
    /* RIPROVA RITENTA SOLO QUELLO CHE MANCA: `porta` esce subito per le
       famiglie già arrivate, e la materia già in casa non si riscarica. */
    riprova.onclick = () => {
      riprova.hidden = true; arrivati = 0;
      if(striscia) striscia.style.width = "0%";
      annuncia("apparecchio il banco…");
      ritenta();
    };
  }
  console.error(e);
}

function avvia(){
  clearTimeout(spia);
  /* una spia a 45 secondi: la prima tappa a 1,6 Mbps costa 7,6 s, quindi
     quarantacinque sono sei volte il caso peggiore */
  spia = setTimeout(() => { if(velo && !velo.hidden)
    guasto(new Error("nessuna risposta entro 45 s"), avvia); }, 45000);
  caricaTutto().then(() => {
    clearTimeout(spia);
    vaiAlBanco(true);
    if(velo) velo.hidden = true;
    scorciatoia();
    /* I MODELLI SONO IN SCENA: la scocca può smettere di aspettare. Si
       dice QUI e non al primo fotogramma, perché è qui che il velo se
       ne va - cioè il momento in cui il banco esiste per chi guarda. */
    if(window.__dico) window.__dico("banco/pronto", {versione: VERSIONE});
    sveglia();
  }).catch(e => guasto(e, avvia));
}

let LARGO_BANCO = 0.62;

/* ── IL COMANDO DEL COLORE ───────────────────────────────────
   Il materiale ATTRAVERSA da un colore all'altro: non si stacca e si
   riattacca. Un cambio istantaneo si legge come un errore di caricamento —
   sembra che sia successo qualcosa, non che tu abbia scelto. Mezzo secondo
   di passaggio e il pezzo non si muove di un pixel: l'unica cosa che cambia
   è il colore, ed è esattamente quello che si sta provando. */
const vestiDiv = document.getElementById("vesti"), pastiglie = {};
for(const v of VESTI){
  const b = document.createElement("button");
  b.style.setProperty("--tinta", "#" + v.corpo.toString(16).padStart(6, "0"));
  b.title = v.nome; b.setAttribute("aria-label", v.nome);
  b.onclick = () => vestiTi(v.id);
  vestiDiv.appendChild(b);
  pastiglie[v.id] = b;
}
function segnaVesti(){
  for(const v of VESTI) pastiglie[v.id].classList.toggle("qui", v.id === vesteScelta);
}
segnaVesti();

const _da = new THREE.Color(), _a = new THREE.Color(), _ora = new THREE.Color(),
      _velo = new THREE.Color(), BIANCO = new THREE.Color(0xffffff);
let vesteT = 1, tuttiICorpi = null;
function corpiTutti(){
  // si compone una volta sola: durante il passaggio questa lista si
  // percorre trenta volte al secondo, e rifarla ogni volta è spazzatura
  // buttata nel raccoglitore mentre la scena si muove
  if(!tuttiICorpi){
    tuttiICorpi = [];
    for(const f of FAMIGLIE) for(const m of (corpi[f.id] || [])) tuttiICorpi.push(m);
  }
  return tuttiICorpi;
}
function tingi(colore){
  _velo.copy(colore).lerp(BIANCO, 0.42);
  for(const m of corpiTutti()){
    m.color.copy(colore);
    if(m.sheenColor) m.sheenColor.copy(_velo);
  }
}
/* `daFuori` è vero quando la fodera l'ha scelta la SCOCCA e l'ordine è
   arrivato sul canale. Serve a una cosa sola: non rimandarlo indietro.
   Regola 1 del contratto - chi riceve un messaggio non lo rimanda - e
   senza questo la scocca e il banco si passerebbero la stessa fodera
   finché uno dei due non smette. */
function vestiTi(id, daFuori){
  if(id === vesteScelta) return;
  if(!vesteDi(id)) return;
  _da.set(vesteDi(vesteScelta).corpo);
  _a.set(vesteDi(id).corpo);
  vesteScelta = id; vesteT = 0;
  try { localStorage.setItem("regina.veste", id); } catch(_) {}
  segnaVesti();
  if(!daFuori) dico("preferenze/fodera", {fodera:id});
  sveglia();
}

/* ── IL MENU DEI REPARTI ─────────────────────────────────────
   Ha preso il posto delle targhette che galleggiavano sopra gli oggetti: in
   un negozio non c'è scritto «ANELLI» a mezz'aria sopra gli anelli. Qui le
   parole stanno dove stanno in un'app — in basso, sotto il pollice — e
   servono a tre cose insieme: dicono cosa c'è, dicono dove sei, e ci
   portano. */
/* ── I CINQUE SEGNI DELLE FAMIGLIE ─────────────────────────────────
   Disegnati qui perché i reparti del banco non stanno in
   `app/ui/segni.js` — di la' ci sono i segni delle VISTE della scocca.
   Le regole sono le stesse: griglia 24, area viva 20, terminali piatti,
   giunti arrotondati, tratto in pixel di schermo.
   LA SCALA OTTICA `k` È MISURATA, NON DECISA. Quattro disegni con lo
   stesso tratto non pesano uguale: un orologio (cassa, due anse, due
   lancette) deposita un quinto d'inchiostro in più di una collana (una
   curva e un pendente). I numeri escono dalla sonda `_F22_segni.mjs`,
   che rasterizza ogni segno a 48 px e conta i pixel d'inchiostro; la
   forbice è +-12% sulla media, come nella scocca.
   LA COLLANA RESTA A 1 APPOSTA. Il suo `k` di pareggio sarebbe 1,112, e
   a quella scala il pendente uscirebbe dall'area viva (22,6 su 22). Si
   tiene il disegno dentro la griglia e si accetta -10,1% — che nella
   forbice ci sta — invece di rompere l'area per un pareggio perfetto.
   E l'inchiostro della classe «gioielli» pesa l'84% di quella «oggetti»
   della scocca: è un dato, non un errore. Sono cinque profili di filo
   metallico, non cinque scatole chiuse; portarli al peso di un cofanetto
   vorrebbe dire gonfiarli del venti per cento e farli uscire dal 24. */
const SEGNI_FAM = {
  /* l'anello: la fede col cabochon sopra, che è il pezzo vero di Regina */
  anelli: '<circle cx="12" cy="13.9" r="6"/><ellipse cx="12" cy="7.1" rx="3" ry="2.1"/>',
  /* l'orecchino: il gancio, la goccia, e la pietra DENTRO la goccia —
     senza la pietra restava troppo leggero e si confondeva con l'anello */
  orecchini: '<path d="M9.3 7.4a2.7 2.7 0 0 1 5.4 0c0 2.3-2.7 2.9-2.7 4.9"/>' +
             '<circle cx="12" cy="16.2" r="3.9"/><circle cx="12" cy="16.2" r="1.5"/>',
  /* la collana: la curva della catena e il pendente appeso in asse */
  busto: '<path d="M4.5 4.3c0 6.5 3.4 10.4 7.5 10.4s7.5-3.9 7.5-10.4"/>' +
         '<circle cx="12" cy="17.8" r="3.1"/>',
  /* il bracciale: un'ellisse APERTA con i due terminali. Chiusa e tonda
     sarebbe un altro anello; larga e aperta è un bracciale rigido. */
  rampa: '<path d="M17.8 8.4A8 5.6 0 1 0 17.8 15.6"/>' +
         '<circle cx="18.9" cy="7.4" r="1.3"/><circle cx="18.9" cy="16.6" r="1.3"/>',
  /* l'orologio: cassa, due anse, due lancette */
  orologi: '<circle cx="12" cy="12" r="4.6"/>' +
           '<path d="M9.45 7.8 8.85 4.5h6.3l-.6 3.3"/>' +
           '<path d="M9.45 16.2 8.85 19.5h6.3l-.6-3.3"/>' +
           '<path d="M12 9.6V12h2"/>',
};
const K_SEGNI = {anelli:0.995, orecchini:1.042, busto:1, rampa:1.011, orologi:0.872};
function segnoFamiglia(id){
  const d = SEGNI_FAM[id]; if(!d) return "";
  const k = K_SEGNI[id] || 1;
  const g = k === 1 ? d
    : '<g transform="translate(12 12) scale(' + k + ') translate(-12 -12)">' + d + '</g>';
  /* `aria-hidden` sempre: un segno non è un testo, e chi ascolta ha già
     l'etichetta accanto. */
  return '<svg class="segno-filo" viewBox="0 0 24 24" aria-hidden="true">' + g + '</svg>';
}

const menu = document.getElementById("menu"), bottoni = {};
const pista = document.createElement("div");
pista.className = "pista";
menu.appendChild(pista);
for(const f of FAMIGLIE){
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = segnoFamiglia(f.id) + '<span class="nm"></span>';
  b.querySelector(".nm").textContent = f.nome;
  b.onclick = ()=>{ if(attiva === f.id && livello === 1) return; chiediFamiglia(f.id); };
  pista.appendChild(b);
  bottoni[f.id] = b;
}
/* IL LIVELLO SI SCRIVE SULLA RADICE. È il foglio di stile a decidere
   cosa fa la capsula a ogni livello - per esteso, compressa, via - e
   una regola CSS non può leggere una variabile di JavaScript. Si
   chiama da `segnaMenu`, che gira a ogni cambio di livello, e dai
   quattro punti in cui `livello` cambia valore. */
function segnaLivello(){
  const r = document.documentElement;
  if(r.dataset.liv !== String(livello)) r.dataset.liv = String(livello);
}
/* E IL CHIP ATTIVO SI PORTA IN VISTA DA SOLO. Con i segni accanto alle
   parole le cinque voci a 390 punti non ci stanno più su una riga: la
   pista scorre (che è la via dichiarata, «il menu resta scorrevole se
   non ci sta»), e una voce attiva fuori campo sarebbe uno stato che non
   si vede. `scroll-behavior:smooth` sta nel CSS, così chi ha chiesto
   meno movimento lo spegne di la' insieme a tutto il resto. */
function portaInVista(b){
  if(!b || !pista.isConnected) return;
  menu.classList.toggle("scorre", pista.scrollWidth > pista.clientWidth + .5);
  const p = pista.getBoundingClientRect(), r = b.getBoundingClientRect();
  if(r.left >= p.left - .5 && r.right <= p.right + .5) return;
  pista.scrollTo({left: pista.scrollLeft + (r.left + r.width/2) - (p.left + p.width/2),
                  behavior: ridotto ? "auto" : "smooth"});
}
function segnaMenu(){
  segnaLivello();
  const qui = livello === 0 ? davanti : attiva;
  for(const f of FAMIGLIE){
    const b = bottoni[f.id];
    b.classList.toggle("qui", f.id === qui);
    /* IL REPARTO CHE NON È ANCORA SUL BANCO SI VEDE, ma si vede che non
       c'è ancora. Si può toccare — e toccarlo lo porta davanti agli
       altri — ma non finge di essere pronto. */
    b.classList.toggle("attende", !(banchi[f.id] && banchi[f.id].length));
    if(f.id === qui) b.setAttribute("aria-current", "true");
    else b.removeAttribute("aria-current");
  }
  /* la pista si riassesta DOPO che le etichette hanno finito di
     chiudersi, se no si misura una larghezza che fra un attimo non
     esiste più */
  if(bottoni[qui]) setTimeout(() => portaInVista(bottoni[qui]), livello === 0 ? 0 : 380);
}

/* ── LA MACCHINA. Tre distanze, una sola stanza. ─────────────
   Non si cambia schermata: si cambia distanza, e ci si arriva volando. */
let livello = 0, attiva = null, indice = 0, davanti = null, scelto = -1;
const occhio = new THREE.Vector3(), mira = new THREE.Vector3();
const occhioObiettivo = new THREE.Vector3(), miraObiettivo = new THREE.Vector3();

/* La schermata non è tutta visibile, e il quadro va centrato su quello che
   si vede: sotto ci sono il cartellino e il menu, sopra il marchio. */
/* IL SEI PER CENTO NON C'E' PIÙ, NEMMENO AL BANCO. Restava l'ultimo
   numero scritto a mano in questo file: stretto, lo scarto del cromo toglieva
   il 6 per cento dell'altezza di campo - 50 punti su 844 - decisi quando
   il cartellino era una striscia, e da allora il cartellino è cresciuto,
   si ritira, cambia forma fra le tre varianti dei suggerimenti e fra
   telefono e desktop. La banda la sanno `areaUtile`/`bandaPezzo`, che la
   MISURANO sui nodi veri, ed è quello che usano già i livelli 1 e 2.
   Misurato prima di questa riga, al banco: telefono 390x844, il centro
   della fila cadeva 80,1 punti SOPRA il centro della banda - il 12,3 per
   cento della banda; desktop 1440x900, 302,2 punti, il 35,4 per cento.
   E la funzione non c'è più: tolto il sei per cento non restava che un
   rinvio a `scartoVero`, e un rinvio con un altro nome è un posto in cui
   qualcuno rimettera' un numero. Chiamano tutti `scartoVero`. */

/* LA FINESTRA NON È LO SCHERMO. Lo scarto era un sei per cento fisso,
   scritto a mano quando il cartellino era una striscia. Sul pezzo
   il cartellino è alto quasi metà schermo: centrando sul viewport si
   centra su una banda che per metà è coperta - e infatti la collana
   stesa usciva col fondo sotto il cartellino. La banda la dice
   `areaUtile`, che la misura sui nodi veri in tutte e due le forme di
   schermo.
   QUANTO ALZA: il centro della banda sta `q` mezze altezze di schermo
   sopra il centro della tela, e sul piano del bersaglio mezza altezza di
   schermo vale `d*tan(fov/2)`. Abbassando OCCHIO e MIRA della stessa
   quantita' la macchina trasla parallela a se' stessa: il soggetto sale
   di esattamente quei punti, senza che l'inquadratura giri di un grado.
   IL FATTORE 1,97 NON C'E' PIÙ. Correggeva a occhio una cosa vera - il
   centro del RETTANGOLO che il soggetto occupa a schermo non è la
   proiezione del suo centro nello spazio, e su una posa quasi
   perpendicolare all'asse la differenza vale più di cento punti - ma la
   correggeva con un numero solo per cinque famiglie, due pose e tre
   altezze di scheda. Misurato col 1,97 addosso: l'anello finiva 62 punti
   SOPRA il centro della banda (il 10 per cento della banda), e con la
   variante (c) della scheda 119 (il 26 per cento), con la scheda tirata
   su ci passava SOTTO la barra del marchio. Adesso quella differenza si
   MISURA - `inquadraPezzo` e `inquadraFamiglia` proiettano la scatola del
   soggetto col bersaglio della macchina e correggono di quanto sborda -
   e questo qui torna a essere quello che dice di essere: la geometria. */
function scartoVero(d){
  const a = areaUtile();
  const q = (innerHeight / 2 - (a.y0 + a.y1) / 2) / innerHeight;
  return 2 * d * Math.tan(camera.fov * Math.PI / 360) * q;
}

/* ── LA FRAZIONE DI TELA CHE SI VEDE ──────────────────────────────
   Due numeri fra 0 e 1: quanta della larghezza e quanta dell'altezza
   della tela cadono nell'area visibile. Stretto valgono 1 e 1 e nessun
   conto cambia. Largo, a 1440x900 valgono 0,75 e 0,94: un soggetto
   inquadrato per riempire il quadro ne riempirebbe un terzo in più di
   quanto se ne veda, e finirebbe sotto il pannello. */
function fetteUtili(){
  /* E SUL TELEFONO RESTANO UNO. `areaUtile` adesso misura la banda anche
     stretto, e tirarla fin qui sarebbe la conseguenza logica - ma qui non
     si decide DOVE sta il soggetto: si decide QUANTO È GRANDE, e sono
     due domande diverse. Largo il pannello COPRE la scena: quel che gli
     finisce sotto è perso, e il soggetto deve rimpicciolirsi per starne
     fuori. Stretto la scheda sta SOPRA la scena e il cliente ha dato la
     licenza dell'overlap - il pezzo può appoggiarsi sulle schede.
     Dividere per 0,74 qui vorrebbe dire arretrare la macchina di un terzo
     e rimpicciolire la merce per rispettare un confine che il cliente ha
     aperto. La grandezza resta quella della tela; a sistemare la
     posizione ci pensa lo scarto, che la banda la guarda eccome. */
  if(!larga) return {fx:1, fy:1};
  const a = areaUtile();
  return {fx: Math.max(0.2, (a.x1 - a.x0) / innerWidth),
          fy: Math.max(0.2, (a.y1 - a.y0) / innerHeight)};
}

function distanzaPer(largo, alto, margine){
  const v = camera.fov*Math.PI/180;
  /* il soggetto non deve entrare nella tela: deve entrare nell'AREA
     VISIBILE. Dividere la misura per la frazione utile è lo stesso che
     restringere il campo della macchina a quella frazione. */
  const f = fetteUtili();
  const perA = (alto/f.fy*0.5)/Math.tan(v/2);
  const perL = (largo/f.fx*0.5)/(Math.tan(v/2)*camera.aspect);
  return Math.max(perA, perL) * margine;
}

/* ── LA FILA, MA SOLO QUELLA CHE È IN QUADRO ──────────────────
   Al banco la macchina inquadra una finestra larga 24 cm su una fila che
   ne misura 94: la scatola di TUTTA la fila proietta i suoi spigoli
   lontanissimo fuori dallo schermo - misurato a 1440x900, da -2118 a
   +3091 punti - e in prospettiva quegli spigoli lontani SALGONO, quindi
   il centro di quel rettangolo non è il centro di niente che si veda.
   Il soggetto vero è la fila TAGLIATA sul quadro: gli espositori che
   cadono dentro la finestra, alti ciascuno quanto è, da terra alla loro
   cima. È la stessa scatola che si costruisce al livello 1 (tre misure
   in `userData`, non un traverse: dentro il gruppo c'è anche la posa
   stesa, che al banco non si vede e allargherebbe il fondo di mezzo
   metro), solo che qui sono più d'una e si tagliano ai bordi del quadro. */
const _scatolaFila = new THREE.Box3(), _puntoFila = new THREE.Vector3();
function scatolaFila(cx, largoQuadro){
  const x0 = cx - largoQuadro / 2, x1 = cx + largoQuadro / 2;
  _scatolaFila.makeEmpty();
  for(const f of FAMIGLIE){
    const g = gruppi[f.id];
    if(!g) continue;
    const u = g.userData, a = g.position.x - u.largo / 2, b = g.position.x + u.largo / 2;
    if(b < x0 || a > x1) continue;
    _scatolaFila.expandByPoint(_puntoFila.set(Math.max(a, x0), 0, -u.fondo / 2));
    _scatolaFila.expandByPoint(_puntoFila.set(Math.min(b, x1), u.alto, u.fondo / 2));
  }
  return _scatolaFila.isEmpty() ? null : _scatolaFila;
}
window.__scatolaFila = scatolaFila;

let partenzaBanco = 0;
let quadroBanco = null, scartoBanco = 0;
window.__quadroBanco = () => quadroBanco;
window.__scartoBanco = () => scartoBanco;
function vaiAlBanco(subito){
  ombraDaRifare();
  /* DOVE SI TORNA È CASA, NON DOV'ERA. Leggevo la x CORRENTE del gruppo
     per far tornare la macchina davanti alla famiglia da cui si uscliva.
     Funziona per anelli e orologi, dove lo swipe muove la MACCHINA e il
     gruppo non si sposta di un millimetro. Ma collane e bracciali sono
     «scambia»: lì lo swipe muove gli ESPOSITORI, e al secondo pezzo il
     busto sta trentanove centimetri più in la'. Due righe sotto ogni
     famiglia torna a casa — e la macchina restava puntata dove il busto
     era un istante prima, cioè su un pezzo di bancone vuoto.
     Misurato: gruppo a -0,771 durante lo swipe, casa a -0,376, e la
     macchina finiva a -0,771. Casa è l'unico punto che valga per tutti
     e tre i modi. */
  if(attiva && CASA[attiva] !== undefined) partenzaBanco = CASA[attiva];
  else if(attiva && gruppi[attiva]) partenzaBanco = gruppi[attiva].position.x;
  // ogni famiglia torna a casa: uscendo da «scambia» l'espositore era
  // rimasto mezzo fuori quadro, e al banco si vedeva un buco
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach(g => {
    if(CASA[f.id] !== undefined) g.position.x = CASA[f.id]; });
  livello = 0; attiva = null; scelto = -1; segnaLivello();
  voloAlPezzo = false; bandaPezzo = null;
  tocco(); if(!subito) lampo();
  mostraTutto();
  azzeraPizzico();
  let d = distanzaPer(0.24, 0.20, 1.0);
  /* quanto è largo il quadro sul piano del bersaglio, a QUESTA distanza:
     serve a tagliare la fila su quello che si vede, e cambia se la
     distanza cambia */
  const largoQuadro = () => 2 * d * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  /* si piazza per intero a ogni passata, come al livello 1: alzare lo
     scarto abbassa la macchina, e il soggetto sale - ma occhio e mira
     devono muoversi INSIEME, o l'inquadratura gira invece di traslare */
  const piazza = sc => {
    occhioObiettivo.set(partenzaBanco, 0.105 - sc, d);
    miraObiettivo.set(partenzaBanco, 0.082 - sc, 0);
    /* e su schermo largo il banco si centra sulla scena, non sulla tela:
       senza questa riga metà bancone starebbe dietro il pannello */
    const lt = scostaDiLato(d, 0);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); }
  };
  piazza(scartoVero(d));
  /* ── E LARGO SI ARRETRA SE SBORDA, come fa già il pezzo ────────
     `distanzaPer` inquadra la fila come se fosse PIATTA sul piano del
     bersaglio. Non lo è: gli espositori sono profondi 13-15 cm e la
     macchina sta a 37, cioè la faccia davanti è un terzo più vicina
     del punto mirato e si ingrandisce di altrettanto. Misurato a
     1440x900: la fila alta 19,4 cm occupava 1.030 punti su una banda di
     852, cioè non ci stava - e centrarla avrebbe voluto dire infilarne
     la cima sotto la barra dei reparti. Il tetto di `centraSullaBanda`
     lo impediva (giustamente) e il banco restava 97,8 punti sotto il
     centro, l'11,5 per cento.
     La correzione è quella che il livello 2 fa già largo: si proietta
     la scatola con la macchina messa sul bersaglio e, se sborda, si
     arretra della frazione esatta che sborda. Due passate bastano - la
     prima corregge, la seconda verifica - e se ne concede una terza
     perché qui la scatola stessa cambia con la distanza (il quadro si
     allarga e prende più espositori).
     SOLO IN VERTICALE. In orizzontale la fila DEVE uscire dal quadro:
     è una fila che si scorre, e arretrare finché ci sta tutta vorrebbe
     dire mostrare un bancone in miniatura in mezzo alla stanza.
     E SOLO LARGO, come al livello 2: stretto la banda è larga quanto la
     tela e il cliente ha dato la licenza dell'overlap sulle schede. */
  if(larga){
    const au = areaUtile();
    const altoUtile = Math.max(80, au.y1 - au.y0);
    for(let i = 0; i < 3; i++){
      const box = scatolaFila(partenzaBanco, largoQuadro());
      if(!box) break;
      const q = riquadroSulBersaglio(box);
      const k = (q.y1 - q.y0) / (altoUtile * 0.96);
      if(k <= 1) break;
      d *= k;
      piazza(scartoVero(d));
    }
  }
  /* E POI SI GUARDA DOVE È FINITA LA FILA. La geometria mette al centro
     della banda la proiezione del punto mirato - 8,2 cm sopra il piano -
     e quello non è il centro del rettangolo che gli espositori occupano
     a schermo. Le tre passate lo misurano e lo correggono, con lo stesso
     tetto di sicurezza del livello 1: sotto la barra del marchio non ci
     passa niente, nemmeno per centrarsi meglio. */
  {
    const box = scatolaFila(partenzaBanco, largoQuadro());
    if(box) scartoBanco = centraSullaBanda(box, d, camera.fov * Math.PI / 360,
                                           scartoVero(d), piazza, true);
    /* IL QUADRO DEL BANCO SI PUÒ RILEGGERE. Il banco di misura deve
       giudicare la centratura sulla STESSA scatola che la decide: senza
       questa riga misurerebbe la fila intera - i cui spigoli lontani
       cadono a milleduecento punti fuori dallo schermo - e direbbe che
       il banco è storto mentre è centrato. */
    quadroBanco = box ? {min:box.min.toArray(), max:box.max.toArray(),
                         d, largoQuadro:largoQuadro(), cx:partenzaBanco} : null;
  }
  davanti = null;
  for(const f of FAMIGLIE) if(gruppi[f.id] &&
      (!davanti || Math.abs(gruppi[f.id].position.x - partenzaBanco)
                 < Math.abs(gruppi[davanti].position.x - partenzaBanco))) davanti = f.id;
  segnaMenu();
  scritte("Il banco", "", "Gli espositori di Regina, in scala vera.",
          "trascina per scorrere · tocca per entrare");
  /* anche «indietro» se ne va con garbo: era l'unico comando del cromo
     che sparisse di colpo mentre tutto il resto si muoveva */
  if(subito) dietro.hidden = true; else congeda(dietro);
  if(subito){ occhio.copy(occhioObiettivo); mira.copy(miraObiettivo); }
  sveglia();
}

function entra(id){
  ombraDaRifare();
  /* E NON SI ENTRA IN UN REPARTO CHE NON È ANCORA SCESO. Chi ci arriva
     da un link o da una carta passa da `chiediFamiglia`, che lo aspetta;
     qui si chiude la porta e basta. */
  if(!banchi[id] || !banchi[id].length) return;
  /* OGNI FAMIGLIA TORNA A CASA PRIMA. Le copie di una famiglia «scambia»
     restano dove le ha portate lo swipe: se si passa a un'altra categoria
     col menu senza ripassare dal banco, quelle di prima rimangono
     sparpagliate fuori posto. Il banco lo faceva già, entrare no. */
  for(const f of FAMIGLIE) (banchi[f.id] || []).forEach(g => {
    if(CASA[f.id] !== undefined) g.position.x = CASA[f.id]; });
  livello = 1; attiva = id; indice = 0; scelto = -1; segnaLivello();
  voloAlPezzo = false; bandaPezzo = null;
  tocco(); lampo();
  pos = posMeta = posGiu = 0; posV = 0; velDito = 0;
  azzeraPizzico();
  mostraTutto();
  /* IL CARTELLINO SI SCRIVE PRIMA DI INQUADRARE, e non è un riordino di
     comodo. `inquadraFamiglia` centra l'espositore sulla banda fra la
     testata e la CIMA DEL CARTELLINO, misurata; se il cartellino porta
     ancora il testo di prima - entrando dal banco, «Gli espositori di
     Regina, in scala vera» su due righe - si misura una banda che sta per
     cambiare. Misurato: 14 punti di errore sul busto, 18 sulla rampa, e
     lo stesso segno su tutte e cinque, cioè un difetto sistematico e non
     un caso. `mostraScheda` scrive del testo e basta, non tocca la
     macchina: può venire prima senza conseguenze, e il
     `getBoundingClientRect` che viene dopo impagina prima di rispondere.
     `applicaPos` invece resta DOPO l'inquadratura, perché il passo del
     dito e quello del banco li calcola lei. */
  mostraScheda();
  /* E IL «INDIETRO» COMPARE PRIMA DI MISURARE LA TESTATA. #alto è una
     riga flessibile e il marchio ci sta dentro in posizione assoluta,
     cioè fuori dal flusso: col tasto «indietro» ancora nascosto la riga
     non ha contenuto e la testata si riduce ai suoi due padding - 51
     punti invece di 79, e il fondo del cromo cade a 21 invece che a 49.
     Misurato: gli espositori finivano tutti e cinque 14 punti sopra il
     centro della banda, lo stesso numero per geometrie diverse, che è
     la firma di un difetto sistematico. Il tasto c'è già - basta
     accenderlo prima di chiedere quanto è alta la testata. */
  accogli(dietro);
  inquadraFamiglia();
  applicaPos(false);
  segnaMenu();
  sveglia();
}

/* ── SEGUIRE UN SUGGERIMENTO ──────────────────────────────────────
   Le carte attorno al pezzo dicono «con questo ci sta anche l'Anello
   Cabochon, 39 €» e non portavano da nessuna parte. Portarci vuol dire
   fare tre cose in fila, ed è importante che siano in QUEST'ordine:
   si rientra nella famiglia (che rimette a casa gli espositori, riaccende
   quello che era stato velato e azzera il pizzico), ci si sposta sulla
   fermata dove quel pezzo sta, e solo allora lo si apre. Saltare il
   secondo passo lascerebbe la macchina davanti a un altro espositore con
   in mano un pezzo che non è quello inquadrato — che è esattamente il
   difetto già pagato su `mostraScheda`, dove la scheda descriveva la
   partenza invece della destinazione.
   Si passa da `entra` anche quando la famiglia è già quella: cambiare
   pezzo dentro la stessa famiglia senza rientrare lascerebbe spento
   l'espositore che la vela aveva dissolto per il pezzo di prima. */
function vaiAlPezzo(fam, k){
  if(cTolto(fam, k)) return;
  /* IL SUGGERIMENTO PUÒ PUNTARE A UN REPARTO CHE NON È ANCORA SCESO —
     «con questo ci sta anche» attraversa le famiglie, ed è il suo
     mestiere. Allora lo si porta davanti agli altri e ci si va appena
     arriva: mai un cartoncino che non fa niente. */
  if(!merci[fam] || !merci[fam][k]){
    const f = FAMIGLIE.find(x => x.id === fam);
    if(!f || arrivate.has(fam)) return;
    mostraToast("Arrivano " + f.nome.toLowerCase() + "…", {durata: 2400});
    subitoQuesta(f).then(() => { if(merci[fam] && merci[fam][k]) vaiAlPezzo(fam, k); })
                   .catch(() => {});
    return;
  }
  chiudiCarta();
  entra(fam);
  const dove = stazioni(fam).findIndex(g => g.indexOf(k) >= 0);
  if(dove >= 0){ pos = posMeta = posGiu = dove; posV = 0; applicaPos(false); }
  mostraScheda();
  apriPezzo(k);
}

/* L'inquadratura è separata dall'entrare, perché va rifatta quando lo
   schermo cambia forma: sulla prima inquadratura la proporzione della
   macchina era ancora quella di prima del ridimensionamento, e la fila di
   anelli usciva storta e tagliata a destra. */
function inquadraFamiglia(){
  const g = (banchi[attiva] || [])[0];
  if(!g) return;
  const u = g.userData;
  const alto = u.alto + 0.022;
  /* NON SI INQUADRA TUTTO L'ESPOSITORE. Su uno schermo verticale è la
     LARGHEZZA a decidere la distanza: per far stare in quadro cinque anelli
     la macchina arretrava tanto che la merce prendeva un quinto
     dell'altezza. Si inquadra una FINESTRA della fila, e sono gli altri a
     entrare quando ci si sposta. Dove invece l'espositore è uno solo e
     cambia per intero, si inquadra tutto. */
  const quanti = stazioni(attiva).length, modo = MODI[attiva];
  /* E UNA «CAMMINA» NON PUÒ AVERE TUTTO IN QUADRO. Con tre orologi la
     finestra era 3,0 su 3 stazioni: l'espositore ci stava tutto, e lo
     swipe spostava la macchina di un passo senza che entrasse o uscisse
     niente — un gesto che non cambia nulla si legge come un gesto
     casuale. La finestra resta sotto il numero delle stazioni, così c'è
     sempre qualcosa da raggiungere. */
  const finestra = modo === "cammina" ? Math.min(3.0, quanti * 0.78)
                 : modo === "salta" ? 1.7 : quanti;
  const largo = u.largo * Math.min(1, finestra / quanti) + 0.016;
  /* LO SCARTO PARTE DALLA BANDA, non da un sei per cento. Lo scarto del
     cromo stretto toglieva 0,06 di altezza di campo - 50 punti su 844 - scritti
     a mano quando il cartellino era una striscia. Misurato prima di
     questa riga: gli anelli finivano 130 punti SOTTO il centro della
     banda (il 21 per cento della banda), la rampa 87, gli orologi 81. */
  const d = distanzaPer(largo, alto * 1.26, 1.02);
  /* QUANTO SI SPOSTA UN ESPOSITORE CHE ESCE. Il passo lo prendevo dalla
     larghezza del mobile più cinque centimetri, e a metà swipe non si
     vedeva NIENTE: il primo era già uscito e il secondo non era ancora
     entrato, perché il quadro è più stretto di due busti affiancati. Il
     passo giusto è la LARGHEZZA DEL QUADRO, appena più corta, così uno
     esce mentre l'altro entra e in mezzo non c'è mai il vuoto. */
  const larghezzaVista = 2 * d * Math.tan(camera.fov*Math.PI/360) * camera.aspect;
  if(MODI[attiva] === "scambia")
    PASSO_BANCO[attiva] = larghezzaVista * 0.94;
  /* IL PASSO DEL DITO, PER QUESTA FAMIGLIA. Quanti pixel di schermo
     percorre una stazione: sulle collane è la larghezza del quadro meno
     un soffio, sugli anelli il passo fra due colonnine. Da qui in poi il
     dito muove la scena uno a uno in tutte e cinque. */
  {
    let passoMondo;
    if(MODI[attiva] === "scambia") passoMondo = PASSO_BANCO[attiva];
    else {
      const c = CENTRI[attiva] || [];
      let somma = 0, quante = 0;
      for(let i = 1; i < c.length; i++){ somma += Math.abs(c[i] - c[i-1]); quante++; }
      passoMondo = quante ? somma / quante : larghezzaVista * 0.3;
    }
    PASSO_DITO = Math.max(26, passoMondo * innerWidth / larghezzaVista);
  }
  const cx = CASA[attiva] !== undefined ? CASA[attiva] : g.position.x;
  const piazza = sc => {
    if(SGUARDO[attiva] === "alto"){
      const my = u.alto * 0.80 - sc;
      occhioObiettivo.set(cx, my + d*Math.sin(INCLINA), d*Math.cos(INCLINA));
      miraObiettivo.set(cx, my, -0.02);
    } else {
      occhioObiettivo.set(cx, alto*0.56 - sc, d);
      miraObiettivo.set(cx, alto*0.47 - sc, -0.04);
    }
    /* l'espositore si centra sull'area visibile: il suo passo, appena
       calcolato sulla larghezza del quadro, resta giusto — la macchina
       trasla parallela, non cambia campo. */
    const lt = scostaDiLato(d, 0);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); }
  };
  piazza(scartoVero(d));
  /* E POI SI GUARDA DOVE È FINITO. Il punto mirato sta al 47 o all'80 per
     cento dell'altezza del mobile, non al suo centro: lo scarto geometrico
     centra QUEL punto, non il rettangolo dell'espositore, e sulla rampa
     inclinata i due distano più di ottanta punti. La scatola del mobile
     non si traversa, si costruisce: `metti` lo appoggia con la base a
     zero e centrato in x e z, quindi le tre misure di `userData` la
     dicono per intero - e dentro il gruppo c'è anche la posa stesa, che
     al banco non si vede e che un traverse conterebbe.
     Il tetto di `centraSullaBanda` è quello che tiene gli espositori
     INTERI: gli orecchini sfioravano già la barra a otto punti, e
     centrarli senza tetto li avrebbe infilati sotto il marchio. */
  _scatolaFam.min.set(cx - u.largo / 2, 0, -u.fondo / 2);
  _scatolaFam.max.set(cx + u.largo / 2, u.alto, u.fondo / 2);
  centraSullaBanda(_scatolaFam, d, camera.fov * Math.PI / 360,
                   scartoVero(d), piazza);
}

/* ── IL PEZZO DA SOLO ────────────────────────────────────────
   Toccare un gioiello lo porta davanti NEL VUOTO: l'espositore sparisce —
   non si allontana, sparisce — e resta il pezzo che galleggia, con la
   stanza sfocata dietro. È quello che fa un gioielliere quando tira fuori
   una cosa dalla vetrina: sparisce tutto il resto.
   Non c'è nessuna fotografia di mezzo. È lo STESSO oggetto che stava sul
   mobile un istante fa, e si vede che è lo stesso. */
/* ════════════════════════════════════════════════════════════
   LA CATENA PIENA, SOLO SUL PEZZO CHE SI STA GUARDANDO

   Al banco e in selezione le collane e i bracciali sono i loro `.lite`
   (vedi `FAMIGLIE`): un terzo dei triangoli, e a quella distanza la
   maglia è larga due pixel. Al livello 2 il pezzo riempie lo schermo e
   la maglia si conta a occhio, quindi lì - e SOLO sul pezzo scelto -
   arriva la geometria piena.

   Tre cose, in quest'ordine, e ognuna per una ragione misurata:
   1. IL FILE PIENO SCENDE IN CODA, non sotto il dito. `quando` è
      `requestIdleCallback`: 347 KB di busto scaricati nel fotogramma del
      tocco sono il volo della macchina che salta, e il salto si vede
      più del ritardo.
   2. SI SCAMBIA LA GEOMETRIA, NON L'OGGETTO. `merci`, `pose`, `boxP`,
      `CENTRI` e `userData.pezzi` tengono tutti un RIFERIMENTO a quella
      mesh: sostituire l'oggetto vorrebbe dire rincorrere sei tabelle, ed
      è la forma in cui un riferimento resta indietro. La mesh resta la
      stessa e cambia `geometry`.
   3. LA DISSOLVENZA È INCROCIATA, 250 ms. Uno scambio secco si legge
      come un errore di caricamento - «succede qualcosa» - e non come un
      pezzo che si mette a fuoco. Per incrociare servono le due
      geometrie A SCHERMO INSIEME: la piena entra come mesh GEMELLA
      (stesso posto, stessa materia, opacita' da 0 a 1) mentre la lite
      esce da 1 a 0; a fine corsa la lite prende la geometria piena, la
      gemella sparisce e non resta niente di temporaneo in scena.
      IL MATERIALE SI CLONA PER LA DURATA. Le tre copie del busto
      CONDIVIDONO il materiale del gioiello - `clone(true)` di three
      condivide geometrie e materiali, e `apparecchia` ne clona solo
      quelli metallici delle copie con un metallo dichiarato: scolorare
      quello spegnerebbe anche le altre due collane sul banco. Si clona,
      si anima il clone, e alla fine si rimette quello di prima.
   ═══════════════════════════════════════════════════════════ */
const DISSOLVE_MS = 250;
const PIENE = {};          // famiglia -> {pezzo:[geometria], posa:[geometria]}
const pieneChieste = {};   // famiglia -> la Promise in corso
const pienoAddosso = new Set();   // "famiglia:indice" già scambiati
let dissolvenze = [];
/* ── I RITI ────────────────────────────────────────────────────
   Le scene che DURANO: il pezzo che entra nel vano, il pezzo che ne esce.
   Stanno qui accanto alle dissolvenze perché sono lo stesso mestiere —
   qualcosa che corre su una linea del tempo mentre il ciclo disegna — e
   perché `gira()` le legge, e `gira()` è scritto più sopra: un `const`
   dichiarato dopo la funzione che lo usa è un errore di accesso in zona
   morta, non un valore indefinito. Qui è dichiarato prima di tutto,
   quindi non può esserlo. */
const RITI = [];
/* e se il cofanetto è VUOTO lo si sa da qui in giu': `applicaTolti` deve
   poterlo chiedere, e `applicaTolti` gira durante il caricamento — cioè
   prima che il blocco della fase 3 sia stato valutato. Un `let` dichiarato
   la' sotto sarebbe in zona morta proprio nel momento in cui serve. */
let cofanettoVuoto = false;
const listaMat = m => Array.isArray(m) ? m : [m];

function chiediPiena(fam){
  if(PIENE[fam]) return Promise.resolve(PIENE[fam]);
  if(pieneChieste[fam]) return pieneChieste[fam];
  const f = FAMIGLIE.find(x => x.id === fam);
  if(!f || !f.lite || !caricatore) return Promise.resolve(null);
  const p = new Promise(ok => quando(() => {
    scarica(f.glb)
      .then(buf => new Promise((si, no) => caricatore.parse(buf, "", si, no)))
      .then(g => {
        /* si tengono le GEOMETRIE e si butta il resto: materiali e nodi
           del file pieno non servono - quelli in scena sono già vestiti
           da `metti` e da `apparecchia`, e portarsi dietro i loro
           duplicati vorrebbe dire due materiali per lo stesso oro. */
        const pezzo = [], posa = [], mostra = {};
        g.scene.traverse(o => {
          if(!o.isMesh || !o.geometry) return;
          const n = o.name || (o.parent && o.parent.name) || "";
          if(/^pezzo\d\d/.test(n)) pezzo.push(o.geometry);
          else if(/^posa\d\d/.test(n)) posa.push(o.geometry);
          /* e l'ESPOSITORE, per nome (`busto`, `plinto`, `rampa`): vedi
             `alzaEspositori` qui sotto - la merce regge il lite, la forma
             del busto no */
          else if(n) mostra[n] = o.geometry;
        });
        ok(PIENE[fam] = {pezzo, posa, mostra});
      })
      .catch(e => { console.warn("catena piena non arrivata:", fam, e); ok(null); });
  }));
  return (pieneChieste[fam] = p);
}

/* le mesh di un nodo accoppiate alle geometrie piene, nell'ordine in cui
   il traverse le incontra. Se i due conti non combaciano non si scambia
   niente: due file che non hanno la stessa forma non sono lo stesso
   pezzo, e mettere la maglia di una collana su un'altra è peggio che
   restare lite. */
function accoppia(radice, geometrie){
  if(!radice || !geometrie || !geometrie.length) return null;
  const mesh = [];
  radice.traverse(o => { if(o.isMesh) mesh.push(o); });
  if(mesh.length !== geometrie.length){
    console.warn("catena piena: " + mesh.length + " mesh contro "
                 + geometrie.length + " geometrie");
    return null;
  }
  return mesh.map((m, i) => [m, geometrie[i]]);
}

function dissolvi(coppie){
  const voci = [];
  for(const [m, g] of coppie){
    if(!m || !g || m.geometry === g || !m.parent) continue;
    const cloni = listaMat(m.material).map(x => x.clone());
    const gemella = new THREE.Mesh(g, Array.isArray(m.material) ? cloni : cloni[0]);
    gemella.name = m.name + "-pieno";
    gemella.position.copy(m.position);
    gemella.quaternion.copy(m.quaternion);
    gemella.scale.copy(m.scale);
    /* la gemella vive 250 ms: non deve rifare la mappa d'ombra né
       entrare nelle tabelle su cui gira `chiOmbra` */
    gemella.castShadow = false; gemella.receiveShadow = m.receiveShadow;
    gemella.renderOrder = 1;
    for(const x of cloni){ x.transparent = true; x.depthWrite = false; x.opacity = 0; }
    const prima = m.material;
    const suo = listaMat(prima).map(x => x.clone());
    m.material = Array.isArray(prima) ? suo : suo[0];
    for(const x of suo) x.transparent = true;
    m.parent.add(gemella);
    voci.push({m, g, gemella, prima, suo, cloni});
  }
  if(!voci.length) return;
  dissolvenze.push({t:0, voci});
  sveglia();
}

function passoDissolvenze(dt){
  for(let i = dissolvenze.length - 1; i >= 0; i--){
    const d = dissolvenze[i];
    d.t = Math.min(1, d.t + dt * 1000 / DISSOLVE_MS);
    /* la stessa curva del cambio di fodera: uno smoothstep, che parte e
       arriva senza spigoli - una rampa lineare su un'opacita' si vede
       partire */
    const e = d.t * d.t * (3 - 2 * d.t);
    for(const v of d.voci){
      for(const x of v.cloni) x.opacity = e;
      for(const x of v.suo) x.opacity = 1 - e;
    }
    if(d.t >= 1){
      for(const v of d.voci){
        v.m.geometry = v.g;
        v.m.material = v.prima;
        if(v.gemella.parent) v.gemella.parent.remove(v.gemella);
        for(const x of v.cloni) x.dispose();
        for(const x of v.suo) x.dispose();
      }
      dissolvenze.splice(i, 1);
      /* la maglia piena getta un'ombra diversa da quella lite: la mappa
         si rifa' una volta, alla fine, non a ogni fotogramma */
      ombraDaRifare();
    }
  }
}

/* IL PEZZO SCELTO CHIEDE LA SUA CATENA. Si chiama dall'apertura del
   pezzo; se nel frattempo si è usciti, o si è passati a un altro
   pezzo, non si scambia niente - il lite a mezzo metro di distanza è
   esattamente quello che deve stare lì. */
function chiediCatenaPiena(fam, k){
  const f = FAMIGLIE.find(x => x.id === fam);
  if(!f || !f.lite) return;
  const chiave = fam + ":" + k;
  if(pienoAddosso.has(chiave)) return;
  chiediPiena(fam).then(P => {
    if(!P) return;
    if(livello !== 2 || attiva !== fam || scelto !== k) return;
    if(pienoAddosso.has(chiave)) return;
    pienoAddosso.add(chiave);
    const coppie = [];
    const a = accoppia((merci[fam] || [])[k], P.pezzo);
    if(a) coppie.push(...a);
    const b = accoppia((pose[fam] || [])[k], P.posa);
    if(b) coppie.push(...b);
    dissolvi(coppie);
  });
}
/* ════════════════════════════════════════════════════════════
   L'ESPOSITORE NON REGGE IL LITE, LA CATENA SI'.

   Il `.lite` non decima solo la maglia: decima tutta la scena, e dentro
   c'è anche il busto - una forma LISCIA e grande, dove i triangoli non
   fanno il dettaglio, fanno la CURVA. Misurato al livello 1, telefono
   390, sul riquadro proiettato della collana: la luminanza media scende
   da 60,11 a 56,86 (-5,40 per cento, sopra il tre che questo lavoro si
   è dato), e lo scarto non è sparso - nel terzo ALTO del riquadro, che
   è il collo e il bordo cucito del busto, vale -12,27 per cento. Messe
   una accanto all'altra alla scala vera, la spalla del busto lite si
   rompe in sfaccettature e sotto il colletto compare una piega che nel
   pieno non c'è. La maglia, invece, è indistinguibile: il 99 per cento
   dei pixel della catena non si sposta di dieci livelli.
   Quindi il lite resta quello che scende per primo - il velo si toglie
   con 139,8 KB invece di 346,9, ed è tutto il senso dell'operazione -
   ma appena la coda delle cinque famiglie è vuota si chiede il file
   pieno e l'ESPOSITORE prende la sua geometria vera. Le catene restano
   lite: quelle si alzano una per volta, solo sul pezzo che si apre.

   E QUESTO SCAMBIO NON SI DISSOLVE. La dissolvenza incrociata ha un
   prezzo che sul gioiello non si paga e sull'espositore si': per
   incrociare due opacita' il materiale deve diventare `transparent`, e
   un oggetto trasparente esce dalla passata degli opachi per entrare in
   quella ordinata per profondita' - cioè si disegna DOPO la collana che
   gli sta davanti. Per 250 ms il busto passerebbe sopra il suo gioiello.
   Lo scambio secco su una forma liscia, alla scala del banco, è invece
   un cambio di sfumatura su una superficie che non si sta guardando: si
   fa, e si fa una volta sola per famiglia.
   Da `window.__espositoriPieni = false` si spegne, e il banco resta
   interamente lite: serve a rimisurare i due stati senza toccare il
   file.
   ════════════════════════════════════════════════════════════ */
/* e si LEGGE prima di scriverlo: una sonda che lo mette a false con un
   `evaluateOnNewDocument` scrive prima che il modulo giri, e un
   `= true` secco cancellerebbe la prova invece di farla */
window.__espositoriPieni = window.__espositoriPieni !== false;
const espositoriAlzati = new Set();
function alzaEspositori(fam){
  if(!window.__espositoriPieni || espositoriAlzati.has(fam)) return;
  const f = FAMIGLIE.find(x => x.id === fam);
  if(!f || !f.lite) return;
  chiediPiena(fam).then(P => {
    if(!P || !P.mostra || espositoriAlzati.has(fam)) return;
    espositoriAlzati.add(fam);
    let quante = 0;
    /* TUTTE le copie, non solo la prima: `clone(true)` condivide le
       geometrie, ma `geometry` è una proprietà della mesh e va riscritta
       su ognuna - la seconda collana del banco resterebbe sfaccettata
       accanto alla prima, che è peggio che averle sfaccettate tutte e
       tre. */
    for(const g of (banchi[fam] || []))
      g.traverse(o => {
        if(o.isMesh && P.mostra[o.name] && o.geometry !== P.mostra[o.name]){
          o.geometry = P.mostra[o.name]; quante++;
        }
      });
    if(quante){ ombraDaRifare(); sveglia(); }
  });
}
/* QUANDO. Non al primo fotogramma - lì le altre quattro famiglie devono
   ancora scendere, e 347 KB davanti a loro sono il banco che si apparecchia
   più tardi. Quando la coda è vuota: `passo()` lo dice. */
function alzaQuelloCheManca(){
  for(const f of FAMIGLIE) if(f.lite && arrivate.has(f.id)) alzaEspositori(f.id);
}

window.__piene = PIENE; window.__pienoAddosso = pienoAddosso;
window.__espositoriAlzati = espositoriAlzati;
window.__alzaOra = alzaQuelloCheManca;
window.__dissolvenze = () => dissolvenze.length;

let giroP = 0, altP = 0.12, raggioP = 0.02;
/* IL QUADRO DECISO AL TOCCO: la distanza e lo scarto della banda. Sono
   il risultato di una MISURA (due passate largo, tre sulla banda
   stretto) e si calcolano una volta sola, prima che la molla parta. */
let quadroD = 0, quadroSc = 0;
/* VERO DAL TOCCO FINO ALL'ARRIVO. Finché è vero il bersaglio non lo
   sposta nessuno: niente correzioni ritardate, niente dondolo. */
let voloAlPezzo = false;
const boxP = new THREE.Box3();
/* la scatola dell'espositore, riusata: si riscrive a ogni inquadratura di
   famiglia e non si alloca niente dentro un conto che il ridimensionamento
   può chiamare a ogni fotogramma */
const _scatolaFam = new THREE.Box3();
const _ang = new THREE.Vector3();
const centroP = new THREE.Vector3();

function apriPezzo(k){
  ombraDaRifare();
  if(k == null || k < 0 || !merci[attiva] || !merci[attiva][k]) return;
  /* un pezzo uscito dal cofanetto non si apre: le sue mesh sono spente e
     la carta descriverebbe una cosa che non c'è — la stessa ragione per
     cui `pezzoVicino` salta i pezzi invisibili */
  if(cTolto(attiva, k)) return;
  livello = 2; scelto = k; segnaLivello();
  tocco(); lampo();
  azzeraPizzico();
  /* ── DA QUI IL BERSAGLIO È CHIUSO ─────────────────────
     La banda si ferma PRIMA che il cartellino cambi testo e si ritiri
     (vedi `areaUtile`), e `voloAlPezzo` chiude la porta a tutti: alla
     riquadratura ritardata della scheda, al dondolo, a chiunque voglia
     spostare la mira a volo iniziato. Metà del verdetto del cliente —
     «incoerenza fra la posizione di partenza e quella di fine» —
     nasceva qui: il bersaglio cambiava mentre la molla volava. L'altra
     metà è il pezzo che cambia POSA (vedi `avviaPosa`). */
  bandaPezzo = misuraArea();
  voloAlPezzo = true;
  /* DA CHE ALTEZZA SI GUARDA IL PEZZO DA SOLO. Un gioiello che sta in
     piedi lo si guarda quasi in faccia; uno STESO si guarda di SOPRA.
     Avevo scritto quaranta gradi per paura di appiattirlo, ed era il
     ragionamento rovesciato: più si sta bassi, PIÙ la lunghezza si
     accorcia. Misurato, la posa disegnata con un rapporto 2,20 arrivava
     a schermo a 1,12 — cioè un cerchio, due righe sopra la scritta
     «45 cm». A settanta gradi il seno vale 0,94 e il rapporto resta.
     È anche l'alzata con cui i cataloghi fotografano una catena stesa:
     la posa serve a mostrare lo SVILUPPO. */
  /* E QUESTO NON È UNO SCATTO. `giroP` non è la rotazione del pezzo a
     schermo: è l'azimut a cui la macchina si mettera' ATTORNO al pezzo,
     cioè il bersaglio. A zero vale «da davanti», che è esattamente la
     direzione da cui la macchina sta già guardando l'espositore — la
     rotazione a schermo, quindi, non cambia di un grado nel fotogramma
     del tocco. Il dondolo invece parte da fermo e resta fermo finché il
     volo non è finito (vedi `voloAlPezzo` nel ciclo): misurato prima,
     giroP saliva a 0,027 rad durante il volo e a 0,095 dopo due secondi
     e mezzo, e quella deriva spostava il bersaglio a ogni fotogramma. */
  giroP = 0; dondolo = 0; giroBase = 0; giroV = 0;
  altP = stesa(attiva, k) ? 1.22 : 0.12;
  cartello.classList.add("pezzo");
  isolaPezzo();
  /* E LA CATENA CHIEDE IL SUO PESO PIENO. Qui e non più tardi perché il
     file va messo in coda SUBITO - così i 347 KB viaggiano mentre la
     macchina vola - ma lo scambio avviene solo quando arriva, e solo se
     si è ancora su questo pezzo. */
  chiediCatenaPiena(attiva, scelto);
  /* LE MATRICI PRIMA DELLA MISURA. Il riquadro di un oggetto si calcola
     sulla sua posizione nel MONDO, e quella la sanno le matrici dei padri:
     se non sono aggiornate il riquadro esce vuoto, il centro finisce
     all'origine e la macchina si pianta dentro il pavimento a due
     centimetri dal nulla. Sembra che il pezzo sia sparito, e invece è
     rimasto dov'era. */
  scena.updateMatrixWorld(true);
  const p = stesa(attiva, scelto) || merci[attiva][scelto];
  const b = new THREE.Box3().setFromObject(p);
  boxP.copy(b);
  b.getCenter(centroP);
  raggioP = Math.max(0.004, b.getSize(new THREE.Vector3()).length() / 2);
  // qui il taglio netto È giusto: le carte si rifanno due righe più giu'
  togliInsieme(true);
  /* E QUI NON SI INQUADRA PIÙ. Si inquadrava due volte — una adesso e
     una dopo il cartellino — a qualche fotogramma di distanza: due
     bersagli sono due voli, e il secondo parte da dove il primo stava
     passando. Prima si scrive tutto quello da cui il quadro dipende, poi
     lo si decide UNA volta, in fondo. */
  const r = RIPIANI[attiva][scelto] || ["", "", ""];
  /* E QUI LA RIGA DICEVA LA COSA SBAGLIATA. «tocca fuori per uscire»:
     l'unica istruzione data sul pezzo era come ANDARSENE, e non si
     nominava mai il fatto che il pezzo stesso si tocca — cioè la porta
     su tutto quello che con quel pezzo si può fare. Chi seguiva
     l'istruzione usciva e non vedeva mai le azioni. Per uscire ci sono
     già tre strade evidenti (il tasto in alto, il pizzico all'indietro,
     il tocco fuori); quella che va insegnata è l'altra. */
  scritte(r[0], r[2] + " €", r[1],
          "trascina per girare · tocca il pezzo per la sua carta");
  /* DOPO le scritte: `scritte` spegne l'insieme a ogni cartellino nuovo, ed
     è giusto che lo faccia — ma allora chi lo accende deve venire dopo. */
  mostraInsieme();
  fondo.classList.add("apribile");
  scheda(true);
  accogli(dietro);
  /* ── ADESSO, E UNA VOLTA SOLA ────────────────────────
     Tutto quello da cui il quadro dipende è già a posto: la posa, la
     scatola del pezzo, il testo del cartellino, il tasto «indietro»
     nella testata. Da questa riga fino all'arrivo il bersaglio è quello
     e basta. */
  inquadraPezzo();
  /* e la posa si stacca DOPO che il bersaglio esiste: viaggia con la
     macchina, e per farlo deve sapere quanta strada la macchina ha */
  avviaPosa(-1);
  sveglia();
}

function inquadraPezzo(soloGiro){
  /* si inquadra sulla SFERA del pezzo, e sul lato PIÙ STRETTO dello
     schermo: in verticale è la larghezza a tagliare, e una creola da 18 mm
     inquadrata sull'altezza uscirebbe mozza ai fianchi. */
  /* e il campo che conta è quello VISIBILE. Stretto le due frazioni
     valgono uno e questi due angoli sono quelli di sempre. Largo, il
     mezzo campo orizzontale si riduce della fetta che il pannello si
     prende (a 1440 il 25 per cento) e quello verticale della barra: il
     pezzo viene inquadrato per riempire la scena, non la tela — se no
     riempie la tela e un quarto di lui finisce dietro il pannello. */
  const fu = fetteUtili();
  const mezzoV = Math.atan(Math.tan(camera.fov*Math.PI/360) * fu.fy);
  const mezzoO = Math.atan(Math.tan(camera.fov*Math.PI/360) * camera.aspect * fu.fx);
  /* e il margine si stringe sul pezzo steso: la sfera che lo contiene ha
     il raggio della sua DIAGONALE, ma di larghezza ne occupa metà — con
     lo stesso margine di un pezzo in piedi resterebbe un francobollo in
     mezzo al vuoto. */
  const r = raggioQuadro || raggioP;
  let d;
  if(stesa(attiva, scelto) && !raggioQuadro){
    /* LA POSA SI INQUADRA A SCALA, NON A RIEMPIMENTO. Con lo stesso
       riempimento il bracciale da 19 cm prendeva il 55 per cento della
       larghezza e la collana da 45 il 39: in una gioielleria è un errore
       che si vede subito. Qui il quadro cresce con la RADICE del pezzo, che
       è il compromesso dei cataloghi: il piccolo resta leggibile, il
       grande resta più grande. */
    d = (0.044 + r * 0.47) / Math.sin(Math.min(mezzoV, mezzoO));
  } else {
    d = r / Math.sin(Math.min(mezzoV, mezzoO)) * 1.35;
  }
  /* ── LA SPINTA NON PUÒ SPINGERE FUORI ────────────────────────
     `scartoVero` alza il pezzo perché stia in mezzo alla banda che si
     VEDE — quella fra la testata e il cartellino — e la spinta cresce
     con l'altezza del cartellino. Con la scheda bassa di sempre valeva
     0,35 mezze altezze di campo e andava bene. Ma il cartellino non ha
     un'altezza sola: la variante (c) dei suggerimenti ci mette dentro un
     rail, il cartellino arriva a 359 punti, e la spinta saliva a 0,73
     mezze altezze — misurato, l'anello usciva TAGLIATO dalla cima dello
     schermo. Una spinta che porta il soggetto fuori dall'inquadratura
     non è una spinta, è un errore: si limita a quanto basta perché il
     bordo alto del pezzo resti dentro, con un filo d'aria (il 6 per
     cento). Con le altezze di sempre il tetto non tocca niente. */
  /* LO SCARTO ESCE DA `piazza`, e non è un riordino: la centratura
     misurata deve poter rimettere la macchina allo stesso posto con uno
     scarto DIVERSO, senza ricalcolare la distanza. */
  const scartoBase = dd => {
    const hv = dd * Math.tan(mezzoV);
    return Math.min(scartoVero(dd), Math.max(0, hv * 0.94 - r));
  };
  const piazza = (dd, sc) => {
    occhioObiettivo.set(
      centroP.x + dd * Math.cos(altP) * Math.sin(giroP),
      centroP.y + dd * Math.sin(altP) - sc,
      centroP.z + dd * Math.cos(altP) * Math.cos(giroP));
    miraObiettivo.set(centroP.x, centroP.y - sc, centroP.z);
    /* il pezzo si porta al centro della SCENA. Lo scostamento segue il giro
       del dito — la macchina orbita, e «di lato» ruota con lei — così il
       gioiello resta nello stesso punto dello schermo per tutto il giro
       invece di scivolare verso il pannello a un quarto di rotazione. */
    const lt = scostaDiLato(dd, giroP);
    if(lt){ occhioObiettivo.add(lt); miraObiettivo.add(lt); }
  };
  /* ── IL DONDOLO GIRA, NON RIQUADRA ─────────────────────
     Chiamata con `soloGiro` la funzione non ridecide niente: rimette la
     macchina attorno al pezzo con la distanza e lo scarto già decisi,
     al giro di adesso. Serve al dondolo, che al livello del pezzo passa
     di qui sessanta volte al secondo per dodici secondi.
     Misurato prima di questa riga, col banco _T_: il bersaglio si
     spostava di 0,0002-0,0003 metri a OGNI fotogramma, su tutte e cinque
     le famiglie, per tutti i dodici secondi del dondolo — perché
     `centraSullaBanda` rifaceva il conto su un rettangolo che il giro
     stava ruotando. Un bersaglio che non sta mai fermo non è un
     bersaglio. Il dondolo è un'oscillazione della MACCHINA attorno al
     soggetto: il soggetto non si deve muovere di un punto, e adesso fra
     gli 800 ms e i due secondi e mezzo si sposta di 0,03-0,67 punti. */
  if(soloGiro && quadroD){ piazza(quadroD, quadroSc); return; }
  piazza(d, scartoBase(d));
  /* ── E POI SI MISURA, INVECE DI FIDARSI ───────────────────
     Il conto qui sopra inquadra una SFERA, e per la posa stesa nemmeno
     quella: inquadra una scala, cioè una misura fisica del pezzo. Vanno
     bene tutte e due — è così che si fotografa un gioiello — ma nessuna
     delle due garantisce che il rettangolo che il pezzo occupa a schermo
     stia dentro l'area visibile: misurato a 1280x720, la collana da 45 cm
     occupava da 65 a 729 punti su una banda che finisce a 720.
     Quando l'area visibile è tutto lo schermo questo non si può nemmeno
     verificare senza cambiare cio' che il telefono fa già bene, quindi la
     correzione vale SOLO largo: si proietta la scatola del pezzo con una
     macchina di prova messa sul bersaglio (la vera sta ancora volando), e
     se sborda si arretra della frazione esatta che sborda. Due passate
     bastano: la prima corregge, la seconda verifica. */
  if(larga && !boxP.isEmpty()){
    const a = areaUtile();
    const largoUtile = Math.max(80, a.x1 - a.x0), altoUtile = Math.max(80, a.y1 - a.y0);
    for(let i = 0; i < 2; i++){
      const q = riquadroSulBersaglio();
      const k = Math.max((q.x1 - q.x0) / (largoUtile * 0.96),
                         (q.y1 - q.y0) / (altoUtile * 0.96));
      if(k <= 1) break;
      d *= k;
      piazza(d, scartoBase(d));
    }
  }
  /* e stretto si misura DOVE CADE, non quanto è grande: la banda è già
     larga quanto la tela (vedi `fetteUtili`) e il pezzo può stare in
     overlap sulle schede - quello che non può fare è restare appeso in
     cima con mezzo schermo di crema sotto. */
  const scFine = centraSullaBanda(boxP, d, mezzoV, scartoBase(d), sc => piazza(d, sc));
  /* e il quadro si RICORDA: da qui in poi il dondolo lo riusa invece di
     ricalcolarlo (vedi `soloGiro` qui sopra) */
  quadroD = d; quadroSc = scFine === undefined ? scartoBase(d) : scFine;
}

/* ── IL SOGGETTO SI CENTRA SULLA BANDA, MISURANDO ──────────────
   La geometria di `scartoVero` mette al centro della banda la PROIEZIONE
   DEL CENTRO della scatola. Non è la stessa cosa del centro del
   RETTANGOLO che il soggetto occupa a schermo: in prospettiva la metà
   lontana di un oggetto si rimpicciolisce e sale, quella vicina scende, e
   su una posa stesa guardata da settanta gradi la differenza misurava
   139 punti. Il vecchio 1,97 era la media di quell'errore su un caso
   solo. Qui invece si guarda: si proietta la scatola col bersaglio della
   macchina, si vede dove cade il rettangolo, e si sposta lo scarto di
   quanti punti mancano. Una passata corregge, la seconda verifica; alla
   terza si è sotto il mezzo punto e si esce.
   IL TETTO. Il cliente ha dato la licenza dell'OVERLAP - il pezzo può
   appoggiarsi sulle schede in basso - ma nessuna licenza vale in alto:
   sopra c'è la barra col marchio, e un gioiello che ci passa sotto è
   tagliato, non sovrapposto. Misurato prima di questa riga: con la
   variante (a) e la scheda tirata su, l'anello entrava 20 punti dentro
   la barra. Il tetto è il bordo alto del rettangolo contro il filo della
   banda, con dodici punti d'aria - e vince sempre sulla centratura,
   perché una centratura che taglia non è una centratura.
   Vale SOLO stretto. Largo il pezzo è già centrato dal suo conto e
   riverificato dal ciclo che lo rimpicciolisce se sborda: passare di qui
   cambierebbe un'inquadratura che va bene, e il desktop non deve
   muoversi di un pixel. */
/* E IL BANCO CI PASSA ANCHE LARGO. La riga sopra dice che il desktop non
   deve muoversi di un pixel, e per il PEZZO e per l'ESPOSITORE resta vera:
   lì l'inquadratura è già verificata dal ciclo che rimpicciolisce il
   soggetto quando sborda. Al banco quel ciclo non c'è e la misura lo
   dice: 1440x900, la fila cadeva al 35,4 per cento sopra il centro della
   banda, cioè un bancone appoggiato al soffitto della scena con mezzo
   schermo di pavimento vuoto sotto. Chi chiama passa `anche` a vero, e lo
   fa un posto solo (`vaiAlBanco`): un'eccezione che si legge dal punto in
   cui è chiesta, non una regola cambiata sotto a tutti. */
const ARIA_BARRA = 12;
function centraSullaBanda(box, d, mezzoV, scOra, piazza, anche){
  if((larga && !anche) || !box || box.isEmpty()) return;
  const a = areaUtile(), cB = (a.y0 + a.y1) / 2;
  /* quanti metri vale un punto di schermo sul piano del bersaglio */
  const perPunto = 2 * d * Math.tan(mezzoV) / innerHeight;
  let sc = scOra;
  for(let i = 0; i < 3; i++){
    const q = riquadroSulBersaglio(box);
    /* alzare lo scarto ABBASSA la macchina, quindi il soggetto sale: per
       portare il centro del rettangolo da `cS` a `cB` si aggiunge la
       differenza, convertita in metri */
    /* e non si chiama `mira`: la macchina ha già un `mira` globale, e un
       nome ripetuto dentro una funzione è come un numero scritto due
       volte */
    let voluto = sc + ((q.y0 + q.y1) / 2 - cB) * perPunto;
    const tetto = sc + (q.y0 - a.y0 - ARIA_BARRA) * perPunto;
    voluto = Math.min(voluto, tetto);
    if(Math.abs(voluto - sc) < perPunto * 0.5) break;
    sc = voluto;
    piazza(sc);
  }
  return sc;
}

/* dove cade UNA SCATOLA con la macchina ARRIVATA. Di serie è quella del
   pezzo; a livello 1 le si passa quella dell'espositore, che non è un
   oggetto da traversare ma tre misure in `userData` - dentro il gruppo c'è
   anche la posa stesa, che al banco non si vede e che allargherebbe la
   scatola di mezzo metro. È lo stesso
   attrezzo di `quadroDelPezzo`, che però nasce trecento righe più sotto
   e serve alla finestra della carta: qui ne serve una copia che esista
   già quando si apre il primo pezzo. */
const _camMisura = new THREE.PerspectiveCamera(), _spigolo = new THREE.Vector3();
function riquadroSulBersaglio(box){
  box = box || boxP;
  _camMisura.fov = camera.fov; _camMisura.aspect = camera.aspect;
  _camMisura.near = camera.near; _camMisura.far = camera.far;
  _camMisura.up.copy(camera.up);
  _camMisura.position.copy(occhioObiettivo);
  _camMisura.lookAt(miraObiettivo);
  _camMisura.updateMatrixWorld(true);
  _camMisura.updateProjectionMatrix();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(let i = 0; i < 8; i++){
    _spigolo.set(i & 1 ? box.max.x : box.min.x,
                 i & 2 ? box.max.y : box.min.y,
                 i & 4 ? box.max.z : box.min.z).project(_camMisura);
    const sx = (_spigolo.x * 0.5 + 0.5) * innerWidth;
    const sy = (-_spigolo.y * 0.5 + 0.5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx);
    y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  return {x0, y0, x1, y1};
}

/* ── L'INSIEME ATTORNO AL PEZZO ─────────────────────────────────
   Si clonano i modelli veri delle altre famiglie, si portano tutti alla
   stessa misura — un terzo del pezzo in mano — e si posano nella posizione
   che avrebbero sul corpo. La posizione è letta sugli assi della MACCHINA
   nel momento in cui si entra: così l'insieme nasce composto davanti a chi
   guarda, e poi resta fermo nello spazio, che è quello che lo rende un
   insieme vero e non un cartellone. */
let ancore = [], raggioQuadro = 0;
const _pr = new THREE.Vector3();
const _dx = new THREE.Vector3(), _dy = new THREE.Vector3(), _b3 = new THREE.Box3();

/* ── IL PROVINO DEL PEZZO ────────────────────────────────────────
   Le carte senza immagine sembravano etichette, non suggerimenti. La
   fotografia però non ce l'abbiamo come file: quello che abbiamo è il
   MODELLO, ed è meglio — si fotografa lui, una volta, e la carta mostra
   esattamente il pezzo che poi si ritrova nel cofanetto.
   Si disegna in una scena tutta sua, con lo stesso ambiente che riflette
   nella stanza: un metallo senza niente attorno da restituire esce nero, e
   questa lezione l'abbiamo già pagata sulla creola in selezione. */
const provinoDi = {};
let fotografo = null, luceProvino = null;

/* LA SCATOLA DI LUCE. Un metallo non ha colore suo: restituisce quello che
   ha intorno. Nel provino gli avevo messo attorno l'ambiente della vetrina
   — che è una scatola SCURA, ed è giusto che lo sia lì — e una creola
   d'argento veniva fuori come due anelli neri. Per fotografare un gioiello
   si costruisce il contrario: una scatola chiara, con due pareti più
   accese. È la stessa cosa che si fa in un banco di posa vero. */
function scatolaDiLuce(){
  if(luceProvino) return luceProvino;
  const st = new THREE.Scene();
  const cubo = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 4),
    new THREE.MeshBasicMaterial({color:0xB9B2A8, side:THREE.BackSide}));
  st.add(cubo);
  const faro = (c, i, x, y, z, sx, sy, sz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz),
      new THREE.MeshBasicMaterial({color:c}));
    m.material.color.multiplyScalar(i);
    m.position.set(x, y, z); st.add(m);
  };
  faro(0xFFF3E2, 3.0, -1.2, 1.5, 0.9, 1.8, 0.05, 1.8);
  faro(0xE6F0F6, 1.7,  1.5, 0.4, 0.5, 0.05, 1.6, 1.6);
  faro(0xFFFFFF, 1.2,  0.0, -1.4, 0.7, 2.4, 0.05, 2.0);
  luceProvino = pm.fromScene(st, 0.04).texture;
  return luceProvino;
}
function provino(fam, k, largo, alto){
  largo = largo || 288; alto = alto || 216;
  const chiave = fam + ":" + k + ":" + largo + "x" + alto;
  if(provinoDi[chiave]) return provinoDi[chiave];
  const o = (merci[fam] || [])[k];
  if(!o) return "";
  /* SI FOTOGRAFA COL DISEGNATORE PRINCIPALE, non con uno suo. Una texture
     d'ambiente appartiene al CONTESTO che l'ha generata: passata a un
     secondo renderer semplicemente non c'è, e il pezzo esce nero senza
     che niente segnali l'errore. Si restringe il disegnatore per un
     istante, si scatta, e lo si rimette com'era — il fotogramma dopo
     ridisegna la stanza e nessuno se ne accorge. */
  const st = new THREE.Scene();
  /* IL FONDO È GRIGIO MEDIO, ed è la regola che il progetto si è già
     dato per fotografare un pezzo: sul bianco un metallo lucido si brucia e
     il contorno sparisce, sul nero spariscono le parti in ombra, che sono
     metà del pezzo. Provato col fondo trasparente sul velluto della carta:
     una creola d'argento diventava invisibile. */
  st.background = new THREE.Color(0x6A625A);
  st.environment = scatolaDiLuce();
  st.environmentIntensity = 1.15;
  const c = o.clone(true);
  c.position.set(0,0,0); c.rotation.set(0,0,0); c.scale.set(1,1,1);
  c.traverse(m => { if(m.isMesh) m.visible = true; });
  st.add(c);
  st.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(c);
  const ce = b.getCenter(new THREE.Vector3());
  const r = Math.max(0.002, b.getSize(new THREE.Vector3()).length() / 2);
  /* si gira di faccia: il lato più sottile verso la macchina, se no una
     creola è un trattino anche in un provino */
  const dim = b.getSize(new THREE.Vector3());
  if(dim.x < dim.y && dim.x < dim.z) c.rotation.y = Math.PI / 2;
  else if(dim.y < dim.x && dim.y < dim.z) c.rotation.x = Math.PI / 2;
  st.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(c);
  b2.getCenter(ce);
  const cam = new THREE.PerspectiveCamera(26, largo/alto, 0.001, 20);
  cam.position.set(ce.x + r*0.35, ce.y + r*0.55, ce.z + r*4.4);
  cam.lookAt(ce);
  const l1 = new THREE.DirectionalLight(0xFFE9CE, 3.2); l1.position.set(-1, 1.4, 1.1);
  const l2 = new THREE.DirectionalLight(0xCFE2EC, 1.3); l2.position.set(1.2, .3, .6);
  st.add(l1, l2, new THREE.AmbientLight(0xffffff, 0.30));
  const misura = rend.getSize(new THREE.Vector2());
  const pr = rend.getPixelRatio();
  rend.setPixelRatio(2);
  rend.setSize(largo, alto, false);
  rend.render(st, cam);
  const url = rend.domElement.toDataURL("image/png");
  rend.setPixelRatio(pr);
  rend.setSize(misura.x, misura.y, false);
  st.clear();
  provinoDi[chiave] = url;
  return url;
}

/* ══════════════════════════════════════════════════════════════
   I PROVINI SI FANNO NEL TEMPO MORTO, NON SOTTO IL DITO

   `provino` restringe il disegnatore principale, scatta a 560x385 con il
   rapporto di pixel a 2 — cioè 1120x770 punti veri — e lo rimette
   com'era. È un fotogramma in più, pagato per intero, nel momento
   esatto in cui il dito tocca il pezzo: l'apertura della carta si porta
   dietro quel conto ogni volta che il pezzo non era già stato aperto.
   La cache c'era già e funziona; quello che mancava era CHIAMARLA
   PRIMA. Qui si riempie da sola, a macchina ferma: `requestIdleCallback`
   chiama solo quando il browser non ha altro da fare, si lavora una
   FAMIGLIA per volta e si cede il turno appena il tempo concesso
   finisce. Con un `timeout` di un secondo e due, così su un telefono
   che non sta mai fermo il lavoro non resta indietro per sempre.

   E alla fine di ogni turno si RIDIPINGE. Non è una precauzione: il
   provino si disegna sulla tela vera, e se il ciclo di disegno sta
   dormendo — succede sempre a scena ferma, e a scena ferma è proprio
   quando il tempo morto arriva — l'ultimo fotogramma rimasto a schermo
   sarebbe il provino, stirato sulla misura della finestra.
   ══════════════════════════════════════════════════════════════ */
let provinoOzio = null, geneProvini = 0;
function provinaAOzio(){
