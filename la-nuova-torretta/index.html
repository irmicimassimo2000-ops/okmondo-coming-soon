*{box-sizing:border-box}
body{margin:0;background:var(--n);color:var(--w);font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:500;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--w);outline-offset:2px}
.bolla button:focus-visible{outline-color:var(--n)}
.app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.top{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:6px;padding-top:4px}
#ind{width:44px;height:44px;margin-left:-12px;border:0;background:none;color:var(--w);display:grid;place-items:center;border-radius:50%}
#ind[disabled]{visibility:hidden}
#ind svg{width:22px;height:22px}
#dove{justify-self:end;color:var(--g);margin:0}
.pro{grid-column:1/-1;display:flex;gap:4px;padding-block:2px 6px}
.pro span{flex:1;height:3px;border-radius:2px;background:var(--l);transition:background .25s}
.pro span.on{background:var(--w)}
main{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:4px 10px}
.bolla{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;background:var(--r);border-radius:30px 30px 30px 10px;padding:12px}
[data-s=s1] .bolla,[data-s=s2] .bolla,[data-s=s3] .bolla{flex:1 1 0;min-height:150px}
.chi{display:flex;align-items:center;gap:6px;margin:0;text-transform:uppercase;min-height:32px}
.chi svg{width:16px;height:16px}
.chi .sw{margin-left:auto}
h1{margin:0 2px;font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.sw{display:flex;background:rgba(10,10,10,.78);border-radius:999px;padding:2px}
.sw button{min-height:32px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--w);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.sw button[aria-pressed="true"]{background:var(--w);color:var(--n)}
.mini{position:absolute;right:6px;bottom:6px;width:26%;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,255,255,.85);background:var(--n)}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage{flex:1;min-height:110px;align-self:center;aspect-ratio:1;max-width:100%;position:relative;border-radius:20px;overflow:hidden;background:var(--n)}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:fi .15s ease-out}
@keyframes fi{from{opacity:0}}
.risp{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:0 0 auto}
[data-s=s0] .risp{flex:1 1 0;min-height:0}
.vai{flex:none;min-height:52px;padding:0 22px;border-radius:999px;border:1px solid var(--w);background:var(--w);color:var(--n);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.tipi{display:flex;flex-direction:column;gap:8px;height:100%}
.infx{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:5px 5px 9px;border-radius:30px 30px 10px 30px;border:1.5px solid var(--w);background:var(--n2);color:var(--w);text-align:left;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.infx .im{position:relative;flex:1;min-height:0;border-radius:25px;overflow:hidden;background:var(--n)}
.infx .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.infx .et{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:999px;background:var(--w);color:var(--n);font-size:11px;font-weight:600}
.infx .tx{padding:0 9px}
.infx b{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.infx b span{font-family:"Geist Mono",ui-monospace,monospace;font-size:14px;font-weight:600}
.infx small{display:block;margin-top:2px;font-size:12px;line-height:1.25;color:var(--g)}
.due{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipo{display:flex;flex-direction:column;gap:4px;padding:4px 4px 8px;border-radius:24px 24px 10px 24px;border:1.5px solid var(--l);background:var(--n2);color:var(--w);text-align:left;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.tipo .im{position:relative;aspect-ratio:3/2;width:100%;border-radius:20px;overflow:hidden;background:var(--n)}
.tipo .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tipo b{display:block;padding:2px 6px 0;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tipo small{display:block;padding:0 6px;font-size:11.5px;line-height:1.25;color:var(--g)}
.tipo .tt{display:block}
.tipo .p{display:inline-block;align-self:flex-start;margin:5px 6px 0;padding:3px 9px;border-radius:999px;background:var(--w);color:var(--n);font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;font-weight:600}
.tipo:active,.infx:active,.vai:active,.sw button:active,.tile:active,.rw:active,.th:active,.inf:active{transform:scale(.98)}
.tiles{display:grid;gap:8px;align-items:start}
.tile{display:flex;flex-direction:column;gap:5px;min-height:0;padding:4px 4px 7px;border-radius:18px;border:1.5px solid var(--l);background:var(--n2);color:var(--w);text-align:left;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s}
.tile .z{position:relative;width:100%;border-radius:14px;overflow:hidden;background:var(--n);aspect-ratio:var(--ar)}
.tile .z img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fi .15s ease-out}

document.documentElement.lang='it';
var VIEWS=[['sera','Sera'],['giorno','Giorno']];
var ORD=Object.keys(TIPI),ALTRI=ORD.filter(function(t){return t!==S.punta});
var SC='s0',CFG={},STEP=0,RIT=false,VIEW='sera',HIST=[];
// un passo è attivo se la sua condizione «se» (passo -> valore) è vera nella configurazione
function attivo(c,k){var se=RIF[k].se;if(!se)return true;for(var x in se)if(c[x]!==se[x])return false;return true}
function steps(c){return c.tipo?TIPI[c.tipo].passi.filter(function(k){return attivo(c,k)}):[]}
function conf(t){var c={tipo:t};TIPI[t].passi.forEach(function(k){c[k]=RIF[k].o[0].k});return c}
function con(c,k,v){var t={},x;for(x in c)t[x]=c[x];t[k]=v;return t}
// la configurazione con i passi DOPO k riportati al predefinito (prezzo e immagine «da» di un'opzione)
function finoA(c,k){var t=con(c,k,c[k]),P=TIPI[c.tipo].passi,i=P.indexOf(k);P.slice(i+1).forEach(function(q){t[q]=RIF[q].o[0].k});return t}
function opt(k,v){return RIF[k].o.filter(function(o){return o.k===v})[0]}
function rid(c){
 var T=TIPI[c.tipo],i,x,ok;
 for(i=0;i<(T.rid_se||[]).length;i++){ok=true;for(x in T.rid_se[i].se)if(c[x]!==T.rid_se[i].se[x])ok=false;if(ok)return T.rid_se[i].rid}
 return T.rid.replace(/\{(\w+)\}/g,function(m,k){return c[k]})}
// vista di apertura: un'opzione può chiedere di aprirsi su Giorno (es. lo specchio: è lì che si vede)
function vdef(){
 if(!CFG.tipo)return 'sera';var P=steps(CFG),i,o;
 for(i=0;i<P.length;i++){o=opt(P[i],CFG[P[i]]);if(o.vista==='giorno'&&(SC==='s3'||((SC==='s1'||SC==='s2')&&P[STEP]===P[i])))return 'giorno'}
 return 'sera'}
function haVista(k){return RIF[k].o.some(function(o){return !!o.vista})}
// PREZZO: letto alla build dalla scheda. «somma» = base + delta di ogni passo attivo; «tabella» = prezzo della voce (per id del render).
// Quando arriverà il motore di preventivi, sostituire solo questa funzione: stessa firma prezzo(config) -> {p,st}.
var PES={ok:0,stima:1,dq:2};
function prezzo(c){
 var Z=PRZ[c.tipo],parts;
 if(Z.modello==='somma')parts=[Z.base].concat(steps(c).map(function(k){return Z.passi[k][c[k]]}));
 else parts=[Z.voci[rid(c)]||[null,'dq']];
 var p=0,st='ok';parts.forEach(function(x){if(x[0]===null)st='dq';else p+=x[0];if(PES[x[1]]>PES[st])st=x[1]});
 return {p:st==='dq'?null:p,st:st}}
function ptxt(r){return r.p===null?'da quotare':r.p+' €'}
function nota(r){return r.st==='stima'?'stima · sola insegna':'sola insegna'}
function optPrezzo(c,k,v){
 var Z=PRZ[c.tipo];
 if(Z.modello==='somma'){var d=Z.passi[k][v];if(d[0]===null)return 'da quotare';return d[0]===0?'compreso':'+ '+d[0]+' €'}
 return ptxt(prezzo(finoA(con(c,k,v),k)))}
function daPrezzo(t){
 var c=conf(t),P=steps(c);if(!P.length)return prezzo(c).p;
 var m=null;RIF[P[0]].o.forEach(function(o){var p=prezzo(con(c,P[0],o.k)).p;if(p!==null&&(m===null||p<m))m=p});return m}
function da(t){var p=daPrezzo(t);return p===null?'da quotare':p+' €'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function sw(cur,lab){return '<div class="sw" role="group" aria-label="'+lab+'">'+VIEWS.map(function(v){return '<button type="button" data-v="'+v[0]+'" aria-pressed="'+(cur===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>'}
function head(extra){return '<div class="mono chi"><svg aria-hidden="true"><use href="#disco"/></svg>OK.3D'+(extra||'')+'</div>'}
function nomeTipo(t){return TIPI[t].n.split(' ·')[0]}
function testo(){
 var p=prezzo(CFG),r=[S.nome+', '+S.oggetto+'. La mia scelta:','- Insegna: '+nomeTipo(CFG.tipo)];
 steps(CFG).forEach(function(k){r.push('- '+RIF[k].n+': '+opt(k,CFG[k]).n)});
 r.push('Prezzo indicativo: '+ptxt(p)+(p.st==='stima'?' (stima, da confermare)':'')+', sola insegna, IVA 0');
 return r.join('\n');}
function fillBar(price,sub,btn){
 $('.bar').innerHTML='<div><p class="pz">'+price+'</p><p class="mono">'+sub+'</p></div>'+(btn?'<button type="button" class="vai" id="vai">'+btn+'</button>':'');}
function segmenti(){
 // cinque segmenti sempre: la barra non cambia lunghezza, si riempie in proporzione
 var tot=CFG.tipo?2+steps(CFG).length:2,idx=SC==='s0'?0:SC==='s3'?tot-1:1+STEP;
 return [5,tot>1?Math.round(idx/(tot-1)*4):0]}
function render(){
 var app=$('.app');app.setAttribute('data-s',SC);
 var B=$('#bolla'),R=$('#risp'),dove='';
 $('#ind').disabled=SC==='s0';
 if(SC==='s0'){
  dove=S.nome+' · scegli';
  B.innerHTML=head()+'<h1>'+esc(S.domanda)+'</h1>';
  R.removeAttribute('role');R.removeAttribute('aria-label');
  function lo(k,t){return '<button type="button" class="tipo" data-t="'+k+'"><span class="im"><img src="'+BIV[k]+'" alt="'+esc(t.n)+', visto di lato" width="320" height="214"></span><span class="tt"><b>'+esc(t.n)+'</b><small>'+esc(t.breve||'')+'</small><span class="p">da '+da(k)+'</span></span></button>'}
  var h='<div class="tipi">';
  if(S.punta){var T=TIPI[S.punta];h+='<button type="button" class="infx" data-t="'+S.punta+'"><span class="im"><img src="'+BIV[S.punta]+'" alt="'+esc(T.alt||T.n)+'" width="640" height="640"><span class="et mono">'+esc(S.etichetta)+'</span></span><span class="tx"><b>'+esc(nomeTipo(S.punta))+'<span>'+da(S.punta)+'</span></b><small>'+esc(T.d)+'</small></span></button>'}
  h+='<div class="due">'+ALTRI.map(function(k){return lo(k,TIPI[k])}).join('')+'</div></div>';
  R.innerHTML=h;
  var m=null;ALTRI.forEach(function(k){var p=daPrezzo(k);if(p!==null&&(m===null||p<m))m=p});
  fillBar(m===null?'da quotare':'da '+m+' €','stima · sola insegna','');
 }else if(SC==='s1'||SC==='s2'){
  var P=steps(CFG),k=P[STEP],d=RIF[k],p=prezzo(CFG);
  dove=S.nome+' · '+d.n.toLowerCase()+(P.length>1?' '+(STEP+1)+' di '+P.length:'');
  var sel=opt(k,CFG[k]);
  if(SC==='s1'){
   B.innerHTML=head(sw(VIEW,'Vista'))+'<h1>'+esc(d.q)+'</h1><div class="stage"><img src="'+IMG[rid(CFG)][VIEW]+'" alt="La tua insegna, '+(VIEW==='sera'?'di sera':'di giorno')+'" width="440" height="440"></div>';
   R.setAttribute('role','radiogroup');R.setAttribute('aria-label',d.q);
   var h,n=d.o.length;
   if(d.lay==='rows')h='<div class="rows">'+d.o.map(function(o){return '<button type="button" class="rw" role="radio" aria-checked="'+(CFG[k]===o.k)+'" data-k="'+o.k+'"><span class="z"><img src="'+ZM[k][o.k]+'" alt="Primo piano: '+esc(o.n)+'" width="180" height="180"></span><span><b>'+esc(o.n)+'</b><small>'+esc(o.d)+'</small><span class="p">'+optPrezzo(CFG,k,o.k)+'</span></span></button>'}).join('')+'</div>';
   else h='<div class="tiles" style="grid-template-columns:repeat('+(n>3?4:2)+',minmax(0,1fr))">'+d.o.map(function(o){return '<button type="button" class="tile'+(d.cls?' '+d.cls:'')+'" role="radio" aria-checked="'+(CFG[k]===o.k)+'" data-k="'+o.k+'"><span class="z" style="--ar:'+d.ar+';--ard:'+(d.ard||d.ar)+'"><img src="'+ZM[k][o.k]+'" alt="Primo piano: '+esc(o.n)+'" width="180" height="150"></span><b>'+esc(o.n)+'</b><span class="p">'+optPrezzo(CFG,k,o.k)+'</span></button>'}).join('')+'</div>';
   // una sola frase: la nota se c'è, altrimenti la descrizione (nelle righe desktop la descrizione è già nella riga)
   h+='<p class="mono nota'+((!sel.nota&&d.lay==='rows')?' rd':'')+'" role="status">'+esc(sel.nota||sel.d)+'</p>';
   R.innerHTML=h;
  }else{
   var r0=rid(finoA(CFG,k)),big=VIEW==='sera'?FM[r0]:IMG[r0].giorno;
   B.innerHTML=head(sw(VIEW,'Vista'))+'<h1>'+esc(d.q)+'</h1><div class="stage"><img src="'+big+'" alt="'+esc(sel.n)+(VIEW==='sera'?', di sera':', di giorno')+'" width="400" height="400">'+(VIEW==='sera'?'<span class="mini"><img src="'+SM[r0].sera+'" alt="" width="60" height="60"></span>':'')+'</div><p class="cap"><b>'+esc(sel.n)+'</b><span>'+esc(sel.d)+'</span></p>';
   R.setAttribute('role','radiogroup');R.setAttribute('aria-label',d.q);
   R.innerHTML='<div class="strip">'+d.o.map(function(o){return '<button type="button" class="th" role="radio" aria-checked="'+(CFG[k]===o.k)+'" data-k="'+o.k+'" aria-label="'+esc(o.n)+', '+optPrezzo(CFG,k,o.k)+'"><span class="z"><img src="'+SM[rid(finoA(con(CFG,k,o.k),k))][VIEW]+'" alt="" width="62" height="62"></span><b>'+esc(o.s||o.n)+'</b><span class="p">'+optPrezzo(CFG,k,o.k)+'</span></button>'}).join('')+'</div>';
  }
  fillBar(ptxt(p),nota(p),RIT?'Fatto':STEP+1<P.length?'Avanti':'Riepilogo');
 }else{
  dove=S.nome+' · riepilogo';var P=steps(CFG),p=prezzo(CFG);
  // un'opzione «mini» (dettaglio che non si vede da davanti) porta il suo primo piano nel riepilogo
  var m2='';P.forEach(function(k){var o=opt(k,CFG[k]);if(o.mini&&!m2)m2='<span class="mini" style="width:30%"><img src="'+ZM[k][o.k]+'" style="object-position:'+(RIF[k].pos||'50% 50%')+'" alt="Primo piano del dettaglio scelto" width="120" height="120"></span>'});
  B.innerHTML=head(sw(VIEW,'Vista'))+'<h1>La tua scelta</h1><div class="stage"><img src="'+IMG[rid(CFG)][VIEW]+'" alt="La tua insegna, '+(VIEW==='sera'?'di sera':'di giorno')+'" width="440" height="440">'+m2+'</div>';
  var h='<div class="riga"><span class="mono">Insegna</span><b>'+esc(nomeTipo(CFG.tipo))+'</b><button type="button" data-c="tipo">Cambia</button></div>';
  P.forEach(function(k){h+='<div class="riga"><span class="mono">'+esc(RIF[k].n)+'</span><b>'+esc(opt(k,CFG[k]).n)+'</b><button type="button" data-c="'+k+'">Cambia</button></div>'});
  if(!P.length)h+='<p class="cosa">'+esc(TIPI[CFG.tipo].d)+'</p>';
  h+='<p class="mono dq"><b>Prezzo '+(p.st==='dq'?'da quotare':ptxt(p)+(p.st==='stima'?' · stima da confermare':''))+'</b> · '+esc(S.compreso)+' '+esc(S.non_compreso)+'</p><p class="mono dq">WhatsApp '+esc(S.whatsapp)+'</p><p class="mono st" id="st" role="status"></p>';
  R.removeAttribute('role');R.removeAttribute('aria-label');R.innerHTML=h;
  fillBar(ptxt(p),nota(p),'Copia la scelta');
 }
 $('#dove').textContent=dove;
 var sg=segmenti();var h2='';for(var j=0;j<sg[0];j++)h2+='<span'+(j<=sg[1]?' class="on"':'')+'></span>';$('#pro').innerHTML=h2;
}
function nav(sc,step,rit){SC=sc;if(step!==undefined)STEP=step;RIT=!!rit;VIEW=vdef();render()}
function dopo(P,st){return RIF[P[st]].lay==='caro'?'s2':'s1'}
function scelta(t){if(CFG.tipo!==t)CFG=conf(t);var P=steps(CFG);STEP=0;if(!P.length)nav('s3',0);else nav(dopo(P,0),0)}
function back(){
 var P=steps(CFG);
 if(SC==='s3'){if(P.length)nav(dopo(P,P.length-1),P.length-1);else nav('s0')}
 else if(RIT)nav('s3');
 else if(STEP>0)nav(dopo(P,STEP-1),STEP-1);
 else nav('s0')}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.id==='ind'){back();return}
 if(b.closest('.sw')){VIEW=b.dataset.v;render();return}
 if(SC==='s0'&&b.dataset.t){scelta(b.dataset.t);return}
 if((SC==='s1'||SC==='s2')&&b.dataset.k){var k=steps(CFG)[STEP];CFG=con(CFG,k,b.dataset.k);if(haVista(k))VIEW=vdef();render();return}
 if(SC==='s3'&&b.dataset.c){if(b.dataset.c==='tipo'){nav('s0');return}
  var i=steps(CFG).indexOf(b.dataset.c);nav(dopo(steps(CFG),i),i,true);return}
 if(b.id==='vai'){
  if(SC==='s1'||SC==='s2'){var P=steps(CFG);if(RIT||STEP+1>=P.length)nav('s3');else nav(dopo(P,STEP+1),STEP+1);return}
  if(SC==='s3'){
   var tx=testo(),msg='Copiato · incollalo su WhatsApp al '+S.whatsapp;
   var fine=function(m,ok){var s=$('#st');if(s)s.textContent=m;if(ok){var v=$('#vai');if(v){v.textContent='Copiato';setTimeout(function(){var w=$('#vai');if(w&&SC==='s3')w.textContent='Copia la scelta'},2500)}}};
   var fb=function(){var a=document.createElement('textarea');a.value=tx;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var o=false;try{o=document.execCommand('copy')}catch(x){}document.body.removeChild(a);fine(o?msg:'Non riesco a copiare: scrivici al '+S.whatsapp+'.',o)};
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){fine(msg,true)},fb);else fb();
  }}
});
render();
// tutte le configurazioni di un tipo (solo passi attivi)
function tutte(t){var out=[],seen={};(function gira(c,i){var P=TIPI[t].passi;if(i>=P.length){var s=steps(c).map(function(k){return c[k]}).join('|');if(!seen[s]){seen[s]=1;out.push(c)}return}
 if(!attivo(c,P[i])){gira(c,i+1);return}RIF[P[i]].o.forEach(function(o){gira(con(c,P[i],o.k),i+1)})})(conf(t),0);return out}
// self-test per la pagina di misura: ogni schermata, ogni opzione di ogni passo, ogni riepilogo; overflow verticale e orizzontale, CTA fuori schermo.
// prezzi: l'elenco di tutte le configurazioni col loro prezzo (per confrontare due build)
if(location.hash==='#test'&&window.parent!==window){(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){
 var out={w:innerWidth,h:innerHeight,n:0,s0:[0,0,9999,0],s1:[0,0,9999,0],s2:[0,0,9999,0],s3:[0,0,9999,0],err:0};
 // r = [overflow verticale, CTA fuori, palco minimo, overflow orizzontale]
 function mis(){var m=$('main'),r=out[SC],sg=$('.stage,.tipo .im,.infx .im'),hh=sg?Math.round(sg.getBoundingClientRect().height):0;out.n++;
  if(/undefined/.test($('.app').innerHTML))out.err++;
  if(m.scrollHeight>m.clientHeight+1)r[0]++;if(document.documentElement.scrollHeight>innerHeight+1)r[0]++;
  if(document.documentElement.scrollWidth>innerWidth||document.body.scrollWidth>innerWidth||m.scrollWidth>m.clientWidth+1)r[3]++;
  [].forEach.call(document.querySelectorAll('.bar button'),function(v){var q=v.getBoundingClientRect();if(q.bottom>innerHeight+1||q.right>innerWidth+1||q.top<0||q.left<0)r[1]++});
  var bar=$('.bar').getBoundingClientRect();if(bar.bottom>innerHeight+1)r[1]++;
  if(sg&&hh<r[2])r[2]=hh}
 function show(s,c,st,v,rit){SC=s;CFG=c;STEP=st||0;RIT=!!rit;VIEW=v||vdef();HIST=[];render();mis()}
 show('s0',{});
 ORD.forEach(function(t){
  var c=conf(t);TIPI[t].passi.forEach(function(k){RIF[k].o.forEach(function(o){
   var c2=con(c,k,o.k);if(!attivo(c2,k))return;var s=steps(c2).indexOf(k),sc=dopo(steps(c2),s);show(sc,c2,s,'sera');show(sc,c2,s,'giorno')})});
  tutte(t).forEach(function(c3){show('s3',c3,0,'sera');show('s3',c3,0,'giorno')})});
 SC='s0';CFG={};render();
 parent.postMessage(JSON.stringify(out),'*');
 if(innerWidth===375&&innerHeight===812){var pz={};ORD.forEach(function(t){tutte(t).forEach(function(c){pz[rid(c)]=prezzo(c).p})});parent.postMessage('PREZZI '+JSON.stringify(pz),'*')}
 })}
})();
</script>
